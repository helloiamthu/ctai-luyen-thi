{"w":"mission","pos":"n","vi":"sứ mệnh, nhiệm vụ","ex":"The hospital's mission is to provide quality care to everyone in the community.","exvi":"Sứ mệnh của bệnh viện là mang lại dịch vụ chăm sóc chất lượng cho mọi người trong cộng đồng."},{"w":"permit","pos":"v, n","vi":"cho phép; giấy phép","ex":"Only two visitors at a time are permitted in the intensive care unit.","exvi":"Mỗi lần chỉ cho phép hai người thăm vào khu chăm sóc đặc biệt."},{"w":"pertinent","pos":"adj","vi":"có liên quan, thích đáng","ex":"Please bring all pertinent medical documents with you on the day of admission.","exvi":"Vui lòng mang theo mọi giấy tờ y tế có liên quan vào ngày nhập viện."},{"w":"procedure","pos":"n","vi":"thủ thuật; quy trình","ex":"The surgeon explained the procedure and answered all of the family's questions.","exvi":"Bác sĩ phẫu thuật đã giải thích về thủ thuật và trả lời mọi câu hỏi của gia đình."},{"w":"result","pos":"n","vi":"kết quả","ex":"The laboratory will send the test results to your doctor within two days.","exvi":"Phòng xét nghiệm sẽ gửi kết quả cho bác sĩ của bạn trong vòng hai ngày."},{"w":"statement","pos":"n","vi":"bản kê chi phí, bản sao kê","ex":"The hospital mailed a detailed statement listing every charge from her stay.","exvi":"Bệnh viện đã gửi qua bưu điện bản kê chi tiết liệt kê mọi khoản phí trong đợt nằm viện của cô ấy."},{"w":"usually","pos":"adv","vi":"thường thường, thông thường","ex":"Patients usually go home the day after this type of operation.","exvi":"Bệnh nhân thường về nhà một ngày sau loại phẫu thuật này."}]},{"n":50,"title":{"en":"Pharmacy","vi":"Nhà thuốc"},"words":[{"w":"consult","pos":"v","vi":"hỏi ý kiến, tham khảo","ex":"Consult your pharmacist before taking this medicine with other drugs.","exvi":"Hãy hỏi ý kiến dược sĩ trước khi dùng thuốc này cùng các thuốc khác."},{"w":"control","pos":"v, n","vi":"kiểm soát, điều khiển","ex":"This medication helps control blood sugar levels when taken with meals.","exvi":"Thuốc này giúp kiểm soát lượng đường trong máu khi uống cùng bữa ăn."},{"w":"convenient","pos":"adj","vi":"thuận tiện, tiện lợi","ex":"The pharmacy's late opening hours are convenient for people who work all day.","exvi":"Giờ mở cửa muộn của nhà thuốc rất thuận tiện cho những người đi làm cả ngày."},{"w":"detect","pos":"v","vi":"phát hiện, dò ra","ex":"The pharmacist detected an error in the dosage written on the prescription.","exvi":"Dược sĩ đã phát hiện một lỗi về liều lượng ghi trên đơn thuốc."},{"w":"factor","pos":"n","vi":"yếu tố, nhân tố","ex":"Age and weight are important factors in deciding the correct dose.","exvi":"Tuổi và cân nặng là những yếu tố quan trọng để quyết định liều dùng đúng."},{"w":"interaction","pos":"n","vi":"sự tương tác (thuốc)","ex":"The label warns about possible interactions between this drug and alcohol.","exvi":"Nhãn thuốc cảnh báo về khả năng tương tác giữa thuốc này và rượu."},{"w":"limit","pos":"n, v","vi":"giới hạn; hạn chế","ex":"There is a limit of two boxes per customer for this cold medicine.","exvi":"Mỗi khách hàng chỉ được mua tối đa hai hộp thuốc cảm này."},{"w":"monitor","pos":"v","vi":"theo dõi, giám sát","ex":"The doctor will monitor your progress closely during the first month of treatment.","exvi":"Bác sĩ sẽ theo dõi sát tiến triển của bạn trong tháng điều trị đầu tiên."},{"w":"potential","pos":"adj, n","vi":"tiềm ẩn, có thể xảy ra","ex":"The pharmacist explained the potential side effects of the new prescription.","exvi":"Dược sĩ đã giải thích các tác dụng phụ tiềm ẩn của đơn thuốc mới."},{"w":"sample","pos":"n","vi":"mẫu thử, hàng mẫu","ex":"The clinic gave her a free sample of the cream to try at home.","exvi":"Phòng khám tặng cô ấy một mẫu kem dùng thử miễn phí để thử tại nhà."},{"w":"sense","pos":"n","vi":"sự hợp lý; cảm giác","ex":"It makes sense to buy a three-month supply if you take the medicine daily.","exvi":"Mua đủ thuốc dùng trong ba tháng là hợp lý nếu bạn uống thuốc hằng ngày."},{"w":"volunteer","pos":"n, v","vi":"tình nguyện viên; tình nguyện","ex":"Several volunteers agreed to take part in the trial of the new vaccine.","exvi":"Một số tình nguyện viên đã đồng ý tham gia đợt thử nghiệm vắc-xin mới."}]}],"site":{"code":"TOEIC","name":"Từ vựng 600 & phim ngắn","key":"toeic-v1","views":["toeic","phim"],"migrate":{"from":"ctai-v1","fields":["toeic","film","lang"]}}}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=(s,r=document)=>r.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SITE=D.site||{code:'CT-AI',name:'Luyện thi',key:'ctai-v1',views:['home','hoc','nghe','thuatngu','luyentap','game','thi']};
const KEY=SITE.key;
document.getElementById('scode').textContent=SITE.code;document.getElementById('sname').textContent=SITE.name;
let S={lang:'both',stats:{},hist:[],read:{},exam:null,game:{},toeic:{known:{},best:{}},film:{seen:{},notes:{},mine:[]},learn:{pos:{},rate:0.9,sub:'both',voice:''}};
try{const raw=localStorage.getItem(KEY);if(raw)Object.assign(S,JSON.parse(raw));else if(SITE.migrate){const o=JSON.parse(localStorage.getItem(SITE.migrate.from)||'{}');SITE.migrate.fields.forEach(f=>{if(o[f])S[f]=o[f]})}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const CH=D.chapters.filter(c=>c.n>=1&&c.n<=7);
const chOf=q=>+q.lo.replace('AI-','').split('.')[0];
const QS=D.questions, QBY=Object.fromEntries(QS.map(q=>[q.id,q]));
const isOff=q=>/^[QA]\d/.test(q.id);
// text helpers: plain = needs escaping (syllabus), html = trusted markup (questions)
function two(o,html,tag='div'){const f=x=>html?x:esc(x).replace(/\n/g,'<br>');const en=o.en||'',vi=o.vi||'';
  if(S.lang==='en'||!vi||vi===en)return `<${tag}>${f(en)}</${tag}>`;
  if(S.lang==='vi')return `<${tag}>${f(vi)}</${tag}>`;
  return `<${tag}>${f(en)}</${tag}><${tag} class="vi">${f(vi)}</${tag}>`}
const one=o=>S.lang==='en'?o.en:(o.vi||o.en);
const fig=(h,src)=>{let i=0;const a=src||[];return h.replace(/\[\[FIGURE\]\]/g,()=>{const u=i<a.length?a[i]:'';i++;return u?`<img src="${u}" alt="Hình minh hoạ của câu hỏi">`:''})};
const fmt=s=>{s=Math.max(0,s|0);return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const sameSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
const loText=lo=>D.los[lo]?one(D.los[lo]):'';

const ALLV=[['home','Tổng quan'],['hoc','Tài liệu song ngữ'],['nghe','Học tiếng Anh'],['thuatngu','Thuật ngữ'],['gloss','Glossary ISTQB'],['luyentap','Luyện tập'],['game','Trò chơi'],['thi','Thi thử'],['toeic','TOEIC 600'],['phim','Phim ngắn']];
const ICON={"home": "<path d=\"M3 11l9-7 9 7\"/><path d=\"M5 10v10h14V10\"/>", "hoc": "<path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z\"/><path d=\"M4 19V5\"/>", "nghe": "<path d=\"M4 14v-2a8 8 0 0 1 16 0v2\"/><rect x=\"3\" y=\"14\" width=\"4\" height=\"6\" rx=\"1\"/><rect x=\"17\" y=\"14\" width=\"4\" height=\"6\" rx=\"1\"/>", "gloss": "<circle cx=\"11\" cy=\"11\" r=\"6\"/><path d=\"M20 20l-4.5-4.5\"/>", "thuatngu": "<path d=\"M4 6h16M4 12h10M4 18h7\"/>", "luyentap": "<path d=\"M9 11l3 3 8-8\"/><path d=\"M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11\"/>", "game": "<rect x=\"2\" y=\"7\" width=\"20\" height=\"11\" rx=\"4\"/><path d=\"M7 11v3M5.5 12.5h3\"/><circle cx=\"16\" cy=\"12\" r=\"1\"/><circle cx=\"18\" cy=\"14\" r=\"1\"/>", "thi": "<circle cx=\"12\" cy=\"13\" r=\"8\"/><path d=\"M12 9v4l2 2M9 2h6\"/>", "toeic": "<path d=\"M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z\"/><path d=\"M8 9h8M8 13h6\"/>", "phim": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M10 9l5 3-5 3z\"/>"};
const VIEWS=SITE.views.map(k=>ALLV.find(v=>v[0]===k)).filter(Boolean);
document.title=SITE.code+' · '+SITE.name;
if(VIEWS.length<2)document.body.classList.add('solo');
let view=VIEWS[0][0], sub={}, tick=null;
function nav(){ $('#nav').innerHTML=VIEWS.map(([k,l])=>`<a href="#${k}" ${k===view?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]||''}</svg>${l}</a>`).join('');
  document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===S.lang)) }
$('#lang').onclick=e=>{const l=e.target.dataset.l;if(l){S.lang=l;save();render()}};
window.addEventListener('hashchange',()=>{route();render()});
function route(){const h=location.hash.slice(1);view=VIEWS.some(v=>v[0]===h)?h:VIEWS[0][0]}
function render(){nav();clearInterval(tick);stopTalk();app.onclick=app.onchange=app.onkeydown=null;app.className=((view==='thi'&&S.exam&&!S.exam.done)||(view==='hoc'&&S.lang==='both'))?'wide':'';document.body.dataset.view=view;({home,hoc,nghe,gloss,thuatngu,luyentap,game,thi,toeic,phim})[view]()}
function go(v){if(location.hash.slice(1)===v){view=v;render()}else location.hash=v;window.scrollTo(0,0)}

/* ---------- Tổng quan ---------- */
function mastery(n){const qs=QS.filter(q=>chOf(q)===n);const ok=qs.filter(q=>S.stats[q.id]?.last===1).length;return [ok,qs.length]}
function home(){
  const off=QS.filter(q=>/^Q\d/.test(q.id)), pts=off.reduce((s,q)=>s+q.points,0);
  const done=Object.keys(S.stats).length;
  app.innerHTML=`<div class="hero"><span class="eyebrow">ISTQB® Specialist · v2.0</span><h1>Ôn thi Certified Tester AI Testing (CT-AI)</h1>
  <p class="muted">Đọc toàn bộ giáo trình song ngữ, nghe giáo trình bằng tiếng Anh, tra thuật ngữ, luyện câu hỏi, chơi trò chơi theo chương và thi thử có tính giờ. Tiến độ được lưu trên trình duyệt này.</p></div>
  <div class="panel stack"><h3>Cấu trúc đề mẫu</h3><div class="facts">
    <div class="fact"><b>${off.length}</b>câu hỏi trắc nghiệm</div><div class="fact"><b>${pts}</b>điểm tối đa (đề mẫu A)</div>
    <div class="fact"><b>65%</b>điểm đạt, tức ${Math.ceil(pts*.65)}/${pts}</div><div class="fact"><b>60′</b>làm bài (75′ nếu không thi bằng tiếng mẹ đẻ)</div></div>
    <p class="small muted">Điểm đạt và thời gian là quy định chung của ISTQB cho kỳ thi 40 câu; hãy xác nhận lại với đơn vị tổ chức thi của bạn. Các chương Giới thiệu, bài thực hành (HO), tài liệu tham khảo và phụ lục không nằm trong phạm vi thi.</p>
    <div class="row"><button class="btn pri" data-go="thi">Thi thử</button><button class="btn" data-go="luyentap">Luyện tập theo chương</button><button class="btn" data-go="game">Chơi để học</button><button class="btn" data-go="hoc">Đọc tài liệu</button><button class="btn" data-go="nghe">Học tiếng Anh</button></div></div>
  <div class="panel"><h3>Tiến độ theo chương</h3><p class="small muted">Tỷ lệ câu hỏi bạn trả lời đúng ở lần làm gần nhất. Đã làm ${done}/${QS.length} câu trong ngân hàng.</p>
    ${CH.map(c=>{const [ok,t]=mastery(c.n);return `<div class="chrow"><div><b>${esc(one(c.title))}</b><div class="small muted">${c.minutes} phút học · ${S.read[c.n]?'đã đọc':'chưa đọc'}</div></div>
      <div class="row"><div class="meter"><i style="width:${t?ok/t*100:0}%"></i></div><span class="mono small">${ok}/${t}</span></div>
      <button class="btn small" data-prac="${c.n}">Luyện</button></div>`}).join('')}</div>
  <div class="panel stack"><h3>Lịch sử thi thử</h3>${S.hist.length?`<div class="tw"><table><tr><th>Ngày</th><th>Đề</th><th>Điểm</th><th>Kết quả</th><th>Thời gian</th></tr>${S.hist.slice().reverse().map(h=>`<tr><td>${esc(h.date)}</td><td>${esc(h.name)}</td><td class="mono">${h.score}/${h.total} (${Math.round(h.score/h.total*100)}%)</td><td><span class="chip ${h.pass?'ok':'bad'}">${h.pass?'ĐẠT':'CHƯA ĐẠT'}</span></td><td class="mono">${fmt(h.used)}</td></tr>`).join('')}</table></div>`:'<p class="muted">Chưa có lần thi thử nào.</p>'}
    <div id="rst"><button class="btn small" id="reset">Xoá toàn bộ tiến độ</button></div></div>
  <p class="small muted">Nguồn: ISTQB® CT-AI Syllabus v2.0 và Sample Exam set A v2.2, © International Software Testing Qualifications Board. Bản dịch tiếng Việt không chính thức. ${QS.filter(q=>!isOff(q)).length} câu "bổ sung" do AI soạn theo giáo trình, không phải câu hỏi của ISTQB.</p>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.go)go(b.dataset.go);
    if(b.dataset.prac){sub.prac={ch:[+b.dataset.prac]};go('luyentap')}
    if(b.id==='reset')$('#rst').innerHTML='<span>Xoá hết thống kê và lịch sử?</span> <button class="btn small" id="yes">Xoá</button> <button class="btn small" id="no">Giữ lại</button>';
    if(b.id==='yes'){S.stats={};S.hist=[];S.read={};S.exam=null;S.game={};S.toeic={known:{},best:{}};save();render()}
    if(b.id==='no')render()};
}

/* ---------- Học ---------- */
function block(b){
  if(b.type==='figure')return b.img?`<img src="${b.img}" alt="${esc(b.en||'Hình minh hoạ')}">`:'';
  if(b.type==='table')return `<div class="tw"><table>${b.rows.map((r,i)=>'<tr>'+r.map(c=>{const t=b.header&&i===0?'th':'td';return `<${t}>${two(c)}</${t}>`}).join('')+'</tr>').join('')}</table></div>`;
  const tag={h1:'h2',h2:'h3',h3:'h4',h4:'h5'}[b.type];
  if(tag)return `<div class="pair hd">${two(b,false,tag)}</div>`;
  if(b.type==='toc'){const r=b.ref?'  ·  '+b.ref:'';return `<div class="pair blk toc l${b.level||0}">${two({en:b.en+r,vi:b.vi+r})}</div>`}
  if(b.type==='li')return `<div class="pair blk li l${b.level||1}">${two(b)}</div>`;
  return `<div class="pair blk">${two(b)}</div>`}
function hoc(){
  const all=D.chapters, cur=all.find(c=>c.id===sub.ch)||all[0];sub.ch=cur.id;const i=all.indexOf(cur);
  app.innerHTML=`<div class="stack"><h1>Tài liệu song ngữ</h1><p class="muted">Toàn bộ ISTQB® CT-AI Syllabus v2.0 (93 trang): nguyên văn tiếng Anh và bản dịch tiếng Việt, chia theo phần.</p></div>
  <div class="row"><label for="chsel" class="muted">Phần</label><select id="chsel">${all.map(c=>`<option value="${c.id}" ${c===cur?'selected':''}>${esc(one(c.title))}</option>`).join('')}</select></div>
  <div class="panel doc">${cur.blocks.map(block).join('')}</div>
  <div class="row">${i>0?'<button class="btn" id="prev">← Phần trước</button>':''}
   ${cur.n>=1&&cur.n<=7?`<button class="btn" id="read">${S.read[cur.n]?'Đã đọc ✓':'Đánh dấu đã đọc'}</button><button class="btn pri" id="prac">Luyện câu hỏi chương này</button>`:''}
   ${i<all.length-1?'<button class="btn" id="next">Phần sau →</button>':''}</div>`;
  $('#chsel').onchange=e=>{sub.ch=e.target.value;render();window.scrollTo(0,0)};
  app.onclick=e=>{const id=e.target.id;
    if(id==='prev'||id==='next'){sub.ch=all[i+(id==='next'?1:-1)].id;render();window.scrollTo(0,0)}
    if(id==='read'){S.read[cur.n]=!S.read[cur.n];save();render()}
    if(id==='prac'){sub.prac={ch:[cur.n]};go('luyentap')}};
}

/* ---------- Glossary ISTQB ---------- */
const GL=D.gloss||[], GLBY=Object.fromEntries(GL.map(g=>[g.s,g]));
const GSY=[...new Set(GL.flatMap(g=>g.sy.map(x=>x[0])))].sort((a,b)=>(GL.filter(g=>g.sy.some(x=>x[0]===b)).length)-(GL.filter(g=>g.sy.some(x=>x[0]===a)).length));
const GTY=[...new Set(GL.map(g=>g.t))].sort();
const glS=()=>S.gl||(S.gl={known:{},best:{},f:{sy:'',ty:'',kw:false,q:'',l:'',st:'all'}});
const glDef=g=>S.lang==='en'?esc(g.d):S.lang==='vi'?esc(g.vd||g.d):`${esc(g.d)}<div class="vi">${esc(g.vd||'')}</div>`;
const glName=g=>`${esc(g.n)}${g.a?`<span class="ab">${esc(g.a)}</span>`:''}${S.lang!=='en'&&g.vn?`<div class="vi small">${esc(g.vn)}</div>`:''}`;
function glPool(){const G=glS(),f=G.f,q=(f.q||'').trim().toLowerCase();
  return GL.filter(g=>(!f.sy||g.sy.some(x=>x[0]===f.sy&&(!f.kw||x[1])))&&(!f.ty||g.t===f.ty)&&(!f.l||(f.l==='#'?!/^[a-z]/i.test(g.n):g.n[0].toUpperCase()===f.l))
    &&(f.st==='all'||(f.st==='known')===!!G.known[g.s])&&(!q||(g.n+' '+g.a+' '+g.vn+' '+g.d+' '+g.vd+' '+g.syn.join(' ')).toLowerCase().includes(q)))}
function gloss(){

    <div class="small muted">Đang chọn ${pool.length} thuật ngữ. Các trò chơi dùng đúng nhóm thuật ngữ đang chọn.</div></div>`;

  const bindFilt=()=>{const inp=$('#gq');inp.oninput=()=>{f.q=inp.value;m.page=0;save();gloss();const x=$('#gq');x.focus();x.setSelectionRange(x.value.length,x.value.length)};$('#gst').value=f.st};

    app.onclick=e=>{const sb=e.target.closest('[data-say]');if(sb){speak(sb.dataset.say);return}if(base(e))return;if(e.target.closest('#gcard')){m.flip=!m.flip;render();return}
      const id=e.target.id;if(id==='gyes'||id==='gno'){if(id==='gyes')G.known[g.s]=1;else delete G.known[g.s];save();m.i++;m.flip=false;render()}};
    app.onkeydown=e=>{if(e.target.id==='gcard'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();m.flip=!m.flip;render();$('#gcard').focus()}};return}

      app.innerHTML=head+endPanel('Kết quả',`<div class="verdict ${m.ok===m.order.length?'ok':''}">${m.ok}/${m.order.length} câu đúng</div><div class="muted">Kỷ lục với bộ lọc này: ${G.best[bestKey]}/${m.order.length}</div>${m.wrong.length?'<div><b>Cần ôn lại:</b></div>'+m.wrong.map(s=>`<div><b>${esc(GLBY[s].n)}</b> <span class="vi">${esc(GLBY[s].vn||'')}</span></div>`).join(''):''}`);
      bindFilt();app.onclick=e=>{if(again(e))return;base(e)};return}

      ${m.shown!=null?`<div class="expl"><b>${esc(g.n)}</b>${g.vn?` · <span class="vi">${esc(g.vn)}</span>`:''}<div>${glDef(g)}</div></div><div class="row"><button class="btn pri" id="gnext">${m.i+1<m.order.length?'Câu tiếp →':'Xem kết quả'}</button></div>`:''}`;

  if(m.mode==='match'){

      app.innerHTML=head+endPanel('Ghép xong!',`<div class="big">${fmt(t)}</div><div class="muted">Cộng 5 giây cho mỗi lần ghép sai (${m.miss} lần). Kỷ lục với bộ lọc này: ${fmt(G.best[bestKey])}.</div>`);bindFilt();app.onclick=e=>{if(again(e))return;base(e)};return}
    const card=(side,s)=>{const g=GLBY[s],d=m.done.includes(s),cl=d?'done':(m.bad&&m.bad[side]===s)?'bad':m.sel[side]===s?'sel':'';

      <div class="mcols"><div class="stack">${m.left.map(s=>card('l',s)).join('')}</div><div class="stack">${m.right.map(s=>card('r',s)).join('')}</div></div>`;
    bindFilt();const show=()=>{const t=$('#gt');if(t)t.textContent=fmt((Date.now()-m.start)/1000+m.miss*5)};show();tick=setInterval(show,1000);

      render()};return}
  if(m.mode==='speed'){
    if(m.left==null){m.left=60;m.score=0;m.streak=0;m.right=0}

      app.innerHTML=head+endPanel('Hết giờ!',`<div class="big">${m.score} điểm</div><div class="muted">Đúng ${m.right} thuật ngữ. Kỷ lục với bộ lọc này: ${G.best[bestKey]} điểm.</div>`);bindFilt();app.onclick=e=>{if(again(e))return;base(e)};return}

      <input class="typein" id="gin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Thuật ngữ tiếng Anh" ${m.res?'disabled':''} value="${esc(m.typed||'')}">
      ${m.res?`<div class="expl"><b>${m.res==='ok'?'Chính xác!':'Chưa đúng.'}</b> Đáp án: <b>${esc(g.n)}</b>${g.a?` (${esc(g.a)})`:''}${g.vn?` · <span class="vi">${esc(g.vn)}</span>`:''}</div>`:''}
      <div class="row">${m.res?`<button class="btn pri" id="gnext">${m.i+1<m.order.length?'Câu tiếp →':'Xem kết quả'}</button>`:`<button class="btn pri" id="gchk">Kiểm tra</button><button class="btn" id="ghint">Gợi ý thêm chữ</button><button class="btn" id="gskip">Chịu, xem đáp án</button>`}</div></div>`;
  bindFilt();const inp=$('#gin');if(!m.res)inp.focus();
  const check=()=>{m.typed=inp.value;const ok=norm(inp.value)===norm(g.n)||(g.a&&norm(inp.value)===norm(g.a))||g.syn.some(x=>norm(x)===norm(inp.value));m.res=ok?'ok':'bad';if(ok){m.ok++;G.known[g.s]=1;save()}render()};
  app.onkeydown=e=>{if(e.target.id==='gin'&&e.key==='Enter'){e.preventDefault();check()}};
  app.onclick=e=>{if(base(e))return;const id=e.target.id;if(id==='gchk')check();if(id==='gskip'){m.typed=inp.value;m.res='bad';render()}
    if(id==='ghint'){m.typed=inp.value;m.hint=Math.min(g.n.length,(m.hint||1)+2);render()}
    if(id==='gnext'){m.i++;m.res=null;m.typed='';m.hint=0;render()}};
}

/* ---------- Thuật ngữ ---------- */
function thuatngu(){
  const m=sub.tm||(sub.tm={mode:'list',q:'',i:0,flip:false,set:'terms'});const src=D[m.set];
  const head=`<div class="row"><div class="seg"><button data-set="terms" aria-pressed="${m.set==='terms'}">Thuật ngữ AI (${D.terms.length})</button><button data-set="abbr" aria-pressed="${m.set==='abbr'}">Từ viết tắt (${D.abbr.length})</button></div>
   <div class="seg"><button data-mode="list" aria-pressed="${m.mode==='list'}">Danh sách</button><button data-mode="card" aria-pressed="${m.mode==='card'}">Thẻ ghi nhớ</button></div></div>`;
  if(m.mode==='card'){const o=m.order&&m.order.length===src.length?m.order:(m.order=src.map((_,i)=>i));const t=src[o[m.i%src.length]];
    app.innerHTML=head+`<div class="panel card" id="card" tabindex="0" role="button" aria-label="Lật thẻ"><div class="term">${esc(t[0].en)}</div>
      ${m.flip?`<div class="vi"><b>${esc(t[0].vi)}</b></div><div>${esc(t[1].en)}</div><div class="vi">${esc(t[1].vi)}</div>`:'<div class="muted small">Bấm để xem nghĩa và định nghĩa</div>'}</div>
     <div class="row"><button class="btn" id="tp">← Trước</button><span class="mono">${m.i%src.length+1}/${src.length}</span><button class="btn pri" id="tn">Tiếp →</button><button class="btn" id="ts">Trộn thẻ</button></div>`;
  }else{const q=m.q.toLowerCase();const rows=src.filter(t=>!q||(t[0].en+t[0].vi+t[1].en+t[1].vi).toLowerCase().includes(q));
    app.innerHTML=head+`<input type="search" id="tq" placeholder="Tìm thuật ngữ (Anh hoặc Việt)" value="${esc(m.q)}" aria-label="Tìm thuật ngữ">
     <div class="tw"><table><tr><th style="width:32%">Thuật ngữ</th><th>Định nghĩa</th></tr>${rows.map(t=>`<tr><td><b>${esc(t[0].en)}</b>${t[0].vi&&t[0].vi!==t[0].en?`<div class="vi">${esc(t[0].vi)}</div>`:''}</td><td>${two(t[1])}</td></tr>`).join('')||'<tr><td colspan="2" class="muted">Không tìm thấy thuật ngữ nào khớp.</td></tr>'}</table></div>`;
    const inp=$('#tq');inp.oninput=()=>{m.q=inp.value;thuatngu();const n=$('#tq');n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
  app.onclick=e=>{const b=e.target.closest('button'),c=e.target.closest('#card');
    if(c){m.flip=!m.flip;render();return} if(!b)return;
    if(b.dataset.set){m.set=b.dataset.set;m.i=0;m.order=null;m.flip=false;render()}
    if(b.dataset.mode){m.mode=b.dataset.mode;render()}
    if(b.id==='tn'){m.i++;m.flip=false;render()} if(b.id==='tp'){m.i=(m.i-1+src.length)%src.length;m.flip=false;render()}
    if(b.id==='ts'){m.order=shuffle(src.map((_,i)=>i));m.i=0;m.flip=false;render()}};
  app.onkeydown=e=>{if(e.target.id==='card'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();m.flip=!m.flip;render();$('#card').focus()}};
}

/* ---------- Câu hỏi (dùng chung) ---------- */
function qHTML(q,pick,reveal,num){
  const multi=q.select>1;
  return `<div class="q stack"><div class="row"><b>${num}</b><span class="chip">${esc(q.lo)}</span><span class="chip k">${q.k}</span><span class="chip">${q.points} điểm</span>
    <span class="chip ${isOff(q)?'':'warn'}">${isOff(q)?'Đề mẫu ISTQB '+q.id:'Bổ sung'}</span></div>
   ${loText(q.lo)?`<div class="small muted">Mục tiêu học tập: ${esc(loText(q.lo))}</div>`:''}
   <div class="stem">${fig(two(q.stem,true),q.figStem)}</div>
   ${q.stem_figure_text?`<div class="expl"><b>Nội dung trong hình</b>${two(q.stem_figure_text,true)}</div>`:''}
   <div class="small muted">${!q.select?'Câu dạng ghép cặp/sắp xếp: tự làm ra giấy rồi mở đáp án để đối chiếu.':multi?`Chọn ${q.select} đáp án.`:'Chọn MỘT đáp án.'}</div>
   <div class="stack" role="${multi?'group':'radiogroup'}">${q.options.map(o=>{const sel=pick.includes(o.key),ok=q.correct.includes(o.key);
     const cls=reveal?(ok?'right':sel?'wrong':''):(sel?'sel':'');
     return `<label class="opt ${cls}"><input type="${multi?'checkbox':'radio'}" name="opt" value="${o.key}" ${sel?'checked':''} ${reveal?'disabled':''}><span class="k">${o.key})</span><span class="tx">${two(o,true)}</span>${reveal&&ok?'<span class="tag" style="color:var(--ok)">✓ Đúng</span>':reveal&&sel?'<span class="tag" style="color:var(--bad)">✗ Sai</span>':''}</label>`}).join('')}</div>
   ${reveal?`<div class="expl"><b>Giải thích</b>${fig(two(q.explanation,true),q.figExpl)}${q.explanation_figure_text?two(q.explanation_figure_text,true):''}</div>`:''}</div>`}
function readPick(q,pick,inp){if(q.select>1){const i=pick.indexOf(inp.value);if(inp.checked&&i<0){if(pick.length>=q.select){inp.checked=false;return pick}pick.push(inp.value)}else if(!inp.checked&&i>=0)pick.splice(i,1);return pick}return [inp.value]}
const mark=(q,pick,self)=>{const ok=q.select?sameSet(pick,q.correct):!!self;const s=S.stats[q.id]||(S.stats[q.id]={n:0,c:0});s.n++;s.c+=ok?1:0;s.last=ok?1:0;save();return ok};

/* ---------- Luyện tập ---------- */
function luyentap(){
  const p=sub.prac||(sub.prac={});
  if(!p.list){p.ch=p.ch||CH.map(c=>c.n);p.src=p.src||'all';p.flt=p.flt||'all';p.cnt=p.cnt||'10';
    const pool=()=>QS.filter(q=>p.ch.includes(chOf(q))&&(p.src==='all'||(p.src==='off')===isOff(q))&&(p.flt==='all'||(p.flt==='new'?!S.stats[q.id]:S.stats[q.id]?.last===0)));
    app.innerHTML=`<h1>Luyện tập</h1><p class="muted">Trả lời từng câu và xem giải thích ngay. Câu "Bổ sung" do AI soạn theo giáo trình để bạn có thêm bài luyện.</p>
     <div class="panel stack"><b>Chương</b><div class="checks">${CH.map(c=>`<label class="ck"><input type="checkbox" id="pc${c.n}" data-ch="${c.n}" ${p.ch.includes(c.n)?'checked':''}><span>${esc(one(c.title))}</span></label>`).join('')}</div>
      <div class="row"><label for="psrc">Nguồn</label><select id="psrc"><option value="all">Tất cả</option><option value="off">Chỉ đề mẫu ISTQB</option><option value="extra">Chỉ câu bổ sung</option></select>
       <label for="pflt">Lọc</label><select id="pflt"><option value="all">Mọi câu</option><option value="new">Câu chưa làm</option><option value="wrong">Câu từng làm sai</option></select>
       <label for="pcnt">Số câu</label><select id="pcnt"><option>10</option><option>20</option><option>40</option><option value="all">Tất cả</option></select></div>
      <div class="row"><button class="btn pri" id="pgo">Bắt đầu</button><span class="muted" id="pn"></span></div></div>`;
    $('#psrc').value=p.src;$('#pflt').value=p.flt;$('#pcnt').value=p.cnt;
    const upd=()=>{const n=pool().length;$('#pn').textContent=n?`Có ${n} câu phù hợp.`:'Không có câu nào phù hợp. Hãy đổi bộ lọc.';$('#pgo').disabled=!n};upd();
    app.onchange=e=>{const t=e.target;if(t.dataset.ch){const n=+t.dataset.ch;p.ch=t.checked?[...p.ch,n]:p.ch.filter(x=>x!==n)}
      if(t.id==='psrc')p.src=t.value;if(t.id==='pflt')p.flt=t.value;if(t.id==='pcnt')p.cnt=t.value;upd()};
    app.onclick=e=>{if(e.target.id==='pgo'){let l=shuffle(pool());if(p.cnt!=='all')l=l.slice(0,+p.cnt);p.list=l.map(q=>q.id);p.i=0;p.pick=[];p.rev=false;p.ok=0;render()}};
    return}
  if(p.i>=p.list.length){app.innerHTML=`<div class="panel stack"><h2>Xong lượt luyện tập</h2><div class="verdict">${p.ok}/${p.list.length} câu đúng</div>
     <div class="row"><button class="btn pri" id="again">Luyện lượt mới</button><button class="btn" data-go="home">Về tổng quan</button></div></div>`;
    app.onclick=e=>{if(e.target.id==='again'){sub.prac={ch:p.ch,src:p.src,flt:p.flt,cnt:p.cnt};render()}if(e.target.dataset.go)go('home')};app.onchange=null;return}
  const q=QBY[p.list[p.i]];
  app.innerHTML=`<div class="row"><span class="mono">Câu ${p.i+1}/${p.list.length}</span><div class="meter"><i style="width:${p.i/p.list.length*100}%"></i></div><span class="chip ok">${p.ok} đúng</span><button class="btn small" id="quit">Dừng</button></div>
   <div class="panel">${qHTML(q,p.pick,p.rev,'Câu '+(p.i+1))}</div>
   <div class="row">${p.rev&&!q.select&&!p.marked?'<span>Bạn làm có đúng không?</span><button class="btn pri" id="sy">Tôi làm đúng</button><button class="btn" id="sn">Tôi làm sai</button>':p.rev?`<button class="btn pri" id="nx">${p.i+1<p.list.length?'Câu tiếp →':'Xem kết quả'}</button>`:`<button class="btn pri" id="chk" ${p.pick.length===q.select?'':'disabled'}>${q.select?'Kiểm tra':'Xem đáp án'}</button>`}</div>`;
  app.onchange=e=>{if(e.target.name==='opt'&&!p.rev){p.pick=readPick(q,p.pick,e.target);render()}};
  app.onclick=e=>{const id=e.target.id;if(id==='chk'){p.rev=true;p.marked=false;if(q.select&&mark(q,p.pick))p.ok++;render()}
    if(id==='sy'||id==='sn'){p.marked=true;if(mark(q,[],id==='sy'))p.ok++;render()}
    if(id==='nx'){p.i++;p.pick=[];p.rev=false;render();window.scrollTo(0,0)} if(id==='quit'){sub.prac={ch:p.ch};render()}};
}

/* ---------- Trò chơi ---------- */
const gs=n=>S.game['c'+n]||(S.game['c'+n]={});
const starHTML=k=>`<span class="stars" aria-label="${k||0} trên 3 sao">${'★'.repeat(k||0)}<i>${'★'.repeat(3-(k||0))}</i></span>`;
function chTerms(n,min){let l=(CH.find(c=>c.n===n).terms||[]).slice();if(l.length<min){const rest=shuffle(D.terms.map((_,i)=>i).filter(i=>!l.includes(i)));l=l.concat(rest.slice(0,min-l.length))}return l}
function startGame(m,n){
  if(m==='run')sub.g={mode:m,n,list:shuffle(QS.filter(q=>chOf(q)===n&&q.select)).slice(0,8).map(q=>q.id),i:0,hearts:3,pick:[],rev:false};
  if(m==='match'){const t=shuffle(chTerms(n,6)).slice(0,6);sub.g={mode:m,n,left:t,right:shuffle(t),done:[],sel:{},miss:0,start:Date.now()}}
  if(m==='speed')sub.g={mode:m,n,pool:chTerms(n,8),left:60,score:0,streak:0,right:0};
  render();window.scrollTo(0,0)}
function game(){
  const g=sub.g;
  if(!g){app.innerHTML=`<div class="stack"><h1>Trò chơi theo chương</h1><p class="muted">Ba cách chơi để nhớ kiến thức từng chương. Thành tích tốt nhất được lưu trên trình duyệt này.</p></div>
    <div class="panel stack"><div><b>Vượt ải</b>: trả lời câu hỏi của chương với 3 mạng, còn càng nhiều mạng càng nhiều sao.</div><div><b>Nối cặp</b>: ghép thuật ngữ với định nghĩa, càng nhanh càng tốt.</div><div><b>Phản xạ</b>: 60 giây, đọc định nghĩa và chọn đúng thuật ngữ; trả lời đúng liên tiếp được cộng thêm điểm.</div></div>
    <div class="panel">${CH.map(c=>{const r=gs(c.n);return `<div class="grow"><div><b>${esc(one(c.title))}</b><div class="small muted">${starHTML(r.stars)} · Nối cặp: ${r.match?fmt(r.match):'chưa chơi'} · Phản xạ: ${r.speed!=null?r.speed+' điểm':'chưa chơi'}</div></div>
      <div class="row"><button class="btn pri small" data-m="run" data-n="${c.n}">Vượt ải</button><button class="btn small" data-m="match" data-n="${c.n}">Nối cặp</button><button class="btn small" data-m="speed" data-n="${c.n}">Phản xạ</button></div></div>`}).join('')}</div>`;
    app.onclick=e=>{const b=e.target.closest('button[data-m]');if(b)startGame(b.dataset.m,+b.dataset.n)};return}
  const c=CH.find(x=>x.n===g.n),r=gs(g.n),quitBtn='<button class="btn small" id="gq">Thoát</button>';
  const endPanel=(title,body)=>{app.innerHTML=`<div class="panel stack"><div class="small muted">${esc(one(c.title))}</div><h2>${title}</h2>${body}<div class="row"><button class="btn pri" id="ga">Chơi lại</button><button class="btn" id="gq">Chọn trò khác</button><button class="btn" id="gd">Đọc lại chương này</button></div></div>`};
  const common=e=>{const id=e.target.id;if(id==='gq'){sub.g=null;render();return true}
    if(id==='gd'){sub.g=null;sub.ch=c.id;go('hoc');return true}
    if(id==='ga'){startGame(g.mode,g.n);return true}};
  if(g.mode==='run'){
    if(g.hearts<=0||g.i>=g.list.length){const win=g.hearts>0;if(win&&!g.saved){g.saved=true;r.stars=Math.max(r.stars||0,g.hearts);save()}
      endPanel(win?'Qua ải!':'Hết mạng',win?`<div>${starHTML(g.hearts)}</div><div>Bạn trả lời ${g.list.length} câu và còn ${g.hearts} mạng.</div>`:`<div>Bạn dừng ở câu ${g.i+1}/${g.list.length}. Đọc lại chương rồi thử lần nữa.</div>`);
      app.onclick=common;return}
    const q=QBY[g.list[g.i]];
    app.innerHTML=`<div class="row"><span class="hearts" aria-label="Còn ${g.hearts} mạng">${'♥'.repeat(g.hearts)}<i>${'♥'.repeat(3-g.hearts)}</i></span><span class="mono">Câu ${g.i+1}/${g.list.length}</span><div class="meter"><i style="width:${g.i/g.list.length*100}%"></i></div>${quitBtn}</div>
      <div class="panel">${qHTML(q,g.pick,g.rev,'Vượt ải')}</div>
      <div class="row">${g.rev?`<button class="btn pri" id="gn">${g.hearts>0&&g.i+1<g.list.length?'Câu tiếp →':'Xem kết quả'}</button>`:`<button class="btn pri" id="gc" ${g.pick.length===q.select?'':'disabled'}>Chốt đáp án</button>`}</div>`;
    app.onchange=e=>{if(e.target.name==='opt'&&!g.rev){g.pick=readPick(q,g.pick,e.target);render()}};
    app.onclick=e=>{if(common(e))return;const id=e.target.id;
      if(id==='gc'){g.rev=true;if(!mark(q,g.pick))g.hearts--;render()}
      if(id==='gn'){if(g.hearts>0)g.i++;g.pick=[];g.rev=false;render();window.scrollTo(0,0)}};return}
  if(g.mode==='match'){
    if(g.done.length===g.left.length){const t=g.time??(g.time=Math.round((Date.now()-g.start)/1000)+g.miss*5);if(!g.saved){g.saved=true;r.match=Math.min(r.match||1e9,t);save()}
      endPanel('Ghép xong!',`<div class="big">${fmt(t)}</div><div class="muted">Đã cộng 5 giây cho mỗi lần ghép sai (${g.miss} lần). Kỷ lục của bạn: ${fmt(r.match)}.</div>`);app.onclick=common;return}
    const card=(side,i)=>{const t=D.terms[i],d=g.done.includes(i),cl=d?'done':(g.bad&&g.bad[side]===i)?'bad':g.sel[side]===i?'sel':'';
      return `<button class="mcard ${cl}" data-side="${side}" data-i="${i}" ${d?'disabled':''}>${side==='l'?`<b>${esc(t[0].en)}</b>${t[0].vi&&t[0].vi!==t[0].en&&S.lang!=='en'?`<div class="vi small">${esc(t[0].vi)}</div>`:''}`:esc(one(t[1]))}</button>`};
    app.innerHTML=`<div class="row"><b>Nối cặp</b><span class="timer" id="gt"></span><span class="chip">${g.done.length}/${g.left.length} cặp</span><span class="chip bad">${g.miss} lần sai</span>${quitBtn}</div>
      <p class="small muted">${esc(one(c.title))}. Chạm một thuật ngữ bên trái rồi chạm định nghĩa tương ứng bên phải.</p>
      <div class="mcols"><div class="stack">${g.left.map(i=>card('l',i)).join('')}</div><div class="stack">${g.right.map(i=>card('r',i)).join('')}</div></div>`;
    const show=()=>{$('#gt').textContent=fmt((Date.now()-g.start)/1000+g.miss*5)};show();tick=setInterval(show,1000);
    app.onclick=e=>{if(common(e))return;const b=e.target.closest('.mcard');if(!b||g.bad)return;g.sel[b.dataset.side]=+b.dataset.i;
      if(g.sel.l!=null&&g.sel.r!=null){if(g.sel.l===g.sel.r){g.done.push(g.sel.l);g.sel={}}else{g.miss++;g.bad=g.sel;g.sel={};setTimeout(()=>{g.bad=null;if(sub.g===g&&view==='game')render()},650)}}
      render()};return}
  if(g.left<=0){if(!g.saved){g.saved=true;r.speed=Math.max(r.speed||0,g.score);save()}
    endPanel('Hết giờ!',`<div class="big">${g.score} điểm</div><div class="muted">Đúng ${g.right} thuật ngữ. Kỷ lục của bạn: ${r.speed} điểm.</div>`);app.onclick=common;return}
  if(!g.cur){const a=g.pool[Math.random()*g.pool.length|0];const near=shuffle(g.pool.filter(i=>i!==a)),far=shuffle(D.terms.map((_,i)=>i).filter(i=>i!==a&&!g.pool.includes(i)));g.cur={a,ch:shuffle([a,...near.concat(far).slice(0,3)])}}
  const T=D.terms[g.cur.a];
  app.innerHTML=`<div class="row"><b>Phản xạ</b><span class="timer ${g.left<=10?'low':''}" id="gt">${fmt(g.left)}</span><span class="chip ok">${g.score} điểm</span><span class="chip k">chuỗi ×${g.streak}</span>${quitBtn}</div>
    <div class="panel stack"><div class="small muted">Định nghĩa này là của thuật ngữ nào?</div><div style="font-size:17px">${two(T[1])}</div></div>
    <div class="stack">${g.cur.ch.map(i=>{const t=D.terms[i],cl=g.shown!=null?(i===g.cur.a?'done':i===g.shown?'bad':''):'';return `<button class="mcard ${cl}" data-i="${i}"><b>${esc(t[0].en)}</b>${t[0].vi&&t[0].vi!==t[0].en&&S.lang!=='en'?` <span class="vi small">· ${esc(t[0].vi)}</span>`:''}</button>`}).join('')}</div>`;
  tick=setInterval(()=>{g.left--;if(g.left<=0)render();else{const t=$('#gt');t.textContent=fmt(g.left);t.classList.toggle('low',g.left<=10)}},1000);
  app.onclick=e=>{if(common(e))return;const b=e.target.closest('.mcard');if(!b||g.shown!=null)return;const i=+b.dataset.i;g.shown=i;
    if(i===g.cur.a){g.score+=10+2*g.streak;g.streak++;g.right++}else{g.streak=0;g.left=Math.max(1,g.left-3)}
    render();setTimeout(()=>{g.shown=null;g.cur=null;if(sub.g===g&&view==='game')render()},i===g.cur.a?450:1300)};
}

/* ---------- TOEIC 600 ---------- */
const TL=D.toeic||[];
const canSpeak=typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
function speak(w){try{const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const spk=w=>canSpeak?`<button class="btn small" data-say="${esc(w)}" aria-label="Nghe phát âm ${esc(w)}">▶ Nghe</button>`:'';
const tk=()=>S.toeic||(S.toeic={known:{},best:{}});
function toeic(){
  const T=tk(),m=sub.tq||(sub.tq={q:''});
  const say=e=>{const b=e.target.closest('[data-say]');if(b){speak(b.dataset.say);return true}};
  if(m.n==null){
    const total=new Set(TL.flatMap(l=>l.words.map(w=>w.w))).size,known=Object.keys(T.known).length,q=m.q.trim().toLowerCase();
    const hits=q?TL.flatMap(l=>l.words.filter(w=>(w.w+' '+w.vi).toLowerCase().includes(q)).map(w=>[l,w])).slice(0,40):[];
    app.innerHTML=`<div class="stack"><h1>600 từ vựng TOEIC</h1><p class="muted">50 chủ đề, mỗi chủ đề 12 từ, theo danh sách "600 Essential Words for the TOEIC". Mỗi chủ đề có danh sách từ, thẻ ghi nhớ, trắc nghiệm và nối cặp.</p></div>
      <div class="panel stack"><div class="row"><b>Đã thuộc ${known}/${total} từ</b><div class="meter"><i style="width:${total?known/total*100:0}%"></i></div></div>
        <input type="search" id="ts" placeholder="Tìm từ tiếng Anh hoặc nghĩa tiếng Việt" value="${esc(m.q)}" aria-label="Tìm từ vựng TOEIC">
        ${q?(hits.length?hits.map(([l,w])=>`<div class="wrow"><div><span class="w">${esc(w.w)}</span> <span class="chip">${esc(w.pos)}</span><div class="vi">${esc(w.vi)}</div></div><button class="btn small" data-n="${l.n}">Bài ${l.n}</button></div>`).join(''):'<div class="muted">Không tìm thấy từ nào khớp.</div>'):''}</div>
      <div class="lgrid">${TL.map(l=>{const k=l.words.filter(w=>T.known[w.w]).length;return `<button class="lbtn ${k===l.words.length?'full':''}" data-n="${l.n}"><b>${l.n}. ${esc(l.title.en)}</b><span class="vi small">${esc(l.title.vi)}</span><span class="small muted">Thuộc ${k}/${l.words.length}${T.best[l.n]!=null?' · Trắc nghiệm '+T.best[l.n]+'/'+l.words.length:''}</span></button>`}).join('')}</div>`;
    const inp=$('#ts');inp.oninput=()=>{m.q=inp.value;toeic();const x=$('#ts');x.focus();x.setSelectionRange(x.value.length,x.value.length)};

  const show=()=>{$('#gt').textContent=fmt((Date.now()-m.start)/1000+m.miss*5)};show();tick=setInterval(show,1000);
  app.onclick=e=>{if(base(e))return;const b=e.target.closest('.mcard');if(!b||m.bad)return;m.sel[b.dataset.side]=+b.dataset.i;
    if(m.sel.l!=null&&m.sel.r!=null){if(m.sel.l===m.sel.r){m.done.push(m.sel.l);m.sel={}}else{m.miss++;m.bad=m.sel;m.sel={};setTimeout(()=>{m.bad=null;if(sub.tq===m&&view==='toeic')render()},650)}}

const hasTTS=typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
let talk={token:0,timer:null,lock:null};
function stopTalk(){talk.token++;clearTimeout(talk.timer);try{if(hasTTS)speechSynthesis.cancel()}catch(e){}try{talk.lock&&talk.lock.release();talk.lock=null}catch(e){}}
const ABBR=/\b(e\.g|i\.e|etc|vs|cf|approx|v\.v|Fig|No)\./g;
function sentences(t){t=String(t||'').replace(/\s+/g,' ').trim();if(!t)return[];
  const p=t.replace(ABBR,m=>m.replace(/\./g,'\u0002')).replace(/([.!?]["”’)]?)\s+(?=["“‘(]?[A-ZÀ-ỸĐ0-9])/g,'$1\u0001').split('\u0001');
  return p.map(x=>x.replace(/\u0002/g,'.').trim()).filter(Boolean)}
const cellText=t=>String(t||'').replace(/^[•◦▪]\s*/gm,'').split(/\s*\n\s*/).map(x=>x.trim()).filter(Boolean).map(x=>/[.!?:;]$/.test(x)?x:x+'.').join(' ');
function learnUnits(c){const out=[];let on=false,sec=null,img=null;
  const push=u=>{u.sec=sec;if(img){u.img=img;img=null}out.push(u)};
  for(const b of c.blocks){
    if(!on){if(b.type==='h2')on=true;else continue}
    if(b.type==='figure'){img=b.img||null;continue}
    if(b.type==='table'){if(/^(AI|HO)-\d/.test(b.rows[0]&&b.rows[0][0]?b.rows[0][0].en:''))continue;
      b.rows.forEach((r,i)=>{if(b.header&&i===0)return;const en=r.map(x=>cellText(x.en)).filter(Boolean).join(' '),vi=r.map(x=>cellText(x.vi||x.en)).filter(Boolean).join(' ');if(en)push({en,vi})});continue}
    if(/^h\d$/.test(b.type)){if(b.type==='h2'||b.type==='h3')sec=b;push({en:b.en,vi:b.vi,head:true});continue}
    const E=sentences(b.en),V=sentences(b.vi);
    if(E.length===V.length)E.forEach((e,k)=>push({en:e,vi:V[k]}));else E.forEach(e=>push({en:e,vi:b.vi}))}
  return out}
const sayText=t=>t.replace(/^\d+(\.\d+)*\s+/,'').replace(/\be\.g\.,?/g,'for example,').replace(/\bi\.e\.,?/g,'that is,').replace(/\betc\./g,'et cetera.').replace(/[®™]/g,'').replace(/\s[–—]\s/g,', ').replace(/\//g,' or ');
function nghe(){
  const P=S.learn||(S.learn={pos:{},rate:0.9,sub:'both',voice:''}),L=sub.le||(sub.le={n:P.last||1});
  const c=CH.find(x=>x.n===L.n)||CH[0];if(L.units==null||L.for!==c.n){L.units=learnUnits(c);L.for=c.n;L.i=Math.min(P.pos[c.n]||0,L.units.length-1)}
  const U=L.units;L.playing=false;
  const voices=()=>{try{return hasTTS?speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)):[]}catch(e){return[]}};
  const secs=U.map((u,i)=>[u,i]).filter(([u])=>u.head&&u.sec&&u.en===u.sec.en);
  app.innerHTML=`<div class="stack"><h1>Học tiếng Anh qua giáo trình</h1><p class="muted">Nghe đọc tiếng Anh từng câu của giáo trình CT-AI, có phụ đề Anh và Việt chạy theo như xem video. Bắt đầu thẳng từ nội dung kiến thức của chương 1, bỏ qua phần giới thiệu, từ khóa và mục tiêu học tập.</p></div>
    <div class="row"><label for="lch" class="muted">Chương</label><select id="lch">${CH.map(x=>`<option value="${x.n}" ${x===c?'selected':''}>${esc(x.title.en)}</option>`).join('')}</select>
      <label for="lsec" class="muted">Mục</label><select id="lsec">${secs.map(([u,i])=>`<option value="${i}">${esc(u.en)}</option>`).join('')}</select></div>
    <div class="stage" id="stage"><div class="where"><span id="lw"></span><span class="mono" id="lc"></span></div><div class="mid" id="lm"></div><div class="sen" id="le" lang="en"></div><div class="svi" id="lv"></div><div class="bar2"><i id="lp"></i></div></div>
    <div class="ctl"><button class="btn" id="lprev" aria-label="Câu trước">⏮ Câu trước</button><button class="btn pri big2" id="lplay">▶ Phát</button><button class="btn" id="lrep" aria-label="Nghe lại câu này">↻ Nghe lại</button><button class="btn" id="lnext" aria-label="Câu sau">Câu sau ⏭</button></div>
    <div class="ctl"><label for="lrate" class="muted small">Tốc độ</label><select id="lrate">${[0.6,0.75,0.9,1,1.15,1.3].map(r=>`<option value="${r}" ${+P.rate===r?'selected':''}>${r}×</option>`).join('')}</select>
      <label for="lsub" class="muted small">Phụ đề</label><select id="lsub"><option value="both">Anh + Việt</option><option value="en">Chỉ tiếng Anh</option><option value="vi">Chỉ tiếng Việt</option><option value="none">Ẩn (luyện nghe)</option></select>
      <label for="lvoice" class="muted small">Giọng</label><select id="lvoice"><option value="">Mặc định của máy</option></select></div>
    ${hasTTS?'':'<p class="small" style="color:var(--bad)">Trình duyệt này không hỗ trợ đọc thành tiếng. Phụ đề vẫn tự chạy theo tốc độ đọc; hãy mở bằng Chrome, Edge hoặc Safari để nghe.</p>'}
    <div class="stack"><b>Lời thoại của chương</b><div class="small muted">Chạm một câu để nhảy tới câu đó.</div><div class="script" id="ls">${U.map((u,i)=>`<button class="u ${u.head?'h':''}" data-i="${i}"><span lang="en">${esc(u.en)}</span>${u.head||u.vi===(U[i-1]||{}).vi?'':`<span class="vi">${esc(u.vi)}</span>`}</button>`).join('')}</div></div>`;
  $('#lsub').value=P.sub;
  const fillVoices=()=>{const el=$('#lvoice');if(!el)return;const v=voices();el.innerHTML='<option value="">Mặc định của máy</option>'+v.map(x=>`<option value="${esc(x.name)}" ${x.name===P.voice?'selected':''}>${esc(x.name)} (${esc(x.lang)})</option>`).join('')};
  fillVoices();try{if(hasTTS)speechSynthesis.onvoiceschanged=fillVoices}catch(e){}
  const show=()=>{const u=U[L.i];if(!u)return;
    $('#lw').textContent=u.sec?u.sec.en:c.title.en;$('#lc').textContent=(L.i+1)+' / '+U.length;$('#lp').style.width=((L.i+1)/U.length*100)+'%';
    $('#lm').innerHTML=u.img?`<img src="${u.img}" alt="Hình minh hoạ">`:u.head?`<div class="ttl">${esc(u.en)}</div>`:'';
    $('#le').textContent=u.head||P.sub==='vi'||P.sub==='none'?'':u.en;$('#lv').textContent=P.sub==='en'||P.sub==='none'?'':u.vi;
    const cur=$('#ls .cur');if(cur)cur.classList.remove('cur');const el=$(`#ls [data-i="${L.i}"]`);if(el){el.classList.add('cur');const box=$('#ls');box.scrollTop=Math.max(0,el.offsetTop-box.clientHeight/3)}
    let k=0;secs.forEach(([,i],j)=>{if(i<=L.i)k=j});$('#lsec').selectedIndex=k;
    P.pos[c.n]=L.i;P.last=c.n;save()};
  const btn=()=>{$('#lplay').textContent=L.playing?'⏸ Tạm dừng':'▶ Phát'};
  const say=()=>{const my=++talk.token;clearTimeout(talk.timer);const u=U[L.i];show();
    const done=()=>{if(my!==talk.token||!L.playing)return;if(L.i>=U.length-1){L.playing=false;btn();return}talk.timer=setTimeout(()=>{if(my!==talk.token)return;L.i++;say()},u.head?500:250)};
    if(!hasTTS){talk.timer=setTimeout(done,Math.max(1500,u.en.length*65/P.rate));return}
    try{speechSynthesis.cancel();const x=new SpeechSynthesisUtterance(sayText(u.en));x.lang='en-US';x.rate=+P.rate;const v=voices().find(v=>v.name===P.voice);if(v){x.voice=v;x.lang=v.lang}
      x.onend=done;x.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')done()};speechSynthesis.speak(x)}catch(e){talk.timer=setTimeout(done,2500)}};
  const play=()=>{L.playing=true;btn();try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{talk.lock=l}).catch(()=>{})}catch(e){}say()};
  const pause=()=>{L.playing=false;btn();stopTalk()};
  const jump=i=>{L.i=Math.max(0,Math.min(U.length-1,i));if(L.playing)say();else{stopTalk();show()}};
  show();btn();
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='lplay'){L.playing?pause():play()}
    if(b.id==='lprev')jump(L.i-1);if(b.id==='lnext')jump(L.i+1);
    if(b.id==='lrep')say();
    if(b.classList.contains('u'))jump(+b.dataset.i)};
  app.onchange=e=>{const t=e.target;
    if(t.id==='lch'){stopTalk();sub.le={n:+t.value};render();window.scrollTo(0,0)}
    if(t.id==='lsec')jump(+t.value);
    if(t.id==='lrate'){P.rate=+t.value;save();if(L.playing)say()}
    if(t.id==='lsub'){P.sub=t.value;save();show()}
    if(t.id==='lvoice'){P.voice=t.value;save();if(L.playing)say()}};
}

/* ---------- Thi thử ---------- */
function buildRandom(){const off=QS.filter(q=>/^Q\d/.test(q.id));const out=[];
  CH.forEach(c=>{const need=off.filter(q=>chOf(q)===c.n).length;out.push(...shuffle(QS.filter(q=>chOf(q)===c.n&&q.select)).slice(0,need))});return out.map(q=>q.id)}
function thi(){
  clearInterval(tick);const X=S.exam;
  if(!X){app.innerHTML=`<h1>Thi thử</h1><p class="muted">Làm bài có tính giờ, không hiện đáp án cho đến khi nộp. Đạt khi được từ 65% tổng điểm.</p>
    <div class="panel stack"><div class="row"><label for="xform">Đề</label><select id="xform"><option value="off">Đề mẫu A của ISTQB (Q1–Q40, đúng thứ tự)</option><option value="rnd">Đề ngẫu nhiên 40 câu từ ngân hàng (cùng tỷ lệ theo chương)</option></select></div>
     <div class="row"><label for="xtime">Thời gian</label><select id="xtime"><option value="60">60 phút</option><option value="75">75 phút (không thi bằng tiếng mẹ đẻ)</option><option value="0">Không tính giờ</option></select></div>
     <div class="row"><button class="btn pri" id="xgo">Bắt đầu làm bài</button></div></div>`;
    app.onchange=null;app.onclick=e=>{if(e.target.id==='xgo'){const f=$('#xform').value,m=+$('#xtime').value;
      S.exam={name:f==='off'?'Đề mẫu A':'Đề ngẫu nhiên',list:f==='off'?QS.filter(q=>/^Q\d/.test(q.id)).map(q=>q.id):buildRandom(),ans:{},flag:{},i:0,limit:m*60,used:0,done:false};save();render();window.scrollTo(0,0)}};return}
  const qs=X.list.map(id=>QBY[id]),q=qs[X.i],total=qs.reduce((s,x)=>s+x.points,0);
  const right=x=>sameSet(X.ans[x.id]||[],x.correct);
  const mapBtn=(x,i)=>`<button data-j="${i}" class="${i===X.i?'cur ':''}${X.done?(right(x)?'ok':'bad'):((X.ans[x.id]||[]).length?'ans ':'')+(X.flag[x.id]?'flag':'')}" aria-label="Câu ${i+1}">${i+1}</button>`;
  if(!X.done){
    const un=qs.filter(x=>(X.ans[x.id]||[]).length<x.select).length;
    app.innerHTML=`<div class="examgrid"><div class="stack"><div class="panel">${qHTML(q,X.ans[q.id]||[],false,'Câu '+(X.i+1)+'/'+qs.length)}</div>
      <div class="row"><button class="btn" id="xp" ${X.i?'':'disabled'}>← Trước</button><button class="btn" id="xf">${X.flag[q.id]?'Bỏ đánh dấu':'Đánh dấu xem lại'}</button><button class="btn pri" id="xn" ${X.i<qs.length-1?'':'disabled'}>Tiếp →</button></div></div>
     <div class="panel stack"><div><div class="small muted">${X.limit?'Thời gian còn lại':'Thời gian đã làm'}</div><div class="timer" id="tm"></div></div>
      <div class="map">${qs.map(mapBtn).join('')}</div><div class="small muted">Nền xanh: đã trả lời · Gạch vàng: đánh dấu xem lại</div>
      <div id="sub" class="stack">${sub.confirm?`<div>Nộp bài? ${un?`Còn <b>${un}</b> câu chưa trả lời đủ.`:'Bạn đã trả lời hết.'}</div><div class="row"><button class="btn pri" id="xyes">Nộp bài</button><button class="btn" id="xno">Làm tiếp</button></div>`:'<button class="btn pri" id="xsub">Nộp bài</button>'}
      <button class="btn small" id="xquit">Huỷ bài thi</button></div></div></div>`;
    const tm=$('#tm'),show=()=>{const left=X.limit-X.used;tm.textContent=fmt(X.limit?left:X.used);tm.classList.toggle('low',X.limit>0&&left<300)};show();
    const finish=()=>{clearInterval(tick);X.done=true;sub.confirm=false;let sc=0;qs.forEach(x=>{if((X.ans[x.id]||[]).length){if(mark(x,X.ans[x.id]))sc+=x.points}});
      X.score=sc;S.hist.push({date:new Date().toLocaleString('vi-VN'),name:X.name,score:sc,total,pass:sc/total>=.65,used:X.used});X.i=0;save();render();window.scrollTo(0,0)};
    tick=setInterval(()=>{X.used++;if(X.used%10===0)save();if(X.limit&&X.used>=X.limit)finish();else show()},1000);
    app.onchange=e=>{if(e.target.name==='opt'){X.ans[q.id]=readPick(q,X.ans[q.id]||[],e.target);save();render()}};
    app.onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.id;
      if(b.dataset.j){X.i=+b.dataset.j;render()} if(id==='xp'){X.i--;render()} if(id==='xn'){X.i++;render()}
      if(id==='xf'){X.flag[q.id]=!X.flag[q.id];save();render()}
      if(id==='xsub'){sub.confirm=true;render()} if(id==='xno'){sub.confirm=false;render()} if(id==='xyes')finish();
      if(id==='xquit'){if(sub.quit){S.exam=null;sub.quit=false;save();render()}else{sub.quit=true;b.textContent='Bấm lần nữa để huỷ bài thi'}}};
    return}
  const pass=X.score/total>=.65;
  app.onchange=null;
  app.innerHTML=`<div class="panel stack"><h2>Kết quả: ${esc(X.name)}</h2><div class="verdict ${pass?'ok':'bad'}">${pass?'ĐẠT':'CHƯA ĐẠT'} · ${X.score}/${total} điểm (${Math.round(X.score/total*100)}%)</div>
    <div class="muted">Cần ${Math.ceil(total*.65)} điểm để đạt · Thời gian làm bài ${fmt(X.used)} · Đúng ${qs.filter(right).length}/${qs.length} câu</div>
    ${CH.map(c=>{const l=qs.filter(x=>chOf(x)===c.n);if(!l.length)return'';const g=l.filter(right).reduce((s,x)=>s+x.points,0),t=l.reduce((s,x)=>s+x.points,0);
      return `<div class="chrow"><div>${esc(one(c.title))}</div><div class="row"><div class="meter"><i style="width:${g/t*100}%"></i></div></div><span class="mono small">${g}/${t} điểm</span></div>`}).join('')}
    <div class="row"><button class="btn pri" id="xnew">Thi lại đề khác</button><button class="btn" id="xwrong">Luyện lại các câu sai</button></div></div>
   <div class="panel stack"><b>Xem lại từng câu</b><div class="map">${qs.map(mapBtn).join('')}</div></div>
   <div class="panel">${qHTML(q,X.ans[q.id]||[],true,'Câu '+(X.i+1)+'/'+qs.length)}</div>
   <div class="row"><button class="btn" id="xp" ${X.i?'':'disabled'}>← Trước</button><button class="btn pri" id="xn" ${X.i<qs.length-1?'':'disabled'}>Tiếp →</button></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.j){X.i=+b.dataset.j;render()} if(b.id==='xp'){X.i--;render()} if(b.id==='xn'){X.i++;render()}
    if(b.id==='xnew'){S.exam=null;save();render()}
    if(b.id==='xwrong'){const w=qs.filter(x=>!right(x)).map(x=>x.id);S.exam=null;save();if(w.length){sub.prac={list:w,i:0,pick:[],rev:false,ok:0,ch:CH.map(c=>c.n)};go('luyentap')}else render()}};
}
route();render();
</script>
