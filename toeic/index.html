/* ---------- Học tiếng Anh (bài giảng có phụ đề) ---------- */
const hasTTS=typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
let talk={token:0,timer:null,lock:null};
function stopTalk(){talk.token++;clearTimeout(talk.timer);try{if(hasTTS)speechSynthesis.cancel()}catch(e){}try{talk.lock&&talk.lock.release();talk.lock=null}catch(e){}}
const ABBR=/\b(e\.g|i\.e|etc|vs|cf|approx|v\.v|Fig|No)\./g;
function sentences(t){t=String(t||'').replace(/\s+/g,' ').trim();if(!t)return[];
  const p=t.replace(ABBR,m=>m.replace(/\./g,'\u0002')).replace(/([.!?]["”’)]?)\s+(?=["“‘(]?[A-ZÀ-ỸĐ0-9])/g,'$1\u0001').split('\u0001');
  return p.map(x=>x.replace(/\u0002/g,'.').trim()).filter(Boolean)}
const cellText=t=>String(t||'').replace(/^[•◦▪]\s*/gm,'').split(/\s*\n\s*/).map(x=>x.trim()).filter(Boolean).map(x=>/[.!?:;]$/.test(x)?x:x+'.').join(' ');
function learnUnits(c){const out=[];let on=false,sec=null,img=null;
  const push=u=>{u.sec=sec;if(img){u.img=img;img=null}out.push(u)};
  for(const b of c.blocks){
    if(!on){if(b.type==='h2')on=true;else continue}
    if(b.type==='figure'){img=b.img||null;continue}
    if(b.type==='table'){if(/^(AI|HO)-\d/.test(b.rows[0]&&b.rows[0][0]?b.rows[0][0].en:''))continue;
      b.rows.forEach((r,i)=>{if(b.header&&i===0)return;const en=r.map(x=>cellText(x.en)).filter(Boolean).join(' '),vi=r.map(x=>cellText(x.vi||x.en)).filter(Boolean).join(' ');if(en)push({en,vi})});continue}
    if(/^h\d$/.test(b.type)){if(b.type==='h2'||b.type==='h3')sec=b;push({en:b.en,vi:b.vi,head:true});continue}
    const E=sentences(b.en),V=sentences(b.vi);
    if(E.length===V.length)E.forEach((e,k)=>push({en:e,vi:V[k]}));else E.forEach(e=>push({en:e,vi:b.vi}))}
  return out}
const sayText=t=>t.replace(/^\d+(\.\d+)*\s+/,'').replace(/\be\.g\.,?/g,'for example,').replace(/\bi\.e\.,?/g,'that is,').replace(/\betc\./g,'et cetera.').replace(/[®™]/g,'').replace(/\s[–—]\s/g,', ').replace(/\//g,' or ');
function nghe(){
  const P=S.learn||(S.learn={pos:{},rate:0.9,sub:'both',voice:''}),L=sub.le||(sub.le={n:P.last||1});
  const c=CH.find(x=>x.n===L.n)||CH[0];if(L.units==null||L.for!==c.n){L.units=learnUnits(c);L.for=c.n;L.i=Math.min(P.pos[c.n]||0,L.units.length-1)}
  const U=L.units;L.playing=false;
  const voices=()=>{try{return hasTTS?speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)):[]}catch(e){return[]}};
  const secs=U.map((u,i)=>[u,i]).filter(([u])=>u.head&&u.sec&&u.en===u.sec.en);
  app.innerHTML=`<div class="stack"><h1>Học tiếng Anh qua giáo trình</h1><p class="muted">Nghe đọc tiếng Anh từng câu của giáo trình CT-AI, có phụ đề Anh và Việt chạy theo như xem video. Bắt đầu thẳng từ nội dung kiến thức của chương 1, bỏ qua phần giới thiệu, từ khóa và mục tiêu học tập.</p></div>
    <div class="row"><label for="lch" class="muted">Chương</label><select id="lch">${CH.map(x=>`<option value="${x.n}" ${x===c?'selected':''}>${esc(x.title.en)}</option>`).join('')}</select>
      <label for="lsec" class="muted">Mục</label><select id="lsec">${secs.map(([u,i])=>`<option value="${i}">${esc(u.en)}</option>`).join('')}</select></div>
    <div class="stage" id="stage"><div class="where"><span id="lw"></span><span class="mono" id="lc"></span></div><div class="mid" id="lm"></div><div class="sen" id="le" lang="en"></div><div class="svi" id="lv"></div><div class="bar2"><i id="lp"></i></div></div>
    <div class="ctl"><button class="btn" id="lprev" aria-label="Câu trước">⏮ Câu trước</button><button class="btn pri big2" id="lplay">▶ Phát</button><button class="btn" id="lrep" aria-label="Nghe lại câu này">↻ Nghe lại</button><button class="btn" id="lnext" aria-label="Câu sau">Câu sau ⏭</button></div>
    <div class="ctl"><label for="lrate" class="muted small">Tốc độ</label><select id="lrate">${[0.6,0.75,0.9,1,1.15,1.3].map(r=>`<option value="${r}" ${+P.rate===r?'selected':''}>${r}×</option>`).join('')}</select>
      <label for="lsub" class="muted small">Phụ đề</label><select id="lsub"><option value="both">Anh + Việt</option><option value="en">Chỉ tiếng Anh</option><option value="vi">Chỉ tiếng Việt</option><option value="none">Ẩn (luyện nghe)</option></select>
      <label for="lvoice" class="muted small">Giọng</label><select id="lvoice"><option value="">Mặc định của máy</option></select></div>
    ${hasTTS?'':'<p class="small" style="color:var(--bad)">Trình duyệt này không hỗ trợ đọc thành tiếng. Phụ đề vẫn tự chạy theo tốc độ đọc; hãy mở bằng Chrome, Edge hoặc Safari để nghe.</p>'}
    <div class="stack"><b>Lời thoại của chương</b><div class="small muted">Chạm một câu để nhảy tới câu đó.</div><div class="script" id="ls">${U.map((u,i)=>`<button class="u ${u.head?'h':''}" data-i="${i}"><span lang="en">${esc(u.en)}</span>${u.head||u.vi===(U[i-1]||{}).vi?'':`<span class="vi">${esc(u.vi)}</span>`}</button>`).join('')}</div></div>`;
  $('#lsub').value=P.sub;
  const fillVoices=()=>{const el=$('#lvoice');if(!el)return;const v=voices();el.innerHTML='<option value="">Mặc định của máy</option>'+v.map(x=>`<option value="${esc(x.name)}" ${x.name===P.voice?'selected':''}>${esc(x.name)} (${esc(x.lang)})</option>`).join('')};
  fillVoices();try{if(hasTTS)speechSynthesis.onvoiceschanged=fillVoices}catch(e){}
  const show=()=>{const u=U[L.i];if(!u)return;
    $('#lw').textContent=u.sec?u.sec.en:c.title.en;$('#lc').textContent=(L.i+1)+' / '+U.length;$('#lp').style.width=((L.i+1)/U.length*100)+'%';
    $('#lm').innerHTML=u.img?`<img src="${u.img}" alt="Hình minh hoạ">`:u.head?`<div class="ttl">${esc(u.en)}</div>`:'';
    $('#le').textContent=u.head||P.sub==='vi'||P.sub==='none'?'':u.en;$('#lv').textContent=P.sub==='en'||P.sub==='none'?'':u.vi;
    const cur=$('#ls .cur');if(cur)cur.classList.remove('cur');const el=$(`#ls [data-i="${L.i}"]`);if(el){el.classList.add('cur');const box=$('#ls');box.scrollTop=Math.max(0,el.offsetTop-box.clientHeight/3)}
    let k=0;secs.forEach(([,i],j)=>{if(i<=L.i)k=j});$('#lsec').selectedIndex=k;
    P.pos[c.n]=L.i;P.last=c.n;save()};
  const btn=()=>{$('#lplay').textContent=L.playing?'⏸ Tạm dừng':'▶ Phát'};
  const say=()=>{const my=++talk.token;clearTimeout(talk.timer);const u=U[L.i];show();
    const done=()=>{if(my!==talk.token||!L.playing)return;if(L.i>=U.length-1){L.playing=false;btn();return}talk.timer=setTimeout(()=>{if(my!==talk.token)return;L.i++;say()},u.head?500:250)};
    if(!hasTTS){talk.timer=setTimeout(done,Math.max(1500,u.en.length*65/P.rate));return}
    try{speechSynthesis.cancel();const x=new SpeechSynthesisUtterance(sayText(u.en));x.lang='en-US';x.rate=+P.rate;const v=voices().find(v=>v.name===P.voice);if(v){x.voice=v;x.lang=v.lang}
      x.onend=done;x.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')done()};speechSynthesis.speak(x)}catch(e){talk.timer=setTimeout(done,2500)}};
  const play=()=>{L.playing=true;btn();try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{talk.lock=l}).catch(()=>{})}catch(e){}say()};
  const pause=()=>{L.playing=false;btn();stopTalk()};
  const jump=i=>{L.i=Math.max(0,Math.min(U.length-1,i));if(L.playing)say();else{stopTalk();show()}};
  show();btn();
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='lplay'){L.playing?pause():play()}
    if(b.id==='lprev')jump(L.i-1);if(b.id==='lnext')jump(L.i+1);
    if(b.id==='lrep')say();
    if(b.classList.contains('u'))jump(+b.dataset.i)};
  app.onchange=e=>{const t=e.target;
    if(t.id==='lch'){stopTalk();sub.le={n:+t.value};render();window.scrollTo(0,0)}
    if(t.id==='lsec')jump(+t.value);
    if(t.id==='lrate'){P.rate=+t.value;save();if(L.playing)say()}
    if(t.id==='lsub'){P.sub=t.value;save();show()}
    if(t.id==='lvoice'){P.voice=t.value;save();if(L.playing)say()}};
}

/* ---------- Thi thử ---------- */
function buildRandom(){const off=QS.filter(q=>/^Q\d/.test(q.id));const out=[];
  CH.forEach(c=>{const need=off.filter(q=>chOf(q)===c.n).length;out.push(...shuffle(QS.filter(q=>chOf(q)===c.n&&q.select)).slice(0,need))});return out.map(q=>q.id)}
function thi(){
  clearInterval(tick);const X=S.exam;
  if(!X){app.innerHTML=`<h1>Thi thử</h1><p class="muted">Làm bài có tính giờ, không hiện đáp án cho đến khi nộp. Đạt khi được từ 65% tổng điểm.</p>
    <div class="panel stack"><div class="row"><label for="xform">Đề</label><select id="xform"><option value="off">Đề mẫu A của ISTQB (Q1–Q40, đúng thứ tự)</option><option value="rnd">Đề ngẫu nhiên 40 câu từ ngân hàng (cùng tỷ lệ theo chương)</option></select></div>
     <div class="row"><label for="xtime">Thời gian</label><select id="xtime"><option value="60">60 phút</option><option value="75">75 phút (không thi bằng tiếng mẹ đẻ)</option><option value="0">Không tính giờ</option></select></div>
     <div class="row"><button class="btn pri" id="xgo">Bắt đầu làm bài</button></div></div>`;
    app.onchange=null;app.onclick=e=>{if(e.target.id==='xgo'){const f=$('#xform').value,m=+$('#xtime').value;
      S.exam={name:f==='off'?'Đề mẫu A':'Đề ngẫu nhiên',list:f==='off'?QS.filter(q=>/^Q\d/.test(q.id)).map(q=>q.id):buildRandom(),ans:{},flag:{},i:0,limit:m*60,used:0,done:false};save();render();window.scrollTo(0,0)}};return}
  const qs=X.list.map(id=>QBY[id]),q=qs[X.i],total=qs.reduce((s,x)=>s+x.points,0);
  const right=x=>sameSet(X.ans[x.id]||[],x.correct);
  const mapBtn=(x,i)=>`<button data-j="${i}" class="${i===X.i?'cur ':''}${X.done?(right(x)?'ok':'bad'):((X.ans[x.id]||[]).length?'ans ':'')+(X.flag[x.id]?'flag':'')}" aria-label="Câu ${i+1}">${i+1}</button>`;
  if(!X.done){
    const un=qs.filter(x=>(X.ans[x.id]||[]).length<x.select).length;
    app.innerHTML=`<div class="examgrid"><div class="stack"><div class="panel">${qHTML(q,X.ans[q.id]||[],false,'Câu '+(X.i+1)+'/'+qs.length)}</div>
      <div class="row"><button class="btn" id="xp" ${X.i?'':'disabled'}>← Trước</button><button class="btn" id="xf">${X.flag[q.id]?'Bỏ đánh dấu':'Đánh dấu xem lại'}</button><button class="btn pri" id="xn" ${X.i<qs.length-1?'':'disabled'}>Tiếp →</button></div></div>
     <div class="panel stack"><div><div class="small muted">${X.limit?'Thời gian còn lại':'Thời gian đã làm'}</div><div class="timer" id="tm"></div></div>
      <div class="map">${qs.map(mapBtn).join('')}</div><div class="small muted">Nền xanh: đã trả lời · Gạch vàng: đánh dấu xem lại</div>
      <div id="sub" class="stack">${sub.confirm?`<div>Nộp bài? ${un?`Còn <b>${un}</b> câu chưa trả lời đủ.`:'Bạn đã trả lời hết.'}</div><div class="row"><button class="btn pri" id="xyes">Nộp bài</button><button class="btn" id="xno">Làm tiếp</button></div>`:'<button class="btn pri" id="xsub">Nộp bài</button>'}
      <button class="btn small" id="xquit">Huỷ bài thi</button></div></div></div>`;
    const tm=$('#tm'),show=()=>{const left=X.limit-X.used;tm.textContent=fmt(X.limit?left:X.used);tm.classList.toggle('low',X.limit>0&&left<300)};show();
    const finish=()=>{clearInterval(tick);X.done=true;sub.confirm=false;let sc=0;qs.forEach(x=>{if((X.ans[x.id]||[]).length){if(mark(x,X.ans[x.id]))sc+=x.points}});
      X.score=sc;S.hist.push({date:new Date().toLocaleString('vi-VN'),name:X.name,score:sc,total,pass:sc/total>=.65,used:X.used});X.i=0;save();render();window.scrollTo(0,0)};
    tick=setInterval(()=>{X.used++;if(X.used%10===0)save();if(X.limit&&X.used>=X.limit)finish();else show()},1000);
    app.onchange=e=>{if(e.target.name==='opt'){X.ans[q.id]=readPick(q,X.ans[q.id]||[],e.target);save();render()}};
    app.onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.id;
      if(b.dataset.j){X.i=+b.dataset.j;render()} if(id==='xp'){X.i--;render()} if(id==='xn'){X.i++;render()}
      if(id==='xf'){X.flag[q.id]=!X.flag[q.id];save();render()}
      if(id==='xsub'){sub.confirm=true;render()} if(id==='xno'){sub.confirm=false;render()} if(id==='xyes')finish();
      if(id==='xquit'){if(sub.quit){S.exam=null;sub.quit=false;save();render()}else{sub.quit=true;b.textContent='Bấm lần nữa để huỷ bài thi'}}};
    return}
  const pass=X.score/total>=.65;
  app.onchange=null;
  app.innerHTML=`<div class="panel stack"><h2>Kết quả: ${esc(X.name)}</h2><div class="verdict ${pass?'ok':'bad'}">${pass?'ĐẠT':'CHƯA ĐẠT'} · ${X.score}/${total} điểm (${Math.round(X.score/total*100)}%)</div>
    <div class="muted">Cần ${Math.ceil(total*.65)} điểm để đạt · Thời gian làm bài ${fmt(X.used)} · Đúng ${qs.filter(right).length}/${qs.length} câu</div>
    ${CH.map(c=>{const l=qs.filter(x=>chOf(x)===c.n);if(!l.length)return'';const g=l.filter(right).reduce((s,x)=>s+x.points,0),t=l.reduce((s,x)=>s+x.points,0);
      return `<div class="chrow"><div>${esc(one(c.title))}</div><div class="row"><div class="meter"><i style="width:${g/t*100}%"></i></div></div><span class="mono small">${g}/${t} điểm</span></div>`}).join('')}
    <div class="row"><button class="btn pri" id="xnew">Thi lại đề khác</button><button class="btn" id="xwrong">Luyện lại các câu sai</button></div></div>
   <div class="panel stack"><b>Xem lại từng câu</b><div class="map">${qs.map(mapBtn).join('')}</div></div>
   <div class="panel">${qHTML(q,X.ans[q.id]||[],true,'Câu '+(X.i+1)+'/'+qs.length)}</div>
   <div class="row"><button class="btn" id="xp" ${X.i?'':'disabled'}>← Trước</button><button class="btn pri" id="xn" ${X.i<qs.length-1?'':'disabled'}>Tiếp →</button></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.j){X.i=+b.dataset.j;render()} if(b.id==='xp'){X.i--;render()} if(b.id==='xn'){X.i++;render()}
    if(b.id==='xnew'){S.exam=null;save();render()}
    if(b.id==='xwrong'){const w=qs.filter(x=>!right(x)).map(x=>x.id);S.exam=null;save();if(w.length){sub.prac={list:w,i:0,pick:[],rev:false,ok:0,ch:CH.map(c=>c.n)};go('luyentap')}else render()}};
}
route();render();
</script>
