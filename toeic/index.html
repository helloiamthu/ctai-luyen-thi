      <div class="panel stack"><div class="small muted">Muốn nói: <span class="vi">${esc(x.vi)}</span></div><b>Câu nào đúng, tự nhiên?</b></div>
      <div class="stack">${m.cur.ch.map(k=>`<button class="mcard ${m.shown!=null?(k===0?'done':k===m.shown?'bad':''):''}" data-k="${k}">${esc(txt(k))}</button>`).join('')}</div>
      ${m.shown!=null?`<div class="expl"><b>${esc(x.right)}</b> ${spk(x.right)}<div class="small">${esc(x.why)}</div></div><div class="row"><button class="btn pri" id="gn">${m.i+1<m.order.length?'Câu tiếp →':'Xem kết quả'}</button></div>`:''}`;
    app.onclick=e=>{if(base(e))return;if(e.target.id==='gn'){m.i++;m.cur=null;m.shown=null;render();return}
      const b=e.target.closest('.mcard');if(!b||m.shown!=null)return;m.shown=+b.dataset.k;if(m.shown===0){m.ok++;G.mis[a]=1}else m.wrong.push(a);save();render()};return}

  /* ----- một chủ đề ----- */
  const T=PH.find(t=>t.n===m.n),W=T.items,i0=PH.indexOf(T);
  const head=`<div class="row"><button class="btn small" id="gb">← Các chủ đề</button><span class="muted small">Thuộc ${W.filter(x=>G.known[x.en]).length}/${W.length}</span></div>
    <div class="stack"><h1>${T.n}. ${esc(T.en)}</h1><div class="vi">${esc(T.vi)}</div></div>
    <div class="seg" role="group" aria-label="Cách học">${[['list','Danh sách'],['dlg','Hội thoại'],['card','Thẻ ghi nhớ'],['quiz','Trắc nghiệm'],['order','Sắp xếp câu']].map(([k,l])=>`<button data-mode="${k}" aria-pressed="${m.mode===k}">${l}</button>`).join('')}</div>`;
  const base=e=>{if(say(e))return true;const b=e.target.closest('button');if(!b)return false;
    if(b.id==='gb'){sub.gq={q:''};render();return true}
    if(b.dataset.mode){sub.gq={q:'',n:T.n,mode:b.dataset.mode};render();return true}
    if(b.id==='gnx'){sub.gq={q:'',n:PH[i0+1].n,mode:'list'};render();window.scrollTo(0,0);return true}
    return false};
  const next=i0<PH.length-1?'<button class="btn" id="gnx">Chủ đề sau →</button>':'';
  const lvc=x=>x.lv&&LV[x.lv]?`<span class="chip lv-${x.lv}">${LV[x.lv]}</span>`:'';
  if(m.mode==='list'){
    app.innerHTML=head+`<div class="panel">${W.map(x=>`<div class="wrow"><div><span class="w">${esc(x.en)}</span> ${lvc(x)}<div class="vi">${esc(x.vi)}</div>${x.note?`<div class="small muted">${esc(x.note)}</div>`:''}</div>
      <div class="row">${spk(x.en)}<label class="ck small"><input type="checkbox" data-k="${esc(x.en)}" ${G.known[x.en]?'checked':''}><span>Đã thuộc</span></label></div></div>`).join('')}</div>
      <div class="row"><button class="btn pri" data-mode="dlg">Nghe hội thoại mẫu</button><button class="btn" data-mode="card">Học bằng thẻ</button>${next}</div>`;
    app.onchange=e=>{const k=e.target.dataset.k;if(k){if(e.target.checked)G.known[k]=1;else delete G.known[k];save();render()}};
    app.onclick=base;return}
  if(m.mode==='dlg'){
    const L=T.dlg||[];
    app.innerHTML=head+`<div class="panel stack"><div class="row">${canSpeak?'<button class="btn pri small" id="gplay">▶ Nghe cả đoạn</button><button class="btn small" id="gstop">■ Dừng</button>':''}<label class="ck small"><input type="checkbox" id="ghide" ${m.hide?'checked':''}><span>Ẩn tiếng Việt</span></label><label class="ck small"><input type="checkbox" id="grole" ${m.role?'checked':''}><span>Tôi đóng vai B (ẩn câu của B)</span></label></div>
      <div class="dlg">${L.map((l,i)=>{const hid=m.role&&l.s==='B'&&!(m.open||{})[i];return `<div class="dl dl-${l.s==='B'?'b':'a'}"><span class="who">${esc(l.s)}</span><div>${hid?`<button class="btn small" data-open="${i}">Hiện câu của B</button><div class="vi small">${esc(l.vi)}</div>`:`<div>${esc(l.en)}</div>${m.hide?'':`<div class="vi small">${esc(l.vi)}</div>`}`}</div>${hid?'':spk(l.en)}</div>`}).join('')}</div>
      <p class="small muted">Mẹo: bật "Tôi đóng vai B", đọc to câu trả lời của B theo phần tiếng Việt, rồi bấm hiện để so.</p></div>
      <div class="row"><button class="btn" data-mode="order">Luyện sắp xếp câu</button>${next}</div>`;
    app.onchange=e=>{if(e.target.id==='ghide'){m.hide=e.target.checked;render()}if(e.target.id==='grole'){m.role=e.target.checked;m.open={};render()}};
    app.onclick=e=>{if(base(e))return;const id=e.target.id;if(id==='gplay')sayLines(L);if(id==='gstop')try{speechSynthesis.cancel()}catch(x){}
      const o=e.target.closest('[data-open]');if(o){(m.open||(m.open={}))[o.dataset.open]=1;render()}};return}
  if(m.mode==='card'){
    if(!m.order){m.order=shuffle(W.map((_,i)=>i));m.i=0;m.flip=false}
    if(m.i>=m.order.length){app.innerHTML=head+`<div class="panel stack"><h2>Hết bộ thẻ</h2><div>Bạn đã thuộc ${W.filter(x=>G.known[x.en]).length}/${W.length} câu của chủ đề này.</div><div class="row"><button class="btn pri" data-mode="card">Học lại</button><button class="btn" data-mode="quiz">Làm trắc nghiệm</button></div></div>`;app.onclick=base;return}
    const x=W[m.order[m.i]];
    app.innerHTML=head+`<div class="panel card" id="gcard" tabindex="0" role="button" aria-label="Lật thẻ"><div class="small muted">Nói câu này bằng tiếng Anh:</div><div class="term" style="font-size:20px">${esc(x.vi)}</div>
      ${m.flip?`<div class="w" style="font-size:18px"><b>${esc(x.en)}</b> ${lvc(x)}</div>${x.note?`<div class="muted small">${esc(x.note)}</div>`:''}`:'<div class="muted small">Tự nói to trước, rồi bấm vào thẻ để xem câu chuẩn</div>'}</div>
      <div class="row"><span class="mono">${m.i+1}/${m.order.length}</span>${m.flip?spk(x.en):''}<button class="btn" id="gno">Chưa thuộc</button><button class="btn pri" id="gyes">Đã thuộc</button></div>`;
    app.onclick=e=>{if(base(e))return;if(e.target.closest('#gcard')){m.flip=!m.flip;render();return}
      const id=e.target.id;if(id==='gyes'||id==='gno'){if(id==='gyes')G.known[x.en]=1;else delete G.known[x.en];save();m.i++;m.flip=false;render()}};
    app.onkeydown=e=>{if(e.target.id==='gcard'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();m.flip=!m.flip;render();$('#gcard').focus()}};return}
  if(m.mode==='quiz'){
    if(!m.order){m.order=shuffle(W.map((_,i)=>i));m.i=0;m.ok=0;m.wrong=[]}
    if(m.i>=m.order.length){if(!m.saved){m.saved=true;G.best[T.n]=Math.max(G.best[T.n]||0,m.ok);save()}
      app.innerHTML=head+`<div class="panel stack"><h2>Kết quả trắc nghiệm</h2><div class="verdict ${m.ok===W.length?'ok':''}">${m.ok}/${W.length} câu đúng</div>
        ${m.wrong.length?`<div><b>Cần ôn lại:</b></div>${m.wrong.map(i=>`<div><b>${esc(W[i].en)}</b> <span class="vi">${esc(W[i].vi)}</span></div>`).join('')}`:'<div>Bạn trả lời đúng hết.</div>'}
        <div class="row"><button class="btn pri" data-mode="quiz">Làm lại</button><button class="btn" data-mode="order">Sắp xếp câu</button>${next}</div></div>`;app.onclick=base;return}
    const a=m.order[m.i],x=W[a];
    if(!m.cur)m.cur={ch:shuffle([a,...shuffle(W.map((_,i)=>i).filter(i=>i!==a)).slice(0,3)])};
    app.innerHTML=head+`<div class="row"><span class="mono">Câu ${m.i+1}/${m.order.length}</span><div class="meter"><i style="width:${m.i/m.order.length*100}%"></i></div><span class="chip ok">${m.ok} đúng</span></div>
      <div class="panel stack"><div class="small muted">Câu tiếng Anh nào diễn đạt đúng ý này?</div><div class="term" style="font-size:19px;font-weight:700">${esc(x.vi)}</div></div>
      <div class="stack">${m.cur.ch.map(i=>`<button class="mcard ${m.shown!=null?(i===a?'done':i===m.shown?'bad':''):''}" data-i="${i}">${esc(W[i].en)}</button>`).join('')}</div>
      ${m.shown!=null?`<div class="expl"><b>${esc(x.en)}</b> ${spk(x.en)}${x.note?`<div class="small">${esc(x.note)}</div>`:''}</div><div class="row"><button class="btn pri" id="gq">${m.i+1<m.order.length?'Câu tiếp →':'Xem kết quả'}</button></div>`:''}`;
    app.onclick=e=>{if(base(e))return;if(e.target.id==='gq'){m.i++;m.cur=null;m.shown=null;render();return}
      const b=e.target.closest('.mcard');if(!b||m.shown!=null)return;m.shown=+b.dataset.i;if(m.shown===a){m.ok++;G.known[x.en]=1}else{m.wrong.push(a);delete G.known[x.en]}save();render()};return}
  // order: sắp xếp từ thành câu
  if(!m.order){m.order=shuffle(W.map((_,i)=>i)).slice(0,10);m.i=0;m.ok=0}
  if(m.i>=m.order.length){app.innerHTML=head+`<div class="panel stack"><h2>Xong!</h2><div class="verdict ${m.ok===m.order.length?'ok':''}">Đúng ngay lần đầu ${m.ok}/${m.order.length} câu</div><div class="row"><button class="btn pri" data-mode="order">Làm 10 câu khác</button><button class="btn" data-mode="quiz">Làm trắc nghiệm</button>${next}</div></div>`;app.onclick=base;return}
  const x=W[m.order[m.i]],toks=x.en.split(/\s+/);
  if(!m.cur){let p=shuffle(toks.map((_,i)=>i));if(toks.length>1&&p.every((v,i)=>v===i))p.reverse();m.cur={pool:p,ans:[],miss:0}}
  const c=m.cur,built=c.ans.map(i=>toks[i]).join(' '),full=c.ans.length===toks.length,right=full&&built===x.en;
  app.innerHTML=head+`<div class="row"><span class="mono">Câu ${m.i+1}/${m.order.length}</span><div class="meter"><i style="width:${m.i/m.order.length*100}%"></i></div><span class="chip ok">${m.ok} đúng</span></div>
    <div class="panel stack"><div class="small muted">Xếp các từ thành câu tiếng Anh có nghĩa:</div><div class="vi" style="font-size:17px"><b>${esc(x.vi)}</b></div>
      <div class="ans ${full?(right?'ok':'bad'):''}" aria-live="polite">${c.ans.map((i,j)=>`<button class="tok" data-a="${j}" ${right?'disabled':''}>${esc(toks[i])}</button>`).join('')||'<span class="muted small">Chạm vào các từ bên dưới theo đúng thứ tự</span>'}</div>
      <div class="pool">${c.pool.map(i=>c.ans.includes(i)?'':`<button class="tok" data-p="${i}">${esc(toks[i])}</button>`).join('')}</div>
      ${full&&!right?'<div class="small" style="color:var(--bad,#b42318)">Chưa đúng thứ tự. Chạm vào từ ở trên để gỡ ra và xếp lại.</div>':''}
      ${right||c.giveup?`<div class="expl"><b>${esc(x.en)}</b> ${spk(x.en)}${x.note?`<div class="small">${esc(x.note)}</div>`:''}</div>`:''}</div>
    <div class="row">${right||c.giveup?`<button class="btn pri" id="gon">${m.i+1<m.order.length?'Câu tiếp →':'Xem kết quả'}</button>`:'<button class="btn small" id="gclr">Xếp lại</button><button class="btn small" id="ggive">Xem đáp án</button>'}</div>`;
  if(right&&!c.counted){c.counted=true;if(!c.miss&&!c.giveup)m.ok++;speak(x.en)}
  app.onclick=e=>{if(base(e))return;const b=e.target.closest('button');if(!b)return;
    if(b.id==='gon'){m.i++;m.cur=null;render();return}
    if(b.id==='gclr'){c.ans=[];render();return}
    if(b.id==='ggive'){c.giveup=true;c.ans=toks.map((_,i)=>i);render();return}
    if(b.dataset.p!=null){c.ans.push(+b.dataset.p);if(c.ans.length===toks.length&&c.ans.map(i=>toks[i]).join(' ')!==x.en)c.miss++;render();return}
    if(b.dataset.a!=null){c.ans.splice(+b.dataset.a,1);render()}};
}

function phim(){
  const F=S.film||(S.film={seen:{},notes:{},mine:[]}),m=sub.fm||(sub.fm={});

    app.innerHTML=`<div class="stack"><h1>Phim ngắn học tiếng Anh</h1><p class="muted">Xem phim ngắn và video trên YouTube với phụ đề tiếng Anh bật sẵn, ghi lại từ mới ngay bên dưới. Bạn cũng có thể dán link YouTube bất kỳ để thêm vào danh sách của mình.</p></div>
      ${groups.map(g=>`<div class="stack"><h3>${esc(g)}</h3><div class="fgrid">${all.filter(f=>f.g===g).map(f=>`<button class="fcard" data-id="${f.id}"><img class="th" loading="lazy" alt="" src="https://i.ytimg.com/vi/${f.id}/mqdefault.jpg" onerror="this.removeAttribute('src')"><span><b>${esc(f.t)}</b></span><span class="small muted">${esc(f.by)}${f.m?' · khoảng '+f.m+' phút':''}</span>${f.d?`<span class="small">${esc(f.d)}</span>`:''}<span>${F.seen[f.id]?'<span class="chip ok">Đã xem</span>':''}${F.notes[f.id]?' <span class="chip">Có ghi chú</span>':''}</span></button>`).join('')}</div></div>`).join('')}
      <div class="panel stack"><b>Thêm video của bạn</b><div class="row"><input type="url" id="fu" placeholder="Dán link YouTube" aria-label="Link YouTube"><input type="text" id="ft" placeholder="Tên gợi nhớ (không bắt buộc)" aria-label="Tên video"><button class="btn pri" id="fadd">Thêm</button></div><div class="small" id="fmsg" style="color:var(--bad)"></div>
        <div class="small muted">Nên chọn video có phụ đề tiếng Anh (biểu tượng CC trên YouTube). Danh sách tự thêm chỉ lưu trên trình duyệt này.</div></div>`;
    app.onclick=e=>{const c=e.target.closest('.fcard');if(c){sub.fm={id:c.dataset.id};render();window.scrollTo(0,0);return}
      if(e.target.id==='fadd'){const id=ytId($('#fu').value);if(!id){$('#fmsg').textContent='Link chưa đúng. Hãy dán link dạng youtube.com/watch?v=... hoặc youtu.be/...';return}
        if(all.some(f=>f.id===id)){$('#fmsg').textContent='Video này đã có trong danh sách.';return}
        F.mine.push({id,t:$('#ft').value.trim()});save();sub.fm={id};render();window.scrollTo(0,0)}};return}
  const f=all.find(x=>x.id===m.id)||{id:m.id,t:'Video',by:''};
  app.innerHTML=`<div class="row"><button class="btn small" id="fb">← Danh sách phim</button></div>

const ABBR=/\b(e\.g|i\.e|etc|vs|cf|approx|v\.v|Fig|No)\./g;
function sentences(t){t=String(t||'').replace(/\s+/g,' ').trim();if(!t)return[];
  const p=t.replace(ABBR,m=>m.replace(/\./g,'\u0002')).replace(/([.!?]["”’)]?)\s+(?=["“‘(]?[A-ZÀ-ỸĐ0-9])/g,'$1\u0001').split('\u0001');
  return p.map(x=>x.replace(/\u0002/g,'.').trim()).filter(Boolean)}
const cellText=t=>String(t||'').replace(/^[•◦▪]\s*/gm,'').split(/\s*\n\s*/).map(x=>x.trim()).filter(Boolean).map(x=>/[.!?:;]$/.test(x)?x:x+'.').join(' ');
function learnUnits(c){const out=[];let on=false,sec=null,img=null;
  const push=u=>{u.sec=sec;if(img){u.img=img;img=null}out.push(u)};
  for(const b of c.blocks){
    if(!on){if(b.type==='h2')on=true;else continue}
    if(b.type==='figure'){img=b.img||null;continue}
    if(b.type==='table'){if(/^(AI|HO)-\d/.test(b.rows[0]&&b.rows[0][0]?b.rows[0][0].en:''))continue;
      b.rows.forEach((r,i)=>{if(b.header&&i===0)return;const en=r.map(x=>cellText(x.en)).filter(Boolean).join(' '),vi=r.map(x=>cellText(x.vi||x.en)).filter(Boolean).join(' ');if(en)push({en,vi})});continue}
    if(/^h\d$/.test(b.type)){if(b.type==='h2'||b.type==='h3')sec=b;push({en:b.en,vi:b.vi,head:true});continue}
    const E=sentences(b.en),V=sentences(b.vi);
    if(E.length===V.length)E.forEach((e,k)=>push({en:e,vi:V[k]}));else E.forEach(e=>push({en:e,vi:b.vi}))}
  return out}
const sayText=t=>t.replace(/^\d+(\.\d+)*\s+/,'').replace(/\be\.g\.,?/g,'for example,').replace(/\bi\.e\.,?/g,'that is,').replace(/\betc\./g,'et cetera.').replace(/[®™]/g,'').replace(/\s[–—]\s/g,', ').replace(/\//g,' or ');

function etsVoice(s){let vs=[];try{vs=hasTTS?speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)):[]}catch(e){}
  vs.sort((a,b)=>(/en[-_]US/i.test(b.lang)?1:0)-(/en[-_]US/i.test(a.lang)?1:0));
  const F=vs.filter(v=>/female|zira|aria|jenny|samantha|susan|hazel|libby|sonia|natasha|karen|moira|tessa|fiona|victoria|ava|allison|emma|michelle|google us english$/i.test(v.name)&&!/\bmale/i.test(v.name)),
    M=vs.filter(v=>/\bmale|david|mark|guy|daniel|george|ryan|william|alex|fred|aaron|james|christopher|eric|thomas|oliver/i.test(v.name));
  const w=/^W/.test(s),two=/2$/.test(s),pool=w?F:M;
  if(pool.length)return {v:pool[two&&pool.length>1?1:0],p:two&&pool.length<2?(w?1.25:.85):1};
  return {v:vs[0]||null,p:w?(two?1.35:1.15):(two?.95:.75)}}
function etsPlay(items,done){stopTalk();if(!hasTTS)return;const tok=talk.token,rate=ek().rate||.95,flat=[];
  items.forEach(it=>{if(it.t)sentences(it.t).forEach(t=>flat.push({t,s:it.s}));flat.push({pause:it.pause||450})});
  let i=0;etsOn=true;
  const next=()=>{if(tok!==talk.token)return;if(i>=flat.length){etsOn=false;done&&done();return}const x=flat[i++];
    if(x.pause){talk.timer=setTimeout(next,x.pause);return}
    const u=new SpeechSynthesisUtterance(x.t),v=etsVoice(x.s);if(v.v){u.voice=v.v;u.lang=v.v.lang}else u.lang='en-US';u.pitch=v.p;u.rate=rate;
    u.onend=u.onerror=()=>{if(tok===talk.token)talk.timer=setTimeout(next,80)};speechSynthesis.speak(u)};
  try{speechSynthesis.cancel()}catch(e){}next()}
const rng=u=>u.from===u.to?'Question '+u.from:'Questions '+u.from+' through '+u.to;
function etsAudio(u){const d=u.d,a=u.i%2?'M':'W',b=a==='M'?'W':'M',out=[{s:'N',t:rng(u)+'.',pause:300}];
  if(u.p===1)d.o.forEach((o,k)=>out.push({s:a,t:LET[k]+'. '+o,pause:700}));
  if(u.p===2){out.push({s:a,t:d.q,pause:800});d.o.forEach((o,k)=>out.push({s:b,t:LET[k]+'. '+o,pause:700}))}
  if(u.p===3){const sp=new Set(d.conv.map(l=>l.s)).size;out[0].t=rng(u)+' refer to the following conversation'+(sp>2?' with three speakers.':d.graphic?' and graphic.':'.');d.conv.forEach(l=>out.push({s:l.s,t:l.t,pause:250}))}
  if(u.p===4){out[0].t=rng(u)+' '+String(d.intro||'').replace(/^Questions?(\s+\d+[-–]\d+)?\s*/i,'').replace(/\s+/g,' ').trim()||rng(u)+'.';out.push({s:a,t:d.talk})}
  if(u.p>=3)u.qs.forEach(q=>out.push({s:'N',t:q.n+'. '+q.q,pause:1800}));return out}
const ePlayBtn=()=>hasTTS?`<button class="btn pri" id="eplay">▶ Phát audio</button><label class="small muted">Tốc độ <select id="erate">${[[.8,'Chậm'],[.95,'Vừa'],[1.05,'Như thi thật']].map(([v,l])=>`<option value="${v}" ${(ek().rate||.95)==v?'selected':''}>${l}</option>`).join('')}</select></label>`:'<span class="small muted">Trình duyệt không hỗ trợ đọc tiếng Anh, hãy đọc lời thoại sau khi kiểm tra.</span>';
function etsAudioClick(e,u){const b=e.target.closest('#eplay');if(!b)return false;
  if(etsOn){stopTalk();etsOn=false;b.textContent='▶ Phát audio'}else{b.textContent='■ Dừng';etsPlay(etsAudio(u),()=>{const x=$('#eplay');if(x)x.textContent='▶ Nghe lại'})}return true}
function etsRateChange(e){if(e.target.id==='erate'){ek().rate=+e.target.value;save();return true}}

/* hiển thị một cụm câu hỏi */
const etab=g=>`<div class="tw"><div class="small muted"><b>${esc(g.title||'Graphic')}</b></div><table>${(g.rows||[]).map((r,i)=>`<tr>${r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</table></div>`;
function uHTML(u,ans,rev,show){const d=u.d,vi=S.lang!=='en';
  let h=`<div class="row"><span class="chip k">Part ${u.p}</span><b>${u.from===u.to?'Câu '+u.from:'Câu '+u.from+'–'+u.to}</b><span class="muted small">${PART[u.p][0]} · ${PART[u.p][1]}</span></div>`;
  if(u.p<=4)h+=`<div class="row">${ePlayBtn()}</div>`;
  if(u.p===1)h+=`<div class="photo"><div class="small muted">Ảnh (mô tả bằng lời thay cho hình trong đề)</div><div>${esc(d.scene)}</div></div>`;
  if(u.p===4&&d.intro)h+=`<div class="small muted">${esc(d.intro)}</div>`;
  if(d.graphic)h+=etab(d.graphic);
  if(u.p===6){let k=0;h+=(d.intro?`<div class="small muted">${esc(d.intro)}</div>`:'')+`<div class="passage">${esc(d.text).replace(/\{(\d)\}/g,(m,x)=>{const q=u.qs[+x-1];if(!q)return m;const p=ans[q.n];
    return rev?`<span class="blank ok">${q.n}. ${esc(q.o[q.a])}</span>`:`<span class="blank">${q.n}${p!=null?' · '+LET[p]:''}</span>`})}</div>`}
  if(u.p===7)h+=(d.intro?`<div class="small muted">${esc(d.intro)}</div>`:'')+d.docs.map(x=>`<div class="passage"><div class="small muted mono">${esc(x.kind||'')}</div>${esc(x.text)}</div>`).join('');
  const hide=u.p<=2&&!rev&&!show;
  h+=u.qs.map(q=>{const pk=ans[q.n];
    const stem=q.q?esc(q.q).replace(/-{4,}/g,'<span class="blank">&nbsp;</span>'):u.p===1?'Chọn câu mô tả đúng nhất bức ảnh.':u.p===2?'Mark your answer.':u.p===6?'Chọn đáp án cho chỗ trống '+q.n+'.':'';
    return `<div class="eq stack"><div><b class="mono">${q.n}.</b> ${stem}</div><div class="eopts${hide?' row':''}">${q.o.map((o,k)=>{const sel=pk===k,cls=rev?(k===q.a?'right':sel?'wrong':''):sel?'sel':'';
      return `<button class="opt ${cls}" data-n="${q.n}" data-k="${k}" ${rev?'disabled':''}><span class="k">(${LET[k]})</span>${hide?'':`<span class="tx">${esc(o)}</span>`}${rev&&k===q.a?'<span class="tag">Đáp án</span>':rev&&sel?'<span class="tag">Bạn chọn</span>':''}</button>`}).join('')}</div>
      ${rev?`<div class="expl small">${pk==null?'<b>Chưa trả lời.</b> ':''}${esc(q.ex)}</div>`:''}</div>`}).join('');
  if(rev){let t='';
    if(u.p===2)t=`<div><b>${esc(d.q)}</b>${vi&&d.vi?`<div class="vi">${esc(d.vi)}</div>`:''}</div>`;
    if(u.p===3)t=`<div class="dlg">${d.conv.map(l=>`<div class="dl"><span class="who">${esc(l.s)}</span><div>${esc(l.t)}${vi&&l.vi?`<div class="vi small">${esc(l.vi)}</div>`:''}</div><span></span></div>`).join('')}</div>`;
    if(u.p===4)t=`<div class="passage">${esc(d.talk)}</div>${vi&&d.vi?`<div class="vi small">${esc(d.vi)}</div>`:''}`;
    if(u.p===5&&vi&&d.vi)t=`<div class="vi">${esc(d.vi)}</div>`;
    if(u.p===6&&vi&&d.vi)t=`<div class="vi small" style="white-space:pre-wrap">${esc(d.vi)}</div>`;
    if(t)h+=`<details class="tr" open><summary>${u.p<=4?'Lời thoại'+(vi?' và bản dịch':''):'Bản dịch'}</summary><div class="stack" style="margin-top:8px">${t}</div></details>`}
  return h}
// chọn đáp án mà không vẽ lại trang (để audio không bị ngắt)
function ePick(e,ans){const b=e.target.closest('.opt[data-n]');if(!b||b.disabled)return null;const n=+b.dataset.n,k=+b.dataset.k;ans[n]=k;
  b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));
  const bl=[...app.querySelectorAll('.passage .blank')].find(x=>x.textContent.split(' ')[0]===String(n));if(bl)bl.textContent=n+' · '+LET[k];
  const m=app.querySelector(`.map button[data-q="${n}"]`);if(m)m.classList.add('ans');return n}

function luyende(){const E=ek();
  if(E.exam)return etsExam();if(sub.ep)return etsPrac();
  const last=E.hist.slice(-8).reverse();
  app.innerHTML=`<div class="hero"><span class="eyebrow">TOEIC Listening &amp; Reading · format 2026</span><h1>Luyện đề theo bộ ETS 2026</h1>
    <p class="muted">${ETS.length} đề đầy đủ, mỗi đề 200 câu chia 7 Part đúng cấu trúc, dạng câu hỏi và thứ tự như sách ETS TOEIC 2026. Phần nghe được đọc bằng giọng máy (nam, nữ, nhiều giọng). Mỗi câu có giải thích tiếng Việt, lời thoại và bản dịch.</p></div>
  <div class="panel stack"><h3>Cấu trúc đề</h3><div class="facts"><div class="fact"><b>200</b>câu (100 nghe + 100 đọc)</div><div class="fact"><b>120′</b>45′ nghe + 75′ đọc</div><div class="fact"><b>10–990</b>thang điểm</div><div class="fact"><b>7</b>Part</div></div>
    ${[1,2,3,4,5,6,7].map(p=>`<div class="chrow"><div><b>Part ${p}</b> · ${PART[p][1]}<div class="small muted">${PDIR[p]}</div></div><span class="mono small">${{1:6,2:25,3:39,4:30,5:30,6:16,7:54}[p]} câu</span><span class="mono small">${p<=4?'Nghe':'Đọc'}</span></div>`).join('')}
    <p class="small muted">Đề do mình tự biên soạn bám theo format sách ETS 2026, không sao chép câu hỏi gốc của ETS (có bản quyền). Điểm quy đổi chỉ là ước tính.</p></div>
  ${ETS.map(t=>{const b=E.best[t.id];return `<div class="panel stack"><div class="row"><h2 style="flex:1">${esc(t.title)}</h2>${b?`<span class="chip ok">Cao nhất ${b.total} điểm</span>`:''}</div>
    <div class="row">${Object.entries(SCOPE).map(([k,s])=>`<button class="btn ${k==='full'?'pri':''}" data-x="${t.id}" data-s="${k}">${s.l} · ${s.min}′</button>`).join('')}</div>
    <div class="small muted">Luyện từng Part (chấm ngay từng cụm, xem giải thích):</div>
    <div class="row">${[1,2,3,4,5,6,7].map(p=>{const r=E.prac[t.id+'-'+p];return `<button class="btn small" data-t="${t.id}" data-p="${p}">Part ${p}${r?` · ${r.ok}/${r.n}`:''}</button>`}).join('')}</div></div>`}).join('')}
  ${last.length?`<div class="panel stack"><h3>Lịch sử thi</h3>${last.map(h=>`<div class="chrow"><div>${esc(h.name)}<div class="small muted">${esc(h.date)} · ${fmt(h.used)}</div></div><span class="mono small">L ${h.L??'–'} · R ${h.R??'–'}</span><b class="mono">${h.total}</b></div>`).join('')}</div>`:''}`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.x){const t=+b.dataset.x,s=SCOPE[b.dataset.s];E.exam={t,scope:b.dataset.s,parts:s.parts,ans:{},i:0,limit:s.min*60,used:0,done:false};save();render();window.scrollTo(0,0)}
    if(b.dataset.p){sub.ep={t:+b.dataset.t,p:+b.dataset.p,i:0,ans:{},rev:{},ok:0,n:0,show:false};render();window.scrollTo(0,0)}}}

function etsPrac(){const E=ek(),P=sub.ep,T=ETS.find(t=>t.id===P.t),U=etsUnits(T).filter(u=>u.p===P.p),key=P.t+'-'+P.p;
  const head=`<div class="row"><button class="btn small" id="eback">← Danh sách đề</button><b>${esc(T.title)} · Part ${P.p}</b><span class="muted small">${PART[P.p][1]}</span></div>`;
  if(P.i>=U.length){if(!P.saved){P.saved=1;E.prac[key]={ok:P.ok,n:P.n};save()}
    app.innerHTML=head+`<div class="panel stack"><h2>Xong Part ${P.p}</h2><div class="verdict ${P.ok/P.n>=.7?'ok':''}">${P.ok}/${P.n} câu đúng (${Math.round(P.ok/P.n*100)}%)</div>
      <div class="row"><button class="btn pri" id="eagain">Làm lại</button>${P.p<7?`<button class="btn" id="enxp">Sang Part ${P.p+1} →</button>`:''}</div></div>`;
    app.onclick=e=>{const id=e.target.id;if(id==='eback'){sub.ep=null;render()}if(id==='eagain'){sub.ep={...P,i:0,ans:{},rev:{},ok:0,n:0,saved:0};render()}if(id==='enxp'){sub.ep={t:P.t,p:P.p+1,i:0,ans:{},rev:{},ok:0,n:0,show:P.show};render();window.scrollTo(0,0)}};return}
  const u=U[P.i],rev=!!P.rev[u.i],qn=U.reduce((s,x)=>s+x.qs.length,0);
  app.innerHTML=head+`<div class="row"><span class="mono small">Cụm ${P.i+1}/${U.length}</span><div class="meter"><i style="width:${P.i/U.length*100}%"></i></div><span class="chip ok">${P.ok}/${P.n} đúng</span><span class="mono small muted">${qn} câu</span></div>
    ${P.i===0&&!rev?`<div class="expl small"><b>Hướng dẫn Part ${P.p}:</b> ${PDIR[P.p]}</div>`:''}
    <div class="panel stack">${uHTML(u,P.ans,rev,P.show)}</div>
    <div class="row">${rev?`<button class="btn pri" id="enext">${P.i+1<U.length?'Cụm tiếp →':'Xem kết quả'}</button>`:`<button class="btn pri" id="echk">Kiểm tra đáp án</button>`}
      ${P.p<=2&&!rev?`<label class="ck small"><input type="checkbox" id="eshow" ${P.show?'checked':''}><span>Hiện chữ các lựa chọn (dễ hơn đề thật)</span></label>`:''}</div>`;
  app.onchange=e=>{if(etsRateChange(e))return;if(e.target.id==='eshow'){P.show=e.target.checked;render()}};
  app.onclick=e=>{if(etsAudioClick(e,u))return;if(ePick(e,P.ans)!=null)return;const id=e.target.id;
    if(id==='eback'){sub.ep=null;render()}
    if(id==='echk'){P.rev[u.i]=1;u.qs.forEach(q=>{P.n++;if(P.ans[q.n]===q.a)P.ok++});render()}
    if(id==='enext'){P.i++;render();window.scrollTo(0,0);const nu=U[P.i];if(nu&&nu.p<=4&&hasTTS){const b=$('#eplay');if(b){b.textContent='■ Dừng';etsPlay(etsAudio(nu),()=>{const x=$('#eplay');if(x)x.textContent='▶ Nghe lại'})}}}}}

function etsExam(){const E=ek(),X=E.exam,T=ETS.find(t=>t.id===X.t);if(!T){E.exam=null;save();return luyende()}
  const U=etsUnits(T).filter(u=>X.parts.includes(u.p)),u=U[X.i],qs=U.flatMap(x=>x.qs),uOf={};U.forEach((x,i)=>x.qs.forEach(q=>uOf[q.n]=i));
  const name=T.title+' · '+SCOPE[X.scope].l;
  const mapB=q=>`<button data-q="${q.n}" data-j="${uOf[q.n]}" class="${uOf[q.n]===X.i?'cur ':''}${X.done?(X.ans[q.n]===q.a?'ok':'bad'):(X.ans[q.n]!=null?'ans':'')}" aria-label="Câu ${q.n}">${q.n}</button>`;
  if(!X.done){
    app.innerHTML=`<div class="examgrid"><div class="stack"><div class="panel stack">${uHTML(u,X.ans,false,false)}</div>
      <div class="row"><button class="btn" id="ep" ${X.i?'':'disabled'}>← Trước</button><button class="btn pri" id="en" ${X.i<U.length-1?'':'disabled'}>Tiếp →</button><span class="small muted">Cụm ${X.i+1}/${U.length}</span></div></div>
     <div class="panel stack"><div class="small muted">${esc(name)}</div><div><div class="small muted">Thời gian còn lại</div><div class="timer" id="tm"></div></div>
      <div class="map">${qs.map(mapB).join('')}</div><div class="small muted">Nền màu: đã trả lời</div>
      <div class="stack">${sub.confirm?`<div>Nộp bài? Còn <b>${qs.filter(q=>X.ans[q.n]==null).length}</b> câu chưa trả lời.</div><div class="row"><button class="btn pri" id="xyes">Nộp bài</button><button class="btn" id="xno">Làm tiếp</button></div>`:'<button class="btn pri" id="xsub">Nộp bài</button>'}
      <button class="btn small" id="xquit">Huỷ bài thi</button></div></div></div>`;
    const tm=$('#tm'),show=()=>{const left=X.limit-X.used;tm.textContent=fmt(left);tm.classList.toggle('low',left<300)};show();
    const finish=()=>{clearInterval(tick);stopTalk();X.done=true;sub.confirm=false;
      const c=ps=>qs.filter(q=>ps.includes(etsPart(U,q.n))&&X.ans[q.n]===q.a).length,lr=c([1,2,3,4]),rr=c([5,6,7]);
      X.L=X.parts.includes(1)?scaled('L',lr):null;X.R=X.parts.includes(5)?scaled('R',rr):null;X.total=(X.L||0)+(X.R||0);X.i=0;
      E.hist.push({date:new Date().toLocaleString('vi-VN'),name,L:X.L,R:X.R,total:X.total,used:X.used});
      if(X.scope==='full'&&(!E.best[X.t]||E.best[X.t].total<X.total))E.best[X.t]={total:X.total,L:X.L,R:X.R};save();render();window.scrollTo(0,0)};
    tick=setInterval(()=>{X.used++;if(X.used%10===0)save();if(X.used>=X.limit)finish();else show()},1000);
    app.onchange=e=>{etsRateChange(e)};
    app.onclick=e=>{if(etsAudioClick(e,u))return;if(ePick(e,X.ans)!=null){save();return}const b=e.target.closest('button');if(!b)return;const id=b.id;
      const goU=i=>{X.i=i;save();render();window.scrollTo(0,0);const nu=U[X.i];if(nu.p<=4&&hasTTS){const pb=$('#eplay');if(pb){pb.textContent='■ Dừng';etsPlay(etsAudio(nu),()=>{const x=$('#eplay');if(x)x.textContent='▶ Nghe lại'})}}};
      if(b.dataset.j!=null&&b.closest('.map'))goU(+b.dataset.j);if(id==='ep')goU(X.i-1);if(id==='en')goU(X.i+1);
      if(id==='xsub'){sub.confirm=true;render()}if(id==='xno'){sub.confirm=false;render()}if(id==='xyes')finish();
      if(id==='xquit'){if(sub.quit){E.exam=null;sub.quit=false;save();render()}else{sub.quit=true;b.textContent='Bấm lần nữa để huỷ bài thi'}}};
    return}
  const per=[1,2,3,4,5,6,7].filter(p=>X.parts.includes(p)).map(p=>{const l=qs.filter(q=>etsPart(U,q.n)===p);return [p,l.filter(q=>X.ans[q.n]===q.a).length,l.length]});
  app.innerHTML=`<div class="panel stack"><h2>Kết quả: ${esc(name)}</h2><div class="verdict ok">${X.total} điểm${X.scope==='full'?' / 990':' / 495'}</div>
    <div class="facts">${X.L!=null?`<div class="fact"><b>${X.L}</b>Listening (ước tính)</div>`:''}${X.R!=null?`<div class="fact"><b>${X.R}</b>Reading (ước tính)</div>`:''}<div class="fact"><b>${qs.filter(q=>X.ans[q.n]===q.a).length}/${qs.length}</b>câu đúng</div><div class="fact"><b>${fmt(X.used)}</b>thời gian làm</div></div>
    ${per.map(([p,g,t])=>`<div class="chrow"><div>Part ${p} · ${PART[p][1]}</div><div class="row"><div class="meter"><i style="width:${g/t*100}%"></i></div></div><span class="mono small">${g}/${t} câu</span></div>`).join('')}
    <div class="row"><button class="btn pri" id="xnew">Về danh sách đề</button></div></div>
   <div class="panel stack"><b>Xem lại từng câu</b><div class="map">${qs.map(mapB).join('')}</div><div class="small muted">Xanh: đúng · Đỏ: sai hoặc bỏ trống</div></div>
   <div class="panel stack">${uHTML(u,X.ans,true,true)}</div>
   <div class="row"><button class="btn" id="ep" ${X.i?'':'disabled'}>← Trước</button><button class="btn pri" id="en" ${X.i<U.length-1?'':'disabled'}>Tiếp →</button></div>`;
  app.onchange=e=>{etsRateChange(e)};
  app.onclick=e=>{if(etsAudioClick(e,u))return;const b=e.target.closest('button');if(!b)return;
    if(b.dataset.j!=null&&b.closest('.map')){X.i=+b.dataset.j;render()}if(b.id==='ep'){X.i--;render()}if(b.id==='en'){X.i++;render()}
    if(b.id==='xnew'){E.exam=null;save();render();window.scrollTo(0,0)}}}
const etsPart=(U,n)=>{const u=U.find(x=>n>=x.from&&n<=x.to);return u?u.p:0};

route();render();
</script>

</body></html>
