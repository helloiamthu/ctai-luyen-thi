e?","vi":"Bạn giúp tôi kiểm tra test case này được không?","why":"Sau 'help someone' dùng động từ nguyên mẫu (check hoặc to check), không dùng V-ing.","g":"Ngữ pháp"},{"wrong":"I will make my homework tonight.","right":"I will do my homework tonight.","vi":"Tối nay tôi sẽ làm bài tập.","why":"Collocation cố định: do homework, do a task; make a plan, make a decision.","g":"Dùng từ"},{"wrong":"I did a mistake in the report.","right":"I made a mistake in the report.","vi":"Tôi đã mắc lỗi trong báo cáo.","why":"Luôn nói 'make a mistake', không nói 'do a mistake'.","g":"Dùng từ"},{"wrong":"I have worked here since three years.","right":"I have worked here for three years.","vi":"Tôi đã làm ở đây được ba năm.","why":"For + khoảng thời gian (three years); since + mốc thời gian (since 2023).","g":"Giới từ"},{"wrong":"I live here for five years.","right":"I've lived here for five years.","vi":"Tôi sống ở đây được năm năm rồi.","why":"Việc bắt đầu trong quá khứ, kéo dài đến nay dùng hiện tại hoàn thành.","g":"Ngữ pháp"},{"wrong":"People is waiting outside.","right":"People are waiting outside.","vi":"Mọi người đang đợi bên ngoài.","why":"'People' là danh từ số nhiều nên đi với 'are'.","g":"Ngữ pháp"},{"wrong":"Can you send me more informations?","right":"Can you send me more information?","vi":"Bạn gửi thêm thông tin cho tôi được không?","why":"'Information' không đếm được, không thêm s.","g":"Ngữ pháp"},{"wrong":"We bought new equipments for the lab.","right":"We bought new equipment for the lab.","vi":"Chúng tôi đã mua thiết bị mới cho phòng lab.","why":"'Equipment' không đếm được, không thêm s. Muốn đếm: 'two pieces of equipment'.","g":"Ngữ pháp"},{"wrong":"He gave me many advices.","right":"He gave me a lot of advice.","vi":"Anh ấy cho tôi nhiều lời khuyên.","why":"'Advice' không đếm được: dùng a lot of/some advice, a piece of advice.","g":"Ngữ pháp"},{"wrong":"Are you free time tonight?","right":"Are you free tonight?","vi":"Tối nay bạn rảnh không?","why":"'Free' là tính từ đi với 'are you'; 'free time' là danh từ, không ghép như vậy.","g":"Dịch từng chữ"},{"wrong":"I am going to work by motorbike every day.","right":"I go to work by motorbike every day.","vi":"Ngày nào tôi cũng đi làm bằng xe máy.","why":"Thói quen lặp lại (every day) dùng hiện tại đơn, không dùng hiện tại tiếp diễn.","g":"Ngữ pháp"},{"wrong":"What is your name?","right":"May I have your name, please?","vi":"Cho tôi xin tên của anh/chị được không?","why":"Hỏi khách hàng/người lạ, 'What is your name?' nghe cộc như tra hỏi; câu kia lịch sự hơn.","g":"Lịch sự"},{"wrong":"Can you take me a glass of water?","right":"Can you bring me a glass of water?","vi":"Bạn mang cho tôi ly nước được không?","why":"Bring = mang đến chỗ người nói; take = mang đi chỗ khác.","g":"Dùng từ"},{"wrong":"Please remember me to send the report.","right":"Please remind me to send the report.","vi":"Nhớ nhắc tôi gửi báo cáo nhé.","why":"Remind someone = nhắc ai đó; remember = tự mình nhớ.","g":"Dùng từ"},{"wrong":"Give me the menu.","right":"Could I have the menu, please?","vi":"Cho tôi xem thực đơn.","why":"Câu mệnh lệnh 'Give me' nghe thô lỗ với nhân viên; dùng Could I have... please.","g":"Lịch sự"},{"wrong":"I come from Vietnamese.","right":"I come from Vietnam.","vi":"Tôi đến từ Việt Nam.","why":"Tên nước là Vietnam (thường viết liền); Vietnamese là người/tiếng Việt hoặc tính từ.","g":"Dùng từ"},{"wrong":"Same same.","right":"It's pretty much the same.","vi":"Cũng giống giống vậy thôi.","why":"'Same same' là tiếng Anh bồi; người bản xứ nói 'pretty much the same' hoặc 'about the same'.","g":"Dịch từng chữ"},{"wrong":"We will discuss with the team about this tomorrow.","right":"We will discuss this with the team tomorrow.","vi":"Ngày mai chúng ta sẽ bàn việc này với nhóm.","why":"Cấu trúc: discuss something with someone; bỏ 'about'.","g":"Giới từ"},{"wrong":"I'm interesting in software testing.","right":"I'm interested in software testing.","vi":"Tôi quan tâm đến kiểm thử phần mềm.","why":"Interested = cảm thấy hứng thú; interesting = thú vị (tính chất của sự vật).","g":"Dùng từ"},{"wrong":"She don't work on Fridays.","right":"She doesn't work on Fridays.","vi":"Cô ấy không làm việc vào thứ Sáu.","why":"Ngôi thứ ba số ít (he/she/it) dùng 'doesn't'.","g":"Ngữ pháp"},{"wrong":"Did you went to the meeting?","right":"Did you go to the meeting?","vi":"Bạn có đi họp không?","why":"Sau 'did' động từ trở về nguyên mẫu.","g":"Ngữ pháp"},{"wrong":"I'm married with a teacher.","right":"I'm married to a teacher.","vi":"Tôi kết hôn với một giáo viên.","why":"Dùng 'married to someone', không phải 'married with'.","g":"Giới từ"},{"wrong":"I'll call you when I will finish.","right":"I'll call you when I finish.","vi":"Xong việc tôi sẽ gọi cho bạn.","why":"Sau when/after/before/if nói về tương lai dùng hiện tại đơn, không dùng 'will'.","g":"Ngữ pháp"},{"wrong":"Although it rained, but we still went out.","right":"Although it rained, we still went out.","vi":"Mặc dù trời mưa nhưng chúng tôi vẫn ra ngoài.","why":"Tiếng Anh không dùng cặp 'although... but'; chỉ giữ một từ nối.","g":"Dịch từng chữ"},{"wrong":"Because I was tired, so I went home early.","right":"Because I was tired, I went home early.","vi":"Vì mệt nên tôi về nhà sớm.","why":"Không dùng cặp 'because... so' như 'vì... nên'; chỉ giữ một từ.","g":"Dịch từng chữ"},{"wrong":"The result is depend on the test data.","right":"The result depends on the test data.","vi":"Kết quả phụ thuộc vào dữ liệu test.","why":"'Depend' là động từ; không dùng 'is' trước nó và phải chia 'depends'.","g":"Ngữ pháp"},{"wrong":"I'm used to work late.","right":"I'm used to working late.","vi":"Tôi quen làm việc muộn rồi.","why":"'Be used to' + V-ing (quen với); 'used to + V' là thói quen trong quá khứ.","g":"Ngữ pháp"},{"wrong":"This task is very hard to me.","right":"This task is very hard for me.","vi":"Việc này rất khó đối với tôi.","why":"Khó/dễ với ai dùng 'for': hard for me, easy for me.","g":"Giới từ"},{"wrong":"We're good at play football.","right":"We're good at playing football.","vi":"Chúng tôi đá bóng giỏi.","why":"Sau giới từ (at, in, of...) động từ phải thêm -ing.","g":"Ngữ pháp"},{"wrong":"I'm waiting the bus.","right":"I'm waiting for the bus.","vi":"Tôi đang đợi xe buýt.","why":"Luôn nói 'wait for something'.","g":"Giới từ"},{"wrong":"Call me at 9 o'clock in Monday.","right":"Call me at 9 o'clock on Monday.","vi":"Gọi cho tôi lúc 9 giờ thứ Hai nhé.","why":"Dùng 'on' với thứ và ngày cụ thể; 'in' với tháng, năm.","g":"Giới từ"},{"wrong":"I was born on 1995.","right":"I was born in 1995.","vi":"Tôi sinh năm 1995.","why":"Năm dùng 'in'; ngày cụ thể mới dùng 'on' (on May 5th).","g":"Giới từ"},{"wrong":"I'll go to home now.","right":"I'll go home now.","vi":"Giờ tôi về nhà đây.","why":"'Home' ở đây là trạng từ, không cần 'to': go home, come home.","g":"Giới từ"},{"wrong":"I'll control the test results before the release.","right":"I'll check the test results before the release.","vi":"Tôi sẽ kiểm tra kết quả test trước khi release.","why":"'Control' là điều khiển, kiểm soát; 'kiểm tra' dùng check, review, verify.","g":"Dùng từ"},{"wrong":"I have a good news for you.","right":"I have some good news for you.","vi":"Tôi có tin vui cho bạn.","why":"'News' không đếm được dù có s; không dùng 'a'. Dùng some/a piece of.","g":"Ngữ pháp"},{"wrong":"He has many experiences in testing.","right":"He has a lot of experience in testing.","vi":"Anh ấy có nhiều kinh nghiệm kiểm thử.","why":"Kinh nghiệm (kỹ năng) là 'experience' không đếm được; 'experiences' là những trải nghiệm.","g":"Ngữ pháp"},{"wrong":"Repeat again, please.","right":"Could you say that again, please?","vi":"Bạn nói lại giúp tôi được không?","why":"'Repeat again' thừa ý và nghe như ra lệnh; câu hỏi với 'Could you' lịch sự hơn.","g":"Lịch sự"},{"wrong":"You must send me the report today.","right":"Could you send me the report today?","vi":"Hôm nay bạn gửi báo cáo cho tôi được không?","why":"'You must' nghe ra lệnh, gay gắt với đồng nghiệp; dùng câu nhờ với Could you.","g":"Lịch sự"},{"wrong":"I want a coffee.","right":"I'd like a coffee, please.","vi":"Cho tôi một ly cà phê.","why":"Gọi món nói 'I want' nghe trống không; 'I'd like... please' lịch sự hơn.","g":"Lịch sự"},{"wrong":"You understand?","right":"Does that make sense?","vi":"Bạn hiểu ý tôi không?","why":"'You understand?' nghe như nghi ngờ khả năng người nghe; 'Does that make sense?' nhẹ nhàng hơn.","g":"Lịch sự"},{"wrong":"The price of this phone is very expensive.","right":"The price of this phone is very high.","vi":"Giá chiếc điện thoại này rất cao.","why":"Giá thì 'high/low'; món đồ mới 'expensive/cheap'. Hoặc nói: 'This phone is very expensive.'","g":"Dùng từ"},{"wrong":"My house has four people.","right":"There are four people in my family.","vi":"Nhà tôi có bốn người.","why":"'House' là ngôi nhà (tòa nhà); nói về thành viên dùng 'family'.","g":"Dịch từng chữ"},{"wrong":"I'm hard to understand this.","right":"It's hard for me to understand this.","vi":"Tôi khó hiểu cái này.","why":"'I'm hard to understand' nghĩa là tôi khó hiểu (người khác khó hiểu tôi). Dùng It's hard for me to...","g":"Dịch từng chữ"},{"wrong":"I play with my friends on weekends.","right":"I hang out with my friends on weekends.","vi":"Cuối tuần tôi đi chơi với bạn bè.","why":"Người lớn 'chơi với bạn' là hang out; 'play with' nghe như trẻ con chơi đồ chơi.","g":"Dùng từ"},{"wrong":"This shirt is very suitable with you.","right":"This shirt really suits you.","vi":"Cái áo này rất hợp với bạn.","why":"Quần áo hợp người dùng động từ 'suit' (hoặc looks good on you), không dịch 'suitable with'.","g":"Dịch từng chữ"},{"wrong":"I go to Da Lat last week.","right":"I went to Da Lat last week.","vi":"Tuần trước tôi đi Đà Lạt.","why":"Có 'last week' là quá khứ, động từ phải chia quá khứ: went.","g":"Ngữ pháp"},{"wrong":"I have been to Japan last year.","right":"I went to Japan last year.","vi":"Năm ngoái tôi đã đi Nhật.","why":"Có mốc quá khứ xác định (last year) thì dùng quá khứ đơn, không dùng hiện tại hoàn thành.","g":"Ngữ pháp"},{"wrong":"Please feedback for me.","right":"Please give me some feedback.","vi":"Góp ý giúp tôi nhé.","why":"'Feedback' là danh từ, không dùng như động từ. Dùng give feedback.","g":"Dịch từng chữ"},{"wrong":"I'm busy tomorrow, so I can't join with you.","right":"I'm busy tomorrow, so I can't join you.","vi":"Mai tôi bận nên không đi cùng bạn được.","why":"'Join' đi thẳng với tân ngữ: join you, join the meeting; không cần 'with'.","g":"Giới từ"},{"wrong":"Please contact with me by email.","right":"Please contact me by email.","vi":"Vui lòng liên hệ với tôi qua email.","why":"'Contact' là động từ đi thẳng với tân ngữ; không nói 'contact with'.","g":"Giới từ"},{"wrong":"I'm looking forward to hear from you.","right":"I'm looking forward to hearing from you.","vi":"Tôi mong nhận được phản hồi từ bạn.","why":"'To' trong 'look forward to' là giới từ nên động từ sau phải là V-ing.","g":"Ngữ pháp"},{"wrong":"Can you say me the answer?","right":"Can you tell me the answer?","vi":"Bạn nói cho tôi đáp án được không?","why":"'Tell' đi với người nghe (tell me); 'say' không đi trực tiếp với người (say something to me).","g":"Dùng từ"},{"wrong":"He said me that the build failed.","right":"He told me that the build failed.","vi":"Anh ấy nói với tôi là bản build bị lỗi.","why":"'Tell someone that...'; 'said' không đi trực tiếp với tân ngữ chỉ người.","g":"Dùng từ"},{"wrong":"There have many bugs in this version.","right":"There are many bugs in this version.","vi":"Có nhiều bug trong phiên bản này.","why":"'Có' chỉ sự tồn tại dùng there is/there are, không dịch thành 'there have'.","g":"Dịch từng chữ"},{"wrong":"I very busy today.","right":"I'm very busy today.","vi":"Hôm nay tôi rất bận.","why":"Trước tính từ cần động từ 'to be' (am/is/are); tiếng Việt không có nên hay bị quên.","g":"Ngữ pháp"},{"wrong":"I am tester.","right":"I am a tester.","vi":"Tôi là tester.","why":"Nghề nghiệp số ít phải có mạo từ 'a/an': a tester, an engineer.","g":"Ngữ pháp"},{"wrong":"It costs two millions dong.","right":"It costs two million dong.","vi":"Nó giá hai triệu đồng.","why":"Sau số đếm cụ thể, million/thousand/hundred không thêm s.","g":"Ngữ pháp"},{"wrong":"He suggested me to retest the feature.","right":"He suggested that I retest the feature.","vi":"Anh ấy đề nghị tôi test lại tính năng đó.","why":"'Suggest' không dùng cấu trúc 'suggest someone to do'; dùng suggest that someone do hoặc suggest doing.","g":"Ngữ pháp"},{"wrong":"Sorry, I'm not understand.","right":"Sorry, I don't understand.","vi":"Xin lỗi, tôi không hiểu.","why":"Phủ định động từ thường dùng do/don't, không dùng 'am not'.","g":"Ngữ pháp"},{"wrong":"Hey you, can you help me?","right":"Excuse me, could you help me?","vi":"Xin lỗi, bạn giúp tôi được không?","why":"'Hey you' nghe rất thô lỗ khi gọi người lạ; mở đầu bằng 'Excuse me'.","g":"Lịch sự"},{"wrong":"I'm very happy to know you.","right":"It's very nice to meet you.","vi":"Rất vui được làm quen với bạn.","why":"Lần đầu gặp nói 'Nice to meet you'; 'happy to know you' là dịch từng chữ, không tự nhiên.","g":"Dịch từng chữ"}],"site":{"code":"TOEIC","name":"Từ vựng, mẫu câu, luyện đề & phim ngắn","key":"toeic-v1","views":["toeic","giaotiep","luyende","phim"],"migrate":{"from":"ctai-v1","fields":["toeic","film","lang"]}},"ets":[{"id":1,"title":"Test 01","p1":[{"scene":"Một người phụ nữ mặc áo sơ mi đứng trước máy photocopy trong văn phòng, tay đang đặt một xấp giấy lên mặt kính của máy. Bên cạnh máy có một chồng hộp giấy in xếp sát tường.","o":["She's opening a window.","She's carrying some boxes up the stairs.","She's placing some papers on a machine.","She's sitting at a desk."],"a":2,"ex":"Người phụ nữ đang đặt xấp giấy lên máy photocopy (placing some papers on a machine). (B) nhắc đến 'boxes' có trong ảnh nhưng cô ấy không khiêng hộp lên cầu thang; (D) sai vì cô ấy đang đứng."},{"scene":"Một người đàn ông mặc áo phản quang đang leo trên chiếc thang dựa vào tường trong nhà kho, một tay với lên trần để thay bóng đèn. Dưới sàn có vài thùng hàng.","o":["A man is climbing a ladder.","A man is painting a wall.","A ladder is being folded up.","A man is unloading some lights from a truck."],"a":0,"ex":"Người đàn ông đang ở trên thang (climbing a ladder). (C) dùng 'is being folded' – thang đang được dựng, không bị gập lại; (D) có từ 'lights' nhưng không có xe tải."},{"scene":"Ba đồng nghiệp ngồi quanh một bàn họp. Một người phụ nữ giơ tay chỉ vào màn hình chiếu có biểu đồ cột; trên bàn có laptop và vài cốc cà phê.","o":["They're arranging chairs in a row.","They're pouring coffee into cups.","A screen is being installed on the wall.","One of the people is pointing at a screen."],"a":3,"ex":"Một người đang chỉ vào màn hình (pointing at a screen). (B) bẫy từ 'coffee' – cốc cà phê có trên bàn nhưng không ai đang rót; (C) màn hình đã có sẵn, không phải đang được lắp."},{"scene":"Hai công nhân đội mũ bảo hộ đang cùng nhau khiêng một tấm ván gỗ dài trên công trường. Phía sau là hàng rào tạm và một đống gạch.","o":["They're putting on their helmets.","They're carrying a board together.","Some wood is being cut with a saw.","They're resting near a fence."],"a":1,"ex":"Hai người đang cùng khiêng tấm ván (carrying a board together). (A) sai vì họ đã đội mũ sẵn – 'putting on' là hành động đang đội vào; (C) có 'wood' nhưng không ai đang cưa."},{"scene":"Một phòng chờ không có người. Vài chiếc ghế được xếp thành hàng dọc theo tường, một chậu cây lớn đặt ở góc phòng, và một chồng tạp chí nằm gọn trên chiếc bàn thấp.","o":["A plant has been placed in a corner.","Some chairs are being stacked.","A man is reading a magazine.","Magazines are scattered on the floor."],"a":0,"ex":"Chậu cây đã được đặt ở góc phòng (has been placed in a corner). (B) 'are being stacked' cần có người đang chồng ghế; (C) ảnh không có người; (D) tạp chí nằm trên bàn chứ không vương vãi dưới sàn."},{"scene":"Một bến tàu nhỏ vắng người. Vài chiếc thuyền được buộc dây dọc theo cầu tàu bằng gỗ, mặt nước phẳng lặng, phía xa là dãy nhà ven biển.","o":["Some boats are being loaded with cargo.","People are swimming near the pier.","A boat is sailing under a bridge.","Some boats are tied to a dock."],"a":3,"ex":"Các thuyền được buộc vào cầu tàu (tied to a dock). (A) 'are being loaded' cần có người bốc hàng; (B) ảnh không có người; (C) thuyền đang neo, không chạy dưới cầu."}],"p2":[{"q":"Where should I put these boxes of printer paper?","o":["Yes, I printed it this morning.","In the supply closet, please.","About fifty sheets."],"a":1,"ex":"Câu hỏi 'Where' cần nơi chốn: 'trong tủ đồ dùng'. (A) trả lời Yes/No cho câu hỏi WH và lặp từ 'print'; (C) nói về số lượng.","vi":"Tôi nên để mấy thùng giấy in này ở đâu?"},{"q":"When does the budget meeting start?","o":["Not until two o'clock.","In Conference Room B.","Yes, it went well."],"a":0,"ex":"'When' hỏi thời gian: 'phải đến 2 giờ mới bắt đầu'. (B) trả lời nơi chốn; (C) dùng Yes và thì quá khứ không phù hợp.","vi":"Khi nào cuộc họp ngân sách bắt đầu?"},{"q":"Who's in charge of ordering office supplies?","o":["Some new pens and folders.","It was delivered yesterday.","Ms. Kim handles that now."],"a":2,"ex":"'Who' hỏi người: 'Bây giờ chị Kim phụ trách việc đó'. (A) liệt kê đồ dùng – bẫy liên tưởng với 'office supplies'; (B) nói về việc giao hàng.","vi":"Ai phụ trách việc đặt văn phòng phẩm?"},{"q":"Have you finished reviewing the contract from Benson Logistics?","o":["A contract worker.","Yes, I viewed it from the window.","I'm on the last page now."],"a":2,"ex":"Câu trả lời gián tiếp 'Tôi đang ở trang cuối' cho thấy sắp xong. (A) lặp từ 'contract'; (B) 'viewed' nghe gần giống 'reviewing' nhưng nghĩa không liên quan.","vi":"Anh đã xem xong hợp đồng của Benson Logistics chưa?"},{"q":"Why was the shipment to Denver delayed?","o":["By express mail.","There was a storm at the airport.","Yes, I'll ship it later."],"a":1,"ex":"'Why' hỏi lý do: 'Có bão ở sân bay'. (A) trả lời cách thức gửi; (C) dùng Yes và lặp 'ship'.","vi":"Tại sao lô hàng đi Denver bị chậm?"},{"q":"Would you prefer a window seat or an aisle seat?","o":["Whichever is available is fine.","Yes, I'd prefer that.","The flight leaves at noon."],"a":0,"ex":"Câu hỏi lựa chọn, đáp án 'chỗ nào còn trống cũng được' là cách trả lời hợp lý. (B) dùng Yes cho câu hỏi lựa chọn và lặp 'prefer'; (C) nói giờ bay.","vi":"Anh muốn ghế cạnh cửa sổ hay ghế cạnh lối đi?"},{"q":"Could you help me set up the projector for the workshop?","o":["A two-day workshop.","Sure, give me five minutes.","He set the date already."],"a":1,"ex":"Lời nhờ vả được đồng ý: 'Được, cho tôi năm phút'. (A) lặp từ 'workshop'; (C) lặp 'set' với nghĩa khác.","vi":"Anh giúp tôi lắp máy chiếu cho buổi hội thảo được không?"},{"q":"How many people signed up for the training session?","o":["On the second floor.","Sign here, please.","Let me check the registration list."],"a":2,"ex":"Câu trả lời gián tiếp: 'Để tôi kiểm tra danh sách đăng ký' – người nói chưa biết con số. (A) nói vị trí; (B) lặp 'sign' với nghĩa ký tên.","vi":"Có bao nhiêu người đã đăng ký buổi đào tạo?"},{"q":"Didn't Mr. Adams already approve the new design?","o":["He's still waiting for the client's feedback.","A new designer.","It was designed in March."],"a":0,"ex":"Câu hỏi phủ định, đáp án ngầm hiểu là 'chưa duyệt' vì ông ấy còn chờ ý kiến khách hàng. (B) và (C) lặp từ 'design/designer' nhưng không trả lời việc phê duyệt.","vi":"Chẳng phải ông Adams đã duyệt thiết kế mới rồi sao?"},{"q":"The printer on this floor is out of toner again.","o":["I'll call the maintenance office.","Print two copies, please.","On the fourth floor, I think."],"a":0,"ex":"Câu trần thuật nêu vấn đề, đáp án đưa ra cách xử lý: 'Tôi sẽ gọi phòng bảo trì'. (B) lặp 'print'; (C) lặp 'floor'.","vi":"Máy in ở tầng này lại hết mực rồi."},{"q":"You're attending the trade show in Chicago, aren't you?","o":["It was a great show.","About three days.","Only if my manager approves the trip."],"a":2,"ex":"Câu hỏi đuôi, đáp án gián tiếp: 'Chỉ khi quản lý duyệt chuyến đi'. (A) lặp 'show' và dùng quá khứ; (B) trả lời thời lượng.","vi":"Anh sẽ tham dự hội chợ thương mại ở Chicago, phải không?"},{"q":"What time does the cafeteria close today?","o":["It's close to the elevator.","Earlier than usual, at two.","The soup and salad special."],"a":1,"ex":"Hỏi giờ đóng cửa: 'Sớm hơn mọi ngày, lúc 2 giờ'. (A) bẫy từ 'close' (gần) phát âm khác nghĩa; (C) liên tưởng đến món ăn ở căng-tin.","vi":"Hôm nay căng-tin đóng cửa lúc mấy giờ?"},{"q":"Why don't we hire a temporary worker for the busy season?","o":["Because it was too busy.","Higher than last season.","That's a good idea. Let's discuss it with Ms. Davis."],"a":2,"ex":"'Why don't we...' là lời đề nghị, đáp án đồng ý và đề xuất bàn với chị Davis. (A) hiểu nhầm là câu hỏi lý do và lặp 'busy'; (B) lặp 'season'.","vi":"Sao chúng ta không thuê một nhân viên thời vụ cho mùa cao điểm?"},{"q":"Where can I find the updated price list?","o":["It's on the shared drive.","The prices went up.","Yes, I found it."],"a":0,"ex":"Hỏi nơi tìm tài liệu: 'Nó ở trên ổ đĩa dùng chung'. (B) lặp 'price'; (C) dùng Yes và lặp 'find/found'.","vi":"Tôi có thể tìm bảng giá cập nhật ở đâu?"},{"q":"Is the new accounting software easy to use?","o":["Around four hundred dollars.","It takes a few days to get used to.","Count them again, please."],"a":1,"ex":"Đáp án gián tiếp: 'Phải mất vài ngày mới quen' – tức là không quá dễ. (A) nói về giá; (C) 'count' nghe gần 'accounting'.","vi":"Phần mềm kế toán mới có dễ sử dụng không?"},{"q":"Which supplier did we choose for the packaging materials?","o":["Package it carefully.","We haven't made a final decision.","By the end of the month."],"a":1,"ex":"Đáp án gián tiếp: 'Chúng ta chưa quyết định' – không nêu tên nhà cung cấp nhưng hợp lý. (A) lặp gốc từ 'package'; (C) trả lời thời hạn.","vi":"Chúng ta đã chọn nhà cung cấp nào cho vật liệu đóng gói?"},{"q":"How long will the renovation of the lobby take?","o":["About three weeks, according to the contractor.","In the main lobby.","Yes, it looks great."],"a":0,"ex":"'How long' hỏi thời lượng: 'Khoảng ba tuần, theo nhà thầu'. (B) lặp 'lobby' và nói vị trí; (C) dùng Yes cho câu hỏi WH.","vi":"Việc cải tạo sảnh sẽ mất bao lâu?"},{"q":"Can you send me the sales figures before the meeting?","o":["Yes, the sale ends Friday.","The meeting room is booked.","I'll e-mail them to you right away."],"a":2,"ex":"Lời đề nghị được đáp ứng: 'Tôi sẽ gửi e-mail ngay'. (A) có Yes nhưng nói về đợt giảm giá (lặp 'sale'); (B) lặp 'meeting'.","vi":"Anh gửi cho tôi số liệu doanh số trước cuộc họp được không?"},{"q":"Aren't the new employees starting on Monday?","o":["No, their start date was moved to Wednesday.","Several new chairs.","It starts with a short video."],"a":0,"ex":"Câu hỏi phủ định, đáp án 'Không, ngày bắt đầu đã dời sang thứ Tư' trả lời đúng trọng tâm. (B) lặp 'new'; (C) lặp 'start' với chủ ngữ khác.","vi":"Chẳng phải nhân viên mới bắt đầu làm vào thứ Hai sao?"},{"q":"Who's going to give the presentation to the investors?","o":["A presentation about sales.","Yes, they invested last year.","Mr. Garcia volunteered to do it."],"a":2,"ex":"'Who' hỏi người: 'Anh Garcia tình nguyện làm'. (A) lặp 'presentation'; (B) dùng Yes và 'invested' gần với 'investors'.","vi":"Ai sẽ thuyết trình cho các nhà đầu tư?"},{"q":"Should we ship the samples today or wait until tomorrow?","o":["Some product samples.","The client needs them by Thursday, so today.","Yes, it's a big ship."],"a":1,"ex":"Câu hỏi lựa chọn, đáp án chọn 'hôm nay' kèm lý do khách cần trước thứ Năm. (A) lặp 'samples'; (C) dùng Yes và 'ship' với nghĩa con tàu.","vi":"Chúng ta nên gửi mẫu hôm nay hay đợi đến mai?"},{"q":"I can't log in to the company Web site.","o":["A new Web designer.","Log the hours in the timesheet.","The IT team is updating the server right now."],"a":2,"ex":"Câu trần thuật nêu sự cố, đáp án giải thích nguyên nhân: đội IT đang cập nhật máy chủ. (A) lặp 'Web'; (B) lặp 'log' với nghĩa ghi chép.","vi":"Tôi không đăng nhập được vào trang web công ty."},{"q":"Why is the parking lot closed this morning?","o":["Close the door, please.","They're repainting the lines.","Near the main entrance."],"a":1,"ex":"'Why' hỏi lý do: 'Người ta đang sơn lại vạch kẻ'. (A) lặp 'close'; (C) trả lời vị trí.","vi":"Tại sao sáng nay bãi đỗ xe đóng cửa?"},{"q":"How about meeting at the café across the street?","o":["Sure, that's more convenient.","About two blocks away.","I usually drink tea."],"a":0,"ex":"'How about...' là lời gợi ý, đáp án đồng ý: 'Được, như vậy tiện hơn'. (B) bẫy 'about' và nói khoảng cách; (C) liên tưởng đến quán cà phê.","vi":"Hay là chúng ta gặp nhau ở quán cà phê bên kia đường?"},{"q":"What did the client think of our proposal?","o":["I think it's due on Friday.","The proposed location.","I'll have to check with Ms. Lee."],"a":2,"ex":"Đáp án gián tiếp: 'Tôi phải hỏi lại chị Lee' – người nói chưa nắm thông tin. (A) lặp 'think'; (B) 'proposed' gần với 'proposal'.","vi":"Khách hàng nghĩ gì về đề xuất của chúng ta?"}],"p3":[{"conv":[{"s":"W","t":"Hi, this is Anna Brooks from Clearview Accounting. We received our office supply order this morning, but the box of printer cartridges is missing.","vi":"Xin chào, tôi là Anna Brooks từ Clearview Accounting. Sáng nay chúng tôi đã nhận được đơn hàng văn phòng phẩm, nhưng thiếu thùng hộp mực máy in."},{"s":"M","t":"I'm sorry about that, Ms. Brooks. Let me pull up your order... Yes, the cartridges were listed as shipped. It looks like they were packed in a separate box.","vi":"Tôi rất xin lỗi, chị Brooks. Để tôi mở đơn hàng của chị... Vâng, hộp mực đã được ghi là đã gửi. Có vẻ chúng được đóng trong một thùng riêng."},{"s":"W","t":"Well, only one box arrived. We need those cartridges by Thursday because we're printing annual reports for a client meeting.","vi":"Nhưng chỉ có một thùng đến thôi. Chúng tôi cần số hộp mực đó trước thứ Năm vì phải in báo cáo thường niên cho một buổi họp với khách hàng."},{"s":"M","t":"I understand. I'll send a replacement package today by express delivery at no extra charge. It should reach you tomorrow morning.","vi":"Tôi hiểu. Hôm nay tôi sẽ gửi gói hàng thay thế bằng chuyển phát nhanh, không tính thêm phí. Sáng mai chị sẽ nhận được."},{"s":"W","t":"That would be great. Should I do anything if the original box shows up later?","vi":"Vậy thì tốt quá. Nếu thùng hàng ban đầu đến sau thì tôi có cần làm gì không?"},{"s":"M","t":"Just give us a call, and we'll arrange for a courier to pick it up.","vi":"Chị chỉ cần gọi cho chúng tôi, chúng tôi sẽ sắp xếp người giao hàng đến lấy."}],"qs":[{"q":"What is the woman calling about?","o":["A missing item","A damaged printer","A billing error","A late payment"],"a":0,"ex":"Người phụ nữ nói 'the box of printer cartridges is missing' – thùng hộp mực bị thiếu. Đáp án B lặp từ 'printer' nhưng không nói máy in bị hỏng."},{"q":"Why does the woman need the cartridges by Thursday?","o":["To train some new staff","To repair a machine","To print documents for a meeting","To fill a large customer order"],"a":2,"ex":"Cô nói 'we're printing annual reports for a client meeting' → in tài liệu cho buổi họp. Các đáp án khác không được nhắc đến."},{"q":"What does the man offer to do?","o":["Refund the full order","Send a replacement by express delivery","Visit the woman's office","Give a discount on the next order"],"a":1,"ex":"Người đàn ông nói 'I'll send a replacement package today by express delivery at no extra charge'. 'No extra charge' dễ gây nhầm với giảm giá (D) nhưng thực ra chỉ là miễn phí giao hàng thay thế."}]},{"conv":[{"s":"M","t":"Good afternoon, Bellamy's Bistro. How can I help you?","vi":"Chào buổi chiều, nhà hàng Bellamy's Bistro xin nghe. Tôi có thể giúp gì cho quý khách?"},{"s":"W","t":"Hi, I'd like to reserve your private dining room for Friday evening. My company is hosting a farewell dinner for a colleague who's retiring.","vi":"Chào anh, tôi muốn đặt phòng ăn riêng vào tối thứ Sáu. Công ty tôi tổ chức tiệc chia tay cho một đồng nghiệp sắp nghỉ hưu."},{"s":"M","t":"Certainly. How many guests are you expecting?","vi":"Vâng ạ. Chị dự kiến bao nhiêu khách?"},{"s":"W","t":"About twenty-five people. Is that too many for the room?","vi":"Khoảng hai mươi lăm người. Như vậy có quá đông so với phòng không?"},{"s":"M","t":"The room seats up to thirty, so that's fine. However, for groups over twenty, we ask that you choose from our set menu.","vi":"Phòng chứa được tối đa ba mươi người nên không sao. Tuy nhiên, với nhóm trên hai mươi người, chúng tôi đề nghị quý khách chọn từ thực đơn cố định."},{"s":"W","t":"That's no problem. Could you e-mail me the menu options so I can share them with my manager?","vi":"Không vấn đề gì. Anh có thể gửi email các lựa chọn thực đơn cho tôi để tôi chia sẻ với quản lý được không?"},{"s":"M","t":"Of course. What's your e-mail address?","vi":"Tất nhiên rồi. Địa chỉ email của chị là gì ạ?"}],"qs":[{"q":"Where does the man most likely work?","o":["At a hotel","At a catering company","At an event hall","At a restaurant"],"a":3,"ex":"Anh ta nghe máy bằng câu 'Bellamy's Bistro' (bistro = nhà hàng nhỏ) và nói về phòng ăn riêng, thực đơn. 'Private dining room' có thể gây nhầm với khách sạn nhưng không có chi tiết nào về phòng nghỉ."},{"q":"What is the purpose of the dinner?","o":["To celebrate a retirement","To welcome new employees","To entertain some clients","To celebrate a product launch"],"a":0,"ex":"'a farewell dinner for a colleague who's retiring' → tiệc mừng nghỉ hưu. Không có thông tin về nhân viên mới hay khách hàng."},{"q":"What does the woman ask the man to do?","o":["Lower the price","Reserve some parking spaces","Send her the menu options","Call her manager"],"a":2,"ex":"Cô hỏi 'Could you e-mail me the menu options...?' – gửi thực đơn. Đáp án D lặp từ 'manager' nhưng cô mới là người sẽ chia sẻ với quản lý."}]},{"conv":[{"s":"W","t":"Marcus, are you going to the software training session this afternoon?","vi":"Marcus, chiều nay anh có đi buổi đào tạo phần mềm không?"},{"s":"M","t":"I was planning to, but the client in Denver just moved our call to two o'clock, which is right when the session starts.","vi":"Tôi định đi, nhưng khách hàng ở Denver vừa dời cuộc gọi sang hai giờ, đúng lúc buổi đào tạo bắt đầu."},{"s":"W","t":"That's too bad. The new scheduling system goes live next Monday, and everyone's supposed to know how to use it by then.","vi":"Tiếc quá. Hệ thống lập lịch mới sẽ chạy chính thức vào thứ Hai tới, và đến lúc đó ai cũng phải biết cách dùng."},{"s":"M","t":"I know. Do you know if the session is being recorded?","vi":"Tôi biết. Chị có biết buổi đào tạo có được ghi hình không?"},{"s":"W","t":"I don't think so. But the IT department is holding another session on Thursday morning.","vi":"Tôi nghĩ là không. Nhưng phòng IT sẽ tổ chức một buổi khác vào sáng thứ Năm."},{"s":"M","t":"Oh, good. I'll sign up for that one. Where can I register?","vi":"Ồ, tốt quá. Tôi sẽ đăng ký buổi đó. Tôi đăng ký ở đâu nhỉ?"},{"s":"W","t":"There's a link on the company intranet, under the IT news section.","vi":"Có một đường link trên mạng nội bộ công ty, trong mục tin tức IT."}],"qs":[{"q":"What are the speakers mainly discussing?","o":["A client contract","A training session","A business trip to Denver","A hiring decision"],"a":1,"ex":"Cả đoạn hội thoại xoay quanh 'software training session'. 'Denver' chỉ là nơi khách hàng ở, không phải chuyến công tác (bẫy lặp từ)."},{"q":"Why is the man unable to attend?","o":["He will be on vacation.","The office will be closed.","His computer is broken.","He has a schedule conflict."],"a":3,"ex":"Cuộc gọi với khách hàng bị dời sang hai giờ, 'right when the session starts' → trùng lịch."},{"q":"What will the man probably do next?","o":["Register online for another session","Contact the IT department by phone","Reschedule a client call","Record a training session"],"a":0,"ex":"Anh nói 'I'll sign up for that one' và người phụ nữ chỉ link trên intranet → đăng ký trực tuyến buổi thứ Năm. C sai vì anh không dời cuộc gọi; D lặp từ 'recorded'."}]},{"conv":[{"s":"M","t":"Kendra, the trade show starts in two days, and the banners for our booth still haven't arrived from the printer.","vi":"Kendra, hai ngày nữa hội chợ thương mại bắt đầu mà băng rôn cho gian hàng của mình vẫn chưa được nhà in giao."},{"s":"W","t":"Really? I placed that order three weeks ago.","vi":"Thật sao? Tôi đặt đơn đó từ ba tuần trước rồi."},{"s":"M","t":"I called them this morning. They said there was a problem with their equipment, and the banners won't be ready until Friday.","vi":"Sáng nay tôi đã gọi cho họ. Họ nói máy móc gặp sự cố và băng rôn phải đến thứ Sáu mới xong."},{"s":"W","t":"But the show opens on Thursday.","vi":"Nhưng hội chợ khai mạc vào thứ Năm mà."},{"s":"M","t":"Exactly. I asked whether they could rush the job, but they said they couldn't.","vi":"Đúng vậy. Tôi đã hỏi họ có thể làm gấp không, nhưng họ nói không thể."},{"s":"W","t":"Hmm. Lakeside Print Shop is just down the street. They did our brochures last year.","vi":"Hừm. Tiệm in Lakeside ở ngay cuối phố. Năm ngoái họ đã in tờ rơi cho chúng ta."},{"s":"M","t":"Good idea. I'll call them right now and see if they can finish by Wednesday.","vi":"Ý hay đấy. Tôi sẽ gọi cho họ ngay để xem họ có thể làm xong trước thứ Tư không."}],"qs":[{"q":"What event are the speakers preparing for?","o":["A grand opening","A client visit","A trade show","A company picnic"],"a":2,"ex":"Câu đầu tiên: 'the trade show starts in two days' và họ nói về gian hàng (booth)."},{"q":"What problem does the man mention?","o":["Their booth is too small.","Some banners will not be ready on time.","Some brochures contain errors.","The event has been canceled."],"a":1,"ex":"Nhà in nói băng rôn 'won't be ready until Friday' trong khi hội chợ khai mạc thứ Năm → không kịp. C lặp từ 'brochures' nhưng tờ rơi không có lỗi."},{"q":"What does the woman imply when she says, \"Lakeside Print Shop is just down the street\"?","o":["She would like to walk there.","The shop is difficult to find.","She will pick up some brochures.","They could use a different business."],"a":3,"ex":"Nhà in hiện tại không làm gấp được, nên cô gợi ý chuyển sang tiệm in Lakeside; người đàn ông đáp 'Good idea. I'll call them'. Các đáp án khác hiểu câu nói theo nghĩa đen."}]},{"conv":[{"s":"M","t":"Hello, this is Daniel Fisher in suite 410. The air conditioning in our office hasn't been working since yesterday afternoon.","vi":"Xin chào, tôi là Daniel Fisher ở phòng 410. Máy lạnh ở văn phòng chúng tôi không hoạt động từ chiều hôm qua."},{"s":"W","t":"I'm sorry to hear that, Mr. Fisher. We've had several complaints from the fourth floor today. A technician is already checking the main unit.","vi":"Rất tiếc về chuyện đó, anh Fisher. Hôm nay chúng tôi đã nhận vài phản ánh từ tầng bốn. Một kỹ thuật viên đang kiểm tra máy chính rồi."},{"s":"M","t":"Do you know how long it'll take? It's getting quite warm in here, and we have clients coming in at three.","vi":"Chị có biết mất bao lâu không? Ở đây đang khá nóng, và ba giờ chúng tôi có khách hàng đến."},{"s":"W","t":"The technician says a part needs to be replaced. He's expecting it to be delivered around noon.","vi":"Kỹ thuật viên nói cần thay một bộ phận. Anh ấy dự kiến linh kiện sẽ được giao vào khoảng trưa."},{"s":"M","t":"I see. In the meantime, is there somewhere else we could meet with our clients?","vi":"Tôi hiểu. Trong lúc chờ, có chỗ nào khác để chúng tôi gặp khách không?"},{"s":"W","t":"Yes, the conference room on the second floor is free this afternoon. I can reserve it for you.","vi":"Có, phòng hội nghị ở tầng hai chiều nay trống. Tôi có thể đặt cho anh."}],"qs":[{"q":"Who most likely is the woman?","o":["A building manager","A repair technician","A potential client","A hotel receptionist"],"a":0,"ex":"Cô tiếp nhận phản ánh của người thuê phòng, điều phối kỹ thuật viên và đặt phòng họp trong tòa nhà → quản lý tòa nhà. B sai vì cô chỉ nhắc đến kỹ thuật viên khác."},{"q":"What does the woman say about the problem?","o":["It has already been fixed.","It affects only the man's office.","It was caused by a power outage.","A part needs to be replaced."],"a":3,"ex":"'The technician says a part needs to be replaced.' B sai vì cô nói có nhiều phản ánh từ cả tầng bốn."},{"q":"What does the woman offer to do?","o":["Bring some electric fans","Reserve a meeting room","Contact the man's clients","Give the man a rent discount"],"a":1,"ex":"'the conference room on the second floor is free... I can reserve it for you' → đặt phòng họp."}]},{"conv":[{"s":"W","t":"Hi, Ivan. Have you got a minute? I'm putting together welcome packets for the three new sales associates starting Monday.","vi":"Chào Ivan. Anh có rảnh một phút không? Tôi đang chuẩn bị bộ tài liệu chào mừng cho ba nhân viên bán hàng mới bắt đầu làm từ thứ Hai."},{"s":"M","t":"Sure. What do you need?","vi":"Được chứ. Chị cần gì?"},{"s":"W","t":"I was hoping you could give them a tour of the warehouse in the morning. You know the inventory system better than anyone.","vi":"Tôi mong anh có thể dẫn họ tham quan nhà kho vào buổi sáng. Anh hiểu hệ thống kiểm kê hàng hơn ai hết."},{"s":"M","t":"Well, Monday morning I'm meeting with the shipping supervisor.","vi":"À, sáng thứ Hai tôi có cuộc họp với giám sát bộ phận vận chuyển."},{"s":"W","t":"How about the afternoon, then? Their orientation with human resources ends at noon.","vi":"Vậy buổi chiều thì sao? Buổi định hướng của họ với phòng nhân sự kết thúc lúc trưa."},{"s":"M","t":"That works. I can also show them how to use the barcode scanners. But they'll need ID badges to enter the warehouse.","vi":"Được đấy. Tôi cũng có thể chỉ họ cách dùng máy quét mã vạch. Nhưng họ sẽ cần thẻ nhân viên để vào nhà kho."},{"s":"W","t":"Right. I'll stop by the security office after lunch to request them.","vi":"Đúng rồi. Sau bữa trưa tôi sẽ ghé phòng an ninh để yêu cầu làm thẻ."}],"qs":[{"q":"What does the woman ask the man to do?","o":["Interview job candidates","Update an inventory list","Lead a tour for new employees","Order some scanners"],"a":2,"ex":"Cô nhờ 'give them a tour of the warehouse' cho nhân viên mới. B lặp từ 'inventory', D lặp từ 'scanners'."},{"q":"What does the man mean when he says, \"Monday morning I'm meeting with the shipping supervisor\"?","o":["He is not available at a certain time.","He hopes to be promoted soon.","The supervisor should lead the tour.","A shipment has been delayed."],"a":0,"ex":"Câu này đáp lại lời đề nghị dẫn tham quan vào buổi sáng, ngụ ý anh bận lúc đó; vì vậy người phụ nữ đề xuất buổi chiều."},{"q":"What will the woman probably do after lunch?","o":["Meet with a supervisor","Attend an orientation","Test some equipment","Request some ID badges"],"a":3,"ex":"'I'll stop by the security office after lunch to request them' (them = ID badges). B nhắc đến buổi định hướng nhưng đó là của nhân viên mới."}]},{"conv":[{"s":"W","t":"Good morning. I'm staying in room 512, and I was wondering if I could extend my stay by two nights. My meetings here have been extended until Friday.","vi":"Chào buổi sáng. Tôi ở phòng 512 và muốn hỏi liệu tôi có thể ở thêm hai đêm không. Các cuộc họp của tôi ở đây đã được kéo dài đến thứ Sáu."},{"s":"M","t":"Let me check... I'm afraid your room is booked from Thursday, but we can move you to a similar room on the seventh floor.","vi":"Để tôi kiểm tra... Rất tiếc phòng của chị đã có người đặt từ thứ Năm, nhưng chúng tôi có thể chuyển chị sang một phòng tương tự ở tầng bảy."},{"s":"W","t":"That's fine. Will I have to pack up and move my things myself?","vi":"Được thôi. Tôi có phải tự dọn và chuyển đồ đạc không?"},{"s":"M","t":"Not at all. Our staff can move your luggage while you're out. Just leave your key card at the front desk before you go.","vi":"Không cần đâu ạ. Nhân viên của chúng tôi sẽ chuyển hành lý trong lúc chị ra ngoài. Chị chỉ cần để lại thẻ phòng ở quầy lễ tân trước khi đi."},{"s":"W","t":"Perfect. Also, is the business center open this evening? I need to print some contracts.","vi":"Tuyệt. Ngoài ra, tối nay trung tâm dịch vụ văn phòng có mở cửa không? Tôi cần in vài bản hợp đồng."},{"s":"M","t":"It's open until ten P.M. You can get in with your room key.","vi":"Trung tâm mở đến mười giờ tối. Chị có thể vào bằng thẻ phòng."}],"qs":[{"q":"Why does the woman want to extend her stay?","o":["She missed her flight.","Her meetings will last longer than planned.","She is attending a wedding.","She wants to upgrade her room."],"a":1,"ex":"'My meetings here have been extended until Friday' → họp kéo dài. D sai vì chuyển phòng là do phòng cũ đã có người đặt, không phải nâng hạng."},{"q":"According to the man, what will the hotel staff do?","o":["Clean the room early","Reserve a taxi","Move the woman's luggage","Deliver breakfast"],"a":2,"ex":"'Our staff can move your luggage while you're out.'"},{"q":"What does the woman want to do this evening?","o":["Print some documents","Attend a dinner","Meet a colleague","Use the fitness center"],"a":0,"ex":"'I need to print some contracts' – contracts được diễn đạt lại thành 'documents'."}]},{"conv":[{"s":"W","t":"Thanks for joining me, Hiroshi and Leo. I wanted to talk about the customer survey results for our new line of energy drinks.","vi":"Cảm ơn Hiroshi và Leo đã tham gia. Tôi muốn bàn về kết quả khảo sát khách hàng cho dòng nước tăng lực mới của chúng ta."},{"s":"M","t":"Sure. Overall, the feedback was positive, especially about the flavor.","vi":"Vâng. Nhìn chung phản hồi tích cực, đặc biệt là về hương vị."},{"s":"M2","t":"But a lot of people said the cans are hard to open. Almost thirty percent mentioned it.","vi":"Nhưng nhiều người nói lon khó mở. Gần ba mươi phần trăm đã nhắc đến điều đó."},{"s":"W","t":"That's a significant number. Can the packaging team come up with a new design?","vi":"Đó là con số đáng kể. Nhóm bao bì có thể đưa ra thiết kế mới không?"},{"s":"M2","t":"I already spoke with them. They said they could have samples ready in about two weeks.","vi":"Tôi đã nói chuyện với họ rồi. Họ nói có thể chuẩn bị xong mẫu trong khoảng hai tuần."},{"s":"M","t":"That would still give us time before the national launch in March.","vi":"Như vậy vẫn kịp trước đợt ra mắt toàn quốc vào tháng Ba."},{"s":"W","t":"Great. Leo, could you set up a meeting with the packaging team for next week? I'd like to see their first sketches.","vi":"Tốt lắm. Leo, anh có thể sắp xếp một cuộc họp với nhóm bao bì vào tuần sau không? Tôi muốn xem các bản phác thảo đầu tiên của họ."},{"s":"M2","t":"I'll take care of it.","vi":"Tôi sẽ lo việc đó."}],"qs":[{"q":"What are the speakers mainly discussing?","o":["An advertising budget","A hiring plan","Some new store locations","The results of a customer survey"],"a":3,"ex":"Ngay câu đầu: 'talk about the customer survey results'. Các đáp án còn lại không được nhắc đến."},{"q":"What did many customers complain about?","o":["The price of a product","The packaging is difficult to open.","The flavor of a drink","A product is hard to find in stores."],"a":1,"ex":"'the cans are hard to open' → bao bì khó mở. C là bẫy vì hương vị được khen chứ không bị chê."},{"q":"What does the woman ask Leo to do?","o":["Design some new cans","Contact some customers","Arrange a meeting","Postpone a product launch"],"a":2,"ex":"'Leo, could you set up a meeting with the packaging team...?' – set up = arrange. A sai vì nhóm bao bì mới là người thiết kế."}]},{"conv":[{"s":"M","t":"Excuse me, I'm looking for a copy of Modern Leadership by Joanna Ellis. I couldn't find it in the business section.","vi":"Xin lỗi, tôi đang tìm cuốn Modern Leadership của Joanna Ellis. Tôi không thấy nó ở khu sách kinh doanh."},{"s":"W","t":"Let me check our system... It says we have two copies, but they might still be in the stockroom. Megan, has this morning's delivery been unpacked yet?","vi":"Để tôi kiểm tra hệ thống... Hệ thống báo còn hai cuốn, nhưng có thể vẫn đang ở trong kho. Megan, lô hàng sáng nay đã được dỡ ra chưa?"},{"s":"W2","t":"Not all of it. I was just about to start on the last few boxes.","vi":"Chưa hết. Tôi vừa định bắt đầu dỡ mấy thùng cuối."},{"s":"M","t":"I'm in a bit of a hurry. I have a train to catch in forty minutes.","vi":"Tôi hơi vội. Bốn mươi phút nữa tôi phải bắt tàu."},{"s":"W2","t":"I'll look through the boxes now. It should only take a few minutes.","vi":"Tôi sẽ lục các thùng ngay bây giờ. Chỉ mất vài phút thôi."},{"s":"W","t":"While you wait, would you like to sign up for our loyalty card? You'd get ten percent off today's purchase.","vi":"Trong lúc chờ, anh có muốn đăng ký thẻ khách hàng thân thiết không? Anh sẽ được giảm mười phần trăm cho lần mua hôm nay."},{"s":"M","t":"Sure, why not?","vi":"Được, sao lại không nhỉ?"}],"qs":[{"q":"Where most likely are the speakers?","o":["At a bookstore","At a library","At a train station","At a publishing company"],"a":0,"ex":"Khách tìm mua sách, nhân viên kiểm tra kho và mời làm thẻ giảm giá cho 'today's purchase' → hiệu sách. B sai vì thư viện không bán; C lặp từ 'train'."},{"q":"What does Megan say she was about to do?","o":["Reorganize some shelves","Place an order","Call a supplier","Unpack some boxes"],"a":3,"ex":"Megan nói 'I was just about to start on the last few boxes' khi được hỏi lô hàng đã dỡ chưa → dỡ thùng hàng."},{"q":"What does the woman offer the man?","o":["Free home delivery","A membership card with a discount","Gift wrapping","A copy set aside for later"],"a":1,"ex":"'sign up for our loyalty card? You'd get ten percent off' → thẻ thành viên kèm giảm giá."}]},{"conv":[{"s":"W","t":"Hello, Mr. Alvarez? This is Fiona Clarke from Greenfield Engineering. I'm calling about your application for the project coordinator position.","vi":"Xin chào, anh Alvarez phải không? Tôi là Fiona Clarke từ Greenfield Engineering. Tôi gọi về hồ sơ ứng tuyển vị trí điều phối viên dự án của anh."},{"s":"M","t":"Oh, hello, Ms. Clarke. Thank you for calling.","vi":"Ồ, chào chị Clarke. Cảm ơn chị đã gọi."},{"s":"W","t":"We were very impressed by your résumé, and we'd like to invite you in for an interview. Would next Tuesday at ten work for you?","vi":"Chúng tôi rất ấn tượng với sơ yếu lý lịch của anh và muốn mời anh đến phỏng vấn. Mười giờ thứ Ba tuần sau có phù hợp với anh không?"},{"s":"M","t":"Actually, I'm attending a conference out of town until Tuesday evening. Would Wednesday be possible?","vi":"Thật ra tôi đang dự một hội nghị ở tỉnh khác đến tối thứ Ba. Thứ Tư có được không ạ?"},{"s":"W","t":"Let me see... Yes, Wednesday at eleven is open. You'll meet with me and the head of our design department.","vi":"Để tôi xem... Vâng, mười một giờ thứ Tư còn trống. Anh sẽ gặp tôi và trưởng phòng thiết kế."},{"s":"M","t":"That sounds great. Is there anything I should bring?","vi":"Tuyệt quá. Tôi có cần mang theo gì không?"},{"s":"W","t":"Please bring a portfolio of projects you've managed. I'll also e-mail you directions to our office, since parking around here can be tricky.","vi":"Anh hãy mang theo hồ sơ các dự án anh đã quản lý. Tôi cũng sẽ gửi email chỉ đường đến văn phòng vì đỗ xe ở khu này khá khó."}],"qs":[{"q":"Why is the woman calling?","o":["To confirm a delivery","To offer the man a job","To arrange an interview","To register for a conference"],"a":2,"ex":"'we'd like to invite you in for an interview' và hai bên chốt lịch. B là bẫy: chưa phải mời nhận việc. D lặp từ 'conference'."},{"q":"Why is the man unable to come on Tuesday?","o":["He will be out of town at a conference.","He has another job interview.","His car is being repaired.","He is feeling unwell."],"a":0,"ex":"'I'm attending a conference out of town until Tuesday evening.'"},{"q":"What will the woman send to the man?","o":["An employment contract","A project portfolio","A conference schedule","Directions to an office"],"a":3,"ex":"'I'll also e-mail you directions to our office'. B sai vì hồ sơ dự án là thứ người đàn ông phải mang theo."}]},{"conv":[{"s":"M","t":"Hi, I'm calling from Ashford Consulting. We're holding a half-day workshop next Wednesday and need lunch for about forty people.","vi":"Xin chào, tôi gọi từ Ashford Consulting. Thứ Tư tới chúng tôi tổ chức một hội thảo nửa ngày và cần bữa trưa cho khoảng bốn mươi người."},{"s":"W","t":"Thanks for calling Evergreen Catering. Have you had a chance to look at our lunch packages?","vi":"Cảm ơn anh đã gọi đến Evergreen Catering. Anh đã xem qua các gói bữa trưa của chúng tôi chưa?"},{"s":"M","t":"Yes. I was thinking of the Deluxe package, but it's a bit over our budget.","vi":"Rồi. Tôi đã nghĩ đến gói Deluxe, nhưng nó hơi vượt ngân sách của chúng tôi."},{"s":"W","t":"Our Standard package is very popular. It includes sandwiches, salad, and fruit, but no dessert.","vi":"Gói Standard của chúng tôi rất được ưa chuộng. Gói này gồm bánh mì kẹp, salad và trái cây, nhưng không có món tráng miệng."},{"s":"M","t":"That should be fine. Let's go with that one. Oh, and several of the participants are vegetarian.","vi":"Như vậy là được. Chúng tôi chọn gói đó. À, có vài người tham dự ăn chay."},{"s":"W","t":"No problem. Just let me know exactly how many by Monday, and we'll prepare vegetarian options at no extra cost.","vi":"Không vấn đề gì. Anh chỉ cần báo chính xác số lượng trước thứ Hai, chúng tôi sẽ chuẩn bị món chay mà không tính thêm phí."}],"graphic":{"title":"Evergreen Catering - Lunch Packages","rows":[["Package","Price per person"],["Basic","$12"],["Standard","$16"],["Deluxe","$21"],["Premium","$25"]]},"qs":[{"q":"What event is the man planning?","o":["A product launch","A workshop","A retirement party","A board meeting"],"a":1,"ex":"'We're holding a half-day workshop next Wednesday'."},{"q":"Look at the graphic. How much per person will the man most likely pay?","o":["$12","$21","$16","$25"],"a":2,"ex":"Anh bỏ gói Deluxe vì vượt ngân sách và chọn gói Standard ('Let's go with that one'); theo bảng, Standard giá $16. $21 là bẫy vì đó là giá gói Deluxe được nhắc đến trước."},{"q":"What does the woman ask the man to provide by Monday?","o":["The number of vegetarian participants","A deposit payment","The address of the venue","A choice of dessert"],"a":0,"ex":"'let me know exactly how many by Monday' – ý nói số người ăn chay. D sai vì gói Standard không có tráng miệng."}]},{"conv":[{"s":"W","t":"Jacob, I need a meeting room on Thursday. The sales representative from Madison Office Furniture is coming in to talk about our new desk order.","vi":"Jacob, tôi cần một phòng họp vào thứ Năm. Nhân viên kinh doanh của Madison Office Furniture sẽ đến để bàn về đơn đặt bàn làm việc mới của chúng ta."},{"s":"M","t":"Let me check the schedule for Meeting Room B. How long will the meeting take?","vi":"Để tôi kiểm tra lịch của Phòng họp B. Cuộc họp kéo dài bao lâu?"},{"s":"W","t":"About an hour. She told me she can only come in the afternoon because she has another appointment in the morning.","vi":"Khoảng một tiếng. Cô ấy nói chỉ đến được vào buổi chiều vì buổi sáng có hẹn khác."},{"s":"M","t":"Well, the Accounting team has the room right after lunch.","vi":"À, nhóm Kế toán dùng phòng ngay sau giờ ăn trưa."},{"s":"W","t":"Then the later slot will have to do. Is that one still open?","vi":"Vậy thì đành lấy khung giờ muộn hơn. Khung đó còn trống không?"},{"s":"M","t":"Yes, it is. I'll reserve it in the online system now and send you a confirmation.","vi":"Còn. Tôi sẽ đặt nó trên hệ thống trực tuyến ngay bây giờ và gửi xác nhận cho chị."},{"s":"W","t":"Thanks. I'll let her know the time.","vi":"Cảm ơn. Tôi sẽ báo giờ cho cô ấy."}],"graphic":{"title":"Meeting Room B - Thursday","rows":[["Time","Booked by"],["9:00 - 10:30","Marketing"],["10:30 - 12:00","(Available)"],["1:00 - 2:30","Accounting"],["2:30 - 4:00","(Available)"]]},"qs":[{"q":"What is the purpose of the meeting the woman is planning?","o":["To interview a job applicant","To train some employees","To review a department budget","To discuss an order with a supplier"],"a":3,"ex":"Nhân viên kinh doanh của công ty nội thất đến 'to talk about our new desk order' → bàn về đơn hàng với nhà cung cấp. C là bẫy vì nhắc đến nhóm Kế toán."},{"q":"Look at the graphic. At what time will the meeting most likely begin?","o":["9:00","2:30","10:30","1:00"],"a":1,"ex":"Khách chỉ đến buổi chiều; khung 1:00 sau bữa trưa đã thuộc Accounting nên chọn khung muộn hơn còn trống là 2:30. 10:30 cũng trống nhưng là buổi sáng."},{"q":"What will the man most likely do next?","o":["Call a sales representative","Print some documents","Reserve a room online","Order some lunch"],"a":2,"ex":"'I'll reserve it in the online system now'. A sai vì người phụ nữ mới là người báo giờ cho khách."}]},{"conv":[{"s":"W","t":"Good morning. I have a ten o'clock appointment at Hartley Design Studio. I'm meeting with their team about a new logo for my bakery.","vi":"Chào buổi sáng. Tôi có hẹn lúc mười giờ ở Hartley Design Studio. Tôi gặp nhóm của họ để bàn về logo mới cho tiệm bánh của tôi."},{"s":"M","t":"Welcome. Hartley Design isn't on the fourth floor anymore, though. They switched floors with the dental clinic last week.","vi":"Chào mừng chị. Nhưng Hartley Design không còn ở tầng bốn nữa. Tuần trước họ đã đổi tầng với phòng khám nha khoa."},{"s":"W","t":"Oh, I'm glad you told me. The directory by the entrance still shows the old location.","vi":"Ồ, may mà anh nói cho tôi biết. Bảng chỉ dẫn ở lối vào vẫn ghi vị trí cũ."},{"s":"M","t":"Yes, we're waiting for a new sign to be made. By the way, the elevators on the east side are being serviced this morning.","vi":"Vâng, chúng tôi đang chờ làm bảng mới. Nhân tiện, sáng nay thang máy phía đông đang được bảo trì."},{"s":"W","t":"So how should I get up there?","vi":"Vậy tôi lên đó bằng cách nào?"},{"s":"M","t":"Please use the elevators next to the café. They're just past the security desk on your left.","vi":"Chị hãy dùng thang máy cạnh quán cà phê. Chúng ở ngay sau quầy an ninh, phía bên trái chị."},{"s":"W","t":"Thank you so much.","vi":"Cảm ơn anh rất nhiều."}],"graphic":{"title":"Kingsley Building Directory","rows":[["Floor","Tenant"],["1","Lobby & Cafe"],["2","Bayview Dental Clinic"],["3","Delmar Law Office"],["4","Hartley Design Studio"]]},"qs":[{"q":"Why is the woman visiting the building?","o":["To meet with a design company","To see a dentist","To deliver some baked goods","To apply for a job"],"a":0,"ex":"Cô có hẹn ở Hartley Design Studio để bàn logo mới. B lặp từ 'dental clinic', C lặp ý 'bakery' nhưng cô không giao bánh."},{"q":"Look at the graphic. Which floor will the woman go to?","o":["The first floor","The third floor","The fourth floor","The second floor"],"a":3,"ex":"Hartley Design đã đổi tầng với phòng khám nha khoa; theo bảng, phòng khám ở tầng 2 → studio giờ ở tầng 2. Tầng 4 là bẫy vì bảng chỉ dẫn chưa được cập nhật."},{"q":"What does the man suggest the woman do?","o":["Sign a visitor log","Use a different elevator","Wait in the café","Call the studio"],"a":1,"ex":"Thang máy phía đông đang bảo trì nên anh bảo 'use the elevators next to the café'. C lặp từ 'café' nhưng không bảo cô ngồi chờ."}]}],"p4":[{"intro":"Questions 71 through 73 refer to the following telephone message.","talk":"Hi, this is Angela Carter from Bayside Print Shop, returning your call about the brochures for your company's anniversary event. You asked whether we could print five hundred copies by Thursday. Unfortunately, the glossy paper you selected is out of stock until next week. However, we do have a matte paper of similar weight that many of our clients prefer, and it would still let us finish the job on time. I'd be happy to send you a free sample so you can compare the two. If you'd like to go ahead with the matte option, please call me back before noon tomorrow so we can schedule the printing. My direct line is 555-0148. Thanks, and have a good afternoon.","vi":"Xin chào, tôi là Angela Carter từ Bayside Print Shop, gọi lại về cuộc gọi của anh/chị liên quan đến tờ quảng cáo cho sự kiện kỷ niệm của công ty. Anh/chị hỏi liệu chúng tôi có thể in năm trăm bản trước thứ Năm không. Đáng tiếc là loại giấy bóng anh/chị chọn đã hết hàng đến tuần sau. Tuy nhiên, chúng tôi có loại giấy mờ cùng định lượng mà nhiều khách hàng ưa chuộng, và vẫn giúp chúng tôi hoàn thành đúng hạn. Tôi sẵn lòng gửi miễn phí một mẫu để anh/chị so sánh. Nếu muốn dùng giấy mờ, vui lòng gọi lại cho tôi trước trưa mai để chúng tôi lên lịch in. Số máy trực tiếp của tôi là 555-0148. Cảm ơn và chúc một buổi chiều tốt lành.","qs":[{"q":"What is the message mainly about?","o":["A delayed delivery of office furniture","A printing order for an event","A change in an event location","A request for a price estimate"],"a":1,"ex":"Người nói gọi lại 'about the brochures for your company's anniversary event' và hỏi việc in 500 bản → đơn in ấn cho sự kiện. Đáp án A, C, D không được nhắc đến; 'event' xuất hiện nhưng không đổi địa điểm."},{"q":"What problem does the speaker mention?","o":["A deadline has been moved up.","A machine is being repaired.","A design file is incomplete.","A type of paper is unavailable."],"a":3,"ex":"Câu then chốt: 'the glossy paper you selected is out of stock until next week' – loại giấy không có sẵn. Bẫy A: hạn thứ Năm vẫn giữ nguyên, không bị dời sớm."},{"q":"What does the speaker offer to do?","o":["Send a sample","Reduce a price","Deliver an order in person","Extend a deadline"],"a":0,"ex":"Người nói nói 'I'd be happy to send you a free sample' – đề nghị gửi mẫu. Từ 'free' có thể gây nhầm sang giảm giá (B) nhưng bài không nói giảm giá đơn hàng."}]},{"intro":"Questions 74 through 76 refer to the following announcement.","talk":"Attention, shoppers. Thank you for visiting Greenfield Market. Our store will be closing in thirty minutes, at nine o'clock. Please bring your final selections to the front registers. We'd also like to remind you that starting next Monday, our bakery department will open an hour earlier, at six A.M., so you can pick up fresh bread and pastries on your way to work. And don't forget, members of our Fresh Rewards program receive double points on all bakery items throughout the month of March. If you haven't joined yet, you can sign up at the customer service desk near the main entrance. It only takes a few minutes, and membership is free.","vi":"Xin quý khách chú ý. Cảm ơn quý khách đã đến Greenfield Market. Cửa hàng sẽ đóng cửa sau ba mươi phút nữa, lúc chín giờ. Vui lòng mang hàng đã chọn đến quầy thu ngân phía trước. Chúng tôi cũng xin nhắc rằng từ thứ Hai tới, quầy bánh sẽ mở cửa sớm hơn một tiếng, lúc sáu giờ sáng, để quý khách có thể mua bánh mì và bánh ngọt tươi trên đường đi làm. Và đừng quên, thành viên chương trình Fresh Rewards được nhân đôi điểm cho mọi sản phẩm bánh trong suốt tháng Ba. Nếu chưa tham gia, quý khách có thể đăng ký tại quầy dịch vụ khách hàng gần lối vào chính. Chỉ mất vài phút và hoàn toàn miễn phí.","qs":[{"q":"Where is the announcement being made?","o":["At a bank","At a fitness center","At a grocery store","At a train station"],"a":2,"ex":"'Thank you for visiting Greenfield Market', 'registers', 'bakery department' → siêu thị/cửa hàng thực phẩm. Các nơi khác không khớp từ khoá."},{"q":"What will change next Monday?","o":["A department will open earlier.","A new product line will be introduced.","The store will close earlier.","A parking area will be expanded."],"a":0,"ex":"'starting next Monday, our bakery department will open an hour earlier' → một bộ phận mở cửa sớm hơn. Bẫy C dùng lại ý 'closing' ở đầu bài nhưng đó là thông báo đóng cửa tối nay."},{"q":"According to the speaker, what can listeners do at the customer service desk?","o":["Return purchased items","Pick up a special order","Request a store map","Join a rewards program"],"a":3,"ex":"'If you haven't joined yet, you can sign up at the customer service desk' – đăng ký chương trình Fresh Rewards. Các lựa chọn khác là việc thường làm ở quầy dịch vụ nhưng không được nhắc."}]},{"intro":"Questions 77 through 79 refer to the following excerpt from a meeting.","talk":"Before we wrap up, I want to talk about the customer survey results for our new mobile banking app. Overall, people like the design, and most say it's easy to log in. But a lot of users complained that transferring money between accounts takes too many steps. Our development team has already proposed a shortcut button on the home screen. Now, the vendor told us they could add this feature by the end of the month. They also said that about the last update, and it took them three months. So, Mark, I'd like you to contact them this afternoon and get a written schedule with specific dates. Once we have that, we'll decide whether to announce the feature to customers.","vi":"Trước khi kết thúc, tôi muốn nói về kết quả khảo sát khách hàng cho ứng dụng ngân hàng di động mới. Nhìn chung, mọi người thích thiết kế và đa số nói đăng nhập dễ dàng. Nhưng nhiều người dùng phàn nàn rằng chuyển tiền giữa các tài khoản mất quá nhiều bước. Đội phát triển đã đề xuất một nút tắt trên màn hình chính. Bên nhà cung cấp nói họ có thể thêm tính năng này trước cuối tháng. Họ cũng đã nói vậy về bản cập nhật lần trước, và mất tới ba tháng. Vì vậy, Mark, tôi muốn anh liên hệ với họ chiều nay và lấy một lịch trình bằng văn bản với ngày cụ thể. Khi có lịch đó, chúng ta sẽ quyết định có thông báo tính năng cho khách hàng hay không.","qs":[{"q":"What did customers complain about?","o":["A process requires too many steps.","The login screen is confusing.","Service fees have increased.","The app design is outdated."],"a":0,"ex":"'transferring money between accounts takes too many steps' → quy trình quá nhiều bước. Bẫy B và D: bài nói khách thích thiết kế và đăng nhập dễ, ngược lại với đáp án."},{"q":"Why does the speaker say, \"They also said that about the last update, and it took them three months\"?","o":["To praise the vendor's quality","To explain why costs went up","To express doubt about a timeline","To suggest hiring more developers"],"a":2,"ex":"Ngay trước đó nhà cung cấp hứa xong 'by the end of the month'; nhắc lại lần trước hứa vậy mà mất ba tháng → người nói nghi ngờ mốc thời gian. Vì thế mới yêu cầu lịch bằng văn bản."},{"q":"What does the speaker ask Mark to do?","o":["Revise a survey","Obtain a schedule","Test a new feature","Write an announcement"],"a":1,"ex":"'get a written schedule with specific dates' – lấy lịch trình. Bẫy D: thông báo cho khách chỉ được quyết định sau khi có lịch, không giao cho Mark."}]},{"intro":"Questions 80 through 82 refer to the following radio broadcast.","talk":"You're listening to Business Hour on Hillcrest Radio. In local news, Delgado Motors announced today that it will open a new assembly plant on the east side of the city next spring. The company expects the facility to create around four hundred jobs, most of them in manufacturing and logistics. City officials say the project was approved after Delgado agreed to build a public bus stop and improve the roads around the site. Hiring is expected to begin in January, and the company will hold an information session at Ellison Community College on December fifth for anyone interested in applying. After the break, we'll be speaking with a local economist about what this means for small businesses in the area.","vi":"Bạn đang nghe chương trình Business Hour trên Hillcrest Radio. Tin địa phương: hôm nay Delgado Motors thông báo sẽ mở một nhà máy lắp ráp mới ở phía đông thành phố vào mùa xuân tới. Công ty dự kiến cơ sở này tạo khoảng bốn trăm việc làm, chủ yếu trong sản xuất và hậu cần. Quan chức thành phố cho biết dự án được phê duyệt sau khi Delgado đồng ý xây một trạm xe buýt công cộng và cải thiện đường sá quanh khu vực. Việc tuyển dụng dự kiến bắt đầu vào tháng Một, và công ty sẽ tổ chức buổi giới thiệu tại Cao đẳng Cộng đồng Ellison ngày 5 tháng 12 cho những ai muốn ứng tuyển. Sau giờ nghỉ, chúng tôi sẽ trò chuyện với một nhà kinh tế địa phương về ý nghĩa của việc này đối với doanh nghiệp nhỏ.","qs":[{"q":"What did Delgado Motors announce?","o":["A merger with another company","A new line of vehicles","A change in leadership","The opening of a facility"],"a":3,"ex":"'will open a new assembly plant' → mở một cơ sở mới. Bẫy B: công ty ô tô dễ khiến nghĩ tới mẫu xe mới nhưng bài không nhắc."},{"q":"According to the speaker, what did the company agree to do?","o":["Hire only local residents","Improve local transportation","Provide college scholarships","Reduce its energy use"],"a":1,"ex":"'agreed to build a public bus stop and improve the roads' – được diễn đạt lại thành cải thiện giao thông địa phương. Bẫy C nhắc trường cao đẳng nhưng đó chỉ là nơi tổ chức buổi giới thiệu."},{"q":"What will happen on December 5?","o":["A plant will begin operating.","A road will be closed.","An information session will be held.","An economist will be interviewed."],"a":2,"ex":"'will hold an information session at Ellison Community College on December fifth'. Bẫy D: cuộc phỏng vấn nhà kinh tế diễn ra ngay sau giờ nghỉ, không phải ngày 5/12."}]},{"intro":"Questions 83 through 85 refer to the following introduction.","talk":"Good morning, everyone, and welcome to the third day of the Regional Hospitality Conference. It's my pleasure to introduce our keynote speaker, Ms. Helen Ingram. Ms. Ingram started her career as a front desk clerk at a small inn, and twenty years later she is the director of operations for Fairmont Lodges, which now manages over sixty hotels across the country. She is best known for developing a staff training program that has dramatically reduced employee turnover. Today, she'll be sharing some of the strategies behind that program. Please note that her talk will run until eleven, and because of the large number of attendees, the question-and-answer session will take place in Room B instead of here. Now, please join me in welcoming Ms. Ingram.","vi":"Chào buổi sáng mọi người, chào mừng đến ngày thứ ba của Hội nghị Khách sạn Khu vực. Tôi rất vui được giới thiệu diễn giả chính, bà Helen Ingram. Bà Ingram bắt đầu sự nghiệp là nhân viên lễ tân tại một nhà trọ nhỏ, và hai mươi năm sau bà là giám đốc vận hành của Fairmont Lodges, nơi hiện quản lý hơn sáu mươi khách sạn trên toàn quốc. Bà nổi tiếng nhất với việc xây dựng chương trình đào tạo nhân viên giúp giảm mạnh tỷ lệ nghỉ việc. Hôm nay, bà sẽ chia sẻ một số chiến lược đằng sau chương trình đó. Xin lưu ý bài nói kéo dài đến mười một giờ, và do số người tham dự đông, phần hỏi đáp sẽ diễn ra ở Phòng B thay vì tại đây. Giờ xin mời mọi người cùng chào đón bà Ingram.","qs":[{"q":"Who most likely are the listeners?","o":["Hotel industry professionals","College students","Travel agents","Construction workers"],"a":0,"ex":"Đây là 'Regional Hospitality Conference' và diễn giả nói về khách sạn → người nghe làm trong ngành khách sạn. Bẫy C: du lịch liên quan nhưng không phải đối tượng hội nghị."},{"q":"What is Ms. Ingram known for?","o":["Opening a small inn","Designing a training program","Writing a best-selling book","Renovating historic hotels"],"a":1,"ex":"'best known for developing a staff training program' → thiết kế chương trình đào tạo. Bẫy A lặp từ 'small inn' – nơi bà từng làm lễ tân, không phải bà mở."},{"q":"What does the speaker say about the question-and-answer session?","o":["It has been canceled.","It will start before eleven.","It requires registration.","It will be held in a different room."],"a":3,"ex":"'the question-and-answer session will take place in Room B instead of here' → đổi phòng. Bẫy B: 'until eleven' là giờ kết thúc bài nói, không phải giờ bắt đầu hỏi đáp."}]},{"intro":"Questions 86 through 88 refer to the following telephone message.","talk":"Hi, Kevin. It's Laura from the marketing department. I'm calling about the product launch presentation for Lambert Electronics on Friday. I just found out that their team has grown, and now twelve people from their side will be attending instead of five. The conference room we reserved holds eight. I know, I know. I've already checked, and the large meeting hall on the second floor is free that morning, so I've booked it. What I need from you is to update the seating chart and let the catering company know about the extra guests. Also, could you print additional copies of the product handouts? I'll be out at a client visit until three, but you can reach me on my mobile if anything comes up.","vi":"Chào Kevin. Mình là Laura bên phòng marketing. Mình gọi về buổi thuyết trình ra mắt sản phẩm cho Lambert Electronics vào thứ Sáu. Mình vừa biết đội của họ đã đông hơn, và giờ sẽ có mười hai người bên họ tham dự thay vì năm. Phòng họp chúng ta đặt chỉ chứa tám người. Mình biết, mình biết. Mình đã kiểm tra rồi, hội trường lớn tầng hai trống sáng hôm đó nên mình đã đặt. Việc mình cần bạn làm là cập nhật sơ đồ chỗ ngồi và báo cho công ty cung cấp đồ ăn về số khách tăng thêm. Ngoài ra, bạn in thêm bản tài liệu sản phẩm được không? Mình đi gặp khách đến ba giờ, nhưng bạn có thể gọi di động nếu có gì phát sinh.","qs":[{"q":"What event is the speaker calling about?","o":["A staff training session","A company anniversary party","A product presentation","A job interview"],"a":2,"ex":"'the product launch presentation for Lambert Electronics on Friday' → buổi thuyết trình sản phẩm. Các lựa chọn còn lại không được đề cập."},{"q":"What does the speaker imply when she says, \"The conference room we reserved holds eight\"?","o":["The room is a good size for the meeting.","She wants to cancel the reservation.","The room was expensive to book.","The room is too small for the group."],"a":3,"ex":"Ngay trước đó cô nói sẽ có 12 người tham dự; phòng chỉ chứa 8 → phòng quá nhỏ. Vì vậy cô đã đặt hội trường lớn. Bẫy A hiểu theo nghĩa đen là phòng vừa đủ."},{"q":"What does the speaker ask the listener to do?","o":["Contact a catering company","Reserve a meeting hall","Call a client","Pick her up at three"],"a":0,"ex":"'let the catering company know about the extra guests' → liên hệ công ty đồ ăn. Bẫy B: hội trường cô đã tự đặt rồi ('I've booked it'); 'three' là giờ cô đi gặp khách."}]},{"intro":"Questions 89 through 91 refer to the following advertisement.","talk":"Is your business spending too much time on paperwork? Let Ashford Cloud Accounting do the work for you. Our online software automatically tracks your expenses, sends invoices to your customers, and prepares your tax reports, all in one place. And unlike other programs, Ashford connects directly with more than two hundred banks, so you never have to enter transactions by hand. Small business owners tell us they save an average of six hours a week after switching to Ashford. For a limited time, new customers can try our premium plan free for sixty days, with no credit card required. Just visit ashfordcloud.com and click 'Start Trial.' Ashford Cloud Accounting: less paperwork, more business.","vi":"Doanh nghiệp của bạn có đang tốn quá nhiều thời gian cho giấy tờ? Hãy để Ashford Cloud Accounting làm thay bạn. Phần mềm trực tuyến của chúng tôi tự động theo dõi chi phí, gửi hoá đơn cho khách hàng và chuẩn bị báo cáo thuế, tất cả ở một nơi. Và không giống các chương trình khác, Ashford kết nối trực tiếp với hơn hai trăm ngân hàng, nên bạn không bao giờ phải nhập giao dịch thủ công. Các chủ doanh nghiệp nhỏ cho biết họ tiết kiệm trung bình sáu giờ mỗi tuần sau khi chuyển sang Ashford. Trong thời gian có hạn, khách hàng mới có thể dùng thử gói cao cấp miễn phí sáu mươi ngày, không cần thẻ tín dụng. Chỉ cần truy cập ashfordcloud.com và nhấn 'Start Trial'. Ashford Cloud Accounting: ít giấy tờ hơn, kinh doanh nhiều hơn.","qs":[{"q":"What is being advertised?","o":["Accounting software","A banking service","A tax consulting firm","An office supply store"],"a":0,"ex":"'Ashford Cloud Accounting… Our online software' → phần mềm kế toán. Bẫy B và C dùng lại từ 'banks', 'tax reports' trong bài."},{"q":"According to the speaker, what makes the product different from others?","o":["It is available in several languages.","It connects directly to banks.","It includes a mobile app.","It offers live customer support."],"a":1,"ex":"Cụm 'unlike other programs, Ashford connects directly with more than two hundred banks' nêu điểm khác biệt. Các lựa chọn khác không được nhắc."},{"q":"What are new customers offered?","o":["A discount on a yearly plan","A free consultation","A free trial period","A gift card"],"a":2,"ex":"'new customers can try our premium plan free for sixty days' → dùng thử miễn phí. Bẫy A: không có giảm giá gói năm; 'no credit card required' không liên quan quà tặng thẻ."}]},{"intro":"Questions 92 through 94 refer to the following tour information.","talk":"Welcome to the Kingsley Glass Factory. My name is Diane, and I'll be your guide this morning. Kingsley has been making handmade glassware here since 1952, and many of the techniques you'll see today have been passed down through three generations of artisans. In a moment, we'll walk over to the furnace room, where you can watch our glassblowers shape a vase from start to finish. It gets very hot in there, so please stay behind the yellow line at all times. Photography is welcome, but we ask that you turn off your camera flash, as it can distract the workers. At the end of the tour, you'll each receive a coupon for fifteen percent off any purchase in our gift shop.","vi":"Chào mừng đến Nhà máy Thuỷ tinh Kingsley. Tôi là Diane, hướng dẫn viên của các bạn sáng nay. Kingsley đã làm đồ thuỷ tinh thủ công tại đây từ năm 1952, và nhiều kỹ thuật các bạn thấy hôm nay được truyền qua ba thế hệ nghệ nhân. Lát nữa, chúng ta sẽ đi sang phòng lò nung, nơi các bạn có thể xem thợ thổi thuỷ tinh tạo hình một chiếc bình từ đầu đến cuối. Trong đó rất nóng, nên vui lòng luôn đứng sau vạch vàng. Được phép chụp ảnh, nhưng xin tắt đèn flash vì nó có thể làm thợ mất tập trung. Cuối chuyến tham quan, mỗi bạn sẽ nhận một phiếu giảm giá mười lăm phần trăm cho bất kỳ món hàng nào ở cửa hàng quà tặng.","qs":[{"q":"What does the speaker say about the factory?","o":["It recently moved to a new location.","It exports most of its products.","It is the largest in the region.","It has used traditional methods for many years."],"a":3,"ex":"'since 1952… techniques… passed down through three generations' → dùng phương pháp truyền thống lâu năm. Các lựa chọn khác không có trong bài."},{"q":"What are the listeners asked to do?","o":["Wear protective glasses","Avoid using a camera flash","Leave their bags at the entrance","Keep their voices down"],"a":1,"ex":"'we ask that you turn off your camera flash' → tránh dùng flash. Bẫy: bài cũng yêu cầu đứng sau vạch vàng, nhưng không có trong lựa chọn; kính bảo hộ (A) không được nhắc."},{"q":"What will the listeners receive at the end of the tour?","o":["A small vase","A guidebook","A discount coupon","A certificate"],"a":2,"ex":"'you'll each receive a coupon for fifteen percent off' → phiếu giảm giá. Bẫy A lặp từ 'vase' – chiếc bình thợ làm trong buổi trình diễn."}]},{"intro":"Questions 95 through 97 refer to the following talk and schedule.","talk":"Good afternoon, team. As you know, the renovation of our office kitchen starts next week, so I've posted a schedule showing when each area will be closed. During the work, you can use the vending machines in the lobby, and the café across the street is offering our staff ten percent off. Now, I need to make one correction. The contractor called this morning and said the flooring materials won't arrive in time, so the flooring work will be pushed back two days. The other dates on the schedule are still accurate. Also, please remove any personal items from the kitchen cabinets by Friday afternoon. Anything left after that will be placed in a box in the supply room.","vi":"Chào buổi chiều cả nhóm. Như mọi người biết, việc cải tạo bếp văn phòng bắt đầu tuần tới, nên tôi đã đăng lịch cho biết khi nào từng khu vực đóng cửa. Trong thời gian thi công, mọi người có thể dùng máy bán hàng tự động ở sảnh, và quán cà phê bên kia đường giảm giá mười phần trăm cho nhân viên. Giờ tôi cần đính chính một điều. Nhà thầu gọi sáng nay và nói vật liệu sàn sẽ không đến kịp, nên phần làm sàn bị lùi lại hai ngày. Các ngày khác trên lịch vẫn chính xác. Ngoài ra, vui lòng lấy đồ cá nhân ra khỏi tủ bếp trước chiều thứ Sáu. Đồ còn sót lại sau đó sẽ được để vào một thùng trong phòng vật tư.","graphic":{"title":"Kitchen Renovation Schedule","rows":[["Work","Dates"],["Cabinet removal","March 3"],["Plumbing","March 4–5"],["Flooring","March 6–7"],["Painting","March 10"]]},"qs":[{"q":"According to the speaker, what is a café offering employees?","o":["Free coffee","A discount","Delivery service","Extended hours"],"a":1,"ex":"'the café across the street is offering our staff ten percent off' → giảm giá. Bẫy A: 'free' không xuất hiện; bài chỉ nói giảm 10%."},{"q":"Look at the graphic. When will the flooring work most likely begin?","o":["On March 4","On March 6","On March 10","On March 8"],"a":3,"ex":"Theo lịch, làm sàn bắt đầu ngày 6/3, nhưng người nói cho biết công việc này 'pushed back two days' → bắt đầu ngày 8/3. Bẫy B là ngày gốc trên bảng chưa điều chỉnh."},{"q":"What are listeners asked to do by Friday?","o":["Remove personal belongings","Submit a meal order","Sign up for a café account","Clean the supply room"],"a":0,"ex":"'please remove any personal items from the kitchen cabinets by Friday afternoon' → lấy đồ cá nhân. Bẫy D lặp từ 'supply room' – nơi để thùng đồ bỏ quên."}]},{"intro":"Questions 98 through 100 refer to the following telephone message and price list.","talk":"Hello, this is Martin Jensen calling from Cobalt Design Studio. We'd like to rent some equipment from your company for a photo shoot next Tuesday. I saw the price list on your Web site. We need one item for the full day, and we've decided to go with the most affordable lighting kit you offer, since we'll be shooting outdoors and only need it in the late afternoon. Could you also tell me whether delivery to our studio is included in the rental price? We're located on Birch Avenue, about fifteen minutes from your shop. If not, one of our assistants can come by and pick it up Monday evening. Please call me back at 555-0193. Thank you.","vi":"Xin chào, tôi là Martin Jensen gọi từ Cobalt Design Studio. Chúng tôi muốn thuê một số thiết bị từ công ty anh/chị cho buổi chụp ảnh vào thứ Ba tới. Tôi đã xem bảng giá trên website. Chúng tôi cần một món cho cả ngày, và đã quyết định chọn bộ đèn rẻ nhất mà bên anh/chị có, vì chúng tôi chụp ngoài trời và chỉ cần dùng vào cuối buổi chiều. Anh/chị có thể cho biết giá thuê đã bao gồm giao hàng đến studio chưa? Chúng tôi ở đại lộ Birch, cách cửa hàng khoảng mười lăm phút. Nếu chưa, một trợ lý của chúng tôi có thể đến lấy vào tối thứ Hai. Vui lòng gọi lại cho tôi theo số 555-0193. Cảm ơn.","graphic":{"title":"Equipment Rental – Daily Rates","rows":[["Item","Price per Day"],["Studio Lighting Kit","$120"],["Portable Lighting Kit","$85"],["LED Panel Set","$95"],["Backdrop Stand","$40"]]},"qs":[{"q":"What is the speaker preparing for?","o":["A product demonstration","A company picnic","A photo shoot","A building inspection"],"a":2,"ex":"'for a photo shoot next Tuesday' → buổi chụp ảnh. Bẫy B: 'shooting outdoors' có thể gợi đến hoạt động ngoài trời như dã ngoại."},{"q":"Look at the graphic. How much will the speaker most likely pay per day?","o":["$85","$120","$95","$40"],"a":0,"ex":"Người nói chọn 'the most affordable lighting kit' – trong các bộ đèn, rẻ nhất là Portable Lighting Kit $85. Bẫy D $40 là giá rẻ nhất trên bảng nhưng là giá đỡ phông, không phải bộ đèn."},{"q":"What does the speaker ask about?","o":["Whether a deposit is required","When the shop opens on Monday","How long a rental period lasts","Whether delivery is included"],"a":3,"ex":"'Could you also tell me whether delivery to our studio is included in the rental price?' → hỏi về giao hàng. Bẫy B lặp từ 'Monday evening' – thời điểm trợ lý có thể đến lấy, không phải câu hỏi."}]}],"p5":[{"q":"Ms. Abbott's presentation was ------- received by the board members.","o":["warm","warmly","warmth","warmer"],"a":1,"ex":"Chỗ trống đứng giữa trợ động từ bị động 'was' và quá khứ phân từ 'received' nên cần tr
