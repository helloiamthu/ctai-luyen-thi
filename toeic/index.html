e?","vi":"Bạn giúp tôi kiểm tra test case này được không?","why":"Sau 'help someone' dùng động từ nguyên mẫu (check hoặc to check), không dùng V-ing.","g":"Ngữ pháp"},{"wrong":"I will make my homework tonight.","right":"I will do my homework tonight.","vi":"Tối nay tôi sẽ làm bài tập.","why":"Collocation cố định: do homework, do a task; make a plan, make a decision.","g":"Dùng từ"},{"wrong":"I did a mistake in the report.","right":"I made a mistake in the report.","vi":"Tôi đã mắc lỗi trong báo cáo.","why":"Luôn nói 'make a mistake', không nói 'do a mistake'.","g":"Dùng từ"},{"wrong":"I have worked here since three years.","right":"I have worked here for three years.","vi":"Tôi đã làm ở đây được ba năm.","why":"For + khoảng thời gian (three years); since + mốc thời gian (since 2023).","g":"Giới từ"},{"wrong":"I live here for five years.","right":"I've lived here for five years.","vi":"Tôi sống ở đây được năm năm rồi.","why":"Việc bắt đầu trong quá khứ, kéo dài đến nay dùng hiện tại hoàn thành.","g":"Ngữ pháp"},{"wrong":"People is waiting outside.","right":"People are waiting outside.","vi":"Mọi người đang đợi bên ngoài.","why":"'People' là danh từ số nhiều nên đi với 'are'.","g":"Ngữ pháp"},{"wrong":"Can you send me more informations?","right":"Can you send me more information?","vi":"Bạn gửi thêm thông tin cho tôi được không?","why":"'Information' không đếm được, không thêm s.","g":"Ngữ pháp"},{"wrong":"We bought new equipments for the lab.","right":"We bought new equipment for the lab.","vi":"Chúng tôi đã mua thiết bị mới cho phòng lab.","why":"'Equipment' không đếm được, không thêm s. Muốn đếm: 'two pieces of equipment'.","g":"Ngữ pháp"},{"wrong":"He gave me many advices.","right":"He gave me a lot of advice.","vi":"Anh ấy cho tôi nhiều lời khuyên.","why":"'Advice' không đếm được: dùng a lot of/some advice, a piece of advice.","g":"Ngữ pháp"},{"wrong":"Are you free time tonight?","right":"Are you free tonight?","vi":"Tối nay bạn rảnh không?","why":"'Free' là tính từ đi với 'are you'; 'free time' là danh từ, không ghép như vậy.","g":"Dịch từng chữ"},{"wrong":"I am going to work by motorbike every day.","right":"I go to work by motorbike every day.","vi":"Ngày nào tôi cũng đi làm bằng xe máy.","why":"Thói quen lặp lại (every day) dùng hiện tại đơn, không dùng hiện tại tiếp diễn.","g":"Ngữ pháp"},{"wrong":"What is your name?","right":"May I have your name, please?","vi":"Cho tôi xin tên của anh/chị được không?","why":"Hỏi khách hàng/người lạ, 'What is your name?' nghe cộc như tra hỏi; câu kia lịch sự hơn.","g":"Lịch sự"},{"wrong":"Can you take me a glass of water?","right":"Can you bring me a glass of water?","vi":"Bạn mang cho tôi ly nước được không?","why":"Bring = mang đến chỗ người nói; take = mang đi chỗ khác.","g":"Dùng từ"},{"wrong":"Please remember me to send the report.","right":"Please remind me to send the report.","vi":"Nhớ nhắc tôi gửi báo cáo nhé.","why":"Remind someone = nhắc ai đó; remember = tự mình nhớ.","g":"Dùng từ"},{"wrong":"Give me the menu.","right":"Could I have the menu, please?","vi":"Cho tôi xem thực đơn.","why":"Câu mệnh lệnh 'Give me' nghe thô lỗ với nhân viên; dùng Could I have... please.","g":"Lịch sự"},{"wrong":"I come from Vietnamese.","right":"I come from Vietnam.","vi":"Tôi đến từ Việt Nam.","why":"Tên nước là Vietnam (thường viết liền); Vietnamese là người/tiếng Việt hoặc tính từ.","g":"Dùng từ"},{"wrong":"Same same.","right":"It's pretty much the same.","vi":"Cũng giống giống vậy thôi.","why":"'Same same' là tiếng Anh bồi; người bản xứ nói 'pretty much the same' hoặc 'about the same'.","g":"Dịch từng chữ"},{"wrong":"We will discuss with the team about this tomorrow.","right":"We will discuss this with the team tomorrow.","vi":"Ngày mai chúng ta sẽ bàn việc này với nhóm.","why":"Cấu trúc: discuss something with someone; bỏ 'about'.","g":"Giới từ"},{"wrong":"I'm interesting in software testing.","right":"I'm interested in software testing.","vi":"Tôi quan tâm đến kiểm thử phần mềm.","why":"Interested = cảm thấy hứng thú; interesting = thú vị (tính chất của sự vật).","g":"Dùng từ"},{"wrong":"She don't work on Fridays.","right":"She doesn't work on Fridays.","vi":"Cô ấy không làm việc vào thứ Sáu.","why":"Ngôi thứ ba số ít (he/she/it) dùng 'doesn't'.","g":"Ngữ pháp"},{"wrong":"Did you went to the meeting?","right":"Did you go to the meeting?","vi":"Bạn có đi họp không?","why":"Sau 'did' động từ trở về nguyên mẫu.","g":"Ngữ pháp"},{"wrong":"I'm married with a teacher.","right":"I'm married to a teacher.","vi":"Tôi kết hôn với một giáo viên.","why":"Dùng 'married to someone', không phải 'married with'.","g":"Giới từ"},{"wrong":"I'll call you when I will finish.","right":"I'll call you when I finish.","vi":"Xong việc tôi sẽ gọi cho bạn.","why":"Sau when/after/before/if nói về tương lai dùng hiện tại đơn, không dùng 'will'.","g":"Ngữ pháp"},{"wrong":"Although it rained, but we still went out.","right":"Although it rained, we still went out.","vi":"Mặc dù trời mưa nhưng chúng tôi vẫn ra ngoài.","why":"Tiếng Anh không dùng cặp 'although... but'; chỉ giữ một từ nối.","g":"Dịch từng chữ"},{"wrong":"Because I was tired, so I went home early.","right":"Because I was tired, I went home early.","vi":"Vì mệt nên tôi về nhà sớm.","why":"Không dùng cặp 'because... so' như 'vì... nên'; chỉ giữ một từ.","g":"Dịch từng chữ"},{"wrong":"The result is depend on the test data.","right":"The result depends on the test data.","vi":"Kết quả phụ thuộc vào dữ liệu test.","why":"'Depend' là động từ; không dùng 'is' trước nó và phải chia 'depends'.","g":"Ngữ pháp"},{"wrong":"I'm used to work late.","right":"I'm used to working late.","vi":"Tôi quen làm việc muộn rồi.","why":"'Be used to' + V-ing (quen với); 'used to + V' là thói quen trong quá khứ.","g":"Ngữ pháp"},{"wrong":"This task is very hard to me.","right":"This task is very hard for me.","vi":"Việc này rất khó đối với tôi.","why":"Khó/dễ với ai dùng 'for': hard for me, easy for me.","g":"Giới từ"},{"wrong":"We're good at play football.","right":"We're good at playing football.","vi":"Chúng tôi đá bóng giỏi.","why":"Sau giới từ (at, in, of...) động từ phải thêm -ing.","g":"Ngữ pháp"},{"wrong":"I'm waiting the bus.","right":"I'm waiting for the bus.","vi":"Tôi đang đợi xe buýt.","why":"Luôn nói 'wait for something'.","g":"Giới từ"},{"wrong":"Call me at 9 o'clock in Monday.","right":"Call me at 9 o'clock on Monday.","vi":"Gọi cho tôi lúc 9 giờ thứ Hai nhé.","why":"Dùng 'on' với thứ và ngày cụ thể; 'in' với tháng, năm.","g":"Giới từ"},{"wrong":"I was born on 1995.","right":"I was born in 1995.","vi":"Tôi sinh năm 1995.","why":"Năm dùng 'in'; ngày cụ thể mới dùng 'on' (on May 5th).","g":"Giới từ"},{"wrong":"I'll go to home now.","right":"I'll go home now.","vi":"Giờ tôi về nhà đây.","why":"'Home' ở đây là trạng từ, không cần 'to': go home, come home.","g":"Giới từ"},{"wrong":"I'll control the test results before the release.","right":"I'll check the test results before the release.","vi":"Tôi sẽ kiểm tra kết quả test trước khi release.","why":"'Control' là điều khiển, kiểm soát; 'kiểm tra' dùng check, review, verify.","g":"Dùng từ"},{"wrong":"I have a good news for you.","right":"I have some good news for you.","vi":"Tôi có tin vui cho bạn.","why":"'News' không đếm được dù có s; không dùng 'a'. Dùng some/a piece of.","g":"Ngữ pháp"},{"wrong":"He has many experiences in testing.","right":"He has a lot of experience in testing.","vi":"Anh ấy có nhiều kinh nghiệm kiểm thử.","why":"Kinh nghiệm (kỹ năng) là 'experience' không đếm được; 'experiences' là những trải nghiệm.","g":"Ngữ pháp"},{"wrong":"Repeat again, please.","right":"Could you say that again, please?","vi":"Bạn nói lại giúp tôi được không?","why":"'Repeat again' thừa ý và nghe như ra lệnh; câu hỏi với 'Could you' lịch sự hơn.","g":"Lịch sự"},{"wrong":"You must send me the report today.","right":"Could you send me the report today?","vi":"Hôm nay bạn gửi báo cáo cho tôi được không?","why":"'You must' nghe ra lệnh, gay gắt với đồng nghiệp; dùng câu nhờ với Could you.","g":"Lịch sự"},{"wrong":"I want a coffee.","right":"I'd like a coffee, please.","vi":"Cho tôi một ly cà phê.","why":"Gọi món nói 'I want' nghe trống không; 'I'd like... please' lịch sự hơn.","g":"Lịch sự"},{"wrong":"You understand?","right":"Does that make sense?","vi":"Bạn hiểu ý tôi không?","why":"'You understand?' nghe như nghi ngờ khả năng người nghe; 'Does that make sense?' nhẹ nhàng hơn.","g":"Lịch sự"},{"wrong":"The price of this phone is very expensive.","right":"The price of this phone is very high.","vi":"Giá chiếc điện thoại này rất cao.","why":"Giá thì 'high/low'; món đồ mới 'expensive/cheap'. Hoặc nói: 'This phone is very expensive.'","g":"Dùng từ"},{"wrong":"My house has four people.","right":"There are four people in my family.","vi":"Nhà tôi có bốn người.","why":"'House' là ngôi nhà (tòa nhà); nói về thành viên dùng 'family'.","g":"Dịch từng chữ"},{"wrong":"I'm hard to understand this.","right":"It's hard for me to understand this.","vi":"Tôi khó hiểu cái này.","why":"'I'm hard to understand' nghĩa là tôi khó hiểu (người khác khó hiểu tôi). Dùng It's hard for me to...","g":"Dịch từng chữ"},{"wrong":"I play with my friends on weekends.","right":"I hang out with my friends on weekends.","vi":"Cuối tuần tôi đi chơi với bạn bè.","why":"Người lớn 'chơi với bạn' là hang out; 'play with' nghe như trẻ con chơi đồ chơi.","g":"Dùng từ"},{"wrong":"This shirt is very suitable with you.","right":"This shirt really suits you.","vi":"Cái áo này rất hợp với bạn.","why":"Quần áo hợp người dùng động từ 'suit' (hoặc looks good on you), không dịch 'suitable with'.","g":"Dịch từng chữ"},{"wrong":"I go to Da Lat last week.","right":"I went to Da Lat last week.","vi":"Tuần trước tôi đi Đà Lạt.","why":"Có 'last week' là quá khứ, động từ phải chia quá khứ: went.","g":"Ngữ pháp"},{"wrong":"I have been to Japan last year.","right":"I went to Japan last year.","vi":"Năm ngoái tôi đã đi Nhật.","why":"Có mốc quá khứ xác định (last year) thì dùng quá khứ đơn, không dùng hiện tại hoàn thành.","g":"Ngữ pháp"},{"wrong":"Please feedback for me.","right":"Please give me some feedback.","vi":"Góp ý giúp tôi nhé.","why":"'Feedback' là danh từ, không dùng như động từ. Dùng give feedback.","g":"Dịch từng chữ"},{"wrong":"I'm busy tomorrow, so I can't join with you.","right":"I'm busy tomorrow, so I can't join you.","vi":"Mai tôi bận nên không đi cùng bạn được.","why":"'Join' đi thẳng với tân ngữ: join you, join the meeting; không cần 'with'.","g":"Giới từ"},{"wrong":"Please contact with me by email.","right":"Please contact me by email.","vi":"Vui lòng liên hệ với tôi qua email.","why":"'Contact' là động từ đi thẳng với tân ngữ; không nói 'contact with'.","g":"Giới từ"},{"wrong":"I'm looking forward to hear from you.","right":"I'm looking forward to hearing from you.","vi":"Tôi mong nhận được phản hồi từ bạn.","why":"'To' trong 'look forward to' là giới từ nên động từ sau phải là V-ing.","g":"Ngữ pháp"},{"wrong":"Can you say me the answer?","right":"Can you tell me the answer?","vi":"Bạn nói cho tôi đáp án được không?","why":"'Tell' đi với người nghe (tell me); 'say' không đi trực tiếp với người (say something to me).","g":"Dùng từ"},{"wrong":"He said me that the build failed.","right":"He told me that the build failed.","vi":"Anh ấy nói với tôi là bản build bị lỗi.","why":"'Tell someone that...'; 'said' không đi trực tiếp với tân ngữ chỉ người.","g":"Dùng từ"},{"wrong":"There have many bugs in this version.","right":"There are many bugs in this version.","vi":"Có nhiều bug trong phiên bản này.","why":"'Có' chỉ sự tồn tại dùng there is/there are, không dịch thành 'there have'.","g":"Dịch từng chữ"},{"wrong":"I very busy today.","right":"I'm very busy today.","vi":"Hôm nay tôi rất bận.","why":"Trước tính từ cần động từ 'to be' (am/is/are); tiếng Việt không có nên hay bị quên.","g":"Ngữ pháp"},{"wrong":"I am tester.","right":"I am a tester.","vi":"Tôi là tester.","why":"Nghề nghiệp số ít phải có mạo từ 'a/an': a tester, an engineer.","g":"Ngữ pháp"},{"wrong":"It costs two millions dong.","right":"It costs two million dong.","vi":"Nó giá hai triệu đồng.","why":"Sau số đếm cụ thể, million/thousand/hundred không thêm s.","g":"Ngữ pháp"},{"wrong":"He suggested me to retest the feature.","right":"He suggested that I retest the feature.","vi":"Anh ấy đề nghị tôi test lại tính năng đó.","why":"'Suggest' không dùng cấu trúc 'suggest someone to do'; dùng suggest that someone do hoặc suggest doing.","g":"Ngữ pháp"},{"wrong":"Sorry, I'm not understand.","right":"Sorry, I don't understand.","vi":"Xin lỗi, tôi không hiểu.","why":"Phủ định động từ thường dùng do/don't, không dùng 'am not'.","g":"Ngữ pháp"},{"wrong":"Hey you, can you help me?","right":"Excuse me, could you help me?","vi":"Xin lỗi, bạn giúp tôi được không?","why":"'Hey you' nghe rất thô lỗ khi gọi người lạ; mở đầu bằng 'Excuse me'.","g":"Lịch sự"},{"wrong":"I'm very happy to know you.","right":"It's very nice to meet you.","vi":"Rất vui được làm quen với bạn.","why":"Lần đầu gặp nói 'Nice to meet you'; 'happy to know you' là dịch từng chữ, không tự nhiên.","g":"Dịch từng chữ"}],"site":{"code":"TOEIC","name":"Từ vựng, mẫu câu & phim ngắn","key":"toeic-v1","views":["toeic","giaotiep","phim"],"migrate":{"from":"ctai-v1","fields":["toeic","film","lang"]}}}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=(s,r=document)=>r.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SITE=D.site||{code:'CT-AI',name:'Luyện thi',key:'ctai-v1',views:['home','hoc','nghe','thuatngu','luyentap','game','thi']};
const KEY=SITE.key;
document.getElementById('scode').textContent=SITE.code;document.getElementById('sname').textContent=SITE.name;
let S={lang:'both',stats:{},hist:[],read:{},exam:null,game:{},toeic:{known:{},best:{}},film:{seen:{},notes:{},mine:[]},learn:{pos:{},rate:0.9,sub:'both',voice:''}};
try{const raw=localStorage.getItem(KEY);if(raw)Object.assign(S,JSON.parse(raw));else if(SITE.migrate){const o=JSON.parse(localStorage.getItem(SITE.migrate.from)||'{}');SITE.migrate.fields.forEach(f=>{if(o[f])S[f]=o[f]})}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const CH=D.chapters.filter(c=>c.n>=1&&c.n<=7);
const chOf=q=>+q.lo.replace('AI-','').split('.')[0];
const QS=D.questions, QBY=Object.fromEntries(QS.map(q=>[q.id,q]));
const isOff=q=>/^[QA]\d/.test(q.id);
// text helpers: plain = needs escaping (syllabus), html = trusted markup (questions)
function two(o,html,tag='div'){const f=x=>html?x:esc(x).replace(/\n/g,'<br>');const en=o.en||'',vi=o.vi||'';
  if(S.lang==='en'||!vi||vi===en)return `<${tag}>${f(en)}</${tag}>`;
  if(S.lang==='vi')return `<${tag}>${f(vi)}</${tag}>`;
  return `<${tag}>${f(en)}</${tag}><${tag} class="vi">${f(vi)}</${tag}>`}
const one=o=>S.lang==='en'?o.en:(o.vi||o.en);
const fig=(h,src)=>{let i=0;const a=src||[];return h.replace(/\[\[FIGURE\]\]/g,()=>{const u=i<a.length?a[i]:'';i++;return u?`<img src="${u}" alt="Hình minh hoạ của câu hỏi">`:''})};
const fmt=s=>{s=Math.max(0,s|0);return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const sameSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
const loText=lo=>D.los[lo]?one(D.los[lo]):'';

const ALLV=[['home','Tổng quan'],['hoc','Tài liệu song ngữ'],['nghe','Học tiếng Anh'],['thuatngu','Thuật ngữ'],['gloss','Glossary ISTQB'],['luyentap','Luyện tập'],['game','Trò chơi'],['thi','Thi thử'],['toeic','TOEIC 600'],['giaotiep','Mẫu câu giao tiếp'],['phim','Phim ngắn']];
const ICON={"home": "<path d=\"M3 11l9-7 9 7\"/><path d=\"M5 10v10h14V10\"/>", "hoc": "<path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z\"/><path d=\"M4 19V5\"/>", "nghe": "<path d=\"M4 14v-2a8 8 0 0 1 16 0v2\"/><rect x=\"3\" y=\"14\" width=\"4\" height=\"6\" rx=\"1\"/><rect x=\"17\" y=\"14\" width=\"4\" height=\"6\" rx=\"1\"/>", "gloss": "<circle cx=\"11\" cy=\"11\" r=\"6\"/><path d=\"M20 20l-4.5-4.5\"/>", "thuatngu": "<path d=\"M4 6h16M4 12h10M4 18h7\"/>", "luyentap": "<path d=\"M9 11l3 3 8-8\"/><path d=\"M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11\"/>", "game": "<rect x=\"2\" y=\"7\" width=\"20\" height=\"11\" rx=\"4\"/><path d=\"M7 11v3M5.5 12.5h3\"/><circle cx=\"16\" cy=\"12\" r=\"1\"/><circle cx=\"18\" cy=\"14\" r=\"1\"/>", "thi": "<circle cx=\"12\" cy=\"13\" r=\"8\"/><path d=\"M12 9v4l2 2M9 2h6\"/>", "toeic": "<path d=\"M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z\"/><path d=\"M8 9h8M8 13h6\"/>", "giaotiep": "<path d=\"M4 5h16v10H9l-5 4z\"/><path d=\"M8 9h8M8 12h5\"/>", "phim": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M10 9l5 3-5 3z\"/>"};
const VIEWS=SITE.views.map(k=>ALLV.find(v=>v[0]===k)).filter(Boolean);
document.title=SITE.code+' · '+SITE.name;
if(VIEWS.length<2)document.body.classList.add('solo');
let view=VIEWS[0][0], sub={}, tick=null;
function nav(){ $('#nav').innerHTML=VIEWS.map(([k,l])=>`<a href="#${k}" ${k===view?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]||''}</svg>${l}</a>`).join('');
  document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===S.lang)) }
$('#lang').onclick=e=>{const l=e.target.dataset.l;if(l){S.lang=l;save();render()}};
window.addEventListener('hashchange',()=>{route();render()});
function route(){const h=location.hash.slice(1);view=VIEWS.some(v=>v[0]===h)?h:VIEWS[0][0]}
function render(){nav();clearInterval(tick);stopTalk();app.onclick=app.onchange=app.onkeydown=null;app.className=((view==='thi'&&S.exam&&!S.exam.done)||(view==='hoc'&&S.lang==='both'))?'wide':'';document.body.dataset.view=view;({home,hoc,nghe,gloss,thuatngu,luyentap,game,thi,toeic,giaotiep,phim})[view]()}
function go(v){if(location.hash.slice(1)===v){view=v;render()}else location.hash=v;window.scrollTo(0,0)}

/* ---------- Tổng quan ---------- */
function mastery(n){const qs=QS.filter(q=>chOf(q)===n);const ok=qs.filter(q=>S.stats[q.id]?.last===1).length;return [ok,qs.length]}
function home(){
  const off=QS.filter(q=>/^Q\d/.test(q.id)), pts=off.reduce((s,q)=>s+q.points,0);
  const done=Object.keys(S.stats).length;
  app.innerHTML=`<div class="hero"><span class="eyebrow">ISTQB® Specialist · v2.0</span><h1>Ôn thi Certified Tester AI Testing (CT-AI)</h1>
  <p class="muted">Đọc toàn bộ giáo trình song ngữ, nghe giáo trình bằng tiếng Anh, tra thuật ngữ, luyện câu hỏi, chơi trò chơi theo chương và thi thử có tính giờ. Tiến độ được lưu trên trình duyệt này.</p></div>
  <div class="panel stack"><h3>Cấu trúc đề mẫu</h3><div class="facts">
    <div class="fact"><b>${off.length}</b>câu hỏi trắc nghiệm</div><div class="fact"><b>${pts}</b>điểm tối đa (đề mẫu A)</div>
    <div class="fact"><b>65%</b>điểm đạt, tức ${Math.ceil(pts*.65)}/${pts}</div><div class="fact"><b>60′</b>làm bài (75′ nếu không thi bằng tiếng mẹ đẻ)</div></div>
    <p class="small muted">Điểm đạt và thời gian là quy định chung của ISTQB cho kỳ thi 40 câu; hãy xác nhận lại với đơn vị tổ chức thi của bạn. Các chương Giới thiệu, bài thực hành (HO), tài liệu tham khảo và phụ lục không nằm trong phạm vi thi.</p>
    <div class="row"><button class="btn pri" data-go="thi">Thi thử</button><button class="btn" data-go="luyentap">Luyện tập theo chương</button><button class="btn" data-go="game">Chơi để học</button><button class="btn" data-go="hoc">Đọc tài liệu</button><button class="btn" data-go="nghe">Học tiếng Anh</button></div></div>
  <div class="panel"><h3>Tiến độ theo chương</h3><p class="small muted">Tỷ lệ câu hỏi bạn trả lời đúng ở lần làm gần nhất. Đã làm ${done}/${QS.length} câu trong ngân hàng.</p>
    ${CH.map(c=>{const [ok,t]=mastery(c.n);return `<div class="chrow"><div><b>${esc(one(c.title))}</b><div class="small muted">${c.minutes} phút học · ${S.read[c.n]?'đã đọc':'chưa đọc'}</div></div>
      <div class="row"><div class="meter"><i style="width:${t?ok/t*100:0}%"></i></div><span class="mono small">${ok}/${t}</span></div>
      <button class="btn small" data-prac="${c.n}">Luyện</button></div>`}).join('')}</div>
  <div class="panel stack"><h3>Lịch sử thi thử</h3>${S.hist.length?`<div class="tw"><table><tr><th>Ngày</th><th>Đề</th><th>Điểm</th><th>Kết quả</th><th>Thời gian</th></tr>${S.hist.slice().reverse().map(h=>`<tr><td>${esc(h.date)}</td><td>${esc(h.name)}</td><td class="mono">${h.score}/${h.total} (${Math.round(h.score/h.total*100)}%)</td><td><span class="chip ${h.pass?'ok':'bad'}">${h.pass?'ĐẠT':'CHƯA ĐẠT'}</span></td><td class="mono">${fmt(h.used)}</td></tr>`).join('')}</table></div>`:'<p class="muted">Chưa có lần thi thử nào.</p>'}
    <div id="rst"><button class="btn small" id="reset">Xoá toàn bộ tiến độ</button></div></div>
  <p class="small muted">Nguồn: ISTQB® CT-AI Syllabus v2.0 và Sample Exam set A v2.2, © International Software Testing Qualifications Board. Bản dịch tiếng Việt không chính thức. ${QS.filter(q=>!isOff(q)).length} câu "bổ sung" do AI soạn theo giáo trình, không phải câu hỏi của ISTQB.</p>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.go)go(b.dataset.go);
    if(b.dataset.prac){sub.prac={ch:[+b.dataset.prac]};go('luyentap')}
    if(b.id==='reset')$('#rst').innerHTML='<span>Xoá hết thống kê và lịch sử?</span> <button class="btn small" id="yes">Xoá</button> <button class="btn small" id="no">Giữ lại</button>';
    if(b.id==='yes'){S.stats={};S.hist=[];S.read={};S.exam=null;S.game={};S.toeic={known:{},best:{}};S.gt={known:{},best:{},mis:{}};save();render()}
    if(b.id==='no')render()};
}

/* ---------- Học ---------- */
function block(b){
  if(b.type==='figure')return b.img?`<img src="${b.img}" alt="${esc(b.en||'Hình minh hoạ')}">`:'';
  if(b.type==='table')return `<div class="tw"><table>${b.rows.map((r,i)=>'<tr>'+r.map(c=>{const t=b.header&&i===0?'th':'td';return `<${t}>${two(c)}</${t}>`}).join('')+'</tr>').join('')}</table></div>`;
  const tag={h1:'h2',h2:'h3',h3:'h4',h4:'h5'}[b.type];
  if(tag)return `<div class="pair hd">${two(b,false,tag)}</div>`;
  if(b.type==='toc'){const r=b.ref?'  ·  '+b.ref:'';return `<div class="pair blk toc l${b.level||0}">${two({en:b.en+r,vi:b.vi+r})}</div>`}
  if(b.type==='li')return `<div class="pair blk li l${b.level||1}">${two(b)}</div>`;
  return `<div class="pair blk">${two(b)}</div>`}
function hoc(){
  const all=D.chapters, cur=all.find(c=>c.id===sub.ch)||all[0];sub.ch=cur.id;const i=all.indexOf(cur);
  app.innerHTML=`<div class="stack"><h1>Tài liệu song ngữ</h1><p class="muted">Toàn bộ ISTQB® CT-AI Syllabus v2.0 (93 trang): nguyên văn tiếng Anh và bản dịch tiếng Việt, chia theo phần.</p></div>
  <div class="row"><label for="chsel" class="muted">Phần</label><select id="chsel">${all.map(c=>`<option value="${c.id}" ${c===cur?'selected':''}>${esc(one(c.title))}</option>`).join('')}</select></div>
  <div class="panel doc">${cur.blocks.map(block).join('')}</div>
  <div class="row">${i>0?'<button class="btn" id="prev">← Phần trước</button>':''}
   ${cur.n>=1&&cur.n<=7?`<button class="btn" id="read">${S.read[cur.n]?'Đã đọc ✓':'Đánh dấu đã đọc'}</button><button class="btn pri" id="prac">Luyện câu hỏi chương này</button>`:''}
   ${i<all.length-1?'<button class="btn" id="next">Phần sau →</button>':''}</div>`;
  $('#chsel').onchange=e=>{sub.ch=e.target.value;render();window.scrollTo(0,0)};
  app.onclick=e=>{const id=e.target.id;
    if(id==='prev'||id==='next'){sub.ch=all[i+(id==='next'?1:-1)].id;render();window.scrollTo(0,0)}
    if(id==='read'){S.read[cur.n]=!S.read[cur.n];save();render()}
    if(id==='prac'){sub.prac={ch:[cur.n]};go('luyentap')}};
}

/* ---------- Glossary ISTQB ---------- */
const GL=D.gloss||[], GLBY=Object.fromEntries(GL.map(g=>[g.s,g]));
const GSY=[...new Set(GL.flatMap(g=>g.sy.map(x=>x[0])))].sort((a,b)=>(GL.filter(g=>g.sy.some(x=>x[0]===b)).length)-(GL.filter(g=>g.sy.some(x=>x[0]===a)).length));
const GTY=[...new Set(GL.map(g=>g.t))].sort();
const glS=()=>S.gl||(S.gl={known:{},best:{},f:{sy:'',ty:'',kw:false,q:'',l:'',st:'all'}});
const glDef=g=>S.lang==='en'?esc(g.d):S.lang==='vi'?esc(g.vd||g.d):`${esc(g.d)}<div class="vi">${esc(g.vd||'')}</div>`;
const glName=g=>`${esc(g.n)}${g.a?`<span class="ab">${esc(g.a)}</span>`:''}${S.lang!=='en'&&g.vn?`<div class="vi small">${esc(g.vn)}</div>`:''}`;
function glPool(){const G=glS(),f=G.f,q=(f.q||'').trim().toLowerCase();
  return GL.filter(g=>(!f.sy||g.sy.some(x=>x[0]===f.sy&&(!f.kw||x[1])))&&(!f.ty||g.t===f.ty)&&(!f.l||(f.l==='#'?!/^[a-z]/i.test(g.n):g.n[0].toUpperCase()===f.l))
    &&(f.st==='all'||(f.st==='known')===!!G.known[g.s])&&(!q||(g.n+' '+g.a+' '+g.vn+' '+g.d+' '+g.vd+' '+g.syn.join(' ')).toLowerCase().includes(q)))}
function gloss(){
  const G=glS(),f=G.f,m=sub.gm||(sub.gm={mode:'list',page:0});
  const pool=glPool(),known=GL.filter(g=>G.known[g.s]).length;
  const tabs=`<div class="seg" role="group" aria-label="Chế độ">${[['list','Danh sách'],['card','Thẻ ghi nhớ'],['quiz','Đoán thuật ngữ'],['match','Nối cặp'],['speed','Phản xạ 60 giây'],['type','Gõ thuật ngữ']].map(([k,l])=>`<button data-gmode="${k}" aria-pressed="${m.mode===k}">${l}</button>`).join('')}</div>`;
  const filt=`<div class="panel stack"><div class="row"><b>Đã thuộc ${known}/${GL.length}</b><div class="meter"><i style="width:${known/GL.length*100}%"></i></div></div>
    <input type="search" id="gq" placeholder="Tìm thuật ngữ, viết tắt, định nghĩa (Anh hoặc Việt)" value="${esc(f.q)}" aria-label="Tìm trong glossary">
    <div class="row"><label for="gsy" class="small muted">Giáo trình</label><select id="gsy"><option value="">Tất cả (${GL.length})</option>${GSY.map(x=>`<option value="${esc(x)}" ${f.sy===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <label class="ck small"><input type="checkbox" id="gkw" ${f.kw?'checked':''} ${f.sy?'':'disabled'}><span>Chỉ từ khóa của giáo trình</span></label></div>
    <div class="row"><label for="gty" class="small muted">Nhóm</label><select id="gty"><option value="">Mọi nhóm</option>${GTY.map(x=>`<option ${f.ty===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <label for="gst" class="small muted">Trạng thái</label><select id="gst"><option value="all">Mọi thuật ngữ</option><option value="new">Chưa thuộc</option><option value="known">Đã thuộc</option></select></div>
    <div class="letters">${['','#',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(l=>`<button data-gl="${l}" aria-pressed="${f.l===l}">${l||'Tất cả'}</button>`).join('')}</div>
    <div class="small muted">Đang chọn ${pool.length} thuật ngữ. Các trò chơi dùng đúng nhóm thuật ngữ đang chọn.</div></div>`;
  const head=`<div class="stack"><h1>ISTQB Glossary</h1><p class="muted">${GL.length} thuật ngữ chính thức của ISTQB® Glossary (bản tiếng Anh) kèm bản dịch tiếng Việt, lọc được theo giáo trình. Học bằng danh sách, thẻ ghi nhớ và 4 trò chơi.</p></div>${tabs}${filt}`;
  const bindFilt=()=>{const inp=$('#gq');inp.oninput=()=>{f.q=inp.value;m.page=0;save();gloss();const x=$('#gq');x.focus();x.setSelectionRange(x.value.length,x.value.length)};$('#gst').value=f.st};
  const reset=()=>{const k=m.mode;sub.gm={mode:k,page:0}};
  const base=e=>{const b=e.target.closest('button');if(!b)return false;
    if(b.dataset.gmode){sub.gm={mode:b.dataset.gmode,page:0};render();return true}
    if(b.dataset.gl!=null){f.l=b.dataset.gl;reset();save();render();return true}
    if(b.dataset.see){f.q=GLBY[b.dataset.see]?GLBY[b.dataset.see].n:b.dataset.see;f.l='';f.sy='';f.ty='';f.st='all';sub.gm={mode:'list',page:0};save();render();window.scrollTo(0,0);return true}
    return false};
  app.onchange=e=>{const t=e.target;
    if(t.id==='gsy'){f.sy=t.value;if(!f.sy)f.kw=false;reset();save();render()}
    if(t.id==='gkw'){f.kw=t.checked;reset();save();render()}
    if(t.id==='gty'){f.ty=t.value;reset();save();render()} if(t.id==='gst'){f.st=t.value;reset();save();render()}
    if(t.dataset.gk){if(t.checked)G.known[t.dataset.gk]=1;else delete G.known[t.dataset.gk];save()}};
  if(m.mode==='list'){const per=40,pages=Math.max(1,Math.ceil(pool.length/per));m.page=Math.min(m.page,pages-1);
    const rows=pool.slice(m.page*per,(m.page+1)*per);
    const pager=pages>1?`<div class="row"><button class="btn small" id="gpp" ${m.page?'':'disabled'}>← Trang trước</button><span class="mono small">Trang ${m.page+1}/${pages}</span><button class="btn small" id="gpn" ${m.page<pages-1?'':'disabled'}>Trang sau →</button></div>`:'';
    app.innerHTML=head+`<div class="panel">${rows.map(g=>`<div class="gl-row"><div style="min-width:0"><div class="nm">${glName(g)}</div><div>${glDef(g)}</div>
      ${g.syn.length?`<div class="small"><b>Đồng nghĩa:</b> ${g.syn.map(esc).join(', ')}</div>`:''}
      ${g.see.length?`<div class="small"><b>Xem thêm:</b> ${g.see.map(x=>`<button class="linkish" data-see="${esc(x[1])}">${esc(x[0])}</button>`).join(', ')}</div>`:''}
      <div class="meta"><span class="chip">${esc(g.t)}</span>${g.sy.map(x=>`<span class="chip ${x[1]?'k':''}" title="${x[1]?'Là từ khóa của giáo trình này':'Được dùng trong giáo trình này'}">${esc(x[0])}${x[1]?' ★':''}</span>`).join('')}</div>
      <div class="small"><a href="https://glossary.istqb.org/en_US/term/${encodeURIComponent(g.s)}" target="_blank" rel="noopener">Xem trên glossary.istqb.org</a></div></div>
      <div class="stack" style="align-items:flex-end">${spk(g.n)}<label class="ck small"><input type="checkbox" data-gk="${esc(g.s)}" ${G.known[g.s]?'checked':''}><span>Đã thuộc</span></label></div></div>`).join('')||'<p class="muted">Không có thuật ngữ nào khớp bộ lọc.</p>'}</div>${pager}
      <p class="small muted">★ = từ khóa (keyword) của giáo trình đó. Nguồn: ISTQB® Glossary, glossary.istqb.org, © ISTQB. Bản dịch tiếng Việt không chính thức.</p>`;
    bindFilt();
    app.onclick=e=>{const sb=e.target.closest('[data-say]');if(sb){speak(sb.dataset.say);return}if(base(e))return;const id=e.target.id;
      if(id==='gpp'||id==='gpn'){m.page+=id==='gpn'?1:-1;render();window.scrollTo(0,0)}};return}
  const need={card:1,quiz:4,match:6,speed:4,type:1}[m.mode];
  if(pool.length<need){app.innerHTML=head+`<div class="panel"><p>Cần ít nhất ${need} thuật ngữ trong bộ lọc để chơi chế độ này. Hãy nới bộ lọc.</p></div>`;bindFilt();app.onclick=base;return}
  const bestKey=m.mode+'|'+(f.sy||'*')+(f.kw?'*':'');
  const endPanel=(title,body)=>`<div class="panel stack"><h2>${title}</h2>${body}<div class="row"><button class="btn pri" id="gagain">Chơi lại</button><button class="btn" data-gmode="list">Về danh sách</button></div></div>`;
  const again=e=>{if(e.target.id==='gagain'){reset();render();return true}};
  if(m.mode==='card'){
    if(!m.order){m.order=shuffle(pool.map(g=>g.s)).slice(0,30);m.i=0;m.flip=false}
    if(m.i>=m.order.length){app.innerHTML=head+endPanel('Hết lượt thẻ',`<div>Đã xem ${m.order.length} thẻ. Bạn đã thuộc ${m.order.filter(s=>G.known[s]).length} thẻ trong lượt này.</div>`);bindFilt();app.onclick=e=>{if(again(e))return;base(e)};return}
    const g=GLBY[m.order[m.i]];
    app.innerHTML=head+`<div class="panel card" id="gcard" tabindex="0" role="button" aria-label="Lật thẻ"><div class="term">${esc(g.n)}${g.a?` <span class="ab">${esc(g.a)}</span>`:''}</div>
      ${m.flip?`${g.vn?`<div class="vi"><b>${esc(g.vn)}</b></div>`:''}<div>${esc(g.d)}</div><div class="vi">${esc(g.vd||'')}</div>`:'<div class="muted small">Bấm vào thẻ để xem định nghĩa</div>'}</div>
      <div class="row"><span class="mono">${m.i+1}/${m.order.length}</span>${spk(g.n)}<button class="btn" id="gno">Chưa thuộc</button><button class="btn pri" id="gyes">Đã thuộc</button></div>`;
    bindFilt();
    app.onclick=e=>{const sb=e.target.closest('[data-say]');if(sb){speak(sb.dataset.say);return}if(base(e))return;if(e.target.closest('#gcard')){m.flip=!m.flip;render();return}
      const id=e.target.id;if(id==='gyes'||id==='gno'){if(id==='gyes')G.known[g.s]=1;else delete G.known[g.s];save();m.i++;m.flip=false;render()}};
    app.onkeydown=e=>{if(e.target.id==='gcard'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();m.flip=!m.flip;render();$('#gcard').focus()}};return}
  if(m.mode==='quiz'){
    if(!m.order){m.order=shuffle(pool.map(g=>g.s)).slice(0,10);m.i=0;m.ok=0;m.wrong=[]}
    if(m.i>=m.order.length){if(!m.saved){m.saved=true;G.best[bestKey]=Math.max(G.best[bestKey]||0,m.ok);save()}
      app.innerHTML=head+endPanel('Kết quả',`<div class="verdict ${m.ok===m.order.length?'ok':''}">${m.ok}/${m.order.length} câu đúng</div><div class="muted">Kỷ lục với bộ lọc này: ${G.best[bestKey]}/${m.order.length}</div>${m.wrong.length?'<div><b>Cần ôn lại:</b></div>'+m.wrong.map(s=>`<div><b>${esc(GLBY[s].n)}</b> <span class="vi">${esc(GLBY[s].vn||'')}</span></div>`).join(''):''}`);
      bindFilt();app.onclick=e=>{if(again(e))return;base(e)};return}
    const a=m.order[m.i],g=GLBY[a];
    if(!m.cur){const rev=m.i%3===2;m.cur={rev,ch:shuffle([a,...shuffle(pool.filter(x=>x.s!==a).map(x=>x.s)).slice(0,3)])}}
    const face=s=>m.cur.rev?`<span>${S.lang==='en'?esc(GLBY[s].d):esc(GLBY[s].vd||GLBY[s].d)}</span>`:`<b>${esc(GLBY[s].n)}</b>${S.lang!=='en'&&GLBY[s].vn?` <span class="vi small">· ${esc(GLBY[s].vn)}</span>`:''}`;
    app.innerHTML=head+`<div class="row"><span class="mono">Câu ${m.i+1}/${m.order.length}</span><div class="meter"><i style="width:${m.i/m.order.length*100}%"></i></div><span class="chip ok">${m.ok} đúng</span></div>
      <div class="panel stack"><div class="small muted">${m.cur.rev?'Định nghĩa nào đúng với thuật ngữ này?':'Định nghĩa này là của thuật ngữ nào?'}</div><div style="font-size:17px">${m.cur.rev?`<b>${esc(g.n)}</b>`:glDef(g)}</div></div>
      <div class="stack">${m.cur.ch.map(s=>`<button class="mcard ${m.shown!=null?(s===a?'done':s===m.shown?'bad':''):''}" data-c="${esc(s)}">${face(s)}</button>`).join('')}</div>
      ${m.shown!=null?`<div class="expl"><b>${esc(g.n)}</b>${g.vn?` · <span class="vi">${esc(g.vn)}</span>`:''}<div>${glDef(g)}</div></div><div class="row"><button class="btn pri" id="gnext">${m.i+1<m.order.length?'Câu tiếp →':'Xem kết quả'}</button></div>`:''}`;
    bindFilt();
    app.onclick=e=>{if(base(e))return;if(e.target.id==='gnext'){m.i++;m.cur=null;m.shown=null;render();return}
      const b=e.target.closest('.mcard');if(!b||m.shown!=null)return;m.shown=b.dataset.c;if(m.shown===a){m.ok++;G.known[a]=1}else{m.wrong.push(a)}save();render()};return}
  if(m.mode==='match'){
    if(!m.left){const t=shuffle(pool.map(g=>g.s)).slice(0,6);m.left=t;m.right=shuffle(t);m.done=[];m.sel={};m.miss=0;m.start=Date.now()}
    if(m.done.length===m.left.length){const t=m.time??(m.time=Math.round((Date.now()-m.start)/1000)+m.miss*5);if(!m.saved){m.saved=true;G.best[bestKey]=Math.min(G.best[bestKey]||1e9,t);save()}
      app.innerHTML=head+endPanel('Ghép xong!',`<div class="big">${fmt(t)}</div><div class="muted">Cộng 5 giây cho mỗi lần ghép sai (${m.miss} lần). Kỷ lục với bộ lọc này: ${fmt(G.best[bestKey])}.</div>`);bindFilt();app.onclick=e=>{if(again(e))return;base(e)};return}
    const card=(side,s)=>{const g=GLBY[s],d=m.done.includes(s),cl=d?'done':(m.bad&&m.bad[side]===s)?'bad':m.sel[side]===s?'sel':'';
      return `<button class="mcard ${cl}" data-side="${side}" data-c="${esc(s)}" ${d?'disabled':''}>${side==='l'?`<b>${esc(g.n)}</b>${S.lang!=='en'&&g.vn?`<div class="vi small">${esc(g.vn)}</div>`:''}`:esc(S.lang==='en'?g.d:(g.vd||g.d))}</button>`};
    app.innerHTML=head+`<div class="row"><b>Nối cặp</b><span class="timer" id="gt"></span><span class="chip">${m.done.length}/${m.left.length} cặp</span><span class="chip bad">${m.miss} lần sai</span></div>
      <p class="small muted">Chạm một thuật ngữ bên trái rồi chạm định nghĩa tương ứng bên phải.</p>
      <div class="mcols"><div class="stack">${m.left.map(s=>card('l',s)).join('')}</div><div class="stack">${m.right.map(s=>card('r',s)).join('')}</div></div>`;
    bindFilt();const show=()=>{const t=$('#gt');if(t)t.textContent=fmt((Date.now()-m.start)/1000+m.miss*5)};show();tick=setInterval(show,1000);
    app.onclick=e=>{if(base(e))return;const b=e.target.closest('.mcard');if(!b||m.bad)return;m.sel[b.dataset.side]=b.dataset.c;
      if(m.sel.l!=null&&m.sel.r!=null){if(m.sel.l===m.sel.r){m.done.push(m.sel.l);m.sel={}}else{m.miss++;m.bad=m.sel;m.sel={};setTimeout(()=>{m.bad=null;if(sub.gm===m&&view==='gloss')render()},650)}}
      render()};return}
  if(m.mode==='speed'){
    if(m.left==null){m.left=60;m.score=0;m.streak=0;m.right=0}
    if(m.left<=0){if(!m.saved){m.saved=true;G.best[bestKey]=Math.max(G.best[bestKey]||0,m.score);save()}
      app.innerHTML=head+endPanel('Hết giờ!',`<div class="big">${m.score} điểm</div><div class="muted">Đúng ${m.right} thuật ngữ. Kỷ lục với bộ lọc này: ${G.best[bestKey]} điểm.</div>`);bindFilt();app.onclick=e=>{if(again(e))return;base(e)};return}
    if(!m.cur){const a=pool[Math.random()*pool.length|0].s;m.cur={a,ch:shuffle([a,...shuffle(pool.filter(x=>x.s!==a).map(x=>x.s)).slice(0,3)])}}
    const g=GLBY[m.cur.a];
    app.innerHTML=head+`<div class="row"><b>Phản xạ</b><span class="timer ${m.left<=10?'low':''}" id="gt">${fmt(m.left)}</span><span class="chip ok">${m.score} điểm</span><span class="chip k">chuỗi ×${m.streak}</span></div>
      <div class="panel stack"><div class="small muted">Định nghĩa này là của thuật ngữ nào?</div><div style="font-size:17px">${glDef(g)}</div></div>
      <div class="stack">${m.cur.ch.map(s=>`<button class="mcard ${m.shown!=null?(s===m.cur.a?'done':s===m.shown?'bad':''):''}" data-c="${esc(s)}"><b>${esc(GLBY[s].n)}</b>${S.lang!=='en'&&GLBY[s].vn?` <span class="vi small">· ${esc(GLBY[s].vn)}</span>`:''}</button>`).join('')}</div>`;
    bindFilt();
    tick=setInterval(()=>{m.left--;if(m.left<=0)render();else{const t=$('#gt');if(t){t.textContent=fmt(m.left);t.classList.toggle('low',m.left<=10)}}},1000);
    app.onclick=e=>{if(base(e))return;const b=e.target.closest('.mcard');if(!b||m.shown!=null)return;const c=b.dataset.c;m.shown=c;
      if(c===m.cur.a){m.score+=10+2*m.streak;m.streak++;m.right++}else{m.streak=0;m.left=Math.max(1,m.left-3)}
      render();setTimeout(()=>{m.shown=null;m.cur=null;if(sub.gm===m&&view==='gloss')render()},c===m.cur.a?450:1300)};return}
  // type: read definition, type the English term
  if(!m.order){m.order=shuffle(pool.map(g=>g.s)).slice(0,10);m.i=0;m.ok=0;m.hint=0;m.res=null}
  if(m.i>=m.order.length){if(!m.saved){m.saved=true;G.best[bestKey]=Math.max(G.best[bestKey]||0,m.ok);save()}
    app.innerHTML=head+endPanel('Kết quả',`<div class="verdict">${m.ok}/${m.order.length} thuật ngữ gõ đúng</div><div class="muted">Kỷ lục với bộ lọc này: ${G.best[bestKey]}/${m.order.length}</div>`);bindFilt();app.onclick=e=>{if(again(e))return;base(e)};return}
  const g=GLBY[m.order[m.i]],norm=x=>String(x).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const mask=g.n.split('').map((c,i)=>/[a-z0-9]/i.test(c)?(i<m.hint||i===0?c:'_'):c).join('');
  app.innerHTML=head+`<div class="row"><span class="mono">Câu ${m.i+1}/${m.order.length}</span><div class="meter"><i style="width:${m.i/m.order.length*100}%"></i></div><span class="chip ok">${m.ok} đúng</span></div>
    <div class="panel stack"><div class="small muted">Gõ thuật ngữ tiếng Anh có định nghĩa sau</div><div style="font-size:17px">${glDef(g)}</div>
      <div class="mono" style="font-size:18px;letter-spacing:.08em">${esc(mask)}</div>
      <input class="typein" id="gin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Thuật ngữ tiếng Anh" ${m.res?'disabled':''} value="${esc(m.typed||'')}">
      ${m.res?`<div class="expl"><b>${m.res==='ok'?'Chính xác!':'Chưa đúng.'}</b> Đáp án: <b>${esc(g.n)}</b>${g.a?` (${esc(g.a)})`:''}${g.vn?` · <span class="vi">${esc(g.vn)}</span>`:''}</div>`:''}
      <div class="row">${m.res?`<button class="btn pri" id="gnext">${m.i+1<m.order.length?'Câu tiếp →':'Xem kết quả'}</button>`:`<button class="btn pri" id="gchk">Kiểm tra</button><button class="btn" id="ghint">Gợi ý thêm chữ</button><button class="btn" id="gskip">Chịu, xem đáp án</button>`}</div></div>`;
  bindFilt();const inp=$('#gin');if(!m.res)inp.focus();
  const check=()=>{m.typed=inp.value;const ok=norm(inp.value)===norm(g.n)||(g.a&&norm(inp.value)===norm(g.a))||g.syn.some(x=>norm(x)===norm(inp.value));m.res=ok?'ok':'bad';if(ok){m.ok++;G.known[g.s]=1;save()}render()};
  app.onkeydown=e=>{if(e.target.id==='gin'&&e.key==='Enter'){e.preventDefault();check()}};
  app.onclick=e=>{if(base(e))return;const id=e.target.id;if(id==='gchk')check();if(id==='gskip'){m.typed=inp.value;m.res='bad';render()}
    if(id==='ghint'){m.typed=inp.value;m.hint=Math.min(g.n.length,(m.hint||1)+2);render()}
    if(id==='gnext'){m.i++;m.res=null;m.typed='';m.hint=0;render()}};
}

/* ---------- Thuật ngữ ---------- */
function thuatngu(){
  const m=sub.tm||(sub.tm={mode:'list',q:'',i:0,flip:false,set:'terms'});const src=D[m.set];
  const head=`<div class="row"><div class="seg"><button data-set="terms" aria-pressed="${m.set==='terms'}">Thuật ngữ AI (${D.terms.length})</button><button data-set="abbr" aria-pressed="${m.set==='abbr'}">Từ viết tắt (${D.abbr.length})</button></div>
   <div class="seg"><button data-mode="list" aria-pressed="${m.mode==='list'}">Danh sách</button><button data-mode="card" aria-pressed="${m.mode==='card'}">Thẻ ghi nhớ</button></div></div>`;
  if(m.mode==='card'){const o=m.order&&m.order.length===src.length?m.order:(m.order=src.map((_,i)=>i));const t=src[o[m.i%src.length]];
    app.innerHTML=head+`<div class="panel card" id="card" tabindex="0" role="button" aria-label="Lật thẻ"><div class="term">${esc(t[0].en)}</div>
      ${m.flip?`<div class="vi"><b>${esc(t[0].vi)}</b></div><div>${esc(t[1].en)}</div><div class="vi">${esc(t[1].vi)}</div>`:'<div class="muted small">Bấm để xem nghĩa và định nghĩa</div>'}</div>
     <div class="row"><button class="btn" id="tp">← Trước</button><span class="mono">${m.i%src.length+1}/${src.length}</span><button class="btn pri" id="tn">Tiếp →</button><button class="btn" id="ts">Trộn thẻ</button></div>`;
  }else{const q=m.q.toLowerCase();const rows=src.filter(t=>!q||(t[0].en+t[0].vi+t[1].en+t[1].vi).toLowerCase().includes(q));
    app.innerHTML=head+`<input type="search" id="tq" placeholder="Tìm thuật ngữ (Anh hoặc Việt)" value="${esc(m.q)}" aria-label="Tìm thuật ngữ">
     <div class="tw"><table><tr><th style="width:32%">Thuật ngữ</th><th>Định nghĩa</th></tr>${rows.map(t=>`<tr><td><b>${esc(t[0].en)}</b>${t[0].vi&&t[0].vi!==t[0].en?`<div class="vi">${esc(t[0].vi)}</div>`:''}</td><td>${two(t[1])}</td></tr>`).join('')||'<tr><td colspan="2" class="muted">Không tìm thấy thuật ngữ nào khớp.</td></tr>'}</table></div>`;
    const inp=$('#tq');inp.oninput=()=>{m.q=inp.value;thuatngu();const n=$('#tq');n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
  app.onclick=e=>{const b=e.target.closest('button'),c=e.target.closest('#card');
    if(c){m.flip=!m.flip;render();return} if(!b)return;
    if(b.dataset.set){m.set=b.dataset.set;m.i=0;m.order=null;m.flip=false;render()}
    if(b.dataset.mode){m.mode=b.dataset.mode;render()}
    if(b.id==='tn'){m.i++;m.flip=false;render()} if(b.id==='tp'){m.i=(m.i-1+src.length)%src.length;m.flip=false;render()}
    if(b.id==='ts'){m.order=shuffle(src.map((_,i)=>i));m.i=0;m.flip=false;render()}};
  app.onkeydown=e=>{if(e.target.id==='card'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();m.flip=!m.flip;render();$('#card').focus()}};
}

/* ---------- Câu hỏi (dùng chung) ---------- */
function qHTML(q,pick,reveal,num){
  const multi=q.select>1;
  return `<div class="q stack"><div class="row"><b>${num}</b><span class="chip">${esc(q.lo)}</span><span class="chip k">${q.k}</span><span class="chip">${q.points} điểm</span>
    <span class="chip ${isOff(q)?'':'warn'}">${isOff(q)?'Đề mẫu ISTQB '+q.id:'Bổ sung'}</span></div>
   ${loText(q.lo)?`<div class="small muted">Mục tiêu học tập: ${esc(loText(q.lo))}</div>`:''}
   <div class="stem">${fig(two(q.stem,true),q.figStem)}</div>
   ${q.stem_figure_text?`<div class="expl"><b>Nội dung trong hình</b>${two(q.stem_figure_text,true)}</div>`:''}
   <div class="small muted">${!q.select?'Câu dạng ghép cặp/sắp xếp: tự làm ra giấy rồi mở đáp án để đối chiếu.':multi?`Chọn ${q.select} đáp án.`:'Chọn MỘT đáp án.'}</div>
   <div class="stack" role="${multi?'group':'radiogroup'}">${q.options.map(o=>{const sel=pick.includes(o.key),ok=q.correct.includes(o.key);
     const cls=reveal?(ok?'right':sel?'wrong':''):(sel?'sel':'');
     return `<label class="opt ${cls}"><input type="${multi?'checkbox':'radio'}" name="opt" value="${o.key}" ${sel?'checked':''} ${reveal?'disabled':''}><span class="k">${o.key})</span><span class="tx">${two(o,true)}</span>${reveal&&ok?'<span class="tag" style="color:var(--ok)">✓ Đúng</span>':reveal&&sel?'<span class="tag" style="color:var(--bad)">✗ Sai</span>':''}</label>`}).join('')}</div>
   ${reveal?`<div class="expl"><b>Giải thích</b>${fig(two(q.explanation,true),q.figExpl)}${q.explanation_figure_text?two(q.explanation_figure_text,true):''}</div>`:''}</div>`}
function readPick(q,pick,inp){if(q.select>1){const i=pick.indexOf(inp.value);if(inp.checked&&i<0){if(pick.length>=q.select){inp.checked=false;return pick}pick.push(inp.value)}else if(!inp.checked&&i>=0)pick.splice(i,1);return pick}return [inp.value]}
const mark=(q,pick,self)=>{const ok=q.select?sameSet(pick,q.correct):!!self;const s=S.stats[q.id]||(S.stats[q.id]={n:0,c:0});s.n++;s.c+=ok?1:0;s.last=ok?1:0;save();return ok};

/* ---------- Luyện tập ---------- */

  const p=sub.prac||(sub.prac={});

     <div class="panel stack"><b>Chương</b><div class="checks">${CH.map(c=>`<label class="ck"><input type="checkbox" id="pc${c.n}" data-ch="${c.n}" ${p.ch.includes(c.n)?'checked':''}><span>${esc(one(c.title))}</span></label>`).join('')}</div>
      <div class="row"><label for="psrc">Nguồn</label><select id="psrc"><option value="all">Tất cả</option><option value="off">Chỉ đề mẫu ISTQB</option><option value="extra">Chỉ câu bổ sung</option></select>
       <label for="pflt">Lọc</label><select id="pflt"><option value="all">Mọi câu</option><option value="new">Câu chưa làm</option><option value="wrong">Câu từng làm sai</option></select>
       <label for="pcnt">Số câu</label><select id="pcnt"><option>10</option><option>20</option><option>40</option><option value="all">Tất cả</option></select></div>
      <div class="row"><button class="btn pri" id="pgo">Bắt đầu</button><span class="muted" id="pn"></span></div></div>`;
    $('#psrc').value=p.src;$('#pflt').value=p.flt;$('#pcnt').value=p.cnt;
    const upd=()=>{const n=pool().length;$('#pn').textContent=n?`Có ${n} câu phù hợp.`:'Không có câu nào phù hợp. Hãy đổi bộ lọc.';$('#pgo').disabled=!n};upd();
    app.onchange=e=>{const t=e.target;if(t.dataset.ch){const n=+t.dataset.ch;p.ch=t.checked?[...p.ch,n]:p.ch.filter(x=>x!==n)}
      if(t.id==='psrc')p.src=t.value;if(t.id==='pflt')p.flt=t.value;if(t.id==='pcnt')p.cnt=t.value;upd()};
    app.onclick=e=>{if(e.target.id==='pgo'){let l=shuffle(pool());if(p.cnt!=='all')l=l.slice(0,+p.cnt);p.list=l.map(q=>q.id);p.i=0;p.pick=[];p.rev=false;p.ok=0;render()}};
    return}
  if(p.i>=p.list.length){app.innerHTML=`<div class="panel stack"><h2>Xong lượt luyện tập</h2><div class="verdict">${p.ok}/${p.list.length} câu đúng</div>
     <div class="row"><button class="btn pri" id="again">Luyện lượt mới</button><button class="btn" data-go="home">Về tổng quan</button></div></div>`;
    app.onclick=e=>{if(e.target.id==='again'){sub.prac={ch:p.ch,src:p.src,flt:p.flt,cnt:p.cnt};render()}if(e.target.dataset.go)go('home')};app.onchange=null;return}
  const q=QBY[p.list[p.i]];
  app.innerHTML=`<div class="row"><span class="mono">Câu ${p.i+1}/${p.list.length}</span><div class="meter"><i style="width:${p.i/p.list.length*100}%"></i></div><span class="chip ok">${p.ok} đúng</span><button class="btn small" id="quit">Dừng</button></div>
   <div class="panel">${qHTML(q,p.pick,p.rev,'Câu '+(p.i+1))}</div>
   <div class="row">${p.rev&&!q.select&&!p.marked?'<span>Bạn làm có đúng không?</span><button class="btn pri" id="sy">Tôi làm đúng</button><button class="btn" id="sn">Tôi làm sai</button>':p.rev?`<button class="btn pri" id="nx">${p.i+1<p.list.length?'Câu tiếp →':'Xem kết quả'}</button>`:`<button class="btn pri" id="chk" ${p.pick.length===q.select?'':'disabled'}>${q.select?'Kiểm tra':'Xem đáp án'}</button>`}</div>`;
  app.onchange=e=>{if(e.target.name==='opt'&&!p.rev){p.pick=readPick(q,p.pick,e.target);render()}};
  app.onclick=e=>{const id=e.target.id;if(id==='chk'){p.rev=true;p.marked=false;if(q.select&&mark(q,p.pick))p.ok++;render()}
    if(id==='sy'||id==='sn'){p.marked=true;if(mark(q,[],id==='sy'))p.ok++;render()}
    if(id==='nx'){p.i++;p.pick=[];p.rev=false;render();window.scrollTo(0,0)} if(id==='quit'){sub.prac={ch:p.ch};render()}};
}

/* ---------- Trò chơi ---------- */
const gs=n=>S.game['c'+n]||(S.game['c'+n]={});
const starHTML=k=>`<span class="stars" aria-label="${k||0} trên 3 sao">${'★'.repeat(k||0)}<i>${'★'.repeat(3-(k||0))}</i></span>`;
function chTerms(n,min){let l=(CH.find(c=>c.n===n).terms||[]).slice();if(l.length<min){const rest=shuffle(D.terms.map((_,i)=>i).filter(i=>!l.includes(i)));l=l.concat(rest.slice(0,min-l.length))}return l}
function startGame(m,n){
  if(m==='run')sub.g={mode:m,n,list:shuffle(QS.filter(q=>chOf(q)===n&&q.select)).slice(0,8).map(q=>q.id),i:0,hearts:3,pick:[],rev:false};
  if(m==='match'){const t=shuffle(chTerms(n,6)).slice(0,6);sub.g={mode:m,n,left:t,right:shuffle(t),done:[],sel:{},miss:0,start:Date.now()}}
  if(m==='speed')sub.g={mode:m,n,pool:chTerms(n,8),left:60,score:0,streak:0,right:0};
  render();window.scrollTo(0,0)}
function game(){
  const g=sub.g;
  if(!g){app.innerHTML=`<div class="stack"><h1>Trò chơi theo chương</h1><p class="muted">Ba cách chơi để nhớ kiến thức từng chương. Thành tích tốt nhất được lưu trên trình duyệt này.</p></div>
    <div class="panel stack"><div><b>Vượt ải</b>: trả lời câu hỏi của chương với 3 mạng, còn càng nhiều mạng càng nhiều sao.</div><div><b>Nối cặp</b>: ghép thuật ngữ với định nghĩa, càng nhanh càng tốt.</div><div><b>Phản xạ</b>: 60 giây, đọc định nghĩa và chọn đúng thuật ngữ; trả lời đúng liên tiếp được cộng thêm điểm.</div></div>
    <div class="panel">${CH.map(c=>{const r=gs(c.n);return `<div class="grow"><div><b>${esc(one(c.title))}</b><div class="small muted">${starHTML(r.stars)} · Nối cặp: ${r.match?fmt(r.match):'chưa chơi'} · Phản xạ: ${r.speed!=null?r.speed+' điểm':'chưa chơi'}</div></div>
      <div class="row"><button class="btn pri small" data-m="run" data-n="${c.n}">Vượt ải</button><button class="btn small" data-m="match" data-n="${c.n}">Nối cặp</button><button class="btn small" data-m="speed" data-n="${c.n}">Phản xạ</button></div></div>`}).join('')}</div>`;
    app.onclick=e=>{const b=e.target.closest('button[data-m]');if(b)startGame(b.dataset.m,+b.dataset.n)};return}
  const c=CH.find(x=>x.n===g.n),r=gs(g.n),quitBtn='<button class="btn small" id="gq">Thoát</button>';
  const endPanel=(title,body)=>{app.innerHTML=`<div class="panel stack"><div class="small muted">${esc(one(c.title))}</div><h2>${title}</h2>${body}<div class="row"><button class="btn pri" id="ga">Chơi lại</button><button class="btn" id="gq">Chọn trò khác</button><button class="btn" id="gd">Đọc lại chương này</button></div></div>`};
  const common=e=>{const id=e.target.id;if(id==='gq'){sub.g=null;render();return true}
    if(id==='gd'){sub.g=null;sub.ch=c.id;go('hoc');return true}
    if(id==='ga'){startGame(g.mode,g.n);return true}};
  if(g.mode==='run'){
    if(g.hearts<=0||g.i>=g.list.length){const win=g.hearts>0;if(win&&!g.saved){g.saved=true;r.stars=Math.max(r.stars||0,g.hearts);save()}
      endPanel(win?'Qua ải!':'Hết mạng',win?`<div>${starHTML(g.hearts)}</div><div>Bạn trả lời ${g.list.length} câu và còn ${g.hearts} mạng.</div>`:`<div>Bạn dừng ở câu ${g.i+1}/${g.list.length}. Đọc lại chương rồi thử lần nữa.</div>`);
      app.onclick=common;return}
    const q=QBY[g.list[g.i]];
    app.innerHTML=`<div class="row"><span class="hearts" aria-label="Còn ${g.hearts} mạng">${'♥'.repeat(g.hearts)}<i>${'♥'.repeat(3-g.hearts)}</i></span><span class="mono">Câu ${g.i+1}/${g.list.length}</span><div class="meter"><i style="width:${g.i/g.list.length*100}%"></i></div>${quitBtn}</div>
      <div class="panel">${qHTML(q,g.pick,g.rev,'Vượt ải')}</div>
      <div class="row">${g.rev?`<button class="btn pri" id="gn">${g.hearts>0&&g.i+1<g.list.length?'Câu tiếp →':'Xem kết quả'}</button>`:`<button class="btn pri" id="gc" ${g.pick.length===q.select?'':'disabled'}>Chốt đáp án</button>`}</div>`;
    app.onchange=e=>{if(e.target.name==='opt'&&!g.rev){g.pick=readPick(q,g.pick,e.target);render()}};
    app.onclick=e=>{if(common(e))return;const id=e.target.id;
      if(id==='gc'){g.rev=true;if(!mark(q,g.pick))g.hearts--;render()}
      if(id==='gn'){if(g.hearts>0)g.i++;g.pick=[];g.rev=false;render();window.scrollTo(0,0)}};return}
  if(g.mode==='match'){
    if(g.done.length===g.left.length){const t=g.time??(g.time=Math.round((Date.now()-g.start)/1000)+g.miss*5);if(!g.saved){g.saved=true;r.match=Math.min(r.match||1e9,t);save()}
      endPanel('Ghép xong!',`<div class="big">${fmt(t)}</div><div class="muted">Đã cộng 5 giây cho mỗi lần ghép sai (${g.miss} lần). Kỷ lục của bạn: ${fmt(r.match)}.</div>`);app.onclick=common;return}
    const card=(side,i)=>{const t=D.terms[i],d=g.done.includes(i),cl=d?'done':(g.bad&&g.bad[side]===i)?'bad':g.sel[side]===i?'sel':'';
      return `<button class="mcard ${cl}" data-side="${side}" data-i="${i}" ${d?'disabled':''}>${side==='l'?`<b>${esc(t[0].en)}</b>${t[0].vi&&t[0].vi!==t[0].en&&S.lang!=='en'?`<div class="vi small">${esc(t[0].vi)}</div>`:''}`:esc(one(t[1]))}</button>`};
    app.innerHTML=`<div class="row"><b>Nối cặp</b><span class="timer" id="gt"></span><span class="chip">${g.done.length}/${g.left.length} cặp</span><span class="chip bad">${g.miss} lần sai</span>${quitBtn}</div>
      <p class="small muted">${esc(one(c.title))}. Chạm một thuật ngữ bên trái rồi chạm định nghĩa tương ứng bên phải.</p>
      <div class="mcols"><div class="stack">${g.left.map(i=>card('l',i)).join('')}</div><div class="stack">${g.right.map(i=>card('r',i)).join('')}</div></div>`;
    const show=()=>{$('#gt').textContent=fmt((Date.now()-g.start)/1000+g.miss*5)};show();tick=setInterval(show,1000);
    app.onclick=e=>{if(common(e))return;const b=e.target.closest('.mcard');if(!b||g.bad)return;g.sel[b.dataset.side]=+b.dataset.i;
      if(g.sel.l!=null&&g.sel.r!=null){if(g.sel.l===g.sel.r){g.done.push(g.sel.l);g.sel={}}else{g.miss++;g.bad=g.sel;g.sel={};setTimeout(()=>{g.bad=null;if(sub.g===g&&view==='game')render()},650)}}
      render()};return}
  if(g.left<=0){if(!g.saved){g.saved=true;r.speed=Math.max(r.speed||0,g.score);save()}
    endPanel('Hết giờ!',`<div class="big">${g.score} điểm</div><div class="muted">Đúng ${g.right} thuật ngữ. Kỷ lục của bạn: ${r.speed} điểm.</div>`);app.onclick=common;return}
  if(!g.cur){const a=g.pool[Math.random()*g.pool.length|0];const near=shuffle(g.pool.filter(i=>i!==a)),far=shuffle(D.terms.map((_,i)=>i).filter(i=>i!==a&&!g.pool.includes(i)));g.cur={a,ch:shuffle([a,...near.concat(far).slice(0,3)])}}
  const T=D.terms[g.cur.a];
  app.innerHTML=`<div class="row"><b>Phản xạ</b><span class="timer ${g.left<=10?'low':''}" id="gt">${fmt(g.left)}</span><span class="chip ok">${g.score} điểm</span><span class="chip k">chuỗi ×${g.streak}</span>${quitBtn}</div>
    <div class="panel stack"><div class="small muted">Định nghĩa này là của thuật ngữ nào?</div><div style="font-size:17px">${two(T[1])}</div></div>
    <div class="stack">${g.cur.ch.map(i=>{const t=D.terms[i],cl=g.shown!=null?(i===g.cur.a?'done':i===g.shown?'bad':''):'';return `<button class="mcard ${cl}" data-i="${i}"><b>${esc(t[0].en)}</b>${t[0].vi&&t[0].vi!==t[0].en&&S.lang!=='en'?` <span class="vi small">· ${esc(t[0].vi)}</span>`:''}</button>`}).join('')}</div>`;
  tick=setInterval(()=>{g.left--;if(g.left<=0)render();else{const t=$('#gt');t.textContent=fmt(g.left);t.classList.toggle('low',g.left<=10)}},1000);
  app.onclick=e=>{if(common(e))return;const b=e.target.closest('.mcard');if(!b||g.shown!=null)return;const i=+b.dataset.i;g.shown=i;
    if(i===g.cur.a){g.score+=10+2*g.streak;g.streak++;g.right++}else{g.streak=0;g.left=Math.max(1,g.left-3)}
    render();setTimeout(()=>{g.shown=null;g.cur=null;if(sub.g===g&&view==='game')render()},i===g.cur.a?450:1300)};
}

/* ---------- TOEIC 600 ---------- */
const TL=D.toeic||[];
const canSpeak=typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
function speak(w){try{const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const spk=w=>canSpeak?`<button class="btn small" data-say="${esc(w)}" aria-label="Nghe phát âm ${esc(w)}">▶ Nghe</button>`:'';
const tk=()=>S.toeic||(S.toeic={known:{},best:{}});

    app.innerHTML=`<div class="stack"><h1>600 từ vựng TOEIC</h1><p class="muted">50 chủ đề, mỗi chủ đề 12 từ, theo danh sách "600 Essential Words for the TOEIC". Mỗi chủ đề có danh sách từ, thẻ ghi nhớ, trắc nghiệm và nối cặp.</p></div>
      <div class="panel stack"><div class="row"><b>Đã thuộc ${known}/${total} từ</b><div class="meter"><i style="width:${total?known/total*100:0}%"></i></div></div>
        <input type="search" id="ts" placeholder="Tìm từ tiếng Anh hoặc nghĩa tiếng Việt" value="${esc(m.q)}" aria-label="Tìm từ vựng TOEIC">
        ${q?(hits.length?hits.map(([l,w])=>`<div class="wrow"><div><span class="w">${esc(w.w)}</span> <span class="chip">${esc(w.pos)}</span><div class="vi">${esc(w.vi)}</div></div><button class="btn small" data-n="${l.n}">Bài ${l.n}</button></div>`).join(''):'<div class="muted">Không tìm thấy từ nào khớp.</div>'):''}</div>
      <div class="lgrid">${TL.map(l=>{const k=l.words.filter(w=>T.known[w.w]).length;return `<button class="lbtn ${k===l.words.length?'full':''}" data-n="${l.n}"><b>${l.n}. ${esc(l.title.en)}</b><span class="vi small">${esc(l.title.vi)}</span><span class="small muted">Thuộc ${k}/${l.words.length}${T.best[l.n]!=null?' · Trắc nghiệm '+T.best[l.n]+'/'+l.words.length:''}</span></button>`}).join('')}</div>`;
    const inp=$('#ts');inp.oninput=()=>{m.q=inp.value;toeic();const x=$('#ts');x.focus();x.setSelectionRange(x.value.length,x.value.length)};
    app.onclick=e=>{const b=e.target.closest('[data-n]');if(b){sub.tq={q:'',n:+b.dataset.n,mode:'list'};render();window.scrollTo(0,0)}};return}
  const L=TL.find(l=>l.n===m.n),W=L.words,i0=TL.indexOf(L);
  const head=`<div class="row"><button class="btn small" id="tb">← Các chủ đề</button><span class="muted small">Thuộc ${W.filter(w=>T.known[w.w]).length}/${W.length}</span></div>
    <div class="stack"><h1>${L.n}. ${esc(L.title.en)}</h1><div class="vi">${esc(L.title.vi)}</div></div>
    <div class="seg" role="group" aria-label="Cách học">${[['list','Danh sách'],['card','Thẻ ghi nhớ'],['quiz','Trắc nghiệm'],['match','Nối cặp']].map(([k,l])=>`<button data-mode="${k}" aria-pressed="${m.mode===k}">${l}</button>`).join('')}</div>`;
  const base=e=>{if(say(e))return true;const b=e.target.closest('button');if(!b)return false;

  if(m.mode==='list'){
    app.innerHTML=head+`<div class="panel">${W.map(w=>`<div class="wrow"><div><span class="w">${esc(w.w)}</span> <span class="chip">${esc(w.pos)}</span><div class="vi">${esc(w.vi)}</div><div class="small">${esc(w.ex)}</div><div class="small muted">${esc(w.exvi)}</div></div>

  if(m.mode==='card'){
    if(!m.order){m.order=shuffle(W.map((_,i)=>i));m.i=0;m.flip=false}
    if(m.i>=m.order.length){app.innerHTML=head+`<div class="panel stack"><h2>Hết bộ thẻ</h2><div>Bạn đã thuộc ${W.filter(w=>T.known[w.w]).length}/${W.length} từ của chủ đề này.</div><div class="row"><button class="btn pri" data-mode="card">Học lại</button><button class="btn" data-mode="quiz">Làm trắc nghiệm</button></div></div>`;app.onclick=base;return}

      <div class="row"><span class="mono">${m.i+1}/${m.order.length}</span>${spk(w.w)}<button class="btn" id="tno">Chưa thuộc</button><button class="btn pri" id="tyes">Đã thuộc</button></div>`;
    app.onclick=e=>{if(base(e))return;if(e.target.closest('#tcard')){m.flip=!m.flip;render();return}
      const id=e.target.id;if(id==='tyes'||id==='tno'){if(id==='tyes')T.known[w.w]=1;else delete T.known[w.w];save();m.i++;m.flip=false;render()}};

  if(m.mode==='quiz'){

    if(m.i>=m.order.length){if(!m.saved){m.saved=true;T.best[L.n]=Math.max(T.best[L.n]||0,m.ok);save()}
      app.innerHTML=head+`<div class="panel stack"><h2>Kết quả trắc nghiệm</h2><div class="verdict ${m.ok===W.length?'ok':''}">${m.ok}/${W.length} từ đúng</div>
        ${m.wrong.length?`<div><b>Cần ôn lại:</b></div>${m.wrong.map(i=>`<div><b>${esc(W[i].w)}</b> <span class="vi">${esc(W[i].vi)}</span></div>`).join('')}`:'<div>Bạn trả lời đúng hết.</div>'}
        <div class="row"><button class="btn pri" data-mode="quiz">Làm lại</button><button class="btn" data-mode="match">Chơi nối cặp</button>${i0<TL.length-1?'<button class="btn" id="tnx">Chủ đề sau →</button>':''}</div></div>`;app.onclick=base;return}
    const a=m.order[m.i],w=W[a];
    if(!m.cur){const rev=m.i%2===1;m.cur={rev,ch:shuffle([a,...shuffle(W.map((_,i)=>i).filter(i=>i!==a)).slice(0,3)])}}
    const face=i=>m.cur.rev?`<b>${esc(W[i].w)}</b>`:esc(W[i].vi);
    app.innerHTML=head+`<div class="row"><span class="mono">Câu ${m.i+1}/${m.order.length}</span><div class="meter"><i style="width:${m.i/m.order.length*100}%"></i></div><span class="chip ok">${m.ok} đúng</span></div>
      <div class="panel stack"><div class="small muted">${m.cur.rev?'Từ tiếng Anh nào có nghĩa này?':'Từ này nghĩa là gì?'}</div><div class="row"><span class="term" style="font-size:22px;font-weight:700">${m.cur.rev?esc(w.vi):esc(w.w)}</span>${m.cur.rev?'':`<span class="chip">${esc(w.pos)}</span>`+spk(w.w)}</div></div>
      <div class="stack">${m.cur.ch.map(i=>`<button class="mcard ${m.shown!=null?(i===a?'done':i===m.shown?'bad':''):''}" data-i="${i}">${face(i)}</button>`).join('')}</div>
      ${m.shown!=null?`<div class="expl"><b>${esc(w.w)}</b> (${esc(w.pos)}): <span class="vi">${esc(w.vi)}</span><div class="small">${esc(w.ex)}</div><div class="small muted">${esc(w.exvi)}</div></div><div class="row"><button class="btn pri" id="tq">${m.i+1<m.order.length?'Câu tiếp →':'Xem kết quả'}</button></div>`:''}`;
    app.onclick=e=>{if(base(e))return;if(e.target.id==='tq'){m.i++;m.cur=null;m.shown=null;render();return}
      const b=e.target.closest('.mcard');if(!b||m.shown!=null)return;m.shown=+b.dataset.i;if(m.shown===a){m.ok++;T.known[w.w]=1}else{m.wrong.push(a);delete T.known[w.w]}save();render()};return}
  // match
  if(!m.left){const t=shuffle(W.map((_,i)=>i)).slice(0,6);m.left=t;m.right=shuffle(t);m.done=[];m.sel={};m.miss=0;m.start=Date.now()}
  if(m.done.length===m.left.length){const t=m.time??(m.time=Math.round((Date.now()-m.start)/1000)+m.miss*5);
    app.innerHTML=head+`<div class="panel stack"><h2>Ghép xong!</h2><div class="big">${fmt(t)}</div><div class="muted">Đã cộng 5 giây cho mỗi lần ghép sai (${m.miss} lần).</div><div class="row"><button class="btn pri" data-mode="match">Chơi lại với 6 từ khác</button><button class="btn" data-mode="quiz">Làm trắc nghiệm</button></div></div>`;app.onclick=base;return}
  const card=(side,i)=>{const d=m.done.includes(i),cl=d?'done':(m.bad&&m.bad[side]===i)?'bad':m.sel[side]===i?'sel':'';return `<button class="mcard ${cl}" data-side="${side}" data-i="${i}" ${d?'disabled':''}>${side==='l'?`<b>${esc(W[i].w)}</b>`:esc(W[i].vi)}</button>`};
  app.innerHTML=head+`<div class="row"><span class="timer" id="gt"></span><span class="chip">${m.done.length}/${m.left.length} cặp</span><span class="chip bad">${m.miss} lần sai</span></div>

  const show=()=>{$('#gt').textContent=fmt((Date.now()-m.start)/1000+m.miss*5)};show();tick=setInterval(show,1000);
  app.onclick=e=>{if(base(e))return;const b=e.target.closest('.mcard');if(!b||m.bad)return;m.sel[b.dataset.side]=+b.dataset.i;
    if(m.sel.l!=null&&m.sel.r!=null){if(m.sel.l===m.sel.r){m.done.push(m.sel.l);m.sel={}}else{m.miss++;m.bad=m.sel;m.sel={};setTimeout(()=>{m.bad=null;if(sub.tq===m&&view==='toeic')render()},650)}}
    render()};
}

function giaotiep(){

      <div class="panel stack"><div class="row"><b>Đã thuộc ${known}/${allN} câu</b><div class="meter"><i style="width:${allN?known/allN*100:0}%"></i></div></div>
        <input type="search" id="gs" placeholder="Tìm câu tiếng Anh hoặc tiếng Việt" value="${esc(m.q)}" aria-label="Tìm mẫu câu">
        ${q?(hits.length?hits.map(([t,x])=>`<div class="wrow"><div><span class="w">${esc(x.en)}</span><div class="vi">${esc(x.vi)}</div></div><div class="row">${spk(x.en)}<button class="btn small" data-n="${t.n}">Bài ${t.n}</button></div></div>`).join(''):'<div class="muted">Không tìm thấy câu nào khớp.</div>'):''}</div>
      ${MIS.length?`<button class="lbtn mis-card" data-n="mis"><b>Lỗi hay gặp của người Việt</b><span class="small">${MIS.length} câu sai thường gặp và cách nói đúng: discuss about, I'm agree, explain me…</span><span class="small muted">Đã nắm ${mk}/${MIS.length}${G.best.mis!=null?' · Trắc nghiệm '+G.best.mis+'/'+MIS.length:''}</span></button>`:''}
      <div class="lgrid">${PH.map(t=>{const k=t.items.filter(x=>G.known[x.en]).length;return `<button class="lbtn ${k===t.items.length?'full':''}" data-n="${t.n}"><b>${t.n}. ${esc(t.en)}</b><span class="vi small">${esc(t.vi)}</span><span class="small muted">Thuộc ${k}/${t.items.length}${G.best[t.n]!=null?' · Trắc nghiệm '+G.best[t.n]+'/'+t.items.length:''}</span></button>`}).join('')}</div>`;
    const inp=$('#gs');inp.oninput=()=>{m.q=inp.value;giaotiep();const x=$('#gs');x.focus();x.setSelectionRange(x.value.length,x.value.length)};

  /* ----- lỗi hay gặp ----- */

      <div class="seg" role="group" aria-label="Cách học">${[['mlist','Danh sách'],['mquiz','Chọn câu đúng']].map(([k,l])=>`<button data-mode="${k}" aria-pressed="${m.mode===k}">${l}</button>`).join('')}</div>`;

      ${m.shown!=null?`<div class="expl"><b>${esc(x.right)}</b> ${spk(x.right)}<div class="small">${esc(x.why)}</div></div><div class="row"><button class="btn pri" id="gn">${m.i+1<m.order.length?'Câu tiếp →':'Xem kết quả'}</button></div>`:''}`;

    app.innerHTML=head+`<div class="panel card" id="gcard" tabindex="0" role="button" aria-label="Lật thẻ"><div class="small muted">Nói câu này bằng tiếng Anh:</div><div class="term" style="font-size:20px">${esc(x.vi)}</div>
      ${m.flip?`<div class="w" style="font-size:18px"><b>${esc(x.en)}</b> ${lvc(x)}</div>${x.note?`<div class="muted small">${esc(x.note)}</div>`:''}`:'<div class="muted small">Tự nói to trước, rồi bấm vào thẻ để xem câu chuẩn</div>'}</div>
      <div class="row"><span class="mono">${m.i+1}/${m.order.length}</span>${m.flip?spk(x.en):''}<button class="btn" id="gno">Chưa thuộc</button><button class="btn pri" id="gyes">Đã thuộc</button></div>`;
    app.onclick=e=>{if(base(e))return;if(e.target.closest('#gcard')){m.flip=!m.flip;render();return}
      const id=e.target.id;if(id==='gyes'||id==='gno'){if(id==='gyes')G.known[x.en]=1;else delete G.known[x.en];save();m.i++;m.flip=false;render()}};
    app.onkeydown=e=>{if(e.target.id==='gcard'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();m.flip=!m.flip;render();$('#gcard').focus()}};return}
  if(m.mode==='quiz'){
    if(!m.order){m.order=shuffle(W.map((_,i)=>i));m.i=0;m.ok=0;m.wrong=[]}
    if(m.i>=m.order.length){if(!m.saved){m.saved=true;G.best[T.n]=Math.max(G.best[T.n]||0,m.ok);save()}
      app.innerHTML=head+`<div class="panel stack"><h2>Kết quả trắc nghiệm</h2><div class="verdict ${m.ok===W.length?'ok':''}">${m.ok}/${W.length} câu đúng</div>
        ${m.wrong.length?`<div><b>Cần ôn lại:</b></div>${m.wrong.map(i=>`<div><b>${esc(W[i].en)}</b> <span class="vi">${esc(W[i].vi)}</span></div>`).join('')}`:'<div>Bạn trả lời đúng hết.</div>'}
        <div class="row"><button class="btn pri" data-mode="quiz">Làm lại</button><button class="btn" data-mode="order">Sắp xếp câu</button>${next}</div></div>`;app.onclick=base;return}
    const a=m.order[m.i],x=W[a];
    if(!m.cur)m.cur={ch:shuffle([a,...shuffle(W.map((_,i)=>i).filter(i=>i!==a)).slice(0,3)])};
    app.innerHTML=head+`<div class="row"><span class="mono">Câu ${m.i+1}/${m.order.length}</span><div class="meter"><i style="width:${m.i/m.order.length*100}%"></i></div><span class="chip ok">${m.ok} đúng</span></div>

      ${m.shown!=null?`<div class="expl"><b>${esc(x.en)}</b> ${spk(x.en)}${x.note?`<div class="small">${esc(x.note)}</div>`:''}</div><div class="row"><button class="btn pri" id="gq">${m.i+1<m.order.length?'Câu tiếp →':'Xem kết quả'}</button></div>`:''}`;
    app.onclick=e=>{if(base(e))return;if(e.target.id==='gq'){m.i++;m.cur=null;m.shown=null;render();return}

  // order: sắp xếp từ thành câu

  if(m.i>=m.order.length){app.innerHTML=head+`<div class="panel stack"><h2>Xong!</h2><div class="verdict ${m.ok===m.order.length?'ok':''}">Đúng ngay lần đầu ${m.ok}/${m.order.length} câu</div><div class="row"><button class="btn pri" data-mode="order">Làm 10 câu khác</button><button class="btn" data-mode="quiz">Làm trắc nghiệm</button>${next}</div></div>`;app.onclick=base;return}
  const x=W[m.order[m.i]],toks=x.en.split(/\s+/);

      <div class="ans ${full?(right?'ok':'bad'):''}" aria-live="polite">${c.ans.map((i,j)=>`<button class="tok" data-a="${j}" ${right?'disabled':''}>${esc(toks[i])}</button>`).join('')||'<span class="muted small">Chạm vào các từ bên dưới theo đúng thứ tự</span>'}</div>
      <div class="pool">${c.pool.map(i=>c.ans.includes(i)?'':`<button class="tok" data-p="${i}">${esc(toks[i])}</button>`).join('')}</div>
      ${full&&!right?'<div class="small" style="color:var(--bad,#b42318)">Chưa đúng thứ tự. Chạm vào từ ở trên để gỡ ra và xếp lại.</div>':''}
      ${right||c.giveup?`<div class="expl"><b>${esc(x.en)}</b> ${spk(x.en)}${x.note?`<div class="small">${esc(x.note)}</div>`:''}</div>`:''}</div>
    <div class="row">${right||c.giveup?`<button class="btn pri" id="gon">${m.i+1<m.order.length?'Câu tiếp →':'Xem kết quả'}</button>`:'<button class="btn small" id="gclr">Xếp lại</button><button class="btn small" id="ggive">Xem đáp án</button>'}</div>`;
  if(right&&!c.counted){c.counted=true;if(!c.miss&&!c.giveup)m.ok++;speak(x.en)}
  app.onclick=e=>{if(base(e))return;const b=e.target.closest('button');if(!b)return;
    if(b.id==='gon'){m.i++;m.cur=null;render();return}
    if(b.id==='gclr'){c.ans=[];render();return}
    if(b.id==='ggive'){c.giveup=true;c.ans=toks.map((_,i)=>i);render();return}
    if(b.dataset.p!=null){c.ans.push(+b.dataset.p);if(c.ans.length===toks.length&&c.ans.map(i=>toks[i]).join(' ')!==x.en)c.miss++;render();return}
    if(b.dataset.a!=null){c.ans.splice(+b.dataset.a,1);render()}};
}
