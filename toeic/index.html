<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>TOEIC 600</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one sticky bar of five work areas; each area is a single reading column (max 860px), exam adds a question-map rail. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#eef1f4; --line:#dde3ea;
  --ink:#13233a; --muted:#566779; --vi:#0e5a8a;
  --accent:#0b6b8f; --accent-ink:#ffffff; --accent-soft:#dcedf4;
  --ok:#1b7a43; --ok-soft:#dff3e6; --bad:#b3261e; --bad-soft:#fbe4e2; --warn:#8a5a00; --warn-soft:#fbefd2;
  --stage:#0d1620; --stage-fg:#f3f7fb; --stage-vi:#8fd0f2; --stage-dim:#9db1c2; --stage-line:#2a3c4d;
  --radius:12px; --shadow:0 1px 2px rgba(16,32,52,.06),0 4px 14px rgba(16,32,52,.05);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#151d26; --sunk:#1c2631; --line:#2a3644;
  --ink:#e6edf3; --muted:#9aabbd; --vi:#7cc4ea;
  --accent:#4fb3d9; --accent-ink:#06202b; --accent-soft:#17384a; --shadow:none;
  --ok:#5fd08c; --ok-soft:#153524; --bad:#ff8a80; --bad-soft:#3d1c1a; --warn:#f0c25a; --warn-soft:#3a2e10; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#151d26; --sunk:#1c2631; --line:#2a3644;
  --ink:#e6edf3; --muted:#9aabbd; --vi:#7cc4ea;
  --accent:#4fb3d9; --accent-ink:#06202b; --accent-soft:#17384a; --shadow:none;
  --ok:#5fd08c; --ok-soft:#153524; --bad:#ff8a80; --bad-soft:#3d1c1a; --warn:#f0c25a; --warn-soft:#3a2e10; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;margin:0}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top:before{content:"";display:block;height:3px;background:var(--accent)}
.top-in{max-width:1240px;margin:0 auto;padding:8px 16px;display:flex;gap:10px 14px;align-items:center}
.hub{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:600;padding:5px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.hub:hover{color:var(--ink)}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .code{font-family:var(--mono);color:var(--accent);font-size:15px}
.brand .nm{overflow:hidden;text-overflow:ellipsis}
.shell{max-width:1240px;margin:0 auto;padding-inline:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
nav#nav{display:flex;gap:4px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
nav#nav::-webkit-scrollbar{display:none}
nav#nav a{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;border:1px solid var(--line);background:var(--surface);font-size:14px}
nav#nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav#nav a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (min-width:960px){
  .shell{grid-template-columns:210px minmax(0,1fr);gap:36px}
  nav#nav{flex-direction:column;position:sticky;top:64px;align-self:start;padding:28px 0;overflow:visible}
  nav#nav a{border:0;background:transparent;border-radius:8px;padding:9px 12px}
  nav#nav a:hover{background:var(--sunk);color:var(--ink)}
  nav#nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
}
body.solo nav#nav{display:none}
@media (min-width:960px){body.solo .shell{grid-template-columns:minmax(0,1fr);max-width:960px}}
main a{color:var(--accent)}
@media (max-width:520px){.hub .lb{display:none}.top-in .seg button{padding:5px 7px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hero{border-radius:var(--radius);padding:22px 22px 20px;background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.hero .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(24px,4vw,32px)}
main{max-width:880px;width:100%;padding-block:24px 72px;display:flex;flex-direction:column;gap:20px;min-width:0}
main.wide{max-width:none}
h1{font-size:clamp(22px,3.4vw,28px);letter-spacing:-.01em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:13px}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.vi{color:var(--vi)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-block;font-family:var(--mono);font-size:12px;padding:1px 7px;border-radius:4px;background:var(--sunk);white-space:nowrap}
.chip.k{background:var(--accent-soft)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted)}.fact b{display:block;font-family:var(--mono);font-size:24px;color:var(--ink)}
.meter{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden;flex:1;min-width:80px}.meter i{display:block;height:100%;background:var(--accent)}
.chrow{display:grid;grid-template-columns:minmax(0,1fr) 140px 90px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
@media (max-width:560px){.chrow{grid-template-columns:1fr}}
/* study */
.doc h2{font-size:22px;margin-top:22px}.doc h3{font-size:18px;margin-top:18px}.doc h4{font-size:16px;margin-top:14px}.doc h5{font-size:15px;margin-top:10px}
.doc .blk{margin:8px 0}.doc .li{padding-left:18px;position:relative}.doc .li:before{content:"•";position:absolute;left:4px;color:var(--muted)}
.doc .li.l2{margin-left:18px}.doc .li.l3{margin-left:36px}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--sunk)}
.doc img,.q img{background:#fff;border:1px solid var(--line);border-radius:4px;display:block;margin:10px auto;max-width:100%}
.doc .pair{display:block}.doc .toc.l1{padding-left:14px}.doc .toc.l2{padding-left:28px}
@media (min-width:860px){.doc .pair{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start}.doc .pair>:only-child{grid-column:1/-1}.doc .pair.hd>*{margin-top:18px}}
/* game */
.hearts{font-size:20px;letter-spacing:3px;color:var(--bad)}.hearts i{font-style:normal;color:var(--line)}
.stars{font-size:18px;color:var(--warn);letter-spacing:2px;white-space:nowrap}.stars i{font-style:normal;color:var(--line)}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
@media (max-width:640px){.grow{grid-template-columns:1fr}}
.mcols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px;align-items:start}
.mcard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;cursor:pointer;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.mcard.sel{border-color:var(--accent);background:var(--accent-soft)}.mcard.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}.mcard.bad{border-color:var(--bad);background:var(--bad-soft)}
.big{font-family:var(--mono);font-size:22px;font-weight:700}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.lbtn{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 12px;cursor:pointer}
.lbtn.full{border-color:var(--ok)}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.wrow .w{font-size:17px;font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fcard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 0 10px;cursor:pointer;overflow:hidden}
.fcard .th{aspect-ratio:16/9;background:var(--sunk);width:100%;object-fit:cover;display:block}
.fcard>span{padding:0 12px}
.player{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;background:#000;border-radius:8px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
textarea{font:inherit;color:inherit;width:100%;min-height:120px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px}
input[type=text],input[type=url]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;max-width:100%;flex:1;min-width:180px}
.stage{background:var(--stage);color:var(--stage-fg);border-radius:10px;padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px;min-height:min(60vw,400px)}
.stage .where{font-size:12px;color:var(--stage-dim);letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;gap:12px}
.stage .mid{flex:1;display:flex;align-items:center;justify-content:center;min-height:60px}
.stage .mid img{max-height:260px;max-width:100%;background:#fff;border-radius:6px}
.stage .mid .ttl{font-size:clamp(20px,4.2vw,30px);font-weight:700;text-align:center;text-wrap:balance}
.stage .sen{font-size:clamp(17px,3.3vw,23px);font-weight:600;line-height:1.45;text-align:center;text-wrap:pretty}
.stage .svi{font-size:clamp(14px,2.6vw,17px);line-height:1.5;text-align:center;color:var(--stage-vi)}
.stage .bar2{height:4px;background:var(--stage-line);border-radius:2px;overflow:hidden}.stage .bar2 i{display:block;height:100%;background:var(--stage-vi)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctl .btn.big2{font-size:18px;padding:8px 20px;min-width:96px}
.script{position:relative;max-height:52vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.script .u{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 12px;cursor:pointer;line-height:1.5}
.script .u.h{font-weight:700;background:var(--sunk)}.script .u.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.script .u .vi{display:block;font-size:13px}
.gl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.gl-row:last-child{border-bottom:0}.gl-row .nm{font-weight:700;font-size:16px}.gl-row .ab{font-family:var(--mono);font-size:12px;color:var(--accent);margin-left:6px}
.gl-row .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.gl-row .meta .chip{font-size:11px}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline}
.letters{display:flex;flex-wrap:wrap;gap:4px}.letters button{min-width:30px;padding:4px 6px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:12px;color:inherit}
.letters button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.typein{font:inherit;font-size:18px;width:100%;border:1px solid var(--line);background:var(--surface);color:inherit;border-radius:6px;padding:10px}
/* questions */
.q .stem{font-size:16px}.q .stem .vi{margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.opt input{margin-top:5px;flex:none}.opt .k{font-family:var(--mono);font-weight:700;flex:none}.opt .tx{min-width:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .tag{font-size:12px;font-weight:700;margin-left:auto;flex:none}
.expl{border-left:3px solid var(--accent);background:var(--sunk);padding:10px 14px;border-radius:0 6px 6px 0}
.examgrid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;align-items:start}
@media (max-width:800px){.examgrid{grid-template-columns:1fr}}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
.map button{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:4px 0;font-family:var(--mono);font-size:12px;cursor:pointer}
.map button.ans{background:var(--accent-soft)}.map button.flag{border-color:var(--warn);box-shadow:inset 0 -3px 0 var(--warn)}.map button.cur{outline:2px solid var(--accent)}
.map button.ok{background:var(--ok-soft);border-color:var(--ok)}.map button.bad{background:var(--bad-soft);border-color:var(--bad)}
.timer{font-family:var(--mono);font-size:22px;font-weight:700}.timer.low{color:var(--bad)}
.card{min-height:190px;display:flex;flex-direction:column;gap:10px;justify-content:center;text-align:center;cursor:pointer}
.card .term{font-size:24px;font-weight:700}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
label.ck{display:flex;gap:8px;align-items:flex-start}
select,input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;max-width:100%}
.verdict{font-size:26px;font-weight:700}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
:root{--accent:#b4520c;--accent-soft:#fbe9da;--accent-ink:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#f0a35c;--accent-soft:#3d2614;--accent-ink:#2a1503;}}
:root[data-theme="dark"]{--accent:#f0a35c;--accent-soft:#3d2614;--accent-ink:#2a1503;}
</style>
</head><body>

<header class="top"><div class="top-in">
  <a class="hub" id="hub" href="../index.html" title="Về trang chủ, chọn khu học khác"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span class="lb">Trang chủ</span></a>
  <div class="brand"><span class="code" id="scode"></span><span class="nm" id="sname"></span></div>
  <div class="seg" id="lang" role="group" aria-label="Ngôn ngữ hiển thị">
    <button data-l="both">Song ngữ</button><button data-l="vi">Việt</button><button data-l="en">EN</button>
  </div>
</div></header>

<script id="data" type="application/json">{"chapters":[],"los":{},"terms":[],"abbr":[],"questions":[],"toeic":[{"n":1,"title":{"en":"Contracts","vi":"Hợp đồng"},"words":[{"w":"abide by","pos":"v","vi":"tuân thủ, tuân theo","ex":"All suppliers must abide by the terms stated in the signed contract.","exvi":"Tất cả nhà cung cấp phải tuân thủ các điều khoản nêu trong hợp đồng đã ký."},{"w":"agreement","pos":"n","vi":"thỏa thuận, hợp đồng","ex":"The two companies reached an agreement after three weeks of negotiation.","exvi":"Hai công ty đã đạt được thỏa thuận sau ba tuần đàm phán."},{"w":"assurance","pos":"n","vi":"sự cam đoan, sự bảo đảm","ex":"The vendor gave us written assurance that the shipment would arrive on time.","exvi":"Nhà cung cấp đã cam đoan bằng văn bản với chúng tôi rằng lô hàng sẽ đến đúng hạn."},{"w":"cancellation","pos":"n","vi":"sự hủy bỏ","ex":"Cancellation of the contract requires thirty days' written notice.","exvi":"Việc hủy bỏ hợp đồng yêu cầu phải thông báo bằng văn bản trước ba mươi ngày."},{"w":"determine","pos":"v","vi":"xác định, quyết định","ex":"The lawyers will determine whether the clause applies to overseas branches.","exvi":"Các luật sư sẽ xác định xem điều khoản đó có áp dụng cho các chi nhánh ở nước ngoài hay không."},{"w":"engage","pos":"v","vi":"tham gia; thuê, tuyển dụng","ex":"The firm engaged an outside consultant to review the contract.","exvi":"Công ty đã thuê một chuyên gia tư vấn bên ngoài để rà soát hợp đồng."},{"w":"establish","pos":"v","vi":"thiết lập, thành lập","ex":"The contract establishes clear deadlines for each stage of the project.","exvi":"Hợp đồng thiết lập các thời hạn rõ ràng cho từng giai đoạn của dự án."},{"w":"obligate","pos":"v","vi":"bắt buộc, ràng buộc nghĩa vụ","ex":"The lease obligates the tenant to pay for all minor repairs.","exvi":"Hợp đồng thuê bắt buộc người thuê phải trả tiền cho mọi sửa chữa nhỏ."},{"w":"party","pos":"n","vi":"bên (tham gia hợp đồng)","ex":"Both parties must sign every page of the document before Friday.","exvi":"Cả hai bên phải ký vào từng trang của văn bản trước thứ Sáu."},{"w":"provision","pos":"n","vi":"điều khoản, quy định","ex":"A special provision allows the buyer to return damaged goods within a week.","exvi":"Một điều khoản đặc biệt cho phép người mua trả lại hàng hư hỏng trong vòng một tuần."},{"w":"resolve","pos":"v","vi":"giải quyết (vấn đề, tranh chấp)","ex":"The managers met yesterday to resolve the dispute over delivery costs.","exvi":"Các quản lý đã họp hôm qua để giải quyết tranh chấp về chi phí giao hàng."},{"w":"specific","pos":"adj","vi":"cụ thể, rõ ràng","ex":"Please include specific details about payment dates in the proposal.","exvi":"Vui lòng đưa các chi tiết cụ thể về ngày thanh toán vào bản đề xuất."}]},{"n":2,"title":{"en":"Marketing","vi":"Tiếp thị"},"words":[{"w":"attract","pos":"v","vi":"thu hút, lôi cuốn","ex":"The new advertising campaign attracted thousands of younger customers.","exvi":"Chiến dịch quảng cáo mới đã thu hút hàng nghìn khách hàng trẻ tuổi hơn."},{"w":"compare","pos":"v","vi":"so sánh, đối chiếu","ex":"Shoppers often compare prices online before visiting a store.","exvi":"Người mua sắm thường so sánh giá trên mạng trước khi đến cửa hàng."},{"w":"competition","pos":"n","vi":"sự cạnh tranh; đối thủ","ex":"Competition in the smartphone market has pushed prices down this year.","exvi":"Sự cạnh tranh trên thị trường điện thoại thông minh đã kéo giá xuống trong năm nay."},{"w":"consume","pos":"v","vi":"tiêu thụ, tiêu dùng","ex":"Customers in this region consume more bottled tea than coffee.","exvi":"Khách hàng ở khu vực này tiêu thụ trà đóng chai nhiều hơn cà phê."},{"w":"convince","pos":"v","vi":"thuyết phục, làm cho tin","ex":"The sales team convinced the client to try the premium package.","exvi":"Đội ngũ bán hàng đã thuyết phục khách hàng dùng thử gói cao cấp."},{"w":"currently","pos":"adv","vi":"hiện tại, hiện nay","ex":"We are currently testing two different slogans for the product launch.","exvi":"Chúng tôi hiện đang thử nghiệm hai khẩu hiệu khác nhau cho buổi ra mắt sản phẩm."},{"w":"fad","pos":"n","vi":"mốt nhất thời, trào lưu ngắn hạn","ex":"Analysts believe the fitness bracelet is a fad that will not last.","exvi":"Các nhà phân tích tin rằng vòng tay thể dục là một mốt nhất thời sẽ không kéo dài."},{"w":"inspiration","pos":"n","vi":"nguồn cảm hứng","ex":"The designer found inspiration for the logo during a trip to Kyoto.","exvi":"Nhà thiết kế đã tìm thấy nguồn cảm hứng cho logo trong một chuyến đi Kyoto."},{"w":"market","pos":"n, v","vi":"thị trường; tiếp thị, quảng bá","ex":"The company plans to market its skincare line to male customers.","exvi":"Công ty dự định tiếp thị dòng sản phẩm chăm sóc da tới khách hàng nam."},{"w":"persuasion","pos":"n","vi":"sự thuyết phục","ex":"It took a lot of persuasion to get the retailer to stock our brand.","exvi":"Phải thuyết phục rất nhiều mới khiến nhà bán lẻ chịu nhập thương hiệu của chúng tôi."},{"w":"productive","pos":"adj","vi":"hiệu quả, có năng suất","ex":"The meeting with the advertising agency was short but very productive.","exvi":"Cuộc họp với công ty quảng cáo tuy ngắn nhưng rất hiệu quả."},{"w":"satisfaction","pos":"n","vi":"sự hài lòng, sự thỏa mãn","ex":"Customer satisfaction rose sharply after we extended our service hours.","exvi":"Sự hài lòng của khách hàng tăng mạnh sau khi chúng tôi kéo dài giờ phục vụ."}]},{"n":3,"title":{"en":"Warranties","vi":"Bảo hành"},"words":[{"w":"characteristic","pos":"adj, n","vi":"đặc điểm, đặc trưng","ex":"Long battery life is the main characteristic of this laptop model.","exvi":"Thời lượng pin dài là đặc điểm chính của mẫu máy tính xách tay này."},{"w":"consequence","pos":"n","vi":"hậu quả, kết quả","ex":"As a consequence of misuse, the warranty on the printer became invalid.","exvi":"Do hậu quả của việc sử dụng sai cách, bảo hành của máy in đã mất hiệu lực."},{"w":"consider","pos":"v","vi":"cân nhắc, xem xét","ex":"You should consider buying an extended warranty for expensive appliances.","exvi":"Bạn nên cân nhắc mua bảo hành mở rộng cho các thiết bị đắt tiền."},{"w":"cover","pos":"v","vi":"bao gồm, chi trả, bảo hiểm cho","ex":"The warranty covers parts and labor for two full years.","exvi":"Bảo hành bao gồm linh kiện và công sửa chữa trong trọn hai năm."},{"w":"expiration","pos":"n","vi":"sự hết hạn","ex":"Check the expiration date of the warranty before requesting a repair.","exvi":"Hãy kiểm tra ngày hết hạn bảo hành trước khi yêu cầu sửa chữa."},{"w":"frequently","pos":"adv","vi":"thường xuyên","ex":"Customers frequently ask whether water damage is included in the warranty.","exvi":"Khách hàng thường xuyên hỏi liệu hư hỏng do nước có nằm trong bảo hành hay không."},{"w":"imply","pos":"v","vi":"ngụ ý, hàm ý","ex":"The salesperson implied that the repair would be free of charge.","exvi":"Nhân viên bán hàng ngụ ý rằng việc sửa chữa sẽ được miễn phí."},{"w":"promise","pos":"n, v","vi":"lời hứa; hứa, cam kết","ex":"The manufacturer promises to replace any defective unit within ten days.","exvi":"Nhà sản xuất cam kết thay thế bất kỳ sản phẩm lỗi nào trong vòng mười ngày."},{"w":"protect","pos":"v","vi":"bảo vệ","ex":"A good warranty protects buyers from unexpected repair costs.","exvi":"Một chế độ bảo hành tốt bảo vệ người mua khỏi các chi phí sửa chữa bất ngờ."},{"w":"reputation","pos":"n","vi":"danh tiếng, uy tín","ex":"The brand has a strong reputation for honoring its warranties.","exvi":"Thương hiệu này có uy tín cao trong việc thực hiện đúng cam kết bảo hành."},{"w":"require","pos":"v","vi":"yêu cầu, đòi hỏi","ex":"The service center requires a receipt as proof of purchase.","exvi":"Trung tâm dịch vụ yêu cầu hóa đơn làm bằng chứng mua hàng."},{"w":"variety","pos":"n","vi":"sự đa dạng, nhiều loại","ex":"The store offers a variety of protection plans for home electronics.","exvi":"Cửa hàng cung cấp nhiều loại gói bảo vệ cho thiết bị điện tử gia dụng."}]},{"n":4,"title":{"en":"Business Planning","vi":"Lập kế hoạch kinh do adline.","exvi":"Anh ấy vô tình xóa bản báo cáo một giờ trước hạn chót."},{"w":"display","pos":"n, v","vi":"màn hình hiển thị; hiển thị","ex":"The screen displays an error message whenever the program is opened.","exvi":"Màn hình hiển thị thông báo lỗi mỗi khi mở chương trình."},{"w":"duplicate","pos":"v","vi":"sao chép, nhân bản","ex":"Please duplicate these files and store the copies on the shared drive.","exvi":"Vui lòng sao chép các tệp này và lưu bản sao vào ổ đĩa dùng chung."},{"w":"failure","pos":"n","vi":"sự cố, sự hỏng hóc; thất bại","ex":"A power failure caused the server to stop working for two hours.","exvi":"Sự cố mất điện đã khiến máy chủ ngừng hoạt động trong hai giờ."},{"w":"figure out","pos":"v","vi":"tìm ra, hiểu ra","ex":"The technician finally figured out why the laptop kept restarting.","exvi":"Kỹ thuật viên cuối cùng đã tìm ra lý do máy tính xách tay cứ khởi động lại."},{"w":"ignore","pos":"v","vi":"phớt lờ, bỏ qua","ex":"Do not ignore the update notices that appear on your screen.","exvi":"Đừng bỏ qua các thông báo cập nhật xuất hiện trên màn hình của bạn."},{"w":"search","pos":"n, v","vi":"tìm kiếm; sự tìm kiếm","ex":"I searched the entire hard drive but could not find the invoice.","exvi":"Tôi đã tìm kiếm toàn bộ ổ cứng nhưng không thấy hóa đơn."},{"w":"shut down","pos":"v","vi":"tắt máy, ngừng hoạt động","ex":"Remember to shut down your computer before leaving the office tonight.","exvi":"Hãy nhớ tắt máy tính trước khi rời văn phòng tối nay."},{"w":"warning","pos":"n","vi":"lời cảnh báo","ex":"A warning appeared saying that the disk was almost full.","exvi":"Một cảnh báo xuất hiện cho biết ổ đĩa đã gần đầy."}]},{"n":7,"title":{"en":"Office Technology","vi":"Công nghệ văn phòng"},"words":[{"w":"affordable","pos":"adj","vi":"giá phải chăng, vừa túi tiền","ex":"The supplier recommended an affordable copier for our small office.","exvi":"Nhà cung cấp đã giới thiệu một máy photocopy giá phải chăng cho văn phòng nhỏ của chúng tôi."},{"w":"as needed","pos":"adv","vi":"khi cần thiết","ex":"Ink cartridges are ordered as needed rather than kept in large quantities.","exvi":"Hộp mực được đặt mua khi cần thiết thay vì dự trữ với số lượng lớn."},{"w":"be in charge of","pos":"phr","vi":"chịu trách nhiệm, phụ trách","ex":"Mr. Lee is in charge of ordering all office equipment.","exvi":"Ông Lee phụ trách việc đặt mua toàn bộ thiết bị văn phòng."},{"w":"capacity","pos":"n","vi":"sức chứa, công suất","ex":"The new paper tray has a capacity of five hundred sheets.","exvi":"Khay giấy mới có sức chứa năm trăm tờ."},{"w":"durable","pos":"adj","vi":"bền, lâu hỏng","ex":"We chose metal filing cabinets because they are more durable than plastic ones.","exvi":"Chúng tôi chọn tủ hồ sơ bằng kim loại vì chúng bền hơn tủ nhựa."},{"w":"initiative","pos":"n","vi":"sáng kiến, sự chủ động","ex":"Ana took the initiative to replace the outdated fax machine.","exvi":"Ana đã chủ động thay thế chiếc máy fax lỗi thời."},{"w":"physically","pos":"adv","vi":"về mặt thể chất, vật lý","ex":"The server must be physically moved to a cooler room this weekend.","exvi":"Máy chủ phải được di chuyển thực tế sang một phòng mát hơn vào cuối tuần này."},{"w":"provider","pos":"n","vi":"nhà cung cấp","ex":"Our internet provider promised to fix the connection by noon.","exvi":"Nhà cung cấp internet của chúng tôi đã hứa khắc phục kết nối trước buổi trưa."},{"w":"recur","pos":"v","vi":"tái diễn, lặp lại","ex":"If the paper jam recurs, please call the maintenance department.","exvi":"Nếu tình trạng kẹt giấy tái diễn, vui lòng gọi bộ phận bảo trì."},{"w":"reduction","pos":"n","vi":"sự cắt giảm, sự giảm bớt","ex":"Switching to digital files led to a large reduction in paper use.","exvi":"Việc chuyển sang tệp kỹ thuật số đã giúp giảm mạnh lượng giấy sử dụng."},{"w":"stay on top of","pos":"phr","vi":"nắm bắt, cập nhật thông tin","ex":"IT staff read trade magazines to stay on top of new technology.","exvi":"Nhân viên công nghệ thông tin đọc tạp chí chuyên ngành để cập nhật công nghệ mới."},{"w":"stock","pos":"n, v","vi":"hàng dự trữ; dự trữ hàng","ex":"The supply room is stocked with paper, toner, and spare cables.","exvi":"Phòng vật tư được dự trữ giấy, mực in và dây cáp dự phòng."}]},{"n":8,"title":{"en":"Office Procedures","vi":"Thủ tục văn phòng"},"words":[{"w":"appreciation","pos":"n","vi":"sự cảm kích, sự đánh giá cao","ex":"The director expressed her appreciation for the team's extra effort.","exvi":"Giám đốc bày tỏ sự cảm kích đối với nỗ lực vượt mức của cả nhóm."},{"w":"be made of","pos":"phr","vi":"được làm bằng, gồm có","ex":"The new employee handbook is made of recycled paper.","exvi":"Cuốn sổ tay nhân viên mới được làm bằng giấy tái chế."},{"w":"bring in","pos":"v","vi":"thuê, mời về; mang lại","ex":"The company brought in a trainer to explain the new filing system.","exvi":"Công ty đã mời một giảng viên về để giải thích hệ thống lưu hồ sơ mới."},{"w":"casually","pos":"adv","vi":"thoải mái, không trang trọng","ex":"Employees are allowed to dress casually on Fridays.","exvi":"Nhân viên được phép ăn mặc thoải mái vào các ngày thứ Sáu."},{"w":"code","pos":"n","vi":"quy tắc, quy định","ex":"The office dress code requires jackets when meeting with clients.","exvi":"Quy định trang phục của văn phòng yêu cầu mặc áo vest khi gặp khách hàng."},{"w":"expose","pos":"v","vi":"cho tiếp xúc, để lộ ra","ex":"The internship exposes students to the daily routines of a busy office.","exvi":"Kỳ thực tập cho sinh viên tiếp xúc với công việc thường ngày của một văn phòng bận rộn."},{"w":"glimpse","pos":"n","vi":"cái nhìn thoáng qua","ex":"The office tour gave visitors a glimpse of how orders are processed.","exvi":"Chuyến tham quan văn phòng cho khách có cái nhìn thoáng qua về cách xử lý đơn hàng."},{"w":"out of","pos":"prep","vi":"hết, không còn","ex":"We are out of envelopes, so please order more today.","exvi":"Chúng ta đã hết phong bì, vì vậy vui lòng đặt thêm trong hôm nay."},{"w":"outdated","pos":"adj","vi":"lỗi thời, cũ kỹ","ex":"The outdated procedure for approving expenses wastes everyone's time.","exvi":"Quy trình phê duyệt chi phí lỗi thời làm lãng phí thời gian của mọi người."},{"w":"practice","pos":"n, v","vi":"thông lệ, cách làm; thực hành","ex":"It is standard practice here to confirm every meeting by e-mail.","exvi":"Ở đây, việc xác nhận mọi cuộc họp qua thư điện tử là thông lệ chuẩn."},{"w":"reinforce","pos":"v","vi":"củng cố, tăng cường","ex":"Regular reminders reinforce the importance of locking confidential files.","exvi":"Việc nhắc nhở thường xuyên củng cố tầm quan trọng của việc khóa các hồ sơ mật."},{"w":"verbally","pos":"adv","vi":"bằng lời nói, bằng miệng","ex":"The supervisor approved the request verbally and confirmed it in writing later.","exvi":"Người giám sát đã phê duyệt yêu cầu bằng lời nói và xác nhận bằng văn bản sau đó."}]},{"n":9,"title":{"en":"Electronics","vi":"Điện tử"},"words":[{"w":"disk","pos":"n","vi":"đĩa (lưu trữ dữ liệu)","ex":"Save a backup of the presentation on an external disk.","exvi":"Hãy lưu một bản sao dự phòng của bài thuyết trình vào đĩa ngoài."},{"w":"facilitate","pos":"v","vi":"tạo điều kiện thuận lợi","ex":"Video calls facilitate communication between our offices in different countries.","exvi":"Các cuộc gọi video tạo điều kiện thuận lợi cho việc liên lạc giữa các văn phòng của chúng tôi ở nhiều nước."},{"w":"network","pos":"n, v","vi":"mạng lưới; kết nối mạng","ex":"All the computers on this floor are connected to the same network.","exvi":"Tất cả máy tính ở tầng này đều được kết nối vào cùng một mạng."},{"w":"popularity","pos":"n","vi":"sự phổ biến, sự ưa chuộng","ex":"The popularity of wireless headphones has grown quickly among commuters.","exvi":"Sự phổ biến của tai nghe không dây đã tăng nhanh trong giới người đi làm."},{"w":"process","pos":"n, v","vi":"quy trình; xử lý","ex":"The new chip processes images twice as fast as the old one.","exvi":"Con chip mới xử lý hình ảnh nhanh gấp đôi con chip cũ."},{"w":"replace","pos":"v","vi":"thay thế","ex":"The store agreed to replace the faulty tablet with a new one.","exvi":"Cửa hàng đã đồng ý thay chiếc máy tính bảng bị lỗi bằng một chiếc mới."},{"w":"revolution","pos":"n","vi":"cuộc cách mạng, sự thay đổi lớn","ex":"Smartphones started a revolution in the way people shop and pay.","exvi":"Điện thoại thông minh đã khởi đầu một cuộc cách mạng trong cách mọi người mua sắm và thanh toán."},{"w":"sharply","pos":"adv","vi":"một cách đột ngột, mạnh","ex":"Prices of flat-screen televisions fell sharply after the holiday season.","exvi":"Giá tivi màn hình phẳng giảm mạnh sau mùa lễ."},{"w":"skill","pos":"n","vi":"kỹ năng","ex":"Repairing circuit boards requires both patience and technical skill.","exvi":"Việc sửa chữa bảng mạch đòi hỏi cả sự kiên nhẫn lẫn kỹ năng kỹ thuật."},{"w":"software","pos":"n","vi":"phần mềm","ex":"The accounting department installed new software to track monthly expenses.","exvi":"Phòng kế toán đã cài đặt phần mềm mới để theo dõi chi phí hằng tháng."},{"w":"store","pos":"v","vi":"lưu trữ, cất giữ","ex":"This device can store thousands of photos without slowing down.","exvi":"Thiết bị này có thể lưu trữ hàng nghìn bức ảnh mà không bị chậm."},{"w":"technically","pos":"adv","vi":"về mặt kỹ thuật","ex":"The camera is technically advanced, yet it is very simple to use.","exvi":"Chiếc máy ảnh này tiên tiến về mặt kỹ thuật nhưng lại rất dễ sử dụng."}]},{"n":10,"title":{"en":"Correspondence","vi":"Thư tín"},"words":[{"w":"assemble","pos":"v","vi":"tập hợp, sắp xếp lại","ex":"The assistant assembled the pages of the report before mailing it.","exvi":"Trợ lý đã tập hợp các trang của bản báo cáo trước khi gửi qua bưu điện."},{"w":"beforehand","pos":"adv","vi":"trước, sớm hơn","ex":"Please read the attached memo beforehand so we can start promptly.","exvi":"Vui lòng đọc trước bản ghi nhớ đính kèm để chúng ta có thể bắt đầu đúng giờ."},{"w":"complication","pos":"n","vi":"sự rắc rối, sự phức tạp","ex":"A complication with the address delayed delivery of the invitation letters.","exvi":"Một rắc rối về địa chỉ đã làm chậm việc giao thư mời."},{"w":"courier","pos":"n","vi":"người đưa thư, dịch vụ chuyển phát","ex":"We sent the signed documents by courier to reach the client today.","exvi":"Chúng tôi đã gửi các tài liệu đã ký qua dịch vụ chuyển phát để đến tay khách hàng trong hôm nay."},{"w":"express","pos":"adj","vi":"nhanh, hỏa tốc","ex":"Express mail costs more, but the package will arrive tomorrow morning.","exvi":"Thư chuyển phát nhanh tốn kém hơn, nhưng bưu kiện sẽ đến vào sáng mai."},{"w":"fold","pos":"v","vi":"gấp, gập lại","ex":"Fold the letter in thirds so that it fits the envelope.","exvi":"Hãy gấp lá thư làm ba để vừa với phong bì."},{"w":"layout","pos":"n","vi":"bố cục, cách trình bày","ex":"The layout of the newsletter makes the main announcement easy to find.","exvi":"Bố cục của bản tin giúp dễ dàng tìm thấy thông báo chính."},{"w":"mention","pos":"n, v","vi":"đề cập, nhắc đến","ex":"The letter did not mention the new deadline for submitting applications.","exvi":"Lá thư không đề cập đến hạn chót mới để nộp hồ sơ."},{"w":"petition","pos":"n, v","vi":"đơn kiến nghị; kiến nghị","ex":"Employees signed a petition asking for longer lunch breaks.","exvi":"Nhân viên đã ký vào đơn kiến nghị đề nghị kéo dài giờ nghỉ trưa."},{"w":"proof","pos":"v","vi":"đọc soát lỗi, hiệu đính","ex":"Always proof your e-mails carefully before sending them to customers.","exvi":"Luôn đọc soát lỗi thư điện tử thật kỹ trước khi gửi cho khách hàng."},{"w":"registered","pos":"adj","vi":"(thư) bảo đảm, đã đăng ký","ex":"The contract was sent by registered mail to guarantee safe delivery.","exvi":"Hợp đồng đã được gửi bằng thư bảo đảm để đảm bảo giao nhận an toàn."},{"w":"revise","pos":"v","vi":"sửa lại, chỉnh sửa","ex":"She revised the cover letter three times before submitting her application.","exvi":"Cô ấy đã chỉnh sửa thư xin việc ba lần trước khi nộp hồ sơ."}]},{"n":11,"title":{"en":"Job Advertising and Recruiting","vi":"Quảng cáo việc làm và tuyển dụng"},"words":[{"w":"abundant","pos":"adj","vi":"dồi dào, phong phú","ex":"The city has an abundant supply of skilled engineers looking for new positions.","exvi":"Thành phố có nguồn kỹ sư lành nghề dồi dào đang tìm kiếm vị trí mới."},{"w":"accomplishment","pos":"n","vi":"thành tựu, thành tích","ex":"Please list your three greatest professional accomplishments on the application form.","exvi":"Vui lòng liệt kê ba thành tựu nghề nghiệp lớn nhất của bạn trong đơn ứng tuyển."},{"w":"bring together","pos":"phr","vi":"tập hợp, kết nối lại","ex":"The job fair brings together local employers and recent university graduates every spring.","exvi":"Hội chợ việc làm kết nối các nhà tuyển dụng địa phương với sinh viên mới tốt nghiệp vào mỗi mùa xuân."},{"w":"candidate","pos":"n","vi":"ứng viên, người dự tuyển","ex":"We interviewed five candidates for the marketing manager position last week.","exvi":"Tuần trước chúng tôi đã phỏng vấn năm ứng viên cho vị trí trưởng phòng tiếp thị."},{"w":"come up with","pos":"phr","vi":"nghĩ ra, đề xuất","ex":"The human resources team came up with a creative way to attract applicants.","exvi":"Nhóm nhân sự đã nghĩ ra một cách sáng tạo để thu hút người ứng tuyển."},{"w":"commensurate","pos":"adj","vi":"tương xứng, phù hợp với","ex":"The salary offered will be commensurate with your experience and education.","exvi":"Mức lương đề nghị sẽ tương xứng với kinh nghiệm và trình độ học vấn của bạn."},{"w":"match","pos":"n, v","vi":"sự phù hợp; khớp với","ex":"Her skills match the requirements listed in the job advertisement perfectly.","exvi":"Kỹ năng của cô ấy khớp hoàn toàn với các yêu cầu nêu trong tin tuyển dụng."},{"w":"profile","pos":"n","vi":"hồ sơ, bản mô tả đặc điểm","ex":"The recruiter wrote a detailed profile of the ideal person for the role.","exvi":"Chuyên viên tuyển dụng đã viết bản mô tả chi tiết về người lý tưởng cho vị trí này."},{"w":"qualifications","pos":"n","vi":"trình độ, năng lực chuyên môn","ex":"Applicants must have the necessary qualifications to work as a licensed accountant.","exvi":"Người ứng tuyển phải có trình độ chuyên môn cần thiết để làm kế toán có chứng chỉ hành nghề."},{"w":"recruit","pos":"v, n","vi":"tuyển dụng; nhân viên mới","ex":"The company plans to recruit twenty sales representatives before the end of June.","exvi":"Công ty dự định tuyển hai mươi nhân viên kinh doanh trước cuối tháng Sáu."},{"w":"submit","pos":"v","vi":"nộp, gửi (hồ sơ)","ex":"Please submit your résumé and cover letter by Friday afternoon.","exvi":"Vui lòng nộp sơ yếu lý lịch và thư xin việc trước chiều thứ Sáu."},{"w":"time-consuming","pos":"adj","vi":"tốn nhiều thời gian","ex":"Reading hundreds of applications by hand is a time-consuming task for managers.","exvi":"Đọc thủ công hàng trăm hồ sơ ứng tuyển là công việc tốn nhiều thời gian đối với các quản lý."}]},{"n":12,"title":{"en":"Applying and Interviewing","vi":"Nộp đơn và phỏng vấn"},"words":[{"w":"ability","pos":"n","vi":"khả năng, năng lực","ex":"The position requires the ability to work well under tight deadlines.","exvi":"Vị trí này đòi hỏi khả năng làm việc tốt dưới áp lực thời hạn gấp."},{"w":"apply","pos":"v","vi":"nộp đơn, ứng tuyển","ex":"More than two hundred people applied for the receptionist job online.","exvi":"Hơn hai trăm người đã ứng tuyển trực tuyến vào vị trí lễ tân."},{"w":"background","pos":"n","vi":"lý lịch, kinh nghiệm nền tảng","ex":"His background in finance made him a strong choice for the analyst role.","exvi":"Nền tảng kinh nghiệm về tài chính khiến anh ấy trở thành lựa chọn sáng giá cho vị trí chuyên viên phân tích."},{"w":"be ready for","pos":"phr","vi":"sẵn sàng cho","ex":"You should be ready for difficult questions about your previous employer.","exvi":"Bạn nên sẵn sàng cho những câu hỏi khó về công ty cũ của mình."},{"w":"call in","pos":"phr","vi":"mời đến, gọi đến","ex":"The manager called in three applicants for a second interview on Monday.","exvi":"Người quản lý đã mời ba ứng viên đến phỏng vấn vòng hai vào thứ Hai."},{"w":"confidence","pos":"n","vi":"sự tự tin, lòng tin","ex":"She answered every question with confidence and impressed the hiring committee.","exvi":"Cô ấy trả lời mọi câu hỏi một cách tự tin và gây ấn tượng với hội đồng tuyển dụng."},{"w":"constantly","pos":"adv","vi":"liên tục, không ngừng","ex":"The department is constantly looking for talented people to join its team.","exvi":"Phòng ban liên tục tìm kiếm những người tài năng để gia nhập đội ngũ."},{"w":"expert","pos":"n, adj","vi":"chuyên gia; thành thạo","ex":"We need an expert in tax law to advise our international clients.","exvi":"Chúng tôi cần một chuyên gia về luật thuế để tư vấn cho khách hàng quốc tế."},{"w":"follow up","pos":"phr","vi":"theo dõi, liên hệ lại sau","ex":"It is polite to follow up with a thank-you e-mail after an interview.","exvi":"Gửi thư cảm ơn để liên hệ lại sau buổi phỏng vấn là phép lịch sự."},{"w":"hesitant","pos":"adj","vi":"do dự, ngập ngừng","ex":"The applicant seemed hesitant when asked about relocating to another city.","exvi":"Ứng viên có vẻ do dự khi được hỏi về việc chuyển đến thành phố khác."},{"w":"present","pos":"v","vi":"trình bày, giới thiệu","ex":"Each finalist will present a short business proposal to the directors.","exvi":"Mỗi ứng viên vào vòng cuối sẽ trình bày một đề xuất kinh doanh ngắn trước ban giám đốc."},{"w":"weakly","pos":"adv","vi":"một cách yếu ớt, thiếu thuyết phục","ex":"He responded weakly to the question about his long-term career goals.","exvi":"Anh ấy trả lời thiếu thuyết phục câu hỏi về mục tiêu nghề nghiệp dài hạn."}]},{"n":13,"title":{"en":"Hiring and Training","vi":"Tuyển dụng và đào tạo"},"words":[{"w":"conduct","pos":"v, n","vi":"tiến hành, thực hiện; hành vi","ex":"The trainer will conduct a safety workshop for all new factory workers.","exvi":"Giảng viên sẽ tiến hành buổi hội thảo an toàn cho toàn bộ công nhân mới của nhà máy."},{"w":"generate","pos":"v","vi":"tạo ra, phát sinh","ex":"The new training program ng customers.","exvi":"Tất cả thu ngân được đào tạo hai ngày trước khi phục vụ khách hàng."},{"w":"update","pos":"v, n","vi":"cập nhật; bản cập nhật","ex":"The manual is updated every year to include the latest company policies.","exvi":"Sổ tay được cập nhật hằng năm để bổ sung các chính sách mới nhất của công ty."}]},{"n":14,"title":{"en":"Salaries and Benefits","vi":"Lương và phúc lợi"},"words":[{"w":"basis","pos":"n","vi":"cơ sở, nền tảng","ex":"Bonuses are paid on the basis of individual sales performance each quarter.","exvi":"Tiền thưởng được trả trên cơ sở kết quả bán hàng cá nhân mỗi quý."},{"w":"be aware of","pos":"phr","vi":"nhận biết, ý thức về","ex":"New staff should be aware of the rules for requesting paid leave.","exvi":"Nhân viên mới cần nắm rõ các quy định về việc xin nghỉ phép có lương."},{"w":"benefit","pos":"n, v","vi":"phúc lợi; hưởng lợi","ex":"Health insurance is one of the most valued benefits offered by the company.","exvi":"Bảo hiểm y tế là một trong những phúc lợi được đánh giá cao nhất mà công ty cung cấp."},{"w":"compensate","pos":"v","vi":"trả công, đền bù","ex":"Workers will be compensated for any overtime hours during the busy season.","exvi":"Người lao động sẽ được trả công cho mọi giờ làm thêm trong mùa cao điểm."},{"w":"delicately","pos":"adv","vi":"một cách tế nhị, khéo léo","ex":"The supervisor delicately raised the issue of reducing the travel allowance.","exvi":"Người giám sát đã tế nhị nêu vấn đề cắt giảm phụ cấp đi lại."},{"w":"eligible","pos":"adj","vi":"đủ điều kiện, đủ tư cách","ex":"Employees become eligible for the pension plan after one year of service.","exvi":"Nhân viên đủ điều kiện tham gia chương trình hưu trí sau một năm làm việc."},{"w":"flexibly","pos":"adv","vi":"một cách linh hoạt","ex":"Parents on our team are allowed to schedule their working hours flexibly.","exvi":"Các bậc phụ huynh trong nhóm chúng tôi được phép sắp xếp giờ làm việc một cách linh hoạt."},{"w":"negotiate","pos":"v","vi":"đàm phán, thương lư
