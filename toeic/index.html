ạng từ bổ nghĩa cho động từ: 'warmly'. 'warm/warmer' là tính từ, 'warmth' là danh từ.","vi":"Bài thuyết trình của bà Abbott đã được các thành viên hội đồng quản trị đón nhận nồng nhiệt."},{"q":"Applicants must submit their résumés no later than Friday to be ------- for the position.","o":["decided","respected","admitted","considered"],"a":3,"ex":"Cụm 'be considered for the position' = được xem xét cho vị trí. 'admitted' (được nhận vào) thường dùng với trường học/bệnh viện; 'decided', 'respected' không hợp nghĩa.","vi":"Ứng viên phải nộp sơ yếu lý lịch chậm nhất vào thứ Sáu để được xem xét cho vị trí này."},{"q":"The Delmar Hotel is conveniently located ------- walking distance of the convention center.","o":["within","among","between","onto"],"a":0,"ex":"Cụm cố định 'within walking distance of' = trong phạm vi đi bộ tới. 'among' dùng cho nhóm nhiều đối tượng, 'between' cần hai đối tượng.","vi":"Khách sạn Delmar nằm ở vị trí thuận tiện, có thể đi bộ tới trung tâm hội nghị."},{"q":"Granger Logistics has become one of the most ------- shipping companies in the region.","o":["rely","reliance","reliable","reliably"],"a":2,"ex":"Sau 'the most' và trước danh từ 'shipping companies' cần tính từ: 'reliable' (đáng tin cậy). 'rely' là động từ, 'reliance' là danh từ, 'reliably' là trạng từ.","vi":"Granger Logistics đã trở thành một trong những công ty vận chuyển đáng tin cậy nhất trong khu vực."},{"q":"Mr. Fenwick asked that all expense reports be sent directly to ------- by the end of the month.","o":["he","him","his","himself"],"a":1,"ex":"Sau giới từ 'to' cần đại từ tân ngữ 'him'. 'himself' là đại từ phản thân, chỉ dùng khi chủ ngữ và tân ngữ của cùng một mệnh đề trùng nhau, ở đây chủ ngữ là 'all expense reports'.","vi":"Ông Fenwick yêu cầu tất cả báo cáo chi phí được gửi trực tiếp cho ông trước cuối tháng."},{"q":"------- the software update is installed, employees will be able to access the new scheduling tool.","o":["Once","Despite","Whereas","During"],"a":0,"ex":"Chỗ trống nối một mệnh đề (có chủ ngữ + động từ) nên cần liên từ; 'Once' = một khi, hợp nghĩa điều kiện thời gian. 'Despite', 'During' là giới từ; 'Whereas' chỉ sự đối lập.","vi":"Một khi bản cập nhật phần mềm được cài đặt, nhân viên sẽ có thể truy cập công cụ lập lịch mới."},{"q":"By the time the renovation is completed next spring, Castell Bank ------- its main branch for nearly six months.","o":["closes","closed","is closing","will have closed"],"a":3,"ex":"'By the time + hiện tại đơn (tương lai)' cùng 'for nearly six months' chỉ một hành động kéo dài đến mốc tương lai, nên dùng tương lai hoàn thành 'will have closed'.","vi":"Đến khi việc cải tạo hoàn tất vào mùa xuân tới, Ngân hàng Castell sẽ đã đóng cửa chi nhánh chính được gần sáu tháng."},{"q":"The marketing team conducted an ------- analysis of customer feedback before launching the campaign.","o":["extend","extensively","extensive","extension"],"a":2,"ex":"Giữa mạo từ 'an' và danh từ 'analysis' cần tính từ: 'extensive' (sâu rộng). Mạo từ 'an' cũng gợi ý từ bắt đầu bằng nguyên âm nhưng cả 4 lựa chọn đều vậy, nên phải dựa vào từ loại.","vi":"Nhóm tiếp thị đã thực hiện một phân tích sâu rộng về phản hồi của khách hàng trước khi triển khai chiến dịch."},{"q":"Due to high demand, the limited-edition coffee makers are ------- available only through our online store.","o":["currently","previously","nearly","rarely"],"a":0,"ex":"Động từ 'are' ở hiện tại nên 'currently' (hiện tại) phù hợp. 'previously' chỉ quá khứ, mâu thuẫn với thì; 'nearly', 'rarely' không hợp nghĩa với 'available only through'.","vi":"Do nhu cầu cao, các máy pha cà phê phiên bản giới hạn hiện chỉ có bán qua cửa hàng trực tuyến của chúng tôi."},{"q":"Kessler Electronics offers a two-year warranty on all ------- purchased directly from its Web site.","o":["product","products","productive","production"],"a":1,"ex":"Sau 'all' cần danh từ số nhiều đếm được: 'products'. 'product' số ít không đi với 'all' theo nghĩa này; 'production' (việc sản xuất) sai nghĩa; 'productive' là tính từ.","vi":"Kessler Electronics bảo hành hai năm cho tất cả sản phẩm được mua trực tiếp từ trang web của công ty."},{"q":"Questions about the new parking policy should be directed to Ms. Jansen ------- the facilities department.","o":["on","by","in","onto"],"a":2,"ex":"Nói ai đó làm việc trong một phòng ban dùng 'in the ... department'. 'by' dễ gây nhầm vì câu có bị động, nhưng 'by the facilities department' sẽ làm sai nghĩa của 'directed to Ms. Jansen'.","vi":"Các câu hỏi về chính sách đỗ xe mới nên được gửi tới bà Jansen ở phòng quản lý cơ sở vật chất."},{"q":"Employees who wish to work remotely must obtain ------- from their supervisors in advance.","o":["approve","approved","approving","approval"],"a":3,"ex":"Sau động từ 'obtain' cần danh từ làm tân ngữ: 'approval' (sự chấp thuận). Các lựa chọn còn lại là các dạng động từ.","vi":"Nhân viên muốn làm việc từ xa phải xin được sự chấp thuận trước từ cấp quản lý của mình."},{"q":"The shipment was delayed ------- a severe storm closed the main highway for two days.","o":["although","because","unless","so that"],"a":1,"ex":"Mệnh đề sau ('a severe storm closed the main highway') là nguyên nhân của việc giao hàng bị trễ, nên dùng 'because'. 'although' chỉ nhượng bộ, 'unless' chỉ điều kiện, 'so that' chỉ mục đích.","vi":"Lô hàng bị trễ vì một cơn bão lớn đã làm đóng cửa đường cao tốc chính trong hai ngày."},{"q":"The new assembly line has significantly increased the ------- of the Halvorsen plant.","o":["productivity","productive","productively","produce"],"a":0,"ex":"Sau 'the' và trước 'of' cần danh từ: 'productivity' (năng suất). 'produce' cũng có thể là danh từ nhưng nghĩa là nông sản, không hợp với nhà máy.","vi":"Dây chuyền lắp ráp mới đã tăng đáng kể năng suất của nhà máy Halvorsen."},{"q":"To ------- a smooth transition, the outgoing manager will train her replacement for two weeks.","o":["assure","insure","ensure","reassure"],"a":2,"ex":"'ensure a smooth transition' = đảm bảo việc chuyển giao suôn sẻ. 'assure/reassure' cần tân ngữ là người (assure someone), 'insure' là mua bảo hiểm.","vi":"Để đảm bảo việc chuyển giao suôn sẻ, người quản lý sắp nghỉ sẽ đào tạo người thay thế trong hai tuần."},{"q":"Mr. Ingram is ------- responsible for coordinating the annual shareholders' meeting.","o":["primary","primacy","primaries","primarily"],"a":3,"ex":"Chỗ trống bổ nghĩa cho tính từ 'responsible' nên cần trạng từ 'primarily' (chủ yếu). 'primary' là tính từ, 'primacy/primaries' là danh từ.","vi":"Ông Ingram chịu trách nhiệm chính trong việc điều phối cuộc họp cổ đông thường niên."},{"q":"All visitors must sign in at the front desk ------- entering the laboratory.","o":["before","until","among","beside"],"a":0,"ex":"Ký tên ở quầy lễ tân phải diễn ra trước khi vào phòng thí nghiệm: 'before entering'. 'until' (cho đến khi) không hợp với hành động một lần như 'sign in'.","vi":"Tất cả khách tham quan phải ký tên tại quầy lễ tân trước khi vào phòng thí nghiệm."},{"q":"The winners of the design competition ------- at a ceremony next Thursday.","o":["announce","are announcing","will be announced","have announced"],"a":2,"ex":"Chủ ngữ 'The winners' được người khác công bố nên cần thể bị động, và 'next Thursday' chỉ tương lai: 'will be announced'. Các lựa chọn khác đều ở thể chủ động.","vi":"Những người thắng cuộc thi thiết kế sẽ được công bố tại một buổi lễ vào thứ Năm tới."},{"q":"Lindqvist Furniture is known for its ------- designed chairs that combine comfort and style.","o":["thought","thoughtfully","thoughtful","thoughtfulness"],"a":1,"ex":"Chỗ trống bổ nghĩa cho phân từ 'designed' (đóng vai trò tính từ) nên cần trạng từ 'thoughtfully'. Bẫy là 'thoughtful' vì đứng gần danh từ 'chairs'.","vi":"Lindqvist Furniture nổi tiếng với những chiếc ghế được thiết kế chu đáo, kết hợp giữa sự thoải mái và phong cách."},{"q":"The city council has ------- funds to repair the bridge on Marlow Street.","o":["allowed","aimed","afforded","allocated"],"a":3,"ex":"'allocate funds to do something' = phân bổ ngân sách để làm gì. 'allowed funds' và 'aimed funds' không phải kết hợp tự nhiên; 'afford' thường đi với 'can'.","vi":"Hội đồng thành phố đã phân bổ ngân sách để sửa chữa cây cầu trên phố Marlow."},{"q":"Please read the safety instructions ------- before operating the machine.","o":["carefully","careful","care","caring"],"a":0,"ex":"Câu đã đủ thành phần (read + tân ngữ 'the safety instructions'), chỗ trống bổ nghĩa cho động từ 'read' nên cần trạng từ 'carefully'.","vi":"Vui lòng đọc kỹ hướng dẫn an toàn trước khi vận hành máy."},{"q":"Ms. Everly will lead the training session; -------, she will answer any questions about the new benefits package.","o":["instead","in addition","otherwise","nevertheless"],"a":1,"ex":"Hai mệnh đề nêu hai nhiệm vụ bổ sung cho nhau, nên dùng 'in addition' (ngoài ra). 'instead' (thay vào đó) và 'nevertheless' (tuy nhiên) tạo quan hệ đối lập không hợp.","vi":"Bà Everly sẽ chủ trì buổi đào tạo; ngoài ra, bà sẽ trả lời mọi câu hỏi về gói phúc lợi mới."},{"q":"The annual report shows that sales in the Asian market grew ------- than expected.","o":["rapid","rapidity","more rapidly","most rapid"],"a":2,"ex":"Có 'than' nên cần dạng so sánh hơn; chỗ trống bổ nghĩa cho động từ 'grew' nên dùng trạng từ: 'more rapidly'. 'most rapid' là so sánh nhất và là tính từ.","vi":"Báo cáo thường niên cho thấy doanh số tại thị trường châu Á tăng nhanh hơn dự kiến."},{"q":"Brightwell Consulting encourages ------- employees to attend at least one professional workshop per year.","o":["it","itself","theirs","its"],"a":3,"ex":"Trước danh từ 'employees' cần tính từ sở hữu; chủ ngữ là một công ty (số ít) nên dùng 'its'. 'theirs' là đại từ sở hữu, không đứng trước danh từ.","vi":"Brightwell Consulting khuyến khích nhân viên của mình tham dự ít nhất một hội thảo chuyên môn mỗi năm."},{"q":"Before signing the lease, Mr. Marlow asked the landlord to ------- the terms regarding maintenance costs.","o":["clean","clarify","classify","claim"],"a":1,"ex":"'clarify the terms' = làm rõ các điều khoản, hợp ngữ cảnh trước khi ký hợp đồng thuê. 'classify' (phân loại) và 'claim' (yêu cầu, khẳng định) có hình thức gần giống nhưng sai nghĩa.","vi":"Trước khi ký hợp đồng thuê, ông Marlow đã đề nghị chủ nhà làm rõ các điều khoản liên quan đến chi phí bảo trì."},{"q":"The ------- of the new branch office is scheduled for early March.","o":["opening","opened","opens","opener"],"a":0,"ex":"Sau 'The' và trước 'of' cần danh từ; 'opening' (lễ/việc khai trương) hợp nghĩa. 'opener' cũng là danh từ nhưng nghĩa là dụng cụ mở hoặc người mở màn.","vi":"Việc khai trương văn phòng chi nhánh mới được lên lịch vào đầu tháng Ba."},{"q":"The conference room on the third floor is unavailable ------- noon and 3:00 P.M. today.","o":["from","through","between","within"],"a":2,"ex":"Cấu trúc 'between A and B' chỉ khoảng thời gian giữa hai mốc. 'from' phải đi với 'to', không đi với 'and'.","vi":"Phòng hội nghị trên tầng ba không sử dụng được từ trưa đến 3 giờ chiều hôm nay."},{"q":"Delmar Airlines is committed to providing a ------- travel experience for all passengers.","o":["comfort","comfortably","comforts","comfortable"],"a":3,"ex":"Giữa 'a' và cụm danh từ 'travel experience' cần tính từ: 'comfortable'. 'comfort' có thể làm danh từ ghép nhưng 'a comfort travel experience' không tự nhiên.","vi":"Delmar Airlines cam kết mang đến trải nghiệm đi lại thoải mái cho mọi hành khách."},{"q":"Staff may leave early on Friday ------- they have completed their weekly reports.","o":["provided that","so as","in spite of","rather than"],"a":0,"ex":"Cần liên từ nối mệnh đề, mang nghĩa điều kiện: 'provided that' (miễn là). 'in spite of' là giới từ, 'so as' phải đi với 'to', 'rather than' không hợp nghĩa.","vi":"Nhân viên có thể về sớm vào thứ Sáu miễn là họ đã hoàn thành báo cáo tuần."},{"q":"Jansen Foods has received ------- reviews for its new line of organic snacks.","o":["willing","favorable","eager","capable"],"a":1,"ex":"'favorable reviews' = những đánh giá tích cực, là kết hợp từ quen thuộc. 'willing', 'eager', 'capable' mô tả người, không dùng cho 'reviews'.","vi":"Jansen Foods đã nhận được những đánh giá tích cực cho dòng đồ ăn vặt hữu cơ mới."}],"p6":[{"intro":"Questions refer to the following e-mail.","text":"To: All Staff\nFrom: Helen Abbott\nDate: April 28\nSubject: Office relocation\n\nDear colleagues,\n\nAs you know, our regional office will move to Castell Tower on Monday, May 12. To make the transition as smooth as possible, we ask that you pack your personal items {1} Thursday, May 8. Moving boxes and labels are available in the supply room on the second floor.\n\nThe moving company will transport all desks, computers, and filing cabinets over the weekend. {2} Please do not attempt to disconnect any equipment yourself.\n\nOur new office is {3} larger than the current one and includes two additional meeting rooms. A floor plan showing each team's assigned area will be sent to you next week.\n\nThank you for your {4} during this busy period.\n\nHelen Abbott\nFacilities Manager","vi":"Gửi: Toàn thể nhân viên\nTừ: Helen Abbott\nNgày: 28/4\nChủ đề: Chuyển văn phòng\n\nCác đồng nghiệp thân mến,\n\nNhư mọi người đã biết, văn phòng khu vực của chúng ta sẽ chuyển đến tòa Castell Tower vào thứ Hai, ngày 12/5. Để việc chuyển đổi diễn ra suôn sẻ nhất có thể, chúng tôi đề nghị các bạn đóng gói đồ dùng cá nhân trước thứ Năm, ngày 8/5. Thùng và nhãn dán có sẵn trong phòng vật tư ở tầng hai.\n\nCông ty chuyển nhà sẽ vận chuyển toàn bộ bàn, máy tính và tủ hồ sơ vào cuối tuần. Nhân viên IT của chúng ta sẽ kết nối lại tất cả máy tính trước sáng thứ Hai. Vui lòng không tự tháo bất kỳ thiết bị nào.\n\nVăn phòng mới rộng hơn đáng kể so với văn phòng hiện tại và có thêm hai phòng họp. Sơ đồ mặt bằng thể hiện khu vực được phân cho từng nhóm sẽ được gửi tới các bạn vào tuần tới.\n\nCảm ơn sự hợp tác của các bạn trong giai đoạn bận rộn này.\n\nHelen Abbott\nQuản lý Cơ sở vật chất","qs":[{"q":"","o":["since","among","by","onto"],"a":2,"ex":"'by + mốc thời gian' = trước/chậm nhất vào thời điểm đó, hợp với yêu cầu đóng gói trước ngày 8/5. 'since' dùng với thì hoàn thành, 'among', 'onto' không chỉ thời gian."},{"q":"","o":["Our IT staff will reconnect all computers before Monday morning.","The new office will be closed to visitors for the first month.","Please submit your vacation requests by Friday.","The supply room has recently been repainted."],"a":0,"ex":"Câu trước nói việc chuyển máy tính, câu sau dặn không tự tháo thiết bị; câu về nhân viên IT kết nối lại máy tính nối hai ý này hợp lý. Các câu khác lạc chủ đề thiết bị."},{"q":"","o":["consider","considerable","considerate","considerably"],"a":3,"ex":"Chỗ trống bổ nghĩa cho tính từ so sánh 'larger' nên cần trạng từ 'considerably' (đáng kể). 'considerable' là tính từ, 'considerate' (chu đáo) sai nghĩa."},{"q":"","o":["cooperate","cooperation","cooperative","cooperatively"],"a":1,"ex":"Sau tính từ sở hữu 'your' cần danh từ: 'cooperation'. Cụm 'Thank you for your cooperation' rất thường gặp ở cuối thư."}]},{"intro":"Questions refer to the following notice.","text":"NOTICE TO ALL LIBRARY MEMBERS\n\nBeginning on June 1, Kessler Public Library will {1} its weekday hours. The library will open at 8:00 A.M. instead of 9:00 A.M. and will close at 9:00 P.M. instead of 7:00 P.M., Monday through Friday. Weekend hours will remain the same.\n\nThis change is a response to a recent survey of our members. Many respondents said they would like to visit the library {2} or after their workday. {3}\n\nIn addition, members will now be able to reserve study rooms online. Reservations can be made up to seven days in advance. {4} any questions about these changes, please speak with a staff member at the circulation desk.","vi":"THÔNG BÁO TỚI TẤT CẢ HỘI VIÊN THƯ VIỆN\n\nBắt đầu từ ngày 1/6, Thư viện Công cộng Kessler sẽ kéo dài giờ mở cửa các ngày trong tuần. Thư viện sẽ mở cửa lúc 8 giờ sáng thay vì 9 giờ sáng và đóng cửa lúc 9 giờ tối thay vì 7 giờ tối, từ thứ Hai đến thứ Sáu. Giờ mở cửa cuối tuần giữ nguyên.\n\nThay đổi này là để đáp lại một cuộc khảo sát hội viên gần đây. Nhiều người trả lời cho biết họ muốn đến thư viện trước hoặc sau giờ làm việc. Chúng tôi hy vọng lịch mới sẽ giúp các hội viên đi làm dễ dàng sử dụng thư viện hơn.\n\nNgoài ra, hội viên giờ đây có thể đặt phòng học trực tuyến. Có thể đặt trước tối đa bảy ngày. Nếu có bất kỳ câu hỏi nào về những thay đổi này, vui lòng liên hệ nhân viên tại quầy mượn trả sách.","qs":[{"q":"","o":["reduce","extend","cancel","divide"],"a":1,"ex":"Thư viện mở sớm hơn (8 giờ thay vì 9 giờ) và đóng muộn hơn (9 giờ tối thay vì 7 giờ) nên giờ mở cửa được kéo dài: 'extend'. 'reduce' là bẫy trái nghĩa."},{"q":"","o":["along","while","until","before"],"a":3,"ex":"Cấu trúc song song 'before or after their workday' (trước hoặc sau giờ làm), khớp với việc mở sớm và đóng muộn. 'while', 'until' không đi với danh từ 'workday' theo nghĩa này."},{"q":"","o":["We hope the new schedule will make the library more accessible to working members.","The library was originally built in 1965.","Membership fees will increase next year.","Several new computers have been installed in the reading room."],"a":0,"ex":"Câu trước nói về mong muốn đến thư viện trước/sau giờ làm của hội viên; câu 'lịch mới giúp hội viên đi làm dễ tiếp cận hơn' kết luận đoạn này hợp lý. Các câu khác không liên quan đến việc thay đổi giờ."},{"q":"","o":["Even","Because of","Should you have","Whether"],"a":2,"ex":"'Should you have any questions' là dạng đảo ngữ của 'If you have any questions', thường dùng trong văn bản trang trọng. 'Because of' cần cụm danh từ và không hợp nghĩa; 'Whether' cần 'or'."}]},{"intro":"Questions refer to the following article.","text":"STOCKHOLM (March 3) — Lindqvist Furniture announced yesterday that it will open its first store in North America this autumn. The 4,000-square-meter showroom will be located in Toronto's Harbourfront district. {1}\n\nThe company, which was founded forty years ago as a small family workshop, now operates 85 stores across Europe. Its products are popular for their simple designs and {2} prices.\n\n'Canadian customers have shown strong interest in our products through our online store,' said CEO Maria Lindqvist. 'Opening a physical location is the natural next step.' The company {3} to hire about 120 local employees for the new store.\n\nIf the Toronto store performs well, Lindqvist Furniture intends to open additional locations in other Canadian cities {4} the next five years.","vi":"STOCKHOLM (3/3) — Hôm qua, Lindqvist Furniture thông báo sẽ mở cửa hàng đầu tiên tại Bắc Mỹ vào mùa thu này. Showroom rộng 4.000 mét vuông sẽ đặt tại khu Harbourfront của Toronto. Đây được dự đoán sẽ là showroom nội thất lớn nhất thành phố.\n\nCông ty, được thành lập cách đây bốn mươi năm từ một xưởng gia đình nhỏ, hiện vận hành 85 cửa hàng trên khắp châu Âu. Sản phẩm của công ty được ưa chuộng nhờ thiết kế đơn giản và giá cả phải chăng.\n\n'Khách hàng Canada đã thể hiện sự quan tâm lớn đến sản phẩm của chúng tôi qua cửa hàng trực tuyến,' Giám đốc điều hành Maria Lindqvist cho biết. 'Mở một cửa hàng thực tế là bước đi tự nhiên tiếp theo.' Công ty dự định tuyển khoảng 120 nhân viên địa phương cho cửa hàng mới.\n\nNếu cửa hàng ở Toronto hoạt động tốt, Lindqvist Furniture dự định mở thêm các địa điểm ở những thành phố khác của Canada trong vòng năm năm tới.","qs":[{"q":"","o":["Many customers prefer to shop online.","The company's headquarters will move to Toronto next year.","The furniture is delivered in flat packages.","It is expected to be the largest furniture showroom in the city."],"a":3,"ex":"Câu trước mô tả showroom 4.000 m2 ở Toronto; câu 'It is expected to be the largest...' tiếp tục mô tả showroom đó, với 'It' thay cho 'the showroom'. Câu về chuyển trụ sở không có căn cứ trong bài."},{"q":"","o":["afford","affordably","affordable","affordability"],"a":2,"ex":"Trước danh từ 'prices' và song song với tính từ 'simple' cần tính từ: 'affordable' (phải chăng). 'affordability' là danh từ, 'affordably' là trạng từ."},{"q":"","o":["was planned","plans","has been planned","planning"],"a":1,"ex":"Chủ ngữ 'The company' tự lên kế hoạch tuyển người nên dùng chủ động 'plans' (dự định). 'was planned', 'has been planned' là bị động; 'planning' thiếu trợ động từ."},{"q":"","o":["within","among","above","beside"],"a":0,"ex":"'within the next five years' = trong vòng năm năm tới. 'among' dùng cho nhóm đối tượng, 'above/beside' chỉ vị trí không gian."}]},{"intro":"Questions refer to the following memo.","text":"MEMO\nTo: Sales Department\nFrom: Daniel Marlow, Sales Director\nDate: October 2\nSubject: Customer management software\n\nStarting next month, the sales department will begin using a new customer management system called ClientPath. The system will replace the spreadsheets we {1} use to track client contacts.\n\nClientPath allows team members to view a client's full purchase history in one place. It also sends {2} reminders when a follow-up call is due. {3}\n\nTraining sessions will be held on October 15 and 16 in Conference Room B. Each session lasts approximately two hours. Please sign up for one session through the company intranet {4} October 10.","vi":"BẢN GHI NHỚ\nGửi: Phòng Kinh doanh\nTừ: Daniel Marlow, Giám đốc Kinh doanh\nNgày: 2/10\nChủ đề: Phần mềm quản lý khách hàng\n\nBắt đầu từ tháng sau, phòng kinh doanh sẽ sử dụng hệ thống quản lý khách hàng mới có tên ClientPath. Hệ thống này sẽ thay thế các bảng tính mà chúng ta hiện đang dùng để theo dõi thông tin liên hệ khách hàng.\n\nClientPath cho phép các thành viên xem toàn bộ lịch sử mua hàng của khách hàng tại một nơi. Hệ thống cũng gửi nhắc nhở tự động khi đến hạn gọi điện chăm sóc lại. Nhờ vậy, sẽ không bỏ sót cuộc hẹn quan trọng nào với khách hàng.\n\nCác buổi đào tạo sẽ được tổ chức vào ngày 15 và 16/10 tại Phòng họp B. Mỗi buổi kéo dài khoảng hai giờ. Vui lòng đăng ký một buổi qua mạng nội bộ công ty trước ngày 10/10.","qs":[{"q":"","o":["currently","lately","shortly","nearly"],"a":0,"ex":"Bảng tính là công cụ đang được dùng hiện nay và sẽ bị thay thế, nên 'currently use' (hiện đang dùng) hợp nghĩa. 'shortly' chỉ tương lai gần, 'lately' thường đi với thì hoàn thành."},{"q":"","o":["automate","automatic","automation","automatically"],"a":1,"ex":"Trước danh từ 'reminders' cần tính từ: 'automatic' (tự động). 'automatically' là trạng từ, không bổ nghĩa cho danh từ."},{"q":"","o":["Our sales figures for the third quarter were lower than expected.","Conference Room B is located on the fourth floor.","As a result, no important client meeting should be overlooked.","The spreadsheets were created by the accounting team."],"a":2,"ex":"'As a result' nối với tính năng nhắc nhở tự động vừa nêu: nhờ nhắc nhở nên không bỏ sót cuộc hẹn. Câu về Phòng họp B thuộc đoạn đào tạo phía sau, đặt ở đây là sai vị trí."},{"q":"","o":["at","into","since","by"],"a":3,"ex":"'by October 10' = chậm nhất vào ngày 10/10, hạn đăng ký trước các buổi đào tạo ngày 15-16/10. 'since' dùng với thì hoàn thành, 'at' dùng với giờ chứ không dùng với ngày."}]}],"p7":[{"intro":"Questions 147-148 refer to the following text-message chain.","docs":[{"kind":"text-message chain","text":"Alicia Moreno (9:42 A.M.): Hi Ben, I'm at the Calloway Partners building for the 10:30 client meeting, but the security desk says my name isn't on the visitor list.\nBen Hartley (9:44 A.M.): That's strange. I e-mailed the list to their front office yesterday afternoon.\nAlicia Moreno (9:45 A.M.): Could you call them? The guard says he needs confirmation from someone at our office.\nBen Hartley (9:47 A.M.): I'm on it.\nAlicia Moreno (9:55 A.M.): Still waiting in the lobby.\nBen Hartley (9:58 A.M.): I just spoke with their receptionist. She found the list in a different folder. The guard should let you through now.\nAlicia Moreno (9:59 A.M.): Great, he's printing my badge. Thanks!"}],"qs":[{"q":"Why did Ms. Moreno contact Mr. Hartley?","o":["To reschedule a client meeting","To report a problem entering a building","To ask for directions to an office","To request a copy of a client list"],"a":1,"ex":"Cô Moreno viết 'the security desk says my name isn't on the visitor list' – cô không được vào tòa nhà. Đáp án D lặp từ 'list' nhưng cô không xin danh sách khách hàng."},{"q":"At 9:47 A.M., what does Mr. Hartley most likely mean when he writes, \"I'm on it\"?","o":["He has arrived at the meeting.","He is reviewing a visitor list.","He will handle the request right away.","He needs more information from Ms. Moreno."],"a":2,"ex":"'I'm on it' đáp lại lời nhờ 'Could you call them?' nghĩa là anh sẽ xử lý ngay; sau đó anh báo đã gọi cho lễ tân. Đáp án A hiểu sai theo nghĩa đen 'đang ở đó'."}]},{"intro":"Questions 149-150 refer to the following notice.","docs":[{"kind":"notice","text":"ATTENTION ALL JUNIPER TOWER TENANTS\n\nThe two passenger elevators on the east side of the building will be out of service from Monday, March 9, through Wednesday, March 11, while new control systems are installed. The west elevators and the freight elevator will remain in operation during this time.\n\nBecause we expect heavier traffic in the west lobby, we ask that tenants schedule large deliveries for Thursday or later whenever possible. If a delivery cannot be postponed, please notify the building management office at extension 210 at least one day in advance so that the freight elevator can be reserved.\n\nWe apologize for any inconvenience.\nJuniper Tower Management"}],"qs":[{"q":"What is the purpose of the notice?","o":["To announce temporary changes to building services","To introduce a new building manager","To explain a change in delivery fees","To invite tenants to an inspection"],"a":0,"ex":"Thông báo nói thang máy phía đông 'will be out of service from Monday... through Wednesday' – thay đổi tạm thời về dịch vụ tòa nhà. Các đáp án khác không được đề cập."},{"q":"What are tenants asked to do if a delivery cannot be delayed?","o":["Use the east entrance","Pay an additional charge","Move the delivery to Thursday","Contact the management office beforehand"],"a":3,"ex":"'please notify the building management office at extension 210 at least one day in advance' = liên hệ văn phòng quản lý trước. Đáp án C là việc được khuyến khích chung, không áp dụng khi giao hàng không thể dời."}]},{"intro":"Questions 151-152 refer to the following advertisement.","docs":[{"kind":"advertisement","text":"Kestrel Office Furniture\nSpring Clearance Event – April 1 to April 14\n\nMake room for comfort! Save up to 40 percent on desks, ergonomic chairs, filing cabinets, and conference tables from last year's collection. All items come with our standard five-year warranty.\n\nVisit our showroom at 85 Glenview Road or shop online at www.kestrelfurniture.com. Orders over $500 qualify for free delivery within the city. Members of our Business Rewards program receive an additional 5 percent off any purchase.\n\nKestrel Office Furniture – Serving local businesses for over 25 years"}],"qs":[{"q":"What is indicated about Kestrel Office Furniture?","o":["It recently opened a second showroom.","It sells only to large corporations.","It is offering a new product line.","It has been in business for many years."],"a":3,"ex":"Cuối quảng cáo: 'Serving local businesses for over 25 years' → đã kinh doanh nhiều năm. Đáp án C sai vì hàng giảm giá là 'last year's collection'."},{"q":"How can customers receive free delivery?","o":["By spending more than a certain amount","By joining a rewards program","By ordering through the Web site","By visiting the showroom in person"],"a":0,"ex":"'Orders over $500 qualify for free delivery' → chi trên một mức tiền nhất định. Chương trình thành viên (B) chỉ được giảm thêm 5%, không phải miễn phí giao hàng."}]},{"intro":"Questions 153-154 refer to the following e-mail.","docs":[{"kind":"e-mail","text":"To: All Sales Staff\nFrom: Daniel Ferris\nDate: June 2\nSubject: Expense reports\n\nDear team,\n\nStarting this month, all travel and meal expenses must be submitted through ClearLedger, our new online reporting system, instead of on paper forms. The system lets you photograph receipts with your phone and attach them directly to a report, so reimbursements should be processed in about five business days rather than three weeks.\n\nEach of you will receive login details from the IT department tomorrow. Please sign in and complete the short practice report in the system by Friday so that we can fix any access problems before the end of the month.\n\nThank you,\nDaniel Ferris, Finance Manager"}],"qs":[{"q":"Why did Mr. Ferris send the e-mail?","o":["To announce a reduction in travel budgets","To remind staff about a sales meeting","To introduce a new procedure for submitting expenses","To ask employees to update their phone numbers"],"a":2,"ex":"'all travel and meal expenses must be submitted through ClearLedger... instead of on paper forms' → giới thiệu quy trình nộp chi phí mới. Đáp án A dùng từ 'travel' gây nhiễu."},{"q":"What are employees asked to do by Friday?","o":["Submit their paper receipts","Complete a practice task in the system","Contact the IT department","Attend a training session"],"a":1,"ex":"'complete the short practice report in the system by Friday' = hoàn thành bài thực hành. Thông tin đăng nhập do IT gửi tới, nhân viên không cần liên hệ IT (C)."}]},{"intro":"Questions 155-157 refer to the following article.","docs":[{"kind":"article","text":"LARKSPUR ROASTERS TO OPEN SECOND FACILITY\n\nGREENFIELD (May 3) – Larkspur Coffee Roasters, a local company known for its small-batch coffees, will open a second roasting facility in the Eastgate Industrial Park this autumn. [1] The new 2,000-square-meter building will triple the company's production capacity.\n\nFounder Margaret Ellison started the business in her garage eight years ago. Today Larkspur supplies coffee to more than 150 cafés and grocery stores in the region. [2] \"Demand from supermarkets has grown faster than we expected,\" Ms. Ellison said. \"Our current site simply can't keep up.\"\n\nThe company plans to hire about 30 additional workers, including roasters, packers, and delivery drivers. [3] The original facility on Birch Street will continue to operate and will house a small café and visitor center. [4]"}],"qs":[{"q":"What is the article mainly about?","o":["The opening of a new café","A company's plans to expand","The history of a local industrial park","Changes in coffee prices"],"a":1,"ex":"Tiêu đề và câu đầu: Larkspur 'will open a second roasting facility' → kế hoạch mở rộng. Đáp án A bẫy vì quán café nhỏ chỉ là chi tiết phụ ở cơ sở cũ."},{"q":"What is NOT mentioned about Larkspur Coffee Roasters?","o":["It was started by Ms. Ellison.","It sells to grocery stores.","It will create new jobs.","It plans to export its products."],"a":3,"ex":"Bài có nói người sáng lập (A), bán cho grocery stores (B), tuyển 30 người (C); không hề nhắc tới xuất khẩu."},{"q":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"Construction began last month and is on schedule.\"","o":["[1]","[2]","[3]","[4]"],"a":0,"ex":"Câu chèn nói về việc xây dựng, phù hợp ngay sau câu giới thiệu cơ sở mới sẽ mở vào mùa thu ở vị trí [1], trước khi mô tả tòa nhà mới."}]},{"intro":"Questions 158-160 refer to the following invoice.","docs":[{"kind":"invoice","text":"GRAYSON PRINTING SERVICES\n412 Market Street, Ashford\n\nInvoice No.: 7735\nDate: October 14\nCustomer: Bellamy Dental Clinic, attn. Ms. Carla Diaz\n\nItem | Quantity | Price\nAppointment reminder cards | 2,000 | $180.00\nTrifold brochures (full color) | 500 | $320.00\nWindow sign (vinyl, 60 x 90 cm) | 1 | $75.00\nSubtotal: $575.00\nReturning-customer discount (10%): –$57.50\nTotal due: $517.50\n\nPayment is due within 30 days of the invoice date. Payments may be made by bank transfer or by check. A late fee of 2% will be added to balances unpaid after November 13.\n\nThank you for choosing Grayson Printing again!"}],"qs":[{"q":"What did Ms. Diaz's company most likely order?","o":["Office furniture","Dental equipment","Promotional and informational materials","Business software"],"a":2,"ex":"Hóa đơn gồm thẻ nhắc lịch hẹn, tờ gấp quảng cáo và biển hiệu → tài liệu quảng bá/thông tin. Đáp án B bẫy vì khách hàng là phòng khám nha khoa."},{"q":"What is indicated about the payment?","o":["It can be made in more than one way.","It must be made in cash.","It was made on October 14.","It includes a delivery charge."],"a":0,"ex":"'Payments may be made by bank transfer or by check' → nhiều cách thanh toán. Ngày 14/10 chỉ là ngày lập hóa đơn (C)."},{"q":"Why was a discount applied?","o":["The order was placed online.","The order was very large.","Payment was made early.","Bellamy Dental Clinic has used Grayson before."],"a":3,"ex":"'Returning-customer discount' và 'Thank you for choosing Grayson Printing again' → khách hàng cũ. Không có thông tin đặt online hay trả sớm."}]},{"intro":"Questions 161-163 refer to the following Web page.","docs":[{"kind":"web page","text":"Halvorsen Museum of Industry – Group Visits\n\nThe Halvorsen Museum welcomes school, corporate, and community groups of 10 to 40 people. Guided tours last approximately 90 minutes and include our popular steam engine hall and the hands-on textile workshop.\n\nOur main gallery can accommodate up to 40 visitors at a time, so larger groups will be divided and given staggered start times.\n\nGroup rates: $8 per adult, $5 per student. One free chaperone admission is provided for every ten students.\n\nReservations must be made at least two weeks in advance using the online request form. Please note that the textile workshop is closed on Mondays; tours on that day will include a film presentation instead."}],"qs":[{"q":"For whom is the Web page most likely intended?","o":["Museum employees","Organizers of group outings","Textile manufacturers","Tour guides applying for jobs"],"a":1,"ex":"Trang có tiêu đề 'Group Visits', nêu giá vé đoàn và cách đặt chỗ → dành cho người tổ chức tham quan theo đoàn."},{"q":"The word \"accommodate\" in paragraph 2, line 1, is closest in meaning to","o":["adjust","provide lodging for","hold","satisfy"],"a":2,"ex":"'can accommodate up to 40 visitors at a time' = có sức chứa tối đa 40 người → 'hold'. 'provide lodging for' là nghĩa 'cho ở trọ', không hợp ngữ cảnh."},{"q":"What is suggested about tours on Mondays?","o":["They do not include the textile workshop.","They are offered at a lower price.","They must be booked by telephone.","They are limited to student groups."],"a":0,"ex":"'the textile workshop is closed on Mondays; tours on that day will include a film presentation instead' → thứ Hai không có xưởng dệt."}]},{"intro":"Questions 164-167 refer to the following letter.","docs":[{"kind":"letter","text":"Meridian Harbor Hotel\n22 Seaside Avenue, Clearwater Bay\n\nAugust 18\n\nMs. Irene Castillo\nEvent Coordinator, Ashby Medical Supplies\n140 Lindell Road, Fairport\n\nDear Ms. Castillo,\n\nThank you for choosing the Meridian Harbor Hotel for Ashby Medical Supplies' annual sales conference on October 6-8. This letter confirms your reservation of the Pacific Ballroom and 45 guest rooms at the corporate rate of $139 per night.\n\nAs requested, our kitchen will provide a breakfast buffet each morning and a seated dinner on October 7. Please send us the final number of dinner guests and any dietary requirements by September 20. Our audiovisual technician will be available throughout the event at no additional charge.\n\nTo secure the reservation, a deposit of 25 percent of the estimated total is required by September 1. Rooms not reserved under your group name by September 15 will be released for general sale.\n\nShould you have any questions, please contact me directly at 555-0182.\n\nSincerely,\nGordon Liang\nSales Manager"}],"qs":[{"q":"What is the purpose of the letter?","o":["To advertise a new ballroom","To apologize for a billing error","To invite Ms. Castillo to a conference","To confirm arrangements for an event"],"a":3,"ex":"'This letter confirms your reservation of the Pacific Ballroom and 45 guest rooms' → xác nhận sắp xếp cho sự kiện. Ms. Castillo là người tổ chức, không phải được mời (C)."},{"q":"What is Ms. Castillo asked to provide by September 20?","o":["A list of conference speakers","Information about the dinner","A signed contract","A deposit payment"],"a":1,"ex":"'send us the final number of dinner guests and any dietary requirements by September 20' → thông tin về bữa tối. Tiền đặt cọc (D) có hạn 1/9."},{"q":"What is NOT included in the hotel's arrangements?","o":["A breakfast buffet","Technical support","Airport transportation","A seated dinner"],"a":2,"ex":"Thư nhắc buffet sáng, kỹ thuật viên âm thanh hình ảnh và bữa tối ngồi bàn; không có đưa đón sân bay."},{"q":"What will happen after September 15?","o":["Unreserved rooms may be booked by other guests.","The corporate rate will increase.","The conference dates will be finalized.","Mr. Liang will visit Ashby Medical Supplies."],"a":0,"ex":"'Rooms not reserved under your group name by September 15 will be released for general sale' → khách khác có thể đặt các phòng còn trống."}]},{"intro":"Questions 168-171 refer to the following online chat discussion.","docs":[{"kind":"online chat discussion","text":"Grace Holloway (10:02 A.M.): Morning, everyone. The truck carrying the Dunmore order broke down outside Avondale. The driver says the repair will take at least four hours.\nKevin Abara (10:04 A.M.): That's the order Dunmore needs for their store opening tomorrow, right?\nGrace Holloway (10:05 A.M.): Exactly. We can't let them down.\nLucas Mendel (10:07 A.M.): We have a spare van at the Avondale depot. It's smaller, but it could carry about two-thirds of the boxes.\nKevin Abara (10:09 A.M.): And the rest could go on tonight's regular route. It would arrive by 7 A.M.\nGrace Holloway (10:11 A.M.): Their opening is at 10, so that works. Lucas, can you find a driver for the van?\nLucas Mendel (10:15 A.M.): Leave it to me. Hana Cho finished her morning deliveries early.\nGrace Holloway (10:16 A.M.): Perfect. I'll call Dunmore's manager to explain the plan."}],"qs":[{"q":"What problem does Ms. Holloway mention?","o":["An order was sent to the wrong address.","A store opening has been canceled.","A delivery vehicle is not working.","A driver is sick."],"a":2,"ex":"'The truck carrying the Dunmore order broke down' → xe giao hàng bị hỏng. Đáp án D bẫy vì có nhắc tới tài xế."},{"q":"What does Mr. Mendel suggest?","o":["Using a different vehicle","Postponing a delivery","Repairing a truck himself","Contacting a client"],"a":0,"ex":"'We have a spare van at the Avondale depot' → đề nghị dùng phương tiện khác. Gọi khách hàng (D) là việc Ms. Holloway sẽ làm."},{"q":"At 10:15 A.M., what does Mr. Mendel most likely mean when he writes, \"Leave it to me\"?","o":["He will drive the van himself.","He will call Dunmore's manager.","He will load the boxes tonight.","He will arrange for someone to drive the van."],"a":3,"ex":"Ms. Holloway hỏi 'can you find a driver for the van?'; Mr. Mendel đáp 'Leave it to me' rồi gợi ý Hana Cho → anh sẽ sắp xếp tài xế, không tự lái (A)."},{"q":"What is suggested about the Dunmore order?","o":["It will be delivered after the store opens.","It will arrive in two separate shipments.","It contains fragile items.","It was placed by Ms. Cho."],"a":1,"ex":"Hai phần ba hàng đi bằng xe van, phần còn lại đi tuyến tối nay ('the rest could go on tonight's regular route') → giao thành hai chuyến. Hàng đến lúc 7 giờ, trước giờ khai trương 10 giờ, nên A sai."}]},{"intro":"Questions 172-175 refer to the following article.","docs":[{"kind":"article","text":"Delmont Launches Business Incubator\n\nDELMONT (February 12) – The city of Delmont has opened the Ironworks Hub, a business incubator designed to help new companies grow during their first two years. Located in a renovated factory on Canal Street, the facility offers low-cost office space, shared meeting rooms, and free workshops on topics such as accounting and marketing. [1]\n\nCity council member Felix Arden, who proposed the project, said the goal is to keep young entrepreneurs in Delmont. \"Too many talented people leave for larger cities because they can't afford to start a business here,\" he explained. [2]\n\nTwelve companies have already moved in, ranging from a software developer to a bakery that supplies local restaurants. Applicants must submit a business plan and agree to meet monthly with a volunteer mentor. [3] Those who complete the program successfully may also apply for a city loan of up to $20,000.\n\nThe Hub will hold an open house on March 1 for anyone interested in learning more. [4]"}],"qs":[{"q":"What is the purpose of the Ironworks Hub?","o":["To support new businesses","To train factory workers","To attract large corporations","To provide housing for students"],"a":0,"ex":"'a business incubator designed to help new companies grow during their first two years' → hỗ trợ doanh nghiệp mới thành lập."},{"q":"According to Mr. Arden, why was the project created?","o":["To make use of an empty building","To increase tax revenue","To reduce traffic downtown","To prevent entrepreneurs from moving away"],"a":3,"ex":"'the goal is to keep young entrepreneurs in Delmont... Too many talented people leave for larger cities' → ngăn doanh nhân rời đi. Đáp án A bẫy vì tòa nhà là nhà máy cải tạo nhưng không phải lý do được nêu."},{"q":"What is a requirement for companies in the program?","o":["Hiring local employees","Meeting regularly with an adviser","Repaying a loan within two years","Hosting public workshops"],"a":1,"ex":"'agree to meet monthly with a volunteer mentor' → gặp cố vấn định kỳ. Khoản vay chỉ là lựa chọn sau khi hoàn thành chương trình (C)."},{"q":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"Mentors are experienced business owners from the Delmont area.\"","o":["[1]","[2]","[3]","[4]"],"a":2,"ex":"Câu chèn giải thích 'Mentors', nên đặt ngay sau câu nhắc tới 'a volunteer mentor', tức vị trí [3]."}]},{"intro":"Questions 176-180 refer to the following e-mail and schedule.","docs":[{"kind":"e-mail","text":"To: Hiroshi Kato\nFrom: Elena Brandt\nDate: September 3\nSubject: Leadership workshops\n\nHi Hiroshi,\n\nAs we discussed, I'd like each of the new team supervisors in your department to attend at least one workshop in the fall leadership series. I've attached the schedule. Since your team handles client accounts, I think the session on handling difficult conversations would be the most useful.\n\nPlease note that the series is held in the training center on the third floor, except for the session led by an outside speaker, which will take place in the main auditorium because we expect a larger audience. Registration closes one week before each session.\n\nBest,\nElena Brandt\nHuman Resources"},{"kind":"schedule","text":"Fall Leadership Series – Ainsley Corporation\n\nDate | Topic | Presenter\nSeptember 17 | Setting Team Goals | Monica Ruiz, Operations Director\nSeptember 24 | Handling Difficult Conversations | Dr. Allen Bishop, Bishop Consulting\nOctober 8 | Giving Effective Feedback | Elena Brandt, Human Resources\nOctober 22 | Managing Remote Teams | James Okafor, IT Manager\n\nAll sessions run from 2:00 to 4:00 P.M. Light refreshments will be served."}],"qs":[{"q":"Why did Ms. Brandt write the e-mail?","o":["To ask Mr. Kato to lead a workshop","To recommend training for some employees","To announce a new human resources policy","To request a larger meeting room"],"a":1,"ex":"Cô muốn các giám sát viên mới trong bộ phận của Mr. Kato 'attend at least one workshop' và gợi ý buổi phù hợp → đề xuất đào tạo."},{"q":"What is suggested about Mr. Kato's department?","o":["It recently moved to the third floor.","It is hiring new supervisors.","It organizes the leadership series.","It works directly with clients."],"a":3,"ex":"'Since your team handles client accounts' → bộ phận làm việc trực tiếp với khách hàng. Các giám sát viên là 'new' nhưng không nói đang tuyển (B)."},{"q":"When does Ms. Brandt recommend that the supervisors attend a session?","o":["On September 24","On September 17","On October 8","On October 22"],"a":0,"ex":"Email gợi ý buổi 'handling difficult conversations'; lịch cho thấy buổi này vào 24/9. Cần ghép thông tin hai văn bản."},{"q":"Where will the September 24 session most likely be held?","o":["In a client's office","In the training center","In the main auditorium","In the IT department"],"a":2,"ex":"Email: buổi do diễn giả bên ngoài dẫn sẽ ở 'main auditorium'. Lịch: ngày 24/9 do Dr. Bishop của Bishop Consulting (người ngoài công ty) trình bày → hội trường chính."},{"q":"Who will present the session on giving feedback?","o":["Ms. Ruiz","Ms. Brandt","Mr. Okafor","Dr. Bishop"],"a":1,"ex":"Lịch: 'October 8 | Giving Effective Feedback | Elena Brandt' – chính là người viết email."}]},{"intro":"Questions 181-185 refer to the following advertisement and review.","docs":[{"kind":"advertisement","text":"Everton Catering Co.\nFresh food for every business occasion\n\nWhether you're hosting a breakfast meeting, a product launch, or a holiday party, Everton Catering has a package for you.\n\n• Morning Basic – pastries, fruit, coffee and tea: $9 per person\n• Working Lunch – sandwiches, salads, dessert: $16 per person\n• Executive Lunch – hot entrées, salads, dessert, served by our staff: $28 per person\n• Evening Reception – hot and cold appetizers, served by our staff: $34 per person\n\nVegetarian and gluten-free options are available at no extra cost. Orders for 50 or more guests receive a 10 percent discount. Please place orders at least three days in advance."},{"kind":"review","text":"Reviewer: Maria Lindqvist, Brookfield Architects\nRating: ★★★★☆\n\nWe used Everton Catering for a client presentation at our office last Thursday. We ordered a package with hot entrées for 20 people, and the two servers who came were friendly and professional. The roasted chicken was delicious, and several guests asked for the name of the caterer.\n\nMy only complaint is that the gluten-free meals we had requested were not clearly labeled, so one of our guests had to ask the staff which dishes were safe for him to eat. Still, I would definitely order from Everton again and have already recommended them to a colleague."}],"qs":[{"q":"What is indicated about Everton Catering?","o":["It operates a restaurant.","It charges extra for special diets.","It provides food only for breakfast events.","It requires advance notice for orders."],"a":3,"ex":"'Please place orders at least three days in advance' → cần đặt trước. Món ăn kiêng 'at no extra cost' nên B sai."},{"q":"In the advertisement, the word \"occasion\" in line 2 is closest in meaning to","o":["event","chance","reason","period"],"a":0,"ex":"'Fresh food for every business occasion' rồi liệt kê họp, ra mắt sản phẩm, tiệc → 'occasion' = sự kiện. 'chance' là nghĩa 'dịp may', không hợp."},{"q":"Which package did Ms. Lindqvist's company most likely order?","o":["Morning Basic","Working Lunch","Executive Lunch","Evening Reception"],"a":2,"ex":"Bài đánh giá: món chính nóng ('hot entrées'), có nhân viên phục vụ, sự kiện ban ngày; quảng cáo cho thấy gói Executive Lunch có 'hot entrées... served by our staff'. Evening Reception chỉ có món khai vị."},{"q":"Why did Brookfield Architects most likely NOT receive a discount?","o":["The order was placed too late.","The number of guests was too small.","The event took place on a weekday.","The order was paid in cash."],"a":1,"ex":"Quảng cáo: giảm 10% cho đơn từ 50 khách; bài đánh giá: đặt cho 20 người → không đủ số lượng."},{"q":"What problem does Ms. Lindqvist mention?","o":["The servers arrived late.","The food was served cold.","The bill was higher than expected.","Some dishes were not clearly identified."],"a":3,"ex":"'the gluten-free meals we had requested were not clearly labeled' → món ăn không được ghi nhãn rõ. Cô khen nhân viên phục vụ nên A sai; không nhắc tới hóa đơn (C)."}]},{"intro":"Questions 186-190 refer to the following Web page, e-mail, and schedule.","docs":[{"kind":"web page","text":"Brightwell Engineering – Careers\n\nPosition: Project Coordinator (Full-time)\nLocation: Lakemont office\n\nBrightwell Engineering is seeking a project coordinator to support our bridge and road design teams. Responsibilities include preparing project schedules, tracking budgets, and organizing meetings with government clients.\n\nRequirements:\n• At least three years of experience in project coordination\n• Strong skills in spreadsheet and scheduling software\n• Excellent written communication\n\nAn engineering background is helpful but not required. Applicants who pass the first interview will be asked to complete a short scheduling exercise. To apply, send a résumé and cover letter to hr@brightwell-eng.com by May 10."},{"kind":"e-mail","text":"To: hr@brightwell-eng.com\nFrom: Dana Mercer\nDate: May 6\nSubject: Project Coordinator application\n\nDear Hiring Manager,\n\nI am writing to apply for the project coordinator position advertised on your Web site. For the past four years, I have coordinated construction projects for Fenwick Builders, where I managed schedules for up to six projects at once and reported weekly to our clients.\n\nAlthough I have not worked in engineering design, I have collaborated closely with engineers on site. I am also an advanced user of scheduling software and have trained new staff to use it.\n\nPlease note that I will be traveling for work from May 18 to May 22 and will be unavailable for interviews on those dates.\n\nSincerely,\nDana Mercer"},{"kind":"schedule","text":"Brightwell Engineering – First-Round Interviews, Project Coordinator\n\nCandidate | Date | Time | Interviewer\nAlan Pierce | May 15 | 9:30 A.M. | Clara Mendes\nDana Mercer | May 25 | 11:00 A.M. | Clara Mendes\nLeah Fontaine | May 26 | 2:00 P.M. | Martin Gale\nCarl Benning | May 26 | 3:30 P.M. | Martin Gale\n\nNote: All interviews will be held in Conference Room B. Mr. Gale is replacing Ms. Mendes, who will be at a client site on May 26."}],"qs":[{"q":"What is a responsibility of the position?","o":["Arranging meetings with clients","Designing bridges and roads","Training engineering staff","Writing software programs"],"a":0,"ex":"Trang tuyển dụng: 'organizing meetings with government clients' → sắp xếp cuộc họp với khách hàng. Thiết kế cầu đường (B) là việc của đội thiết kế, không phải vị trí này."},{"q":"What is suggested about Ms. Mercer?","o":["She applied after the deadline.","She currently works for Brightwell Engineering.","She meets the experience requirement for the job.","She has a degree in engineering."],"a":2,"ex":"Trang tuyển dụng yêu cầu ít nhất 3 năm kinh nghiệm; email cho biết cô đã điều phối dự án 'For the past four years' → đáp ứng yêu cầu. Cô nộp ngày 6/5, trước hạn 10/5 nên A sai."},{"q":"Why most likely was Ms. Mercer's interview scheduled for May 25?","o":["Conference Room B was unavailable earlier.","She was away on business the week before.","Ms. Mendes requested a later date.","She asked to be interviewed last."],"a":1,"ex":"Email: cô đi công tác từ 18 đến 22/5 nên không phỏng vấn được những ngày này; lịch xếp cô vào 25/5 → ngay sau chuyến công tác."},{"q":"What will Ms. Mercer most likely be asked to do if her first interview is successful?","o":["Submit a cover letter","Visit a construction site","Meet with government officials","Complete a scheduling task"],"a":3,"ex":"Trang tuyển dụng: 'Applicants who pass the first interview will be asked to complete a short scheduling exercise' → làm bài tập lập lịch."},{"q":"Who will interview Ms. Fontaine?","o":["Ms. Mercer","Ms. Mendes","Mr. Gale","Mr. Pierce"],"a":2,"ex":"Lịch: Leah Fontaine phỏng vấn ngày 26/5 với Martin Gale, người thay Ms. Mendes vì bà đi gặp khách hàng ngày đó. Đáp án B bẫy vì Ms. Mendes vốn là ngư .","It was placed after the daily cutoff time.","The delivery address was incorrect.","It was shipped from another city."],"a":1,"ex":"Thông báo: đơn đặt trước 2 giờ chiều được giao ngày làm việc kế tiếp. Hóa đơn: đặt lúc 3:40 P.M. ngày 14/7; email: hàng đến 'yesterday' (16/7) → do đặt sau giờ chốt."},{"q":"What does Ms. Grant request?","o":["A refund for the order","A credit to her company's account","A different brand of toner","A replacement for a damaged item"],"a":3,"ex":"'Rather than a credit, we would like a new cartridge sent' → muốn được gửi hàng thay thế. Đáp án B là phương án cô từ chối."},{"q":"Why does Ms. Grant think the delivery charge was a mistake?","o":["The order total qualified for free shipping.","Her company is a new customer.","The order was delivered late.","Delivery fees were removed on July 14."],"a":0,"ex":"Thông báo: đơn từ $150 trở lên miễn phí giao hàng; hóa đơn: tạm tính $207 nhưng vẫn bị tính $12 → lẽ ra được miễn phí."},{"q":"What is indicated about Ms. Grant's report of the damage?","o":["It was sent to the wrong department.","It was made within the required time.","It did not include supporting evidence.","It was made by telephone."],"a":1,"ex":"Thông báo yêu cầu báo hư hỏng trong 5 ngày sau khi nhận; hàng đến 16/7 và email gửi 17/7 → đúng hạn. Cô có đính kèm ảnh nên C sai."}]},{"intro":"Questions 196-200 refer to the following article, schedule, and text message.","docs":[{"kind":"article","text":"Coastal Business Forum Returns to Harlow\n\nHARLOW (April 2) – The Coastal Business Forum, an annual gathering of small-business owners from across the region, will be held at the Harlow Convention Center on May 12 and 13. This year's theme is \"Growing Through Technology.\"\n\nForum director Joan Albright said attendance has doubled since the event began five years ago. \"Last year we had to turn people away from some of the sessions,\" she noted. \"So this year we've moved the most popular topics to the main hall, which seats 400.\"\n\nTickets cost $60 for one day or $100 for both days. Members of the Harlow Chamber of Commerce receive a 20 percent discount. Tickets can be purchased at www.coastalforum.org."},{"kind":"schedule","text":"Coastal Business Forum – Day 1 (May 12)\n\nTime | Session | Room\n9:00 A.M. | Opening Remarks – Joan Albright | Main Hall\n10:00 A.M. | Selling Online: First Steps – Bruno Castell | Main Hall\n11:30 A.M. | Simple Bookkeeping Apps – Lydia Fenn | Room 2\n2:00 P.M. | Social Media for Local Shops – Carmen Ellis | Main Hall\n3:30 P.M. | Protecting Customer Data – Kenji Moto | Room 3"},{"kind":"text-message chain","text":"Mark Delaney (12:48 P.M.): Hi Gina, I'm at the forum. The bookkeeping session was great, but I'm afraid I can't stay for the afternoon. A client called with an urgent problem.\nMark Delaney (12:49 P.M.): Could you take my place at the session in the main hall this afternoon? It's on using social media, which is exactly what we discussed for the store. My ticket covers both days, so you can use it tomorrow as well."}],"qs":[{"q":"According to the article, what has changed about the forum this year?","o":["It is being held in a different city.","It is free for chamber members.","It lasts one day longer than before.","Some sessions have been moved to a larger room."],"a":3,"ex":"Ms. Albright: 'this year we've moved the most popular topics to the main hall, which seats 400' → chuyển sang phòng lớn hơn. Hội viên phòng thương mại chỉ được giảm 20%, không miễn phí (B)."},{"q":"What is suggested about the session led by Mr. Castell?","o":["It is expected to be popular.","It will be repeated on May 13.","It is intended for experienced sellers.","It has been canceled."],"a":0,"ex":"Bài báo: các chủ đề đông người nhất được chuyển vào Main Hall; lịch: buổi của Mr. Castell diễn ra ở Main Hall → dự kiến được nhiều người quan tâm."},{"q":"Which session did Mr. Delaney attend?","o":["Opening Remarks","Social Media for Local Shops","Simple Bookkeeping Apps","Protecting Customer Data"],"a":2,"ex":"Tin nhắn: 'The bookkeeping session was great' → lịch cho thấy đó là 'Simple Bookkeeping Apps' lúc 11:30. Social Media là buổi anh nhờ Gina đi thay."},{"q":"Whose session does Mr. Delaney want Gina to attend?","o":["Ms. Albright's","Ms. Ellis's","Ms. Fenn's","Mr. Moto's"],"a":1,"ex":"Anh nhờ dự buổi ở main hall buổi chiều về social media; lịch: 2:00 P.M. 'Social Media for Local Shops – Carmen Ellis | Main Hall'. Buổi của Mr. Moto cũng buổi chiều nhưng ở Room 3."},{"q":"How much did Mr. Delaney's ticket most likely cost if he paid the full price?","o":["$100","$60","$80","$120"],"a":0,"ex":"Tin nhắn: 'My ticket covers both days'; bài báo: vé hai ngày giá $100 → $100. $80 là giá sau khi giảm 20%, nhưng câu hỏi nói giá đầy đủ."}]}]},{"id":2,"title":"Test 02","p1":[{"scene":"Một người đàn ông mặc áo phản quang đang đứng trên thang, tay cầm tua vít, tháo nắp một đèn trần trong hành lang văn phòng. Dưới chân thang có một hộp dụng cụ mở nắp.","o":["He's carrying a ladder down a hallway.","He's closing a toolbox on the floor.","He's working on a light fixture.","He's replacing a ceiling tile in a storeroom."],"a":2,"ex":"Người đàn ông đang tháo nắp đèn trần → 'working on a light fixture'. (A) sai vì thang đang được dùng, không phải mang đi; (B) hộp dụng cụ đang mở, không ai đóng; (D) bẫy từ 'ceiling' nhưng anh ta không thay tấm trần."},{"scene":"Một người phụ nữ ngồi ở bàn làm việc gần cửa sổ, đang cắm dây sạc vào máy tính xách tay. Bên cạnh có một cốc cà phê và một xấp tài liệu được kẹp gọn.","o":["She's plugging in a laptop.","She's pouring coffee into a mug.","She's opening a window beside her desk.","She's stapling some documents together."],"a":0,"ex":"Cô ấy đang cắm dây sạc vào laptop → 'plugging in a laptop'. (B) có cốc cà phê nhưng không ai rót; (C) có cửa sổ nhưng không mở; (D) tài liệu đã được kẹp sẵn, không phải đang bấm ghim."},{"scene":"Hai người đàn ông đang cùng khiêng một tấm kính lớn qua cửa ra vào của một cửa hàng. Một người phụ nữ đứng bên trong giữ cửa mở cho họ.","o":["Some workers are installing a window frame.","A woman is locking the entrance to a shop.","Some men are cleaning a glass door.","A door is being held open."],"a":3,"ex":"Người phụ nữ giữ cửa cho hai người khiêng kính → 'A door is being held open'. (A) chưa lắp đặt khung cửa; (B) cô ấy giữ cửa chứ không khóa; (C) bẫy lặp từ 'glass', họ đang khiêng chứ không lau."},{"scene":"Bốn đồng nghiệp ngồi quanh một bàn họp tròn, một người đàn ông chỉ vào biểu đồ trên màn hình treo tường. Những người khác nhìn về phía màn hình, trước mặt mỗi người có một cuốn sổ tay.","o":["The participants are arranging chairs around a table.","A man is gesturing toward a screen.","A woman is handing out notebooks.","Some people are mounting a monitor on the wall."],"a":1,"ex":"Người đàn ông chỉ tay vào màn hình → 'gesturing toward a screen'. (A) ghế đã đặt sẵn và mọi người đang ngồi; (C) sổ tay đã có sẵn trước mặt, không ai phát; (D) màn hình đã treo, không ai đang lắp."},{"scene":"Một khu kho hàng không có người. Nhiều thùng các-tông được xếp chồng lên các pa-lét gỗ dọc theo bức tường, và một xe nâng hàng đậu ở cuối lối đi.","o":["A forklift is being driven down an aisle.","Some boxes are being loaded onto a truck.","Some cartons have been stacked on pallets.","Shelves have been emptied for inspection."],"a":2,"ex":"Ảnh không có người; các thùng đã được chồng lên pa-lét → 'have been stacked on pallets'. (A) và (B) dùng 'is/are being' ám chỉ có người đang làm – sai với ảnh không người; (D) kho đầy hàng chứ không trống."},{"scene":"Một sảnh khách sạn vắng người. Một bình hoa lớn được đặt giữa bàn tiếp tân, phía sau là hàng chìa khóa treo trên tường, và vài chiếc ghế bành đặt quanh một bàn trà thấp.","o":["Some armchairs are being moved across a lobby.","A vase has been placed on a counter.","Flowers are being arranged in a vase.","Some keys have been left on a coffee table."],"a":1,"ex":"Bình hoa đã được đặt trên quầy tiếp tân → 'has been placed on a counter'. (A) và (C) dùng 'is being' nhưng không có người thực hiện; (D) chìa khóa treo trên tường, không phải để trên bàn trà."}],"p2":[{"q":"Who's in charge of the new hire orientation this month?","o":["It starts at nine o'clock.","Ms. Reyes from Human Resources.","Yes, I was hired last month."],"a":1,"ex":"Câu hỏi 'Who' hỏi người phụ trách → 'Ms. Reyes từ phòng Nhân sự'. (A) trả lời thời gian; (C) bẫy lặp từ 'hire/hired' và câu WH không trả lời bằng Yes.","vi":"Ai phụ trách buổi định hướng cho nhân viên mới tháng này?"},{"q":"Where should I send the signed contracts?","o":["About twenty pages long.","Yes, I signed them yesterday.","Directly to the legal department."],"a":2,"ex":"'Where' hỏi nơi gửi → 'thẳng tới phòng pháp chế'. (A) nói về độ dài; (B) bẫy lặp 'signed' và dùng Yes cho câu WH.","vi":"Tôi nên gửi các hợp đồng đã ký đến đâu?"},{"q":"When will the renovations on the third floor be finished?","o":["The contractor hasn't given us a date yet.","On the fourth floor, I think.","They renovated the lobby too."],"a":0,"ex":"Câu trả lời gián tiếp: nhà thầu chưa đưa ra ngày → hợp lý cho câu hỏi 'When'. (B) bẫy lặp 'floor'; (C) bẫy lặp 'renovate' nhưng không trả lời thời gian.","vi":"Khi nào việc cải tạo tầng ba sẽ hoàn tất?"},{"q":"Why was the shipment from Orion Logistics delayed?","o":["Please ship it by express mail.","About three days ago.","There was a storm at the port."],"a":2,"ex":"'Why' hỏi lý do → 'có bão ở cảng'. (A) bẫy âm 'shipment/ship'; (B) trả lời thời gian.","vi":"Tại sao lô hàng từ Orion Logistics bị chậm?"},{"q":"Would you rather meet in person or have a video call?","o":["Yes, I'd like that.","Whichever is easier for you.","The meeting room is booked."],"a":1,"ex":"Câu hỏi lựa chọn; trả lời 'cái nào tiện cho anh/chị cũng được' là cách đáp phổ biến. (A) không dùng Yes cho câu lựa chọn; (C) bẫy lặp từ 'meet/meeting'.","vi":"Anh/chị muốn gặp trực tiếp hay gọi video?"},{"q":"How many people signed up for the safety workshop?","o":["I'll have to check the registration list.","It's on the second floor.","Yes, it was very safe."],"a":0,"ex":"Trả lời gián tiếp: cần kiểm tra danh sách đăng ký – phù hợp với 'How many'. (B) nói địa điểm; (C) bẫy âm 'safety/safe' và dùng Yes.","vi":"Có bao nhiêu người đã đăng ký hội thảo an toàn?"},{"q":"Isn't Mr. Tanaka supposed to present the sales figures today?","o":["Sales have gone up recently.","He's been moved to Thursday's meeting.","A present for his birthday."],"a":1,"ex":"Câu phủ định hỏi xác nhận; đáp án cho biết anh ấy đã được dời sang buổi họp thứ Năm. (A) bẫy lặp 'sales'; (C) bẫy đồng âm 'present' (món quà).","vi":"Chẳng phải hôm nay ông Tanaka sẽ trình bày số liệu doanh thu sao?"},{"q":"Could you print out the agenda for this afternoon's meeting?","o":["It was printed in black and white.","No, the meeting went well.","Sure, how many copies do you need?"],"a":2,"ex":"Lời đề nghị → đồng ý và hỏi lại số bản cần in. (A) bẫy lặp 'print' nhưng ở thì quá khứ, không phải nhận lời; (B) bẫy lặp 'meeting'.","vi":"Anh/chị có thể in chương trình họp chiều nay được không?"},{"q":"What's the fastest way to get to the Westbrook branch?","o":["Take the subway to Park Street.","It opened last year.","No, it's not very far."],"a":0,"ex":"Hỏi cách đi nhanh nhất → 'đi tàu điện ngầm tới Park Street'. (B) trả lời thời điểm; (C) dùng No cho câu WH.","vi":"Cách nhanh nhất để đến chi nhánh Westbrook là gì?"},{"q":"The printer on our floor is out of toner again.","o":["I'll order some more this afternoon.","Print it double-sided, please.","Mostly color documents."],"a":0,"ex":"Câu trần thuật nêu vấn đề → đáp lời đưa ra giải pháp: 'chiều nay tôi sẽ đặt thêm'. (B) bẫy âm 'printer/print'; (C) không liên quan.","vi":"Máy in ở tầng mình lại hết mực rồi."},{"q":"You've reviewed the budget proposal, haven't you?","o":["The proposal was approved.","No, it's a reasonable price.","I'm only halfway through it."],"a":2,"ex":"Câu hỏi đuôi; trả lời gián tiếp 'tôi mới xem được một nửa' (tức là chưa xong). (A) bẫy lặp 'proposal'; (B) nói về giá, không khớp ngữ cảnh.","vi":"Anh/chị đã xem đề xuất ngân sách rồi, phải không?"},{"q":"Which supplier did we choose for the office furniture?","o":["Pinecrest Interiors offered the best price.","The desks are being delivered.","A comfortable chair."],"a":0,"ex":"'Which supplier' hỏi nhà cung cấp → 'Pinecrest Interiors đưa giá tốt nhất' (ngầm hiểu đã chọn). (B) liên quan nội thất nhưng không trả lời; (C) bẫy từ liên quan 'furniture/chair'.","vi":"Chúng ta đã chọn nhà cung cấp nào cho đồ nội thất văn phòng?"},{"q":"Why don't we ask Ms. Vargas to lead the training session?","o":["Because the train was late.","She trained at another company.","That's a great idea."],"a":2,"ex":"'Why don't we...' là lời đề xuất, không hỏi lý do → đáp 'Ý hay đấy'. (A) bẫy 'Why/Because' và âm 'train'; (B) bẫy lặp 'train'.","vi":"Sao chúng ta không nhờ cô Vargas dẫn dắt buổi đào tạo nhỉ?"},{"q":"Has the client confirmed the delivery date?","o":["She's still waiting to hear from her manager.","A date on the calendar.","Yes, the delivery truck is red."],"a":0,"ex":"Trả lời gián tiếp: khách hàng vẫn chờ ý kiến quản lý → tức là chưa xác nhận. (B) bẫy lặp 'date'; (C) có Yes nhưng nội dung lạc đề.","vi":"Khách hàng đã xác nhận ngày giao hàng chưa?"},{"q":"How long has Mr. Sato worked in the accounting department?","o":["About ten kilometers.","Since before I joined the company.","He works on the fifth floor."],"a":1,"ex":"'How long' hỏi khoảng thời gian → 'từ trước khi tôi vào công ty' (gián tiếp). (A) chỉ khoảng cách; (C) bẫy lặp 'work' nhưng nói địa điểm.","vi":"Ông Sato làm việc ở phòng kế toán bao lâu rồi?"},{"q":"Should we hold the product launch in March or wait until April?","o":["Yes, it was launched.","Let's see what the marketing team thinks.","A new product line."],"a":1,"ex":"Câu hỏi lựa chọn; trả lời gián tiếp 'xem nhóm marketing nghĩ sao' là phù hợp. (A) dùng Yes và bẫy lặp 'launch'; (C) bẫy lặp 'product'.","vi":"Chúng ta nên tổ chức ra mắt sản phẩm vào tháng Ba hay đợi đến tháng Tư?"},{"q":"Who approved the extra hours for the warehouse staff?","o":["The operations director did.","About ten extra hours.","In the main warehouse."],"a":0,"ex":"'Who' hỏi người phê duyệt → 'Giám đốc vận hành'. (B) bẫy lặp 'extra hours'; (C) bẫy lặp 'warehouse'.","vi":"Ai đã phê duyệt giờ làm thêm cho nhân viên kho?"},{"q":"Where can I find the updated price list?","o":["The prices went up last week.","Yes, it was updated.","Ms. Quinn just e-mailed it to everyone."],"a":2,"ex":"Hỏi nơi tìm → gián tiếp: 'cô Quinn vừa gửi email cho mọi người' (tức là xem trong email). (A) bẫy lặp 'price'; (B) dùng Yes cho câu WH.","vi":"Tôi có thể tìm bảng giá cập nhật ở đâu?"},{"q":"Don't you need a parking permit for the north lot?","o":["Only on weekdays.","Park near the entrance.","No, it's facing south."],"a":0,"ex":"Câu phủ định hỏi về giấy phép đỗ xe → 'chỉ cần vào ngày thường'. (B) bẫy âm 'parking/park'; (C) bẫy từ liên quan 'north/south'.","vi":"Chẳng phải anh/chị cần giấy phép đỗ xe ở bãi phía bắc sao?"},{"q":"I can't log in to the new expense system.","o":["It's an expensive system.","The new one is in the lobby.","Did you reset your password?"],"a":2,"ex":"Câu trần thuật nêu sự cố → đáp lời hỏi lại để giúp xử lý: 'Bạn đã đặt lại mật khẩu chưa?'. (A) bẫy âm 'expense/expensive'; (B) bẫy lặp 'new'.","vi":"Tôi không đăng nhập được vào hệ thống chi phí mới."},{"q":"When is the deadline for the quarterly report?","o":["Every three months.","It's been pushed back to Friday.","A quarter of the staff."],"a":1,"ex":"Hỏi thời hạn → 'đã được lùi sang thứ Sáu'. (A) giải thích 'quarterly' chứ không nêu hạn chót; (C) bẫy âm 'quarterly/quarter'.","vi":"Hạn chót nộp báo cáo quý là khi nào?"},{"q":"Would you mind covering my shift on Saturday?","o":["The cover was damaged.","No, it shifted to the left.","I'm afraid I've got plans that day."],"a":2,"ex":"Lời nhờ vả → từ chối lịch sự 'e là hôm đó tôi có kế hoạch rồi'. (A) bẫy lặp 'cover' (bìa); (B) bẫy lặp 'shift' (dịch chuyển).","vi":"Anh/chị có phiền làm thay ca của tôi vào thứ Bảy không?"},{"q":"What did you think of the candidate we interviewed this morning?","o":["She seemed very well prepared.","At ten thirty.","I think so, too."],"a":0,"ex":"Hỏi ý kiến về ứng viên → 'cô ấy có vẻ chuẩn bị rất kỹ'. (B) trả lời thời gian; (C) bẫy lặp 'think' nhưng không phù hợp với câu hỏi WH.","vi":"Anh/chị nghĩ gì về ứng viên chúng ta phỏng vấn sáng nay?"},{"q":"Are the conference rooms on this floor available for booking?","o":["A book about leadership.","Room 302 is free after lunch.","Yes, on the conference call."],"a":1,"ex":"Trả lời gián tiếp bằng thông tin cụ thể: 'phòng 302 trống sau giờ trưa'. (A) bẫy đồng âm 'booking/book'; (C) có Yes nhưng bẫy lặp 'conference'.","vi":"Các phòng hội nghị ở tầng này có đặt được không?"},{"q":"Why hasn't the website been updated with the new store hours?","o":["The store opens at eight.","Yes, I visited the website.","Our web designer is on vacation this week."],"a":2,"ex":"Hỏi lý do → 'nhà thiết kế web đi nghỉ tuần này'. (A) bẫy lặp 'store hours'; (B) dùng Yes cho câu WH và bẫy lặp 'website'.","vi":"Tại sao trang web vẫn chưa được cập nhật giờ mở cửa mới của cửa hàng?"}],"p3":[{"conv":[{"s":"W","t":"Hi, this is Rachel Owens from Quayside Dental Clinic. We received our order from Pinewood Office Supplies this morning, but the box contains glossy photo paper instead of the standard copy paper we ordered.","vi":"Xin chào, tôi là Rachel Owens ở Phòng khám Nha khoa Quayside. Sáng nay chúng tôi đã nhận được đơn hàng từ Pinewood Office Supplies, nhưng thùng hàng lại chứa giấy in ảnh bóng thay vì giấy photocopy tiêu chuẩn mà chúng tôi đã đặt."},{"s":"M","t":"I'm sorry about that, Ms. Owens. Could you give me the order number on the packing slip?","vi":"Tôi rất xin lỗi về điều đó, cô Owens. Cô có thể cho tôi số đơn hàng trên phiếu đóng gói không?"},{"s":"W","t":"Sure, it's 4-4-8-1-7. We need the copy paper fairly soon because our front desk prints patient forms every day.","vi":"Được, số là 44817. Chúng tôi cần giấy photocopy khá gấp vì quầy lễ tân in phiếu bệnh nhân hằng ngày."},{"s":"M","t":"I see the problem. The two items have nearly identical product codes, and our warehouse picked the wrong one. Unfortunately, the copy paper is out of stock at our main warehouse until Thursday.","vi":"Tôi thấy vấn đề rồi. Hai mặt hàng có mã sản phẩm gần như giống hệt nhau và kho của chúng tôi đã lấy nhầm. Tiếc là giấy photocopy ở kho chính đang hết hàng đến thứ Năm."},{"s":"W","t":"Thursday? We'll run out before then.","vi":"Thứ Năm sao? Chúng tôi sẽ hết giấy trước lúc đó mất."},{"s":"M","t":"Our Northgate branch has some in stock, though. I'll arrange for a courier to bring you five boxes from there this afternoon, at no charge.","vi":"Tuy nhiên chi nhánh Northgate của chúng tôi vẫn còn hàng. Tôi sẽ sắp xếp người giao hàng mang năm thùng từ đó đến cho cô chiều nay, miễn phí."},{"s":"W","t":"That would be great. What should I do with the photo paper?","vi":"Vậy thì tuyệt quá. Tôi nên làm gì với số giấy in ảnh?"},{"s":"M","t":"Just leave it at your reception desk. The courier will pick it up when he drops off your order.","vi":"Cô cứ để ở quầy lễ tân. Người giao hàng sẽ lấy lại khi anh ấy giao đơn hàng của cô."}],"qs":[{"q":"Why is the woman calling?","o":["To ask about a price","To report an incorrect shipment","To cancel an order","To request a product catalog"],"a":1,"ex":"Người phụ nữ nói thùng hàng chứa 'glossy photo paper instead of the standard copy paper we ordered' – tức là giao nhầm hàng. Không có chi tiết nào về hỏi giá hay hủy đơn."},{"q":"According to the man, what caused the problem?","o":["A delivery truck broke down.","An order form was incomplete.","A payment was not processed.","Two products have similar codes."],"a":3,"ex":"Người đàn ông giải thích 'The two items have nearly identical product codes, and our warehouse picked the wrong one'. Các đáp án khác không được nhắc đến."},{"q":"What does the man say the courier will do?","o":["Pick up some unwanted items","Bring an invoice for signature","Arrive on Thursday","Install a new printer"],"a":0,"ex":"'The courier will pick it up when he drops off your order' – người giao hàng sẽ lấy lại giấy in ảnh bị giao nhầm. Bẫy C: thứ Năm là ngày kho chính có hàng lại, không phải lúc người giao hàng đến (chiều nay)."}]},{"conv":[{"s":"M","t":"Tanya, the Rosewood Room is booked for the Valdez Engineering workshop tomorrow, right?","vi":"Tanya, phòng Rosewood đã được đặt cho buổi hội thảo của Valdez Engineering ngày mai, đúng không?"},{"s":"W","t":"Yes, from nine to four. They've asked for thirty chairs arranged in rows, plus a projector.","vi":"Đúng, từ chín giờ đến bốn giờ. Họ yêu cầu ba mươi ghế xếp thành hàng, cùng một máy chiếu."},{"s":"M","t":"That's the issue. The projector in that room stopped working this afternoon, and a technician can't come until Friday.","vi":"Đó chính là vấn đề. Máy chiếu trong phòng đó đã hỏng chiều nay và kỹ thuật viên phải đến thứ Sáu mới đến được."},{"s":"W","t":"Hmm. Could we move them to the Orchid Room? It has a built-in screen.","vi":"Hừm. Chúng ta có thể chuyển họ sang phòng Orchid không? Phòng đó có màn hình gắn sẵn."},{"s":"M","t":"It only seats twenty, though.","vi":"Nhưng phòng đó chỉ chứa được hai mươi người thôi."},{"s":"W","t":"Then let's borrow the portable projector from the business center. Nobody's reserved it for tomorrow.","vi":"Vậy thì mình mượn máy chiếu di động ở trung tâm dịch vụ doanh nhân. Ngày mai chưa ai đặt nó cả."},{"s":"M","t":"Good idea. I'll set it up tonight so we can test it before the guests arrive.","vi":"Ý hay đấy. Tối nay tôi sẽ lắp đặt để mình có thể thử trước khi khách đến."},{"s":"W","t":"Thanks. And I'll e-mail the client to let them know there's been a small change in equipment.","vi":"Cảm ơn anh. Còn tôi sẽ gửi e-mail cho khách hàng để báo rằng có một thay đổi nhỏ về thiết bị."}],"qs":[{"q":"Where do the speakers most likely work?","o":["At an engineering firm","At an electronics store","At a hotel","At a university"],"a":2,"ex":"Họ nói về đặt phòng hội nghị (Rosewood Room, Orchid Room), 'business center' và 'guests' – đặc trưng của khách sạn. Bẫy A: Valdez Engineering là khách hàng, không phải nơi họ làm việc."},{"q":"What problem does the man mention?","o":["A piece of equipment is broken.","A room has been double-booked.","A client has canceled an event.","Some chairs are missing."],"a":0,"ex":"'The projector in that room stopped working this afternoon' – máy chiếu bị hỏng. Ghế được nhắc tới nhưng không bị thiếu."},{"q":"What does the woman say she will do?","o":["Call a technician","Reserve another room","Test a projector","Contact a client"],"a":3,"ex":"Người phụ nữ nói 'I'll e-mail the client to let them know...'. Bẫy C: thử máy chiếu là việc của người đàn ông ('I'll set it up tonight so we can test it')."}]},{"conv":[{"s":"W","t":"Hello, Mr. Patel? This is Nadia from Riverbend Farms. I'm calling about your weekly vegetable order for Ursa Bistro.","vi":"Xin chào, anh Patel phải không? Tôi là Nadia từ trang trại Riverbend. Tôi gọi về đơn đặt rau hằng tuần của nhà hàng Ursa Bistro."},{"s":"M","t":"Hi, Nadia. Is there a problem with Friday's delivery?","vi":"Chào Nadia. Chuyến giao hàng thứ Sáu có vấn đề gì sao?"},{"s":"W","t":"Not with the delivery itself. But because of the heavy rain last month, tomato prices have gone up about fifteen percent. I wanted to let you know before I send the invoice.","vi":"Không phải với việc giao hàng. Nhưng do mưa lớn tháng trước, giá cà chua đã tăng khoảng mười lăm phần trăm. Tôi muốn báo anh biết trước khi gửi hóa đơn."},{"s":"M","t":"Fifteen percent is quite a jump. Tomatoes are in almost half of our dishes.","vi":"Mười lăm phần trăm là tăng khá nhiều đấy. Cà chua có trong gần một nửa số món của chúng tôi."},{"s":"W","t":"I understand. One option is our plum tomatoes. They weren't affected as much, so the price is the same as before.","vi":"Tôi hiểu. Một lựa chọn là cà chua mận của chúng tôi. Loại này ít bị ảnh hưởng hơn nên giá vẫn như cũ."},{"s":"M","t":"Plum tomatoes would work for our sauces, actually. Could you send a small sample with Friday's order so our chef can try them?","vi":"Thật ra cà chua mận sẽ hợp với các loại nước sốt của chúng tôi. Chị có thể gửi kèm một ít mẫu trong đơn thứ Sáu để bếp trưởng dùng thử không?"},{"s":"W","t":"Of course. I'll include two kilos free of charge.","vi":"Tất nhiên rồi. Tôi sẽ gửi kèm hai ký miễn phí."},{"s":"M","t":"Perfect. If the chef approves, we'll switch for the rest of the season.","vi":"Tuyệt. Nếu bếp trưởng đồng ý, chúng tôi sẽ chuyển sang loại đó cho đến hết mùa."}],"qs":[{"q":"What is the purpose of the call?","o":["To confirm a delivery time","To recommend a new restaurant","To apologize for a late shipment","To announce a price increase"],"a":3,"ex":"Nadia gọi để báo 'tomato prices have gone up about fifteen percent' trước khi gửi hóa đơn. Bẫy A: người đàn ông hỏi về chuyến giao thứ Sáu nhưng cô nói không có vấn đề về giao hàng."},{"q":"What does the woman suggest?","o":["Ordering earlier in the week","Trying a different product","Buying in larger quantities","Paying in advance"],"a":1,"ex":"Cô gợi ý 'One option is our plum tomatoes' – dùng loại cà chua khác (cà chua mận) có giá không đổi."},{"q":"What does the man ask the woman to do?","o":["Reduce the amount on an invoice","Visit his restaurant","Send a sample","Revise a contract"],"a":2,"ex":"'Could you send a small sample with Friday's order...?' – anh nhờ gửi hàng mẫu cho bếp trưởng thử. Hóa đơn được nhắc tới nhưng anh không đòi giảm."}]},{"conv":[{"s":"M","t":"Olivia, the new expense-reporting software goes live on Monday. The IT team is holding a training session this afternoon at two in Room 5B.","vi":"Olivia, phần mềm báo cáo chi phí mới sẽ đi vào hoạt động từ thứ Hai. Nhóm IT tổ chức một buổi đào tạo chiều nay lúc hai giờ ở phòng 5B."},{"s":"W","t":"I've got a client call at two.","vi":"Lúc hai giờ tôi có cuộc gọi với khách hàng."},{"s":"M","t":"Oh, that's right, you're talking with the people from Selwyn Logistics. Well, IT is also recording the session, so you could watch the video later.","vi":"À đúng rồi, chị nói chuyện với bên Selwyn Logistics. Nhưng IT cũng ghi hình buổi đào tạo, nên chị có thể xem video sau."},{"s":"W","t":"That would help. Will we still be able to submit paper receipts after Monday?","vi":"Vậy thì tốt. Sau thứ Hai chúng ta có còn nộp hóa đơn giấy được không?"},{"s":"M","t":"Only until the end of the month. After that, everything has to be scanned and uploaded through the app.","vi":"Chỉ đến cuối tháng thôi. Sau đó mọi thứ phải được scan và tải lên qua ứng dụng."},{"s":"W","t":"Good to know. I have a stack of receipts from my trip to Toronto that I haven't turned in yet.","vi":"Biết vậy thì tốt. Tôi còn một xấp hóa đơn từ chuyến đi Toronto chưa nộp."},{"s":"M","t":"Then you might want to submit them this week, before the switch.","vi":"Vậy chị nên nộp trong tuần này, trước khi chuyển đổi."},{"s":"W","t":"I'll do that tomorrow morning.","vi":"Sáng mai tôi sẽ làm việc đó."}],"qs":[{"q":"What are the speakers mainly discussing?","o":["A new software system","A business trip","A client contract","An office relocation"],"a":0,"ex":"Cuộc hội thoại xoay quanh 'the new expense-reporting software goes live on Monday' và cách nộp hóa đơn sau khi chuyển đổi. Chuyến đi Toronto chỉ là chi tiết phụ."},{"q":"What does the woman mean when she says, \"I've got a client call at two\"?","o":["She needs to reserve a meeting room.","She wants the man to join a call.","She cannot attend a training session.","She has finished her work early."],"a":2,"ex":"Buổi đào tạo diễn ra lúc hai giờ, trùng với cuộc gọi khách hàng nên cô ngầm nói mình không tham dự được; người đàn ông hiểu ý và gợi ý xem video ghi hình sau."},{"q":"What does the man recommend the woman do?","o":["Record a session","Submit some documents soon","Postpone a trip","Call the IT department"],"a":1,"ex":
