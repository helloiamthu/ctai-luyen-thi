n ánh việc lập kế hoạch kém của nhóm thu mua."},{"w":"run","pos":"v","vi":"vận hành, chạy (máy, chương trình)","ex":"We run the inventory report every Monday before the store opens.","exvi":"Chúng tôi chạy báo cáo tồn kho vào mỗi thứ Hai trước khi cửa hàng mở cửa."},{"w":"scan","pos":"v","vi":"quét (mã vạch), xem lướt","ex":"Employees scan each bar code to record the items in the stockroom.","exvi":"Nhân viên quét từng mã vạch để ghi nhận hàng hóa trong kho."},{"w":"subtract","pos":"v","vi":"trừ đi, khấu trừ","ex":"The system subtracts each sold item from the total number in stock.","exvi":"Hệ thống trừ từng món hàng đã bán khỏi tổng số lượng tồn kho."},{"w":"tedious","pos":"adj","vi":"tẻ nhạt, nhàm chán","ex":"Counting thousands of small parts by hand is slow and tedious work.","exvi":"Đếm thủ công hàng nghìn linh kiện nhỏ là công việc chậm chạp và tẻ nhạt."},{"w":"verify","pos":"v","vi":"xác minh, kiểm tra lại","ex":"Please verify the quantities on the delivery slip before signing it.","exvi":"Vui lòng xác minh số lượng trên phiếu giao hàng trước khi ký nhận."}]},{"n":21,"title":{"en":"Banking","vi":"Ngân hàng"},"words":[{"w":"accept","pos":"v","vi":"chấp nhận, nhận","ex":"The bank accepts deposits at any of its branches until five o'clock.","exvi":"Ngân hàng nhận tiền gửi tại bất kỳ chi nhánh nào cho đến năm giờ."},{"w":"balance","pos":"n, v","vi":"số dư; cân đối","ex":"Please check your account balance before you transfer money to the supplier.","exvi":"Vui lòng kiểm tra số dư tài khoản trước khi chuyển tiền cho nhà cung cấp."},{"w":"borrow","pos":"v","vi":"vay, mượn","ex":"The company borrowed two million dollars to build a new warehouse.","exvi":"Công ty đã vay hai triệu đô la để xây một nhà kho mới."},{"w":"cautiously","pos":"adv","vi":"một cách thận trọng","ex":"The loan officer cautiously reviewed every document in the application file.","exvi":"Nhân viên tín dụng thận trọng xem xét từng giấy tờ trong hồ sơ vay."},{"w":"deduct","pos":"v","vi":"khấu trừ, trừ đi","ex":"The monthly service fee is deducted automatically from your checking account.","exvi":"Phí dịch vụ hằng tháng được tự động trừ vào tài khoản thanh toán của bạn."},{"w":"dividend","pos":"n","vi":"cổ tức, tiền lãi cổ phần","ex":"Shareholders will receive a dividend of fifty cents per share this quarter.","exvi":"Cổ đông sẽ nhận cổ tức năm mươi xu mỗi cổ phiếu trong quý này."},{"w":"down payment","pos":"n","vi":"khoản trả trước, tiền đặt cọc","ex":"They saved for three years to make a down payment on an apartment.","exvi":"Họ đã tiết kiệm ba năm để trả trước cho một căn hộ."},{"w":"mortgage","pos":"n, v","vi":"khoản vay thế chấp; thế chấp","ex":"The couple applied for a twenty-year mortgage at a fixed interest rate.","exvi":"Cặp vợ chồng đã đăng ký khoản vay thế chấp hai mươi năm với lãi suất cố định."},{"w":"restricted","pos":"adj","vi":"bị hạn chế, bị giới hạn","ex":"Access to the vault is restricted to senior bank employees only.","exvi":"Quyền vào kho tiền chỉ giới hạn cho nhân viên cấp cao của ngân hàng."},{"w":"signature","pos":"n","vi":"chữ ký","ex":"Your signature is required on both copies of the loan agreement.","exvi":"Cần có chữ ký của bạn trên cả hai bản hợp đồng vay."},{"w":"take out","pos":"v","vi":"rút (tiền), lấy ra","ex":"She took out two hundred dollars from the cash machine near the office.","exvi":"Cô ấy đã rút hai trăm đô la từ máy rút tiền gần văn phòng."},{"w":"transaction","pos":"n","vi":"giao dịch","ex":"Every online transaction is recorded and shown on your monthly statement.","exvi":"Mọi giao dịch trực tuyến đều được ghi lại và hiển thị trên sao kê hằng tháng."}]},{"n":22,"title":{"en":"Accounting","vi":"Kế toán"},"words":[{"w":"accounting","pos":"n","vi":"kế toán, công việc kế toán","ex":"The accounting department closes the books on the last day of each month.","exvi":"Phòng kế toán khóa sổ vào ngày cuối cùng của mỗi tháng."},{"w":"accumulate","pos":"v","vi":"tích lũy, dồn lại","ex":"Interest accumulates quickly when credit card bills are not paid on time.","exvi":"Tiền lãi dồn lại rất nhanh khi hóa đơn thẻ tín dụng không được trả đúng hạn."},{"w":"asset","pos":"n","vi":"tài sản","ex":"The firm's largest asset is the office building it owns downtown.","exvi":"Tài sản lớn nhất của công ty là tòa nhà văn phòng ở trung tâm thành phố."},{"w":"audit","pos":"n, v","vi":"kiểm toán; cuộc kiểm toán","ex":"An outside firm will audit our financial records in early March.","exvi":"Một công ty bên ngoài sẽ kiểm toán sổ sách tài chính của chúng tôi vào đầu tháng Ba."},{"w":"budget","pos":"n, v","vi":"ngân sách; lập ngân sách","ex":"The marketing team has already spent half of its annual budget.","exvi":"Nhóm tiếp thị đã chi hết một nửa ngân sách hằng năm."},{"w":"build up","pos":"v","vi":"tăng dần, gây dựng","ex":"The owner built up a loyal customer base over fifteen years.","exvi":"Người chủ đã gây dựng được lượng khách hàng trung thành trong mười lăm năm."},{"w":"client","pos":"n","vi":"khách hàng (dịch vụ)","ex":"Our accountant meets each client in person before preparing the annual report.","exvi":"Kế toán của chúng tôi gặp trực tiếp từng khách hàng trước khi lập báo cáo năm."},{"w":"debt","pos":"n","vi":"khoản nợ","ex":"The company plans to pay off its remaining debt by next December.","exvi":"Công ty dự định trả hết khoản nợ còn lại trước tháng Mười Hai tới."},{"w":"outstanding","pos":"adj","vi":"chưa thanh toán, còn tồn đọng","ex":"Please settle all outstanding invoices before the end of the quarter.","exvi":"Vui lòng thanh toán mọi hóa đơn còn tồn đọng trước khi kết thúc quý."},{"w":"profitably","pos":"adv","vi":"một cách có lãi","ex":"The new branch has operated profitably since its second year in business.","exvi":"Chi nhánh mới đã hoạt động có lãi kể từ năm kinh doanh thứ hai."},{"w":"reconcile","pos":"v","vi":"đối chiếu, làm cho khớp","ex":"The bookkeeper reconciles the bank statement with company records every week.","exvi":"Nhân viên sổ sách đối chiếu sao kê ngân hàng với sổ sách công ty hằng tuần."},{"w":"turnover","pos":"n","vi":"doanh thu; mức luân chuyển","ex":"The store's annual turnover rose by twelve percent after the renovation.","exvi":"Doanh thu hằng năm của cửa hàng tăng mười hai phần trăm sau khi cải tạo."}]},{"n":23,"title":{"en":"Investments","vi":"Đầu tư"},"words":[{"w":"aggressively","pos":"adv","vi":"một cách mạnh dạn, quyết liệt","ex":"The fund manager invested aggressively in technology stocks last year.","exvi":"Nhà quản lý quỹ đã đầu tư mạnh dạn vào cổ phiếu công nghệ năm ngoái."},{"w":"attitude","pos":"n","vi":"thái độ, quan điểm","ex":"Her attitude toward risk changed after the market fell sharply.","exvi":"Thái độ của cô ấy đối với rủi ro đã thay đổi sau khi thị trường giảm mạnh."},{"w":"commit","pos":"v","vi":"cam kết, dành (tiền, thời gian)","ex":"The board committed ten million dollars to the expansion project.","exvi":"Hội đồng quản trị đã cam kết dành mười triệu đô la cho dự án mở rộng."},{"w":"conservative","pos":"adj","vi":"thận trọng, dè dặt","ex":"Retired clients usually prefer conservative investments such as government bonds.","exvi":"Khách hàng đã nghỉ hưu thường thích các khoản đầu tư thận trọng như trái phiếu chính phủ."},{"w":"fund","pos":"n, v","vi":"quỹ; cấp vốn, tài trợ","ex":"The city will fund the new library with money from local taxes.","exvi":"Thành phố sẽ cấp vốn cho thư viện mới bằng tiền thuế địa phương."},{"w":"invest","pos":"v","vi":"đầu tư","ex":"Many employees invest part of their salary in the company's retirement plan.","exvi":"Nhiều nhân viên đầu tư một phần lương vào chương trình hưu trí của công ty."},{"w":"long-term","pos":"adj","vi":"dài hạn","ex":"Real estate is often considered a safe long-term investment for families.","exvi":"Bất động sản thường được xem là khoản đầu tư dài hạn an toàn cho các gia đình."},{"w":"portfolio","pos":"n","vi":"danh mục đầu tư","ex":"A balanced portfolio includes stocks, bonds, and some cash savings.","exvi":"Một danh mục đầu tư cân bằng gồm cổ phiếu, trái phiếu và một ít tiền tiết kiệm."},{"w":"pull out","pos":"v","vi":"rút khỏi, rút vốn","ex":"Several investors pulled out of the deal when the costs increased.","exvi":"Một số nhà đầu tư đã rút khỏi thương vụ khi chi phí tăng lên."},{"w":"resource","pos":"n","vi":"nguồn lực, tài nguyên","ex":"The small firm lacks the financial resources to enter foreign markets.","exvi":"Công ty nhỏ này thiếu nguồn lực tài chính để thâm nhập thị trường nước ngoài."},{"w":"return","pos":"n","vi":"lợi nhuận, tiền lãi thu về","ex":"The bonds offer an annual return of about four percent.","exvi":"Số trái phiếu này mang lại lợi nhuận hằng năm khoảng bốn phần trăm."},{"w":"wisely","pos":"adv","vi":"một cách khôn ngoan","ex":"If you spend your bonus wisely, it can last for many months.","exvi":"Nếu bạn tiêu tiền thưởng một cách khôn ngoan, nó có thể đủ dùng trong nhiều tháng."}]},{"n":24,"title":{"en":"Taxes","vi":"Thuế"},"words":[{"w":"calculation","pos":"n","vi":"sự tính toán, phép tính","ex":"According to my calculations, we owe less tax than last year.","exvi":"Theo tính toán của tôi, chúng ta nợ thuế ít hơn năm ngoái."},{"w":"deadline","pos":"n","vi":"hạn chót, thời hạn","ex":"The deadline for submitting tax forms is the fifteenth of April.","exvi":"Hạn chót nộp tờ khai thuế là ngày mười lăm tháng Tư."},{"w":"file","pos":"v","vi":"nộp (hồ sơ, tờ khai)","ex":"Most residents now file their income tax returns online.","exvi":"Hầu hết người dân hiện nay nộp tờ khai thuế thu nhập qua mạng."},{"w":"fill out","pos":"v","vi":"điền vào (mẫu đơn)","ex":"New employees must fill out a tax form on their first day.","exvi":"Nhân viên mới phải điền một mẫu khai thuế trong ngày làm việc đầu tiên."},{"w":"give up","pos":"v","vi":"từ bỏ, bỏ cuộc","ex":"He gave up trying to do his taxes alone and hired an accountant.","exvi":"Anh ấy từ bỏ việc tự khai thuế và thuê một kế toán."},{"w":"joint","pos":"adj","vi":"chung, cùng nhau","ex":"Married couples can choose to submit a joint tax return.","exvi":"Các cặp vợ chồng có thể chọn nộp tờ khai thuế chung."},{"w":"owe","pos":"v","vi":"nợ, phải trả","ex":"The business still owes several thousand dollars in property taxes.","exvi":"Doanh nghiệp vẫn còn nợ vài nghìn đô la tiền thuế tài sản."},{"w":"penalty","pos":"n","vi":"tiền phạt, hình phạt","ex":"There is a penalty for paying your taxes after the due date.","exvi":"Có khoản tiền phạt nếu nộp thuế sau ngày đến hạn."},{"w":"preparation","pos":"n","vi":"sự chuẩn bị","ex":"Careful preparation of your receipts makes tax season much easier.","exvi":"Chuẩn bị hóa đơn cẩn thận giúp mùa khai thuế dễ dàng hơn nhiều."},{"w":"refund","pos":"n, v","vi":"tiền hoàn lại; hoàn tiền","ex":"She used her tax refund to buy a new laptop for work.","exvi":"Cô ấy dùng tiền hoàn thuế để mua một chiếc máy tính xách tay mới cho công việc."},{"w":"spouse","pos":"n","vi":"vợ hoặc chồng","ex":"Please list your spouse's income on the second page of the form.","exvi":"Vui lòng ghi thu nhập của vợ hoặc chồng bạn ở trang hai của mẫu đơn."},{"w":"withhold","pos":"v","vi":"khấu trừ tại nguồn, giữ lại","ex":"Employers withhold income tax from each worker's monthly paycheck.","exvi":"Người sử dụng lao động khấu trừ thuế thu nhập từ lương hằng tháng của mỗi nhân viên."}]},{"n":25,"title":{"en":"Financial Statements","vi":"Báo cáo tài chính"},"words":[{"w":"desire","pos":"n, v","vi":"mong muốn, khao khát","ex":"The owners desire a clearer picture of the company's monthly expenses.","exvi":"Các chủ sở hữu mong muốn có bức tranh rõ ràng hơn về chi phí hằng tháng của công ty."},{"w":"detail","pos":"n, v","vi":"chi tiết; trình bày chi tiết","ex":"The report details every expense made by the sales department.","exvi":"Bản báo cáo trình bày chi tiết mọi khoản chi của phòng kinh doanh."},{"w":"forecast","pos":"n, v","vi":"dự báo","ex":"The sales forecast for next year looks better than we expected.","exvi":"Dự báo doanh số năm tới có vẻ tốt hơn chúng tôi mong đợi."},{"w":"level","pos":"n","vi":"mức, mức độ","ex":"Inventory levels were unusually high at the end of the quarter.","exvi":"Mức tồn kho cao bất thường vào cuối quý."},{"w":"overall","pos":"adj","vi":"tổng thể, toàn bộ","ex":"Overall profits increased even though sales in Asia declined slightly.","exvi":"Lợi nhuận tổng thể tăng dù doanh số ở châu Á giảm nhẹ."},{"w":"perspective","pos":"n","vi":"góc nhìn, quan điểm","ex":"The annual report gives investors a useful perspective on our growth.","exvi":"Báo cáo thường niên mang đến cho nhà đầu tư góc nhìn hữu ích về sự tăng trưởng của chúng tôi."},{"w":"project","pos":"v","vi":"dự kiến, ước tính","ex":"Analysts project that revenue will double within the next three years.","exvi":"Các nhà phân tích ước tính doanh thu sẽ tăng gấp đôi trong ba năm tới."},{"w":"realistic","pos":"adj","vi":"thực tế, khả thi","ex":"The director asked for a more realistic estimate of production costs.","exvi":"Giám đốc yêu cầu một bản ước tính chi phí sản xuất thực tế hơn."},{"w":"target","pos":"n, v","vi":"mục tiêu; nhắm tới","ex":"The team exceeded its sales target for the third month in a row.","exvi":"Nhóm đã vượt mục tiêu doanh số tháng thứ ba liên tiếp."},{"w":"translation","pos":"n","vi":"bản dịch; sự chuyển đổi","ex":"A Japanese translation of the financial statement will be available on Friday.","exvi":"Bản dịch tiếng Nhật của báo cáo tài chính sẽ có vào thứ Sáu."},{"w":"typically","pos":"adv","vi":"thường thì, điển hình là","ex":"Sales typically rise in the weeks before the holiday season.","exvi":"Doanh số thường tăng trong những tuần trước mùa lễ."},{"w":"yield","pos":"n, v","vi":"lợi suất; mang lại (lợi nhuận)","ex":"The new savings account yields a higher rate than the old one.","exvi":"Tài khoản tiết kiệm mới mang lại lãi suất cao hơn tài khoản cũ."}]},{"n":26,"title":{"en":"Property and Departments","vi":"Cơ sở vật chất và phòng ban"},"words":[{"w":"adjacent","pos":"adj","vi":"liền kề, sát bên","ex":"The meeting room is adjacent to the human resources office.","exvi":"Phòng họp nằm sát bên văn phòng nhân sự."},{"w":"collaboration","pos":"n","vi":"sự hợp tác, cộng tác","ex":"The open office layout encourages collaboration between different departments.","exvi":"Cách bố trí văn phòng mở khuyến khích sự hợp tác giữa các phòng ban."},{"w":"concentrate","pos":"v","vi":"tập trung","ex":"It is hard to concentrate when the printers are running all day.","exvi":"Rất khó tập trung khi máy in chạy suốt cả ngày."},{"w":"conducive","pos":"adj","vi":"có lợi cho, thuận lợi cho","ex":"Natural light and quiet rooms are conducive to productive work.","exvi":"Ánh sáng tự nhiên và phòng yên tĩnh có lợi cho việc làm việc hiệu quả."},{"w":"disruption","pos":"n","vi":"sự gián đoạn, xáo trộn","ex":"The office move was completed over the weekend to avoid any disruption.","exvi":"Việc chuyển văn phòng được hoàn tất vào cuối tuần để tránh gián đoạn."},{"w":"hamper","pos":"v","vi":"cản trở, gây trở ngại","ex":"Construction noise hampered the staff's ability to take customer calls.","exvi":"Tiếng ồn xây dựng cản trở nhân viên nhận cuộc gọi của khách hàng."},{"w":"inconsiderately","pos":"adv","vi":"thiếu ý tứ, không quan tâm người khác","ex":"Someone inconsiderately left dirty dishes in the shared kitchen again.","exvi":"Lại có người thiếu ý tứ để bát đĩa bẩn trong bếp chung."},{"w":"lobby","pos":"n","vi":"sảnh, tiền sảnh","ex":"Visitors should wait in the lobby until a staff member arrives.","exvi":"Khách nên chờ ở sảnh cho đến khi có nhân viên ra đón."},{"w":"move up","pos":"v","vi":"thăng tiến, tiến lên","ex":"After five years in sales, she moved up to regional manager.","exvi":"Sau năm năm làm kinh doanh, cô ấy thăng tiến lên vị trí quản lý khu vực."},{"w":"open to","pos":"adj","vi":"sẵn sàng tiếp thu, cởi mở với","ex":"The facilities manager is open to suggestions about the new seating plan.","exvi":"Quản lý cơ sở vật chất sẵn sàng tiếp thu góp ý về sơ đồ chỗ ngồi mới."},{"w":"opt","pos":"v","vi":"chọn, lựa chọn","ex":"Many employees opted to work from home during the renovation.","exvi":"Nhiều nhân viên đã chọn làm việc tại nhà trong thời gian cải tạo."},{"w":"scrutiny","pos":"n","vi":"sự xem xét kỹ lưỡng","ex":"The plan for the new headquarters came under close scrutiny.","exvi":"Kế hoạch xây trụ sở mới đã bị xem xét rất kỹ lưỡng."}]},{"n":27,"title":{"en":"Board Meetings and Committees","vi":"Họp hội đồng quản trị và các ủy ban"},"words":[{"w":"adhere to","pos":"v","vi":"tuân thủ, bám sát","ex":"The chairperson asked everyone to adhere to the time limits.","exvi":"Chủ tọa yêu cầu mọi người tuân thủ giới hạn thời gian."},{"w":"agenda","pos":"n","vi":"chương trình nghị sự","ex":"The agenda for Monday's meeting was emailed to all board members.","exvi":"Chương trình nghị sự của cuộc họp thứ Hai đã được gửi email cho tất cả thành viên hội đồng."},{"w":"bring up","pos":"v","vi":"nêu ra, đề cập","ex":"Ms. Tran brought up the issue of rising delivery costs.","exvi":"Bà Trần đã nêu ra vấn đề chi phí giao hàng tăng cao."},{"w":"conclude","pos":"v","vi":"kết thúc; kết luận","ex":"The committee concluded the meeting with a vote on the proposal.","exvi":"Ủy ban kết thúc cuộc họp bằng việc biểu quyết về đề xuất."},{"w":"go ahead","pos":"v, n","vi":"tiến hành; sự cho phép","ex":"The board decided to go ahead with the merger despite the risks.","exvi":"Hội đồng quản trị quyết định tiến hành sáp nhập bất chấp rủi ro."},{"w":"goal","pos":"n","vi":"mục tiêu, mục đích","ex":"Our main goal this year is to reduce operating expenses.","exvi":"Mục tiêu chính của chúng tôi năm nay là giảm chi phí hoạt động."},{"w":"lengthy","pos":"adj","vi":"dài dòng, kéo dài","ex":"After a lengthy discussion, the directors finally approved the budget.","exvi":"Sau một cuộc thảo luận kéo dài, các giám đốc cuối cùng đã phê duyệt ngân sách."},{"w":"matter","pos":"n","vi":"vấn đề, việc","ex":"This matter will be discussed again at the next committee meeting.","exvi":"Vấn đề này sẽ được thảo luận lại tại cuộc họp ủy ban lần tới."},{"w":"periodically","pos":"adv","vi":"định kỳ, theo chu kỳ","ex":"The safety committee meets periodically to review workplace accident reports.","exvi":"Ủy ban an toàn họp định kỳ để xem xét các báo cáo tai nạn lao động."},{"w":"priority","pos":"n","vi":"ưu tiên, việc ưu tiên","ex":"Customer satisfaction remains the top priority for the management team.","exvi":"Sự hài lòng của khách hàng vẫn là ưu tiên hàng đầu của ban quản lý."},{"w":"progress","pos":"n, v","vi":"tiến độ, tiến triển","ex":"Each team leader reported on the progress of their current projects.","exvi":"Mỗi trưởng nhóm đã báo cáo tiến độ các dự án hiện tại của mình."},{"w":"waste","pos":"v, n","vi":"lãng phí; sự lãng phí","ex":"Let us not waste time on topics that are not listed today.","exvi":"Chúng ta đừng lãng phí thời gian vào những chủ đề không có trong danh sách hôm nay."}]},{"n":28,"title":{"en":"Quality Control","vi":"Kiểm soát chất lượng"},"words":[{"w":"brand","pos":"n","vi":"nhãn hiệu, thương hiệu","ex":"Customers trust this brand because its products rarely break down.","exvi":"Khách hàng tin tưởng thương hiệu này vì sản phẩm hiếm khi hỏng hóc."},{"w":"conform","pos":"v","vi":"tuân theo, phù hợp với","ex":"All toys sold here must conform to national safety standards.","exvi":"Mọi đồ chơi bán ở đây phải tuân theo tiêu chuẩn an toàn quốc gia."},{"w":"defect","pos":"n","vi":"lỗi, khuyết tật (sản phẩm)","ex":"The inspector found a small defect in the stitching of the jacket.","exvi":"Người kiểm tra phát hiện một lỗi nhỏ ở đường may của chiếc áo khoác."},{"w":"enhance","pos":"v","vi":"nâng cao, cải thiện","ex":"The new coating enhances the durability of the phone screen.","exvi":"Lớp phủ mới nâng cao độ bền của màn hình điện thoại."},{"w":"garment","pos":"n","vi":"quần áo, hàng may mặc","ex":"Each garment is checked by hand before it leaves the factory.","exvi":"Mỗi sản phẩm may mặc đều được kiểm tra bằng tay trước khi rời nhà máy."},{"w":"inspect","pos":"v","vi":"kiểm tra, thanh tra","ex":"Technicians inspect the machines every morning before production begins.","exvi":"Kỹ thuật viên kiểm tra máy móc mỗi sáng trước khi bắt đầu sản xuất."},{"w":"perceptive","pos":"adj","vi":"tinh ý, sâu sắc","ex":"A perceptive worker noticed the color difference and stopped the line.","exvi":"Một công nhân tinh ý đã nhận ra sự khác biệt màu sắc và dừng dây chuyền."},{"w":"repel","pos":"v","vi":"chống (nước, bụi), đẩy lùi","ex":"This fabric repels water, so it is ideal for outdoor jackets.","exvi":"Loại vải này chống thấm nước nên rất phù hợp cho áo khoác ngoài trời."},{"w":"take back","pos":"v","vi":"trả lại, nhận lại (hàng)","ex":"The store will take back any item that is damaged on arrival.","exvi":"Cửa hàng sẽ nhận lại bất kỳ món hàng nào bị hư hỏng khi giao đến."},{"w":"throw out","pos":"v","vi":"loại bỏ, vứt đi","ex":"The entire batch was thrown out because it failed the quality test.","exvi":"Toàn bộ lô hàng đã bị loại bỏ vì không đạt kiểm tra chất lượng."},{"w":"uniformly","pos":"adv","vi":"một cách đồng đều, nhất quán","ex":"The paint must be applied uniformly to every part of the surface.","exvi":"Sơn phải được phủ đồng đều lên mọi phần của bề mặt."},{"w":"wrinkle","pos":"n, v","vi":"nếp nhăn; làm nhăn","ex":"These shirts do not wrinkle easily, even after a long flight.","exvi":"Những chiếc áo sơ mi này không dễ nhăn, ngay cả sau một chuyến bay dài."}]},{"n":29,"title":{"en":"Product Development","vi":"Phát triển sản phẩm"},"words":[{"w":"anxious","pos":"adj","vi":"lo lắng; nóng lòng","ex":"The design team is anxious to hear what customers think of the prototype.","exvi":"Nhóm thiết kế nóng lòng muốn biết khách hàng nghĩ gì về bản mẫu."},{"w":"ascertain","pos":"v","vi":"xác định, tìm hiểu chắc chắn","ex":"Engineers are trying to ascertain why the battery overheats.","exvi":"Các kỹ sư đang cố xác định vì sao pin bị quá nhiệt."},{"w":"assume","pos":"v","vi":"đảm nhận; cho rằng","ex":"Mr. Lee will assume responsibility for the project starting next month.","exvi":"Ông Lee sẽ đảm nhận trách nhiệm về dự án từ tháng tới."},{"w":"decade","pos":"n","vi":"thập kỷ, mười năm","ex":"The company has led the software market for more than a decade.","exvi":"Công ty đã dẫn đầu thị trường phần mềm hơn một thập kỷ."},{"w":"examine","pos":"v","vi":"xem xét, kiểm tra kỹ","ex":"The researchers examined hundreds of customer reviews before changing the design.","exvi":"Các nhà nghiên cứu đã xem xét hàng trăm đánh giá của khách hàng trước khi đổi thiết kế."},{"w":"experiment","pos":"n, v","vi":"thí nghiệm; thử nghiệm","ex":"The lab is experimenting with lighter materials for the new bicycle frame.","exvi":"Phòng thí nghiệm đang thử nghiệm vật liệu nhẹ hơn cho khung xe đạp mới."},{"w":"logical","pos":"adj","vi":"hợp lý, hợp logic","ex":"Testing the product with real users is the next logical step.","exvi":"Thử nghiệm sản phẩm với người dùng thật là bước hợp lý tiếp theo."},{"w":"research","pos":"n, v","vi":"nghiên cứu","ex":"Market research shows strong demand for smaller kitchen appliances.","exvi":"Nghiên cứu thị trường cho thấy nhu cầu cao đối với thiết bị nhà bếp cỡ nhỏ."},{"w":"responsibility","pos":"n","vi":"trách nhiệm","ex":"Product safety is the responsibility of everyone on the development team.","exvi":"An toàn sản phẩm là trách nhiệm của mọi người trong nhóm phát triển."},{"w":"solve","pos":"v","vi":"giải quyết","ex":"The updated software solved the problem with slow loading times.","exvi":"Phần mềm cập nhật đã giải quyết vấn đề thời gian tải chậm."},{"w":"supervisor","pos":"n","vi":"người giám sát, cấp trên trực tiếp","ex":"Ask your supervisor to approve the test results before sharing them.","exvi":"Hãy nhờ người giám sát của bạn duyệt kết quả thử nghiệm trước khi chia sẻ."},{"w":"systematically","pos":"adv","vi":"một cách có hệ thống","ex":"The team systematically tested each feature before the product launch.","exvi":"Nhóm đã kiểm thử từng tính năng một cách có hệ thống trước khi ra mắt sản phẩm."}]},{"n":30,"title":{"en":"Renting and Leasing","vi":"Thuê và cho thuê"},"words":[{"w":"apprehensive","pos":"adj","vi":"e ngại, lo sợ","ex":"The owner was apprehensive about signing a five-year rental agreement.","exvi":"Người chủ e ngại việc ký hợp đồng thuê năm năm."},{"w":"circumstance","pos":"n","vi":"hoàn cảnh, tình huống","ex":"Under no circumstances may tenants make changes without written permission.","exvi":"Trong bất kỳ hoàn cảnh nào người thuê cũng không được thay đổi khi chưa có văn bản cho phép."},{"w":"condition","pos":"n","vi":"điều kiện; tình trạng","ex":"The office must be returned in good condition when the contract ends.","exvi":"Văn phòng phải được trả lại trong tình trạng tốt khi hợp đồng kết thúc."},{"w":"due to","pos":"prep","vi":"do, bởi vì","ex":"Rents have risen due to strong demand for downtown office space.","exvi":"Giá thuê đã tăng do nhu cầu cao về mặt bằng văn phòng ở trung tâm."},{"w":"fluctuate","pos":"v","vi":"dao động, biến động","ex":"Rental prices fluctuate depending on the season and the neighborhood.","exvi":"Giá thuê dao động tùy theo mùa và khu vực."},{"w":"get out of","pos":"v","vi":"thoát khỏi, rút khỏi","ex":"The company wants to get out of its contract before moving abroad.","exvi":"Công ty muốn rút khỏi hợp đồng trước khi chuyển ra nước ngoài."},{"w":"indicator","pos":"n","vi":"dấu hiệu, chỉ số","ex":"Empty shops are a clear indicator of a weak local economy.","exvi":"Các cửa hàng bỏ trống là dấu hiệu rõ ràng của nền kinh tế địa phương yếu kém."},{"w":"lease","pos":"n, v","vi":"hợp đồng thuê; thuê, cho thuê","ex":"We signed a three-year lease for the second floor of the building.","exvi":"Chúng tôi đã ký hợp đồng thuê ba năm cho tầng hai của tòa nhà."},{"w":"lock into","pos":"v","vi":"ràng buộc vào, bị trói buộc","ex":"Small firms prefer not to be locked into long rental contracts.","exvi":"Các công ty nhỏ không muốn bị ràng buộc vào hợp đồng thuê dài hạn."},{"w":"occupy","pos":"v","vi":"chiếm, sử dụng (không gian)","ex":"The law firm occupies the top three floors of the tower.","exvi":"Công ty luật sử dụng ba tầng trên cùng của tòa tháp."},{"w":"option","pos":"n","vi":"lựa chọn, quyền chọn","ex":"The agreement includes an option to renew for another two years.","exvi":"Thỏa thuận bao gồm quyền chọn gia hạn thêm hai năm."},{"w":"subject to","pos":"adj","vi":"phụ thuộc vào, tùy theo","ex":"The monthly rent is subject to change after the first year.","exvi":"Tiền thuê hằng tháng có thể thay đổi sau năm đầu tiên."}]},{"n":31,"title":{"en":"Selecting a Restaurant","vi":"Chọn nhà hàng"},"words":[{"w":"appeal","pos":"n, v","vi":"sức hấp dẫn; thu hút","ex":"The restaurant's quiet atmosphere has great appeal for business travelers.","exvi":"Không gian yên tĩnh của nhà hàng có sức hấp dẫn lớn đối với khách đi công tác."},{"w":"arrive","pos":"v","vi":"đến, tới nơi","ex":"Please arrive ten minutes before your reservation so we can seat your group.","exvi":"Vui lòng đến trước giờ đặt bàn mười phút để chúng tôi xếp chỗ cho nhóm của bạn."},{"w":"compromise","pos":"n, v","vi":"sự thỏa hiệp; thỏa hiệp","ex":"As a compromise, the team chose a place that serves both seafood and vegetarian dishes.","exvi":"Để thỏa hiệp, cả nhóm chọn một quán phục vụ cả hải sản lẫn món chay."},{"w":"daringly","pos":"adv","vi":"một cách táo bạo","ex":"The new chef daringly combines local herbs with traditional French sauces.","exvi":"Vị bếp trưởng mới táo bạo kết hợp rau thơm địa phương với các loại sốt Pháp truyền thống."},{"w":"familiar","pos":"adj","vi":"quen thuộc, quen biết","ex":"Our clients are not familiar with this area, so choose a restaurant near their hotel.","exvi":"Khách hàng của chúng ta không quen khu vực này, vì vậy hãy chọn nhà hàng gần khách sạn của họ."},{"w":"guide","pos":"n, v","vi":"sách hướng dẫn, người hướng dẫn; chỉ dẫn","ex":"I checked a local dining guide before booking a table for the board members.","exvi":"Tôi đã xem một cuốn cẩm nang ẩm thực địa phương trước khi đặt bàn cho các thành viên hội đồng quản trị."},{"w":"majority","pos":"n","vi":"phần lớn, đa số","ex":"The majority of our staff voted for the Italian restaurant on Main Street.","exvi":"Phần lớn nhân viên của chúng tôi đã bỏ phiếu chọn nhà hàng Ý trên phố Main."},{"w":"mix","pos":"n, v","vi":"sự pha trộn; trộn lẫn, kết hợp","ex":"The menu offers a good mix of light salads and hearty main courses.","exvi":"Thực đơn có sự kết hợp hài hòa giữa các món salad nhẹ và món chính no bụng."},{"w":"rely","pos":"v","vi":"dựa vào, tin cậy vào","ex":"Many visitors rely on online reviews when deciding where to have dinner.","exvi":"Nhiều du khách dựa vào các đánh giá trên mạng khi quyết định ăn tối ở đâu."},{"w":"secure","pos":"v","vi":"giành được, đặt được; bảo đảm","ex":"Ms. Tran managed to secure a private room for the client dinner on Friday.","exvi":"Cô Trần đã đặt được một phòng riêng cho bữa tối với khách hàng vào thứ Sáu."},{"w":"subjective","pos":"adj","vi":"chủ quan","ex":"Restaurant reviews are subjective, so read several before making a decision.","exvi":"Các bài đánh giá nhà hàng mang tính chủ quan, vì vậy hãy đọc vài bài trước khi quyết định."},{"w":"suggestion","pos":"n","vi":"lời gợi ý, đề xuất","ex":"The hotel receptionist gave us a helpful suggestion for a nearby lunch spot.","exvi":"Nhân viên lễ tân khách sạn đã cho chúng tôi một gợi ý hữu ích về chỗ ăn trưa gần đó."}]},{"n":32,"title":{"en":"Eating Out","vi":"Đi ăn ngoài"},"words":[{"w":"basic","pos":"adj","vi":"cơ bản, đơn giản","ex":"The café serves basic meals such as sandwiches, soup, and fresh salads.","exvi":"Quán cà phê phục vụ những bữa ăn đơn giản như bánh mì kẹp, súp và salad tươi."},{"w":"complete","pos":"adj, v","vi":"trọn vẹn, đầy đủ; hoàn thành","ex":"A complete dinner at this restaurant includes an appetizer, a main dish, and dessert.","exvi":"Một bữa tối trọn vẹn tại nhà hàng này gồm món khai vị, món chính và tráng miệng."},{"w":"excite","pos":"v","vi":"làm hào hứng, kích thích","ex":"The seasonal tasting menu always excites our regular customers.","exvi":"Thực đơn nếm thử theo mùa luôn làm các khách quen của chúng tôi hào hứng."},{"w":"flavor","pos":"n","vi":"hương vị","ex":"The grilled fish had a delicate flavor that everyone at the table enjoyed.","exvi":"Món cá nướng có hương vị thanh nhẹ mà mọi người trong bàn đều thích."},{"w":"forget","pos":"v","vi":"quên","ex":"Our waiter forgot to bring the drinks we had ordered with the appetizers.","exvi":"Người phục vụ đã quên mang đồ uống mà chúng tôi gọi cùng với món khai vị."},{"w":"ingredient","pos":"n","vi":"nguyên liệu, thành phần","ex":"The chef buys fresh ingredients from the local market every morning.","exvi":"Đầu bếp mua nguyên liệu tươi từ chợ địa phương mỗi sáng."},{"w":"judge","pos":"v","vi":"đánh giá, nhận xét","ex":"Customers often judge a restaurant by the speed and friendliness of its service.","exvi":"Khách hàng thường đánh giá một nhà hàng qua tốc độ và sự thân thiện trong phục vụ."},{"w":"mix-up","pos":"n","vi":"sự nhầm lẫn, lộn xộn","ex":"Because of a mix-up in the kitchen, our table received the wrong dishes.","exvi":"Do một sự nhầm lẫn trong bếp, bàn của chúng tôi đã nhận nhầm món."},{"w":"patron","pos":"n","vi":"khách quen, khách hàng thường xuyên","ex":"Loyal patrons of the bistro receive a discount on weekday lunches.","exvi":"Các khách quen của quán được giảm giá cho bữa trưa ngày thường."},{"w":"predict","pos":"v","vi":"dự đoán","ex":"The manager predicts that the outdoor terrace will be full throughout the summer.","exvi":"Người quản lý dự đoán rằng khu sân thượng ngoài trời sẽ kín chỗ suốt mùa hè."},{"w":"randomly","pos":"adv","vi":"một cách ngẫu nhiên","ex":"We randomly picked a small restaurant near the station and were pleasantly surprised.","exvi":"Chúng tôi chọn ngẫu nhiên một nhà hàng nhỏ gần ga và đã bất ngờ một cách thú vị."},{"w":"remind","pos":"v","vi":"nhắc nhở, gợi nhớ","ex":"Please remind the waiter that one of our guests is allergic to peanuts.","exvi":"Vui lòng nhắc người phục vụ rằng một vị khách của chúng tôi bị dị ứng đậu phộng."}]},{"n":33,"title":{"en":"Ordering Lunch","vi":"Đặt bữa trưa"},"words":[{"w":"burden","pos":"n, v","vi":"gánh nặng; làm phiền, đè nặng","ex":"Ordering lunch for forty people should not be a burden for one assistant.","exvi":"Việc đặt bữa trưa cho bốn mươi người không nên là gánh nặng của một trợ lý."},{"w":"commonly","pos":"adv","vi":"thường thường, phổ biến","ex":"Sandwiches and salads are commonly ordered for working lunches in our office.","exvi":"Bánh mì kẹp và salad thường được đặt cho các bữa trưa làm việc ở văn phòng chúng tôi."},{"w":"delivery","pos":"n","vi":"sự giao hàng","ex":"The restaurant promises free delivery on orders placed before eleven o'clock.","exvi":"Nhà hàng cam kết giao hàng miễn phí cho các đơn đặt trước mười một giờ."},{"w":"elegance","pos":"n","vi":"sự thanh lịch, trang nhã","ex":"The caterer presented the lunch with an elegance that impressed our visitors.","exvi":"Đơn vị cung cấp tiệc đã bày bữa trưa một cách trang nhã khiến khách của chúng tôi ấn tượng."},{"w":"fall to","pos":"phr","vi":"thuộc trách nhiệm của ai","ex":"The task of collecting everyone's lunch order usually falls to the newest employee.","exvi":"Việc thu thập món đặt trưa của mọi người thường thuộc về nhân viên mới nhất."},{"w":"impress","pos":"v","vi":"gây ấn tượng","ex":"The quality of the catered food impressed the clients attending the meeting.","exvi":"Chất lượng đồ ăn đặt ngoài đã gây ấn tượng với các khách hàng dự cuộc họp."},{"w":"individual","pos":"adj","vi":"riêng lẻ, cá nhân","ex":"The deli packed each meal in an individual box labeled with the employee's name.","exvi":"Cửa hàng đóng mỗi suất ăn vào một hộp riêng có ghi tên nhân viên."},{"w":"list","pos":"n, v","vi":"danh sách; liệt kê","ex":"Please send me the list of lunch orders by ten this morning.","exvi":"Vui lòng gửi cho tôi danh sách đặt bữa trưa trước mười giờ sáng nay."},{"w":"multiple","pos":"adj","vi":"nhiều, đa dạng","ex":"The menu offers multiple options for people who do not eat meat.","exvi":"Thực đơn có nhiều lựa chọn cho những người không ăn thịt."},{"w":"narrow","pos":"v","vi":"thu hẹp, giới hạn lại","ex":"We narrowed our choices to two caterers that could deliver within an hour.","exvi":"Chúng tôi đã thu hẹp lựa chọn xuống còn hai nhà cung cấp có thể giao trong vòng một giờ."},{"w":"pick up","pos":"phr","vi":"đến lấy, đón","ex":"Mr. Lee will pick up the lunch order on his way back from the bank.","exvi":"Ông Lee sẽ ghé lấy suất trưa đã đặt trên đường từ ngân hàng về."},{"w":"settle","pos":"v","vi":"thanh toán; quyết định, dàn xếp","ex":"The office manager settles the bill with the sandwich shop at the end of each month.","exvi":"Trưởng phòng hành chính thanh toán hóa đơn với tiệm bánh mì vào cuối mỗi tháng."}]},{"n":34,"title":{"en":"Cooking as a Career","vi":"Nghề nấu ăn"},"words":[{"w":"accustom to","pos":"phr","vi":"làm quen với, quen với","ex":"New kitchen staff quickly become accustomed to working long hours on weekends.","exvi":"Nhân viên bếp mới nhanh chóng quen với việc làm nhiều giờ vào cuối tuần."},{"w":"apprentice","pos":"n","vi":"người học việc, thực tập sinh","ex":"She worked as an apprentice under a famous pastry chef for two years.","exvi":"Cô ấy đã làm người học việc cho một đầu bếp bánh ngọt nổi tiếng trong hai năm."},{"w":"culinary","pos":"adj","vi":"thuộc về nấu nướng, ẩm thực","ex":"He graduated from a well-known culinary institute before opening his own restaurant.","exvi":"Anh ấy tốt nghiệp một học viện ẩm thực danh tiếng trước khi mở nhà hàng riêng."},{"w":"demand","pos":"n, v","vi":"nhu cầu; đòi hỏi","ex":"There is a growing demand for chefs who specialize in healthy cuisine.","exvi":"Nhu cầu về đầu bếp chuyên ẩm thực lành mạnh ngày càng tăng."},{"w":"draw","pos":"v","vi":"thu hút, lôi cuốn","ex":"The hotel's cooking classes draw many young people interested in a restaurant career.","exvi":"Các lớp nấu ăn của khách sạn thu hút nhiều bạn trẻ quan tâm đến nghề nhà hàng."},{"w":"incorporate","pos":"v","vi":"kết hợp, đưa vào","ex":"The chef incorporates regional spices into every dish on the new menu.","exvi":"Đầu bếp đưa các loại gia vị vùng miền vào mọi món trong thực đơn mới."},{"w":"influx","pos":"n","vi":"sự đổ vào, dòng người ùn đến","ex":"The city has seen an influx of talented cooks from neighboring countries.","exvi":"Thành phố đã chứng kiến làn sóng đầu bếp tài năng từ các nước láng giềng đổ về."},{"w":"method","pos":"n","vi":"phương pháp, cách thức","ex":"Students learn several methods of preparing fish during the first semester.","exvi":"Học viên học một số phương pháp chế biến cá trong học kỳ đầu tiên."},{"w":"outlet","pos":"n","vi":"phương tiện thể hiện; lối ra","ex":"For many chefs, creating new recipes is an outlet for their creativity.","exvi":"Với nhiều đầu bếp, sáng tạo công thức mới là nơi để họ thể hiện sự sáng tạo."},{"w":"profession","pos":"n","vi":"nghề nghiệp","ex":"Cooking is a demanding profession that requires patience and physical strength.","exvi":"Nấu ăn là một nghề khắt khe, đòi hỏi sự kiên nhẫn và sức khỏe."},{"w":"relinquish","pos":"v","vi":"từ bỏ, nhường lại","ex":"The head chef relinquished his position to spend more time teaching.","exvi":"Bếp trưởng đã từ bỏ vị trí của mình để dành nhiều thời gian hơn cho việc giảng dạy."},{"w":"theme","pos":"n","vi":"chủ đề","ex":"The school's annual dinner had a seafood theme designed by the final-year students.","exvi":"Bữa tối thường niên của trường có chủ đề hải sản do học viên năm cuối thiết kế."}]},{"n":35,"title":{"en":"Events","vi":"Sự kiện"},"words":[{"w":"assist","pos":"v","vi":"hỗ trợ, giúp đỡ","ex":"Two volunteers will assist the organizers with guest registration at the entrance.","exvi":"Hai tình nguyện viên sẽ hỗ trợ ban tổ chức đăng ký khách tại lối vào."},{"w":"coordinate","pos":"v","vi":"điều phối, phối hợp","ex":"Ms. Park coordinates all company events, from product launches to annual parties.","exvi":"Cô Park điều phối mọi sự kiện của công ty, từ ra mắt sản phẩm đến tiệc thường niên."},{"w":"dimension","pos":"n","vi":"kích thước; khía cạnh","ex":"Please confirm the dimensions of the ballroom before ordering the stage equipment.","exvi":"Vui lòng xác nhận kích thước phòng tiệc trước khi đặt thiết bị sân khấu."},{"w":"exact","pos":"adj","vi":"chính xác","ex":"The caterer needs the exact number of guests by Wednesday afternoon.","exvi":"Đơn vị cung cấp tiệc cần số lượng khách chính xác trước chiều thứ Tư."},{"w":"general","pos":"adj","vi":"chung, tổng quát","ex":"We have a general idea of the program, but the details are not final.","exvi":"Chúng tôi đã có ý tưởng chung về chương trình, nhưng các chi tiết chưa chốt."},{"w":"ideally","pos":"adv","vi":"lý tưởng nhất là","ex":"Ideally, the conference venue should be within walking distance of the hotel.","exvi":"Lý tưởng nhất là địa điểm hội nghị nằm trong khoảng cách đi bộ từ khách sạn."},{"w":"lead time","pos":"n","vi":"thời gian chuẩn bị trước","ex":"A large trade show requires a lead time of at least six months.","exvi":"Một hội chợ thương mại lớn cần thời gian chuẩn bị trước ít nhất sáu tháng."},{"w":"plan","pos":"n, v","vi":"kế hoạch; lên kế hoạch","ex":"The marketing team is planning a reception for our overseas distributors.","exvi":"Nhóm tiếp thị đang lên kế hoạch tổ chức tiệc chiêu đãi các nhà phân phối nước ngoài."},{"w":"proximity","pos":"n","vi":"sự gần gũi về khoảng cách","ex":"We chose this venue because of its proximity to the airport.","exvi":"Chúng tôi chọn địa điểm này vì nó gần sân bay."},{"w":"regulate","pos":"v","vi":"điều chỉnh, kiểm soát, quy định","ex":"Security staff will regulate the flow of visitors into the exhibition hall.","exvi":"Nhân viên an ninh sẽ điều tiết dòng khách vào sảnh triển lãm."},{"w":"site","pos":"n","vi":"địa điểm","ex":"The planning committee visited three possible sites for the annual meeting.","exvi":"Ban kế hoạch đã đi khảo sát ba địa điểm có thể tổ chức hội nghị thường niên."},{"w":"stage","pos":"v","vi":"tổ chức, dàn dựng","ex":"The company will stage a fashion show to introduce its autumn collection.","exvi":"Công ty sẽ tổ chức một buổi trình diễn thời trang để giới thiệu bộ sưu tập mùa thu."}]},{"n":36,"title":{"en":"General Travel","vi":"Du lịch nói chung"},"words":[{"w":"agent","pos":"n","vi":"đại lý, nhân viên đại diện","ex":"Our travel agent found a cheaper flight that leaves two hours earlier.","exvi":"Nhân viên đại lý du lịch của chúng tôi đã tìm được chuyến bay rẻ hơn, khởi hành sớm hơn hai tiếng."},{"w":"announcement","pos":"n","vi":"thông báo","ex":"Passengers should listen carefully for announcements about gate changes.","exvi":"Hành khách nên chú ý lắng nghe các thông báo về việc đổi cổng."},{"w":"beverage","pos":"n","vi":"đồ uống","ex":"Complimentary beverages will be served shortly after takeoff.","exvi":"Đồ uống miễn phí sẽ được phục vụ ngay sau khi cất cánh."},{"w":"blanket","pos":"n","vi":"cái chăn, mền","ex":"The flight attendant offered a blanket and pillow to every passenger on the night flight.","exvi":"Tiếp viên đã phát chăn và gối cho mọi hành khách trên chuyến bay đêm."},{"w":"board","pos":"v","vi":"lên tàu, lên máy bay","ex":"Passengers with small children are invited to board the aircraft first.","exvi":"Hành khách đi cùng trẻ nhỏ được mời lên máy bay trước."},{"w":"claim","pos":"v","vi":"nhận lại; đòi, yêu cầu","ex":"You can claim your luggage at carousel four on the lower level.","exvi":"Quý khách có thể nhận lại hành lý tại băng chuyền số bốn ở tầng dưới."},{"w":"delay","pos":"n, v","vi":"sự chậm trễ; trì hoãn","ex":"Heavy fog delayed our departure by nearly three hours.","exvi":"Sương mù dày đặc đã làm chuyến khởi hành của chúng tôi chậm gần ba tiếng."},{"w":"depart","pos":"v","vi":"khởi hành, rời đi","ex":"The shuttle bus departs from the main terminal every twenty minutes.","exvi":"Xe buýt đưa đón khởi hành từ nhà ga chính hai mươi phút một chuyến."},{"w":"embarkation","pos":"n","vi":"sự lên tàu, lên máy bay","ex":"Please have your passport ready at the embarkation point.","exvi":"Vui lòng chuẩn bị sẵn hộ chiếu tại điểm lên tàu."},{"w":"itinerary","pos":"n","vi":"lịch trình chuyến đi","ex":"The assistant e-mailed the itinerary for next week's business trip to Singapore.","exvi":"Trợ lý đã gửi email lịch trình chuyến công tác Singapore tuần tới."},{"w":"prohibit","pos":"v","vi":"cấm","ex":"Airport regulations prohibit passengers from carrying sharp objects in hand luggage.","exvi":"Quy định sân bay cấm hành khách mang vật sắc nhọn trong hành lý xách tay."},{"w":"valid","pos":"adj","vi":"có hiệu lực, hợp lệ","ex":"Your passport must be valid for at least six months after your arrival date.","exvi":"Hộ chiếu của bạn phải còn hiệu lực ít nhất sáu tháng kể từ ngày nhập cảnh."}]},{"n":37,"title":{"en":"Airlines","vi":"Hãng hàng không"},"words":[{"w":"deal with","pos":"phr","vi":"giải quyết, xử lý","ex":"Ticket agents must deal with frustrated passengers whenever flights are cancelled.","exvi":"Nhân viên bán vé phải xử lý những hành khách bực bội mỗi khi chuyến bay bị hủy."},{"w":"destination","pos":"n","vi":"điểm đến","ex":"The airline added five new destinations in Southeast Asia this year.","exvi":"Hãng hàng không đã mở thêm năm điểm đến mới ở Đông Nam Á trong năm nay."},{"w":"distinguish","pos":"v","vi":"phân biệt, làm nổi bật","ex":"Excellent in-flight service distinguishes this carrier from its low-cost competitors.","exvi":"Dịch vụ trên chuyến bay xuất sắc giúp hãng này khác biệt với các đối thủ giá rẻ."},{"w":"economize","pos":"v","vi":"tiết kiệm","ex":"We can economize by booking our tickets several weeks in advance.","exvi":"Chúng ta có thể tiết kiệm bằng cách đặt vé trước vài tuần."},{"w":"equivalent","pos":"adj","vi":"tương đương","ex":"The airline offered an equivalent seat on the next available flight.","exvi":"Hãng hàng không đã đề nghị một ghế tương đương trên chuyến bay kế tiếp còn chỗ."},{"w":"excursion","pos":"n","vi":"chuyến tham quan, chuyến đi ngắn","ex":"The package includes a one-day excursion to the islands near the coast.","exvi":"Gói dịch vụ bao gồm một chuyến tham quan một ngày tới các hòn đảo gần bờ."},{"w":"expense","pos":"n","vi":"chi phí, khoản chi","ex":"Employees must submit receipts for all travel expenses within two weeks.","exvi":"Nhân viên phải nộp hóa đơn cho mọi chi phí đi lại trong vòng hai tuần."},{"w":"extend","pos":"v","vi":"kéo dài, gia hạn","ex":"Mr. Chen extended his stay in Tokyo to attend an additional meeting.","exvi":"Ông Chen đã kéo dài thời gian lưu lại Tokyo để dự thêm một cuộc họp."},{"w":"prospective","pos":"adj","vi":"tiềm năng, có triển vọng","ex":"The airline sent a discount coupon to prospective customers in the region.","exvi":"Hãng hàng không đã gửi phiếu giảm giá cho các khách hàng tiềm năng trong khu vực."},{"w":"situation","pos":"n","vi":"tình huống, hoàn cảnh","ex":"The gate agent explained the situation and apologized for the long wait.","exvi":"Nhân viên tại cổng đã giải thích tình hình và xin lỗi vì phải chờ lâu."},{"w":"substantially","pos":"adv","vi":"đáng kể","ex":"Fares to Europe have risen substantially since the beginning of the summer.","exvi":"Giá vé đi châu Âu đã tăng đáng kể từ đầu mùa hè."},{"w":"system","pos":"n","vi":"hệ thống","ex":"The new online reservation system allows travelers to change seats at any time.","exvi":"Hệ thống đặt chỗ trực tuyến mới cho phép hành khách đổi ghế bất cứ lúc nào."}]},{"n":38,"title":{"en":"Trains","vi":"Tàu hỏa"},"words":[{"w":"comprehensive","pos":"adj","vi":"toàn diện, bao quát","ex":"The railway's website provides a comprehensive guide to routes and ticket prices.","exvi":"Trang web của ngành đường sắt cung cấp hướng dẫn toàn diện về các tuyến và giá vé."},{"w":"deluxe","pos":"adj","vi":"sang trọng, cao cấp","ex":"We reserved a deluxe sleeping compartment for the overnight journey.","exvi":"Chúng tôi đã đặt một khoang ngủ cao cấp cho chuyến đi qua đêm."},{"w":"directory","pos":"n","vi":"bảng chỉ dẫn, danh bạ","ex":"Check the station directory to find the platform for the express train.","exvi":"Hãy xem bảng chỉ dẫn của nhà ga để tìm sân ga của tàu tốc hành."},{"w":"duration","pos":"n","vi":"khoảng thời gian, thời lượng","ex":"Passengers must keep their tickets for the duration of the trip.","exvi":"Hành khách phải giữ vé trong suốt thời gian chuyến đi."},{"w":"entitle","pos":"v","vi":"cho quyền, cho phép hưởng","ex":"A first-class ticket entitles you to a free meal in the dining car.","exvi":"Vé hạng nhất cho bạn quyền dùng một bữa ăn miễn phí ở toa ăn."},{"w":"fare","pos":"n","vi":"tiền vé, giá vé","ex":"The fare from the capital to the coast is lower on weekdays.","exvi":"Giá vé từ thủ đô ra vùng biển thấp hơn vào ngày thường."},{"w":"offset","pos":"v","vi":"bù đắp, bù lại","ex":"The comfort of the train offsets the slightly longer travel time.","exvi":"Sự thoải mái của tàu hỏa bù lại cho thời gian di chuyển dài hơn một chút."},{"w":"operate","pos":"v","vi":"vận hành, hoạt động","ex":"The high-speed line operates every thirty minutes during peak hours.","exvi":"Tuyến tàu cao tốc hoạt động ba mươi phút một chuyến vào giờ cao điểm."},{"w":"punctually","pos":"adv","vi":"đúng giờ","ex":"The morning commuter train arrives punctually at 7:45 every day.","exvi":"Chuyến tàu buổi sáng cho người đi làm đến đúng 7 giờ 45 mỗi ngày."},{"w":"relatively","pos":"adv","vi":"tương đối","ex":"Train travel is relatively inexpensive compared with flying on this route.","exvi":"Đi tàu tương đối rẻ so với đi máy bay trên tuyến này."},{"w":"remainder","pos":"n","vi":"phần còn lại","ex":"We spent the remainder of the journey reviewing the presentation slides.","exvi":"Chúng tôi dành phần còn lại của chuyến đi để xem lại các trang trình chiếu."},{"w":"remote","pos":"adj","vi":"xa xôi, hẻo lánh","ex":"The new rail line connects several remote villages to the city center.","exvi":"Tuyến đường sắt mới nối một số ngôi làng hẻo lánh với trung tâm thành phố."}]},{"n":39,"title":{"en":"Hotels","vi":"Khách sạn"},"words":[{"w":"advanced","pos":"adj","vi":"tiên tiến, hiện đại","ex":"The hotel uses an advanced booking system that updates room availability instantly.","exvi":"Khách sạn sử dụng hệ thống đặt phòng tiên tiến, cập nhật tình trạng phòng tức thì."},{"w":"chain","pos":"n","vi":"chuỗi (cửa hàng, khách sạn)","ex":"This international hotel chain has more than two hundred properties worldwide.","exvi":"Chuỗi khách sạn quốc tế này có hơn hai trăm cơ sở trên toàn thế giới."},{"w":"check in","pos":"phr","vi":"làm thủ tục nhận phòng","ex":"Guests may check in at the front desk any time after two o'clock.","exvi":"Khách có thể làm thủ tục nhận phòng tại quầy lễ tân bất cứ lúc nào sau hai giờ."},{"w":"confirm","pos":"v","vi":"xác nhận","ex":"The hotel sent an e-mail to confirm our reservation for three nights.","exvi":"Khách sạn đã gửi email xác nhận việc đặt phòng ba đêm của chúng tôi."},{"w":"expect","pos":"v","vi":"mong đợi, dự kiến","ex":"We expect the conference guests to arrive late on Sunday evening.","exvi":"Chúng tôi dự kiến khách dự hội nghị sẽ đến muộn vào tối Chủ nhật."},{"w":"housekeeper","pos":"n","vi":"nhân viên dọn phòng","ex":"The housekeeper replaces the towels and makes the beds every morning.","exvi":"Nhân viên dọn phòng thay khăn tắm và dọn giường mỗi sáng."},{"w":"notify","pos":"v","vi":"thông báo, báo cho biết","ex":"Please notify the front desk if you plan to check out after noon.","exvi":"Vui lòng báo cho quầy lễ tân nếu quý khách định trả phòng sau buổi trưa."},{"w":"preclude","pos":"v","vi":"ngăn cản, loại trừ","ex":"The hotel's full occupancy precluded us from adding two extra nights.","exvi":"Việc khách sạn kín phòng đã khiến chúng tôi không thể ở thêm hai đêm."},{"w":"quote","pos":"n, v","vi":"báo giá; đưa ra giá","ex":"The sales manager quoted a special price for groups of ten or more.","exvi":"Trưởng phòng kinh doanh đã báo mức giá đặc biệt cho đoàn từ mười người trở lên."},{"w":"rate","pos":"n","vi":"mức giá, giá phòng","ex":"The room rate includes breakfast and access to the fitness center.","exvi":"Giá phòng đã bao gồm bữa sáng và quyền sử dụng phòng tập thể dục."},{"w":"reserve","pos":"v","vi":"đặt trước, giữ chỗ","ex":"I would like to reserve a double room for the first week of May.","exvi":"Tôi muốn đặt trước một phòng đôi cho tuần đầu tiên của tháng Năm."},{"w":"service","pos":"n","vi":"dịch vụ, sự phục vụ","ex":"The hotel is known for its fast room service and helpful staff.","exvi":"Khách sạn nổi tiếng với dịch vụ phòng nhanh chóng và nhân viên nhiệt tình."}]},{"n":40,"title":{"en":"Car Rentals","vi":"Thuê xe ô tô"},"words":[{"w":"busy","pos":"adj","vi":"bận rộn, đông khách","ex":"Summer is the busiest season for car rental agencies near the airport.","exvi":"Mùa hè là mùa bận rộn nhất của các công ty cho thuê xe gần sân bay."},{"w":"coincide","pos":"v","vi":"trùng với, xảy ra đồng thời","ex":"Our trip coincided with a national holiday, so few rental cars were available.","exvi":"Chuyến đi của chúng tôi trùng với ngày lễ quốc gia nên còn rất ít xe cho thuê."},{"w":"confusion","pos":"n","vi":"sự nhầm lẫn, lộn xộn","ex":"There was some confusion about which insurance plan was included in the price.","exvi":"Đã có chút nhầm lẫn về việc gói bảo hiểm nào được bao gồm trong giá."},{"w":"contact","pos":"v","vi":"liên hệ, liên lạc","ex":"Contact the rental office immediately if the vehicle breaks down on the road.","exvi":"Hãy liên hệ ngay với văn phòng cho thuê nếu xe bị hỏng trên đường."},{"w":"disappoint","pos":"v","vi":"làm thất vọng","ex":"We were disappointed to learn that the model we had requested was unavailable.","exvi":"Chúng tôi thất vọng khi biết rằng mẫu xe mình yêu cầu đã không còn."},{"w":"intend","pos":"v","vi":"dự định, có ý định","ex":"Do you intend to return the car to the same location on Friday?","exvi":"Bạn có định trả xe tại cùng địa điểm vào thứ Sáu không?"},{"w":"license","pos":"n","vi":"giấy phép, bằng lái","ex":"You must show a valid driver's license and a credit card to rent a vehicle.","exvi":"Bạn phải xuất trình bằng lái xe hợp lệ và thẻ tín dụng để thuê xe."},{"w":"nervously","pos":"adv","vi":"một cách lo lắng, hồi hộp","ex":"The tourist nervously drove the rental car through the crowded city center.","exvi":"Vị du khách lo lắng lái chiếc xe thuê đi qua trung tâm thành phố đông đúc."},{"w":"optional","pos":"adj","vi":"tùy chọn, không bắt buộc","ex":"A navigation device is optional and costs an additional five dollars per day.","exvi":"Thiết bị dẫn đường là tùy chọn và tốn thêm năm đô la mỗi ngày."},{"w":"tempt","pos":"v","vi":"lôi cuốn, cám dỗ","ex":"The low weekend rate tempted us to rent a larger car.","exvi":"Mức giá cuối tuần thấp đã khiến chúng tôi muốn thuê một chiếc xe lớn hơn."},{"w":"thrill","pos":"n","vi":"sự phấn khích, hồi hộp thích thú","ex":"Driving a convertible along the coast was the biggest thrill of our vacation.","exvi":"Lái xe mui trần dọc bờ biển là điều phấn khích nhất trong kỳ nghỉ của chúng tôi."},{"w":"tier","pos":"n","vi":"hạng, bậc, tầng","ex":"The agency offers three pricing tiers based on the size of the vehicle.","exvi":"Công ty cho thuê đưa ra ba hạng giá dựa trên kích cỡ xe."}]},{"n":41,"title":{"en":"Movies","vi":"Phim ảnh"},"words":[{"w":"attain","pos":"v","vi":"đạt được, giành được","ex":"The director attained international fame after her second film won three awards.","exvi":"Nữ đạo diễn đạt được danh tiếng quốc tế sau khi bộ phim thứ hai của cô giành ba giải thưởng."},{"w":"combine","pos":"v","vi":"kết hợp, phối hợp","ex":"The new movie combines live action with computer animation in a creative way.","exvi":"Bộ phim mới kết hợp cảnh quay thật với hoạt hình máy tính một cách sáng tạo."},{"w":"continue","pos":"v","vi":"tiếp tục, kéo dài","ex":"The film festival will continue through Sunday at the downtown cinema.","exvi":"Liên hoan phim sẽ tiếp tục đến hết Chủ nhật tại rạp chiếu ở trung tâm thành phố."},{"w":"description","pos":"n","vi":"sự mô tả, bản miêu tả","ex":"Please read the short description of each movie before you buy tickets online.","exvi":"Vui lòng đọc phần mô tả ngắn của từng bộ phim trước khi mua vé trực tuyến."},{"w":"disperse","pos":"v","vi":"giải tán, phân tán","ex":"The crowd dispersed quickly once the premiere ended and the actors left.","exvi":"Đám đông giải tán nhanh chóng khi buổi công chiếu kết thúc và các diễn viên rời đi."},{"w":"entertainment","pos":"n","vi":"sự giải trí, tiết mục giải trí","ex":"The hotel offers free evening entertainment, including movies shown beside the pool.","exvi":"Khách sạn cung cấp chương trình giải trí buổi tối miễn phí, gồm cả phim chiếu bên hồ bơi."},{"w":"influence","pos":"v, n","vi":"ảnh hưởng, tác động","ex":"Online reviews strongly influence which movies people decide to see on weekends.","exvi":"Các bài đánh giá trên mạng ảnh hưởng mạnh đến việc mọi người chọn xem phim nào vào cuối tuần."},{"w":"range","pos":"n, v","vi":"phạm vi, loại; dao động","ex":"The theater shows a wide range of films, from comedies to documentaries.","exvi":"Rạp chiếu nhiều loại phim đa dạng, từ phim hài đến phim tài liệu."},{"w":"release","pos":"v, n","vi":"phát hành, công chiếu","ex":"The studio plans to release the sequel in over forty countries next March.","exvi":"Hãng phim dự định phát hành phần tiếp theo tại hơn bốn mươi quốc gia vào tháng Ba tới."},{"w":"representation","pos":"n","vi":"sự thể hiện, sự miêu tả","ex":"Critics praised the film's accurate representation of life in a small factory town.","exvi":"Giới phê bình khen ngợi cách bộ phim thể hiện chân thực cuộc sống ở một thị trấn công nghiệp nhỏ."},{"w":"separately","pos":"adv","vi":"riêng rẽ, tách biệt","ex":"Snacks and drinks are sold separately and are not included in the ticket price.","exvi":"Đồ ăn nhẹ và đồ uống được bán riêng, không bao gồm trong giá vé."},{"w":"successive","pos":"adj","vi":"liên tiếp, kế tiếp nhau","ex":"The movie was number one at the box office for five successive weeks.","exvi":"Bộ phim đứng đầu doanh thu phòng vé trong năm tuần liên tiếp."}]},{"n":42,"title":{"en":"Theater","vi":"Sân khấu kịch"},"words":[{"w":"action","pos":"n","vi":"diễn biến, tình tiết vở kịch","ex":"Most of the action in the play takes place in a small hotel lobby.","exvi":"Phần lớn diễn biến của vở kịch xảy ra trong một sảnh khách sạn nhỏ."},{"w":"approach","pos":"v, n","vi":"tiếp cận; cách tiếp cận","ex":"The new director takes a modern approach to this classic play.","exvi":"Vị đạo diễn mới có cách tiếp cận hiện đại đối với vở kịch kinh điển này."},{"w":"audience","pos":"n","vi":"khán giả, người xem","ex":"The audience stood and applauded for several minutes after the final scene.","exvi":"Khán giả đứng dậy vỗ tay suốt vài phút sau cảnh cuối."},{"w":"creative","pos":"adj","vi":"sáng tạo, có óc sáng tạo","ex":"The stage designer found a creative solution to the theater's limited space.","exvi":"Nhà thiết kế sân khấu đã tìm ra giải pháp sáng tạo cho không gian hạn chế của nhà hát."},{"w":"dialogue","pos":"n","vi":"lời thoại, cuộc đối thoại","ex":"The actors practiced the dialogue until every line sounded completely natural.","exvi":"Các diễn viên luyện lời thoại cho đến khi từng câu nghe hoàn toàn tự nhiên."},{"w":"element","pos":"n","vi":"yếu tố, thành phần","ex":"Lighting is an important element in creating the mood of a performance.","exvi":"Ánh sáng là một yếu tố quan trọng tạo nên không khí của buổi diễn."},{"w":"experience","pos":"n, v","vi":"kinh nghiệm, trải nghiệm; trải qua","ex":"The lead actress has ten years of experience performing in musical theater.","exvi":"Nữ diễn viên chính có mười năm kinh nghiệm biểu diễn nhạc kịch."},{"w":"occur","pos":"v","vi":"xảy ra, diễn ra","ex":"A short delay occurred when the stage curtain failed to open on time.","exvi":"Một sự chậm trễ ngắn đã xảy ra khi màn sân khấu không mở đúng giờ."},{"w":"perform","pos":"v","vi":"biểu diễn, trình diễn","ex":"The company will perform the new comedy every evening through the end of June.","exvi":"Đoàn kịch sẽ biểu diễn vở hài kịch mới mỗi tối cho đến cuối tháng Sáu."},{"w":"rehearse","pos":"v","vi":"diễn tập, tập dượt","ex":"The cast rehearsed for six weeks before the play opened to the public.","exvi":"Dàn diễn viên đã tập dượt sáu tuần trước khi vở kịch ra mắt công chúng."},{"w":"review","pos":"n, v","vi":"bài phê bình; đánh giá","ex":"The play received excellent reviews in all of the major city newspapers.","exvi":"Vở kịch nhận được những bài phê bình xuất sắc trên tất cả các tờ báo lớn của thành phố."},{"w":"sold out","pos":"adj","vi":"đã bán hết vé","ex":"Saturday's show is sold out, but seats are still available for Sunday afternoon.","exvi":"Suất diễn thứ Bảy đã bán hết vé, nhưng chiều Chủ nhật vẫn còn chỗ."}]},{"n":43,"title":{"en":"Music","vi":"Âm nhạc"},"words":[{"w":"available","pos":"adj","vi":"có sẵn, có thể mua được","ex":"Tickets for the jazz concert are available at the box office and online.","exvi":"Vé buổi hòa nhạc jazz có bán tại quầy vé và trên mạng."},{"w":"broaden","pos":"v","vi":"mở rộng, nới rộng","ex":"Listening to music from other countries can broaden your understanding of their cultures.","exvi":"Nghe nhạc của các nước khác có thể mở rộng hiểu biết của bạn về văn hóa của họ."},{"w":"category","pos":"n","vi":"loại, hạng mục, thể loại","ex":"The store organizes its recordings by category, such as classical, rock, and jazz.","exvi":"Cửa hàng sắp xếp các bản thu theo thể loại như cổ điển, rock và jazz."},{"w":"disparate","pos":"adj","vi":"khác hẳn nhau, khác biệt","ex":"The band mixes disparate styles, including folk songs and electronic dance music.","exvi":"Ban nhạc pha trộn những phong cách khác hẳn nhau, gồm cả dân ca và nhạc dance điện tử."},{"w":"divide","pos":"v","vi":"chia, phân chia","ex":"The concert was divided into two parts with a twenty-minute break between them.","exvi":"Buổi hòa nhạc được chia làm hai phần với hai mươi phút nghỉ giữa giờ."},{"w":"favor","pos":"v, n","vi":"ưa thích hơn; sự ưu ái","ex":"Younger customers tend to favor streaming services over buying albums.","exvi":"Khách hàng trẻ có xu hướng ưa thích dịch vụ nghe trực tuyến hơn là mua album."},{"w":"instinct","pos":"n","vi":"bản năng, năng khiếu tự nhiên","ex":"The young pianist has a natural instinct for rhythm and timing.","exvi":"Nghệ sĩ dương cầm trẻ có năng khiếu bẩm sinh về tiết tấu và nhịp điệu."},{"w":"preference","pos":"n","vi":"sở thích, sự ưa chuộng hơn","ex":"The survey asked employees about their music preferences for the company party.","exvi":"Cuộc khảo sát hỏi nhân viên về sở thích âm nhạc của họ cho bữa tiệc công ty."},{"w":"reason","pos":"n","vi":"lý do, nguyên nhân","ex":"The main reason for the concert's success was the excellent sound system.","exvi":"Lý do chính cho thành công của buổi hòa nhạc là hệ thống âm thanh tuyệt vời."},{"w":"relaxation","pos":"n","vi":"sự thư giãn, nghỉ ngơi","ex":"Many office workers listen to soft music for relaxation after a busy day.","exvi":"Nhiều nhân viên văn phòng nghe nhạc nhẹ để thư giãn sau một ngày bận rộn."},{"w":"taste","pos":"n","vi":"thị hiếu, gu thưởng thức","ex":"The radio station plays songs that suit the taste of older listeners.","exvi":"Đài phát thanh phát những bài hát hợp với thị hiếu của thính giả lớn tuổi."},{"w":"urge","pos":"v, n","vi":"thúc giục, cố thuyết phục","ex":"The manager urged the singer to record a new album before the tour.","exvi":"Người quản lý thúc giục ca sĩ thu âm album mới trước chuyến lưu diễn."}]},{"n":44,"title":{"en":"Museums","vi":"Bảo tàng"},"words":[{"w":"acquire","pos":"v","vi":"mua được, có được, thu nhận","ex":"The museum recently acquired two rare paintings from a private collector.","exvi":"Bảo tàng vừa mua được hai bức tranh quý hiếm từ một nhà sưu tập tư nhân."},{"w":"admire","pos":"v","vi":"ngưỡng mộ, chiêm ngưỡng","ex":"Visitors stopped to admire the large sculpture in the main entrance hall.","exvi":"Du khách dừng lại để chiêm ngưỡng bức tượng lớn ở sảnh chính."},{"w":"collection","pos":"n","vi":"bộ sưu tập","ex":"The gallery's collection of modern photography is the largest in the region.","exvi":"Bộ sưu tập nhiếp ảnh hiện đại của phòng trưng bày là lớn nhất trong khu vực."},{"w":"criticism","pos":"n","vi":"sự phê bình, lời chỉ trích","ex":"The exhibit received some criticism for its high admission fee.","exvi":"Cuộc triển lãm nhận một số lời chỉ trích vì phí vào cửa cao."},{"w":"express","pos":"v","vi":"bày tỏ, diễn đạt, thể hiện","ex":"The artist uses bright colors to express feelings of joy and hope.","exvi":"Người họa sĩ dùng màu sắc tươi sáng để thể hiện niềm vui và hy vọng."},{"w":"fashion","pos":"n","vi":"thời trang, mốt, kiểu cách","ex":"The special exhibition shows how fashion changed during the last century.","exvi":"Triển lãm đặc biệt cho thấy thời trang đã thay đổi thế nào trong thế kỷ qua."},{"w":"leisure","pos":"n","vi":"thời gian rảnh rỗi, lúc thư nhàn","ex":"She spends most of her leisure time visiting art galleries and museums.","exvi":"Cô ấy dành phần lớn thời gian rảnh để đi thăm các phòng tranh và bảo tàng."},{"w":"respond","pos":"v","vi":"phản hồi, đáp lại","ex":"The public responded enthusiastically to the museum's new evening hours.","exvi":"Công chúng phản hồi nhiệt tình với giờ mở cửa buổi tối mới của bảo tàng."},{"w":"schedule","pos":"n, v","vi":"lịch trình; lên lịch","ex":"The guided tour is scheduled to begin at ten o'clock every morning.","exvi":"Chuyến tham quan có hướng dẫn được lên lịch bắt đầu lúc mười giờ mỗi sáng."},{"w":"significant","pos":"adj","vi":"quan trọng, đáng kể","ex":"The donation made a significant difference to the museum's education program.","exvi":"Khoản quyên góp đã tạo ra khác biệt đáng kể cho chương trình giáo dục của bảo tàng."},{"w":"specialize","pos":"v","vi":"chuyên về, chuyên môn hóa","ex":"This small museum specializes in ceramics from the fifteenth century.","exvi":"Bảo tàng nhỏ này chuyên về đồ gốm từ thế kỷ mười lăm."},{"w":"spectrum","pos":"n","vi":"dải, phạm vi rộng","ex":"The exhibit covers a broad spectrum of styles from traditional to abstract.","exvi":"Cuộc triển lãm bao quát một dải phong cách rộng từ truyền thống đến trừu tượng."}]},{"n":45,"title":{"en":"Media","vi":"Truyền thông"},"words":[{"w":"assignment","pos":"n","vi":"nhiệm vụ, công việc được giao","ex":"The reporter's first assignment was to cover the opening of the new airport.","exvi":"Nhiệm vụ đầu tiên của phóng viên là đưa tin về lễ khai trương sân bay mới."},{"w":"choose","pos":"v","vi":"chọn, lựa chọn","ex":"The editor chose the photograph that best illustrated the front-page story.","exvi":"Biên tập viên đã chọn bức ảnh minh họa tốt nhất cho bài trên trang nhất."},{"w":"constantly","pos":"adv","vi":"liên tục, luôn luôn","ex":"The news website is constantly updated with reports from around the world.","exvi":"Trang tin được cập nhật liên tục với các bản tin từ khắp thế giới."},{"w":"constitute","pos":"v","vi":"cấu thành, tạo thành","ex":"Advertising revenue constitutes more than half of the newspaper's total income.","exvi":"Doanh thu quảng cáo chiếm hơn một nửa tổng thu nhập của tờ báo."},{"w":"decision","pos":"n","vi":"quyết định, sự phán quyết","ex":"The publisher's decision to stop the print edition surprised many readers.","exvi":"Quyết định ngừng bản in của nhà xuất bản khiến nhiều độc giả bất ngờ."},{"w":"disseminate","pos":"v","vi":"phổ biến, truyền bá thông tin","ex":"Social media allows companies to disseminate news to customers within minutes.","exvi":"Mạng xã hội cho phép các công ty phổ biến tin tức tới khách hàng chỉ trong vài phút."},{"w":"impact","pos":"n","vi":"tác động, ảnh hưởng mạnh","ex":"The article had a strong impact on public opinion about the new tax.","exvi":"Bài báo có tác động mạnh đến dư luận về loại thuế mới."},{"w":"in-depth","pos":"adj","vi":"chuyên sâu, kỹ lưỡng","ex":"The magazine published an in-depth report on the local housing market.","exvi":"Tạp chí đã đăng một phóng sự chuyên sâu về thị trường nhà ở địa phương."},{"w":"investigate","pos":"v","vi":"điều tra, tìm hiểu kỹ","ex":"Two journalists were sent to investigate complaints about the construction project.","exvi":"Hai nhà báo được cử đi điều tra các khiếu nại về i":"phần, khoản được chia","ex":"The employer pays a large portion of each worker's monthly premium.","exvi":"Người sử dụng lao động trả một phần lớn phí bảo hiểm hằng tháng của mỗi nhân viên."},{"w":"regardless","pos":"adv","vi":"bất kể, không phân biệt","ex":"Every employee receives the same coverage regardless of age or position.","exvi":"Mọi nhân viên đều được hưởng mức bảo hiểm như nhau bất kể tuổi tác hay chức vụ."},{"w":"salary","pos":"n","vi":"tiền lương, lương tháng","ex":"The insurance contribution is deducted automatically from your monthly salary.","exvi":"Khoản đóng bảo hiểm được trừ tự động vào lương tháng của bạn."},{"w":"suit","pos":"v","vi":"phù hợp, thích hợp với","ex":"We offer three different plans, so you can pick one that suits your family.","exvi":"Chúng tôi có ba gói khác nhau để bạn chọn gói phù hợp với gia đình mình."}]},{"n":49,"title":{"en":"Hospitals","vi":"Bệnh viện"},"words":[{"w":"admit","pos":"v","vi":"cho nhập viện, nhận vào","ex":"The patient was admitted to the hospital on Monday for minor surgery.","exvi":"Bệnh nhân được cho nhập viện vào thứ Hai để làm tiểu phẫu."},{"w":"authorize","pos":"v","vi":"cho phép, ủy quyền, phê duyệt","ex":"Your insurance company must authorize the procedure before it can be scheduled.","exvi":"Công ty bảo hiểm của bạn phải phê duyệt thủ thuật trước khi được xếp lịch."},{"w":"designate","pos":"v","vi":"chỉ định, quy định","ex":"Visitors should park only in the areas designated for hospital guests.","exvi":"Khách thăm chỉ nên đỗ xe ở những khu vực được quy định dành cho khách của bệnh viện."},{"w":"escort","pos":"n, v","vi":"người hộ tống; đưa đi","ex":"A volunteer will escort you from the front desk to the X-ray department.","exvi":"Một tình nguyện viên sẽ đưa bạn từ quầy lễ tân đến khoa X-quang."},{"w":"identify","pos":"v","vi":"xác định, nhận dạng","ex":"Each patient wears a wristband so that nurses can identify them easily.","exvi":"Mỗi bệnh nhân đeo một vòng tay để y tá có thể nhận dạng dễ dàng."},{"w":"mission","pos":"n","vi":"sứ mệnh, nhiệm vụ","ex":"The hospital's mission is to provide quality care to everyone in the community.","exvi":"Sứ mệnh của bệnh viện là mang lại dịch vụ chăm sóc chất lượng cho mọi người trong cộng đồng."},{"w":"permit","pos":"v, n","vi":"cho phép; giấy phép","ex":"Only two visitors at a time are permitted in the intensive care unit.","exvi":"Mỗi lần chỉ cho phép hai người thăm vào khu chăm sóc đặc biệt."},{"w":"pertinent","pos":"adj","vi":"có liên quan, thích đáng","ex":"Please bring all pertinent medical documents with you on the day of admission.","exvi":"Vui lòng mang theo mọi giấy tờ y tế có liên quan vào ngày nhập viện."},{"w":"procedure","pos":"n","vi":"thủ thuật; quy trình","ex":"The surgeon explained the procedure and answered all of the family's questions.","exvi":"Bác sĩ phẫu thuật đã giải thích về thủ thuật và trả lời mọi câu hỏi của gia đình."},{"w":"result","pos":"n","vi":"kết quả","ex":"The laboratory will send the test results to your doctor within two days.","exvi":"Phòng xét nghiệm sẽ gửi kết quả cho bác sĩ của bạn trong vòng hai ngày."},{"w":"statement","pos":"n","vi":"bản kê chi phí, bản sao kê","ex":"The hospital mailed a detailed statement listing every charge from her stay.","exvi":"Bệnh viện đã gửi qua bưu điện bản kê chi tiết liệt kê mọi khoản phí trong đợt nằm viện của cô ấy."},{"w":"usually","pos":"adv","vi":"thường thường, thông thường","ex":"Patients usually go home the day after this type of operation.","exvi":"Bệnh nhân thường về nhà một ngày sau loại phẫu thuật này."}]},{"n":50,"title":{"en":"Pharmacy","vi":"Nhà thuốc"},"words":[{"w":"consult","pos":"v","vi":"hỏi ý kiến, tham khảo","ex":"Consult your pharmacist before taking this medicine with other drugs.","exvi":"Hãy hỏi ý kiến dược sĩ trước khi dùng thuốc này cùng các thuốc khác."},{"w":"control","pos":"v, n","vi":"kiểm soát, điều khiển","ex":"This medication helps control blood sugar levels when taken with meals.","exvi":"Thuốc này giúp kiểm soát lượng đường trong máu khi uống cùng bữa ăn."},{"w":"convenient","pos":"adj","vi":"thuận tiện, tiện lợi","ex":"The pharmacy's late opening hours are convenient for people who work all day.","exvi":"Giờ mở cửa muộn của nhà thuốc rất thuận tiện cho những người đi làm cả ngày."},{"w":"detect","pos":"v","vi":"phát hiện, dò ra","ex":"The pharmacist detected an error in the dosage written on the prescription.","exvi":"Dược sĩ đã phát hiện một lỗi về liều lượng ghi trên đơn thuốc."},{"w":"factor","pos":"n","vi":"yếu tố, nhân tố","ex":"Age and weight are important factors in deciding the correct dose.","exvi":"Tuổi và cân nặng là những yếu tố quan trọng để quyết định liều dùng đúng."},{"w":"interaction","pos":"n","vi":"sự tương tác (thuốc)","ex":"The label warns about possible interactions between this drug and alcohol.","exvi":"Nhãn thuốc cảnh báo về khả năng tương tác giữa thuốc này và rượu."},{"w":"limit","pos":"n, v","vi":"giới hạn; hạn chế","ex":"There is a limit of two boxes per customer for this cold medicine.","exvi":"Mỗi khách hàng chỉ được mua tối đa hai hộp thuốc cảm này."},{"w":"monitor","pos":"v","vi":"theo dõi, giám sát","ex":"The doctor will monitor your progress closely during the first month of treatment.","exvi":"Bác sĩ sẽ theo dõi sát tiến triển của bạn trong tháng điều trị đầu tiên."},{"w":"potential","pos":"adj, n","vi":"tiềm ẩn, có thể xảy ra","ex":"The pharmacist explained the potential side effects of the new prescription.","exvi":"Dược sĩ đã giải thích các tác dụng phụ tiềm ẩn của đơn thuốc mới."},{"w":"sample","pos":"n","vi":"mẫu thử, hàng mẫu","ex":"The clinic gave her a free sample of the cream to try at home.","exvi":"Phòng khám tặng cô ấy một mẫu kem dùng thử miễn phí để thử tại nhà."},{"w":"sense","pos":"n","vi":"sự hợp lý; cảm giác","ex":"It makes sense to buy a three-month supply if you take the medicine daily.","exvi":"Mua đủ thuốc dùng trong ba tháng là hợp lý nếu bạn uống thuốc hằng ngày."},{"w":"volunteer","pos":"n, v","vi":"tình nguyện viên; tình nguyện","ex":"Several volunteers agreed to take part in the trial of the new vaccine.","exvi":"Một số tình nguyện viên đã đồng ý tham gia đợt thử nghiệm vắc-xin mới."}]}],"phr":[{"n":1,"en":"Greetings & introductions","vi":"Chào hỏi & giới thiệu bản thân","items":[{"en":"Nice to meet you. I'm Thu, a QA engineer at VDS.","vi":"Rất vui được gặp anh/chị. Tôi là Thu, kỹ sư kiểm thử ở VDS.","note":"Dùng khi gặp lần đầu. Đáp lại: Nice to meet you too.","lv":"n"},{"en":"Hi, how's it going?","vi":"Chào, dạo này thế nào?","note":"Chào thân mật. Đáp tự nhiên: Pretty good, thanks. You? Tránh câu sách vở 'I'm fine, thank you. And you?'.","lv":"i"},{"en":"Good morning, everyone.","vi":"Chào buổi sáng mọi người.","note":"Mở đầu ngày làm việc hoặc cuộc họp buổi sáng. Sau 12h dùng Good afternoon.","lv":"n"},{"en":"Let me introduce myself. I'm Thu from the QA team.","vi":"Cho phép tôi tự giới thiệu. Tôi là Thu ở nhóm QA.","note":"Dùng trong họp hoặc gặp đối tác. Nói 'from the QA team', không nói 'of the QA team'.","lv":"f"},{"en":"I work as a software tester on the lending team.","vi":"Tôi làm kiểm thử phần mềm ở nhóm cho vay.","note":"Cấu trúc: work as + nghề. Lỗi hay gặp: 'I am work as...' (thừa am).","lv":"n"},{"en":"I've been with the company for about three years.","vi":"Tôi làm ở công ty được khoảng ba năm rồi.","note":"Dùng hiện tại hoàn thành vì vẫn đang làm. Không nói 'I work here since three years'.","lv":"n"},{"en":"I'm in charge of testing the loan app.","vi":"Tôi phụ trách kiểm thử ứng dụng vay.","note":"in charge of + V-ing/danh từ. Có thể nói: I'm responsible for testing...","lv":"n"},{"en":"So, what do you do?","vi":"Vậy anh/chị làm nghề gì?","note":"Cách hỏi nghề nghiệp tự nhiên. 'What is your job?' nghe cứng và hơi thẳng.","lv":"i"},{"en":"Which team are you on?","vi":"Anh/chị ở nhóm nào?","note":"Người Mỹ nói 'on a team'; người Anh hay nói 'in a team'. Cả hai đều đúng.","lv":"n"},{"en":"This is my colleague, Minh. He's a backend developer.","vi":"Đây là đồng nghiệp của tôi, Minh. Anh ấy là lập trình viên backend.","note":"Giới thiệu người khác dùng 'This is...', không dùng 'He is Minh'.","lv":"n"},{"en":"I don't think we've met. I'm Thu.","vi":"Hình như mình chưa gặp nhau. Tôi là Thu.","note":"Cách chủ động làm quen rất tự nhiên ở văn phòng hoặc sự kiện.","lv":"n"},{"en":"It's a pleasure to meet you.","vi":"Rất hân hạnh được gặp anh/chị.","note":"Trang trọng hơn 'Nice to meet you'; hợp khi gặp sếp lớn hoặc khách hàng.","lv":"f"},{"en":"Long time no see! How have you been?","vi":"Lâu quá không gặp! Dạo này bạn thế nào?","note":"Dùng với người quen lâu ngày mới gặp lại. 'How have you been' hỏi về cả khoảng thời gian qua.","lv":"i"},{"en":"Please just call me Thu.","vi":"Cứ gọi tôi là Thu nhé.","note":"Dùng khi người khác gọi bạn quá trang trọng (Ms. Thu) hoặc đọc sai tên.","lv":"n"},{"en":"I mainly focus on API and mobile testing.","vi":"Tôi chủ yếu tập trung kiểm thử API và ứng dụng di động.","note":"focus on + danh từ/V-ing. Đừng quên giới từ 'on'.","lv":"n"},{"en":"I'm new here, so I'm still learning the ropes.","vi":"Tôi mới vào nên vẫn đang làm quen công việc.","note":"'learn the ropes' = học cách làm việc ở chỗ mới. Thành ngữ rất phổ biến.","lv":"i"},{"en":"Hey, good to see you again!","vi":"Ê, gặp lại bạn vui quá!","note":"Dùng với người đã gặp rồi. Gặp lần đầu dùng 'meet', gặp lại dùng 'see'.","lv":"i"},{"en":"Have you two met before?","vi":"Hai người đã gặp nhau trước đây chưa?","note":"Hỏi trước khi giới thiệu hai người với nhau.","lv":"n"}],"dlg":[{"s":"A","en":"Hi, I don't think we've met. I'm Thu.","vi":"Chào anh, hình như mình chưa gặp nhau. Em là Thu."},{"s":"B","en":"Nice to meet you, Thu. I'm Nam. I just joined last week.","vi":"Rất vui được gặp em, Thu. Anh là Nam. Anh mới vào tuần trước."},{"s":"A","en":"Nice to meet you too. Which team are you on?","vi":"Em cũng rất vui được gặp anh. Anh ở nhóm nào ạ?"},{"s":"B","en":"I'm on the payments team. I'm still learning the ropes. So, what do you do?","vi":"Anh ở nhóm thanh toán. Anh vẫn đang làm quen. Còn em làm gì?"},{"s":"A","en":"I work as a software tester on the lending team. I mainly focus on API testing.","vi":"Em làm kiểm thử phần mềm ở nhóm cho vay. Em chủ yếu kiểm thử API."},{"s":"B","en":"Great! We'll probably work together on the disbursement flow.","vi":"Hay quá! Chắc mình sẽ làm chung luồng giải ngân đấy."},{"s":"A","en":"Sounds good. Let me know if you have any questions.","vi":"Được ạ. Có gì thắc mắc anh cứ báo em nhé."}]},{"n":2,"en":"Small talk","vi":"Nói chuyện phiếm","items":[{"en":"How was your weekend?","vi":"Cuối tuần của bạn thế nào?","note":"Câu mở chuyện phổ biến nhất sáng thứ Hai. Đáp: It was great, thanks. How about yours?","lv":"n"},{"en":"Did you do anything fun over the weekend?","vi":"Cuối tuần bạn có làm gì vui không?","note":"Thân mật hơn 'How was your weekend?'. Dùng 'over the weekend' hoặc 'on the weekend'.","lv":"i"},{"en":"It's really hot today, isn't it?","vi":"Hôm nay nóng thật, nhỉ?","note":"Câu hỏi đuôi để bắt chuyện, người nghe chỉ cần đồng ý: Yeah, it's boiling!","lv":"n"},{"en":"It looks like it's going to rain.","vi":"Trông như sắp mưa rồi.","note":"Dùng 'be going to' khi có dấu hiệu rõ ràng (mây đen). Không nói 'It will rain' trong trường hợp này.","lv":"n"},{"en":"What do you usually do in your free time?","vi":"Lúc rảnh bạn thường làm gì?","note":"Tự nhiên hơn 'What is your hobby?', câu đó nghe như sách giáo khoa.","lv":"n"},{"en":"I'm really into hiking these days.","vi":"Dạo này tôi rất mê leo núi.","note":"'be into' + danh từ/V-ing = thích, mê. Rất phổ biến khi nói chuyện thân mật.","lv":"i"},{"en":"Any plans for the holiday?","vi":"Kỳ nghỉ có kế hoạch gì chưa?","note":"Dạng rút gọn của 'Do you have any plans...'. Rất tự nhiên trước dịp lễ.","lv":"i"},{"en":"How's your family doing?","vi":"Gia đình bạn dạo này thế nào?","note":"Hỏi thăm người đã quen. Đáp: They're doing well, thanks for asking.","lv":"n"},{"en":"I heard you just got back from Da Nang. How was it?","vi":"Nghe nói bạn vừa đi Đà Nẵng về. Thế nào?","note":"'get back from' = trở về từ. Cách tốt để thể hiện bạn quan tâm đồng nghiệp.","lv":"n"},{"en":"The traffic was terrible this morning.","vi":"Sáng nay tắc đường kinh khủng.","note":"Chủ đề than thở chung, dễ bắt chuyện. 'traffic' không đếm được, không nói 'a traffic'.","lv":"n"},{"en":"Have you tried the new coffee shop downstairs?","vi":"Bạn thử quán cà phê mới dưới tầng chưa?","note":"Hiện tại hoàn thành để hỏi trải nghiệm. Có thể rủ thêm: Want to grab a coffee?","lv":"n"},{"en":"Busy week so far?","vi":"Tuần này bận không?","note":"Rút gọn của 'Have you had a busy week so far?'. Hợp khi gặp ở pantry, thang máy.","lv":"i"},{"en":"I can't believe it's Friday already!","vi":"Không tin nổi đã thứ Sáu rồi!","note":"Câu cảm thán vui vẻ cuối tuần. Ngược lại: This week is dragging on.","lv":"i"},{"en":"Have you seen any good movies lately?","vi":"Gần đây bạn có xem phim nào hay không?","note":"'lately/recently' đi với hiện tại hoàn thành, không dùng quá khứ đơn.","lv":"n"},{"en":"How are things going with your project?","vi":"Dự án của bạn tiến triển thế nào rồi?","note":"Hỏi thăm công việc nhẹ nhàng. Đáp: So far, so good. hoặc It's a bit hectic.","lv":"n"},{"en":"That sounds like fun!","vi":"Nghe vui đấy!","note":"'sounds like' + danh từ (fun, a plan); 'sounds' + tính từ (great). Lỗi hay gặp: 'That sounds like great'.","lv":"i"},{"en":"I'm looking forward to the weekend.","vi":"Tôi mong tới cuối tuần quá.","note":"'look forward to' + danh từ/V-ing. Lỗi hay gặp: 'look forward to see' (phải là seeing).","lv":"n"},{"en":"Are you originally from Hanoi?","vi":"Bạn quê gốc ở Hà Nội à?","note":"'originally' hỏi quê gốc, lịch sự hơn 'Where is your hometown?'.","lv":"n"}],"dlg":[{"s":"A","en":"Morning, Lan! How was your weekend?","vi":"Chào buổi sáng Lan! Cuối tuần thế nào?"},{"s":"B","en":"It was great, thanks. I went hiking in Ba Vi. How about yours?","vi":"Tuyệt lắm, cảm ơn chị. Em đi leo núi Ba Vì. Còn chị?"},{"s":"A","e
