n":"That sounds like fun! I just stayed home and relaxed.","vi":"Nghe vui đấy! Chị chỉ ở nhà nghỉ ngơi thôi."},{"s":"B","en":"Nice. The traffic was terrible this morning, wasn't it?","vi":"Cũng hay. Sáng nay tắc đường kinh khủng chị nhỉ?"},{"s":"A","en":"Yeah, and it looks like it's going to rain later.","vi":"Ừ, mà trông như lát nữa sắp mưa nữa."},{"s":"B","en":"Ugh. Anyway, how are things going with your project?","vi":"Chán thật. À mà dự án của chị tiến triển thế nào rồi?"},{"s":"A","en":"So far, so good. I'm just looking forward to the release next week.","vi":"Đến giờ vẫn ổn. Chị chỉ mong đến đợt phát hành tuần sau thôi."}]},{"n":3,"en":"Asking for clarification & checking understanding","vi":"Hỏi lại & xác nhận đã hiểu","items":[{"en":"Sorry, could you say that again?","vi":"Xin lỗi, anh/chị nói lại được không?","note":"Lịch sự hơn 'What?'. Người bản xứ hay nói ngắn: Sorry? hoặc Sorry, come again?","lv":"n"},{"en":"Could you speak a little more slowly, please?","vi":"Anh/chị nói chậm hơn một chút được không ạ?","note":"Hoàn toàn bình thường khi học tiếng Anh; người nghe sẽ không phật ý.","lv":"f"},{"en":"Sorry, I didn't catch that.","vi":"Xin lỗi, tôi chưa nghe rõ.","note":"'catch' ở đây = nghe kịp. Tự nhiên hơn 'I don't hear you'.","lv":"n"},{"en":"What do you mean by 'edge case'?","vi":"'Edge case' ý anh/chị là gì?","note":"Hỏi nghĩa một từ cụ thể. Không nói 'What is the meaning of...' trong hội thoại.","lv":"n"},{"en":"Could you give me an example?","vi":"Anh/chị cho tôi một ví dụ được không?","note":"Cách hay để hiểu yêu cầu mơ hồ, nhất là khi BA mô tả nghiệp vụ.","lv":"n"},{"en":"Just to make sure I understand, you want me to retest it today?","vi":"Để chắc là tôi hiểu đúng, anh/chị muốn tôi test lại hôm nay à?","note":"Xác nhận lại trước khi làm, tránh hiểu sai yêu cầu.","lv":"n"},{"en":"So, if I understand correctly, the bug only happens on Android?","vi":"Vậy nếu tôi hiểu đúng thì lỗi chỉ xảy ra trên Android?","note":"Diễn đạt lại ý người khác để kiểm tra. Có thể thay bằng: So you're saying...","lv":"n"},{"en":"Let me repeat that back to make sure I've got it right.","vi":"Để tôi nhắc lại cho chắc là tôi hiểu đúng.","note":"Dùng sau khi nhận hướng dẫn nhiều bước, ví dụ cách dựng dữ liệu test.","lv":"n"},{"en":"Does that make sense?","vi":"Như vậy có dễ hiểu không?","note":"Hỏi người khác có hiểu không. 'Do you understand?' nghe như giáo viên hỏi, dễ gây khó chịu.","lv":"n"},{"en":"Is that clear, or should I explain it another way?","vi":"Vậy rõ chưa, hay tôi giải thích theo cách khác nhé?","note":"Lịch sự, cho người nghe cơ hội hỏi lại mà không ngại.","lv":"n"},{"en":"Sorry, I'm not following. Could you go over that part again?","vi":"Xin lỗi, tôi chưa theo kịp. Anh/chị nói lại phần đó được không?","note":"'I'm not following' = tôi chưa theo kịp ý. 'go over' = trình bày lại.","lv":"n"},{"en":"Could you spell that for me, please?","vi":"Anh/chị đánh vần giúp tôi được không?","note":"Hữu ích khi nghe tên người, email, mã lỗi qua điện thoại.","lv":"f"},{"en":"Are you saying the API should return an error here?","vi":"Ý anh/chị là API phải trả lỗi ở đây à?","note":"Kiểm tra lại ý chính. Giọng nhẹ nhàng, không nên nghe như đang bắt bẻ.","lv":"n"},{"en":"Can you clarify what 'done' means for this ticket?","vi":"Anh/chị làm rõ giúp 'xong' nghĩa là gì với ticket này không?","note":"'clarify' + điều cần làm rõ, không cần 'about'. Hay dùng khi chốt tiêu chí nghiệm thu.","lv":"n"},{"en":"Sorry, which environment do you mean, staging or production?","vi":"Xin lỗi, ý anh/chị là môi trường nào, staging hay production?","note":"Đưa sẵn lựa chọn giúp người kia trả lời nhanh, tránh hiểu nhầm.","lv":"n"},{"en":"Could you put that in writing, please?","vi":"Anh/chị ghi lại bằng văn bản giúp tôi được không?","note":"Nhờ gửi qua email/chat để có bằng chứng và tránh quên. Lịch sự, không bị coi là nghi ngờ.","lv":"f"},{"en":"Got it, thanks.","vi":"Hiểu rồi, cảm ơn.","note":"Xác nhận đã hiểu, rất phổ biến khi chat. Trang trọng hơn: Understood, thank you.","lv":"i"},{"en":"Sorry, you're breaking up. Can you hear me?","vi":"Xin lỗi, tiếng anh/chị bị ngắt quãng. Anh/chị nghe tôi không?","note":"'breaking up' = âm thanh chập chờn khi gọi online. Hay gặp trong họp Teams/Zoom.","lv":"n"}],"dlg":[{"s":"A","en":"For this ticket, please check the callback with an invalid status.","vi":"Với ticket này, em kiểm tra callback với trạng thái không hợp lệ nhé."},{"s":"B","en":"Sorry, I didn't catch that. Could you say that again?","vi":"Xin lỗi, em chưa nghe rõ. Anh nói lại được không ạ?"},{"s":"A","en":"Sure. Send the callback with a status that isn't on the list.","vi":"Được. Gửi callback với một trạng thái không có trong danh sách."},{"s":"B","en":"Could you give me an example?","vi":"Anh cho em ví dụ được không ạ?"},{"s":"A","en":"For example, send 'DISBURSE_FAIL' instead of 'CANCELLED'. Does that make sense?","vi":"Ví dụ gửi 'DISBURSE_FAIL' thay vì 'CANCELLED'. Vậy dễ hiểu chưa?"},{"s":"B","en":"Yes. So, if I understand correctly, the API should return an error?","vi":"Rồi ạ. Vậy nếu em hiểu đúng thì API phải trả lỗi đúng không?"},{"s":"A","en":"Exactly. I'll put that in the ticket too.","vi":"Chính xác. Anh sẽ ghi vào ticket luôn."},{"s":"B","en":"Got it, thanks.","vi":"Em hiểu rồi, cảm ơn anh."}]},{"n":4,"en":"Thanking, apologizing & responding","vi":"Cảm ơn, xin lỗi & đáp lời","items":[{"en":"Thanks a lot for your help.","vi":"Cảm ơn bạn nhiều vì đã giúp.","note":"'Thanks for + danh từ/V-ing'. Không nói 'Thanks for help me'.","lv":"n"},{"en":"I really appreciate it.","vi":"Tôi thật sự rất cảm kích.","note":"'appreciate' luôn cần tân ngữ (it, your help). Không nói 'I really appreciate.'","lv":"n"},{"en":"Thank you for your quick response.","vi":"Cảm ơn anh/chị đã phản hồi nhanh.","note":"Rất hay dùng trong email công việc, đặt ở đầu thư.","lv":"f"},{"en":"You're very welcome.","vi":"Không có gì.","note":"Đáp lời cảm ơn chuẩn mực. Tránh lặp lại mãi, có thể đổi sang 'Sure!' hoặc 'Anytime.'","lv":"n"},{"en":"No problem at all.","vi":"Không vấn đề gì đâu.","note":"Đáp lời cảm ơn hoặc nhờ vả nhỏ, thân thiện hơn 'You're welcome'.","lv":"i"},{"en":"Don't mention it.","vi":"Có gì đâu mà.","note":"Đáp lời cảm ơn, ý là việc nhỏ không đáng nhắc. Hơi kiểu Anh, vẫn rất phổ biến.","lv":"i"},{"en":"Happy to help!","vi":"Rất vui được giúp!","note":"Đáp lời cảm ơn thân thiện, hay dùng khi chat. Dạng đầy đủ: I'm happy to help.","lv":"i"},{"en":"Sorry, my mistake.","vi":"Xin lỗi, lỗi của tôi.","note":"Nhận lỗi nhỏ nhanh gọn, ví dụ gửi nhầm file. Có thể nói: My bad (rất thân mật).","lv":"i"},{"en":"Sorry for the late reply.","vi":"Xin lỗi vì trả lời muộn.","note":"Dùng đầu email/tin nhắn. 'Sorry for + danh từ/V-ing'. Không nói 'Sorry for reply late'.","lv":"n"},{"en":"Sorry I'm late. The traffic was crazy.","vi":"Xin lỗi tôi đến muộn. Đường tắc kinh khủng.","note":"Xin lỗi kèm lý do ngắn. Đừng giải thích quá dài, người nghe chỉ cần biết sơ qua.","lv":"i"},{"en":"I apologize for the inconvenience.","vi":"Tôi xin lỗi vì sự bất tiện này.","note":"Rất trang trọng, hợp với email gửi khách hàng/đối tác. Giao tiếp thường nói 'Sorry about that'.","lv":"f"},{"en":"That's okay, it happens.","vi":"Không sao đâu, chuyện thường mà.","note":"Đáp lại lời xin lỗi, giúp người kia bớt áy náy.","lv":"i"},{"en":"No worries at all.","vi":"Đừng lo / Không sao.","note":"Dùng đáp cả lời cảm ơn lẫn xin lỗi. Rất phổ biến ở Úc, Anh, Mỹ.","lv":"i"},{"en":"Thanks for letting me know.","vi":"Cảm ơn đã báo cho tôi.","note":"Đáp khi ai đó thông báo tin, kể cả tin xấu như môi trường test bị sập.","lv":"n"},{"en":"Sorry to bother you, but do you have a minute?","vi":"Xin lỗi làm phiền, anh/chị có rảnh một phút không?","note":"Mở lời lịch sự trước khi nhờ hoặc hỏi. Cũng có thể nói: Sorry to interrupt.","lv":"n"},{"en":"I'm sorry, I completely missed your message.","vi":"Xin lỗi, tôi hoàn toàn không để ý tin nhắn của bạn.","note":"'miss a message' = bỏ lỡ/không thấy tin nhắn. Nên kèm hành động: I'll check it now.","lv":"n"},{"en":"Well, thanks anyway.","vi":"Dù sao cũng cảm ơn.","note":"Dùng khi người kia đã cố giúp nhưng không giúp được. Không dùng khi họ đã giúp thành công.","lv":"n"},{"en":"Sorry about that. I'll fix it right away.","vi":"Xin lỗi nhé. Tôi sẽ sửa ngay.","note":"Xin lỗi kèm cam kết hành động, rất chuyên nghiệp khi bị phát hiện sai sót.","lv":"n"}],"dlg":[{"s":"A","en":"Hi Minh, sorry to bother you, but do you have a minute?","vi":"Chào Minh, xin lỗi làm phiền, anh có rảnh một phút không?"},{"s":"B","en":"Sure. What's up?","vi":"Được chứ. Có chuyện gì thế?"},{"s":"A","en":"The test data you sent me has the wrong phone numbers.","vi":"Dữ liệu test anh gửi em bị sai số điện thoại."},{"s":"B","en":"Oh, sorry about that. My mistake. I'll fix it right away.","vi":"Ồ, xin lỗi nhé. Lỗi của anh. Anh sửa ngay."},{"s":"A","en":"No worries. Thanks for your quick response.","vi":"Không sao đâu. Cảm ơn anh phản hồi nhanh."},{"s":"B","en":"Here's the new file. Sorry again for the trouble.","vi":"Đây là file mới. Một lần nữa xin lỗi đã làm phiền em."},{"s":"A","en":"That's okay, it happens. I really appreciate it.","vi":"Không sao, chuyện thường mà. Em cảm ơn anh nhiều."},{"s":"B","en":"Happy to help!","vi":"Rất vui được giúp!"}]},{"n":5,"en":"Polite requests & offers","vi":"Nhờ vả & đề nghị giúp đỡ lịch sự","items":[{"en":"Could you help me with this?","vi":"Anh/chị giúp tôi việc này được không?","note":"'help someone with something'. Lịch sự hơn 'Help me!'.","lv":"n"},{"en":"Would you mind reviewing my test cases?","vi":"Anh/chị có phiền xem giúp test case của tôi không?","note":"'mind' + V-ing. Đồng ý thì đáp 'No, not at all' (không phiền), đừng đáp 'Yes'.","lv":"f"},{"en":"Do you have time for a quick call?","vi":"Anh/chị có thời gian gọi nhanh một chút không?","note":"Hỏi trước khi gọi đột ngột, rất phổ biến khi làm việc từ xa.","lv":"n"},{"en":"Can you send me the API document?","vi":"Bạn gửi tôi tài liệu API được không?","note":"'Can you' thân mật hơn 'Could you'. Dùng với đồng nghiệp ngang hàng.","lv":"i"},{"en":"Could you please check the logs on staging?","vi":"Anh/chị kiểm tra giúp log trên staging được không?","note":"Đặt 'please' sau chủ ngữ hoặc cuối câu. Không nói 'Please could you...' quá nhiều.","lv":"n"},{"en":"Would it be possible to extend the deadline to Friday?","vi":"Có thể lùi hạn chót đến thứ Sáu được không?","note":"Rất lịch sự, hợp khi xin sếp/khách hàng điều gì khó. Tránh 'I want more time'.","lv":"f"},{"en":"I was wondering if you could help me set up the test data.","vi":"Không biết anh/chị có thể giúp tôi chuẩn bị dữ liệu test không.","note":"Cách nhờ rất mềm mỏng. Dùng thì quá khứ để lịch sự, nghĩa vẫn là hiện tại.","lv":"f"},{"en":"Can I ask you a quick question?","vi":"Cho tôi hỏi nhanh một câu được không?","note":"Mở lời trước khi hỏi. 'quick' cho người nghe biết sẽ không mất nhiều thời gian.","lv":"n"},{"en":"Let me know if you need anything.","vi":"Cần gì cứ báo tôi nhé.","note":"Đề nghị giúp chung chung, thường đặt cuối email/tin nhắn.","lv":"n"},{"en":"Do you want me to help you with that?","vi":"Bạn có muốn tôi giúp việc đó không?","note":"Đề nghị giúp thân mật. Dạng trang trọng: Would you like me to...?","lv":"i"},{"en":"Would you like me to share my screen?","vi":"Anh/chị có muốn tôi chia sẻ màn hình không?","note":"'Would you like me to' + động từ nguyên mẫu = đề nghị làm gì cho người khác.","lv":"f"},{"en":"I can take care of the regression test if you want.","vi":"Nếu bạn muốn, tôi có thể lo phần kiểm thử hồi quy.","note":"'take care of' = đảm nhận, lo liệu. Cách nhận việc chủ động, chuyên nghiệp.","lv":"n"},{"en":"Shall I book a meeting room?","vi":"Để tôi đặt phòng họp nhé?","note":"'Shall I...?' = đề nghị làm gì đó. Phổ biến ở Anh; người Mỹ hay nói 'Should I...?'.","lv":"f"},{"en":"Could you give me access to the test environment?","vi":"Anh/chị cấp quyền truy cập môi trường test cho tôi được không?","note":"'give access to' + nơi/hệ thống. Không nói 'access into'.","lv":"n"},{"en":"Can you do me a favor?","vi":"Bạn giúp tôi một việc được không?","note":"Thân mật, dùng với người quen. Lỗi hay gặp: 'make me a favor' (sai, phải là do).","lv":"i"},{"en":"Is there anything I can do to help?","vi":"Tôi có thể giúp gì không?","note":"Đề nghị giúp khi thấy đồng nghiệp đang gặp khó khăn hoặc quá tải.","lv":"n"},{"en":"Sure, go ahead.","vi":"Được, cứ tự nhiên.","note":"Đồng ý khi ai đó xin phép hỏi/làm gì. Ví dụ đáp 'Can I ask you something?'.","lv":"i"},{"en":"Sorry, I'm a bit busy right now. Can we talk later?","vi":"Xin lỗi, giờ tôi hơi bận. Lát mình nói chuyện được không?","note":"Từ chối khéo kèm đề xuất khác, không bị coi là bất lịch sự.","lv":"n"}],"dlg":[{"s":"A","en":"Hi Hoa, can I ask you a quick question?","vi":"Chào Hoa, cho chị hỏi nhanh một câu được không?"},{"s":"B","en":"Sure, go ahead.","vi":"Được ạ, chị cứ hỏi."},{"s":"A","en":"I was wondering if you could help me set up the test data for the new loan flow.","vi":"Không biết em có thể giúp chị chuẩn bị dữ liệu test cho luồng vay mới không."},{"s":"B","en":"No problem. Could you give me access to the test environment first?","vi":"Không vấn đề gì. Chị cấp quyền môi trường test cho em trước được không?"},{"s":"A","en":"Of course. I'll do it now. Would you like me to share my screen?","vi":"Tất nhiên. Chị làm ngay. Em có muốn chị chia sẻ màn hình không?"},{"s":"B","en":"Yes, please. That would be great.","vi":"Vâng ạ. Thế thì tốt quá."},{"s":"A","en":"Thanks. Let me know if you need anything else.","vi":"Cảm ơn em. Cần gì thêm cứ báo chị nhé."}]},{"n":6,"en":"Opinions, agreeing & disagreeing politely","vi":"Nêu ý kiến, đồng ý & phản đối lịch sự","items":[{"en":"I think we should test this on more devices.","vi":"Tôi nghĩ chúng ta nên test cái này trên nhiều thiết bị hơn.","note":"'I think we should...' là cách đề xuất nhẹ nhàng, không áp đặt.","lv":"n"},{"en":"In my opinion, the deadline is too tight.","vi":"Theo tôi, hạn chót quá gấp.","note":"Không nói 'According to me' hay 'In my opinion, I think' (thừa ý).","lv":"f"},{"en":"I totally agree with you.","vi":"Tôi hoàn toàn đồng ý với bạn.","note":"'agree' là động từ. Lỗi rất phổ biến: 'I am agree' (sai).","lv":"i"},{"en":"That's a good point.","vi":"Ý đó hay đấy.","note":"Ghi nhận ý người khác trước khi bổ sung hoặc phản biện, rất lịch sự.","lv":"n"},{"en":"I see what you mean, but I'm not sure it will work.","vi":"Tôi hiểu ý bạn, nhưng tôi không chắc cách đó hiệu quả.","note":"Công thức phản đối mềm: công nhận trước, rồi 'but' + quan điểm của mình.","lv":"n"},{"en":"I'm afraid I don't agree with that.","vi":"Tôi e là tôi không đồng ý với điều đó.","note":"'I'm afraid' làm nhẹ lời phản đối. Tránh nói thẳng 'You're wrong'.","lv":"f"},{"en":"You're absolutely right.","vi":"Bạn hoàn toàn đúng.","note":"Đồng ý mạnh. Có thể nói ngắn: Absolutely! hoặc Definitely!","lv":"n"},{"en":"I see it a bit differently.","vi":"Tôi thấy hơi khác một chút.","note":"Cách phản đối rất khéo, mở đường để trình bày quan điểm riêng.","lv":"n"},{"en":"What do you think about this approach?","vi":"Bạn nghĩ sao về cách làm này?","note":"Dùng 'What do you think', không dùng 'How do you think' (lỗi phổ biến của người Việt).","lv":"n"},{"en":"Exactly! That's what I was thinking.","vi":"Chính xác! Tôi cũng đang nghĩ vậy.","note":"Đồng ý nhiệt tình, hay dùng khi họp nhóm thân mật.","lv":"i"},{"en":"I'm not so sure about that.","vi":"Tôi không chắc lắm về điều đó.","note":"Phản đối nhẹ nhàng, gián tiếp. Nên kèm lý do sau đó.","lv":"n"},{"en":"It might be better to fix the critical bugs first.","vi":"Có lẽ nên sửa các lỗi nghiêm trọng trước thì hơn.","note":"'It might be better to...' đưa ý kiến khác mà không phủ nhận ý người khác.","lv":"n"},{"en":"Personally, I prefer manual testing for this feature.","vi":"Cá nhân tôi thích kiểm thử thủ công cho tính năng này hơn.","note":"'Personally' nhấn mạnh đây là ý kiến riêng. 'prefer A to B', không nói 'prefer A than B'.","lv":"n"},{"en":"That makes sense to me.","vi":"Tôi thấy vậy là hợp lý.","note":"Đồng ý vì thấy logic. Không nói 'That makes sense with me'.","lv":"n"},{"en":"I agree up to a point.","vi":"Tôi đồng ý ở một mức độ nào đó.","note":"Đồng ý một phần, sau đó thường có 'but...'. Có thể nói: I partly agree.","lv":"f"},{"en":"Have you considered the risk of releasing on Friday?","vi":"Bạn đã tính đến rủi ro khi phát hành vào thứ Sáu chưa?","note":"Phản biện bằng câu hỏi, khéo hơn nói thẳng 'That's a bad idea'.","lv":"n"},{"en":"Okay, fair enough.","vi":"Cũng hợp lý.","note":"Chấp nhận lý lẽ của người khác dù lúc đầu chưa đồng ý. Rất tự nhiên trong hội thoại.","lv":"i"},{"en":"How do you feel about moving the release to next week?","vi":"Bạn thấy sao nếu dời đợt phát hành sang tuần sau?","note":"'How do you feel about' + V-ing/danh từ: hỏi ý kiến mềm mỏng. Đây dùng 'How' là đúng.","lv":"n"}],"dlg":[{"s":"A","en":"What do you think about releasing the new version on Friday?","vi":"Chị nghĩ sao về việc phát hành bản mới vào thứ Sáu?"},{"s":"B","en":"I see what you mean, but I'm not sure it's a good idea.","vi":"Chị hiểu ý em, nhưng chị không chắc đó là ý hay."},{"s":"A","en":"Why not? Most of the tests have passed.","vi":"Sao vậy ạ? Phần lớn test đã pass rồi mà."},{"s":"B","en":"That's a good point. But we still have two critical bugs open.","vi":"Ý đó đúng. Nhưng mình vẫn còn hai lỗi nghiêm trọng chưa đóng."},{"s":"A","en":"Hmm, fair enough. It might be better to fix them first.","vi":"Ừm, cũng hợp lý. Có lẽ nên sửa chúng trước thì hơn."},{"s":"B","en":"Exactly! How do you feel about moving the release to Tuesday?","vi":"Chính xác! Em thấy sao nếu dời phát hành sang thứ Ba?"},{"s":"A","en":"That makes sense to me. I totally agree.","vi":"Em thấy hợp lý. Em hoàn toàn đồng ý."}]},{"n":7,"en":"Meetings","vi":"Cuộc họp","items":[{"en":"Shall we get started?","vi":"Chúng ta bắt đầu nhé?","note":"Câu mở đầu họp phổ biến nhất. Thân mật hơn: Okay, let's get started.","lv":"n"},{"en":"Thanks, everyone, for joining today.","vi":"Cảm ơn mọi người đã tham gia hôm nay.","note":"Nói ngay đầu buổi họp. Họp online cũng dùng y hệt.","lv":"n"},{"en":"The purpose of today's meeting is to review the test results.","vi":"Mục đích của cuộc họp hôm nay là xem lại kết quả kiểm thử.","note":"Nêu mục tiêu rõ ràng ngay từ đầu, giúp cuộc họp đi đúng hướng.","lv":"f"},{"en":"Let's go through the agenda first.","vi":"Chúng ta lướt qua chương trình họp trước nhé.","note":"'go through' = xem lần lượt từng mục. 'agenda' = chương trình họp.","lv":"n"},{"en":"Sorry to interrupt, but can I add something?","vi":"Xin lỗi ngắt lời, cho tôi bổ sung một chút được không?","note":"Ngắt lời lịch sự. Nên đợi người kia ngừng một nhịp rồi mới nói.","lv":"n"},{"en":"Can I just jump in here?","vi":"Cho tôi chen vào một chút nhé?","note":"'jump in' = chen vào nói. Thân mật hơn 'Sorry to interrupt'.","lv":"i"},{"en":"Could you hold that thought for a moment?","vi":"Anh/chị giữ ý đó lại một chút được không?","note":"Lịch sự xin người khác tạm dừng ý để bàn sau, khi đang lạc đề.","lv":"n"},{"en":"Let's get back to the main topic.","vi":"Chúng ta quay lại chủ đề chính nhé.","note":"Kéo cuộc họp về đúng hướng khi mọi người bàn lan man.","lv":"n"},{"en":"Does anyone have any questions?","vi":"Mọi người có câu hỏi gì không?","note":"'anyone' đi với động từ số ít: Does anyone have, không phải 'Do anyone have'.","lv":"n"},{"en":"To sum up, we have three critical bugs to fix before release.","vi":"Tóm lại, chúng ta có ba lỗi nghiêm trọng cần sửa trước khi phát hành.","note":"'To sum up' = tóm lại. Thay thế: So, to recap... hoặc In short...","lv":"n"},{"en":"So, let's go over the next steps.","vi":"Vậy, chúng ta điểm lại các bước tiếp theo nhé.","note":"Dùng gần cuối họp để chốt ai làm gì. 'next steps' luôn ở số nhiều.","lv":"n"},{"en":"Who's going to take care of this?","vi":"Ai sẽ phụ trách việc này?","note":"Chốt người chịu trách nhiệm cho từng việc. Có thể hỏi: Who owns this?","lv":"n"},{"en":"Let's take this offline.","vi":"Việc này mình bàn riêng sau nhé.","note":"Nghĩa là bàn riêng sau cuộc họp, không phải 'ngắt mạng'. Rất hay dùng ở công ty.","lv":"i"},{"en":"I think we're running out of time.","vi":"Tôi nghĩ chúng ta sắp hết giờ rồi.","note":"'run out of time' = sắp hết thời gian. Nhắc khéo để kết thúc đúng giờ.","lv":"n"},{"en":"I'll send out the meeting notes after this.","vi":"Sau buổi này tôi sẽ gửi biên bản họp.","note":"Cũng có thể nói 'meeting minutes' (trang trọng hơn). 'send out' = gửi cho nhiều người.","lv":"n"},{"en":"Can everyone see my screen?","vi":"Mọi người có thấy màn hình của tôi không?","note":"Hỏi ngay sau khi chia sẻ màn hình trong họp online.","lv":"n"},{"en":"Before we finish, does anyone have anything else to add?","vi":"Trước khi kết thúc, có ai muốn bổ sung gì không?","note":"Câu hỏi cuối trước khi đóng họp. 'anything else' = điều gì khác nữa.","lv":"n"},{"en":"I think that's everything for today. Thanks, everyone.","vi":"Tôi nghĩ hôm nay đến đây là đủ. Cảm ơn mọi người.","note":"Kết thúc họp lịch sự. Thân mật hơn: Let's wrap it up here.","lv":"n"}],"dlg":[{"s":"A","en":"Okay, shall we get started? Thanks, everyone, for joining today.","vi":"Được rồi, chúng ta bắt đầu nhé? Cảm ơn mọi người đã tham gia hôm nay."},{"s":"A","en":"The purpose of today's meeting is to review the test results for Sprint 12.","vi":"Mục đích cuộc họp hôm nay là xem lại kết quả kiểm thử của Sprint 12."},{"s":"B","en":"Sorry to interrupt, but can I add something about the payment bug?","vi":"Xin lỗi ngắt lời, cho em bổ sung chút về lỗi thanh toán được không?"},{"s":"A","en":"Sure, but could you hold that thought for a moment? Let's finish the summary first.","vi":"Được, nhưng em giữ ý đó lại một chút nhé? Mình tóm tắt xong đã."},{"s":"A","en":"To sum up, we have three critical bugs to fix before release.","vi":"Tóm lại, chúng ta có ba lỗi nghiêm trọng cần sửa trước khi phát hành."},{"s":"B","en":"Who's going to take care of the payment bug?","vi":"Ai sẽ phụ trách lỗi thanh toán ạ?"},{"s":"A","en":"Minh will. I think we're running out of time, so let's take the details offline.","vi":"Minh sẽ làm. Chị nghĩ mình sắp hết giờ, nên chi tiết mình bàn riêng sau nhé."},{"s":"A","en":"I'll send out the meeting notes after this. Thanks, everyone.","vi":"Sau buổi này chị sẽ gửi biên bản họp. Cảm ơn mọi người."}]},{"n":8,"en":"Phone calls & online meetings","vi":"Gọi điện & họp online","items":[{"en":"Can you hear me okay?","vi":"Anh/chị nghe tôi rõ không?","note":"Câu mở đầu quen thuộc khi họp online. Đừng nói 'Do you hear me?' nghe cộc và hơi gắt.","lv":"n"},{"en":"Sorry, you're breaking up. Could you say that again?","vi":"Xin lỗi, tiếng anh/chị bị ngắt quãng. Anh/chị nói lại được không?","note":"Dùng khi mạng chập chờn. Tránh nói 'Your voice is broken'.","lv":"n"},{"en":"I think you're on mute.","vi":"Hình như anh/chị đang tắt mic.","note":"Cũng có thể nói 'You're muted.' Thêm 'I think' cho nhẹ nhàng, lịch sự hơn.","lv":"n"},{"en":"Sorry, I was on mute.","vi":"Xin lỗi, nãy tôi tắt mic.","note":"Câu cực phổ biến khi quên bật mic. Không cần giải thích thêm.","lv":"i"},{"en":"Let me share my screen.","vi":"Để tôi chia sẻ màn hình nhé.","note":"Dùng 'share my screen', không nói 'share the screen for you' hay 'open my screen'.","lv":"n"},{"en":"Can everyone see my screen?","vi":"Mọi người có thấy màn hình của tôi không?","note":"Hỏi ngay sau khi share để chắc chắn mọi người xem được.","lv":"n"},{"en":"Could you make the text a bit bigger?","vi":"Anh/chị phóng to chữ lên một chút được không?","note":"Có thể nói 'Could you zoom in a bit?' khi người khác share màn hình.","lv":"n"},{"en":"Sorry, I lost connection for a second. What did I miss?","vi":"Xin lỗi, tôi vừa bị mất kết nối một chút. Tôi bỏ lỡ gì không?","note":"Dùng 'lost connection' hoặc 'got disconnected'. Tránh 'my internet is broken'.","lv":"i"},{"en":"My internet is a bit unstable today, so I'll turn off my camera.","vi":"Mạng hôm nay hơi chập chờn nên tôi sẽ tắt camera.","note":"Dùng 'turn off/turn on' cho camera, mic. Không nói 'close my camera' hay 'open my camera'.","lv":"n"},{"en":"Let's wait a couple more minutes for the others to join.","vi":"Mình đợi thêm vài phút cho mọi người vào nhé.","note":"'A couple more minutes' tự nhiên hơn 'two minutes more'.","lv":"n"},{"en":"Shall we get started?","vi":"Mình bắt đầu nhé?","note":"Câu mở cuộc họp lịch sự. Thân mật hơn: 'Let's get started.'","lv":"n"},{"en":"Sorry to interrupt, but could I add something here?","vi":"Xin lỗi cắt ngang, tôi bổ sung một ý được không?","note":"Cách xen vào lịch sự. Tránh nói 'Wait, wait!' trong họp với khách hàng.","lv":"f"},{"en":"Could you repeat the last part, please?","vi":"Anh/chị nhắc lại phần cuối giúp tôi được không?","note":"Chỉ rõ phần muốn nghe lại thay vì nói chung chung 'Again, please'.","lv":"n"},{"en":"Could you speak a little more slowly, please?","vi":"Anh/chị nói chậm hơn một chút được không ạ?","note":"Hoàn toàn bình thường khi nói với người bản xứ. Lỗi hay gặp: 'speak more slow'.","lv":"f"},{"en":"I'll drop the link in the chat.","vi":"Tôi sẽ gửi link vào khung chat.","note":"'Drop' nghĩa là gửi nhanh. Trang trọng hơn: 'I'll post the link in the chat.'","lv":"i"},{"en":"Hi, this is Thu from the QA team. Is now a good time to talk?","vi":"Chào anh/chị, tôi là Thu bên QA. Giờ anh/chị nói chuyện được không?","note":"Gọi điện dùng 'This is...', không dùng 'I am...'. Hỏi xem người kia có rảnh không.","lv":"f"},{"en":"I have to jump to another meeting, so I'll drop off now.","vi":"Tôi phải sang cuộc họp khác nên xin rời trước nhé.","note":"'Jump to', 'drop off' là cách nói tự nhiên khi rời họp online sớm.","lv":"i"},{"en":"Thanks, everyone. I'll send out the meeting notes later today.","vi":"Cảm ơn mọi người. Chiều nay tôi sẽ gửi biên bản họp.","note":"Câu kết họp phổ biến. 'Meeting notes' hoặc 'minutes' (trang trọng hơn).","lv":"n"}],"dlg":[{"s":"A","en":"Hi Nam, can you hear me okay?","vi":"Chào Nam, anh nghe em rõ không?"},{"s":"B","en":"Yes, loud and clear. Shall we get started?","vi":"Có, rõ lắm. Mình bắt đầu nhé?"},{"s":"A","en":"Sure. Let me share my screen. Can you see it?","vi":"Vâng. Để em chia sẻ màn hình. Anh thấy không?"},{"s":"B","en":"Yes, but could you make the text a bit bigger?","vi":"Thấy rồi, nhưng em phóng to chữ lên chút được không?"},{"s":"A","en":"Of course. Is that better?","vi":"Dạ được. Thế này ổn hơn chưa ạ?"},{"s":"B","en":"Much better. Sorry, you're breaking up. Could you say that again?","vi":"Tốt hơn nhiều. Xin lỗi, tiếng em bị ngắt quãng. Em nói lại được không?"},{"s":"A","en":"Sorry, my internet is unstable, so I'll turn off my camera.","vi":"Xin lỗi anh, mạng em chập chờn nên em tắt camera nhé."},{"s":"B","en":"No problem. I can hear you clearly now.","vi":"Không sao. Giờ anh nghe rõ rồi."}]},{"n":9,"en":"Work emails & chat messages","vi":"Email & tin nhắn công việc","items":[{"en":"I hope you're doing well.","vi":"Hy vọng anh/chị vẫn khỏe.","note":"Câu mở đầu email thân thiện. Trang trọng hơn: 'I hope this email finds you well.'","lv":"f"},{"en":"I'm writing to follow up on the bug report I sent yesterday.","vi":"Tôi viết email để hỏi tiếp về báo cáo lỗi tôi gửi hôm qua.","note":"'Follow up on' = hỏi lại tiến độ việc đã gửi. Nhớ có giới từ 'on'.","lv":"f"},{"en":"Just a quick reminder that the test report is due tomorrow.","vi":"Nhắc nhẹ là báo cáo test phải nộp vào ngày mai.","note":"'Just a quick reminder' giúp lời nhắc nhẹ nhàng, không gây áp lực.","lv":"n"},{"en":"Please find the test report attached.","vi":"Báo cáo test được đính kèm trong email này.","note":"Câu trang trọng khi đính kèm. Tự nhiên hơn: 'I've attached the test report.'","lv":"f"},{"en":"I've attached the screenshots for your reference.","vi":"Tôi đã đính kèm ảnh chụp màn hình để anh/chị tham khảo.","note":"'For your reference' = để tham khảo. Không nói 'for you reference'.","lv":"n"},{"en":"Sorry, I forgot to attach the file. Here it is.","vi":"Xin lỗi, tôi quên đính kèm file. Đây ạ.","note":"Câu gửi lại khi quên file. Ngắn gọn, không cần xin lỗi dài dòng.","lv":"i"},{"en":"Could you please take a look when you have a moment?","vi":"Khi nào rảnh anh/chị xem giúp tôi nhé?","note":"Nhờ xem lịch sự, không gây áp lực. Thân mật: 'when you get a chance'.","lv":"n"},{"en":"Just checking in on this. Any updates?","vi":"Tôi hỏi thăm việc này chút. Có cập nhật gì chưa ạ?","note":"Dùng trên chat để nhắc việc nhẹ nhàng. Tránh 'Why no reply?' nghe trách móc.","lv":"i"},{"en":"Thanks for getting back to me so quickly.","vi":"Cảm ơn anh/chị đã phản hồi nhanh.","note":"'Get back to someone' = phản hồi lại. Rất hay dùng trong email công việc.","lv":"n"},{"en":"Sorry for the late reply.","vi":"Xin lỗi vì trả lời muộn.","note":"Lỗi hay gặp: 'Sorry for reply late'. Đúng: 'Sorry for the late reply' hoặc 'Sorry for replying late'.","lv":"n"},{"en":"Could you confirm whether this is the expected behavior?","vi":"Anh/chị xác nhận giúp đây có phải hành vi mong muốn không?","note":"Dùng 'whether' sau confirm. 'Expected behavior' là cụm chuẩn khi hỏi dev/BA.","lv":"f"},{"en":"I've added Nam to this thread for visibility.","vi":"Tôi đã thêm Nam vào luồng email này để nắm thông tin.","note":"'For visibility' = để người đó biết, không cần hành động. Hay dùng khi CC thêm người.","lv":"n"},{"en":"Quick question: is the staging server down right now?","vi":"Hỏi nhanh chút: server staging đang sập à?","note":"Mở đầu tin nhắn chat tự nhiên. Tránh 'I have a question want to ask'.","lv":"i"},{"en":"Noted, thanks! I'll update the test cases accordingly.","vi":"Đã nắm, cảm ơn! Tôi sẽ cập nhật test case theo đó.","note":"'Noted' dùng trên chat được, nhưng với sếp nên thêm 'thanks' cho lịch sự.","lv":"i"},{"en":"I'll get back to you by the end of the day.","vi":"Cuối ngày tôi sẽ phản hồi anh/chị.","note":"Viết tắt trên chat: 'by EOD'. Hứa thời điểm cụ thể giúp tạo tin tưởng.","lv":"n"},{"en":"Let me know if you have any questions.","vi":"Có câu hỏi gì anh/chị cứ cho tôi biết nhé.","note":"Câu kết email phổ biến nhất. Không nói 'If you have any question, please contact me' (thiếu s).","lv":"n"},{"en":"Looking forward to hearing from you.","vi":"Mong sớm nhận được phản hồi của anh/chị.","note":"Sau 'look forward to' dùng V-ing. Lỗi hay gặp: 'looking forward to hear from you'.","lv":"f"},{"en":"Have a great weekend!","vi":"Chúc anh/chị cuối tuần vui vẻ!","note":"Kết tin nhắn chiều thứ Sáu. Thân thiện, dùng được với cả đồng nghiệp nước ngoài.","lv":"i"}],"dlg":[{"s":"A","en":"Hi Linh, quick question: is the staging server down right now?","vi":"Chào Linh, hỏi nhanh chút: server staging đang sập à?"},{"s":"B","en":"Sorry for the late reply. It's back up now.","vi":"Xin lỗi trả lời muộn. Giờ chạy lại rồi."},{"s":"A","en":"Thanks! By the way, I've attached the screenshots of the login bug for your reference.","vi":"Cảm ơn! Nhân tiện, mình đã đính kèm ảnh chụp lỗi đăng nhập để bạn tham khảo."},{"s":"B","en":"Got it. Could you confirm which build you tested on?","vi":"Mình nhận rồi. Bạn xác nhận giúp đã test trên build nào nhé?"},{"s":"A","en":"Build 2.3.1. Could you take a look when you have a moment?","vi":"Build 2.3.1. Khi nào rảnh bạn xem giúp nhé?"},{"s":"B","en":"Sure. I'll get back to you by the end of the day.","vi":"Được. Cuối ngày mình phản hồi nhé."},{"s":"A","en":"Noted, thanks! Let me know if you have any questions.","vi":"Ok, cảm ơn! Có gì thắc mắc cứ báo mình nhé."}]},{"n":10,"en":"Daily stand-up & progress updates","vi":"Họp daily & cập nhật tiến độ","items":[{"en":"Yesterday, I finished testing the login feature.","vi":"Hôm qua tôi đã test xong chức năng đăng nhập.","note":"Dùng thì quá khứ đơn cho việc hôm qua. Lỗi hay gặp: 'Yesterday I finish...'.","lv":"n"},{"en":"Today, I'm going to start on the payment flow.","vi":"Hôm nay tôi sẽ bắt đầu test luồng thanh toán.","note":"'Start on something' = bắt tay vào làm. Cũng có thể nói 'I'll be working on...'.","lv":"n"},{"en":"I'm still working on the test cases for the new API.","vi":"Tôi vẫn đang viết test case cho API mới.","note":"Dùng hiện tại tiếp diễn cho việc đang làm dở.","lv":"n"},{"en":"I'm about 70% done with the regression tests.","vi":"Tôi đã xong khoảng 70% phần test hồi quy.","note":"'Done with' = xong phần việc. Đọc là 'seventy percent'.","lv":"n"},{"en":"I don't have any blockers right now.","vi":"Hiện tại tôi không bị vướng gì.","note":"Ngắn gọn hơn: 'No blockers for me.' Blocker = việc làm mình không tiến hành được.","lv":"n"},{"en":"I'm currently blocked by the staging environment being down.","vi":"Tôi đang bị chặn vì môi trường staging bị sập.","note":"'Blocked by' + nguyên nhân. Nêu rõ nguyên nhân để team hỗ trợ nhanh.","lv":"n"},{"en":"I ran into an issue with the test data yesterday.","vi":"Hôm qua tôi gặp vấn đề với dữ liệu test.","note":"'Run into' = gặp phải (bất ngờ). Tự nhiên hơn 'I met a problem'.","lv":"n"},{"en":"I'm waiting on the dev team to fix the critical bug.","vi":"Tôi đang chờ team dev sửa lỗi nghiêm trọng.","note":"'Waiting on' rất phổ biến trong công việc, nghĩa giống 'waiting for'.","lv":"n"},{"en":"I need some help from someone on the backend team.","vi":"Tôi cần người bên backend hỗ trợ một chút.","note":"Nói rõ cần ai giúp. Sau daily nên nhắn trực tiếp người đó.","lv":"n"},{"en":"I'm a bit behind schedule on this task.","vi":"Tôi đang hơi chậm tiến độ việc này.","note":"Thêm 'a bit' cho nhẹ. Nên kèm lý do và ngày dự kiến hoàn thành.","lv":"n"},{"en":"I should be able to finish it by Thursday.","vi":"Chắc thứ Năm là tôi xong.","note":"'By Thursday' = trước hoặc đúng thứ Năm. Không nhầm với 'until Thursday'.","lv":"n"},{"en":"I'll need one more day to finish the retest.","vi":"Tôi cần thêm một ngày để test lại xong.","note":"Tránh 'I need more one day'. Đúng: 'one more day' hoặc 'an extra day'.","lv":"n"},{"en":"I logged five new bugs yesterday, two of them high priority.","vi":"Hôm qua tôi log 5 lỗi mới, trong đó 2 lỗi ưu tiên cao.","note":"'Log a bug' = ghi nhận lỗi lên Jira. Cũng nói 'raise' hoặc 'file a bug'.","lv":"n"},{"en":"Everything is on track for the release on Friday.","vi":"Mọi thứ đang đúng tiến độ cho bản phát hành thứ Sáu.","note":"'On track' = đúng kế hoạch. Ngược lại: 'off track' hoặc 'at risk'.","lv":"n"},{"en":"Quick update: the hotfix has passed retest.","vi":"Cập nhật nhanh: bản hotfix đã qua test lại.","note":"Dùng trên chat hoặc đầu daily. 'Passed retest' ngắn gọn, đúng ngữ cảnh QA.","lv":"i"},{"en":"Let's take this offline after the stand-up.","vi":"Việc này mình bàn riêng sau buổi daily nhé.","note":"'Take it offline' = bàn riêng sau, không phải ngắt mạng. Giúp daily ngắn gọn.","lv":"n"},{"en":"Could we sync up after this to go over the test plan?","vi":"Sau buổi này mình trao đổi nhanh để xem lại test plan được không?","note":"'Sync up' = trao đổi nhanh cho thống nhất. 'Go over' = xem lại, rà soát.","lv":"i"},{"en":"That's all from me.","vi":"Phần của tôi chỉ có vậy.","note":"Câu kết lượt nói trong daily. Có thể nói 'That's it for me.'","lv":"i"}],"dlg":[{"s":"A","en":"Thu, could you give us your update?","vi":"Thu, em cập nhật tình hình nhé?"},{"s":"B","en":"Sure. Yesterday, I finished testing the login feature and logged three new bugs.","vi":"Vâng. Hôm qua em test xong chức năng đăng nhập và log 3 lỗi mới."},{"s":"B","en":"Today, I'm going to start on the payment flow.","vi":"Hôm nay em sẽ bắt đầu test luồng thanh toán."},{"s":"A","en":"Any blockers?","vi":"Có vướng gì không?"},{"s":"B","en":"Yes, I'm currently blocked by the staging environment being down.","vi":"Có ạ, em đang bị chặn vì staging bị sập."},{"s":"A","en":"Okay, let's take this offline after the stand-up.","vi":"Ừ, mình bàn riêng sau buổi daily nhé."},{"s":"B","en":"Thanks. I should still be able to finish by Thursday. That's all from me.","vi":"Cảm ơn anh. Em vẫn có thể xong trước thứ Năm. Phần của em vậy thôi."}]},{"n":11,"en":"Reporting & discussing bugs","vi":"Báo cáo & trao đổi về lỗi","items":[{"en":"I found a bug on the checkout page.","vi":"Tôi tìm thấy một lỗi ở trang thanh toán.","note":"Dùng 'on the page' cho trang web/app. Cũng có thể nói 'I came across a bug'.","lv":"n"},{"en":"Here are the steps to reproduce the issue.","vi":"Đây là các bước để tái hiện lỗi.","note":"'Steps to reproduce' là cụm chuẩn trong bug report, viết tắt STR.","lv":"n"},{"en":"The expected result is a success message, but the actual result is a blank screen.","vi":"Kết quả mong đợi là thông báo thành công, nhưng thực tế là màn hình trắng.","note":"Cặp 'expected result' và 'actual result' giúp dev hiểu ngay vấn đề.","lv":"n"},{"en":"It only happens on Android, not on iOS.","vi":"Lỗi chỉ xảy ra trên Android, không xảy ra trên iOS.","note":"Nêu phạm vi môi trường giúp dev khoanh vùng nhanh.","lv":"n"},{"en":"I can reproduce it every time.","vi":"Lần nào tôi cũng tái hiện được lỗi.","note":"'Reproduce' = làm lỗi xảy ra lại. Ngắn gọn: 'It's 100% reproducible.'","lv":"n"},{"en":"It happens intermittently, about one in five tries.","vi":"Lỗi xảy ra không thường xuyên, khoảng 1 trên 5 lần thử.","note":"'Intermittently' = lúc có lúc không. Nên ghi tỷ lệ tái hiện cụ thể.","lv":"n"},{"en":"I've attached a screen recording and the logs.","vi":"Tôi đã đính kèm video quay màn hình và log.","note":"'Screen recording' tự nhiên hơn 'video screen'. Log nên kèm thời điểm xảy ra lỗi.","lv":"n"},{"en":"I've set the severity to high because it blocks payment.","vi":"Tôi để mức độ nghiêm trọng là cao vì lỗi chặn thanh toán.","note":"Severity = mức ảnh hưởng; priority = độ ưu tiên sửa. Đừng dùng lẫn hai từ.","lv":"n"},{"en":"Could you take a look at this when you get a chance?","vi":"Khi nào có thời gian anh/chị xem giúp lỗi này nhé?","note":"Nhờ dev xem lỗi lịch sự. Lỗi gấp thì nói 'Could you look into this ASAP?'","lv":"n"},{"en":"Which build did you test on?","vi":"Bạn test trên build nào?","note":"Dev hay hỏi câu này. Trả lời: 'I tested on build 2.3.1 on staging.'","lv":"n"},{"en":"I can't reproduce it on my side.","vi":"Bên tôi không tái hiện được lỗi.","note":"'On my side' hoặc 'on my end'. Tester nên gửi thêm dữ liệu, môi trường, tài khoản test.","lv":"n"},{"en":"Could you check it again on the latest build?","vi":"Bạn kiểm tra lại trên build mới nhất được không?","note":"Thường dev nói khi nghi lỗi đã được sửa ở bản mới.","lv":"n"},{"en":"The fix has been deployed to staging. Could you retest it?","vi":"Bản sửa đã được deploy lên staging. Bạn test lại giúp nhé?","note":"'Retest' = test lại lỗi đã sửa. Khác 'regression test' là test lại các phần liên quan.","lv":"n"},{"en":"I've retested it, and it's working as expected now.","vi":"Tôi đã test lại và giờ chạy đúng như mong đợi.","note":"Câu báo lỗi đã fix xong. Sau đó có thể nói 'I'll close the ticket.'","lv":"n"},{"en":"The bug is still there, so I'm reopening the ticket.","vi":"Lỗi vẫn còn nên tôi mở lại ticket.","note":"Nên kèm bằng chứng mới. Tránh nói 'The bug is not fixed yet' nghe như trách.","lv":"n"},{"en":"Is this a bug, or is it working as designed?","vi":"Đây là lỗi hay hệ thống được thiết kế như vậy?","note":"'Working as designed' (hoặc 'by design') = cố ý thiết kế thế. Hỏi khi tài liệu không rõ.","lv":"n"},{"en":"This looks like a regression from the last release.","vi":"Có vẻ đây là lỗi hồi quy từ bản phát hành trước.","note":"'Regression' = chức năng đang chạy tốt bị hỏng sau khi thay đổi code.","lv":"n"},{"en":"It's a minor UI issue, so it's not a blocker for the release.","vi":"Đây là lỗi giao diện nhỏ nên không chặn việc phát hành.","note":"'Not a blocker' = không cản trở release. Giúp team quyết định ưu tiên.","lv":"n"}],"dlg":[{"s":"A","en":"Hi Minh, I found a bug on the checkout page. Could you take a look when you get a chance?","vi":"Chào Minh, mình tìm thấy lỗi ở trang thanh toán. Khi nào rảnh bạn xem giúp nhé?"},{"s":"B","en":"Sure. Which build did you test on?","vi":"Được. Bạn test trên build nào?"},{"s":"A","en":"Build 2.3.1 on staging. It only happens on Android, not on iOS.","vi":"Build 2.3.1 trên staging. Lỗi chỉ xảy ra trên Android, không có trên iOS."},{"s":"B","en":"Hmm, I can't reproduce it on my side.","vi":"Hmm, bên mình không tái hiện được."},{"s":"A","en":"I've attached a screen recording and the logs. Here are the steps to reproduce the issue.","vi":"Mình đã đính kèm video quay màn hình và log. Đây là các bước tái hiện lỗi."},{"s":"B","en":"Got it, I see the problem now. The fix has been deployed to staging. Could you retest it?","vi":"Rồi, giờ mình thấy vấn đề rồi. Bản sửa đã lên staging. Bạn test lại giúp nhé?"},{"s":"A","en":"I've retested it, and it's working as expected now. Thanks!","vi":"Mình test lại rồi, giờ chạy đúng như mong đợi. Cảm ơn nhé!"}]},{"n":12,"en":"Clarifying requirements with BA/PO/devs","vi":"Làm rõ yêu cầu với BA/PO/dev","items":[{"en":"I have a question about the requirements for the login screen.","vi":"Tôi có câu hỏi về yêu cầu của màn hình đăng nhập.","note":"Lỗi hay gặp: 'I have a question want to ask'. Chỉ cần 'I have a question about...'.","lv":"n"},{"en":"Could you clarify what should happen if the user enters an invalid phone number?","vi":"Anh/chị làm rõ giúp nếu người dùng nhập số điện thoại sai thì hệ thống xử lý thế nào?","note":"'Clarify' = làm rõ. Câu hỏi cụ thể giúp BA trả lời nhanh, chính xác.","lv":"n"},{"en":"Just to make sure I understand correctly, the limit is 50 million per day?","vi":"Để chắc chắn tôi hiểu đúng, hạn mức là 50 triệu mỗi ngày phải không?","note":"Dùng để xác nhận lại hiểu biết, tránh hiểu nhầm yêu cầu.","lv":"n"},{"en":"So, if I understand you correctly, we only show this button for new users?","vi":"Vậy nếu tôi hiểu đúng thì nút này chỉ hiển thị cho người dùng mới?","note":"Diễn đạt lại ý người kia để xác nhận. Rất hữu ích sau buổi họp yêu cầu.","lv":"n"},{"en":"What's the expected behavior when the session times out?","vi":"Khi phiên đăng nhập hết hạn thì hệ thống phải xử lý thế nào?","note":"'Time out' (động từ) = hết thời gian. Danh từ viết liền: 'timeout'.","lv":"n"},{"en":"Is there a maximum length for this field?","vi":"Trường này có giới hạn độ dài tối đa không?","note":"Câu hỏi quan trọng để thiết kế test giá trị biên.","lv":"n"},{"en":"Should this field be required or optional?","vi":"Trường này bắt buộc hay không bắt buộc?","note":"Dùng 'required/optional' hoặc 'mandatory/optional'. Đừng nói 'must field'.","lv":"n"},{"en":"What are the acceptance criteria for this story?","vi":"Tiêu chí nghiệm thu của user story này là gì?","note":"'Criteria' là số nhiều (số ít: criterion), nên dùng 'are'.","lv":"n"},{"en":"The SRS doesn't mention what happens in this case.","vi":"SRS không đề cập trường hợp này xử lý thế nào.","note":"Chỉ ra chỗ thiếu trong tài liệu một cách trung lập, không đổ lỗi.","lv":"n"},{"en":"What if the user loses connection in the middle of the payment?","vi":"Nếu người dùng mất kết nối giữa lúc thanh toán thì sao?","note":"'What if...?' là cách hỏi tình huống biên (edge case) tự nhiên nhất.","lv":"n"},{"en":"How should the system handle duplicate requests?","vi":"Hệ thống nên xử lý yêu cầu trùng lặp như thế nào?","note":"'Handle' = xử lý. Dùng khi hỏi về logic nghiệp vụ hoặc lỗi.","lv":"n"},{"en":"The SRS and the API spec seem to contradict each other here.","vi":"Chỗ này SRS và đặc tả API có vẻ mâu thuẫn nhau.","note":"Thêm 'seem to' cho nhẹ nhàng. 'Contradict' không cần giới từ 'with'.","lv":"n"},{"en":"Which document should we follow, the SRS or the design doc?","vi":"Mình nên bám theo tài liệu nào, SRS hay tài liệu thiết kế?","note":"Hỏi khi tài liệu lệch nhau. Chốt nguồn chuẩn trước khi viết test case.","lv":"n"},{"en":"Is this in scope for this release?","vi":"Phần này có nằm trong phạm vi bản phát hành này không?","note":"'In scope / out of scope' = trong/ngoài phạm vi. Rất hay dùng với PO.","lv":"n"},{"en":"Could you give me an example of a valid input?","vi":"Anh/chị cho tôi một ví dụ về dữ liệu nhập hợp lệ được không?","note":"Ví dụ cụ thể giúp tránh hiểu nhầm và chuẩn bị dữ liệu test.","lv":"n"},{"en":"Could we discuss this in the grooming session?","vi":"Mình thảo luận việc này trong buổi grooming được không?","note":"Lỗi hay gặp: 'discuss about'. Đúng: 'discuss something' hoặc 'talk about something'.","lv":"n"},{"en":"Let me confirm this with the BA and get back to you.","vi":"Để tôi xác nhận với BA rồi phản hồi lại anh/chị.","note":"Dùng khi chưa chắc câu trả lời. Tốt hơn đoán bừa.","lv":"n"},{"en":"Could you update the document so the team is on the same page?","vi":"Anh/chị cập nhật tài liệu để cả team hiểu thống nhất được không?","note":"'On the same page' = cùng hiểu một ý, thống nhất.","lv":"n"}],"dlg":[{"s":"A","en":"Hi Lan, I have a question about the requirements for the transfer screen.","vi":"Chào chị Lan, em có câu hỏi về yêu cầu của màn hình chuyển tiền."},{"s":"B","en":"Sure, go ahead.","vi":"Ừ, em hỏi đi."},{"s":"A","en":"Just to make sure I understand correctly, the limit is 50 million per day?","vi":"Để chắc em hiểu đúng, hạn mức là 50 triệu mỗi ngày phải không ạ?"},{"s":"B","en":"Yes, that's right.","vi":"Đúng rồi."},{"s":"A","en":"What if the user loses connection in the middle of the payment? The SRS doesn't mention what happens in this case.","vi":"Nếu người dùng mất kết nối giữa lúc thanh toán thì sao ạ? SRS không đề cập trường hợp này."},{"s":"B","en":"Good catch. Let me confirm this with the dev team and get back to you.","vi":"Phát hiện hay đấy. Để chị xác nhận với team dev rồi trả lời em."},{"s":"A","en":"Thanks. Could you update the document so the team is on the same page?","vi":"Cảm ơn chị. Chị cập nhật tài liệu để cả team thống nhất nhé?"},{"s":"B","en":"Of course. I'll do it today.","vi":"Tất nhiên. Hôm nay chị làm luôn."}]},{"n":13,"en":"Scheduling & deadlines","vi":"Hẹn lịch & hạn chót","items":[{"en":"Are you free for a quick call this afternoon?","vi":"Chiều nay anh/chị rảnh để gọi nhanh không?","note":"Hỏi lịch thân thiện. Trang trọng hơn: 'Would you be available for a call this afternoon?'","lv":"i"},{"en":"Does Tuesday at 10 a.m. work for you?","vi":"Thứ Ba lúc 10 giờ sáng anh/chị có tiện không?","note":"'Does ... work for you?' rất tự nhiên khi đề xuất giờ họp.","lv":"n"},{"en":"I'm afraid I'm not available then. How about Wednesday morning?","vi":"Tiếc là lúc đó tôi bận. Sáng thứ Tư thì sao?","note":"'I'm afraid' làm lời từ chối lịch sự. Luôn đề xuất giờ khác.","lv":"n"},{"en":"Could we push the meeting back to 3 p.m.?","vi":"Mình lùi cuộc họp sang 3 giờ chiều được không?","note":"'Push back' = dời muộn hơn. Đừng nhầm với 'move up' (dời sớm hơn).","lv":"n"},{"en":"Could we move the meeting up to Monday?","vi":"Mình dời cuộc họp lên sớm hơn, vào thứ Hai được không?","note":"'Move up' / 'bring forward' = dời sớm hơn.","lv":"n"},{"en":"Something urgent came up, so I need to reschedule our meeting.","vi":"Có việc gấp phát sinh nên tôi cần dời lịch họp.","note":"'Something came up' = có việc đột xuất, không cần giải thích chi tiết.","lv":"n"},{"en":"Sorry, I have to cancel today's meeting.","vi":"Xin lỗi, tôi phải hủy cuộc họp hôm nay.","note":"Nên báo sớm và đề xuất lịch mới nếu cần.","lv":"n"},{"en":"I'll send you a calendar invite.","vi":"Tôi sẽ gửi lời mời qua lịch cho anh/chị.","note":"'Calendar invite' (hoặc 'meeting invite'). Không nói 'send you a calendar'.","lv":"n"},{"en":"What time zone are you in?","vi":"Anh/chị đang ở múi giờ nào?","note":"Quan trọng khi làm việc với đối tác nước ngoài. Việt Nam là GMT+7.","lv":"n"},{"en":"When is the deadline for the test report?","vi":"Hạn nộp báo cáo test là khi nào?","note":"Cũng có thể hỏi 'When is the test report due?'","lv":"n"},{"en":"We need to finish testing by the end of the week.","vi":"Mình cần test xong trước cuối tuần.","note":"'By' = không muộn hơn. 'Until' = kéo dài liên tục đến lúc đó. Hay bị nhầm.","lv":"n"},{"en":"Let's aim to wrap up testing by Friday.","vi":"Mình đặt mục tiêu kết thúc test trước thứ Sáu nhé.","note":"'Wrap up' = hoàn tất, kết thúc. 'Aim to' = đặt mục tiêu.","lv":"i"},{"en":"The deadline is tight, but I'll do my best.","vi":"Hạn chót khá gấp nhưng tôi sẽ cố hết sức.","note":"'Tight deadline' = hạn gấp. Nên nói rõ rủi ro nếu có.","lv":"n"},{"en":"Would it be possible to get two more days for testing?","vi":"Có thể cho tôi thêm hai ngày để test không?","note":"Xin thêm thời gian lịch sự. Nên kèm lý do cụ thể.","lv":"f"},{"en":"I don't think we can meet the deadline because of the blockers.","vi":"Tôi e là không kịp hạn chót vì các vấn đề đang chặn.","note":"'Meet the deadline' = kịp hạn. Báo sớm tốt hơn để trễ mới nói.","lv":"n"},{"en":"Could we extend the deadline to next Monday?","vi":"Mình gia hạn sang thứ Hai tuần sau được không?","note":"'Extend the deadline' = gia hạn. Lỗi hay gặp: 'delay the deadline'.","lv":"n"},{"en":"Is the release still on track for Friday?","vi":"Bản phát hành vẫn đúng kế hoạch vào thứ Sáu chứ?","note":"'On track' = đúng tiến độ. Hỏi để nắm rủi ro sớm.","lv":"n"},{"en":"I'll keep you posted if anything changes.","vi":"Có gì thay đổi tôi sẽ báo anh/chị.","note":"'Keep someone posted' = cập nhật thông tin thường xuyên. Rất phổ biến.","lv":"n"}],"dlg":[{"s":"A","en":"Hi Tom, are you free for a quick call this afternoon?","vi":"Chào Tom, chiều nay anh rảnh gọi nhanh không?"},{"s":"B","en":"I'm afraid I'm not available today. Does Tuesday at 10 a.m. work for you?","vi":"Tiếc là hôm nay tôi bận. Thứ Ba lúc 10 giờ sáng có tiện cho chị không?"},{"s":"A","en":"That works. I'll send you a calendar invite.","vi":"Được ạ. Tôi sẽ gửi lời mời qua lịch."},{"s":"B","en":"Great. By the way, is the release still on track for Friday?","vi":"Tốt. À, bản phát hành vẫn đúng kế hoạch thứ Sáu chứ?"},{"s":"A","en":"The deadline is tight because of two blockers. Would it be possible to get two more days for testing?","vi":"Hạn khá gấp vì có hai vấn đề đang chặn. Có thể cho thêm hai ngày để test không?"},{"s":"B","en":"Let me check with the PO. Could we extend it to next Tuesday?","vi":"Để tôi hỏi PO. Mình gia hạn sang thứ Ba tuần sau được không?"},{"s":"A","en":"That would be perfect. I'll keep you posted if anything changes.","vi":"Thế thì tuyệt. Có gì thay đổi tôi sẽ báo anh."}]},{"n":14,"en":"Job interviews","vi":"Phỏng vấn xin việc","items":[{"en":"Thank you for having me today.","vi":"Cảm ơn anh/chị đã mời tôi đến phỏng vấn hôm nay.","note":"Câu mở đầu lịch sự. Cũng có thể nói 'Thank you for the opportunity.'","lv":"f"},{"en":"I've been working as a manual tester for three years.","vi":"Tôi đã làm tester kiểm thử thủ công được ba năm.","note":"Dùng hiện tại hoàn thành tiếp diễn. Lỗi hay gặp: 'I work as tester 3 years'.","lv":"n"},{"en":"I mainly test mobile apps and APIs in the fintech domain.","vi":"Tôi chủ yếu test ứng dụng di động và API trong lĩnh vực tài chính số.","note":"Nêu rõ loại sản phẩm và lĩnh vực giúp nhà tuyển dụng hình dung nhanh.","lv":"n"},{"en":"In my current role, I'm responsible for testing the loan application flow.","vi":"Ở vị trí hiện tại, tôi phụ trách test luồng đăng ký vay.","note":"'Be responsible for + V-ing'. Không nói 'responsible to test'.","lv":"n"},{"en":"I'm experienced in writing test cases from requirements documents.","vi":"Tôi có kinh nghiệm viết test case từ tài liệu yêu cầu.","note":"'Experienced in + V-ing' hoặc 'I have experience in...'. Không nói 'I have experiences'.","lv":"n"},{"en":"I've also started learning automation with Robot Framework.","vi":"Tôi cũng đã bắt đầu học automation với Robot Framework.","note":"Thể hiện tinh thần học hỏi. Nên kể kết quả cụ thể nếu có.","lv":"n"},{"en":"One of my strengths is my attention to detail.","vi":"Một trong những điểm mạnh của tôi là sự tỉ mỉ.","note":"'One of my + danh từ số nhiều'. Lỗi hay gặp: 'one of my strength'.","lv":"n"},{"en":"I'm good at finding edge cases that others might miss.","vi":"Tôi giỏi tìm ra các trường hợp biên mà người khác có thể bỏ sót.","note":"'Good at + V-ing'. Nên kèm ví dụ thực tế để thuyết phục.","lv":"n"},{"en":"One area I'm working on is my spoken English, so I practice every day.","vi":"Một điểm tôi đang cải thiện là kỹ năng nói tiếng Anh, nên ngày nào tôi cũng luyện.","note":"Cách nói điểm yếu khéo léo: nêu điểm yếu kèm hành động cải thiện.","lv":"n"},{"en":"I once found a critical bug just before the release.","vi":"Có lần tôi phát hiện một lỗi nghiêm trọng ngay trước khi phát hành.","note":"Kể chuyện theo trình tự: tình huống, việc làm, kết quả. Rất thuyết phục.","lv":"n"},{"en":"I always try to communicate clearly with developers when I report bugs.","vi":"Tôi luôn cố gắng trao đổi rõ ràng với dev khi báo lỗi.","note":"Kỹ năng giao tiếp rất được đánh giá cao ở vị trí tester.","lv":"n"},{"en":"I'm looking for a role where I can grow my automation skills.","vi":"Tôi đang tìm một vị trí nơi tôi có thể phát triển kỹ năng automation.","note":"Trả lời câu 'Why are you looking for a new job?' một cách tích cực.","lv":"n"},{"en":"I'm interested in this position because of your strong QA culture.","vi":"Tôi quan tâm vị trí này vì công ty có văn hóa QA mạnh.","note":"'Interested in' (không phải 'interested about'). Nên tìm hiểu công ty trước.","lv":"n"},{"en":"Sorry, could you rephrase the question, please?","vi":"Xin lỗi, anh/chị có thể hỏi lại theo cách khác được không?","note":"Dùng khi chưa hiểu câu hỏi. Tốt hơn nhiều so với trả lời sai ý.","lv":"f"},{"en":"Could you tell me more about the team I'd be working with?","vi":"Anh/chị có thể chia sẻ thêm về team tôi sẽ làm cùng không?","note":"Câu hỏi ngược lại cho nhà tuyển dụng, thể hiện sự quan tâm thật sự.","lv":"f"},{"en":"What does a typical day look like for a tester here?","vi":"Một ngày làm việc điển hình của tester ở đây như thế nào?","note":"Lỗi hay gặp: 'How does a typical day look like?'. Đúng: 'What... look like' hoặc 'How... look'.","lv":"n"},{"en":"What tools does your team use for test management?","vi":"Team mình dùng công cụ gì để quản lý test?","note":"Câu hỏi chuyên môn giúp bạn đánh giá môi trường làm việc.","lv":"n"},{"en":"What are the next steps in the hiring process?","vi":"Các bước tiếp theo của quy trình tuyển dụng là gì?","note":"Câu hỏi kết thúc buổi phỏng vấn chuyên nghiệp.","lv":"f"}],"dlg":[{"s":"A","en":"Thanks for coming in. Could you tell me a bit about yourself?","vi":"Cảm ơn bạn đã đến. Bạn giới thiệu một chút về bản thân nhé?"},{"s":"B","en":"Thank you for having me today. I've been working as a manual tester for three years.","vi":"Cảm ơn anh đã mời tôi hôm nay. Tôi đã làm tester kiểm thử thủ công được ba năm."},{"s":"B","en":"I mainly test mobile apps and APIs in the fintech domain.","vi":"Tôi chủ yếu test ứng dụng di động và API trong lĩnh vực tài chính số."},{"s":"A","en":"Great. What would you say is your biggest strength?","vi":"Tốt lắm. Bạn thấy điểm mạnh lớn nhất của mình là gì?"},{"s":"B","en":"One of my strengths is my attention to detail. I'm good at finding edge cases that others might miss.","vi":"Một điểm mạnh của tôi là sự tỉ mỉ. Tôi giỏi tìm ra các trường hợp biên người khác có thể bỏ sót."},{"s":"A","en":"Do you have any questions for us?","vi":"Bạn có câu hỏi gì cho chúng tôi không?"},{"s":"B","en":"Yes. What does a typical day look like for a tester here?","vi":"Có ạ. Một ngày làm việc điển hình của tester ở đây như thế nào?"},{"s":"B","en":"And what are the next steps in the hiring process?","vi":"Và các bước tiếp theo của quy trình tuyển dụng là gì ạ?"}]},{"n":15,"en":"Restaurants & cafés","vi":"Nhà hàng & quán cà phê","items":[{"en":"Could I get a table for two, please?","vi":"Cho tôi một bàn hai người được không?","note":"Lịch sự, tự nhiên hơn 'I want a table'.","lv":"n"},{"en":"Do you have any tables available right now?","vi":"Bây giờ quán còn bàn trống không?","note":"Dùng khi chưa đặt bàn trước. 'Available' tự nhiên hơn 'empty table'.","lv":"n"},{"en":"Can I see the menu, please?","vi":"Cho tôi xem thực đơn được không?","note":"Có thể nói ngắn: 'Menu, please.' nhưng câu đầy đủ lịch sự hơn.","lv":"n"},{"en":"What do you recommend?","vi":"Bạn gợi ý món nào?","note":"Hỏi nhân viên món ngon. Có thể thêm: 'What's popular here?'","lv":"n"},{"en":"I'll have the chicken rice, please.","vi":"Cho tôi món cơm gà.","note":"Gọi món dùng 'I'll have...' hoặc 'I'd like...', tránh 'Give me...'.","lv":"n"},{"en":"Could I get an iced coffee with less sugar?","vi":"Cho tôi một ly cà phê đá ít đường được không?","note":"'Less sugar' = ít đường; 'no sugar' = không đường; 'less ice' = ít đá.","lv":"n"},{"en":"Is this dish spicy?","vi":"Món này có cay không?","note":"Người Việt hay nói 'hot' – được, nhưng 'spicy' rõ nghĩa hơn vì 'hot' còn là nóng.","lv":"n"},{"en":"I'm allergic to peanuts. Does this have any nuts in it?","vi":"Tôi bị dị ứng đậu phộng. Món này có hạt gì không?","note":"Nói 'allergic to', không phải 'allergy with'.","lv":"n"},{"en":"Can I get this to go?","vi":"Cho tôi mang món này về được không?","note":"Mỹ: 'to go'; Anh: 'take away'. Không nói 'take home'.","lv":"n"},{"en":"For here or to go?","vi":"Dùng tại đây hay mang đi ạ?","note":"Câu nhân viên hay hỏi. Trả lời: 'For here, please.' hoặc 'To go, please.'","lv":"n"},{"en":"Excuse me, we're ready to order.","vi":"Xin lỗi, chúng tôi gọi món nhé.","note":"Gọi nhân viên lịch sự. Tránh hô 'Hey!' hoặc 'Em ơi' dịch thẳng.","lv":"n"},{"en":"Could we get some more water, please?","vi":"Cho chúng tôi thêm nước được không?","note":"'Some more' = thêm. Có thể thay water bằng ice, napkins (khăn giấy).","lv":"n"},{"en":"Sorry, I think this isn't what I ordered.","vi":"Xin lỗi, hình như đây không phải món tôi gọi.","note":"'I think' làm câu phàn nàn nhẹ nhàng, lịch sự hơn.","lv":"n"},{"en":"Can we get the check, please?","vi":"Cho chúng tôi tính tiền nhé.","note":"Mỹ: 'check'; Anh: 'bill'. Không nói 'pay money, please'.","lv":"n"},{"en":"Can we split the bill?","vi":"Chúng tôi chia hóa đơn ra trả riêng được không?","note":"'Split the bill' = chia tiền. 'Let's go Dutch' cũng dùng nhưng ít phổ biến hơn.","lv":"i"},{"en":"It's on me today.","vi":"Hôm nay để tôi mời.","note":"Cách nói tự nhiên khi muốn trả tiền cho người khác. Cũng nói: 'My treat.'","lv":"i"},{"en":"Everything was delicious, thank you.","vi":"Mọi món đều ngon, cảm ơn nhé.","note":"Khen khi nhân viên hỏi 'How was everything?'","lv":"n"},{"en":"What's the Wi-Fi password here?","vi":"Mật khẩu Wi-Fi ở đây là gì?","note":"Câu rất hay dùng ở quán cà phê. Người bản xứ đọc là 'Why-fy'.","lv":"n"}],"dlg":[{"s":"A","en":"Hi, could I get a table for two, please?","vi":"Chào bạn, cho tôi một bàn hai người được không?"},{"s":"B","en":"Sure, right this way. Here's the menu.","vi":"Vâng, mời đi lối này. Thực đơn đây ạ."},{"s":"A","en":"Thanks. What do you recommend?","vi":"Cảm ơn. Bạn gợi ý món nào?"},{"s":"B","en":"Our beef noodle soup is really popular.","vi":"Phở bò của quán rất được ưa chuộng."},{"s":"A","en":"Great, I'll have that. And an iced tea, please.","vi":"Tuyệt, cho tôi món đó. Thêm một ly trà đá nhé."},{"s":"B","en":"Anything else for you?","vi":"Anh/chị cần gì thêm không ạ?"},{"s":"A","en":"No, that's all. Can we get the check when we're done?","vi":"Không, vậy thôi. Ăn xong cho chúng tôi tính tiền nhé."},{"s":"B","en":"Of course. Enjoy your meal!","vi":"Dạ vâng. Chúc ngon miệng!"}]},{"n":16,"en":"Shopping & paying","vi":"Mua sắm & thanh toán","items":[{"en":"I'm just looking, thanks.","vi":"Tôi chỉ xem thôi, cảm ơn.","note":"Trả lời khi nhân viên hỏi 'Can I help you?' mà bạn chưa cần giúp.","lv":"n"},{"en":"Do you have this in a medium?","vi":"Cái này có size M không?","note":"Hỏi size dùng 'in a small/medium/large' hoặc 'in size 39'.","lv":"n"},{"en":"Can I try this on?","vi":"Tôi mặc thử cái này được không?","note":"'Try on' cho quần áo, giày. Không nói 'test this shirt'.","lv":"n"},{"en":"Where are the fitting rooms?","vi":"Phòng thử đồ ở đâu?","note":"Mỹ cũng hay nói 'dressing rooms'.","lv":"n"},{"en":"How much is this?","vi":"Cái này bao nhiêu tiền?","note":"Số nhiều: 'How much are these?' Tránh 'How much money is this?'","lv":"n"},{"en":"Is this on sale?","vi":"Món này có đang giảm giá không?","note":"'On sale' = đang giảm giá; 'for sale' = đang được bán.","lv":"n"},{"en":"Do you have it in another color?","vi":"Có màu khác không?","note":"Có thể hỏi cụ thể: 'Do you have it in black?'","lv":"n"},{"en":"It's a bit too expensive for me.","vi":"Hơi đắt so với tôi.","note":"'A bit' làm câu từ chối nhẹ nhàng, không gây mất lòng.","lv":"n"},{"en":"Can you give me a discount if I buy two?","vi":"Mua hai cái có được giảm giá không?","note":"Mặc cả lịch sự. Cũng nói: 'Is that your best price?'","lv":"i"},{"en":"I'll take it.","vi":"Tôi lấy cái này.","note":"Câu chốt mua tự nhiên. Không nói 'I buy it.'","lv":"n"},{"en":"Can I pay by card?","vi":"Tôi trả bằng thẻ được không?","note":"'Pay by card' nhưng 'pay in cash'. Đừng nói 'pay by cash'.","lv":"n"},{"en":"Do you accept QR code payments?","vi":"Ở đây có nhận thanh toán bằng mã QR không?","note":"'Accept' dùng cho phương thức thanh toán. Cũng hỏi: 'Can I pay with my e-wallet?'","lv":"n"},{"en":"Could I get a receipt, please?","vi":"Cho tôi xin hóa đơn được không?","note":"'Receipt' đọc là /rɪˈsiːt/, chữ p câm.","lv":"n"},{"en":"I'd like to return this, please.","vi":"Tôi muốn trả lại món này.","note":"'Return' = trả hàng lấy tiền; 'exchange' = đổi sang món khác.","lv":"f"},{"en":"Can I exchange this for a bigger size?","vi":"Tôi đổi sang size lớn hơn được không?","note":"Cấu trúc: exchange A for B.","lv":"n"},{"en":"I don't need a bag, thanks.","vi":"Tôi không cần túi đâu, cảm ơn.","note":"Trả lời khi thu ngân hỏi 'Do you need a bag?'","lv":"n"},{"en":"Does this come with a warranty?","vi":"Món này có bảo hành không?","note":"Hỏi thêm thời gian: 'How long is the warranty?'","lv":"n"},{"en":"Can you deliver it to my office?","vi":"Bạn giao đến văn phòng tôi được không?","note":"'Deliver to' + địa điểm. Hỏi phí: 'Is delivery free?'","lv":"n"}],"dlg":[{"s":"A","en":"Hi, can I help you find anything?","vi":"Chào chị, chị cần tìm gì không ạ?"},{"s":"B","en":"Yes, do you have this shirt in a medium?","vi":"Có, áo này có size M không?"},{"s":"A","en":"Let me check. Yes, here you go.","vi":"Để em xem. Có đây ạ."},{"s":"B","en":"Thanks. Can I try it on?","vi":"Cảm ơn. Tôi mặc thử được không?"},{"s":"A","en":"Sure, the fitting rooms are over there.","vi":"Dạ được, phòng thử đồ ở đằng kia ạ."},{"s":"B","en":"It fits well. I'll take it. Can I pay by card?","vi":"Vừa lắm. Tôi lấy cái này. Trả bằng thẻ được không?"},{"s":"A","en":"Of course. Would you like a bag?","vi":"Dạ được ạ. Chị có cần túi không?"},{"s":"B","en":"No, I'm fine, thanks. Could I get a receipt, though?","vi":"Không cần đâu, cảm ơn. Nhưng cho tôi xin hóa đơn nhé."}]},{"n":17,"en":"Travel: airport & hotel","vi":"Du lịch: sân bay & khách sạn","items":[{"en":"Could I have a window seat, please?","vi":"Cho tôi ghế cạnh cửa sổ được không?","note":"Ghế lối đi là 'aisle seat' (đọc /aɪl/, chữ s câm).","lv":"n"},{"en":"How many bags can I check in?","vi":"Tôi được ký gửi bao nhiêu kiện hành lý?","note":"'Check in a bag' = ký gửi; hành lý xách tay là 'carry-on'.","lv":"n"},{"en":"Which gate does the flight to Da Nang leave from?","vi":"Chuyến bay đi Đà Nẵng ở cửa nào?","note":"Có thể hỏi ngắn: 'Which gate is the Da Nang flight?'","lv":"n"},{"en":"My flight has been delayed by two hours.","vi":"Chuyến bay của tôi bị hoãn hai tiếng.","note":"'Delayed' = trễ giờ; 'cancelled' = bị hủy. Dùng 'by' trước thời gian trễ.","lv":"n"},{"en":"I'm here on business.","vi":"Tôi đến đây công tác.","note":"Trả lời hải quan. Đi chơi thì nói 'I'm here on vacation' hoặc 'for sightseeing'.","lv":"f"},{"en":"I'm staying for five days.","vi":"Tôi ở lại năm ngày.","note":"Trả lời câu 'How long are you staying?' Dùng 'for' + khoảng thời gian.","lv":"n"},{"en":"My luggage didn't arrive.","vi":"Hành lý của tôi không đến.","note":"Báo ở quầy 'baggage claim'. 'Luggage' không đếm được, không thêm s.","lv":"n"},{"en":"Where can I exchange money?","vi":"Tôi có thể đổi tiền ở đâu?","note":"Cũng nói 'Where's the currency exchange?'","lv":"n"},{"en":"I have a reservation under the name Thu.","vi":"Tôi đã đặt phòng với tên Thu.","note":"Dùng 'under the name', không phải 'with the name'.","lv":"f"},{"en":"What time is check-out?","vi":"Mấy giờ phải trả phòng?","note":"'Check-out' (danh từ) có gạch nối; động từ là 'check out'.","lv":"n"},{"en":"Is breakfast included?","vi":"Có bao gồm bữa sáng không?","note":"'Included' dùng cho giá phòng, vé... Hỏi thêm: 'What time is breakfast?'","lv":"n"},{"en":"Could I get a late check-out?","vi":"Tôi trả phòng muộn được không?","note":"Thường hỏi lúc nhận phòng hoặc buổi sáng hôm trả phòng.","lv":"n"},{"en":"The air conditioner in my room isn't working.","vi":"Máy lạnh trong phòng tôi bị hỏng.","note":"'Isn't working' tự nhiên hơn 'is broken' khi báo sự cố. Nói tắt: 'the AC'.","lv":"n"},{"en":"Could you call a taxi for me?","vi":"Bạn gọi giúp tôi một chiếc taxi được không?","note":"Nhờ lễ tân gọi xe. Cũng nói: 'Could you get me a taxi?'","lv":"n"},{"en":"Can I leave my luggage here until this afternoon?","vi":"Tôi gửi hành lý ở đây đến chiều được không?","note":"Hữu ích khi đã trả phòng nhưng chưa ra sân bay.","lv":"n"},{"en":"Could I have an extra towel, please?","vi":"Cho tôi thêm một cái khăn tắm được không?","note":"'Extra' = thêm. Có thể thay bằng pillow (gối), blanket (chăn).","lv":"n"},{"en":"Is there a shuttle to the airport?","vi":"Có xe đưa đón ra sân bay không?","note":"'Shuttle' = xe đưa đón theo tuyến cố định của khách sạn.","lv":"n"},{"en":"Could you recommend a good place to eat nearby?","vi":"Bạn gợi ý giúp một chỗ ăn ngon gần đây được không?","note":"Hỏi lễ tân rất phổ biến. 'Nearby' đặt cuối câu.","lv":"n"}],"dlg":[{"s":"A","en":"Good evening. I have a reservation under the name Thu.","vi":"Chào buổi tối. Tôi đã đặt phòng với tên Thu."},{"s":"B","en":"Welcome. Could I see your passport, please?","vi":"Xin chào. Cho tôi xem hộ chiếu của chị được không?"},{"s":"A","en":"Here you are. Is breakfast included?","vi":"Đây ạ. Giá có bao gồm bữa sáng không?"},{"s":"B","en":"Yes, it's served from 6 to 10 a.m. on the second floor.","vi":"Có ạ, bữa sáng phục vụ từ 6 đến 10 giờ ở tầng hai."},{"s":"A","en":"Great. What time is check-out?","vi":"Tốt quá. Mấy giờ trả phòng?"},{"s":"B","en":"It's at noon. Here's your key card. You're in room 512.","vi":"12 giờ trưa ạ. Thẻ phòng của chị đây. Phòng 512."},{"s":"A","en":"Thank you. Is there a shuttle to the airport?","vi":"Cảm ơn. Có xe đưa ra sân bay không?"},{"s":"B","en":"Yes, just let us know a day in advance.","vi":"Có ạ, chị chỉ cần báo trước một ngày."}]},{"n":18,"en":"Directions & getting around","vi":"Hỏi đường & đi lại (taxi, Grab, xe buýt)","items":[{"en":"Excuse me, how do I get to the train station?","vi":"Xin lỗi, cho hỏi đến ga tàu đi thế nào?","note":"Mở đầu bằng 'Excuse me' khi hỏi người lạ. Tránh 'Where is train station?' thiếu 'the'.","lv":"n"},{"en":"Is it within walking distance?","vi":"Có đi bộ được không?","note":"Hỏi xem có gần không. Cũng nói: 'Can I walk there?'","lv":"n"},{"en":"How long does it take to get there?","vi":"Đến đó mất bao lâu?","note":"Cấu trúc 'It takes + thời gian'. Không nói 'How long time...'","lv":"n"},{"en":"Go straight and turn left at the traffic lights.","vi":"Đi thẳng rồi rẽ trái ở chỗ đèn giao thông.","note":"Dùng 'at' với điểm rẽ: at the corner, at the traffic lights.","lv":"n"},{"en":"It's on your right, next to the bank.","vi":"Nó ở bên phải bạn, cạnh ngân hàng.","note":"'On your right/left' – không nói 'in your right'.","lv":"n"},{"en":"I think I'm lost.","vi":"Hình như tôi bị lạc rồi.","note":"Dùng 'I'm lost', không phải 'I lost' (= tôi thua/làm mất).","lv":"n"},{"en":"Could you show me on the map?","vi":"Bạn chỉ giúp tôi trên bản đồ được không?","note":"Hữu ích khi không nghe rõ chỉ đường. Đưa điện thoại kèm câu này.","lv":"n"},{"en":"Which bus goes to the city center?","vi":"Xe buýt nào đi vào trung tâm thành phố?","note":"Anh viết 'city centre'. Mỹ hay nói 'downtown'.","lv":"n"},{"en":"Does this bus stop at Ben Thanh Market?","vi":"Xe buýt này có dừng ở chợ Bến Thành không?","note":"'Stop at' + địa điểm. Hỏi trước khi lên xe.","lv":"n"},{"en":"Where should I get off?","vi":"Tôi nên xuống ở đâu?","note":"'Get on/off' cho xe buýt, tàu; 'get in/out of' cho taxi, ô tô.","lv":"n"},{"en":"Could you take me to this address, please?","vi":"Anh chở tôi đến địa chỉ này được không?","note":"Đưa địa chỉ trên điện thoại cho tài xế kèm câu này.","lv":"n"},{"en":"Could you drop me off here?","vi":"Cho tôi xuống ở đây được không?","note":"'Drop off' = thả khách xuống; 'pick up' = đón.","lv":"n"},{"en":"I've booked a Grab. It'll be here in five minutes.","vi":"Tôi đã đặt Grab rồi. Năm phút nữa xe tới.","note":"'In five minutes' = năm phút nữa; không nói 'after five minutes'.","lv":"i"},{"en":"Could you turn on the meter, please?","vi":"Anh bật đồng hồ tính tiền giúp tôi nhé?","note":"Nói với tài xế taxi để tránh bị 'chém' giá.","lv":"n"},{"en":"How much is the fare to the airport?","vi":"Đi ra sân bay bao nhiêu tiền?","note":"'Fare' = giá vé/cước xe. Không nói 'How much money to the airport?'","lv":"n"},{"en":"Traffic is really bad right now.","vi":"Giờ này kẹt xe ghê lắm.","note":"'Traffic' không đếm được. Cũng nói: 'We're stuck in traffic.'","lv":"i"},{"en":"Is there a faster way to get there?","vi":"Có đường nào đi nhanh hơn không?","note":"Hỏi tài xế hoặc người chỉ đường. 'Way' = lối đi, tuyến đường.","lv":"n"},{"en":"Keep the change.","vi":"Không cần thối lại đâu.","note":"Dùng khi muốn cho tài xế/nhân viên tiền thừa.","lv":"i"}],"dlg":[{"s":"A","en":"Excuse me, how do I get to the Opera House?","vi":"Xin lỗi, cho hỏi đến Nhà hát Lớn đi thế nào?"},{"s":"B","en":"Go straight for two blocks, then turn right at the traffic lights.","vi":"Đi thẳng qua hai dãy nhà, rồi rẽ phải ở đèn giao thông."},{"s":"A","en":"Is it within walking distance?","vi":"Có đi bộ được không?"},{"s":"B","en":"Yes, it's about ten minutes on foot.","vi":"Được, đi bộ khoảng mười phút."},{"s":"A","en":"Sorry, could you show me on the map?","vi":"Xin lỗi, bạn chỉ giúp tôi trên bản đồ được không?"},{"s":"B","en":"Sure. We're here, and it's right there, on your left.","vi":"Được chứ. Mình đang ở đây, còn nó ở ngay đó, bên tay trái bạn."},{"s":"A","en":"Got it. Thanks so much for your help!","vi":"Hiểu rồi. Cảm ơn bạn nhiều nhé!"},{"s":"B","en":"No problem. Have a good day!","vi":"Không có gì. Chúc một ngày tốt lành!"}]},{"n":19,"en":"Health & seeing a doctor","vi":"Sức khỏe & đi khám bác sĩ","items":[{"en":"I'm not feeling well today.","vi":"Hôm nay tôi thấy không khỏe.","note":"Cách nói phổ biến, nhẹ nhàng. Tránh 'I'm not healthy' (= sức khỏe nói chung kém).","lv":"n"},{"en":"I'd like to make an appointment with a doctor.","vi":"Tôi muốn đặt lịch khám bác sĩ.","note":"'Make an appointment' = đặt lịch hẹn. Không nói 'book a doctor'.","lv":"f"},{"en":"I have a headache and a sore throat.","vi":"Tôi bị đau đầu và đau họng.","note":"Dùng 'have a + bệnh': have a fever, have a cough, have a cold.","lv":"n"},{"en":"I've had a fever since yesterday.","vi":"Tôi bị sốt từ hôm qua.","note":"Dùng hiện tại hoàn thành + since/for khi tả bệnh kéo dài đến giờ.","lv":"n"},{"en":"My stomach hurts.","vi":"Tôi bị đau bụng.","note":"Cũng nói: 'I have a stomachache.' Chỗ đau + hurts: My back hurts.","lv":"n"},{"en":"I've been coughing for three days.","vi":"Tôi bị ho ba ngày nay rồi.","note":"Hiện tại hoàn thành tiếp diễn nhấn mạnh việc kéo dài liên tục.","lv":"n"},{"en":"I feel dizzy.","vi":"Tôi thấy chóng mặt.","note":"Dùng 'feel' + tính từ: feel sick, feel tired, feel weak.","lv":"n"},{"en":"I think I've caught a cold.","vi":"Hình như tôi bị cảm rồi.","note":"'Catch a cold' = bị cảm. 'Have the flu' = bị cúm.","lv":"i"},{"en":"I'm allergic to penicillin.","vi":"Tôi bị dị ứng với penicillin.","note":"Rất quan trọng khi khám bệnh. Dùng 'allergic to', không phải 'allergic with'.","lv":"n"},{"en":"Do I need a prescription for this?","vi":"Thuốc này có cần đơn bác sĩ không?","note":"'Prescription' = đơn thuốc. Hỏi ở hiệu thuốc (pharmacy).","lv":"n"},{"en":"How often should I take this medicine?","vi":"Thuốc này tôi uống bao lâu một lần?","note":"Uống thuốc là 'take medicine', không phải 'drink medicine'.","lv":"n"},{"en":"Take one tablet twice a day after meals.","vi":"Uống một viên, ngày hai lần, sau bữa ăn.","note":"Câu bác sĩ/dược sĩ hay nói. 'Twice a day' = ngày hai lần.","lv":"n"},{"en":"Are there any side effects?","vi":"Thuốc có tác dụng phụ không?","note":"'Side effects' luôn ở dạng số nhiều trong câu hỏi này.","lv":"n"},{"en":"I need to take a sick day today.","vi":"Hôm nay tôi cần xin nghỉ ốm.","note":"Nhắn sếp: 'I'm not feeling well, so I need to take a sick day.'","lv":"n"},{"en":"Could you write me a doctor's note?","vi":"Bác sĩ viết giúp tôi giấy xác nhận được không?","note":"'Doctor's note' = giấy bác sĩ xác nhận để nộp công ty.","lv":"f"},{"en":"Where does it hurt?","vi":"Bạn đau ở đâu?","note":"Câu bác sĩ hỏi. Trả lời: 'Right here.' và chỉ vào chỗ đau.","lv":"n"},{"en":"Get well soon!","vi":"Mau khỏe nhé!","note":"Chúc người ốm. Viết thiệp hoặc nhắn tin đều dùng được.","lv":"i"},{"en":"Take care of yourself and get some rest.","vi":"Giữ gìn sức khỏe và nghỉ ngơi đi nhé.","note":"'Take care' cũng dùng để chào tạm biệt thân mật.","lv":"i"}],"dlg":[{"s":"A","en":"Hi, what seems to be the problem?","vi":"Chào chị, chị bị sao vậy?"},{"s":"B","en":"I've had a fever and a sore throat since yesterday.","vi":"Tôi bị sốt và đau họng từ hôm qua."},{"s":"A","en":"Are you allergic to any medicine?","vi":"Chị có dị ứng với thuốc nào không?"},{"s":"B","en":"Yes, I'm allergic to penicillin.","vi":"Có, tôi bị dị ứng penicillin."},{"s":"A","en":"Okay. It looks like a throat infection. I'll prescribe something else.","vi":"Được rồi. Có vẻ là viêm họng. Tôi sẽ kê thuốc khác."},{"s":"B","en":"How often should I take it?","vi":"Tôi uống bao lâu một lần?"},{"s":"A","en":"One tablet twice a day after meals, for five days.","vi":"Mỗi lần một viên, ngày hai lần sau bữa ăn, trong năm ngày."},{"s":"B","en":"Thank you, doctor. Could you also write me a doctor's note?","vi":"Cảm ơn bác sĩ. Bác sĩ viết giúp tôi giấy xác nhận được không?"}]},{"n":20,"en":"Feelings, compliments & encouragement","vi":"Cảm xúc, khen ngợi & động viên","items":[{"en":"Great job on the presentation!","vi":"Bài thuyết trình làm tốt lắm!","note":"Khen cụ thể việc gì: 'Great job on + việc'. Tự nhiên hơn 'You are very good'.","lv":"i"},{"en":"I'm really proud of you.","vi":"Tôi thật sự tự hào về bạn.","note":"Dùng 'proud of', không phải 'proud about'. Thường nói với người thân, đồng đội.","lv":"i"},{"en":"You look great today!","vi":"Hôm nay trông bạn tuyệt lắm!","note":"Khen ngoại hình an toàn. Tránh nhận xét cân nặng như 'You're fat'.","lv":"i"},{"en":"That's a great idea!","vi":"Ý tưởng hay đấy!","note":"Hay dùng trong họp. Cũng nói: 'Good thinking!'","lv":"n"},{"en":"Don't worry, you'll get it next time.","vi":"Đừng lo, lần sau bạn sẽ làm được.","note":"Động viên khi ai đó thất bại. 'Get it' = làm được, đạt được.","lv":"i"},{"en":"Hang in there. It'll get better.","vi":"Cố lên. Mọi chuyện sẽ ổn thôi.","note":"'Cố lên' khi khó khăn kéo dài. Không dịch thẳng 'Try up!'","lv":"i"},{"en":"You've got this!","vi":"Bạn làm được mà!","note":"'Cố lên' trước khi ai đó làm việc khó (thi, phỏng vấn, demo).","lv":"i"},{"en":"I'm so happy for you!","vi":"Mình mừng cho bạn quá!","note":"Đáp lại tin vui của người khác. 'Happy for you', không phải 'happy with you'.","lv":"i"},{"en":"Congratulations on your promotion!","vi":"Chúc mừng bạn được thăng chức!","note":"'Congratulations' luôn có s; đi với 'on'. Thân mật: 'Congrats!'","lv":"n"},{"en":"Happy birthday! I hope you have a wonderful day.","vi":"Chúc mừng sinh nhật! Chúc bạn một ngày thật tuyệt.","note":"Dùng 'I hope you...' hoặc 'Wishing you...' để chúc, không nói 'I wish you have'.","lv":"n"},{"en":"I'm sorry to hear that.","vi":"Nghe vậy tôi rất tiếc.","note":"Đáp lại tin buồn nhỏ (ốm, trượt, mất đồ). 'Sorry' ở đây là đồng cảm, không phải xin lỗi.","lv":"n"},{"en":"I'm so sorry for your loss.","vi":"Tôi rất tiếc về sự mất mát của bạn.","note":"Chia buồn khi có người mất. Câu chuẩn, trang trọng, an toàn.","lv":"f"},{"en":"Let me know if there's anything I can do.","vi":"Có gì tôi giúp được thì cứ nói nhé.","note":"Hay đi kèm câu chia buồn hoặc khi đồng nghiệp gặp khó khăn.","lv":"n"},{"en":"I'm a bit stressed about the deadline.","vi":"Tôi hơi căng thẳng vì deadline.","note":"'Stressed about' + việc gây áp lực. 'Stressful' dùng cho sự việc.","lv":"i"},{"en":"I'm so frustrated with this bug.","vi":"Con bug này làm tôi bực quá.","note":"'Frustrated' = bực vì mãi không xong. Không nhầm với 'angry' (giận).","lv":"i"},{"en":"I'm feeling a bit down today.","vi":"Hôm nay tôi hơi buồn.","note":"'Down' = buồn, chán nản nhẹ. Tự nhiên hơn 'I'm sad'.","lv":"i"},{"en":"Thank you so much. I really appreciate it.","vi":"Cảm ơn nhiều lắm. Tôi rất trân trọng điều đó.","note":"Đáp lại khi được giúp hoặc được khen. 'Appreciate' cần tân ngữ 'it'.","lv":"n"},{"en":"No worries, it happens to everyone.","vi":"Không sao đâu, ai cũng có lúc vậy mà.","note":"An ủi khi ai đó mắc lỗi. 'No worries' rất phổ biến, thân mật.","lv":"i"}],"dlg":[{"s":"A","en":"Hey, I heard you passed the ISTQB exam. Congratulations!","vi":"Này, nghe nói bạn đậu ISTQB rồi. Chúc mừng nhé!"},{"s":"B","en":"Thanks! I was so stressed about it, but I finally made it.","vi":"Cảm ơn! Mình căng thẳng lắm, nhưng cuối cùng cũng đậu."},{"s":"A","en":"I'm so happy for you. You worked really hard.","vi":"Mình mừng cho bạn lắm. Bạn đã cố gắng rất nhiều."},{"s":"B","en":"Thank you. I really appreciate it. How about you? You seem a bit down.","vi":"Cảm ơn nhé. Còn bạn thì sao? Trông bạn hơi buồn."},{"s":"A","en":"Yeah, my release got delayed because of a critical bug.","vi":"Ừ, bản release của mình bị lùi vì một con bug nghiêm trọng."},{"s":"B","en":"I'm sorry to hear that. Hang in there, it'll get better.","vi":"Nghe vậy tiếc ghê. Cố lên, mọi chuyện sẽ ổn thôi."},{"s":"A","en":"Thanks. I just need to find the root cause.","vi":"Cảm ơn. Mình chỉ cần tìm ra nguyên nhân gốc."},{"s":"B","en":"You've got this! Let me know if there's anything I can do.","vi":"Bạn làm được mà! Có gì mình giúp được thì cứ nói nhé."}]}],"mis":[{"wrong":"I very like this app.","right":"I really like this app.","vi":"Tôi rất thích ứng dụng này.","why":"'Very' không đứng trước động từ; dùng really hoặc ...very much.","g":"Ngữ pháp"},{"wrong":"We need to discuss about the bug.","right":"We need to discuss the bug.","vi":"Chúng ta cần thảo luận về con bug.","why":"'Discuss' là ngoại động từ, đi thẳng với tân ngữ, không cần 'about'.","g":"Giới từ"},{"wrong":"Can you explain me this error?","right":"Can you explain this error to me?","vi":"Bạn giải thích lỗi này cho tôi được không?","why":"Cấu trúc đúng: explain something to someone. Không nói 'explain me'.","g":"Ngữ pháp"},{"wrong":"I have a question want to ask.","right":"I have a question I want to ask.","vi":"Tôi có một câu hỏi muốn hỏi.","why":"Dịch từng chữ thiếu chủ ngữ 'I'. Gọn hơn nữa: 'I have a question.'","g":"Dịch từng chữ"},{"wrong":"How to say this in English?","right":"How do you say this in English?","vi":"Cái này tiếng Anh nói thế nào?","why":"'How to...' không phải câu hỏi hoàn chỉnh; cần trợ động từ: How do you say...?","g":"Ngữ pháp"},{"wrong":"Please open the light.","right":"Please turn on the light.","vi":"Bật đèn lên giúp tôi.","why":"Thiết bị điện dùng turn on/off (switch on/off), không dùng open/close.","g":"Dùng từ"},{"wrong":"Can I lend your charger?","right":"Can I borrow your charger?","vi":"Tôi mượn sạc của bạn được không?","why":"Borrow = mượn (lấy về mình); lend = cho mượn (đưa đi).","g":"Dùng từ"},{"wrong":"I'm so boring at home this weekend.","right":"I'm so bored at home this weekend.","vi":"Cuối tuần ở nhà tôi chán quá.","why":"Bored = cảm thấy chán; boring = gây chán. 'I'm boring' nghĩa là tôi là người nhạt nhẽo.","g":"Dùng từ"},{"wrong":"I'm agree with you.","right":"I agree with you.","vi":"Tôi đồng ý với bạn.","why":"'Agree' là động từ, không dùng với 'am'.","g":"Ngữ pháp"},{"wrong":"Can you help me checking this test case?","right":"Can you help me check this test cas
