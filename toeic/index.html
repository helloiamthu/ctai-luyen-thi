"'You might want to submit them this week, before the switch' – nộp hóa đơn sớm trong tuần này. Bẫy A: nhóm IT mới là bên ghi hình buổi đào tạo."}]},{"conv":[{"s":"W","t":"Hi, I'm a member here at Zenith Fitness. My company is sending me to our Singapore office for three months, so I'd like to cancel my membership.","vi":"Chào anh, tôi là hội viên ở Zenith Fitness. Công ty cử tôi sang văn phòng Singapore ba tháng nên tôi muốn hủy thẻ hội viên."},{"s":"M","t":"I can help with that. But before you cancel, you might want to know that we offer a membership freeze for up to four months.","vi":"Tôi có thể giúp chị. Nhưng trước khi hủy, chị nên biết chúng tôi có dịch vụ tạm ngưng thẻ hội viên tối đa bốn tháng."},{"s":"W","t":"A freeze? How does that work?","vi":"Tạm ngưng à? Nó hoạt động thế nào?"},{"s":"M","t":"You pay a small fee of ten dollars a month, and your current rate is locked in. If you cancel now and rejoin later, you'd have to pay the new rate, which goes up in January.","vi":"Chị trả một khoản phí nhỏ mười đô la mỗi tháng và mức giá hiện tại của chị được giữ nguyên. Nếu chị hủy bây giờ rồi đăng ký lại sau, chị sẽ phải trả mức giá mới, sẽ tăng vào tháng Một."},{"s":"W","t":"Oh, I didn't realize prices were increasing. Then a freeze makes more sense.","vi":"Ồ, tôi không biết là giá sắp tăng. Vậy thì tạm ngưng hợp lý hơn."},{"s":"M","t":"Great. I just need you to fill out this form and show me a photo ID.","vi":"Tốt quá. Tôi chỉ cần chị điền mẫu đơn này và cho tôi xem giấy tờ tùy thân có ảnh."},{"s":"W","t":"Here's my driver's license. Can the freeze start on the first of next month? I'll be here for two more weeks.","vi":"Đây là bằng lái xe của tôi. Việc tạm ngưng có thể bắt đầu từ ngày mùng một tháng sau không? Tôi còn ở đây thêm hai tuần nữa."},{"s":"M","t":"Sure. I'll set the start date for the first.","vi":"Được chứ. Tôi sẽ đặt ngày bắt đầu là mùng một."}],"qs":[{"q":"Why does the woman want to cancel her membership?","o":["She is unhappy with the service.","She will be working abroad.","She has found a cheaper gym.","She has been injured."],"a":1,"ex":"'My company is sending me to our Singapore office for three months' – cô sẽ đi làm ở nước ngoài. Không có chi tiết về việc không hài lòng hay chấn thương."},{"q":"What does the man say will happen in January?","o":["A new branch will open.","Classes will be rescheduled.","The gym will close for renovations.","Membership fees will rise."],"a":3,"ex":"'the new rate, which goes up in January' – phí hội viên tăng vào tháng Một; 'fees will rise' là cách diễn đạt lại của 'rate goes up'."},{"q":"What does the man ask the woman to provide?","o":["Identification","A payment card","A medical certificate","A forwarding address"],"a":0,"ex":"'show me a photo ID' – giấy tờ tùy thân; cô đưa bằng lái xe. Các lựa chọn khác không được yêu cầu."}]},{"conv":[{"s":"M","t":"Hi, Wendy. Have you heard back from the designer about the cover for Ms. Novak's cookbook?","vi":"Chào Wendy. Chị đã nhận được phản hồi của nhà thiết kế về bìa sách nấu ăn của bà Novak chưa?"},{"s":"W","t":"Yes, she sent three versions this morning. The problem is that Ms. Novak doesn't like any of them. She says the colors are too dark for a book about summer recipes.","vi":"Rồi, sáng nay cô ấy gửi ba phiên bản. Vấn đề là bà Novak không thích bản nào cả. Bà ấy nói màu quá tối cho một cuốn sách về món ăn mùa hè."},{"s":"M","t":"That's a concern. The printer needs the final files by the fifteenth, or we'll lose our slot and the release will be pushed back to spring.","vi":"Đáng lo đấy. Nhà in cần tệp hoàn chỉnh trước ngày mười lăm, nếu không chúng ta sẽ mất suất in và ngày phát hành bị lùi đến mùa xuân."},{"s":"W","t":"I know. I was thinking we could use one of the photos from the book itself, the one of the fruit salad on the beach. Ms. Novak said that was her favorite shot.","vi":"Tôi biết. Tôi nghĩ chúng ta có thể dùng một bức ảnh trong chính cuốn sách, bức salad trái cây trên bãi biển. Bà Novak nói đó là tấm ảnh bà thích nhất."},{"s":"M","t":"That's a smart idea. It would save the designer a lot of time, too.","vi":"Ý tưởng thông minh đấy. Nó cũng sẽ tiết kiệm cho nhà thiết kế nhiều thời gian."},{"s":"W","t":"I'll ask the designer to create a mock-up with that photo today.","vi":"Hôm nay tôi sẽ nhờ nhà thiết kế làm một bản mẫu với bức ảnh đó."},{"s":"M","t":"And let's schedule a video call with Ms. Novak on Thursday so we can get her approval quickly.","vi":"Và hãy lên lịch một cuộc gọi video với bà Novak vào thứ Năm để nhanh chóng được bà ấy duyệt."}],"qs":[{"q":"What is the conversation mainly about?","o":["A recipe contest","A printing error","A book cover design","A photography workshop"],"a":2,"ex":"Hai người bàn về 'the cover for Ms. Novak's cookbook' – thiết kế bìa sách. Bẫy B: nhà in được nhắc đến nhưng không có lỗi in."},{"q":"According to the man, what will happen if a deadline is missed?","o":["A publication will be delayed.","A fee will be charged.","A designer will be replaced.","A contract will be canceled."],"a":0,"ex":"'...or we'll lose our slot and the release will be pushed back to spring' – việc phát hành bị lùi, tức là xuất bản bị trì hoãn."},{"q":"What does the man suggest?","o":["Hiring a different designer","Changing the book's title","Printing fewer copies","Arranging a meeting with an author"],"a":3,"ex":"'let's schedule a video call with Ms. Novak on Thursday' – sắp xếp cuộc họp (gọi video) với tác giả. Việc dùng ảnh trong sách là đề xuất của người phụ nữ."}]},{"conv":[{"s":"W","t":"Did you see the e-mail from Facilities? The main parking lot will be closed for repaving starting next Monday.","vi":"Anh có thấy e-mail của bộ phận Cơ sở vật chất không? Bãi đỗ xe chính sẽ đóng cửa để trải lại mặt đường bắt đầu từ thứ Hai tới."},{"s":"M","t":"Yes, for two weeks. Employees are supposed to park at the Westfield Stadium lot instead.","vi":"Có, trong hai tuần. Nhân viên sẽ phải đỗ xe ở bãi của sân vận động Westfield thay thế."},{"s":"W","t":"But that's almost two kilometers away. I usually arrive just before my eight-thirty meetings.","vi":"Nhưng chỗ đó cách gần hai cây số. Tôi thường đến ngay trước các cuộc họp lúc tám giờ rưỡi."},{"s":"M","t":"Well, the shuttle leaves every ten minutes.","vi":"Ừ thì, xe đưa đón cứ mười phút có một chuyến."},{"s":"W","t":"OK, that's not so bad. Does it run in the evening too? I sometimes stay until seven.","vi":"Ồ, vậy cũng không tệ lắm. Buổi tối xe có chạy không? Đôi khi tôi ở lại đến bảy giờ."},{"s":"M","t":"The e-mail said the last shuttle leaves our building at seven-fifteen.","vi":"E-mail nói chuyến cuối cùng rời tòa nhà mình lúc bảy giờ mười lăm."},{"s":"W","t":"Good. I think I'll also ask Ms. Yamada if I can work from home a couple of days during the repaving.","vi":"Tốt. Tôi nghĩ tôi cũng sẽ hỏi bà Yamada xem tôi có thể làm việc ở nhà vài ngày trong thời gian sửa đường không."},{"s":"M","t":"That's what I'm planning to do on Fridays.","vi":"Tôi cũng định làm thế vào các ngày thứ Sáu."}],"qs":[{"q":"What will begin next Monday?","o":["A construction project","A training program","A sports event","A new work schedule"],"a":0,"ex":"'The main parking lot will be closed for repaving starting next Monday' – việc trải lại mặt đường là một dự án thi công. Bẫy C: sân vận động chỉ là nơi đỗ xe thay thế."},{"q":"What does the man mean when he says, \"Well, the shuttle leaves every ten minutes\"?","o":["The shuttle is often crowded.","The woman should leave home earlier.","The woman will not have to wait long.","The shuttle schedule has recently changed."],"a":2,"ex":"Người phụ nữ lo bãi xe xa sẽ làm cô trễ họp; anh trấn an rằng xe chạy dày nên cô không phải chờ lâu. Cô đáp 'that's not so bad', xác nhận ý này."},{"q":"What does the woman say she will do?","o":["Take a later shuttle","Ask about working remotely","Reschedule her meetings","Buy a parking permit"],"a":1,"ex":"'I'll also ask Ms. Yamada if I can work from home a couple of days' – hỏi về việc làm việc từ xa. 'work from home' được diễn đạt lại thành 'working remotely'."}]},{"conv":[{"s":"W","t":"Thanks for joining me, Victor and Samuel. The client for the Orchard Lane library project called. They want to add a reading room on the second floor.","vi":"Cảm ơn Victor và Samuel đã đến. Khách hàng của dự án thư viện Orchard Lane vừa gọi. Họ muốn thêm một phòng đọc ở tầng hai."},{"s":"M","t":"A reading room? That'll change the whole layout of the upper level.","vi":"Phòng đọc ư? Điều đó sẽ làm thay đổi toàn bộ bố cục tầng trên."},{"s":"M2","t":"It also affects the budget. The client approved two point four million dollars, and we're already close to that.","vi":"Nó còn ảnh hưởng đến ngân sách. Khách hàng đã duyệt 2,4 triệu đô la và chúng ta gần chạm mức đó rồi."},{"s":"W","t":"I asked about that. They said they're applying for a city grant that could cover the extra cost.","vi":"Tôi đã hỏi về chuyện đó. Họ nói họ đang xin một khoản tài trợ của thành phố có thể trang trải chi phí phát sinh."},{"s":"M","t":"When will they know if they've received it?","vi":"Khi nào họ biết có nhận được hay không?"},{"s":"W","t":"Not until the end of next month.","vi":"Phải đến cuối tháng sau."},{"s":"M2","t":"Then I suggest we prepare two versions of the floor plan, one with the reading room and one without, so construction isn't delayed either way.","vi":"Vậy tôi đề nghị chúng ta chuẩn bị hai phiên bản mặt bằng, một có phòng đọc và một không có, để dù thế nào việc thi công cũng không bị chậm."},{"s":"W","t":"Good thinking, Samuel. Victor, could you start on the revised drawings? I'll set up a meeting with the client to walk them through both options.","vi":"Ý hay đấy, Samuel. Victor, anh bắt đầu làm bản vẽ sửa đổi được không? Tôi sẽ sắp xếp cuộc họp với khách hàng để trình bày cả hai phương án."}],"qs":[{"q":"What type of building are the speakers discussing?","o":["A hospital","A hotel","A school","A library"],"a":3,"ex":"Ngay câu đầu: 'the Orchard Lane library project' – dự án thư viện. 'reading room' cũng củng cố đáp án."},{"q":"What concern does Samuel raise?","o":["A permit has expired.","A project may exceed its budget.","A construction crew is unavailable.","A design is too traditional."],"a":1,"ex":"Samuel nói 'It also affects the budget... we're already close to that' – lo dự án vượt ngân sách. Bẫy: Victor mới là người lo về bố cục tầng trên."},{"q":"What does Samuel suggest doing?","o":["Applying for a city grant","Hiring an additional architect","Preparing two different plans","Postponing a client meeting"],"a":2,"ex":"'I suggest we prepare two versions of the floor plan' – chuẩn bị hai phương án. Bẫy A: xin tài trợ thành phố là việc của khách hàng, không phải đề xuất của Samuel."}]},{"conv":[{"s":"M","t":"Paula, Rita, do you have a minute? I just got the results of our customer survey for the Oakdale store.","vi":"Paula, Rita, hai chị có rảnh một phút không? Tôi vừa nhận kết quả khảo sát khách hàng của cửa hàng Oakdale."},{"s":"W","t":"Sure. How did we do?","vi":"Được chứ. Chúng ta làm thế nào?"},{"s":"M","t":"Overall, pretty well. But a lot of shoppers complained about long lines at the checkout on weekends.","vi":"Nhìn chung khá tốt. Nhưng nhiều khách phàn nàn về việc xếp hàng dài ở quầy thanh toán vào cuối tuần."},{"s":"W2","t":"That's not surprising. On Saturdays we only have three cashiers working, and the store is packed.","vi":"Chẳng có gì ngạc nhiên. Thứ Bảy chúng ta chỉ có ba thu ngân làm việc mà cửa hàng thì đông nghẹt."},{"s":"W","t":"What about installing self-checkout machines? The store across the street added four last year.","vi":"Còn việc lắp máy tự thanh toán thì sao? Cửa hàng bên kia đường đã lắp thêm bốn máy năm ngoái."},{"s":"M","t":"Head office is considering it, but it won't happen before next year. For now, I'd like to add a cashier on weekend afternoons.","vi":"Trụ sở chính đang cân nhắc việc đó, nhưng phải sang năm mới có. Trước mắt, tôi muốn thêm một thu ngân vào các buổi chiều cuối tuần."},{"s":"W2","t":"I could work extra hours on Saturdays. I've been looking for more shifts.","vi":"Tôi có thể làm thêm giờ vào thứ Bảy. Tôi đang muốn có thêm ca làm."},{"s":"M","t":"That would be great, Rita. Come by my office after lunch, and we'll update the schedule.","vi":"Vậy thì tuyệt quá, Rita. Sau bữa trưa chị ghé văn phòng tôi, chúng ta sẽ cập nhật lịch làm việc."}],"qs":[{"q":"What did many customers complain about?","o":["Product prices","Store hours","Waiting times","Parking availability"],"a":2,"ex":"'complained about long lines at the checkout on weekends' – xếp hàng dài nghĩa là thời gian chờ lâu. Các đáp án khác không được nhắc đến."},{"q":"According to the man, what is head office considering?","o":["Opening a new store","Extending business hours","Hiring a regional manager","Installing some machines"],"a":3,"ex":"Khi Paula đề xuất máy tự thanh toán, người đàn ông nói 'Head office is considering it'. Bẫy A: cửa hàng bên kia đường chỉ là ví dụ so sánh."},{"q":"What does Rita offer to do?","o":["Work additional shifts","Train new employees","Contact head office","Conduct another survey"],"a":0,"ex":"Rita (W2) nói 'I could work extra hours on Saturdays' – làm thêm ca. Cần nhận ra Rita là người được gọi tên ở cuối hội thoại."}]},{"conv":[{"s":"W","t":"Hello, Mr. Quinn? This is Teresa Vance from the Pacific Retail Conference. I'm calling to confirm the details of your keynote speech on Wednesday.","vi":"Xin chào, ông Quinn phải không? Tôi là Teresa Vance từ Hội nghị Bán lẻ Thái Bình Dương. Tôi gọi để xác nhận chi tiết bài phát biểu chính của ông vào thứ Tư."},{"s":"M","t":"Hi, Teresa. Actually, I was just about to call you. My flight from Denver was canceled because of a snowstorm, and the next available flight doesn't arrive until Thursday.","vi":"Chào Teresa. Thật ra tôi cũng định gọi cho chị. Chuyến bay của tôi từ Denver bị hủy do bão tuyết, và chuyến còn chỗ tiếp theo phải đến thứ Năm mới tới nơi."},{"s":"W","t":"Oh no. Your talk is the highlight of the opening session.","vi":"Ôi không. Bài nói của ông là điểm nhấn của phiên khai mạc."},{"s":"M","t":"I know, and I'm really sorry. Would it be possible for me to give the presentation by video link instead?","vi":"Tôi biết, và tôi thực sự xin lỗi. Liệu tôi có thể trình bày qua kết nối video thay thế được không?"},{"s":"W","t":"I think so. The main hall has a large screen and good audio equipment. Let me check with our technical team, though.","vi":"Tôi nghĩ là được. Hội trường chính có màn hình lớn và thiết bị âm thanh tốt. Nhưng để tôi kiểm tra lại với nhóm kỹ thuật đã."},{"s":"M","t":"Thanks. I can also send my slides in advance so they can be displayed in the hall.","vi":"Cảm ơn chị. Tôi cũng có thể gửi trước các trang trình chiếu để chiếu trong hội trường."},{"s":"W","t":"That would be helpful. Please e-mail them to me by tomorrow, and I'll arrange a test call with our technicians on Tuesday.","vi":"Như vậy sẽ rất hữu ích. Ông vui lòng gửi e-mail cho tôi trước ngày mai, và tôi sẽ sắp xếp một cuộc gọi thử với kỹ thuật viên vào thứ Ba."}],"qs":[{"q":"Who most likely is the man?","o":["A conference organizer","A guest speaker","A travel agent","A sound technician"],"a":1,"ex":"Người phụ nữ gọi để xác nhận 'your keynote speech' – ông là diễn giả chính được mời. Bẫy A: người phụ nữ mới là người tổ chức hội nghị."},{"q":"What problem does the man mention?","o":["His flight was canceled.","His presentation is unfinished.","A hotel is fully booked.","A hall is too small."],"a":0,"ex":"'My flight from Denver was canceled because of a snowstorm' – chuyến bay bị hủy."},{"q":"What does the woman ask the man to do?","o":["Book a later flight","Call the technical team","Shorten his speech","Send some materials"],"a":3,"ex":"'Please e-mail them to me by tomorrow' – gửi các trang trình chiếu (materials). Bẫy B: chính người phụ nữ sẽ liên hệ nhóm kỹ thuật."}]},{"conv":[{"s":"W","t":"Hi, I'm calling from Nexus Consulting. We're holding a training workshop next Tuesday, and I'd like to order lunch for forty people.","vi":"Xin chào, tôi gọi từ Nexus Consulting. Chúng tôi tổ chức một buổi hội thảo đào tạo vào thứ Ba tới và tôi muốn đặt bữa trưa cho bốn mươi người."},{"s":"M","t":"Certainly. Have you seen the lunch packages on our Web site?","vi":"Vâng. Chị đã xem các gói bữa trưa trên trang web của chúng tôi chưa?"},{"s":"W","t":"Yes. Our participants will be there all day, so I'd like to serve a hot meal rather than sandwiches. And dessert would be nice.","vi":"Rồi. Học viên của chúng tôi ở đó cả ngày nên tôi muốn phục vụ món nóng thay vì bánh mì kẹp. Và có món tráng miệng thì tốt."},{"s":"M","t":"Then you have two options. Would you also like soup?","vi":"Vậy chị có hai lựa chọn. Chị có muốn thêm súp không?"},{"s":"W","t":"That's not necessary. Our budget is limited to twenty dollars per person.","vi":"Không cần đâu. Ngân sách của chúng tôi giới hạn ở hai mươi đô la mỗi người."},{"s":"M","t":"Understood. Could I also get the address of the venue?","vi":"Tôi hiểu rồi. Chị cho tôi xin địa chỉ địa điểm tổ chức được không?"},{"s":"W","t":"It's at our office, 210 Ridge Street, on the fourth floor. Is there a delivery charge?","vi":"Ở văn phòng chúng tôi, số 210 phố Ridge, tầng bốn. Có tính phí giao hàng không?"},{"s":"M","t":"For orders of over thirty people, delivery is free. We'll arrive at eleven forty-five to set up.","vi":"Với đơn trên ba mươi người, giao hàng miễn phí. Chúng tôi sẽ đến lúc mười một giờ bốn mươi lăm để bày biện."}],"graphic":{"title":"Sunrise Catering - Lunch Packages","rows":[["Package","Includes","Price per person"],["Basic","Sandwiches, salad","$12"],["Standard","Sandwiches, salad, soup","$15"],["Deluxe","Hot entrée, salad, dessert","$19"],["Premium","Hot entrée, soup, salad, dessert","$24"]]},"qs":[{"q":"What event is the woman organizing?","o":["A training workshop","A retirement party","A product launch","A client dinner"],"a":0,"ex":"'We're holding a training workshop next Tuesday' – một buổi hội thảo đào tạo."},{"q":"Look at the graphic. Which package will the woman most likely order?","o":["Basic","Standard","Deluxe","Premium"],"a":2,"ex":"Cô muốn món nóng và tráng miệng (chỉ Deluxe và Premium có), không cần súp và ngân sách tối đa 20 đô/người. Premium có súp và giá 24 đô nên loại; Deluxe 19 đô là phù hợp."},{"q":"What does the man say about delivery?","o":["It must be scheduled a week in advance.","It will be free of charge.","It is available only in the morning.","It requires a signature."],"a":1,"ex":"'For orders of over thirty people, delivery is free' – đơn 40 người nên được giao miễn phí. Giờ đến 11:45 không có nghĩa là chỉ giao buổi sáng."}]},{"conv":[{"s":"M","t":"Hi, Yolanda. I signed up for the Data Privacy session on Thursday, but my manager just scheduled a department meeting at the same time.","vi":"Chào Yolanda. Tôi đã đăng ký buổi Bảo mật dữ liệu vào thứ Năm, nhưng quản lý của tôi vừa lên lịch một cuộc họp phòng ban vào cùng giờ đó."},{"s":"W","t":"That's no problem, Nathan. The Data Privacy session is being offered again next month, so you could take it then.","vi":"Không sao đâu, Nathan. Buổi Bảo mật dữ liệu sẽ được tổ chức lại vào tháng sau, anh có thể học lúc đó."},{"s":"M","t":"Actually, I'd prefer to attend something this week. Is there anything in the afternoon that still has space?","vi":"Thật ra tôi muốn tham dự một buổi nào đó trong tuần này. Buổi chiều có buổi nào còn chỗ không?"},{"s":"W","t":"Let me check. The Leadership Skills session is full, but the last session of the day has a few seats left.","vi":"Để tôi kiểm tra. Buổi Kỹ năng lãnh đạo đã kín chỗ, nhưng buổi cuối cùng trong ngày vẫn còn vài chỗ."},{"s":"M","t":"Great, I'll take that one. I've been wanting to get better at organizing my workload anyway.","vi":"Tuyệt, tôi chọn buổi đó. Dù sao tôi cũng đang muốn sắp xếp công việc của mình tốt hơn."},{"s":"W","t":"OK, I've moved you. Just remember to bring your laptop. The trainer will be showing everyone a new scheduling app.","vi":"Được rồi, tôi đã chuyển anh sang. Chỉ cần nhớ mang theo máy tính xách tay. Giảng viên sẽ hướng dẫn mọi người một ứng dụng lập lịch mới."},{"s":"M","t":"Will do. Thanks for your help.","vi":"Tôi sẽ nhớ. Cảm ơn chị đã giúp."}],"graphic":{"title":"Thursday Training Sessions","rows":[["Time","Session","Room"],["9:00 A.M.","Customer Service Basics","Room 101"],["10:30 A.M.","Data Privacy","Room 204"],["1:00 P.M.","Leadership Skills","Room 101"],["2:30 P.M.","Time Management","Room 310"]]},"qs":[{"q":"Why does the man want to change his session?","o":["He will be on vacation.","He has to meet a client.","He has to train new staff.","He has a scheduling conflict."],"a":3,"ex":"Quản lý xếp 'a department meeting at the same time' – trùng lịch với buổi đào tạo. Bẫy B: cuộc họp là họp phòng ban, không phải gặp khách hàng."},{"q":"Look at the graphic. Where will the man go on Thursday afternoon?","o":["Room 101","Room 310","Room 204","Room 104"],"a":1,"ex":"Buổi Leadership Skills đã kín nên anh chọn 'the last session of the day' – Time Management lúc 2:30, ở phòng 310 theo bảng. Bẫy A: phòng 101 là buổi Leadership đã kín chỗ; C là phòng của buổi Data Privacy ban đầu."},{"q":"What does the woman remind the man to do?","o":["Arrive early","Register online","Bring a computer","Download an application"],"a":2,"ex":"'remember to bring your laptop' – mang máy tính. Bẫy D: ứng dụng lập lịch sẽ được giảng viên giới thiệu, cô không yêu cầu anh tải trước."}]},{"conv":[{"s":"W","t":"Hello, I'm calling about the apartments listed on the Westbrook Residences Web site. I'm moving to the city for a new job that starts on November third.","vi":"Xin chào, tôi gọi về các căn hộ đăng trên trang web của Westbrook Residences. Tôi sắp chuyển đến thành phố vì một công việc mới bắt đầu vào ngày 3 tháng Mười Một."},{"s":"M","t":"Welcome! How many bedrooms are you looking for?","vi":"Chào mừng chị! Chị đang tìm căn có mấy phòng ngủ?"},{"s":"W","t":"Two. I work from home a couple of days a week, so I need a second room as an office.","vi":"Hai phòng. Tôi làm việc ở nhà vài ngày mỗi tuần nên cần một phòng thứ hai làm văn phòng."},{"s":"M","t":"And you'd need something available by the beginning of November, right?","vi":"Và chị cần căn có thể vào ở từ đầu tháng Mười Một, đúng không?"},{"s":"W","t":"Exactly. I'll need to move in before my start date.","vi":"Chính xác. Tôi cần dọn vào trước ngày bắt đầu đi làm."},{"s":"M","t":"Then there's only one unit that would work for you. It's on the fourth floor and gets a lot of natural light.","vi":"Vậy thì chỉ có một căn phù hợp với chị. Căn đó ở tầng bốn và có nhiều ánh sáng tự nhiên."},{"s":"W","t":"That sounds nice. Is parking included in the rent?","vi":"Nghe hay đấy. Giá thuê có bao gồm chỗ đỗ xe không?"},{"s":"M","t":"There's an underground garage, but it costs an extra seventy-five dollars a month. Would you like to see the unit? I can give you a video tour this evening.","vi":"Có một gara ngầm, nhưng tốn thêm bảy mươi lăm đô la mỗi tháng. Chị có muốn xem căn hộ không? Tôi có thể dẫn chị xem qua video tối nay."},{"s":"W","t":"Yes, please. Around six would be good.","vi":"Vâng, làm ơn. Khoảng sáu giờ thì tốt."}],"graphic":{"title":"Westbrook Residences - Available Units","rows":[["Unit","Bedrooms","Monthly Rent","Available From"],["2A","1","$1,150","November 1"],["3C","2","$1,400","December 1"],["4B","2","$1,550","November 1"],["5D","3","$1,900","November 15"]]},"qs":[{"q":"Why is the woman moving?","o":["To be closer to her family","To start a new job","To attend a university","To pay lower rent"],"a":1,"ex":"'I'm moving to the city for a new job that starts on November third' – cô chuyển đến để bắt đầu công việc mới."},{"q":"Look at the graphic. How much is the monthly rent for the unit the man recommends?","o":["$1,150","$1,400","$1,900","$1,550"],"a":3,"ex":"Cô cần 2 phòng ngủ và dọn vào trước ngày 3/11. Căn 3C có 2 phòng nhưng đến 1/12 mới trống; căn 4B (tầng bốn, 2 phòng, trống từ 1/11) phù hợp, giá 1.550 đô. Bẫy B: 1.400 đô là căn 3C rẻ hơn nhưng trống quá muộn."},{"q":"What does the man offer to do?","o":["Give a virtual tour","Reduce the rent","Reserve a parking space","Send a lease agreement"],"a":0,"ex":"'I can give you a video tour this evening' – dẫn xem căn hộ qua video, tức là tham quan trực tuyến. Bẫy C: gara được nhắc đến nhưng anh không đề nghị giữ chỗ."}]}],"p4":[{"intro":"Questions refer to the following telephone message.","talk":"Hi, Mr. Osborne, this is Rachel Vance from Pinewood Office Interiors. I'm calling about the conference tables you ordered for your company's new branch. Unfortunately, our supplier has just informed us that the walnut finish you selected won't be available until the end of next month. Since you mentioned that the branch opens on the fifteenth, I'd like to suggest an alternative. We have the same model in a dark oak finish, which is in stock and could be delivered this Friday. I've just e-mailed you a photo so you can compare the two finishes. If you decide to switch, there'd be no extra charge. Please call me back at 555-0148 by Wednesday so that I can reserve one of our delivery trucks.","vi":"Chào ông Osborne, tôi là Rachel Vance từ Pinewood Office Interiors. Tôi gọi về những chiếc bàn hội nghị ông đã đặt cho chi nhánh mới của công ty ông. Thật không may, nhà cung cấp của chúng tôi vừa báo rằng lớp hoàn thiện gỗ óc chó ông chọn sẽ không có cho đến cuối tháng sau. Vì ông có nói chi nhánh khai trương vào ngày 15, tôi muốn đề xuất một phương án khác. Chúng tôi có cùng mẫu đó với lớp hoàn thiện gỗ sồi sẫm màu, hiện còn hàng và có thể giao vào thứ Sáu này. Tôi vừa gửi e-mail cho ông một bức ảnh để ông so sánh hai lớp hoàn thiện. Nếu ông quyết định đổi thì sẽ không mất thêm phí. Vui lòng gọi lại cho tôi theo số 555-0148 trước thứ Tư để tôi có thể giữ một xe giao hàng.","qs":[{"q":"Why is the speaker calling?","o":["To confirm a delivery address","To report a delay in product availability","To request a payment","To schedule a furniture installation"],"a":1,"ex":"Người nói báo lớp hoàn thiện gỗ óc chó 'won't be available until the end of next month' — tức là sản phẩm bị chậm. Các đáp án về địa chỉ, thanh toán, lắp đặt không được nhắc tới; 'delivered' xuất hiện trong bài là bẫy lặp từ cho A."},{"q":"What did the speaker send to the listener?","o":["A revised invoice","A product catalog","A delivery schedule","A photograph"],"a":3,"ex":"Câu 'I've just e-mailed you a photo so you can compare the two finishes' cho thấy cô gửi một bức ảnh. 'Catalog' là bẫy vì cùng liên quan đến mẫu sản phẩm nhưng không được nhắc."},{"q":"Why does the speaker ask the listener to call back by Wednesday?","o":["So that she can book a delivery vehicle","So that she can approve a discount","So that he can visit a showroom","So that he can cancel an order"],"a":0,"ex":"Cô nói 'call me back ... by Wednesday so that I can reserve one of our delivery trucks' — 'reserve a truck' được diễn đạt lại thành 'book a delivery vehicle'. 'No extra charge' không phải là giảm giá nên B sai."}]},{"intro":"Questions refer to the following excerpt from a meeting.","talk":"Before we wrap up today's staff meeting, I have an update about the Quentin Street warehouse. As you know, we've been testing a new inventory-tracking system there since March. The results have been impressive: picking errors dropped by nearly forty percent, and orders are leaving the building faster than ever. Because of that, management has decided to install the system at our other two warehouses starting in July. Now, I know some of you are worried about learning new software during our busiest season. To make the transition easier, Norah Pryce, who led the pilot at Quentin Street, will run hands-on workshops at each site next month. A sign-up sheet is posted in the break room, so please add your name by Friday.","vi":"Trước khi kết thúc cuộc họp nhân viên hôm nay, tôi có thông tin cập nhật về kho hàng phố Quentin. Như các bạn biết, chúng ta đã thử nghiệm một hệ thống theo dõi hàng tồn kho mới ở đó từ tháng Ba. Kết quả rất ấn tượng: lỗi lấy hàng giảm gần bốn mươi phần trăm, và đơn hàng rời kho nhanh hơn bao giờ hết. Vì vậy, ban quản lý quyết định lắp đặt hệ thống này tại hai kho còn lại bắt đầu từ tháng Bảy. Tôi biết một số bạn lo lắng về việc học phần mềm mới trong mùa cao điểm nhất. Để việc chuyển đổi dễ dàng hơn, Norah Pryce, người dẫn dắt đợt thử nghiệm ở phố Quentin, sẽ tổ chức các buổi hướng dẫn thực hành tại mỗi địa điểm vào tháng tới. Bảng đăng ký được dán ở phòng nghỉ, vì vậy hãy ghi tên trước thứ Sáu.","qs":[{"q":"What is the talk mainly about?","o":["The relocation of a warehouse","A new hiring policy","The expansion of a tracking system","A change in shipping carriers"],"a":2,"ex":"Nội dung chính: hệ thống theo dõi hàng tồn kho thử ở phố Quentin sẽ được 'install ... at our other two warehouses' — tức là mở rộng. A là bẫy vì nhắc đến 'warehouse' nhưng không có việc di dời."},{"q":"What concern does the speaker mention?","o":["Employees may struggle with new software during a busy period","Installation costs may be higher than expected","Storage space may be insufficient","Shipments may be delayed in July"],"a":0,"ex":"Câu 'some of you are worried about learning new software during our busiest season' khớp với A. 'July' xuất hiện trong bài là thời điểm lắp đặt, không phải lo ngại giao hàng chậm, nên D là bẫy."},{"q":"What are the listeners asked to do?","o":["Review a performance report","Contact Ms. Pryce directly","Visit the Quentin Street warehouse","Register for a training session"],"a":3,"ex":"Người nói yêu cầu 'add your name' vào bảng đăng ký các buổi 'hands-on workshops' → đăng ký khóa đào tạo. Tên Ms. Pryce và phố Quentin được nhắc đến nhưng không có yêu cầu liên hệ hay đến thăm."}]},{"intro":"Questions refer to the following broadcast.","talk":"This is Sam Whitaker with your morning traffic update on Radio Northbay. Drivers heading downtown should expect delays on Route 9, where crews are repaving the two right lanes near the Ortega Bridge. The work was supposed to finish last week, but heavy rain pushed the schedule back. City officials now say the lanes will reopen by Thursday evening. In the meantime, if you normally cross the bridge, you might consider the Riverside Parkway instead. It adds a few kilometers to your trip, but it's moving smoothly this morning. And if you're planning to take the train into the city, the Northbay Line is running on its weekend schedule today because of signal maintenance. I'd check the timetable before you leave.","vi":"Tôi là Sam Whitaker với bản tin giao thông buổi sáng trên Radio Northbay. Tài xế đi vào trung tâm nên chuẩn bị cho tình trạng chậm trễ trên Quốc lộ 9, nơi công nhân đang trải nhựa lại hai làn bên phải gần cầu Ortega. Công việc lẽ ra phải xong vào tuần trước, nhưng mưa lớn đã làm chậm tiến độ. Chính quyền thành phố hiện cho biết các làn sẽ thông xe trước tối thứ Năm. Trong lúc đó, nếu bạn thường đi qua cầu, bạn có thể cân nhắc đi đường Riverside Parkway. Nó làm chuyến đi dài thêm vài ki-lô-mét, nhưng sáng nay giao thông ở đó rất thông suốt. Và nếu bạn định đi tàu vào thành phố, tuyến Northbay hôm nay chạy theo lịch cuối tuần do bảo trì tín hiệu. Tôi sẽ kiểm tra lịch tàu trước khi ra khỏi nhà.","qs":[{"q":"What is causing delays on Route 9?","o":["A traffic accident","A sports event","A broken traffic signal","Road construction"],"a":3,"ex":"Bài nói 'crews are repaving the two right lanes' — trải nhựa lại đường là công trình làm đường. 'Signal' xuất hiện trong bài nhưng liên quan đến tuyến tàu, nên C là bẫy lặp từ."},{"q":"What does the speaker recommend?","o":["Leaving home earlier than usual","Using an alternate route","Taking a bus downtown","Parking near the bridge"],"a":1,"ex":"Người nói gợi ý 'you might consider the Riverside Parkway instead' → đi đường khác. Các đáp án còn lại không được nhắc; D lặp lại từ 'bridge' để gây nhiễu."},{"q":"Why does the speaker say, \"I'd check the timetable before you leave\"?","o":["To promote a new mobile application","To apologize for an earlier error","To warn that trains may run less often than usual","To announce an increase in fares"],"a":2,"ex":"Ngay trước đó anh nói tuyến tàu 'is running on its weekend schedule today' — lịch cuối tuần thường thưa chuyến hơn, nên anh nhắc kiểm tra lịch để cảnh báo tàu có thể ít chuyến. Bài không nói đến ứng dụng, lời xin lỗi hay giá vé."}]},{"intro":"Questions refer to the following advertisement.","talk":"Is your small business spending too much time on bookkeeping? Let Tallis Ledger take care of it. Our cloud-based service connects directly to your bank account, so every transaction is recorded automatically—no more typing numbers into spreadsheets. And unlike other services, every Tallis Ledger subscription includes a dedicated accountant you can reach by phone whenever you have a question. Whether you run a café, a design studio, or a repair shop, we'll prepare your quarterly tax forms and make sure they're filed on time. Sign up on our Web site this month and you'll get your first three months at half price. Plus, the first fifty customers to register will receive a free consultation on reducing business expenses.","vi":"Doanh nghiệp nhỏ của bạn có đang tốn quá nhiều thời gian cho việc ghi sổ sách? Hãy để Tallis Ledger lo việc đó. Dịch vụ trên nền tảng đám mây của chúng tôi kết nối trực tiếp với tài khoản ngân hàng của bạn, nên mọi giao dịch được ghi nhận tự động — không còn phải gõ số vào bảng tính. Và khác với các dịch vụ khác, mỗi gói đăng ký Tallis Ledger đều có một kế toán viên riêng mà bạn có thể gọi điện bất cứ khi nào có thắc mắc. Dù bạn điều hành quán cà phê, studio thiết kế hay tiệm sửa chữa, chúng tôi sẽ chuẩn bị tờ khai thuế hằng quý và đảm bảo nộp đúng hạn. Đăng ký trên trang web của chúng tôi trong tháng này, bạn sẽ được giảm nửa giá cho ba tháng đầu. Ngoài ra, năm mươi khách hàng đăng ký đầu tiên sẽ nhận được buổi tư vấn miễn phí về cắt giảm chi phí kinh doanh.","qs":[{"q":"What type of service is being advertised?","o":["Accounting","Web design","Equipment repair","Banking"],"a":0,"ex":"Các từ khoá 'bookkeeping', 'dedicated accountant', 'tax forms' cho thấy đây là dịch vụ kế toán. 'Design studio', 'repair shop', 'bank account' chỉ là ví dụ/chi tiết phụ, là bẫy lặp từ."},{"q":"According to the speaker, how is Tallis Ledger different from its competitors?","o":["It does not charge a setup fee.","It offers same-day service.","Each customer is assigned a personal accountant.","It has offices across the country."],"a":2,"ex":"Cụm 'unlike other services' báo hiệu điểm khác biệt: 'every subscription includes a dedicated accountant' → mỗi khách có kế toán riêng. Các đáp án khác không được nhắc tới."},{"q":"What will some customers receive?","o":["A discount on tax filing","A free consultation","A gift card","An extended free trial"],"a":1,"ex":"'The first fifty customers to register will receive a free consultation' khớp với B. Ưu đãi giảm nửa giá áp dụng cho phí thuê bao ba tháng đầu, không phải phí khai thuế, nên A là bẫy."}]},{"intro":"Questions refer to the following news report.","talk":"In local business news, Sorrell Foods announced yesterday that it will open a new production facility in the town of Westbrook. The company, best known for its frozen soups, says the plant will create about two hundred jobs when it begins operating early next year. Company president Yvonne Stroud explained that the decision was driven largely by demand from overseas markets, where sales have doubled over the past two years. Westbrook was chosen, she added, because of its location next to a major rail line, which will lower transportation costs. Not everyone is pleased, however. Some residents have raised concerns about increased truck traffic near the town's elementary school. A public meeting to discuss the plans will be held at Westbrook Town Hall on March third.","vi":"Trong tin kinh doanh địa phương, hôm qua Sorrell Foods thông báo sẽ mở một cơ sở sản xuất mới tại thị trấn Westbrook. Công ty, nổi tiếng nhất với các loại súp đông lạnh, cho biết nhà máy sẽ tạo ra khoảng hai trăm việc làm khi đi vào hoạt động đầu năm sau. Chủ tịch công ty Yvonne Stroud giải thích rằng quyết định này chủ yếu xuất phát từ nhu cầu ở các thị trường nước ngoài, nơi doanh số đã tăng gấp đôi trong hai năm qua. Bà nói thêm, Westbrook được chọn vì nằm cạnh một tuyến đường sắt lớn, giúp giảm chi phí vận chuyển. Tuy nhiên, không phải ai cũng hài lòng. Một số cư dân bày tỏ lo ngại về lượng xe tải tăng lên gần trường tiểu học của thị trấn. Một cuộc họp công khai để thảo luận kế hoạch sẽ được tổ chức tại Tòa thị chính Westbrook vào ngày 3 tháng Ba.","qs":[{"q":"What did Sorrell Foods announce?","o":["A merger with another company","The opening of a new factory","The launch of a new product line","A change in its leadership"],"a":1,"ex":"'Will open a new production facility' được diễn đạt lại thành 'the opening of a new factory'. 'Frozen soups' là sản phẩm sẵn có chứ không phải dòng sản phẩm mới, nên C là bẫy."},{"q":"According to the report, why was Westbrook selected?","o":["It offered tax incentives.","It has a highly skilled workforce.","Land there is inexpensive.","It provides convenient access to rail transport."],"a":3,"ex":"Bà Stroud nói Westbrook được chọn 'because of its location next to a major rail line' → thuận tiện vận chuyển đường sắt. Việc 'create two hundred jobs' không có nghĩa là lực lượng lao động có tay nghề cao."},{"q":"What concern have some residents expressed?","o":["More vehicles near a school","Noise from the factory at night","The loss of local farmland","Rising housing costs"],"a":0,"ex":"Câu 'concerns about increased truck traffic near the town's elementary school' → nhiều xe cộ gần trường học. Các lo ngại về tiếng ồn, đất nông nghiệp, giá nhà không được nhắc tới."}]},{"intro":"Questions refer to the following excerpt from a meeting.","talk":"Thanks for coming, everyone. I want to talk about the customer survey results for our Nexa mobile banking app. Overall, ratings were positive, but one complaint came up again and again: users say it takes too many steps to update their payment information. Our design team has already sketched out a simpler process, and they want to start testing it with customers in two weeks. Now, Victor suggested that we wait until after the holiday season to make any changes. I understand his concern. But we received over three thousand comments about this issue. So, before Friday, I'd like each team leader to send me a list of staff who can help with the testing sessions. We'll need at least six people from customer support.","vi":"Cảm ơn mọi người đã đến. Tôi muốn nói về kết quả khảo sát khách hàng cho ứng dụng ngân hàng di động Nexa. Nhìn chung, đánh giá là tích cực, nhưng có một phàn nàn xuất hiện lặp đi lặp lại: người dùng nói rằng cần quá nhiều bước để cập nhật thông tin thanh toán. Nhóm thiết kế đã phác thảo một quy trình đơn giản hơn và họ muốn bắt đầu thử nghiệm với khách hàng trong hai tuần tới. Victor đề nghị chúng ta đợi đến sau mùa lễ mới thay đổi. Tôi hiểu mối lo của anh ấy. Nhưng chúng ta đã nhận hơn ba nghìn bình luận về vấn đề này. Vì vậy, trước thứ Sáu, tôi muốn mỗi trưởng nhóm gửi cho tôi danh sách nhân viên có thể hỗ trợ các buổi thử nghiệm. Chúng ta cần ít nhất sáu người từ bộ phận chăm sóc khách hàng.","qs":[{"q":"What is the speaker mainly discussing?","o":["Quarterly sales figures","A plan to hire new staff","Customer feedback on an application","A holiday marketing campaign"],"a":2,"ex":"Mở đầu bài: 'the customer survey results for our Nexa mobile banking app' và phàn nàn của người dùng → phản hồi của khách hàng về ứng dụng. 'Holiday season' chỉ là chi tiết phụ, D là bẫy."},{"q":"What does the speaker imply when she says, \"But we received over three thousand comments about this issue\"?","o":["The problem is too serious to postpone.","The survey received too many responses.","Most customers are satisfied with the app.","More staff are needed to answer customers."],"a":0,"ex":"Câu này đáp lại đề nghị chờ đến sau mùa lễ của Victor; 'But' cho thấy cô không đồng ý — số phàn nàn lớn chứng tỏ vấn đề cần xử lý ngay, không thể trì hoãn. D gây nhiễu vì sau đó có nhắc 'customer support' nhưng là để hỗ trợ thử nghiệm."},{"q":"What does the speaker ask team leaders to do?","o":["Update their payment information","Review the new design sketches","Postpone their vacations","Provide names of employees"],"a":3,"ex":"'I'd like each team leader to send me a list of staff' → cung cấp tên nhân viên. A lặp lại cụm 'payment information' trong lời phàn nàn của người dùng, là bẫy."}]},{"intro":"Questions refer to the following tour information.","talk":"Welcome to the Tollesby Glassworks, everyone. My name is Ursula, and I'll be guiding you through our factory today. This building has been producing handmade glassware since 1892, and many of the techniques you'll see haven't changed much since then. In a moment, we'll walk over to the furnace room, where our artisans shape glass at temperatures above one thousand degrees. Because of the heat, please stay behind the yellow line at all times. Also, photography is welcome throughout the tour, but we ask that you turn off your camera flash, since it can distract the workers. At the end of the tour, you'll each have a chance to design a small glass ornament, which we'll ship to your home after it has cooled for a day.","vi":"Chào mừng mọi người đến với xưởng thủy tinh Tollesby. Tôi tên là Ursula và hôm nay tôi sẽ hướng dẫn các bạn tham quan nhà máy. Tòa nhà này đã sản xuất đồ thủy tinh thủ công từ năm 1892, và nhiều kỹ thuật các bạn sẽ thấy hầu như không thay đổi từ đó. Lát nữa chúng ta sẽ đi đến phòng lò nung, nơi các nghệ nhân tạo hình thủy tinh ở nhiệt độ trên một nghìn độ. Vì nhiệt độ cao, xin luôn đứng sau vạch vàng. Ngoài ra, các bạn được chụp ảnh trong suốt chuyến tham quan, nhưng xin tắt đèn flash vì nó có thể làm công nhân mất tập trung. Cuối chuyến tham quan, mỗi người sẽ có cơ hội thiết kế một món đồ trang trí thủy tinh nhỏ, chúng tôi sẽ gửi đến nhà bạn sau khi nó nguội trong một ngày.","qs":[{"q":"Who most likely is the speaker?","o":["A factory owner","A safety inspector","A museum curator","A tour guide"],"a":3,"ex":"Câu 'I'll be guiding you through our factory today' cho thấy cô là hướng dẫn viên. Bài có nhắc 'factory' và quy định an toàn nhưng cô không phải chủ nhà máy hay thanh tra an toàn."},{"q":"What are the listeners asked to do?","o":["Wear protective glasses","Leave their bags in lockers","Avoid using camera flashes","Stay with their assigned groups"],"a":2,"ex":"'We ask that you turn off your camera flash' → không dùng đèn flash. Yêu cầu còn lại trong bài là đứng sau vạch vàng, không có đáp án nào về kính bảo hộ hay tủ khóa."},{"q":"What will the listeners receive later?","o":["A discount coupon","An item they designed","A history booklet","A group photograph"],"a":1,"ex":"Khách được 'design a small glass ornament, which we'll ship to your home' → nhận món đồ do chính mình thiết kế. D là bẫy vì bài có nói về chụp ảnh."}]},{"intro":"Questions refer to the following introduction.","talk":"Good evening, and welcome to the annual dinner of the Regional Hospitality Association. It's my pleasure to introduce tonight's keynote speaker, Oliver Nakamura. Mr. Nakamura began his career as a front-desk clerk at a small inn on the coast. Twenty years later, he is the chief operating officer of Zephyr Hotels, a chain with properties in eleven countries. He's especially well known for creating a program that trains local residents for management positions, which has since been adopted by several other hotel groups. Tonight he'll share some lessons from his new book, Rooms with a View, which comes out next month. Copies are available for preorder at the table near the entrance, and Mr. Nakamura has kindly agreed to sign them after his speech.","vi":"Chào buổi tối và chào mừng đến với bữa tối thường niên của Hiệp hội Khách sạn Khu vực. Tôi rất vinh dự giới thiệu diễn giả chính tối nay, ông Oliver Nakamura. Ông Nakamura bắt đầu sự nghiệp là nhân viên lễ tân tại một nhà trọ nhỏ ven biển. Hai mươi năm sau, ông là giám đốc điều hành của Zephyr Hotels, chuỗi khách sạn có cơ sở tại mười một quốc gia. Ông đặc biệt nổi tiếng với việc xây dựng một chương trình đào tạo cư dân địa phương cho các vị trí quản lý, chương trình này sau đó đã được nhiều tập đoàn khách sạn khác áp dụng. Tối nay ông sẽ chia sẻ một số bài học từ cuốn sách mới, Rooms with a View, sẽ ra mắt vào tháng tới. Có thể đặt mua trước sách tại bàn gần lối vào, và ông Nakamura đã nhận lời ký tặng sách sau bài phát biểu.","qs":[{"q":"Where most likely is the talk taking place?","o":["At an industry association event","At a hotel's grand opening","At a job fair","At a bookstore"],"a":0,"ex":"'The annual dinner of the Regional Hospitality Association' là sự kiện của hiệp hội ngành. B và D là bẫy vì bài nhắc đến khách sạn và cuốn sách."},{"q":"What is Mr. Nakamura known for?","o":["Designing hotel buildings","Developing a training program","Opening the first hotel abroad","Writing travel guides"],"a":1,"ex":"'Especially well known for creating a program that trains local residents' → xây dựng chương trình đào tạo. Ông có viết sách nhưng sách chia sẻ bài học, không phải sách hướng dẫn du lịch."},{"q":"According to the speaker, what will happen after the speech?","o":["Dinner will be served.","Awards will be presented.","Books will be signed.","A hotel tour will begin."],"a":2,"ex":"'Mr. Nakamura has kindly agreed to sign them after his speech' → ký tặng sách. A là bẫy vì đây là bữa tối, nhưng bài không nói bữa ăn được phục vụ sau bài phát biểu."}]},{"intro":"Questions refer to the following announcement and schedule.","talk":"Attention, Summit attendees. We have an important change to this afternoon's program. Dr. Paulina Reyes, who was scheduled to lead the workshop on supply chain analytics, was unable to travel today because her flight was canceled. She'll now lead the same workshop tomorrow morning at nine o'clock. To fill the open time slot, we've moved the panel discussion on remote team management to two o'clock, and it will be held in the room originally reserved for Dr. Reyes. Anyone who registered for the analytics workshop will automatically be enrolled in tomorrow's session. However, if you're unable to attend tomorrow, please stop by the registration desk in the main lobby, and we'll refund your workshop fee.","vi":"Xin thông báo đến các đại biểu Hội nghị thượng đỉnh. Chúng tôi có một thay đổi quan trọng trong chương trình chiều nay. Tiến sĩ Paulina Reyes, người dự kiến dẫn hội thảo về phân tích chuỗi cung ứng, không thể di chuyển hôm nay vì chuyến bay của bà bị hủy. Bà sẽ dẫn chính hội thảo đó vào chín giờ sáng mai. Để lấp khung giờ trống, chúng tôi đã dời buổi thảo luận chuyên đề về quản lý nhóm làm việc từ xa sang hai giờ, và buổi này sẽ diễn ra tại phòng vốn được đặt cho Tiến sĩ Reyes. Ai đã đăng ký hội thảo phân tích sẽ được tự động ghi danh vào buổi ngày mai. Tuy nhiên, nếu bạn không thể tham dự ngày mai, vui lòng ghé bàn đăng ký ở sảnh chính, chúng tôi sẽ hoàn lại phí hội thảo.","graphic":{"title":"Afternoon Program — Original Schedule","rows":[["Time","Session","Room"],["1:00 P.M.","Exhibition Hall Opening","Hall A"],["2:00 P.M.","Supply Chain Analytics Workshop","Room 204"],["3:00 P.M.","Remote Team Management Panel","Room 310"],["4:00 P.M.","Networking Reception","Terrace"]]},"qs":[{"q":"Why has the program been changed?","o":["A meeting room is being repaired.","A presenter has become ill.","A presenter's flight was canceled.","Too few people registered for a session."],"a":2,"ex":"'Was unable to travel today because her flight was canceled' khớp với C. B là bẫy vì cũng là lý do diễn giả vắng mặt nhưng bài không nói bà bị ốm."},{"q":"Look at the graphic. Where will the panel discussion now take place?","o":["Hall A","Terrace","Room 310","Room 204"],"a":3,"ex":"Buổi thảo luận được chuyển đến 'the room originally reserved for Dr. Reyes'; theo lịch, hội thảo của Tiến sĩ Reyes ở Room 204. Room 310 là phòng ban đầu của buổi thảo luận nên là bẫy."},{"q":"What should attendees who cannot come tomorrow do?","o":["Go to the registration desk","Send an e-mail to the organizers","Sign up for a different workshop","Contact Dr. Reyes directly"],"a":0,"ex":"'If you're unable to attend tomorrow, please stop by the registration desk' → đến bàn đăng ký để được hoàn phí. Các cách liên hệ khác không được nhắc tới."}]},{"intro":"Questions refer to the following telephone message and invoice.","talk":"Hello, this is Wendell Quigley from the Ridgeway Tennis Club. I'm calling about the order we placed with your shop for our summer tournament—the banners, programs, posters, and tickets. I've just gone over the invoice you sent, and there seems to be a mistake. We were charged for five hundred programs, but we only ordered three hundred. Could you please correct that and send me an updated copy? Also, the tournament has been moved up by a week, so we'll need everything delivered by June tenth instead of June seventeenth. I realize that's short notice, so if there's a rush fee for the earlier date, please let me know before you go ahead. You can reach me at the club office any weekday after ten.","vi":"Xin chào, tôi là Wendell Quigley từ Câu lạc bộ Quần vợt Ridgeway. Tôi gọi về đơn hàng chúng tôi đặt ở cửa hàng của anh chị cho giải đấu mùa hè — băng rôn, tờ chương trình, áp phích và vé. Tôi vừa xem lại hóa đơn anh chị gửi và có vẻ có sai sót. Chúng tôi bị tính tiền năm trăm tờ chương trình, nhưng chúng tôi chỉ đặt ba trăm. Anh chị vui lòng sửa lại và gửi cho tôi bản cập nhật được không? Ngoài ra, giải đấu đã được dời sớm lên một tuần, nên chúng tôi cần giao mọi thứ trước ngày 10 tháng Sáu thay vì ngày 17. Tôi biết như vậy là gấp, nên nếu có phí làm gấp cho ngày giao sớm hơn, xin cho tôi biết trước khi tiến hành. Anh chị có thể liên hệ tôi tại văn phòng câu lạc bộ vào bất kỳ ngày thường nào sau mười giờ.","graphic":{"title":"Invoice — Ridgeway Tennis Club","rows":[["Item","Quantity","Price"],["Banners","4","$240"],["Programs","500","$350"],["Posters","50","$125"],["Tickets","1,000","$90"]]},"qs":[{"q":"Who most likely is the listener?","o":["A tennis instructor","An employee at a print shop","An event planner","A delivery driver"],"a":1,"ex":"Người nói gọi về đơn hàng 'banners, programs, posters, and tickets' đặt 'with your shop' và hóa đơn do người nghe gửi → nhân viên cửa hàng in ấn. A là bẫy vì người nói thuộc câu lạc bộ quần vợt."},{"q":"Look at the graphic. Which amount does the speaker say is incorrect?","o":["$350","$240","$125","$90"],"a":0,"ex":"Người nói cho biết bị tính tiền 500 tờ chương trình (programs) trong khi chỉ đặt 300; theo hóa đơn, dòng Programs có giá $350. $90 là bẫy vì dòng Tickets có số lượng lớn nhất."},{"q":"What does the speaker want to be informed about?","o":["A change of delivery address","A discount for club members","Revisions to a poster design","An additional charge"],"a":3,"ex":"'If there's a rush fee for the earlier date, please let me know' → muốn được báo về khoản phí phát sinh. Bài nói đổi ngày giao chứ không đổi địa chỉ, nên A là bẫy."}]}],"p5":[{"q":"The new scheduling software has made it ------- easier for staff to request time off.","o":["consider","considerable","considerably","consideration"],"a":2,"ex":"Chỗ trống đứng trước tính từ so sánh 'easier' nên cần trạng từ bổ nghĩa: 'considerably' (đáng kể). 'considerable' là tính từ, không bổ nghĩa cho tính từ khác.","vi":"Phần mềm xếp lịch mới đã giúp nhân viên xin nghỉ phép dễ dàng hơn đáng kể."},{"q":"Please ------- the attached form and return it to the human resources office by Friday.","o":["complete","fulfill","achieve","perform"],"a":0,"ex":"Cụm cố định 'complete a form' = điền (hoàn tất) biểu mẫu. 'fulfill' đi với yêu cầu/nghĩa vụ, 'achieve' đi với mục tiêu, 'perform' đi với nhiệm vụ/công việc.","vi":"Vui lòng điền vào biểu mẫu đính kèm và gửi lại cho phòng nhân sự trước thứ Sáu."},{"q":"Visitors must sign in at the security desk ------- entering the laboratory.","o":["during","prior","until","before"],"a":3,"ex":"'before + V-ing' = trước khi làm gì. 'prior' phải đi kèm 'to' (prior to); 'during' cần danh từ chỉ khoảng thời gian; 'until' không hợp nghĩa.","vi":"Khách phải đăng ký tại bàn an ninh trước khi vào phòng thí nghiệm."},{"q":"Mr. Navarro prefers to review the quarterly figures ------- before presenting them to the board.","o":["he","himself","his","him"],"a":1,"ex":"Câu đã đủ chủ ngữ và tân ngữ; chỗ trống cần đại từ phản thân 'himself' để nhấn mạnh ông ấy tự mình xem xét. 'he', 'his', 'him' không đứng được ở vị trí này.","vi":"Ông Navarro thích tự mình xem xét số liệu quý trước khi trình bày cho hội đồng quản trị."},{"q":"The renovation of the Thornfield branch ------- by the end of next month.","o":["completes","will be completed","has completed","completing"],"a":1,"ex":"Chủ ngữ 'the renovation' chịu tác động (được hoàn thành) nên cần bị động; 'by the end of next month' chỉ tương lai → 'will be completed'. Các đáp án còn lại là chủ động hoặc không phải động từ chính.","vi":"Việc cải tạo chi nhánh Thornfield sẽ được hoàn thành trước cuối tháng sau."},{"q":"Sorensen Electronics is known for its ------- approach to customer service.","o":["innovate","innovation","innovative","innovatively"],"a":2,"ex":"Giữa tính từ sở hữu 'its' và danh từ 'approach' cần một tính từ: 'innovative' (sáng tạo). 'innovation' là danh từ, dễ gây bẫy vì có thể ghép danh từ nhưng không tự nhiên ở đây.","vi":"Sorensen Electronics nổi tiếng với cách tiếp cận sáng tạo trong dịch vụ khách hàng."},{"q":"------- the shipment was delayed by a storm, the order arrived within the guaranteed period.","o":["Although","Despite","However","Because of"],"a":0,"ex":"Sau chỗ trống là một mệnh đề đầy đủ (the shipment was delayed) và hai vế tương phản → liên từ 'Although'. 'Despite' và 'Because of' chỉ đi với danh từ; 'However' là trạng từ nối, không nối hai mệnh đề trong một câu như vậy.","vi":"Mặc dù lô hàng bị chậm do bão, đơn hàng vẫn đến trong thời hạn được cam kết."},{"q":"Tickets for the Valmont Jazz Festival are ------- only through the official website.","o":["capable","possible","accessible","available"],"a":3,"ex":"'available' (có sẵn để mua) là từ đi với vé/sản phẩm. 'accessible' nói về khả năng tiếp cận địa điểm/thông tin; 'capable' cần người làm chủ ngữ; 'possible' không đi với 'tickets'.","vi":"Vé của Lễ hội nhạc Jazz Valmont chỉ được bán qua trang web chính thức."},{"q":"Applicants should submit a cover letter that clearly describes their ------- for the position.","o":["qualify","qualified","qualifications","qualifying"],"a":2,"ex":"Sau tính từ sở hữu 'their' cần danh từ làm tân ngữ cho 'describes': 'qualifications' (năng lực, trình độ). 'qualified' là tính từ/quá khứ phân từ.","vi":"Ứng viên nên nộp thư xin việc mô tả rõ trình độ của mình cho vị trí này."},{"q":"The marketing budget will be divided equally ------- the three regional offices.","o":["among","between","within","across"],"a":0,"ex":"Chia cho ba đối tượng trở lên dùng 'among'. 'between' thường dùng cho hai đối tượng – đây là bẫy phổ biến; 'within' và 'across' không đi với 'divided'.","vi":"Ngân sách tiếp thị sẽ được chia đều cho ba văn phòng khu vực."},{"q":"All employees are expected to dress ------- when meeting with clients.","o":["professionally","profession","professional","professionalism"],"a":0,"ex":"Chỗ trống bổ nghĩa cho động từ 'dress' nên cần trạng từ 'professionally'. 'professional' là tính từ, không bổ nghĩa cho động từ thường.","vi":"Tất cả nhân viên được yêu cầu ăn mặc chuyên nghiệp khi gặp khách hàng."},{"q":"Mr. Quintero will lead the training session ------- Ms. Pratt is attending the conference in Osaka.","o":["during","unless","while","so that"],"a":2,"ex":"Hai việc xảy ra đồng thời và sau chỗ trống là mệnh đề → 'while' (trong khi). 'during' chỉ đi với danh từ; 'unless' (trừ khi) và 'so that' (để) sai nghĩa.","vi":"Ông Quintero sẽ chủ trì buổi đào tạo trong khi bà Pratt tham dự hội nghị ở Osaka."},{"q":"Yardley Pharmaceuticals plans to ------- a new research facility in the northern industrial park.","o":["install","compose","assemble","establish"],"a":3,"ex":"'establish a facility' = thành lập/xây dựng cơ sở. 'install' dùng cho thiết bị, 'assemble' cho lắp ráp linh kiện, 'compose' cho soạn thảo văn bản/âm nhạc.","vi":"Yardley Pharmaceuticals dự định thành lập một cơ sở nghiên cứu mới tại khu công nghiệp phía bắc."},{"q":"The board approved the proposal after a ------- review of its long-term costs.","o":["thoroughness","thorough","thoroughly","most thoroughly"],"a":1,"ex":"Giữa mạo từ 'a' và danh từ 'review' cần tính từ: 'thorough' (kỹ lưỡng). 'thoroughly' là trạng từ, 'thoroughness' là danh từ.","vi":"Hội đồng quản trị đã phê duyệt đề xuất sau khi xem xét kỹ lưỡng các chi phí dài hạn của nó."},{"q":"Participants who have not yet received ------- name badges should visit the registration table.","o":["they","their","them","theirs"],"a":1,"ex":"Trước danh từ 'name badges' cần tính từ sở hữu 'their'. 'theirs' là đại từ sở hữu, đứng một mình, không đi trước danh từ.","vi":"Những người tham dự chưa nhận được thẻ tên của mình nên đến bàn đăng ký."},{"q":"Due to ------- demand, Rexford Bakery has extended its weekend hours.","o":["increasingly","increases","increase","increasing"],"a":3,"ex":"Trước danh từ 'demand' cần tính từ; 'increasing demand' = nhu cầu ngày càng tăng. 'increasingly' là trạng từ; 'increase' là danh từ/động từ, ghép với 'demand' không tự nhiên.","vi":"Do nhu cầu ngày càng tăng, tiệm bánh Rexford đã kéo dài giờ mở cửa cuối tuần."},{"q":"By the time the new director arrives in March, the team ------- the budget proposal.","o":["will have finished","finishes","had finished","has finished"],"a":0,"ex":"'By the time + hiện tại đơn' chỉ một mốc tương lai, việc hoàn tất trước mốc đó dùng tương lai hoàn thành 'will have finished'. 'had finished' dùng cho mốc quá khứ – bẫy thì.","vi":"Trước khi giám đốc mới đến vào tháng Ba, nhóm sẽ hoàn thành xong bản đề xuất ngân sách."},{"q":"The warranty does not cover damage to the device ------- it was caused by a manufacturing defect.","o":["whereas","because","unless","so"],"a":2,"ex":"Ý nghĩa: bảo hành không chi trả hư hỏng, TRỪ KHI do lỗi sản xuất → 'unless'. 'because' làm câu vô lý (không bảo hành vì lỗi sản xuất); 'whereas' chỉ đối lập hai sự việc.","vi":"Bảo hành không áp dụng cho hư hỏng của thiết bị trừ khi hư hỏng đó do lỗi sản xuất."},{"q":"Pellham Consulting's latest report offers a ------- analysis of regional employment trends.","o":["compare","comparative","comparatively","comparison"],"a":1,"ex":"Giữa 'a' và danh từ 'analysis' cần tính từ 'comparative' (mang tính so sánh). 'comparison' là danh từ; 'comparatively' là trạng từ.","vi":"Báo cáo mới nhất của Pellham Consulting đưa ra một phân tích so sánh về xu hướng việc làm theo khu vực."},{"q":"Customers who are not completely satisfied may ------- a full refund within 30 days of purchase.","o":["inquire","apply","request","ask"],"a":2,"ex":"'request a refund' là kết hợp đúng, tân ngữ đi thẳng sau động từ. 'apply' và 'ask' cần giới từ 'for'; 'inquire' cần 'about'.","vi":"Khách hàng không hoàn toàn hài lòng có thể yêu cầu hoàn tiền toàn bộ trong vòng 30 ngày kể từ khi mua."},{"q":"Ms. Thorne has worked at Norland Bank ------- more than fifteen years.","o":["since","for","during","at"],"a":1,"ex":"Với thì hiện tại hoàn thành và một khoảng thời gian (more than fifteen years) dùng 'for'. 'since' đi với mốc thời gian (since 2010) – bẫy hay gặp.","vi":"Bà Thorne đã làm việc tại Ngân hàng Norland hơn mười lăm năm."},{"q":"Staff members must obtain written ------- from a supervisor before working overtime.","o":["approve","approving","approved","approval"],"a":3,"ex":"Sau tính từ 'written' và làm tân ngữ cho 'obtain' cần danh từ 'approval' (sự phê duyệt). 'approved' là động từ quá khứ/tính từ.","vi":"Nhân viên phải có sự phê duyệt bằng văn bản của người quản lý trước khi làm thêm giờ."},{"q":"------- the cost of materials continues to rise, Zelmar Construction may revise its quotes.","o":["Despite","Whether","Unless","If"],"a":3,"ex":"Câu điều kiện: nếu giá vật liệu tiếp tục tăng thì công ty có thể điều chỉnh báo giá → 'If'. 'Unless' làm ngược nghĩa; 'Despite' không đi với mệnh đề; 'Whether' cần 'or not' và không hợp nghĩa.","vi":"Nếu giá vật liệu tiếp tục tăng, Công ty Xây dựng Zelmar có thể điều chỉnh báo giá."},{"q":"The ------- of the new parking garage will reduce congestion around the Orvis Medical Center.","o":["construct","constructive","construction","constructed"],"a":2,"ex":"Sau 'The' và trước 'of' cần danh từ làm chủ ngữ: 'construction' (việc xây dựng). 'constructive' là tính từ mang nghĩa 'mang tính xây dựng' – bẫy cùng gốc.","vi":"Việc xây dựng bãi đỗ xe mới sẽ giảm ùn tắc quanh Trung tâm Y tế Orvis."},{"q":"Because of the ------- weather forecast, the outdoor product launch has been moved indoors.","o":["adverse","opposite","reverse","averse"],"a":0,"ex":"'adverse weather' = thời tiết bất lợi, là cụm cố định. 'averse' (không thích) có hình thức gần giống – bẫy; 'opposite', 'reverse' mang nghĩa ngược chiều.","vi":"Do dự báo thời tiết bất lợi, buổi ra mắt sản phẩm ngoài trời đã được chuyển vào trong nhà."},{"q":"Ulrich Motors' sales figures for the third quarter were ------- higher than analysts had predicted.","o":["significance","significant","signify","significantly"],"a":3,"ex":"Chỗ trống bổ nghĩa cho tính từ so sánh 'higher' nên cần trạng từ 'significantly'. 'significant' là tính từ, không bổ nghĩa cho tính từ.","vi":"Doanh số quý ba của Ulrich Motors cao hơn đáng kể so với dự đoán của các nhà phân tích."},{"q":"Requests for vacation leave should be submitted at least two weeks ------- advance.","o":["on","by","in","for"],"a":2,"ex":"Cụm cố định 'in advance' = trước, sớm. Các giới từ còn lại không tạo thành cụm với 'advance' theo nghĩa này.","vi":"Đơn xin nghỉ phép nên được nộp trước ít nhất hai tuần."},{"q":"The museum's new exhibit has attracted a ------- number of visitors since it opened in June.","o":["wide","large","heavy","tall"],"a":1,"ex":"Kết hợp đúng là 'a large number of' (một số lượng lớn). 'wide' đi với 'range/variety', 'heavy' đi với 'traffic', nên dễ gây nhầm.","vi":"Triển lãm mới của bảo tàng đã thu hút một lượng lớn khách tham quan kể từ khi khai mạc vào tháng Sáu."},{"q":"Ms. Sato was praised for handling the client's complaint ------- and politely.","o":["efficiently","efficient","efficiency","efficiencies"],"a":0,"ex":"Chỗ trống được nối bằng 'and' với trạng từ 'politely' và cùng bổ nghĩa cho 'handling', nên cần trạng từ 'efficiently'.","vi":"Bà Sato được khen ngợi vì đã xử lý khiếu nại của khách hàng một cách hiệu quả và lịch sự."},{"q":"Talbridge Inc. is seeking a ------- assistant to help manage the CEO's schedule.","o":["reliably","reliance","rely","reliable"],"a":3,"ex":"Giữa 'a' và danh từ 'assistant' cần tính từ 'reliable' (đáng tin cậy). 'reliance' là danh từ, 'reliably' là trạng từ.","vi":"Công ty Talbridge đang tìm một trợ lý đáng tin cậy để giúp quản lý lịch làm việc của giám đốc điều hành."}],"p6":[{"intro":"Questions refer to the following e-mail.","text":"To: All Vantor Software staff\nFrom: Rachel Pemberton, Facilities Manager\nDate: May 14\nSubject: Parking garage maintenance\n\nDear colleagues,\n\nBeginning Monday, May 20, the east parking garage will be closed for resurfacing. The work is expected to take approximately two weeks. {1} this period, employees are asked to park in the overflow lot on Sycamore Avenue.\n\nA shuttle bus will run between the overflow lot and the main entrance every ten minutes from 7:00 A.M. to 7:00 P.M. {2}\n\nEmployees who require an accessible parking space should contact my office directly so that we can make {3} arrangements.\n\nWe apologize for any inconvenience and appreciate your {4} while the garage is being improved.\n\nRachel Pemberton","vi":"Gửi: Toàn bộ nhân viên Vantor Software\nTừ: Rachel Pemberton, Quản lý cơ sở vật chất\nNgày: 14 tháng 5\nChủ đề: Bảo trì bãi đỗ xe\n\nCác đồng nghiệp thân mến,\n\nBắt đầu từ thứ Hai ngày 20 tháng 5, bãi đỗ xe phía đông sẽ đóng cửa để trải lại mặt đường. Công việc dự kiến kéo dài khoảng hai tuần. Trong thời gian này, nhân viên vui lòng đỗ xe tại bãi phụ trên đại lộ Sycamore.\n\nMột xe đưa đón sẽ chạy giữa bãi phụ và lối vào chính mỗi mười phút từ 7 giờ sáng đến 7 giờ tối. Người đi xe nên dành thêm thời gian cho việc di chuyển buổi sáng.\n\nNhân viên cần chỗ đỗ dành cho người khuyết tật vui lòng liên hệ trực tiếp văn phòng tôi để chúng tôi sắp xếp phương án thay thế.\n\nChúng tôi xin lỗi vì sự bất tiện và cảm ơn sự kiên nhẫn của các bạn trong thời gian bãi đỗ xe được nâng cấp.\n\nRachel Pemberton","qs":[{"q":"","o":["Until","During","Since","Among"],"a":1,"ex":"'this period' là khoảng thời gian hai tuần đóng cửa, việc đỗ xe ở bãi phụ diễn ra trong suốt khoảng đó → 'During'. 'Until' và 'Since' chỉ mốc thời gian, 'Among' chỉ nhóm đối tượng."},{"q":"","o":["The garage was originally built in 1998.","Please remember to renew your parking permit.","The cafeteria will also extend its hours.","Riders should allow extra time for their morning commute."],"a":3,"ex":"Câu trước nói về xe đưa đón giữa bãi phụ và lối vào chính; câu khuyên 'người đi xe' (riders) dành thêm thời gian là tiếp nối hợp lý. Các câu khác (lịch sử bãi xe, gia hạn thẻ, căng tin) lạc chủ đề."},{"q":"","o":["alternative","alternatively","alternatives","alternation"],"a":0,"ex":"Trước danh từ 'arrangements' cần tính từ 'alternative' (thay thế). 'alternatives' là danh từ số nhiều, 'alternatively' là trạng từ."},{"q":"","o":["patients","patiently","patience","patient"],"a":2,"ex":"Sau tính từ sở hữu 'your' cần danh từ; 'appreciate your patience' = cảm ơn sự kiên nhẫn. 'patients' (bệnh nhân) là bẫy cùng gốc, sai nghĩa."}]},{"intro":"Questions refer to the following notice.","text":"NOTICE TO LIBRARY PATRONS\n\nStarting on July 1, the Quayside Public Library will {1} its hours of operation. The library will open at 9:00 A.M. instead of 10:00 A.M. on weekdays, and it will remain open until 8:00 P.M. on Thursdays. These changes are the result of a recent survey in which many patrons said they would like to visit the library before work.\n\nIn addition, the second-floor study rooms can now be reserved online. Previously, reservations {2} in person at the information desk. {3} Each room may be booked for up to three hours per day.\n\nFor more information, please speak with a member of our staff or visit www.quaysidelibrary.org. We look forward to serving you {4}.","vi":"THÔNG BÁO GỬI BẠN ĐỌC THƯ VIỆN\n\nTừ ngày 1 tháng 7, Thư viện Công cộng Quayside sẽ kéo dài giờ hoạt động. Thư viện sẽ mở cửa lúc 9 giờ sáng thay vì 10 giờ sáng vào các ngày trong tuần, và mở đến 8 giờ tối vào thứ Năm. Những thay đổi này là kết quả của một khảo sát gần đây, trong đó nhiều bạn đọc cho biết họ muốn đến thư viện trước giờ làm.\n\nNgoài ra, các phòng học trên tầng hai giờ đây có thể đặt trực tuyến. Trước đây, việc đặt phòng phải được thực hiện trực tiếp tại quầy thông tin. Bạn đọc cần số thẻ thư viện để hoàn tất việc đặt phòng. Mỗi phòng có thể được đặt tối đa ba giờ mỗi ngày.\n\nĐể biết thêm thông tin, vui lòng trao đổi với nhân viên hoặc truy cập www.quaysidelibrary.org. Chúng tôi mong được phục vụ bạn tốt hơn.","qs":[{"q":"","o":["shorten","close","extend","reduce"],"a":2,"ex":"Câu sau cho biết thư viện mở sớm hơn (9 giờ thay vì 10 giờ) và đóng muộn hơn vào thứ Năm → giờ hoạt động được kéo dài: 'extend'. 'shorten' và 'reduce' ngược nghĩa với thông tin trong bài."},{"q":"","o":["had to be made","have made","will be made","are making"],"a":0,"ex":"'Previously' chỉ quá khứ và 'reservations' là đối tượng được thực hiện → bị động quá khứ 'had to be made'. 'will be made' sai thì; 'have made', 'are making' là chủ động."},{"q":"","o":["The library was renovated last year.","Late fees will no longer be charged for children's books.","Our staff members are available to answer questions by phone.","Patrons will need their library card number to complete a booking."],"a":3,"ex":"Đoạn văn đang nói về việc đặt phòng học trực tuyến, nên câu về việc cần số thẻ thư viện để hoàn tất đặt phòng là phù hợp. Các câu còn lại (cải tạo, phí trễ hạn, hỗ trợ qua điện thoại) không liên quan đến việc đặt phòng."},{"q":"","o":["well","better","best","good"],"a":1,"ex":"Thư viện thay đổi để đáp ứng nhu cầu bạn đọc, nên 'serving you better' (phục vụ tốt hơn) là hợp lý; cần trạng từ dạng so sánh bổ nghĩa cho 'serving'. 'good' là tính từ; 'best' thiếu 'the' và không hợp ngữ cảnh."}]},{"intro":"Questions refer to the following article.","text":"PRESTON (June 3) — Radford Foods announced yesterday that it will open a distribution center on the outskirts of Preston next spring. The 40,000-square-meter facility will allow the company to deliver fresh products to supermarkets across the region more {1}.\n\nAccording to company spokesperson Nadia Reyes, the center will create around 250 jobs. {2} Most of these will be warehouse and transportation positions, {3} several management roles will also be filled locally.\n\nLocal officials have welcomed the news. \"This investment shows {4} confidence in our community,\" said Mayor Simon Tate.\n\nConstruction is scheduled to begin in August.","vi":"PRESTON (3 tháng 6) — Radford Foods hôm qua thông báo sẽ mở một trung tâm phân phối ở ngoại ô Preston vào mùa xuân năm sau. Cơ sở rộng 40.000 mét vuông này sẽ giúp công ty giao sản phẩm tươi đến các siêu thị trong khu vực nhanh hơn.\n\nTheo người phát ngôn Nadia Reyes, trung tâm sẽ tạo ra khoảng 250 việc làm. Việc tuyển dụng dự kiến bắt đầu vào đầu tháng Hai. Phần lớn sẽ là vị trí kho bãi và vận chuyển, mặc dù một số vị trí quản lý cũng sẽ được tuyển tại địa phương.\n\nChính quyền địa phương hoan nghênh tin này. \"Khoản đầu tư này thể hiện niềm tin mạnh mẽ vào cộng đồng của chúng ta,\" Thị trưởng Simon Tate phát biểu.\n\nViệc xây dựng dự kiến bắt đầu vào tháng Tám.","qs":[{"q":"","o":["quick","quickness","quicken","quickly"],"a":3,"ex":"'more ------' bổ nghĩa cho động từ 'deliver' nên cần trạng từ dạng so sánh 'more quickly'. 'quick' là tính từ; 'quicken' là động từ."},{"q":"","o":["The company was founded by two brothers in 1972.","Hiring is expected to begin in early February.","Supermarkets in the region have reported lower sales.","The mayor will retire at the end of the year."],"a":1,"ex":"Câu trước nói trung tâm tạo ra 250 việc làm, câu sau nói 'Most of these' là các vị trí kho bãi; câu về thời điểm bắt đầu tuyển dụng nối liền mạch về chủ đề việc làm. Các lựa chọn khác lạc đề."},{"q":"","o":["so","unless","although","because"],"a":2,"ex":"Hai vế có ý tương phản nhẹ: phần lớn là vị trí kho bãi, NHƯNG cũng có một số vị trí quản lý → 'although'. 'so' và 'because' chỉ nhân quả, 'unless' chỉ điều kiện."},{"q":"","o":["strong","strongly","strength","strengthen"],"a":0,"ex":"Trước danh từ 'confidence' cần tính từ 'strong' (niềm tin mạnh mẽ). 'strength' là danh từ, 'strengthen' là động từ, 'strongly' là trạng từ."}]},{"intro":"Questions refer to the following memo.","text":"MEMO\nTo: All sales representatives\nFrom: Victor Nakamura, Sales Director\nDate: September 9\nSubject: Expense reporting\n\nAs of October 1, Westfield Trading will begin using a new online system for {1} travel expenses. Paper forms will no longer be accepted after that date.\n\nThe new system allows you to upload photos of receipts directly from your phone. {2}, reimbursements will be processed within five business days rather than the current three weeks.\n\nA training session on the system {3} on September 24 at 2:00 P.M. in Conference Room B. {4}\n\nPlease contact the accounting department if you have any questions.","vi":"BẢN GHI NHỚ\nGửi: Toàn bộ nhân viên kinh doanh\nTừ: Victor Nakamura, Giám đốc Kinh doanh\nNgày: 9 tháng 9\nChủ đề: Báo cáo chi phí\n\nTừ ngày 1 tháng 10, Westfield Trading sẽ bắt đầu sử dụng hệ thống trực tuyến mới để nộp chi phí công tác. Biểu mẫu giấy sẽ không còn được chấp nhận sau ngày đó.\n\nHệ thống mới cho phép bạn tải ảnh hóa đơn trực tiếp từ điện thoại. Ngoài ra, khoản hoàn ứng sẽ được xử lý trong vòng năm ngày làm việc thay vì ba tuần như hiện nay.\n\nMột buổi đào tạo về hệ thống sẽ được tổ chức vào ngày 24 tháng 9 lúc 2 giờ chiều tại Phòng họp B. Tất cả nhân viên thường xuyên đi công tác được khuyến khích mạnh mẽ tham dự.\n\nVui lòng liên hệ phòng kế toán nếu bạn có câu hỏi.","qs":[{"q":"","o":["submitting","submission","submits","submitted"],"a":0,"ex":"Sau giới từ 'for' và trước tân ngữ 'travel expenses' cần danh động từ 'submitting'. 'submission' là danh từ nên không thể có tân ngữ trực tiếp theo sau."},{"q":"","o":["Instead","Otherwise","In addition","Nevertheless"],"a":2,"ex":"Câu trước nêu một lợi ích (tải ảnh hóa đơn), câu sau nêu thêm lợi ích khác (hoàn ứng nhanh hơn) → 'In addition'. 'Nevertheless' chỉ tương phản, 'Otherwise' chỉ điều kiện ngược, 'Instead' chỉ thay thế."},{"q":"","o":["was held","will be held","has been held","holds"],"a":1,"ex":"Bản ghi nhớ đề ngày 9/9, buổi đào tạo ngày 24/9 là sự kiện tương lai và buổi đào tạo 'được tổ chức' → bị động tương lai 'will be held'. 'was held', 'has been held' sai thời điểm."},{"q":"","o":["Your travel schedule for next month is attached.","The accounting department recently moved to the third floor.","Paper receipts are easy to lose.","Attendance is strongly recommended for all staff who travel regularly."],"a":3,"ex":"Câu trước thông báo buổi đào tạo, nên câu khuyến khích nhân viên thường đi công tác tham dự là tiếp nối tự nhiên. Câu về hóa đơn giấy hay việc phòng kế toán chuyển tầng không gắn với buổi đào tạo."}]}],"p7":[{"intro":"Questions refer to the following text-message chain.","docs":[{"kind":"text-message chain","text":"Nadia Reyes (9:02 A.M.): Hi Owen, I'm at the Pruett Street warehouse, but the loading dock door won't open. Did the security code change?\nOwen Sato (9:04 A.M.): Yes, it was updated over the weekend. I sent the new one to everyone on Friday.\nNadia Reyes (9:05 A.M.): I must have missed that e-mail. The truck from Quill Office Supply is due at 9:30.\nOwen Sato (9:07 A.M.): It's 4471. By the way, the forklift in bay 2 is being serviced all day today.\nNadia Reyes (9:08 A.M.): Got it. We'll unload by hand, then."}],"qs":[{"q":"Why did Ms. Reyes contact Mr. Sato?","o":["To report a damaged delivery","To request a forklift repair","To ask about access to a building area","To reschedule a shipment"],"a":2,"ex":"Ms. Reyes viết 'the loading dock door won't open. Did the security code change?' – cô hỏi về việc vào khu bốc dỡ hàng. Đáp án B dùng lại từ 'forklift' nhưng việc bảo dưỡng xe nâng là do Mr. Sato nhắc tới, không phải lý do cô liên lạc."},{"q":"At 9:08 A.M., what does Ms. Reyes most likely mean when she writes, \"We'll unload by hand, then\"?","o":["She plans to postpone the delivery.","Some equipment will not be available for the task.","The shipment is smaller than expected.","She has already finished unloading the truck."],"a":1,"ex":"Câu này đáp lại thông tin 'the forklift in bay 2 is being serviced all day today' – xe nâng không dùng được nên phải dỡ hàng bằng tay. Đáp án D sai vì xe tải còn chưa đến (9:30)."}]},{"intro":"Questions refer to the following notice.","docs":[{"kind":"notice","text":"ATTENTION PARKSIDE TOWER TENANTS\n\nElevators B and C will be out of service on Saturday, March 14, from 7:00 A.M. to 3:00 P.M. for scheduled maintenance. Elevator A will remain in operation; however, it will be reserved for freight deliveries between 9:00 and 11:00 A.M.\n\nTenants who are expecting deliveries that day should notify the management office at extension 220 no later than Thursday, March 12, so that elevator time can be scheduled.\n\nWe apologize for any inconvenience.\nRowan Property Management"}],"qs":[{"q":"What is the purpose of the notice?","o":["To inform tenants of a temporary service interruption","To announce new building office hours","To introduce a new property management company","To request feedback on recent repairs"],"a":0,"ex":"Thông báo nói 'Elevators B and C will be out of service on Saturday ... for scheduled maintenance' – gián đoạn dịch vụ tạm thời. Đáp án C sai vì Rowan Property Management chỉ ký tên, không phải công ty mới."},{"q":"What are tenants asked to do by Thursday?","o":["Move items out of the elevators","Pay a maintenance fee","Report any expected deliveries","Use the stairs on Saturday"],"a":2,"ex":"'Tenants who are expecting deliveries that day should notify the management office ... no later than Thursday' – báo trước các đợt giao hàng. Không có chi tiết nào về phí bảo trì hay đi cầu thang."}]},{"intro":"Questions refer to the following advertisement.","docs":[{"kind":"advertisement","text":"SUNVALE PRINT STUDIO\nBusiness cards • Brochures • Banners • Event signage\n\nNeed it fast? Orders placed before noon are ready the next business day.\n\nNew customers receive 15% off a first order of $100 or more. Free delivery within city limits on all orders over $250.\n\nVisit our shop at 88 Tolliver Avenue or order online at www.sunvaleprint.com.\nNew-customer offer ends April 30."}],"qs":[{"q":"What is suggested about Sunvale Print Studio?","o":["It has several locations in the city.","It can complete some orders quickly.","It serves only business clients.","It recently changed its name."],"a":1,"ex":"'Orders placed before noon are ready the next business day' cho thấy cửa hàng có thể làm xong đơn nhanh. Chỉ có một địa chỉ (88 Tolliver Avenue) nên A sai."},{"q":"How can a customer receive free delivery?","o":["By placing an order before noon","By opening a new account","By ordering before April 30","By spending more than a certain amount"],"a":3,"ex":"'Free delivery within city limits on all orders over $250' – phải chi trên một mức nhất định. Các đáp án A, C lấy mốc 'noon', 'April 30' từ những ưu đãi khác để gây nhiễu."}]},{"intro":"Questions refer to the following e-mail.","docs":[{"kind":"e-mail","text":"To: Valerie Ng <vng@ostrandmarkets.com>\nFrom: Theo Watts <attendee.services@nrforum.org>\nDate: May 12\nSubject: Your registration\n\nDear Ms. Ng,\n\nThank you for registering for the Northern Retail Forum on June 9-10. Our records show that you purchased a two-day pass but have not yet selected a workshop for the afternoon of June 10. Workshops are limited to 40 participants each and tend to fill quickly.\n\nPlease log in to your account and make your selection by May 25. After that date, participants who have not chosen a workshop will be placed in one that still has openings.\n\nYour badge can be picked up at the registration desk in the lobby of the Tremont Convention Center.\n\nTheo Watts\nAttendee Services"}],"qs":[{"q":"Why was the e-mail sent?","o":["To announce a change of venue","To confirm a refund","To offer a discounted pass","To ask an attendee to complete her registration choices"],"a":3,"ex":"E-mail nhắc Ms. Ng 'have not yet selected a workshop ... make your selection by May 25' – yêu cầu hoàn tất lựa chọn đăng ký. Địa điểm không thay đổi, chỉ nói nơi nhận thẻ."},{"q":"What will happen if Ms. Ng does not respond by May 25?","o":["She will be assigned to a workshop.","Her pass will be canceled.","She will be charged an additional fee.","Her badge will be sent by mail."],"a":0,"ex":"'participants who have not chosen a workshop will be placed in one that still has openings' – cô sẽ được xếp vào một hội thảo còn chỗ. Không có đề cập đến huỷ vé hay phụ phí."}]},{"intro":"Questions refer to the following article.","docs":[{"kind":"article","text":"PELHAM (May 3) — Orchard Valley Foods announced on Tuesday that it will open a second processing plant in Pelham by next spring. [1] The facility, to be built on the site of a former textile mill, is expected to create 120 jobs. [2] Company president Sabrina Quinlan said the location was chosen because of its proximity to the region's main highway and to the farms that supply the company's fruit
