- Quality in DevOps v1.0",0],["Specialist - Security Tester 2016",0],["Specialist - Security Test Engineer v1.0",1],["Specialist - Test Automation Strategy v1.0",0],["Specialist - Usability Testing 2018",0]],"syn":["lifecycle model"],"see":[]},{"s":"software-lifecycle","n":"software lifecycle","a":"","d":"The period of time that begins when a software product is conceived and ends when the software is no longer available for use. The software lifecycle typically includes a concept phase, requirements phase, design phase, implementation phase, test phase, installation and checkout phase, operation and maintenance phase, and sometimes, retirement phase. Note these phases may overlap or be performed iteratively.","vn":"vòng đời phần mềm (software lifecycle)","vd":"Khoảng thời gian bắt đầu khi một sản phẩm phần mềm được hình thành ý tưởng và kết thúc khi phần mềm không còn khả dụng để sử dụng. Vòng đời phần mềm thường bao gồm giai đoạn ý tưởng, giai đoạn yêu cầu, giai đoạn thiết kế, giai đoạn hiện thực, giai đoạn kiểm thử, giai đoạn cài đặt và nghiệm thu, giai đoạn vận hành và bảo trì, và đôi khi là giai đoạn ngừng sử dụng. Lưu ý rằng các giai đoạn này có thể chồng lấn hoặc được thực hiện lặp lại.","t":"Quality and testing","sy":[["Advanced Test Management v3.0",0],["Expert Improving the Test Process 2011",1],["Foundation Agile Tester 2014",1],["Specialist - Security Tester 2016",1]],"syn":[],"see":[]},{"s":"software-process-improvement","n":"software process improvement","a":"SPI","d":"A program of activities designed to improve the performance and maturity of the organization's software processes and the results of such a program.","vn":"cải tiến quy trình phần mềm (software process improvement)","vd":"Một chương trình gồm các hoạt động được thiết kế để cải thiện hiệu suất và mức độ trưởng thành của các quy trình phần mềm của tổ chức, cùng với các kết quả của chương trình đó.","t":"Quality and testing","sy":[["Expert Improving the Test Process 2011",1],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - Automotive Software Tester v2.1",0]],"syn":[],"see":[]},{"s":"software-qualification-test","n":"software qualification test","a":"","d":"Testing performed on completed, integrated software to provide evidence for compliance with software requirements.","vn":"kiểm thử chứng nhận phần mềm (software qualification test)","vd":"Kiểm thử được thực hiện trên phần mềm đã hoàn thiện và tích hợp nhằm cung cấp bằng chứng về sự tuân thủ các yêu cầu phần mềm.","t":"Quality and testing","sy":[["Specialist - Automotive Software Tester 2018",1]],"syn":[],"see":[]},{"s":"software-usability-measurement-inventory","n":"Software Usability Measurement Inventory","a":"SUMI","d":"A questionnaire-based usability testing tool that measures and benchmarks user experience.","vn":"Bộ công cụ đo lường tính khả dụng phần mềm (Software Usability Measurement Inventory)","vd":"Một công cụ kiểm thử tính khả dụng dựa trên bảng câu hỏi, dùng để đo lường và đối sánh trải nghiệm người dùng.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",0]],"syn":[],"see":[["Website Analysis and Measurement Inventory","website-analysis-and-measurement-inventory"]]},{"s":"software-in-the-loop","n":"software-in-the-loop","a":"SiL","d":"A virtual test environment in which real software is tested. ","vn":"phần mềm trong vòng lặp (software-in-the-loop)","vd":"Một môi trường kiểm thử ảo trong đó phần mềm thực được kiểm thử.","t":"Quality and testing","sy":[["Specialist - Automotive Software Tester v2.1",1]],"syn":[],"see":[]},{"s":"source-test-case","n":"source test case","a":"","d":"A test case that passed and is used as the basis of follow-up test cases in metamorphic testing.","vn":"ca kiểm thử nguồn (source test case)","vd":"Một ca kiểm thử đã đạt và được sử dụng làm cơ sở cho các ca kiểm thử tiếp theo trong kiểm thử biến hình (metamorphic testing).","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",0],["Specialist - AI Testing v1.0",1],["Specialist - AI Testing v2.0",0]],"syn":[],"see":[]},{"s":"spike-testing","n":"spike testing","a":"","d":"Testing to determine the ability of a system to recover from sudden bursts of peak loads and return to a steady state.","vn":"kiểm thử tải đột biến (spike testing)","vd":"Kiểm thử nhằm xác định khả năng của hệ thống trong việc phục hồi sau các đợt tải đỉnh tăng đột ngột và trở về trạng thái ổn định.","t":"Quality and testing","sy":[["Advanced Test Automation Engineering v2.0",0],["Specialist - Finance Testing v1.0",0],["Specialist - Performance Testing 2018",1],["Specialist - Quality in DevOps v1.0",0]],"syn":[],"see":[]},{"s":"standard-compliant-test-strategy","n":"standard-compliant test strategy","a":"","d":"A test strategy whereby the test team follows a standard. Standards followed may be valid e.g., for a country (legislation standards), a business domain (domain standards), or internally (organizational standards).","vn":"chiến lược kiểm thử tuân thủ tiêu chuẩn (standard-compliant test strategy)","vd":"Một chiến lược kiểm thử trong đó nhóm kiểm thử tuân theo một tiêu chuẩn. Các tiêu chuẩn được tuân theo có thể có hiệu lực, ví dụ, cho một quốc gia (tiêu chuẩn pháp luật), một lĩnh vực kinh doanh (tiêu chuẩn lĩnh vực) hoặc nội bộ (tiêu chuẩn của tổ chức).","t":"Quality and testing","sy":[["Expert Test Management 2011",1]],"syn":[],"see":[]},{"s":"state-transition-testing","n":"state transition testing","a":"","d":"A black-box test technique in which test conditions are state transitions or sequences of them.","vn":"kiểm thử chuyển trạng thái (state transition testing)","vd":"Một kỹ thuật kiểm thử hộp đen trong đó các điều kiện kiểm thử là các chuyển trạng thái hoặc các chuỗi chuyển trạng thái.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Test Analyst v4.0",1],["Advanced Test Automation Engineering v2.0",0],["Advanced Agile Tester v2.0",0],["Foundation Agile Tester 2014",0],["Advanced Agile Technical Tester 2019",0],["Specialist - Finance Testing v1.0",0],["Specialist - Model-Based Testing v1.1",0]],"syn":["finite state testing"],"see":[]},{"s":"statement-coverage","n":"statement coverage","a":"","d":"The coverage of executable source statements.","vn":"độ bao phủ câu lệnh (statement coverage)","vd":"Độ bao phủ các câu lệnh mã nguồn có thể thực thi.","t":"Quality and testing","sy":[["Advanced Test Management v3.0",0],["Advanced Test Analyst v4.0",0],["Advanced Technical Test Analyst v4.0",0],["Expert Test Management 2011",0],["Specialist - Model-Based Testing v1.1",0],["Specialist - Security Tester 2016",0]],"syn":[],"see":[]},{"s":"statement-testing","n":"statement testing","a":"","d":"A white-box test technique in which test conditions are based on executable source statements.","vn":"kiểm thử câu lệnh (statement testing)","vd":"Một kỹ thuật kiểm thử hộp trắng trong đó các điều kiện kiểm thử dựa trên các câu lệnh mã nguồn có thể thực thi.","t":"Quality and testing","sy":[["Advanced Technical Test Analyst v4.0",1],["Specialist - Automotive Software Tester v2.1",0]],"syn":[],"see":[]},{"s":"static-analysis","n":"static analysis","a":"","d":"The automated process of evaluating a component or system without executing it, based on its form, structure, content, or documentation.","vn":"phân tích tĩnh (static analysis)","vd":"Quá trình tự động đánh giá một thành phần hoặc hệ thống mà không thực thi nó, dựa trên hình thức, cấu trúc, nội dung hoặc tài liệu của nó.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Test Management v3.0",0],["Advanced Technical Test Analyst v4.0",1],["Advanced Test Automation Engineering v2.0",1],["Expert Test Management 2011",0],["Foundation Agile Tester 2014",0],["Specialist - AI Testing v2.0",0],["Specialist - Automotive Software Tester 2018",0],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Model-Based Testing v1.1",0],["Specialist - Quality in DevOps v1.0",1],["Specialist - Security Tester 2016",0],["Specialist - Security Test Engineer v1.0",0]],"syn":[],"see":[["static testing","static-testing"]]},{"s":"static-application-security-testing","n":"static application security testing","a":"SAST","d":"A type of static analysis that focuses on detecting vulnerabilities.","vn":"kiểm thử bảo mật ứng dụng tĩnh (static application security testing)","vd":"Một loại phân tích tĩnh tập trung vào việc phát hiện các lỗ hổng.","t":"Quality and testing","sy":[["Specialist - Security Test Engineer v1.0",1]],"syn":[],"see":[["dynamic application security testing","dynamic-application-security-testing"],["interactive application security testing","interactive-application-security-testing"],["vulnerability","vulnerability"]]},{"s":"static-testing","n":"static testing","a":"","d":"A test approach that does not involve the execution of a test item.","vn":"kiểm thử tĩnh (static testing)","vd":"Một cách tiếp cận kiểm thử không bao gồm việc thực thi hạng mục kiểm thử.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Test Management v3.0",0],["Advanced Test Analyst v4.0",0],["Advanced Technical Test Analyst v4.0",0],["Expert Improving the Test Process 2011",0],["Foundation Agile Tester 2014",0],["Specialist - Automotive Software Tester 2018",0],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Performance Testing 2018",0],["Specialist - Quality in DevOps v1.0",1],["Specialist - Security Tester 2016",0],["Specialist - Security Test Engineer v1.0",0]],"syn":[],"see":[["dynamic testing","dynamic-testing"],["static analysis","static-analysis"],["review","review"]]},{"s":"stress-testing","n":"stress testing","a":"","d":"A type of performance testing to evaluate a system or component at or beyond the limits of its anticipated or specified workloads, or with reduced availability of resources such as access to memory or servers.","vn":"kiểm thử áp lực (stress testing)","vd":"Một loại kiểm thử hiệu năng nhằm đánh giá một hệ thống hoặc thành phần ở mức hoặc vượt quá giới hạn khối lượng công việc dự kiến hoặc được chỉ định, hoặc trong điều kiện khả năng sẵn có của tài nguyên bị suy giảm, chẳng hạn như truy cập bộ nhớ hoặc máy chủ.","t":"Quality and testing","sy":[["Advanced Technical Test Analyst v4.0",0],["Advanced Test Automation Engineering v2.0",0],["Specialist - Finance Testing v1.0",1],["Specialist - Mobile Application Testing 2019",1],["Specialist - Performance Testing 2018",1],["Specialist - Quality in DevOps v1.0",0],["Specialist - Test Automation Strategy v1.0",0]],"syn":[],"see":[]},{"s":"structural-coverage","n":"structural coverage","a":"","d":"Coverage measures based on the internal structure of a component or system.","vn":"độ bao phủ cấu trúc (structural coverage)","vd":"Các thước đo độ bao phủ dựa trên cấu trúc bên trong của một thành phần hoặc hệ thống.","t":"Quality and testing","sy":[["Advanced Test Management v3.0",0],["Advanced Test Analyst v4.0",0],["Specialist - AI Testing v2.0",0]],"syn":[],"see":[]},{"s":"structured-scripting","n":"structured scripting","a":"","d":"A scripting technique that builds and utilizes a library of reusable (parts of) scripts.","vn":"viết kịch bản có cấu trúc (structured scripting)","vd":"Một kỹ thuật viết kịch bản xây dựng và sử dụng một thư viện các kịch bản (hoặc các phần của kịch bản) có thể tái sử dụng.","t":"Quality and testing","sy":[["Advanced Test Automation Engineering v2.0",1]],"syn":[],"see":[]},{"s":"stub","n":"stub","a":"","d":"A type of test double providing predefined responses.","vn":"stub","vd":"Một loại test double cung cấp các phản hồi được định nghĩa trước.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Analyst v4.0",0],["Advanced Technical Test Analyst v4.0",0],["Advanced Test Automation Engineering v2.0",0],["Expert Test Management 2011",0],["Advanced Agile Technical Tester 2019",0],["Specialist - Game Testing v1.0.1",0],["Specialist - Performance Testing 2018",0],["Specialist - Security Tester 2016",0],["Specialist - Test Automation Strategy v1.0",0]],"syn":[],"see":[["mock","mock"]]},{"s":"substantive-testing","n":"substantive testing","a":"","d":"A test approach that evaluates if the actual outcomes or data produced by a system or process are within compliance.","vn":"kiểm thử thực chất (substantive testing)","vd":"Một cách tiếp cận kiểm thử đánh giá xem các kết quả hoặc dữ liệu thực tế do một hệ thống hoặc quy trình tạo ra có nằm trong phạm vi tuân thủ hay không.","t":"Quality and testing","sy":[["Specialist - Finance Testing v1.0",1]],"syn":[],"see":[]},{"s":"summative-evaluation","n":"summative evaluation","a":"","d":"A type of evaluation designed and used to gather conclusions about the quality of a component or system, especially when a substantial part of it has completed design.","vn":"đánh giá tổng kết (summative evaluation)","vd":"Một loại đánh giá được thiết kế và sử dụng để rút ra kết luận về chất lượng của một thành phần hoặc hệ thống, đặc biệt khi một phần đáng kể của nó đã hoàn tất thiết kế.","t":"Quality and testing","sy":[["Specialist - Usability Testing 2018",1]],"syn":[],"see":[["formative evaluation","formative-evaluation"]]},{"s":"synthetic-test-data","n":"synthetic test data","a":"","d":"Test data created or generated without using production data.","vn":"dữ liệu kiểm thử tổng hợp (synthetic test data)","vd":"Dữ liệu kiểm thử được tạo ra hoặc sinh ra mà không sử dụng dữ liệu môi trường thật (production).","t":"Quality and testing","sy":[["Specialist - Finance Testing v1.0",0],["Specialist - Quality in DevOps v1.0",0]],"syn":[],"see":[]},{"s":"system-hardening","n":"system hardening","a":"","d":"The step-by-step process of reducing the vulnerabilities of a system by applying a security policy and different layers of protection.","vn":"gia cố hệ thống (system hardening)","vd":"Quy trình từng bước nhằm giảm các lỗ hổng của một hệ thống bằng cách áp dụng chính sách bảo mật và các lớp bảo vệ khác nhau.","t":"Quality and testing","sy":[["Specialist - Security Tester 2016",1]],"syn":[],"see":[]},{"s":"system-i  testing","sy":[["Foundation v4.0",1],["Advanced Test Management v3.0",0],["Advanced Test Analyst v4.0",0],["Advanced Test Automation Engineering v2.0",0],["Advanced Agile Tester v2.0",0],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - AI Testing v2.0",1],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Finance Testing v1.0",0],["Specialist - Model-Based Testing v1.1",0],["Specialist - Quality in DevOps v1.0",1],["Specialist - Security Test Engineer v1.0",0],["Specialist - Test Automation Strategy v1.0",0],["Specialist - Testing with Generative AI v1.0",0]],"syn":[],"see":[["quality control","quality-control"]]},{"s":"testing-capability","n":"testing capability","a":"","d":"The abilities an organization needs to accomplish its test objectives.","vn":"năng lực kiểm thử (testing capability)","vd":"Các khả năng mà một tổ chức cần có để đạt được các mục tiêu kiểm thử của mình.","t":"Quality and testing","sy":[["Specialist - Agile Test Leadership at Scale v2.0",1]],"syn":[],"see":[["quality capability","quality-capability"]]},{"s":"testing-for-bias","n":"testing for bias","a":"","d":"A test type to detect bias in input data, an AI model, or an AI-based system.","vn":"kiểm thử thiên lệch (testing for bias)","vd":"Một loại kiểm thử nhằm phát hiện sự thiên lệch trong dữ liệu đầu vào, trong mô hình AI hoặc trong hệ thống dựa trên AI.","t":"Quality and testing","sy":[["Specialist - AI Testing v2.0",1]],"syn":[],"see":[]},{"s":"testing-in-production","n":"testing in production","a":"","d":"A test level that focuses on validating a system in a production environment.","vn":"kiểm thử trên môi trường thật (testing in production)","vd":"Một mức kiểm thử tập trung vào việc xác nhận một hệ thống trong môi trường vận hành thật (production).","t":"Quality and testing","sy":[["Advanced Test Automation Engineering v2.0",0],["Specialist - Agile Test Leadership at Scale v2.0",1],["Specialist - AI Testing v2.0",0],["Specialist - Quality in DevOps v1.0",0]],"syn":[],"see":[["post-release testing","post-release-testing"],["shift right","shift-right"]]},{"s":"testing-quadrants","n":"testing quadrants","a":"","d":"A classification model of test types/test levels in four quadrants, relating them to two dimensions of test objectives: supporting the product team versus critiquing the product, and technology-facing versus business-facing.","vn":"góc phần tư kiểm thử (testing quadrants)","vd":"Một mô hình phân loại các loại kiểm thử/mức kiểm thử vào bốn góc phần tư, gắn chúng với hai chiều của mục tiêu kiểm thử: hỗ trợ đội phát triển sản phẩm so với đánh giá phản biện sản phẩm, và hướng công nghệ so với hướng nghiệp vụ.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Agile Tester v2.0",1],["Foundation Agile Tester 2014",0],["Specialist - Agile Test Leadership at Scale v2.0",0]],"syn":[],"see":[]},{"s":"testware","n":"testware","a":"","d":"Work products produced during the test process for use in planning, designing, executing, evaluating and reporting on testing.","vn":"sản phẩm kiểm thử (testware)","vd":"Các sản phẩm công việc được tạo ra trong quy trình kiểm thử để sử dụng cho việc lập kế hoạch, thiết kế, thực thi, đánh giá và báo cáo kiểm thử.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Test Management v3.0",0],["Advanced Test Analyst v4.0",1],["Advanced Test Automation Engineering v2.0",1],["Advanced Agile Tester v2.0",1],["Expert Improving the Test Process 2011",0],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Finance Testing v1.0",0],["Specialist - Game Testing v1.0.1",0],["Specialist - Model-Based Testing v1.1",0],["Specialist - Performance Testing 2018",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Test Automation Strategy v1.0",0],["Specialist - Testing with Generative AI v1.0",0]],"syn":[],"see":[]},{"s":"think-aloud-usability-testing","n":"think aloud usability testing","a":"","d":"A usability testing technique where test participants share their thoughts with the moderator and observers by thinking aloud while they solve usability test tasks. Think aloud is useful to understand the test participant.","vn":"kiểm thử khả năng sử dụng bằng nói to suy nghĩ (think aloud)","vd":"Một kỹ thuật kiểm thử khả năng sử dụng trong đó người tham gia kiểm thử chia sẻ suy nghĩ của mình với người điều phối và người quan sát bằng cách nói to suy nghĩ trong khi giải quyết các nhiệm vụ kiểm thử khả năng sử dụng. Kỹ thuật nói to suy nghĩ hữu ích để hiểu người tham gia kiểm thử.","t":"Quality and testing","sy":[["Specialist - Usability Testing 2018",1]],"syn":[],"see":[]},{"s":"think-time","n":"think time","a":"","d":"The amount of time required by a user to determine and execute the next action in a sequence of actions.","vn":"thời gian suy nghĩ (think time)","vd":"Khoảng thời gian người dùng cần để xác định và thực hiện hành động tiếp theo trong một chuỗi hành động.","t":"Quality and testing","sy":[["Specialist - Performance Testing 2018",1]],"syn":[],"see":[]},{"s":"threshold-coverage","n":"threshold coverage","a":"","d":"The coverage of neurons exceeding a threshold activation value in a neural network for a set of tests.","vn":"độ bao phủ ngưỡng (threshold coverage)","vd":"Độ bao phủ các nơ-ron có giá trị kích hoạt vượt quá một ngưỡng trong mạng nơ-ron đối với một tập kiểm thử.","t":"Quality and testing","sy":[["Specialist - AI Testing v1.0",1]],"syn":[],"see":[]},{"s":"time-behavior","n":"time behavior","a":"","d":"The degree to which a component or system can perform its required functions within required response times, processing times and throughput rates.","vn":"hành vi thời gian (time behavior)","vd":"Mức độ mà một thành phần hoặc hệ thống có thể thực hiện các chức năng yêu cầu trong phạm vi thời gian phản hồi, thời gian xử lý và tốc độ thông lượng được yêu cầu.","t":"Quality and testing","sy":[["Advanced Technical Test Analyst v4.0",1]],"syn":[],"see":[]},{"s":"tissue-tester","n":"tissue tester","a":"","d":"A tester outside an Agile team having no experience with the component or system who tests it to provide early feedback before planned testing or development continues.","vn":"kiểm thử viên dùng một lần (tissue tester)","vd":"Một kiểm thử viên bên ngoài đội Agile, chưa có kinh nghiệm với thành phần hoặc hệ thống, thực hiện kiểm thử để cung cấp phản hồi sớm trước khi việc kiểm thử theo kế hoạch hoặc việc phát triển được tiếp tục.","t":"Quality and testing","sy":[["Advanced Agile Tester v2.0",1]],"syn":[],"see":[]},{"s":"total-quality-management","n":"Total Quality Management","a":"TQM","d":"An organization-wide management approach to quality based on employee participation to achieve long-term success through customer satisfaction.","vn":"Quản lý Chất lượng Toàn diện (TQM)","vd":"Một cách tiếp cận quản lý chất lượng trên toàn tổ chức, dựa trên sự tham gia của nhân viên nhằm đạt được thành công dài hạn thông qua sự hài lòng của khách hàng.","t":"Quality and testing","sy":[["Expert Improving the Test Process v1.0.1",1],["Specialist - Agile Test Leadership at Scale v2.0",0]],"syn":[],"see":[]},{"s":"tour","n":"tour","a":"","d":"A set of exploratory tests organized around a special focus.","vn":"chuyến tham quan kiểm thử (tour)","vd":"Một tập hợp các kiểm thử thăm dò được tổ chức xoay quanh một trọng tâm đặc biệt.","t":"Quality and testing","sy":[["Advanced Agile Tester v2.0",1],["Specialist - AI Testing v1.0",0],["Specialist - Mobile Application Testing 2019",1],["Specialist - Test Automation Strategy v1.0",0]],"syn":[],"see":[]},{"s":"tpi-next","n":"TPI Next","a":"","d":"A continuous business-driven framework for test process improvement that describes the key elements of an effective and efficient test process.","vn":"TPI Next","vd":"Một khung liên tục, định hướng theo nghiệp vụ dùng để cải tiến quy trình kiểm thử, mô tả các yếu tố then chốt của một quy trình kiểm thử hiệu quả và hiệu suất.","t":"Quality and testing","sy":[["Advanced Test Management v3.0",1],["Expert Improving the Test Process 2011",1]],"syn":[],"see":[]},{"s":"traceability","n":"traceability","a":"","d":"The ability to establish explicit relationships between related work products or items within work products. ","vn":"khả năng truy vết (traceability)","vd":"Khả năng thiết lập các mối quan hệ rõ ràng giữa các sản phẩm công việc có liên quan hoặc giữa các mục bên trong các sản phẩm công việc.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Test Management v3.0",0],["Advanced Test Analyst v4.0",0],["Advanced Test Automation Engineering v2.0",0],["Advanced Agile Tester v2.0",0],["Expert Improving the Test Process 2011",0],["Foundation Agile Tester 2014",0],["Specialist - Acceptance Testing 2019",0],["Specialist - AI Testing v2.0",0],["Specialist - Automotive Software Tester 2018",0],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Finance Testing v1.0",1],["Specialist - Model-Based Testing v1.1",0],["Specialist - Quality in DevOps v1.0",1]],"syn":[],"see":[]},{"s":"traceability-matrix","n":"traceability matrix","a":"","d":"A matrix which correlates work products or items within work products to determine the coverage achieved.","vn":"ma trận truy vết (traceability matrix)","vd":"Một ma trận liên kết các sản phẩm công việc hoặc các mục bên trong sản phẩm công việc nhằm xác định mức độ bao phủ đạt được.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",0],["Specialist - Finance Testing v1.0",1],["Specialist - Model-Based Testing v1.1",0],["Specialist - Test Automation Strategy v1.0",0]],"syn":[],"see":[]},{"s":"transcendent-quality","n":"transcendent quality","a":"","d":"A view of quality based on the perception and feeling of individuals.","vn":"chất lượng siêu nghiệm (transcendent quality)","vd":"Một quan điểm về chất lượng dựa trên nhận thức và cảm nhận của từng cá nhân.","t":"Quality and testing","sy":[["Expert Improving the Test Process v1.0.1",1]],"syn":[],"see":[]},{"s":"transparency","n":"transparency","a":"","d":"The degree to which appropriate information about an AI-based system is communicated to relevant stakeholders.","vn":"tính minh bạch (transparency)","vd":"Mức độ mà thông tin phù hợp về một hệ thống dựa trên AI được truyền đạt tới các bên liên quan.","t":"Quality and testing","sy":[["Advanced Agile Tester v2.0",0],["Specialist - AI Testing v2.0",1],["Specialist - Finance Testing v1.0",0],["Specialist - Quality in DevOps v1.0",0]],"syn":[],"see":[]},{"s":"unit-test-framework","n":"unit test framework","a":"","d":"A tool that provides an environment for testing a unit in isolation.","vn":"khung kiểm thử đơn vị (unit test framework)","vd":"Một công cụ cung cấp môi trường để kiểm thử một đơn vị một cách độc lập (cô lập).","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Agile Technical Tester 2019",0]],"syn":[],"see":[]},{"s":"unit-testing","n":"unit testing","a":"","d":"A test level that focuses on evaluating the smallest part of code testable in isolation.","vn":"kiểm thử đơn vị (unit testing)","vd":"Một mức kiểm thử tập trung vào việc đánh giá phần mã nhỏ nhất có thể kiểm thử được một cách độc lập.","t":"Quality and testing","sy":[["Advanced Agile Tester v2.0",0],["Specialist - Quality in DevOps v1.0",1]],"syn":[],"see":[]},{"s":"usability","n":"usability","a":"","d":"The degree to which a component or system can be used by specified users to achieve specified goals in a specified context of use.","vn":"khả năng sử dụng (usability)","vd":"Mức độ mà một thành phần hoặc hệ thống có thể được những người dùng xác định sử dụng để đạt được các mục tiêu xác định trong một bối cảnh sử dụng xác định.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Management v3.0",0],["Advanced Test Analyst v4.0",1],["Advanced Technical Test Analyst v4.0",0],["Advanced Agile Tester v2.0",0],["Expert Improving the Test Process 2011",0],["Expert Test Management 2011",0],["Foundation Agile Tester 2014",0],["Specialist - Acceptance Testing 2019",1],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - AI Testing v1.0",0],["Specialist - AI Testing v2.0",0],["Specialist - Automotive Software Tester 2018",0],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Finance Testing v1.0",0],["Specialist - Gambling Industry Tester 2018",0],["Specialist - Mobile Application Testing 2019",1],["Specialist - Performance Testing 2018",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Security Tester 2016",0],["Specialist - Security Test Engineer v1.0",0],["Specialist - Test Automation Strategy v1.0",0],["Specialist - Testing with Generative AI v1.0",0]],"syn":[],"see":[["user interface aesthetics","user-interface-aesthetics"],["operability","operability"],["appropriateness recognizability","appropriateness-recognizability"],["interaction capability","interaction-capability"]]},{"s":"usability-evaluation","n":"usability evaluation","a":"","d":"A process through which information about the usability of a system is gathered in order to improve the system (known as formative evaluation) or to assess the merit or worth of a system (known as summative evaluation).","vn":"đánh giá khả năng sử dụng (usability evaluation)","vd":"Một quy trình thu thập thông tin về khả năng sử dụng của một hệ thống nhằm cải thiện hệ thống (gọi là đánh giá hình thành - formative evaluation) hoặc nhằm thẩm định giá trị hay mức độ xứng đáng của hệ thống (gọi là đánh giá tổng kết - summative evaluation).","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",0],["Specialist - Usability Testing 2018",1]],"syn":[],"see":[]},{"s":"usability-lab","n":"usability lab","a":"","d":"A test facility in which unintrusive observation of participant reactions and responses to software takes place.","vn":"phòng thí nghiệm khả năng sử dụng (usability lab)","vd":"Một cơ sở kiểm thử, tại đó diễn ra việc quan sát không gây xâm nhập đối với các phản ứng và phản hồi của người tham gia khi sử dụng phần mềm.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Specialist - Mobile Application Testing 2019",1]],"syn":[],"see":[]},{"s":"usability-requirement","n":"usability requirement","a":"","d":"A requirement on the usability of a component or system.","vn":"yêu cầu về khả năng sử dụng (usability requirement)","vd":"Một yêu cầu về khả năng sử dụng của một thành phần hoặc hệ thống.","t":"Quality and testing","sy":[["Specialist - Automotive Software Tester v2.1",0],["Specialist - Usability Testing 2018",1]],"syn":[],"see":[]},{"s":"usability-test-participant","n":"usability test participant","a":"","d":"A representative user who solves typical tasks in a usability test.","vn":"người tham gia kiểm thử khả năng sử dụng","vd":"Một người dùng đại diện thực hiện các nhiệm vụ điển hình trong một kiểm thử khả năng sử dụng.","t":"Quality and testing","sy":[["Specialist - Usability Testing 2018",1]],"syn":[],"see":[]},{"s":"usability-test-script","n":"usability test script","a":"","d":"A document specifying a sequence of actions for the execution of a usability test. It is used by the moderator to keep track of briefing and pre-session interview questions, usability test tasks, and post-session interview questions.","vn":"kịch bản kiểm thử khả năng sử dụng (usability test script)","vd":"Tài liệu đặc tả một chuỗi hành động để thực thi một kiểm thử khả năng sử dụng. Tài liệu này được người điều phối dùng để theo dõi phần giới thiệu và các câu hỏi phỏng vấn trước phiên, các nhiệm vụ kiểm thử khả năng sử dụng và các câu hỏi phỏng vấn sau phiên.","t":"Quality and testing","sy":[["Specialist - Usability Testing 2018",1]],"syn":[],"see":[]},{"s":"usability-test-session","n":"usability test session","a":"","d":"A test session in usability testing in which a usability test participant is executing tests, moderated by a moderator and observed by a number of observers.","vn":"phiên kiểm thử khả năng sử dụng (usability test session)","vd":"Một phiên kiểm thử trong kiểm thử khả năng sử dụng, trong đó người tham gia kiểm thử khả năng sử dụng thực thi các kiểm thử, dưới sự điều phối của người điều phối và sự quan sát của một số người quan sát.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",0],["Advanced Agile Tester v2.0",0],["Specialist - Usability Testing 2018",1]],"syn":[],"see":[]},{"s":"usability-test-task","n":"usability test task","a":"","d":"A usability test execution activity specified by the moderator that needs to be accomplished by a usability test participant within a given period of time.","vn":"nhiệm vụ kiểm thử khả năng sử dụng (usability test task)","vd":"Một hoạt động thực thi kiểm thử khả năng sử dụng do người điều phối đặc tả, mà người tham gia kiểm thử khả năng sử dụng cần hoàn thành trong một khoảng thời gian nhất định.","t":"Quality and testing","sy":[["Specialist - Usability Testing 2018",1]],"syn":[],"see":[]},{"s":"usability-testing","n":"usability testing","a":"","d":"Testing to evaluate the degree to which the system can be used by specified users with effectiveness, efficiency and satisfaction in a specified context of use.","vn":"kiểm thử khả năng sử dụng (usability testing)","vd":"Kiểm thử nhằm đánh giá mức độ mà hệ thống có thể được những người dùng xác định sử dụng với tính hiệu quả, hiệu suất và sự hài lòng trong một bối cảnh sử dụng xác định.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Analyst v4.0",0],["Advanced Technical Test Analyst v4.0",0],["Advanced Agile Tester v2.0",0],["Foundation Agile Tester 2014",0],["Specialist - Acceptance Testing 2019",0],["Specialist - AI Testing v2.0",0],["Specialist - Gambling Industry Tester 2018",0],["Specialist - Game Testing v1.0.1",0],["Specialist - Mobile Application Testing 2019",1],["Specialist - Performance Testing 2018",0],["Specialist - Usability Testing 2018",1]],"syn":[],"see":[]},{"s":"use-case-testing","n":"use case testing","a":"","d":"A black-box test technique in which test cases are designed to exercise use case behaviors.","vn":"kiểm thử ca sử dụng (use case testing)","vd":"Một kỹ thuật kiểm thử hộp đen trong đó các ca kiểm thử được thiết kế để thực thi các hành vi của ca sử dụng (use case).","t":"Quality and testing","sy":[],"syn":[],"see":[]},{"s":"user-acceptance-testing","n":"user acceptance testing","a":"UAT","d":"A type of acceptance testing performed to determine if intended users accept the system.","vn":"kiểm thử chấp nhận người dùng (user acceptance testing)","vd":"Một loại kiểm thử chấp nhận được thực hiện để xác định xem những người dùng dự kiến có chấp nhận hệ thống hay không.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Management v3.0",0],["Advanced Test Analyst v4.0",0],["Advanced Test Automation Engineering v2.0",0],["Advanced Agile Tester v2.0",0],["Foundation Agile Tester 2014",0],["Specialist - Acceptance Testing 2019",0],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - Mobile Application Testing 2019",0],["Specialist - Performance Testing 2018",0],["Specialist - Quality in DevOps v1.0",0]],"syn":[],"see":[["acceptance testing","acceptance-testing"]]},{"s":"user-controllability","n":"user controllability","a":"","d":"The degree to which a user can intervene in a system’s functioning in a timely manner.","vn":"khả năng kiểm soát của người dùng (user controllability)","vd":"Mức độ mà người dùng có thể can thiệp vào hoạt động của hệ thống một cách kịp thời.","t":"Quality and testing","sy":[["Specialist - AI Testing v2.0",1]],"syn":[],"see":[]},{"s":"user-error-protection","n":"user error protection","a":"","d":"The degree to which a component or system protects users against making errors.","vn":"bảo vệ chống lỗi người dùng (user error protection)","vd":"Mức độ mà một thành phần hoặc hệ thống bảo vệ người dùng khỏi việc mắc lỗi.","t":"Quality and testing","sy":[["Advanced Technical Test Analyst v4.0",0]],"syn":[],"see":[]},{"s":"user-experience","n":"user experience","a":"","d":"A person's perceptions and responses resulting from the use or anticipated use of a software product.","vn":"trải nghiệm người dùng (user experience)","vd":"Nhận thức và phản ứng của một người phát sinh từ việc sử dụng hoặc dự kiến sử dụng một sản phẩm phần mềm.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Analyst v4.0",1],["Foundation Agile Tester 2014",0],["Specialist - Acceptance Testing 2019",1],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - AI Testing v1.0",0],["Specialist - Finance Testing v1.0",0],["Specialist - Game Testing v1.0.1",0],["Specialist - Mobile Application Testing 2019",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Security Test Engineer v1.0",0],["Specialist - Usability Testing 2018",1]],"syn":[],"see":[]},{"s":"user-interface","n":"user interface","a":"UI","d":"All components of a system that provide information and controls for the user to accomplish specific tasks with the system.","vn":"giao diện người dùng (user interface)","vd":"Tất cả các thành phần của một hệ thống cung cấp thông tin và các điều khiển để người dùng hoàn thành các tác vụ cụ thể với hệ thống.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",0],["Advanced Technical Test Analyst v4.0",0],["Advanced Test Automation Engineering v2.0",0],["Advanced Agile Tester v2.0",0],["Expert Test Management 2011",0],["Foundation Agile Tester 2014",0],["Advanced Agile Technical Tester 2019",0],["Specialist - Acceptance Testing 2019",0],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - AI Testing v1.0",0],["Specialist - AI Testing v2.0",0],["Specialist - Finance Testing v1.0",0],["Specialist - Gambling Industry Tester 2018",0],["Specialist - Game Testing v1.0.1",0],["Specialist - Mobile Application Testing 2019",0],["Specialist - Performance Testing 2018",0],["Specialist - Security Tester 2016",0],["Specialist - Test Automation Strategy v1.0",0],["Specialist - Testing with Generative AI v1.0",0],["Specialist - Usability Testing 2018",1]],"syn":[],"see":[]},{"s":"user-interface-aesthetics","n":"user interface aesthetics","a":"","d":"The degree to which a user interface enables pleasing and satisfying interaction for the user.","vn":"thẩm mỹ giao diện người dùng (user interface aesthetics)","vd":"Mức độ mà giao diện người dùng mang lại sự tương tác dễ chịu và thỏa mãn cho người dùng.","t":"Quality and testing","sy":[["Advanced Technical Test Analyst v4.0",0],["Specialist - Usability Testing 2018",0]],"syn":["attractiveness"],"see":[["usability","usability"]]},{"s":"user-interface-guideline","n":"user interface guideline","a":"","d":"A low-level, specific rule or recommendation for user interface design that leaves little room for interpretation so designers implement it similarly. It is often used to ensure consistency in the appearance and behavior of the user interface of the systems produced by an organization.","vn":"hướng dẫn giao diện người dùng (user interface guideline)","vd":"Một quy tắc hoặc khuyến nghị cụ thể, ở mức chi tiết cho việc thiết kế giao diện người dùng, ít chỗ cho việc diễn giải khác nhau để các nhà thiết kế triển khai tương tự nhau. Nó thường được dùng để đảm bảo tính nhất quán về hình thức và hành vi của giao diện người dùng trong các hệ thống do một tổ chức tạo ra.","t":"Quality and testing","sy":[["Specialist - Usability Testing 2018",1]],"syn":[],"see":[]},{"s":"user-story-testing","n":"user story testing","a":"","d":"A black-box test technique in which test conditions are the acceptance criteria of user stories.","vn":"kiểm thử câu chuyện người dùng (user story testing)","vd":"Một kỹ thuật kiểm thử hộp đen trong đó các điều kiện kiểm thử là các tiêu chí chấp nhận của các câu chuyện người dùng (user story).","t":"Quality and testing","sy":[],"syn":[],"see":[["user story","user-story"]]},{"s":"user-survey","n":"user survey","a":"","d":"A usability evaluation whereby a representative sample of users are asked to report subjective evaluation into a questionnaire based on their experience in using a component or system.","vn":"khảo sát người dùng (user survey)","vd":"Một hình thức đánh giá khả năng sử dụng trong đó một mẫu người dùng đại diện được yêu cầu báo cáo đánh giá chủ quan vào một bảng câu hỏi dựa trên trải nghiệm của họ khi sử dụng một thành phần hoặc hệ thống.","t":"Quality and testing","sy":[["Specialist - AI Testing v1.0",0],["Specialist - Usability Testing 2018",1]],"syn":[],"see":[]},{"s":"user-agent-based-testing","n":"user-agent based testing","a":"","d":"A test type in which a test client is used to switch the user agent string and identify itself as a different client while executing test suites.","vn":"kiểm thử dựa trên user-agent (user-agent based testing)","vd":"Một loại kiểm thử trong đó một client kiểm thử được dùng để thay đổi chuỗi user agent và tự nhận dạng là một client khác trong khi thực thi các bộ kiểm thử.","t":"Quality and testing","sy":[["Specialist - Mobile Application Testing 2019",1]],"syn":[],"see":[]},{"s":"user-based-quality","n":"user-based quality","a":"","d":"A view of quality measured by the degree that the needs, wants, and desires of a user are met.","vn":"chất lượng dựa trên người dùng (user-based quality)","vd":"Một quan điểm về chất lượng được đo bằng mức độ đáp ứng các nhu cầu, mong muốn và khao khát của người dùng.","t":"Quality and testing","sy":[["Expert Improving the Test Process v1.0.1",1]],"syn":[],"see":[]},{"s":"v-model","n":"V-model","a":"","d":"A sequential software development lifecycle model describing a one-for-one relationship between major phases of software development from business requirements specification to delivery, and corresponding test levels from acceptance testing to component testing.","vn":"mô hình chữ V (V-model)","vd":"Một mô hình vòng đời phát triển phần mềm tuần tự, mô tả mối quan hệ một-một giữa các giai đoạn chính của phát triển phần mềm, từ đặc tả yêu cầu nghiệp vụ đến bàn giao, với các mức kiểm thử tương ứng, từ kiểm thử chấp nhận đến kiểm thử thành phần.","t":"Quality and testin úng, có thể bị khai thác và có thể gây ra thiệt hại.","t":"Quality and testing","sy":[["Advanced Agile Tester v2.0",0],["Specialist - Quality in DevOps v1.0",0]],"syn":[],"see":[["cross-site scripting","cross-site-scripting"],["dynamic application security testing","dynamic-application-security-testing"],["static application security testing","static-application-security-testing"],["fuzz testing","fuzz-testing"],["penetration testing","penetration-testing"],["weakness","weakness"]]},{"s":"vulnerability-scanning","n":"vulnerability scanning","a":"","d":"A type of static analysis that detects vulnerabilities.","vn":"quét lỗ hổng (vulnerability scanning)","vd":"Một loại phân tích tĩnh nhằm phát hiện các lỗ hổng.","t":"Quality and testing","sy":[["Specialist - Finance Testing v1.0",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Security Test Engineer v1.0",1]],"syn":[],"see":[]},{"s":"walkthrough","n":"walkthrough","a":"","d":"A type of formal review in which an author leads members of the review through a work product and the members ask questions and make comments.","vn":"duyệt qua (walkthrough)","vd":"Một loại rà soát chính thức trong đó tác giả dẫn dắt các thành viên rà soát đi qua một sản phẩm công việc, còn các thành viên đặt câu hỏi và đưa ra nhận xét.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Agile Tester v2.0",0],["Expert Improving the Test Process 2011",0],["Specialist - Acceptance Testing 2019",0],["Specialist - Model-Based Testing v1.1",0],["Specialist - Security Tester 2016",0]],"syn":["structured walkthrough"],"see":[["peer review","peer-review"]]},{"s":"weakness","n":"weakness","a":"","d":"A condition that may lead to undesirable behavior.","vn":"điểm yếu (weakness)","vd":"Một tình trạng có thể dẫn đến hành vi không mong muốn.","t":"Quality and testing","sy":[["Advanced Agile Tester v2.0",0],["Specialist - AI Testing v2.0",0],["Specialist - Finance Testing v1.0",0],["Specialist - Quality in DevOps v1.0",0]],"syn":[],"see":[["vulnerability","vulnerability"]]},{"s":"web-content-accessibility-guidelines","n":"Web Content Accessibility Guidelines","a":"WCAG","d":"A part of a series of web accessibility guidelines published by the Web Accessibility Initiative (WAI) of the World Wide Web Consortium (W3C), the main international standards organization for the internet. They consist of a set of guidelines for making content accessible, primarily for people with disabilities.","vn":"Hướng dẫn Khả năng Tiếp cận Nội dung Web (WCAG)","vd":"Một phần trong loạt hướng dẫn về khả năng tiếp cận web do Sáng kiến Khả năng Tiếp cận Web (WAI) của World Wide Web Consortium (W3C) - tổ chức tiêu chuẩn quốc tế chính cho internet - công bố. Chúng bao gồm một tập hướng dẫn giúp nội dung có thể tiếp cận được, chủ yếu dành cho người khuyết tật.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",0],["Specialist - Usability Testing 2018",1]],"syn":[],"see":[]},{"s":"website-analysis-and-measurement-inventory","n":"Website Analysis and Measurement Inventory","a":"WAMMI","d":"A commercial website analysis service providing a questionnaire for measuring user experience and assessing delivery of business goals online.","vn":"Bộ công cụ Phân tích và Đo lường Website (WAMMI)","vd":"Một dịch vụ phân tích website thương mại, cung cấp bảng câu hỏi để đo lường trải nghiệm người dùng và đánh giá mức độ đạt được các mục tiêu kinh doanh trực tuyến.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",0]],"syn":[],"see":[["Software Usability Measurement Inventory","software-usability-measurement-inventory"]]},{"s":"white-box-test-technique","n":"white-box test technique","a":"","d":"A test technique based on the internal structure of a component or system.","vn":"kỹ thuật kiểm thử hộp trắng (white-box test technique)","vd":"Một kỹ thuật kiểm thử dựa trên cấu trúc bên trong của một thành phần hoặc hệ thống.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Test Analyst v4.0",0],["Advanced Technical Test Analyst v4.0",1],["Advanced Agile Tester v2.0",0],["Specialist - Automotive Software Tester v2.1",0]],"syn":["white-box test design technique","structure-based test technique"],"see":[]},{"s":"white-box-testing","n":"white-box testing","a":"","d":"A test approach based on the internal structure of a component or system.","vn":"kiểm thử hộp trắng (white-box testing)","vd":"Một cách tiếp cận kiểm thử dựa trên cấu trúc bên trong của một thành phần hoặc hệ thống.","t":"Quality and testing","sy":[["Advanced Test Management v3.0",0],["Advanced Technical Test Analyst v4.0",0],["Advanced Test Automation Engineering v2.0",0],["Advanced Agile Tester v2.0",0],["Expert Test Management 2011",0],["Foundation Agile Tester 2014",0],["Specialist - AI Testing v1.0",0],["Specialist - AI Testing v2.0",0],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Gambling Industry Tester 2018",0],["Specialist - Security Tester 2016",0],["Specialist - Security Test Engineer v1.0",0],["Specialist - Testing with Generative AI v1.0",0]],"syn":["clear-box testing","code-based testing","glass-box testing","logic-coverage testing","logic-driven testing","structural testing","structure-based testing"],"see":[]},{"s":"wild-pointer","n":"wild pointer","a":"","d":"A pointer that references a location that is out of scope for that pointer or that does not exist.","vn":"con trỏ hoang (wild pointer)","vd":"Một con trỏ tham chiếu đến một vị trí nằm ngoài phạm vi của con trỏ đó hoặc không tồn tại.","t":"Quality and testing","sy":[["Advanced Technical Test Analyst v4.0",1]],"syn":[],"see":[]}],"site":{"code":"GLOSSARY","name":"ISTQB song ngữ","key":"gloss-v1","views":["gloss"]}}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=(s,r=document)=>r.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SITE=D.site||{code:'CT-AI',name:'Luyện thi',key:'ctai-v1',views:['home','hoc','nghe','thuatngu','luyentap','game','thi']};
const KEY=SITE.key;
document.getElementById('scode').textContent=SITE.code;document.getElementById('sname').textContent=SITE.name;
let S={lang:'both',stats:{},hist:[],read:{},exam:null,game:{},toeic:{known:{},best:{}},film:{seen:{},notes:{},mine:[]},learn:{pos:{},rate:0.9,sub:'both',voice:''}};
try{const raw=localStorage.getItem(KEY);if(raw)Object.assign(S,JSON.parse(raw));else if(SITE.migrate){const o=JSON.parse(localStorage.getItem(SITE.migrate.from)||'{}');SITE.migrate.fields.forEach(f=>{if(o[f])S[f]=o[f]})}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const CH=D.chapters.filter(c=>c.n>=1&&c.n<=7);
const chOf=q=>+q.lo.replace('AI-','').split('.')[0];
const QS=D.questions, QBY=Object.fromEntries(QS.map(q=>[q.id,q]));
const isOff=q=>/^[QA]\d/.test(q.id);
// text helpers: plain = needs escaping (syllabus), html = trusted markup (questions)
function two(o,html,tag='div'){const f=x=>html?x:esc(x).replace(/\n/g,'<br>');const en=o.en||'',vi=o.vi||'';
  if(S.lang==='en'||!vi||vi===en)return `<${tag}>${f(en)}</${tag}>`;
  if(S.lang==='vi')return `<${tag}>${f(vi)}</${tag}>`;
  return `<${tag}>${f(en)}</${tag}><${tag} class="vi">${f(vi)}</${tag}>`}
const one=o=>S.lang==='en'?o.en:(o.vi||o.en);
const fig=(h,src)=>{let i=0;const a=src||[];return h.replace(/\[\[FIGURE\]\]/g,()=>{const u=i<a.length?a[i]:'';i++;return u?`<img src="${u}" alt="Hình minh hoạ của câu hỏi">`:''})};
const fmt=s=>{s=Math.max(0,s|0);return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const sameSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
const loText=lo=>D.los[lo]?one(D.los[lo]):'';

const ALLV=[['home','Tổng quan'],['hoc','Tài liệu song ngữ'],['nghe','Học tiếng Anh'],['thuatngu','Thuật ngữ'],['gloss','Glossary ISTQB'],['luyentap','Luyện tập'],['game','Trò chơi'],['thi','Thi thử'],['toeic','TOEIC 600'],['phim','Phim ngắn']];
const ICON={"home": "<path d=\"M3 11l9-7 9 7\"/><path d=\"M5 10v10h14V10\"/>", "hoc": "<path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z\"/><path d=\"M4 19V5\"/>", "nghe": "<path d=\"M4 14v-2a8 8 0 0 1 16 0v2\"/><rect x=\"3\" y=\"14\" width=\"4\" height=\"6\" rx=\"1\"/><rect x=\"17\" y=\"14\" width=\"4\" height=\"6\" rx=\"1\"/>", "gloss": "<circle cx=\"11\" cy=\"11\" r=\"6\"/><path d=\"M20 20l-4.5-4.5\"/>", "thuatngu": "<path d=\"M4 6h16M4 12h10M4 18h7\"/>", "luyentap": "<path d=\"M9 11l3 3 8-8\"/><path d=\"M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11\"/>", "game": "<rect x=\"2\" y=\"7\" width=\"20\" height=\"11\" rx=\"4\"/><path d=\"M7 11v3M5.5 12.5h3\"/><circle cx=\"16\" cy=\"12\" r=\"1\"/><circle cx=\"18\" cy=\"14\" r=\"1\"/>", "thi": "<circle cx=\"12\" cy=\"13\" r=\"8\"/><path d=\"M12 9v4l2 2M9 2h6\"/>", "toeic": "<path d=\"M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z\"/><path d=\"M8 9h8M8 13h6\"/>", "phim": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M10 9l5 3-5 3z\"/>"};
const VIEWS=SITE.views.map(k=>ALLV.find(v=>v[0]===k)).filter(Boolean);
document.title=SITE.code+' · '+SITE.name;
if(VIEWS.length<2)document.body.classList.add('solo');
let view=VIEWS[0][0], sub={}, tick=null;
function nav(){ $('#nav').innerHTML=VIEWS.map(([k,l])=>`<a href="#${k}" ${k===view?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]||''}</svg>${l}</a>`).join('');
  document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===S.lang)) }
$('#lang').onclick=e=>{const l=e.target.dataset.l;if(l){S.lang=l;save();render()}};
window.addEventListener('hashchange',()=>{route();render()});
function route(){const h=location.hash.slice(1);view=VIEWS.some(v=>v[0]===h)?h:VIEWS[0][0]}
function render(){nav();clearInterval(tick);stopTalk();app.onclick=app.onchange=app.onkeydown=null;app.className=((view==='thi'&&S.exam&&!S.exam.done)||(view==='hoc'&&S.lang==='both'))?'wide':'';document.body.dataset.view=view;({home,hoc,nghe,gloss,thuatngu,luyentap,game,thi,toeic,phim})[view]()}
function go(v){if(location.hash.slice(1)===v){view=v;render()}else location.hash=v;window.scrollTo(0,0)}

/* ---------- Tổng quan ---------- */
function mastery(n){const qs=QS.filter(q=>chOf(q)===n);const ok=qs.filter(q=>S.stats[q.id]?.last===1).length;return [ok,qs.length]}
function home(){
  const off=QS.filter(q=>/^Q\d/.test(q.id)), pts=off.reduce((s,q)=>s+q.points,0);
  const done=Object.keys(S.stats).length;
  app.innerHTML=`<div class="hero"><span class="eyebrow">ISTQB® Specialist · v2.0</span><h1>Ôn thi Certified Tester AI Testing (CT-AI)</h1>
  <p class="muted">Đọc toàn bộ giáo trình song ngữ, nghe giáo trình bằng tiếng Anh, tra thuật ngữ, luyện câu hỏi, chơi trò chơi theo chương và thi thử có tính giờ. Tiến độ được lưu trên trình duyệt này.</p></div>
  <div class="panel stack"><h3>Cấu trúc đề mẫu</h3><div class="facts">
    <div class="fact"><b>${off.length}</b>câu hỏi trắc nghiệm</div><div class="fact"><b>${pts}</b>điểm tối đa (đề mẫu A)</div>
    <div class="fact"><b>65%</b>điểm đạt, tức ${Math.ceil(pts*.65)}/${pts}</div><div class="fact"><b>60′</b>làm bài (75′ nếu không thi bằng tiếng mẹ đẻ)</div></div>
    <p class="small muted">Điểm đạt và thời gian là quy định chung của ISTQB cho kỳ thi 40 câu; hãy xác nhận lại với đơn vị tổ chức thi của bạn. Các chương Giới thiệu, bài thực hành (HO), tài liệu tham khảo và phụ lục không nằm trong phạm vi thi.</p>
    <div class="row"><button class="btn pri" data-go="thi">Thi thử</button><button class="btn" data-go="luyentap">Luyện tập theo chương</button><button class="btn" data-go="game">Chơi để học</button><button class="btn" data-go="hoc">Đọc tài liệu</button><button class="btn" data-go="nghe">Học tiếng Anh</button></div></div>
  <div class="panel"><h3>Tiến độ theo chương</h3><p class="small muted">Tỷ lệ câu hỏi bạn trả lời đúng ở lần làm gần nhất. Đã làm ${done}/${QS.length} câu trong ngân hàng.</p>
    ${CH.map(c=>{const [ok,t]=mastery(c.n);return `<div class="chrow"><div><b>${esc(one(c.title))}</b><div class="small muted">${c.minutes} phút học · ${S.read[c.n]?'đã đọc':'chưa đọc'}</div></div>
      <div class="row"><div class="meter"><i style="width:${t?ok/t*100:0}%"></i></div><span class="mono small">${ok}/${t}</span></div>
      <button class="btn small" data-prac="${c.n}">Luyện</button></div>`}).join('')}</div>
  <div class="panel stack"><h3>Lịch sử thi thử</h3>${S.hist.length?`<div class="tw"><table><tr><th>Ngày</th><th>Đề</th><th>Điểm</th><th>Kết quả</th><th>Thời gian</th></tr>${S.hist.slice().reverse().map(h=>`<tr><td>${esc(h.date)}</td><td>${esc(h.name)}</td><td class="mono">${h.score}/${h.total} (${Math.round(h.score/h.total*100)}%)</td><td><span class="chip ${h.pass?'ok':'bad'}">${h.pass?'ĐẠT':'CHƯA ĐẠT'}</span></td><td class="mono">${fmt(h.used)}</td></tr>`).join('')}</table></div>`:'<p class="muted">Chưa có lần thi thử nào.</p>'}
    <div id="rst"><button class="btn small" id="reset">Xoá toàn bộ tiến độ</button></div></div>
  <p class="small muted">Nguồn: ISTQB® CT-AI Syllabus v2.0 và Sample Exam set A v2.2, © International Software Testing Qualifications Board. Bản dịch tiếng Việt không chính thức. ${QS.filter(q=>!isOff(q)).length} câu "bổ sung" do AI soạn theo giáo trình, không phải câu hỏi của ISTQB.</p>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.go)go(b.dataset.go);
    if(b.dataset.prac){sub.prac={ch:[+b.dataset.prac]};go('luyentap')}
    if(b.id==='reset')$('#rst').innerHTML='<span>Xoá hết thống kê và lịch sử?</span> <button class="btn small" id="yes">Xoá</button> <button class="btn small" id="no">Giữ lại</button>';
    if(b.id==='yes'){S.stats={};S.hist=[];S.read={};S.exam=null;S.game={};S.toeic={known:{},best:{}};save();render()}
    if(b.id==='no')render()};
}

/* ---------- Học ---------- */
function block(b){
  if(b.type==='figure')return b.img?`<img src="${b.img}" alt="${esc(b.en||'Hình minh hoạ')}">`:'';
  if(b.type==='table')return `<div class="tw"><table>${b.rows.map((r,i)=>'<tr>'+r.map(c=>{const t=b.header&&i===0?'th':'td';return `<${t}>${two(c)}</${t}>`}).join('')+'</tr>').join('')}</table></div>`;
  const tag={h1:'h2',h2:'h3',h3:'h4',h4:'h5'}[b.type];
  if(tag)return `<div class="pair hd">${two(b,false,tag)}</div>`;
  if(b.type==='toc'){const r=b.ref?'  ·  '+b.ref:'';return `<div class="pair blk toc l${b.level||0}">${two({en:b.en+r,vi:b.vi+r})}</div>`}
  if(b.type==='li')return `<div class="pair blk li l${b.level||1}">${two(b)}</div>`;
  return `<div class="pair blk">${two(b)}</div>`}
function hoc(){
  const all=D.chapters, cur=all.find(c=>c.id===sub.ch)||all[0];sub.ch=cur.id;const i=all.indexOf(cur);
  app.innerHTML=`<div class="stack"><h1>Tài liệu song ngữ</h1><p class="muted">Toàn bộ ISTQB® CT-AI Syllabus v2.0 (93 trang): nguyên văn tiếng Anh và bản dịch tiếng Việt, chia theo phần.</p></div>
  <div class="row"><label for="chsel" class="muted">Phần</label><select id="chsel">${all.map(c=>`<option value="${c.id}" ${c===cur?'selected':''}>${esc(one(c.title))}</option>`).join('')}</select></div>
  <div class="panel doc">${cur.blocks.map(block).join('')}</div>
  <div class="row">${i>0?'<button class="btn" id="prev">← Phần trước</button>':''}
   ${cur.n>=1&&cur.n<=7?`<button class="btn" id="read">${S.read[cur.n]?'Đã đọc ✓':'Đánh dấu đã đọc'}</button><button class="btn pri" id="prac">Luyện câu hỏi chương này</button>`:''}
   ${i<all.length-1?'<button class="btn" id="next">Phần sau →</button>':''}</div>`;
  $('#chsel').onchange=e=>{sub.ch=e.target.value;render();window.scrollTo(0,0)};
  app.onclick=e=>{const id=e.target.id;
    if(id==='prev'||id==='next'){sub.ch=all[i+(id==='next'?1:-1)].id;render();window.scrollTo(0,0)}
    if(id==='read'){S.read[cur.n]=!S.read[cur.n];save();render()}
    if(id==='prac'){sub.prac={ch:[cur.n]};go('luyentap')}};
}

/* ---------- Glossary ISTQB ---------- */
const GL=D.gloss||[], GLBY=Object.fromEntries(GL.map(g=>[g.s,g]));
const GSY=[...new Set(GL.flatMap(g=>g.sy.map(x=>x[0])))].sort((a,b)=>(GL.filter(g=>g.sy.some(x=>x[0]===b)).length)-(GL.filter(g=>g.sy.some(x=>x[0]===a)).length));
const GTY=[...new Set(GL.map(g=>g.t))].sort();
const glS=()=>S.gl||(S.gl={known:{},best:{},f:{sy:'',ty:'',kw:false,q:'',l:'',st:'all'}});
const glDef=g=>S.lang==='en'?esc(g.d):S.lang==='vi'?esc(g.vd||g.d):`${esc(g.d)}<div class="vi">${esc(g.vd||'')}</div>`;
const glName=g=>`${esc(g.n)}${g.a?`<span class="ab">${esc(g.a)}</span>`:''}${S.lang!=='en'&&g.vn?`<div class="vi small">${esc(g.vn)}</div>`:''}`;
function glPool(){const G=glS(),f=G.f,q=(f.q||'').trim().toLowerCase();
  return GL.filter(g=>(!f.sy||g.sy.some(x=>x[0]===f.sy&&(!f.kw||x[1])))&&(!f.ty||g.t===f.ty)&&(!f.l||(f.l==='#'?!/^[a-z]/i.test(g.n):g.n[0].toUpperCase()===f.l))
    &&(f.st==='all'||(f.st==='known')===!!G.known[g.s])&&(!q||(g.n+' '+g.a+' '+g.vn+' '+g.d+' '+g.vd+' '+g.syn.join(' ')).toLowerCase().includes(q)))}
function gloss(){
  const G=glS(),f=G.f,m=sub.gm||(sub.gm={mode:'list',page:0});
  const pool=glPool(),known=GL.filter(g=>G.known[g.s]).length;
  const tabs=`<div class="seg" role="group" aria-label="Chế độ">${[['list','Danh sách'],['card','Thẻ ghi nhớ'],['quiz','Đoán thuật ngữ'],['match','Nối cặp'],['speed','Phản xạ 60 giây'],['type','Gõ thuật ngữ']].map(([k,l])=>`<button data-gmode="${k}" aria-pressed="${m.mode===k}">${l}</button>`).join('')}</div>`;
  const filt=`<div class="panel stack"><div class="row"><b>Đã thuộc ${known}/${GL.length}</b><div class="meter"><i style="width:${known/GL.length*100}%"></i></div></div>
    <input type="search" id="gq" placeholder="Tìm thuật ngữ, viết tắt, định nghĩa (Anh hoặc Việt)" value="${esc(f.q)}" aria-label="Tìm trong glossary">
    <div class="row"><label for="gsy" class="small muted">Giáo trình</label><select id="gsy"><option value="">Tất cả (${GL.length})</option>${GSY.map(x=>`<option value="${esc(x)}" ${f.sy===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <label class="ck small"><input type="checkbox" id="gkw" ${f.kw?'checked':''} ${f.sy?'':'disabled'}><span>Chỉ từ khóa của giáo trình</span></label></div>
    <div class="row"><label for="gty" class="small muted">Nhóm</label><select id="gty"><option value="">Mọi nhóm</option>${GTY.map(x=>`<option ${f.ty===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <label for="gst" class="small muted">Trạng thái</label><select id="gst"><option value="all">Mọi thuật ngữ</option><option value="new">Chưa thuộc</option><option value="known">Đã thuộc</option></select></div>
    <div class="letters">${['','#',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(l=>`<button data-gl="${l}" aria-pressed="${f.l===l}">${l||'Tất cả'}</button>`).join('')}</div>

  const bindFilt=()=>{const inp=$('#gq');inp.oninput=()=>{f.q=inp.value;m.page=0;save();gloss();const x=$('#gq');x.focus();x.setSelectionRange(x.value.length,x.value.length)};$('#gst').value=f.st};

    if(b.dataset.see){f.q=GLBY[b.dataset.see]?GLBY[b.dataset.see].n:b.dataset.see;f.l='';f.sy='';f.ty='';f.st='all';sub.gm={mode:'list',page:0};save();render();window.scrollTo(0,0);return true}

  if(m.mode==='list'){const per=40,pages=Math.max(1,Math.ceil(pool.length/per));m.page=Math.min(m.page,pages-1);

      <div class="meta"><span class="chip">${esc(g.t)}</span>${g.sy.map(x=>`<span class="chip ${x[1]?'k':''}" title="${x[1]?'Là từ khóa của giáo trình này':'Được dùng trong giáo trình này'}">${esc(x[0])}${x[1]?' ★':''}</span>`).join('')}</div>
      <div class="small"><a href="https://glossary.istqb.org/en_US/term/${encodeURIComponent(g.s)}" target="_blank" rel="noopener">Xem trên glossary.istqb.org</a></div></div>
      <div class="stack" style="align-items:flex-end">${spk(g.n)}<label class="ck small"><input type="checkbox" data-gk="${esc(g.s)}" ${G.known[g.s]?'checked':''}><span>Đã thuộc</span></label></div></div>`).join('')||'<p class="muted">Không có thuật ngữ nào khớp bộ lọc.</p>'}</div>${pager}
      <p class="small muted">★ = từ khóa (keyword) của giáo trình đó. Nguồn: ISTQB® Glossary, glossary.istqb.org, © ISTQB. Bản dịch tiếng Việt không chính thức.</p>`;
    bindFilt();
    app.onclick=e=>{const sb=e.target.closest('[data-say]');if(sb){speak(sb.dataset.say);return}if(base(e))return;const id=e.target.id;
      if(id==='gpp'||id==='gpn'){m.page+=id==='gpn'?1:-1;render();window.scrollTo(0,0)}};return}
  const need={card:1,quiz:4,match:6,speed:4,type:1}[m.mode];
  if(pool.length<need){app.innerHTML=head+`<div class="panel"><p>Cần ít nhất ${need} thuật ngữ trong bộ lọc để chơi chế độ này. Hãy nới bộ lọc.</p></div>`;bindFilt();app.onclick=base;return}
  const bestKey=m.mode+'|'+(f.sy||'*')+(f.kw?'*':'');
  const endPanel=(title,body)=>`<div class="panel stack"><h2>${title}</h2>${body}<div class="row"><button class="btn pri" id="gagain">Chơi lại</button><button class="btn" data-gmode="list">Về danh sách</button></div></div>`;
  const again=e=>{if(e.target.id==='gagain'){reset();render();return true}};
  if(m.mode==='card'){
