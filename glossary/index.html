<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>ISTQB Glossary</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one sticky bar of five work areas; each area is a single reading column (max 860px), exam adds a question-map rail. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#eef1f4; --line:#dde3ea;
  --ink:#13233a; --muted:#566779; --vi:#0e5a8a;
  --accent:#0b6b8f; --accent-ink:#ffffff; --accent-soft:#dcedf4;
  --ok:#1b7a43; --ok-soft:#dff3e6; --bad:#b3261e; --bad-soft:#fbe4e2; --warn:#8a5a00; --warn-soft:#fbefd2;
  --stage:#0d1620; --stage-fg:#f3f7fb; --stage-vi:#8fd0f2; --stage-dim:#9db1c2; --stage-line:#2a3c4d;
  --radius:12px; --shadow:0 1px 2px rgba(16,32,52,.06),0 4px 14px rgba(16,32,52,.05);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#151d26; --sunk:#1c2631; --line:#2a3644;
  --ink:#e6edf3; --muted:#9aabbd; --vi:#7cc4ea;
  --accent:#4fb3d9; --accent-ink:#06202b; --accent-soft:#17384a; --shadow:none;
  --ok:#5fd08c; --ok-soft:#153524; --bad:#ff8a80; --bad-soft:#3d1c1a; --warn:#f0c25a; --warn-soft:#3a2e10; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#151d26; --sunk:#1c2631; --line:#2a3644;
  --ink:#e6edf3; --muted:#9aabbd; --vi:#7cc4ea;
  --accent:#4fb3d9; --accent-ink:#06202b; --accent-soft:#17384a; --shadow:none;
  --ok:#5fd08c; --ok-soft:#153524; --bad:#ff8a80; --bad-soft:#3d1c1a; --warn:#f0c25a; --warn-soft:#3a2e10; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;margin:0}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top:before{content:"";display:block;height:3px;background:var(--accent)}
.top-in{max-width:1240px;margin:0 auto;padding:8px 16px;display:flex;gap:10px 14px;align-items:center}
.hub{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:600;padding:5px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.hub:hover{color:var(--ink)}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .code{font-family:var(--mono);color:var(--accent);font-size:15px}
.brand .nm{overflow:hidden;text-overflow:ellipsis}
.shell{max-width:1240px;margin:0 auto;padding-inline:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
nav#nav{display:flex;gap:4px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
nav#nav::-webkit-scrollbar{display:none}
nav#nav a{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;border:1px solid var(--line);background:var(--surface);font-size:14px}
nav#nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav#nav a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (min-width:960px){
  .shell{grid-template-columns:210px minmax(0,1fr);gap:36px}
  nav#nav{flex-direction:column;position:sticky;top:64px;align-self:start;padding:28px 0;overflow:visible}
  nav#nav a{border:0;background:transparent;border-radius:8px;padding:9px 12px}
  nav#nav a:hover{background:var(--sunk);color:var(--ink)}
  nav#nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
}
body.solo nav#nav{display:none}
@media (min-width:960px){body.solo .shell{grid-template-columns:minmax(0,1fr);max-width:960px}}
main a{color:var(--accent)}
@media (max-width:520px){.hub .lb{display:none}.top-in .seg button{padding:5px 7px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hero{border-radius:var(--radius);padding:22px 22px 20px;background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.hero .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(24px,4vw,32px)}
main{max-width:880px;width:100%;padding-block:24px 72px;display:flex;flex-direction:column;gap:20px;min-width:0}
main.wide{max-width:none}
h1{font-size:clamp(22px,3.4vw,28px);letter-spacing:-.01em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:13px}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.vi{color:var(--vi)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-block;font-family:var(--mono);font-size:12px;padding:1px 7px;border-radius:4px;background:var(--sunk);white-space:nowrap}
.chip.k{background:var(--accent-soft)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted)}.fact b{display:block;font-family:var(--mono);font-size:24px;color:var(--ink)}
.meter{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden;flex:1;min-width:80px}.meter i{display:block;height:100%;background:var(--accent)}
.chrow{display:grid;grid-template-columns:minmax(0,1fr) 140px 90px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
@media (max-width:560px){.chrow{grid-template-columns:1fr}}
/* study */
.doc h2{font-size:22px;margin-top:22px}.doc h3{font-size:18px;margin-top:18px}.doc h4{font-size:16px;margin-top:14px}.doc h5{font-size:15px;margin-top:10px}
.doc .blk{margin:8px 0}.doc .li{padding-left:18px;position:relative}.doc .li:before{content:"•";position:absolute;left:4px;color:var(--muted)}
.doc .li.l2{margin-left:18px}.doc .li.l3{margin-left:36px}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--sunk)}
.doc img,.q img{background:#fff;border:1px solid var(--line);border-radius:4px;display:block;margin:10px auto;max-width:100%}
.doc .pair{display:block}.doc .toc.l1{padding-left:14px}.doc .toc.l2{padding-left:28px}
@media (min-width:860px){.doc .pair{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start}.doc .pair>:only-child{grid-column:1/-1}.doc .pair.hd>*{margin-top:18px}}
/* game */
.hearts{font-size:20px;letter-spacing:3px;color:var(--bad)}.hearts i{font-style:normal;color:var(--line)}
.stars{font-size:18px;color:var(--warn);letter-spacing:2px;white-space:nowrap}.stars i{font-style:normal;color:var(--line)}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
@media (max-width:640px){.grow{grid-template-columns:1fr}}
.mcols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px;align-items:start}
.mcard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;cursor:pointer;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.mcard.sel{border-color:var(--accent);background:var(--accent-soft)}.mcard.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}.mcard.bad{border-color:var(--bad);background:var(--bad-soft)}
.big{font-family:var(--mono);font-size:22px;font-weight:700}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.lbtn{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 12px;cursor:pointer}
.lbtn.full{border-color:var(--ok)}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.wrow .w{font-size:17px;font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fcard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 0 10px;cursor:pointer;overflow:hidden}
.fcard .th{aspect-ratio:16/9;background:var(--sunk);width:100%;object-fit:cover;display:block}
.fcard>span{padding:0 12px}
.player{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;background:#000;border-radius:8px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
textarea{font:inherit;color:inherit;width:100%;min-height:120px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px}
input[type=text],input[type=url]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;max-width:100%;flex:1;min-width:180px}
.stage{background:var(--stage);color:var(--stage-fg);border-radius:10px;padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px;min-height:min(60vw,400px)}
.stage .where{font-size:12px;color:var(--stage-dim);letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;gap:12px}
.stage .mid{flex:1;display:flex;align-items:center;justify-content:center;min-height:60px}
.stage .mid img{max-height:260px;max-width:100%;background:#fff;border-radius:6px}
.stage .mid .ttl{font-size:clamp(20px,4.2vw,30px);font-weight:700;text-align:center;text-wrap:balance}
.stage .sen{font-size:clamp(17px,3.3vw,23px);font-weight:600;line-height:1.45;text-align:center;text-wrap:pretty}
.stage .svi{font-size:clamp(14px,2.6vw,17px);line-height:1.5;text-align:center;color:var(--stage-vi)}
.stage .bar2{height:4px;background:var(--stage-line);border-radius:2px;overflow:hidden}.stage .bar2 i{display:block;height:100%;background:var(--stage-vi)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctl .btn.big2{font-size:18px;padding:8px 20px;min-width:96px}
.script{position:relative;max-height:52vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.script .u{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 12px;cursor:pointer;line-height:1.5}
.script .u.h{font-weight:700;background:var(--sunk)}.script .u.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.script .u .vi{display:block;font-size:13px}
.gl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.gl-row:last-child{border-bottom:0}.gl-row .nm{font-weight:700;font-size:16px}.gl-row .ab{font-family:var(--mono);font-size:12px;color:var(--accent);margin-left:6px}
.gl-row .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.gl-row .meta .chip{font-size:11px}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline}
.letters{display:flex;flex-wrap:wrap;gap:4px}.letters button{min-width:30px;padding:4px 6px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:12px;color:inherit}
.letters button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.typein{font:inherit;font-size:18px;width:100%;border:1px solid var(--line);background:var(--surface);color:inherit;border-radius:6px;padding:10px}
/* questions */
.q .stem{font-size:16px}.q .stem .vi{margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.opt input{margin-top:5px;flex:none}.opt .k{font-family:var(--mono);font-weight:700;flex:none}.opt .tx{min-width:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .tag{font-size:12px;font-weight:700;margin-left:auto;flex:none}
.expl{border-left:3px solid var(--accent);background:var(--sunk);padding:10px 14px;border-radius:0 6px 6px 0}
.examgrid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;align-items:start}
@media (max-width:800px){.examgrid{grid-template-columns:1fr}}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
.map button{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:4px 0;font-family:var(--mono);font-size:12px;cursor:pointer}
.map button.ans{background:var(--accent-soft)}.map button.flag{border-color:var(--warn);box-shadow:inset 0 -3px 0 var(--warn)}.map button.cur{outline:2px solid var(--accent)}
.map button.ok{background:var(--ok-soft);border-color:var(--ok)}.map button.bad{background:var(--bad-soft);border-color:var(--bad)}
.timer{font-family:var(--mono);font-size:22px;font-weight:700}.timer.low{color:var(--bad)}
.card{min-height:190px;display:flex;flex-direction:column;gap:10px;justify-content:center;text-align:center;cursor:pointer}
.card .term{font-size:24px;font-weight:700}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
label.ck{display:flex;gap:8px;align-items:flex-start}
select,input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;max-width:100%}
.verdict{font-size:26px;font-weight:700}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
:root{--accent:#a3346b;--accent-soft:#f8e1ec;--accent-ink:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#f08cbc;--accent-soft:#3e1a2c;--accent-ink:#2b0618;}}
:root[data-theme="dark"]{--accent:#f08cbc;--accent-soft:#3e1a2c;--accent-ink:#2b0618;}
</style>

 v4.0",0],["Advanced Test Automation Engineering v2.0",1],["Advanced Agile Tester v2.0",1],["Foundation Agile Tester 2014",0],["Advanced Agile Technical Tester 2019",1],["Specialist - Acceptance Testing 2019",0],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - Quality in DevOps v1.0",1]],"syn":[],"see":[]},{"s":"beta-testing","n":"beta testing","a":"","d":"A type of acceptance testing performed at an external site to the developer's test environment by roles outside the development organization.","vn":"Kiểm thử beta (beta testing)","vd":"Một loại kiểm thử chấp nhận được thực hiện tại một địa điểm bên ngoài môi trường kiểm thử của bên phát triển bởi các vai trò bên ngoài tổ chức phát triển.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Expert Improving the Test Process 2011",0],["Foundation Agile Tester 2014",0],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - Gambling Industry Tester 2018",0],["Specialist - Game Testing v1.0.1",0],["Specialist - Quality in DevOps v1.0",0]],"syn":[],"see":[]},{"s":"black-box-test-technique","n":"black-box test technique","a":"","d":"A test technique based on the specification of a component or system.","vn":"Kỹ thuật kiểm thử hộp đen (black-box test technique)","vd":"Một kỹ thuật kiểm thử dựa trên đặc tả của một thành phần hoặc hệ thống.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Test Analyst v4.0",0],["Advanced Technical Test Analyst v4.0",0],["Advanced Agile Tester v2.0",0],["Foundation Agile Tester 2014",0],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Finance Testing v1.0",0],["Specialist - Game Testing v1.0.1",0]],"syn":["black-box test design technique","specification-based test technique"],"see":[]},{"s":"black-box-testing","n":"black-box testing","a":"","d":"A test approach based on the specification of a component or system.","vn":"Kiểm thử hộp đen (black-box testing)","vd":"Một cách tiếp cận kiểm thử dựa trên đặc tả của một thành phần hoặc hệ thống.","t":"Quality and testing","sy":[["Advanced Test Management v3.0",0],["Advanced Test Analyst v4.0",0],["Advanced Test Automation Engineering v2.0",0],["Advanced Agile Tester v2.0",0],["Expert Test Management 2011",0],["Foundation Agile Tester 2014",0],["Specialist - AI Testing v2.0",0],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Gambling Industry Tester 2018",0],["Specialist - Security Test Engineer v1.0",0]],"syn":["specification-based testing"],"see":[]},{"s":"botnet","n":"botnet","a":"","d":"A network of compromised computers, called bots or robots, which is controlled by a third party and used to transmit malware or spam, or to launch attacks.","vn":"Mạng máy tính ma (botnet)","vd":"Một mạng gồm các máy tính bị xâm nhập, gọi là bot hoặc robot, bị một bên thứ ba điều khiển và được dùng để phát tán mã độc hoặc thư rác, hoặc để thực hiện các cuộc tấn công.","t":"Quality and testing","sy":[["Specialist - Security Tester 2016",1],["Specialist - Security Test Engineer v1.0",0]],"syn":[],"see":[]},{"s":"boundary-value","n":"boundary value","a":"","d":"A minimum or maximum value of an ordered equivalence partition.","vn":"Giá trị biên (boundary value)","vd":"Giá trị nhỏ nhất hoặc lớn nhất của một phân vùng tương đương có thứ tự.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Specialist - Automotive Software Tester 2018",0],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Finance Testing v1.0",0],["Specialist - Model-Based Testing v1.1",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Testing with Generative AI v1.0",0]],"syn":[],"see":[]},{"s":"boundary-value-analysis","n":"boundary value analysis","a":"BVA","d":"A black-box test technique in which the test conditions are boundary values.","vn":"Phân tích giá trị biên (BVA)","vd":"Một kỹ thuật kiểm thử hộp đen trong đó các điều kiện kiểm thử là các giá trị biên.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",0],["Advanced Agile Tester v2.0",0],["Foundation Agile Tester 2014",0],["Advanced Agile Technical Tester 2019",0],["Specialist - Acceptance Testing 2019",0],["Specialist - AI Testing v1.0",0],["Specialist - AI Testing v2.0",0],["Specialist - Automotive Software Tester 2018",0],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Finance Testing v1.0",0],["Specialist - Model-Based Testing v1.1",0],["Specialist - Testing with Generative AI v1.0",0]],"syn":[],"see":[["domain testing","domain-testing"]]},{"s":"branch","n":"branch","a":"","d":"A transfer of control between two consecutive nodes in the control flow graph of a test item.","vn":"Nhánh (branch)","vd":"Sự chuyển điều khiển giữa hai nút liên tiếp trong đồ thị luồng điều khiển của một hạng mục kiểm thử.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Management v3.0",0],["Advanced Technical Test Analyst v4.0",0],["Advanced Test Automation Engineering v2.0",0],["Advanced Agile Tester v2.0",0],["Specialist - AI Testing v1.0",0],["Specialist - AI Testing v2.0",0],["Specialist - Finance Testing v1.0",0],["Specialist - Model-Based Testing v1.1",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Security Test Engineer v1.0",0],["Specialist - Testing with Generative AI v1.0",0]],"syn":[],"see":[]},{"s":"branch-coverage","n":"branch coverage","a":"","d":"The coverage of branches in a control flow graph.","vn":"Độ bao phủ nhánh (branch coverage)","vd":"Độ bao phủ các nhánh trong một đồ thị luồng điều khiển.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Test Analyst v4.0",0],["Specialist - Model-Based Testing v1.1",0]],"syn":[],"see":[]},{"s":"branch-testing","n":"branch testing","a":"","d":" A white-box test technique in which the test conditions are branches.","vn":"Kiểm thử nhánh (branch testing)","vd":"Một kỹ thuật kiểm thử hộp trắng trong đó các điều kiện kiểm thử là các nhánh.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Specialist - Automotive Software Tester v2.1",0]],"syn":[],"see":[]},{"s":"bug-bash","n":"bug bash","a":"","d":"An informal, collaborative cross-functional test session to identify defects.","vn":"Phiên săn lỗi tập thể (bug bash)","vd":"Một phiên kiểm thử không chính thức, mang tính cộng tác và liên chức năng nhằm phát hiện khiếm khuyết.","t":"Quality and testing","sy":[["Advanced Agile Tester v2.0",1]],"syn":[],"see":[]},{"s":"bug-hunting","n":"bug hunting","a":"","d":"A test approach in which gamification and awards for defects found are used as a motivator.","vn":"Săn lỗi (bug hunting)","vd":"Một cách tiếp cận kiểm thử trong đó trò chơi hóa và phần thưởng cho các khiếm khuyết tìm được được sử dụng làm động lực.","t":"Quality and testing","sy":[["Specialist - Mobile Application Testing 2019",0],["Specialist - Quality in DevOps v1.0",0]],"syn":[],"see":[]},{"s":"build-verification-test","n":"build verification test","a":"BVT","d":"An automated test that validates the integrity of each new build and verifies its key/core functionality, stability, and testability.","vn":"Kiểm thử xác minh bản build (BVT)","vd":"Một kiểm thử tự động nhằm xác nhận tính toàn vẹn của mỗi bản build mới và xác minh chức năng chính/cốt lõi, độ ổn định và khả năng kiểm thử của bản build đó.","t":"Quality and testing","sy":[["Foundation Agile Tester 2014",1]],"syn":[],"see":[]},{"s":"built-in-quality","n":"built-in quality","a":"","d":"A set of practices to verify that each solution meets quality standards throughout each increment of development, focusing on quality assurance as a shared responsibility.","vn":"Chất lượng tích hợp sẵn (built-in quality)","vd":"Một tập hợp các thực hành nhằm xác minh rằng mỗi giải pháp đáp ứng tiêu chuẩn chất lượng xuyên suốt từng bước tăng trưởng của quá trình phát triển, tập trung vào đảm bảo chất lượng như một trách nhiệm chung.","t":"Quality and testing","sy":[["Specialist - Agile Test Leadership at Scale v2.0",1],["Specialist - Finance Testing v1.0",0],["Specialist - Quality in DevOps v1. cialist - Performance Testing 2018",1]],"syn":[],"see":[]},{"s":"captureplayback","n":"capture/playback","a":"","d":"A test automation approach in which inputs to a test object are recorded during manual testing to generate automated test scripts that can be executed later.","vn":"Ghi/phát lại (capture/playback)","vd":"Một cách tiếp cận tự động hóa kiểm thử trong đó các đầu vào cho đối tượng kiểm thử được ghi lại trong quá trình kiểm thử thủ công để tạo ra các kịch bản kiểm thử tự động có thể thực thi sau này.","t":"Quality and testing","sy":[["Advanced Technical Test Analyst v4.0",1],["Advanced Test Automation Engineering v2.0",1],["Specialist - AI Testing v1.0",0],["Specialist - Game Testing v1.0.1",0],["Specialist - Mobile Application Testing 2019",0]],"syn":["capture/replay","record/playback"],"see":[]},{"s":"causal-loop-diagram","n":"causal loop diagram","a":"","d":"A graphical representation used to visualize cause-effect relationships and feedback loops in a system.","vn":"Sơ đồ vòng lặp nhân quả (causal loop diagram)","vd":"Một biểu diễn đồ họa dùng để trực quan hóa các mối quan hệ nhân quả và các vòng phản hồi trong một hệ thống.","t":"Quality and testing","sy":[["Specialist - Agile Test Leadership at Scale v2.0",1]],"syn":[],"see":[]},{"s":"cause-effect-diagram","n":"cause-effect diagram","a":"","d":"A graphical representation used to organize and display the interrelationships of various possible root causes of a problem. Possible causes of a real or potential defect or failure are organized in categories and subcategories in a horizontal tree-structure, with the (potential) defect or failure as the root node.","vn":"Sơ đồ nhân quả (cause-effect diagram)","vd":"Một biểu diễn đồ họa dùng để sắp xếp và hiển thị mối quan hệ qua lại giữa các nguyên nhân gốc có thể có của một vấn đề. Các nguyên nhân có thể có của một khiếm khuyết hoặc lỗi vận hành (failure) thực tế hoặc tiềm ẩn được sắp xếp theo các nhóm và nhóm con trong một cấu trúc cây nằm ngang, với khiếm  Automotive Software Tester v2.1",0]],"syn":[],"see":[]},{"s":"confidence-interval","n":"confidence interval","a":"","d":"In managing project risks, the period of time within which a contingency action must be implemented in order to be effective in reducing the impact of the risk.","vn":"Khoảng thời gian dự phòng (confidence interval)","vd":"Trong quản lý rủi ro dự án, khoảng thời gian mà trong đó một hành động dự phòng phải được triển khai để có hiệu quả trong việc giảm tác động của rủi ro.","t":"Quality and testing","sy":[["Expert Test Management 2011",1],["Specialist - AI Testing v2.0",0]],"syn":[],"see":[]},{"s":"confidentiality","n":"confidentiality","a":"","d":"The degree to which a component or system only allows authorized accesses to data.","vn":"Tính bảo mật (confidentiality)","vd":"Mức độ mà một thành phần hoặc hệ thống chỉ cho phép các truy cập được ủy quyền tới dữ liệu.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",0],["Advanced Technical Test Analyst v4.0",1],["Specialist - Finance Testing v1.0",0],["Specialist - Game Testing v1.0.1",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Security Test Engineer v1.0",1],["Specialist - Testing with Generative AI v1.0",0]],"syn":[],"see":[]},{"s":"confirmation-testing","n":"confirmation testing","a":"","d":"A type of change-related testing performed after fixing a defect to confirm that a failure caused by that defect does not reoccur.","vn":"Kiểm thử xác nhận (confirmation testing)","vd":"Một loại kiểm thử liên quan đến thay đổi, được thực hiện sau khi sửa một khiếm khuyết nhằm xác nhận rằng lỗi vận hành (failure) do khiếm khuyết đó gây ra không tái diễn.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Test Analyst v4.0",0],["Expert Test Management 2011",0],["Foundation Agile Tester 2014",0],["Specialist - AI Testing v1.0",0],["Specialist - AI Testing v2.0",0],["Specialist - Automotive Software Tester 2018",0],["Specialist - Automotive Software Tester v2.1",0],["S ated process of determining compliance throughout the lifecycle of a work product.","vn":"Xác nhận tuân thủ tự động liên tục (continuous automated compliance validation)","vd":"Quá trình tự động xác định sự tuân thủ xuyên suốt vòng đời của một sản phẩm công việc.","t":"Quality and testing","sy":[["Specialist - Finance Testing v1.0",1]],"syn":[],"see":[]},{"s":"continuous-delivery","n":"continuous delivery","a":"CD","d":"An automated software development procedure in which code changes are automatically built, tested, and prepared for a release to production.","vn":"Phân phối liên tục (CD)","vd":"Một quy trình phát triển phần mềm tự động trong đó các thay đổi mã nguồn được tự động build, kiểm thử và chuẩn bị để phát hành lên môi trường production.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Automation Engineering v2.0",0],["Advanced Agile Tester v2.0",0],["Expert Test Management 2011",0],["Foundation Agile Tester 2014",0],["Advanced Agile Technical Tester 2019",0],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Security Test Engineer v1.0",0],["Specialist - Test Automation Strategy v1.0",0],["Specialist - Testing with Generative AI v1.0",0]],"syn":[],"see":[]},{"s":"continuous-deployment","n":"continuous deployment","a":"","d":"An automated software release procedure in which all code changes are deployed to production after all specified tests have passed.","vn":"Triển khai liên tục (continuous deployment)","vd":"Một quy trình phát hành phần mềm tự động trong đó mọi thay đổi mã nguồn được triển khai lên môi trường production sau khi tất cả các kiểm thử được chỉ định đều đạt.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Automation Engineering v2.0",0],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - Finance Testing v1.0",0],["Specialist - Quality in DevOps v1.0",0]],"syn":[],"see":[]},{"s":"continuous-integration","n":"continuous integration","a":"","d":"An automated software development procedure that merges, integrates and tests all changes as soon as they are committed.","vn":"Tích hợp liên tục (continuous integration)","vd":"Một quy trình phát triển phần mềm tự động thực hiện hợp nhất, tích hợp và kiểm thử mọi thay đổi ngay khi chúng được commit.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Management v3.0",0],["Advanced Technical Test Analyst v4.0",0],["Advanced Test Automation Engineering v2.0",0],["Advanced Agile Tester v2.0",0],["Advanced Agile Technical Tester 2019",0],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - AI Testing v1.0",0],["Specialist - Finance Testing v1.0",0],["Specialist - Model-Based Testing v1.1",0],["Specialist - Quality in DevOps v1.0",1],["Specialist - Security Test Engineer v1.0",0],["Specialist - Testing with Generative AI v1.0",0]],"syn":[],"see":[]},{"s":"continuous-testing","n":"continuous testing","a":"","d":"A test approach that performs testing throughout the software development lifecycle, early and often, and automates tests to obtain feedback as quickly as possible on software release candidates.","vn":"Kiểm thử liên tục (continuous testing)","vd":"Một cách tiếp cận kiểm thử thực hiện kiểm thử xuyên suốt vòng đời phát triển phần mềm, sớm và thường xuyên, đồng thời tự động hóa các kiểm thử để nhận phản hồi nhanh nhất có thể về các bản ứng viên phát hành phần mềm.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Management v3.0",0],["Advanced Agile Tester v2.0",0],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - AI Testing v1.0",0],["Specialist - Finance Testing v1.0",0],["Specialist - Quality in DevOps v1.0",1],["Specialist - Test Automation Strategy v1.0",0]],"syn":[],"see":[]},{"s":"contract-testing","n":"contract testing","a":"","d":"A type of integration testing that verifies that the interfaces are used as specified in their contracts. ","vn":"Kiểm thử hợp đồng (contract testing)","vd":"Một loại kiểm thử tích hợp nhằm xác minh rằng các giao diện được sử dụng đúng như đặc tả trong các hợp đồng của chúng.","t":"Quality and testing","sy":[["Advanced Test Automation Engineering v2.0",1],["Advanced Agile Tester v2.0",0],["Specialist - Quality in DevOps v1.0",1],["Specialist - Test Automation Strategy v1.0",1]],"syn":[],"see":[]},{"s":"control-chart","n":"control chart","a":"","d":"A statistical process control tool used to monitor a process and determine whether it is statistically controlled. It graphically depicts the average value and the upper and lower control limits (the highest and lowest values) of a process.","vn":"Biểu đồ kiểm soát (control chart)","vd":"Một công cụ kiểm soát quy trình bằng thống kê dùng để giám sát một quy trình và xác định xem quy trình đó có được kiểm soát về mặt thống kê hay không. Nó biểu diễn bằng đồ họa giá trị trung bình cùng giới hạn kiểm soát trên và dưới (giá trị cao nhất và thấp nhất) của một quy trình.","t":"Quality and testing","sy":[["Expert Test Management 2011",1]],"syn":["Shewhart chart"],"see":[]},{"s":"control-flow","n":"control flow","a":"","d":"The sequence in which operations are performed by a business process, component or system.","vn":"Luồng điều khiển (control flow)","vd":"Trình tự mà các thao tác được thực hiện bởi một quy trình nghiệp vụ, thành phần hoặc hệ thống.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Analyst v4.0",0],["Advanced Technical Test Analyst v4.0",1],["Expert Test Management 2011",0],["Specialist - Acceptance Testing 2019",0],["Specialist - Security Tester 2016",0]],"syn":[],"see":[]},{"s":"control-flow-analysis","n":"control flow analysis","a":"","d":"A type of static analysis based on a representation of unique paths for executing a component or system.","vn":"Phân tích luồng điều khiển (control flow analysis)","vd":"Một loại phân tích tĩnh dựa trên biểu diễn các đường đi duy nhất để thực thi một thành phần hoặc hệ thống.","t":"Quality and testing","sy":[["Advanced Technical Test Analyst v4.0",1]],"syn":[],"see":[]},{"s":"control-testing","n":"control testing","a":"","d":"A test approach that evaluates whether internal controls are designed appropriately and operate effectively to be within compliance.","vn":"Kiểm thử kiểm soát (control testing)","vd":"Một cách tiếp cận kiểm thử đánh giá xem các biện pháp kiểm soát nội bộ có được thiết kế phù hợp và vận hành hiệu quả để đảm bảo tuân thủ hay không.","t":"Quality and testing","sy":[["Specialist - Finance Testing v1.0",1]],"syn":[],"see":[]},{"s":"convergence-metric","n":"convergence metric","a":"","d":"A metric that shows progress toward a defined criterion, e.g., convergence of the total number of tests executed to the total number of tests planned for execution.","vn":"Thước đo hội tụ (convergence metric)","vd":"Một thước đo thể hiện tiến độ hướng tới một tiêu chí đã xác định, ví dụ sự hội tụ của tổng số kiểm thử đã thực thi về tổng số kiểm thử được lập kế hoạch thực thi.","t":"Quality and testing","sy":[["Expert Test Management 2011",1]],"syn":[],"see":[]},{"s":"cost-of-quality","n":"cost of quality","a":"","d":"The total costs incurred on quality activities and defects, consisting of the costs of defect prevention, appraisal, internal failure, and external failure.","vn":"Chi phí chất lượng (cost of quality)","vd":"Tổng chi phí phát sinh cho các hoạt động chất lượng và khiếm khuyết, bao gồm chi phí phòng ngừa khiếm khuyết, thẩm định, lỗi vận hành nội bộ và lỗi vận hành bên ngoài.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Management v3.0",1],["Advanced Test Analyst v4.0",0],["Expert Improving the Test Process 2011",0],["Expert Test Management 2011",0],["Specialist - Agile Test Leadership at Scale v2.0",0]],"syn":[],"see":[]},{"s":"coverage","n":"coverage","a":"","d":"The degree to which specified coverage items are exercised by a test suite, expressed as a percentage.","vn":"Độ bao phủ (coverage)","vd":"M ributes derived from one or more test conditions by using a test technique.","vn":"Hạng mục bao phủ (coverage item)","vd":"Một thuộc tính hoặc tổ hợp các thuộc tính được suy ra từ một hoặc nhiều điều kiện kiểm thử bằng cách sử dụng một kỹ thuật kiểm thử.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Test Analyst v4.0",0],["Advanced Technical Test Analyst v4.0",0],["Specialist - Acceptance Testing 2019",0],["Specialist - Model-Based Testing v1.1",1]],"syn":[],"see":[["coverage criteria","coverage-criteria"]]},{"s":"critical-testing-processes","n":"Critical Testing Processes","a":"CTP","d":"A content-based model for test process improvement built around twelve critical processes. These include highly visible processes, by which peers and management judge competence and mission-critical processes in which performance affects the company's profits and reputation.","vn":"Các quy trình kiểm thử trọng yếu (CTP)","vd":"Một mô hình dựa trên nội dung dùng để cải tiến quy trình kiểm thử, được xây dựng xoay quanh mười hai quy trình trọng yếu. Các quy trình này bao gồm những quy trình dễ thấy, qua đó đồng nghiệp và ban quản lý đánh giá năng lực, và những quy trình then chốt mà hiệu quả thực hiện ảnh hưởng đến lợi nhuận và danh tiếng của công ty.","t":"Quality and testing","sy":[["Expert Improving the Test Process 2011",1]],"syn":[],"see":[]},{"s":"cross-browser-compatibility","n":"cross-browser compatibility","a":"","d":"The degree to which a website or web application can function across different browsers and degrade gracefully when browser features are absent or lacking.","vn":"Tương thích đa trình duyệt (cross-browser compatibility)","vd":"Mức độ mà một website hoặc ứng dụng web có thể hoạt động trên các trình duyệt khác nhau và suy giảm một cách êm ái khi các tính năng của trình duyệt không có hoặc bị thiếu.","t":"Quality and testing","sy":[["Specialist - Finance Testing v1.0",0],["Specialist - Mobile Application Testing 2019",1]],"syn":[],"see":[]},{"s":"cross-device-testing","n":"cross-device testing","a":"","d":"A test type to determine whether a component or system performs correctly across its intended range of devices.","vn":"Kiểm thử đa thiết bị (cross-device testing)","vd":"Một loại kiểm thử nhằm xác định xem một thành phần hoặc hệ thống có hoạt động đúng trên toàn bộ phạm vi thiết bị dự kiến hay không.","t":"Quality and testing","sy":[["Specialist - AI Testing v2.0",0]],"syn":[],"see":[]},{"s":"cross-site-scripting","n":"cross-site scripting","a":"XSS","d":"A vulnerability that allows attackers to inject malicious code into an otherwise benign website.","vn":"Tấn công chèn mã kịch bản liên trang (XSS)","vd":"Một lỗ hổng cho phép kẻ tấn công chèn mã độc vào một website vốn vô hại.","t":"Quality and testing","sy":[["Advanced Technical Test Analyst v4.0",0],["Specialist - Security Tester 2016",1],["Specialist - Security Test Engineer v1.0",0]],"syn":[],"see":[["vulnerability","vulnerability"]]},{"s":"crowd-testing","n":"crowd testing","a":"","d":"A test approach in which testing is distributed to a large group of testers.","vn":"Kiểm thử cộng đồng (crowd testing)","vd":"Một cách tiếp cận kiểm thử trong đó việc kiểm thử được phân bổ cho một nhóm lớn người kiểm thử.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",1],["Specialist - Mobile Application Testing 2019",0],["Specialist - Performance Testing 2018",0],["Specialist - Quality in DevOps v1.0",1]],"syn":[],"see":[]},{"s":"crud-testing","n":"CRUD testing","a":"","d":"A black-box test technique in which test conditions are operations of the types create, read, update, and delete for an entity. ","vn":"Kiểm thử CRUD (CRUD testing)","vd":"Một kỹ thuật kiểm thử hộp đen trong đó các điều kiện kiểm thử là các thao tác thuộc các loại tạo (create), đọc (read), cập nhật (update) và xóa (delete) đối với một thực thể.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",1]],"syn":[],"see":[]},{"s":"cyclomatic-complexity","n":"cyclomatic complexity","a":"","d":"The maximum number of linear, independent paths through a program.","vn":"Độ phức tạp chu trình (cyclomatic complexity)","vd":"Số lượng tối đa các đường đi tuyến tính, độc lập qua một chương trình.","t":"Quality and testing","sy":[["Advanced Technical Test Analyst v4.0",1],["Specialist - AI Testing v1.0",0],["Specialist - Security Tester 2016",0]],"syn":["cyclomatic number"],"see":[]},{"s":"dashboard","n":"dashboard","a":"","d":"A representation of dynamic measurements of operational performance for some organization or activity, using metrics represented via metaphors such as  visual dials, counters, and other devices resembling those on the dashboard of an automobile, so that the effects of events or activities can be easily understood and related to operational goals.","vn":"Bảng điều khiển (dashboard)","vd":"Một cách biểu diễn các phép đo động về hiệu quả vận hành của một tổ chức hoặc hoạt động, sử dụng các thước đo được thể hiện qua các hình ảnh ẩn dụ như đồng hồ trực quan, bộ đếm và các thiết bị khác giống như trên bảng đồng hồ của ô tô, để có thể dễ dàng hiểu tác động của các sự kiện hoặc hoạt động và liên hệ chúng với các mục tiêu vận hành.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Management v3.0",0],["Advanced Test Automation Engineering v2.0",0],["Advanced Agile Tester v2.0",0],["Expert Test Management 2011",1],["Foundation Agile Tester 2014",0],["Specialist - AI Testing v2.0",0],["Specialist - Performance Testing 2018",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Security Tester 2016",1],["Specialist - Testing with Generative AI v1.0",0]],"syn":[],"see":[]},{"s":"data-accuracy","n":"data accuracy","a":"","d":"The degree to which data correctly represents the real-world values it is intended to model.","vn":"Độ chính xác dữ liệu (data accuracy)","vd":"Mức độ mà dữ liệu biểu diễn đúng các giá trị trong thế giới thực mà nó được dùng để mô hình hóa.","t":"Quality and testing","sy":[["Specialist - AI Testing v2.0",0],["Specialist - Finance Testing v1.0",1],["Specialist - Quality in DevOps v1.0",0]],"syn":[],"see":[]},{"s":"data-consistency","n":"data consistency","a":"","d":"The degree to which data has attributes that are free from contradiction and are coherent with other data in a specific context of use.","vn":"Tính nhất quán dữ liệu (data consistency)","vd":"Mức độ mà dữ liệu có các thuộc tính không mâu thuẫn và gắn kết với các dữ liệu khác trong một bối cảnh sử dụng cụ thể.","t":"Quality and testing","sy":[["Specialist - Finance Testing v1.0",1]],"syn":[],"see":[]},{"s":"data-drift","n":"data drift","a":"","d":"A change in the distribution of input data over time that negatively impacts the ML functional performance of an operational ML model.","vn":"Trôi dữ liệu (data drift)","vd":"Sự thay đổi theo thời gian trong phân phối của dữ liệu đầu vào, gây tác động tiêu cực đến hiệu năng chức năng ML của một mô hình ML đang vận hành.","t":"Quality and testing","sy":[["Specialist - AI Testing v2.0",1]],"syn":[],"see":[]},{"s":"data-flow-analysis","n":"data flow analysis","a":"","d":"A type of static analysis based on the lifecycle of variables.","vn":"Phân tích luồng dữ liệu (data flow analysis)","vd":"Một loại phân tích tĩnh dựa trên vòng đời của các biến.","t":"Quality and testing","sy":[["Advanced Technical Test Analyst v4.0",1]],"syn":[],"see":[]},{"s":"data-obfuscation","n":"data obfuscation","a":"","d":"Data transformation that makes it difficult for a human to recognize the original data.","vn":"Làm rối dữ liệu (data obfuscation)","vd":"Phép biến đổi dữ liệu khiến con người khó nhận ra dữ liệu gốc.","t":"Quality and testing","sy":[["Specialist - Security Tester 2016",1]],"syn":[],"see":[]},{"s":"data-pipeline-testing","n":"data pipeline testing","a":"","d":"A test type that covers the training and operational data pipelines of a machine learning system.","vn":"Kiểm thử đường ống dữ liệu (data pipeline testing)","vd":"Một loại kiểm thử bao phủ các đường ống dữ liệu huấn luyện và vận hành của một hệ thống học máy.","t":"Quality and testing","sy":[["Specialist - AI Testing v2.0",1]],"syn":[],"see":[]},{"s":"data-privacy","n":"data privacy","a":"","d":"The protection of personally identifiable information or otherwise sensitive information from undesired disclosure.","vn":"Quyền riêng tư dữ liệu (data privacy)","vd":"Việc bảo vệ thông tin định danh cá nhân hoặc các thông tin nhạy cảm khác khỏi bị tiết lộ ngoài ý muốn.","t":"Quality and testing","sy":[["Specialist - Acceptance Testing 2019",0],["Specialist - AI Testing v1.0",0],["Specialist - AI Testing v2.0",0],["Specialist - Finance Testing v1.0",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Security Tester 2016",1],["Specialist - Testing with Generative AI v1.0",1]],"syn":[],"see":[]},{"s":"data-provenance-testing","n":"data provenance testing","a":"","d":"A test type to determine if data is sourced, managed, protected, and used in accordance with an organization&#039;s policies, standards, and regulatory obligations.","vn":"Kiểm thử nguồn gốc dữ liệu (data provenance testing)","vd":"Một loại kiểm thử nhằm xác định xem dữ liệu có được thu thập, quản lý, bảo vệ và sử dụng phù hợp với chính sách, tiêu chuẩn và nghĩa vụ pháp lý của tổ chức hay không.","t":"Quality and testing","sy":[["Specialist - AI Testing v2.0",0]],"syn":[],"see":[]},{"s":"data-reconciliation","n":"data reconciliation","a":"","d":"The process of comparing data from different sources to verify consistency and correctness and resolving if necessary.","vn":"Đối soát dữ liệu (data reconciliation)","vd":"Quá trình so sánh dữ liệu từ các nguồn khác nhau để xác minh tính nhất quán và tính đúng đắn, và xử lý chênh lệch nếu cần.","t":"Quality and testing","sy":[["Specialist - Finance Testing v1.0",1]],"syn":[],"see":[]},{"s":"data-representativeness-testing","n":"data representativeness testing","a":"","d":"A test type to determine if the datasets used for training an AI model are fair representa  v2.0",1]],"syn":[],"see":[]},{"s":"debugging","n":"debugging","a":"","d":"The process of finding, analyzing and removing the causes of failures in a component or system.","vn":"Gỡ lỗi (debugging)","vd":"Quá trình tìm kiếm, phân tích và loại bỏ nguyên nhân gây ra lỗi vận hành (failure) trong một thành phần hoặc hệ thống.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Test Management v3.0",0],["Advanced Test Analyst v4.0",0],["Advanced Test Automation Engineering v2.0",0],["Foundation Agile Tester 2014",0],["Specialist - AI Testing v1.0",0],["Specialist - Automotive Software Tester 2018",0],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Finance Testing v1.0",0],["Specialist - Game Testing v1.0.1",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Security Tester 2016",0],["Specialist - Testing with Generative AI v1.0",0]],"syn":[],"see":[]},{"s":"decision-coverage","n":"decision coverage","a":"","d":"The coverage of decision outcomes.","vn":"Độ bao phủ quyết định (decision coverage)","vd":"Độ bao phủ các kết quả của quyết định.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",0],["Advanced Technical Test Analyst v4.0",0],["Foundation Agile Tester 2014",0],["Specialist - AI Testing v1.0",0],["Specialist - Automotive Software Tester 2018",0]],"syn":[],"see":[]},{"s":"decision-table-testing","n":"decision table testing","a":"DTT","d":"A black-box test technique in which the test conditions are the combinations of conditions and the resulting actions shown in a decision table. ","vn":"Kiểm thử bảng quyết định (DTT)","vd":"Một kỹ thuật kiểm thử hộp đen trong đó các điều kiện kiểm thử là các tổ hợp điều kiện và các hành động tương ứng được thể hiện trong một bảng quyết định.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Agile Tester v2.0",0],["Specialist - Acceptance Testing 2019",0],["Specialist - Finance Testing v1.0",0],["Specialist - Model-Based Testing v1.1",0]],"syn":[],"see":[]},{"s":"d -valued functionality (feature) perspective. Feature-driven development is mostly used in Agile software development.","vn":"phát triển hướng tính năng (feature-driven development)","vd":"Một quy trình phát triển phần mềm lặp và tăng dần, được dẫn dắt từ góc độ các chức năng (tính năng) có giá trị đối với khách hàng. Phát triển hướng tính năng chủ yếu được sử dụng trong phát triển phần mềm Agile.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Expert Test Management 2011",1]],"syn":[],"see":[["Agile software development","agile-software-development"]]},{"s":"field-testing","n":"field testing","a":"","d":"A test level performed to evaluate the system behavior in an operational environment.","vn":"kiểm thử thực địa (field testing)","vd":"Một mức kiểm thử được thực hiện để đánh giá hành vi của hệ thống trong môi trường vận hành.","t":"Quality and testing","sy":[["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - Mobile Application Testing 2019",1]],"syn":[],"see":[]},{"s":"finding","n":"finding","a":"","d":"A result of an evaluation that identifies some important issue, problem, or opportunity.","vn":"phát hiện (finding)","vd":"Một kết quả của việc đánh giá nhằm xác định một vấn đề, sự cố hoặc cơ hội quan trọng nào đó.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Management v3.0",0],["Advanced Test Analyst v4.0",0],["Advanced Technical Test Analyst v4.0",0],["Advanced Test Automation Engineering v2.0",0],["Advanced Agile Tester v2.0",0],["Expert Test Management 2011",0],["Foundation Agile Tester 2014",0],["Advanced Agile Technical Tester 2019",0],["Specialist - Acceptance Testing 2019",0],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - AI Testing v1.0",0],["Specialist - AI Testing v2.0",0],["Specialist - Automotive Software Tester 2018",0],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Game Testing v1.0.1",0],["Specialist - Mobile Application Testing 2019",0],["Specialist - Performance Testing 2018",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Security Test Engineer v1.0",0],["Specialist - Test Automation Strategy v1.0",0],["Specialist - Testing with Generative AI v1.0",0],["Specialist - Usability Testing 2018",1]],"syn":[],"see":[]},{"s":"flexibility","n":"flexibility","a":"","d":"The degree to which a component or system can be adapted to changes in its requirements, contexts of use, or system environment.","vn":"tính linh hoạt","vd":"Mức độ mà một thành phần hoặc hệ thống có thể được điều chỉnh theo những thay đổi trong yêu cầu, bối cảnh sử dụng hoặc môi trường hệ thống.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",1],["Advanced Agile Tester v2.0",0],["Specialist - AI Testing v2.0",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Testing with Generative AI v1.0",0]],"syn":[],"see":[["portability","portability"]]},{"s":"follow-up-test-case","n":"follow-up test case","a":"","d":"A test case generated by applying a metamorphic relation to a source test case during metamorphic testing.","vn":"ca kiểm thử tiếp theo (follow-up test case)","vd":"Một ca kiểm thử được tạo ra bằng cách áp dụng một quan hệ biến hình (metamorphic relation) lên một ca kiểm thử nguồn trong quá trình kiểm thử biến hình.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",0],["Specialist - AI Testing v1.0",1],["Specialist - AI Testing v2.0",0]],"syn":[],"see":[]},{"s":"formal-review","n":"formal review","a":"","d":"A review that follows a defined process with a formally documented output.","vn":"rà soát chính thức","vd":"Một hoạt động rà soát tuân theo một quy trình đã xác định, có đầu ra được lập thành tài liệu chính thức.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Technical Test Analyst v4.0",0],["Foundation Agile Tester 2014",0]],"syn":[],"see":[]},{"s":"formal-testing","n":"formal testing","a":"","d":"A test approach that follows a defined process, is based on precise specifications, em hat meet stated and implied needs when used under specified conditions.","vn":"tính phù hợp chức năng tổng thể (functional suitability)","vd":"Mức độ mà một thành phần hoặc hệ thống cung cấp các chức năng đáp ứng nhu cầu đã nêu và nhu cầu ngầm định khi được sử dụng trong các điều kiện xác định.","t":"Quality and testing","sy":[["Advanced Test Management v3.0",0],["Advanced Test Analyst v4.0",1],["Advanced Technical Test Analyst v4.0",0],["Advanced Test Automation Engineering v2.0",0],["Expert Improving the Test Process 2011",0],["Expert Test Management 2011",0],["Foundation Agile Tester 2014",0],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - AI Testing v1.0",0],["Specialist - AI Testing v2.0",0],["Specialist - Automotive Software Tester 2018",0],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Performance Testing 2018",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Security Tester 2016",0],["Specialist - Usability Testing 2018",0]],"syn":["functionality"],"see":[["interoperability","interoperability"]]},{"s":"functional-testing","n":"functional testing","a":"","d":"A test type to determine the functional suitability of a test object.","vn":"kiểm thử chức năng","vd":"Một loại kiểm thử nhằm xác định tính phù hợp chức năng của một đối tượng kiểm thử.","t":"Quality and testing","sy":[["Advanced Technical Test Analyst v4.0",0],["Advanced Agile Tester v2.0",0],["Expert Test Management 2011",0],["Foundation Agile Tester 2014",0],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - AI Testing v2.0",0],["Specialist - Finance Testing v1.0",1],["Specialist - Gambling Industry Tester 2018",0],["Specialist - Model-Based Testing v1.1",0],["Specialist - Performance Testing 2018",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Security Tester 2016",0],["Specialist - Security Test Engineer v1.0",0]],"syn":[],"see":[]},{"s":"fuzz-testing","n":"fuzz testing","a":"","d":"A test technique in which high volumes of random data are used to generate test inputs.","vn":"kiểm thử fuzz (fuzz testing)","vd":"Một kỹ thuật kiểm thử trong đó một lượng lớn dữ liệu ngẫu nhiên được sử dụng để tạo ra các đầu vào kiểm thử.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",0],["Specialist - AI Testing v2.0",0],["Specialist - Security Test Engineer v1.0",1]],"syn":["fuzzing"],"see":[["vulnerability","vulnerability"]]},{"s":"generic-test-automation-architecture","n":"generic test automation architecture","a":"gTAA","d":"A representation of the layers, components, and interfaces that allows for a structured and modular approach to implement test automation. ","vn":"kiến trúc tự động hóa kiểm thử tổng quát (gTAA)","vd":"Một biểu diễn các lớp, thành phần và giao diện cho phép áp dụng cách tiếp cận có cấu trúc và mô-đun hóa để triển khai tự động hóa kiểm thử.","t":"Quality and testing","sy":[["Advanced Test Automation Engineering v2.0",1]],"syn":[],"see":[]},{"s":"graphical-user-interface","n":"graphical user interface","a":"GUI","d":"A type of interface that allows users to interact with a component or system through graphical icons and visual indicators.","vn":"giao diện người dùng đồ họa (GUI)","vd":"Một loại giao diện cho phép người dùng tương tác với một thành phần hoặc hệ thống thông qua các biểu tượng đồ họa và các chỉ báo trực quan.","t":"Quality and testing","sy":[["Advanced Technical Test Analyst v4.0",0],["Specialist - AI Testing v1.0",0],["Specialist - Model-Based Testing v1.1",0],["Specialist - Performance Testing 2018",0],["Specialist - Security Tester 2016",0]],"syn":[],"see":[]},{"s":"grey-box-testing","n":"grey-box testing","a":"","d":"A test approach that combines elements of black-box testing and white-box testing.","vn":"kiểm thử hộp xám (grey-box testing)","vd":"Một cách tiếp cận kiểm thử kết hợp các yếu tố của kiểm thử hộp đen và kiểm thử hộp trắng.","t":"Quality and testing","sy":[["Specialist - Security Test Engineer v1.0",0]],"syn":[],"see":[]},{"s":"gui-testing","n":"GUI testing","a":"","d":"A test approach performed by interacting with a test object using a graphical user interface. ","vn":"kiểm thử GUI","vd":"Một cách tiếp cận kiểm thử được thực hiện bằng cách tương tác với đối tượng kiểm thử thông qua giao diện người dùng đồ họa.","t":"Quality and testing","sy":[["Advanced Test Automation Engineering v2.0",1],["Specialist - Quality in DevOps v1.0",0]],"syn":[],"see":[]},{"s":"hacker","n":"hacker","a":"","d":"A person or organization who is actively involved in security attacks, usually with malicious intent.","vn":"tin tặc (hacker)","vd":"Một cá nhân hoặc tổ chức tích cực tham gia vào các cuộc tấn công bảo mật, thường với ý đồ xấu.","t":"Quality and testing","sy":[["Specialist - Security Tester 2016",1],["Specialist - Security Test Engineer v1.0",0]],"syn":[],"see":[["attacker","attacker"],["script kiddie","script-kiddie"]]},{"s":"hardware-in-the-loop","n":"hardware-in-the-loop","a":"HiL","d":"A virtual test environment in which real hardware with integrated software is tested. ","vn":"phần cứng trong vòng lặp (HiL)","vd":"Một môi trường kiểm thử ảo trong đó phần cứng thực có tích hợp phần mềm được kiểm thử.","t":"Quality and testing","sy":[["Specialist - Automotive Software Tester v2.1",1]],"syn":[],"see":[]},{"s":"hashing","n":"hashing","a":"","d":"Transformation of a variable length string of characters into a usually shorter fixed-length value or key. Hashed values, or hashes, are commonly used in table or database lookups. Cryptographic hash functions are used to secure data.","vn":"băm (hashing)","vd":"Việc biến đổi một chuỗi ký tự có độ dài thay đổi thành một giá trị hoặc khóa có độ dài cố định, thường ngắn hơn. Các giá trị băm (hash) thường được sử dụng trong tra cứu bảng hoặc cơ sở dữ liệu. Các hàm băm mật mã được sử dụng để bảo vệ dữ liệu.","t":"Quality and testing","sy":[["Specialist - Security Tester 2016",1]],"syn":[],"see":[["salting","salting"]]},{"s":"heuristic","n":"heuristic","a":"","d":"A generally recognized rule of thumb that helps to achieve a goal.","vn":"phương pháp kinh nghiệm (heuristic)","vd":"Một quy tắc kinh nghiệm được thừa nhận rộng rãi giúp đạt được một mục tiêu.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Analyst v4.0",0],["Advanced Agile Tester v2.0",0],["Expert Test Management 2011",0],["Foundation Agile Tester 2014",0],["Advanced Agile Technical Tester 2019",0],["Specialist - Acceptance Testing 2019",0],["Specialist - AI Testing v1.0",0],["Specialist - Mobile Application Testing 2019",1],["Specialist - Model-Based Testing v1.1",0],["Specialist - Security Tester 2016",0],["Specialist - Usability Testing 2018",1]],"syn":[],"see":[]},{"s":"heuristic-evaluation","n":"heuristic evaluation","a":"","d":"A usability review technique that evaluates a work product by using a set of heuristics.","vn":"đánh giá theo heuristic","vd":"Một kỹ thuật rà soát khả năng sử dụng nhằm đánh giá một sản phẩm công việc bằng cách sử dụng một tập hợp các heuristic.","t":"Quality and testing","sy":[["Specialist - Usability Testing 2018",0]],"syn":[],"see":[]},{"s":"high-level-test-case","n":"high-level test case","a":"","d":"A test case with abstract preconditions, input data, expected results, postconditions, and actions (where applicable).","vn":"ca kiểm thử mức cao (high-level test case)","vd":"Một ca kiểm thử với các điều kiện tiên quyết, dữ liệu đầu vào, kết quả mong đợi, điều kiện sau và các hành động (nếu có) ở dạng trừu tượng.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",1],["Specialist - Model-Based Testing v1.1",0]],"syn":["logical test case","abstract test case"],"see":[["low-level test case","low-level-test-case"]]},{"s":"holistic-testing","n":"holistic testing","a":"","d":"A collaborative approach to quality assurance through system-wide continuous testing, learning and improvement.","vn":"kiểm thử tổng thể (holistic testing)","vd":"Một cách tiếp cận cộng tác đối với đảm bảo chất lượng thông qua kiểm thử,  Scale v2.0",1],["Specialist - AI Testing v2.0",0]],"syn":[],"see":[]},{"s":"impact-analysis","n":"impact analysis","a":"","d":"The identification of all work products affected by a change, including an estimate of the resources needed to accomplish the change.","vn":"phân tích tác động","vd":"Việc xác định tất cả các sản phẩm công việc bị ảnh hưởng bởi một thay đổi, bao gồm cả ước tính nguồn lực cần thiết để thực hiện thay đổi đó.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Analyst v4.0",1],["Advanced Test Automation Engineering v2.0",0],["Expert Test Management 2011",0],["Advanced Agile Technical Tester 2019",0],["Specialist - Acceptance Testing 2019",0],["Specialist - AI Testing v2.0",0],["Specialist - Automotive Software Tester 2018",0],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Finance Testing v1.0",0],["Specialist - Model-Based Testing v1.1",0],["Specialist - Testing with Generative AI v1.0",0]],"syn":[],"see":[]},{"s":"incremental-development-model","n":"incremental development model","a":"","d":"A type of software development lifecycle model in which the component or system is developed through a series of increments.","vn":"mô hình phát triển tăng dần","vd":"Một loại mô hình vòng đời phát triển phần mềm trong đó thành phần hoặc hệ thống được phát triển thông qua một chuỗi các phần tăng dần (increment).","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Management v3.0",1],["Advanced Test Analyst v4.0",0],["Specialist - Performance Testing 2018",0],["Specialist - Security Test Engineer v1.0",0]],"syn":[],"see":[]},{"s":"independence-of-testing","n":"independence of testing","a":"","d":"The separation of testing responsibilities from development for a test object.","vn":"tính độc lập của kiểm thử","vd":"Sự tách biệt trách nhiệm kiểm thử khỏi trách nhiệm phát triển đối với một đối tượng kiểm thử.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Analyst v4.0",0],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - AI Testing v1.0",0],["Specialist - AI Testing v2.0",0]],"syn":[],"see":[]},{"s":"independent-test-lab","n":"independent test lab","a":"ITL","d":"An organization responsible to test and certify that the software, hardware, firmware, platform, and operating system follow all jurisdictional rules for each location where a component or system will be used.","vn":"phòng kiểm thử độc lập (ITL)","vd":"Một tổ chức chịu trách nhiệm kiểm thử và chứng nhận rằng phần mềm, phần cứng, firmware, nền tảng và hệ điều hành tuân thủ mọi quy định pháp lý tại từng địa điểm nơi một thành phần hoặc hệ thống sẽ được sử dụng.","t":"Quality and testing","sy":[["Specialist - Gambling Industry Tester 2018",1]],"syn":[],"see":[]},{"s":"informal-review","n":"informal review","a":"","d":"A type of review that does not follow a defined process and has no formally documented output.","vn":"rà soát không chính thức","vd":"Một loại rà soát không tuân theo quy trình đã xác định và không có đầu ra được lập thành tài liệu chính thức.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Test Analyst v4.0",0],["Foundation Agile Tester 2014",0]],"syn":[],"see":[]},{"s":"information-assurance","n":"information assurance","a":"","d":"Measures that protect and defend information and information systems by ensuring their availability, integrity, authentication, confidentiality, and non-repudiation. These measures include providing for restoration of information systems by incorporating protection, detection, and reaction capabilities.","vn":"đảm bảo thông tin (information assurance)","vd":"Các biện pháp bảo vệ và phòng thủ thông tin và hệ thống thông tin bằng cách đảm bảo tính sẵn sàng, tính toàn vẹn, xác thực, tính bảo mật và tính chống chối bỏ. Các biện pháp này bao gồm cả việc khôi phục hệ thống thông tin bằng cách tích hợp các năng lực bảo vệ, phát hiện và phản ứng.","t":"Quality and testing","sy":[["Specialist - Security Tester 2016",1]],"syn":[],"see":[]},{"s":"information-security","n":"information security","a":"","d":"The protection of information and information systems from unauthorized access, use, disclosure, disruption, modification, or destruction.","vn":"an toàn thông tin","vd":"Việc bảo vệ thông tin và hệ thống thông tin khỏi sự truy cập, sử dụng, tiết lộ, gián đoạn, sửa đổi hoặc phá hủy trái phép.","t":"Quality and testing","sy":[["Specialist - Acceptance Testing 2019",0],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Finance Testing v1.0",0],["Specialist - Security Tester 2016",1],["Specialist - Security Test Engineer v1.0",0],["Specialist - Testing with Generative AI v1.0",0]],"syn":[],"see":[]},{"s":"input-data-testing","n":"input data testing","a":"","d":"A test level that focuses on the quality of data used for training an ML model.","vn":"kiểm thử dữ liệu đầu vào","vd":"Một mức kiểm thử tập trung vào chất lượng của dữ liệu được sử dụng để huấn luyện mô hình ML.","t":"Quality and testing","sy":[["Specialist - AI Testing v1.0",1],["Specialist - AI Testing v2.0",1]],"syn":[],"see":[]},{"s":"insider-threat","n":"insider threat","a":"","d":"A security threat originating from within the organization, often by an authorized system user.","vn":"mối đe dọa nội bộ","vd":"Một mối đe dọa bảo mật xuất phát từ bên trong tổ chức, thường do một người dùng hệ thống được ủy quyền gây ra.","t":"Quality and testing","sy":[["Specialist - Security Tester 2016",1]],"syn":[],"see":[]},{"s":"inspection","n":"inspection","a":"","d":"A type of formal review that uses defined team roles and measurement to identify defects in a work product, and improve the review process and the software development process. ","vn":"thanh tra (inspection)","vd":"Một loại rà soát chính thức sử dụng các vai trò nhóm đã xác định và phép đo lường để xác định khiếm khuyết trong một sản phẩm công việc, đồng thời cải thiện quy trình rà soát và quy trình phát triển phần mềm.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Test Analyst v4.0",0],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - AI Testing v2.0",0],["Specialist - Finance Testing v1.0",0]],"syn":[],"see":[["peer review","peer-review"]]},{"s":"installability","n":"installability","a":"","d":"The degree to which a component or system can be successfully installed and/or uninstalled in a specified environment.","vn":"khả năng cài đặt","vd":"Mức độ mà một thành phần hoặc hệ thống có thể được cài đặt và/hoặc gỡ cài đặt thành công trong một môi trường xác định.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",1],["Advanced Technical Test Analyst v4.0",1],["Specialist - Acceptance Testing 2019",0],["Specialist - AI Testing v1.0",0],["Specialist - AI Testing v2.0",0],["Specialist - Mobile Application Testing 2019",1]],"syn":[],"see":[["portability","portability"]]},{"s":"integration-testing","n":"integration testing","a":"","d":"A test level that focuses on interactions between components or systems.","vn":"kiểm thử tích hợp","vd":"Một mức kiểm thử tập trung vào sự tương tác giữa các thành phần hoặc hệ thống.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Test Management v3.0",0],["Advanced Test Analyst v4.0",0],["Advanced Test Automation Engineering v2.0",0],["Advanced Agile Tester v2.0",0],["Expert Improving the Test Process 2011",0],["Expert Test Management 2011",0],["Foundation Agile Tester 2014",0],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - AI Testing v1.0",0],["Specialist - Game Testing v1.0.1",0],["Specialist - Mobile Application Testing 2019",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Security Tester 2016",0]],"syn":[],"see":[]},{"s":"integrity","n":"integrity","a":"","d":"The degree to which only authorized access and modification is allowed to a component, a system or data.","vn":"tính toàn vẹn","vd":"Mức độ mà chỉ những truy cập và sửa đổi được ủy quyền mới được phép thực hiện đối với một thành phần, hệ thống hoặc dữ liệu.","t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Management v3.0",0],["Advanced Test Analyst v4.0",0],["Advanced Technical Test Analyst v4.0",1],["Specialist - AI Testing v2.0",0],["Specialist - Automotive Software Tester 2018",0],["Specialist - Automotive Software Tester v2.1",0],["Specialist - Finance Testing v1.0",0],["Specialist - Game Testing v1.0.1",0],["Specialist - Quality in DevOps v1.0",0],["Specialist - Security Tester 2016",0],["Specialist - Security Test Engineer v1.0",1],["Specialist - Test Automation Strategy v1.0",0]],"syn":[],"see":[]},{"s":"interaction-capability","n":"interaction capability","a":"","d":"The degree to which a component or system can exchange information via the user interface with its specified users to complete an intended task.","vn":"khả năng tương tác người dùng (interaction capability)","vd":"Mức độ mà một thành phần hoặc hệ thống có thể trao đổi thông tin qua giao diện người dùng với những người dùng đã xác định để hoàn thành một nhiệm vụ dự định.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",1],["Specialist - AI Testing v2.0",0]],"syn":[],"see":[["usability","usability"]]},{"s":"interactive-application-security-testing","n":"interactive application security testing","a":"IAST","d":"A test approach that analyzes the code executed and pinpoints where a vulnerability exists by combining dynamic application security testing with static application security testing","vn":"kiểm thử bảo mật ứng dụng tương tác (IAST)","vd":"Một cách tiếp cận kiểm thử phân tích mã được thực thi và chỉ ra chính xác vị trí tồn tại lỗ hổng bằng cách kết hợp kiểm thử bảo mật ứng dụng động với kiểm thử bảo mật ứng dụng tĩnh.","t":"Quality and testing","sy":[["Specialist - Security Test Engineer v1.0",1]],"syn":[],"see":[["dynamic application security testing","dynamic-application-security-testing"],["static application security testing","static-application-security-testing"]]},{"s": ak","n":"memory leak","a":"","d":"A memory access failure due to a defect in a program's dynamic store allocation logic that causes it to fail to release memory after it has finished using it.","vn":"rò rỉ bộ nhớ (memory leak)","vd":"Một thất bại truy cập bộ nhớ do khiếm khuyết trong logic cấp phát bộ nhớ động của chương trình, khiến chương trình không giải phóng bộ nhớ sau khi đã sử dụng xong.","t":"Quality and testing","sy":[["Advanced Technical Test Analyst v4.0",1],["Advanced Test Automation Engineering v2.0",0],["Specialist - Finance Testing v1.0",0],["Specialist - Gambling Industry Tester 2018",0],["Specialist - Performance Testing 2018",0],["Specialist - Security Test Engineer v1.0",0]],"syn":[],"see":[]},{"s":"metamorphic-relation","n":"metamorphic relation","a":"MR","d":"A description of how a change to an input for a test case affects an expected result based on the required behavior of a test item.","vn":"quan hệ biến hình (MR)","vd":"Một mô tả về cách thay đổi đầu vào của một ca kiểm thử ảnh hưởng đến kết quả mong đợi, dựa trên hành vi yêu cầu của hạng mục kiểm thử.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",1],["Specialist - AI Testing v1.0",1],["Specialist - AI Testing v2.0",0]],"syn":[],"see":[]},{"s":"metamorphic-testing","n":"metamorphic testing","a":"MT","d":"A test technique in which test conditions are metamorphic relations.","vn":"kiểm thử biến hình (MT)","vd":"Một kỹ thuật kiểm thử trong đó các điều kiện kiểm thử là các quan hệ biến hình.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",1],["Specialist - AI Testing v2.0",1]],"syn":[],"see":[["property-based testing","property-based-testing"]]},{"s":"method-table","n":"method table","a":"","d":"A table containing different test approaches, test techniques and test types that are required depending on the automotive safety integrity level and on the context of a test object.","vn":"bảng phương pháp (method table)","vd":"Một bảng chứa các cách tiếp cận kiểm thử, k rics","n":"ML functional performance metric","a":"","d":"A measure that relates to the functional correctness of an ML model.","vn":"chỉ số hiệu năng chức năng ML","vd":"Một thước đo liên quan đến tính đúng đắn chức năng của một mô hình ML.","t":"Quality and testing","sy":[["Specialist - AI Testing v1.0",1],["Specialist - AI Testing v2.0",1]],"syn":[],"see":[]},{"s":"ml-model","n":"ML model","a":"","d":"An implementation of machine learning that generates a prediction, classification or recommendation based on input data.","vn":"mô hình ML","vd":"Một sự triển khai học máy tạo ra dự đoán, phân loại hoặc khuyến nghị dựa trên dữ liệu đầu vào.","t":"Quality and testing","sy":[["Specialist - AI Testing v1.0",1],["Specialist - AI Testing v2.0",1]],"syn":[],"see":[]},{"s":"ml-model-testing","n":"ML model testing","a":"","d":"A test level that focuses on the ability of an ML model to meet required ML functional performance criteria and non-functional criteria.","vn":"kiểm thử mô hình ML","vd":"Một mức kiểm thử tập trung vào khả năng của một mô hình ML trong việc đáp ứng các tiêu chí hiệu năng chức năng ML và các tiêu chí phi chức năng được yêu cầu.","t":"Quality and testing","sy":[["Specialist - AI Testing v1.0",1],["Specialist - AI Testing v2.0",1]],"syn":[],"see":[]},{"s":"mob-testing","n":"mob testing","a":"","d":"A test approach in which a small group tests the same system together at the same time using a single user interface and computer, followed by a retrospective. ","vn":"kiểm thử nhóm (mob testing)","vd":"Một cách tiếp cận kiểm thử trong đó một nhóm nhỏ cùng kiểm thử một hệ thống tại cùng một thời điểm, sử dụng một giao diện người dùng và một máy tính duy nhất, sau đó tổ chức buổi nhìn lại (retrospective).","t":"Quality and testing","sy":[["Advanced Agile Tester v2.0",1]],"syn":[],"see":[]},{"s":"mock","n":"mock","a":"","d":"A type of test double that simulates the expected behavior of the component during testing.","vn":"mock","vd":"Một loại test double mô phỏng ,"t":"Quality and testing","sy":[["Foundation v4.0",0],["Advanced Test Management v3.0",1],["Advanced Agile Tester v2.0",0],["Specialist - Agile Test Leadership at Scale v2.0",0],["Specialist - Performance Testing 2018",0],["Specialist - Quality in DevOps v1.0",0]],"syn":[],"see":[]},{"s":"raci-matrix","n":"RACI matrix","a":"","d":"A matrix describing the participation by various roles in completing tasks or deliverables for a project or process. It is especially useful in clarifying roles and responsibilities.  RACI is an acronym derived from the four key responsibilities most typically used:  Responsible, Accountable, Consulted, and Informed.","vn":"ma trận RACI (RACI matrix)","vd":"Một ma trận mô tả sự tham gia của các vai trò khác nhau trong việc hoàn thành các nhiệm vụ hoặc sản phẩm bàn giao của một dự án hoặc quy trình. Ma trận này đặc biệt hữu ích trong việc làm rõ vai trò và trách nhiệm. RACI là từ viết tắt của bốn trách nhiệm chính thường được sử dụng nhất: Responsible (Thực hiện), Accountable (Chịu trách nhiệm giải trình), Consulted (Được tham vấn) và Informed (Được thông báo).","t":"Quality and testing","sy":[["Expert Test Management 2011",1]],"syn":[],"see":[]},{"s":"ramp-down","n":"ramp-down","a":"","d":"A technique for decreasing the load on a system in a measurable and controlled way.","vn":"giảm tải dần (ramp-down)","vd":"Một kỹ thuật giảm tải trên hệ thống theo cách có thể đo lường và kiểm soát được.","t":"Quality and testing","sy":[["Specialist - Performance Testing 2018",1]],"syn":[],"see":[]},{"s":"ramp-up","n":"ramp-up","a":"","d":"A technique for increasing the load on a system in a measurable and controlled way.","vn":"tăng tải dần (ramp-up)","vd":"Một kỹ thuật tăng tải trên hệ thống theo cách có thể đo lường và kiểm soát được.","t":"Quality and testing","sy":[["Specialist - Performance Testing 2018",1]],"syn":[],"see":[]},{"s":"random-testing","n":"random testing","a":"","d":"A black-box test technique in which input values are randomly generated. ","vn":"kiểm thử ngẫu nhiên (random testing)","vd":"Một kỹ thuật kiểm thử hộp đen trong đó các giá trị đầu vào được sinh ngẫu nhiên.","t":"Quality and testing","sy":[["Advanced Test Analyst v4.0",1]],"syn":[],"see":[]},{"s":"reactive-test-strategy","n":"reactive test strategy","a":"","d":"A test strategy whereby the test team waits to design and implement tests until the software is received, reacting to the actual system under test.","vn":"chiến lược kiểm thử phản ứng (reactive test strategy)","vd":"Một chiến lược kiểm thử trong đó nhóm kiểm thử chờ đến khi nhận được phần mềm mới thiết kế và triển khai các kiểm thử, phản ứng theo hệ thống thực tế đang được kiểm thử.","t":"Quality and testing","sy":[["Expert Test Management 2011",1]],"syn":[],"see":[]},{"s":"reactive-testing","n":"reactive testing","a":"","d":"A test approach that dynamically responds to the behavior of a test object and to test results being obtained.","vn":"kiểm thử phản ứng (reactive testing)","vd":"Một cách tiếp cận kiểm thử phản hồi một cách linh hoạt theo hành vi của đối tượng kiểm thử và theo các kết quả kiểm thử đang thu được.","t":"Quality and testing","sy":[["Expert Test Management 2011",0],["Foundation Agile Tester 2014",0],["Advanced Agile Technical Tester 2019",0]],"syn":[],"see":[]},{"s":"reconnaissance","n":"reconnaissance","a":"","d":"The exploration of a target area aiming to gain information that can be useful for an attack.","vn":"trinh sát (reconnaissance)","vd":"Việc thăm dò một khu vực mục tiêu nhằm thu thập thông tin có thể hữu ích cho một cuộc tấn công.","t":"Quality and testing","sy":[["Specialist - Security Tester 2016",1],["Specialist - Security Test Engineer v1.0",0]],"syn":["footprinting"],"see":[]},{"s":"recoverability","n":"recoverability","a":"","d":"The degree to which a component or system can recover the data directly affected by an interruption or a failure and re-establish the desired state of the component or system.","vn":"khả năng phục hồi (recoverability)","vd":"Mức độ mà một thành phần hoặc hệ thống có thể khôi phục dữ liệu bị ảnh hưởng trực tiếp bởi một sự gián đoạn hoặc sự cố, và thiết lập lại trạng thái mong muốn của thành phần hoặc hệ thống.","t":"Quality and testing","sy":[["Advanced Technical Test Analyst v4.0",1],["Advanced Test Automation Engineering v2.0",0],["Specialist - Acceptance Testing 2019",0]],"syn":[],"see":[["reliability","reliability"]]},{"s":"red-teaming","n":"red teaming","a":"","d":"A test approach that involves attacking a system to deliberately cause it to produce harmful or undesirable results.","vn":"đội đỏ (red teaming)","vd":"Một cách tiếp cận kiểm thử bao gồm việc tấn công một hệ thống để cố ý khiến nó tạo ra các kết quả có hại hoặc không mong muốn.","t":"Quality and testing","sy":[["Specialist - AI Testing v2.0",0]],"syn":[],"see":[]},{"s":"regression-testing","n":"regression testing","a":"","d":"A type of change-related testing to detect whether defects have been introduced or uncovered in unchanged areas of the software.","vn":"kiểm thử hồi quy (regression testing)","vd":"Một loại kiểm thử liên quan đến thay đổi nhằm phát hiện xem có lỗi nào đã được đưa vào hoặc bị lộ ra ở những phần không thay đổi của phần mềm hay không.","t":"Quality and testing","sy":[["Foundation v4.0",1],["Advanced Test Management v3.0",0],["Advanced Test Analyst v4.0",1],["Advanced Test Automation Engineering v2.0",0],["Advanced Agile Tester v2.0",1],["Expert Test Management 2011",0],["Specialist - AI Testing v1.0",0],["Specialist - AI Testing v2.0",0],["Specialist - Finance Testing v1.0",0],["Specialist - Gambling Industry Tester 2018",0],["Specialist - Game Testing v1.0.1",0],["Specialist - Model-Based Testing v1.1",0],["Specialist - Performance Testing 2018",0],["Specialist - Quality in DevOps v1.0",1],["Specialist - Security Tester 2016",0],["Specialist - Security Test Engineer v1.0",0],["Specialist - Test Automation Strategy v1.0",0],["Specialist - Testing with Generative AI v1.0",0]],"syn":[],"see":[]}
